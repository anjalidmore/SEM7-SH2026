<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semester 7 · End Sem</title>
<meta name="description" content="Semester VII End Sem study dashboard: timetable, progress and study plan for all five subjects.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171a21'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='16' fill='white' text-anchor='middle'%3E7%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f7f9; --panel:#ffffff; --panel-2:#eef1f5;
  --ink:#161b24; --ink-soft:#4c5566; --ink-mute:#6f7890;
  --border:#dce1e9; --border-2:#c3cbd8;
  --track:#e6eaf0; --focus:#1f5f8b; --warn:#8a5d06;
  --radius:12px;
  --mix:0%;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1217; --panel:#171b22; --panel-2:#1e232c;
  --ink:#e7eaf0; --ink-soft:#b0b8c6; --ink-mute:#8790a1;
  --border:#2a303b; --border-2:#3a4250;
  --track:#262c36; --focus:#8fb4ff; --warn:#e0af57;
  --mix:45%;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1217; --panel:#171b22; --panel-2:#1e232c;
    --ink:#e7eaf0; --ink-soft:#b0b8c6; --ink-mute:#8790a1;
    --border:#2a303b; --border-2:#3a4250;
    --track:#262c36; --focus:#8fb4ff; --warn:#e0af57;
    --mix:45%;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow-x:clip}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
h1,h2,h3{margin:0; font-weight:650; letter-spacing:-.01em}
.wrap{max-width:1080px; margin:0 auto; padding:0 16px}
.acc{--acc:#1f5f8b; --acc-ui:color-mix(in srgb, var(--acc), #fff var(--mix));
  --acc-soft:color-mix(in srgb, var(--acc-ui) 11%, var(--panel))}
.s7-i{width:18px; height:18px; flex:none; display:block}

/* header */
.top{background:var(--panel); border-bottom:1px solid var(--border)}
.top .wrap{display:flex; align-items:center; gap:12px; min-height:64px}
.logo{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:10px;
  background:var(--ink); color:var(--bg); font-weight:750; font-size:1.05rem}
h1{font-size:1.15rem}
.iconbtn{margin-left:auto; display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px;
  border:1px solid var(--border); border-radius:10px; background:var(--panel); color:var(--ink-soft); cursor:pointer}
.iconbtn:hover{border-color:var(--border-2); color:var(--ink)}
.iconbtn svg{width:17px; height:17px}

main{padding:24px 0 40px}
section{margin-bottom:28px}
h2{display:flex; align-items:center; gap:9px; font-size:1.02rem; margin-bottom:12px}
h2 .s7-i{color:var(--ink-mute)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:38px; padding:0 15px;
  border-radius:9px; border:1px solid var(--border-2); background:var(--panel); color:var(--ink);
  text-decoration:none; font-size:.87rem; font-weight:600; white-space:nowrap}
.btn:hover{border-color:var(--acc-ui, var(--ink-mute))}
.btn .s7-i{width:16px; height:16px}
.btn.primary{background:var(--acc-ui); border-color:var(--acc-ui); color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
:root[data-theme="dark"] .btn.primary{color:#0f1217}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn.primary{color:#0f1217} }

/* icon tiles */
.ico{display:inline-flex; align-items:center; justify-content:center; flex:none; width:38px; height:38px;
  border-radius:10px; background:var(--acc-soft, var(--panel-2)); color:var(--acc-ui, var(--ink-soft))}
.ico.lg{width:52px; height:52px; border-radius:14px}
.ico.lg .s7-i{width:26px; height:26px}

/* next paper */
.hero{display:flex; align-items:center; gap:16px 18px; flex-wrap:wrap; background:var(--panel);
  border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; position:relative; overflow:hidden}
.hero::before{content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--acc-ui)}
.hero .what{flex:1 1 260px; min-width:0}
.hero .k{font-size:.8rem; font-weight:600; color:var(--acc-ui)}
.hero .t{font-size:1.25rem; font-weight:680; margin-top:1px; letter-spacing:-.015em}
.hero .d{font-size:.86rem; color:var(--ink-soft); margin-top:3px; overflow-wrap:anywhere}
.hero .count{text-align:center; padding:0 6px}
.hero .count b{display:block; font-size:2rem; line-height:1; font-weight:720; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.hero .count span{font-size:.76rem; color:var(--ink-mute); font-weight:550}

/* stats */
.stats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px}
.stat{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); padding:14px 16px; min-width:0}
.stat .v{font-size:1.35rem; font-weight:700; line-height:1.15; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.stat .l{font-size:.8rem; color:var(--ink-mute); font-weight:550}
.stat .l b{color:var(--ink-soft); font-weight:600}

/* subject cards */
.subs{list-style:none; margin:0; padding:0; display:grid; gap:12px;
  grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr))}
.card{display:flex; flex-direction:column; gap:12px; background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px; min-width:0}
.card.done{opacity:.65}
.card .hd{display:flex; align-items:center; gap:12px}
.card .nm{flex:1; min-width:0}
.card h3{font-size:.98rem; line-height:1.3}
.card h3 a{text-decoration:none}
.card h3 a:hover{text-decoration:underline; text-underline-offset:3px}
.card .dt{font-size:.78rem; color:var(--ink-mute); margin-top:1px}
.days{flex:none; font-size:.78rem; font-weight:650; padding:4px 9px; border-radius:999px;
  background:var(--panel-2); color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums}
.days.soon{background:var(--acc-soft); color:var(--acc-ui)}
.pct{display:flex; align-items:center; gap:10px}
.pct b{font-size:1.4rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.01em; min-width:3ch}
.pct .bar{flex:1}
.bar{height:6px; border-radius:99px; background:var(--track); overflow:hidden}
.bar i{display:block; height:100%; background:var(--acc-ui, var(--ink-soft)); border-radius:99px}
.mods{display:flex; align-items:center; gap:10px; font-size:.78rem; color:var(--ink-mute)}
.pips{display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; flex:1}
.pip{height:6px; border-radius:3px; background:var(--track); overflow:hidden}
.pip i{display:block; height:100%; background:var(--acc-ui)}
.pip.pending{background:none; border:1px dashed var(--border-2); height:6px}
.mods .ready{white-space:nowrap; font-variant-numeric:tabular-nums}
.nexttopic{display:flex; gap:8px; align-items:flex-start; font-size:.84rem; color:var(--ink-soft); min-width:0}
.nexttopic .s7-i{width:15px; height:15px; margin-top:2px; color:var(--ink-mute)}
.nexttopic span{min-width:0; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.card .acts{display:flex; gap:8px; margin-top:auto}
.card .acts .btn{flex:1}

/* sessions + timetable */
.two{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:24px; align-items:start}
.two section{margin-bottom:0}
.list{list-style:none; margin:0; padding:0; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius)}
.list li{display:flex; align-items:center; gap:14px; padding:10px 16px; min-height:52px}
.list li + li{border-top:1px solid var(--border)}
.day{width:78px; flex:none; font-size:.8rem; color:var(--ink-mute); font-variant-numeric:tabular-nums; line-height:1.3}
.day b{display:block; color:var(--ink); font-size:.86rem; font-weight:620}
.slots{display:flex; flex-wrap:wrap; gap:6px; min-width:0}
.chip{display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 7px; border-radius:999px; font-size:.8rem;
  font-weight:600; text-decoration:none; background:var(--acc-soft); color:var(--acc-ui); white-space:nowrap}
.chip .s7-i{width:14px; height:14px}
.chip:hover{filter:brightness(.97)}
.chip.paper{background:var(--acc-ui); color:#fff}
:root[data-theme="dark"] .chip.paper{color:#0f1217}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .chip.paper{color:#0f1217} }
.tt .s{flex:1; min-width:0; display:flex; align-items:center; gap:10px; font-size:.9rem; font-weight:600}
.tt .s a{text-decoration:none; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tt .s a:hover{text-decoration:underline; text-underline-offset:3px}
.tt .ico{width:30px; height:30px; border-radius:8px}
.tt .ico .s7-i{width:16px; height:16px}
.tt .c{font-size:.82rem; color:var(--ink-mute); white-space:nowrap; font-variant-numeric:tabular-nums}
.tt li.next .c{color:var(--acc-ui); font-weight:650}
.tt li.done{opacity:.55}

footer{margin-top:32px; font-size:.8rem; color:var(--ink-mute)}

@media (max-width:860px){
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .stats{grid-template-columns:minmax(0,1fr)}
  .stat{padding:12px 14px}
  .hero{padding:16px}
  .hero .count{display:flex; align-items:baseline; gap:6px; text-align:left; padding:0; flex:1 1 100%}
  .hero .count b{font-size:1.5rem}
  .hero .acts{flex:1 1 100%}
  .hero .acts .btn{width:100%}
  .list li{padding:10px 14px; gap:12px}
  .day{width:64px}
}
@media print{ .iconbtn, .acts{display:none} .card, .list{break-inside:avoid} }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <span class="logo" aria-hidden="true">7</span>
    <h1>Semester 7 &middot; End Sems</h1>
    <button class="iconbtn" id="theme" type="button" aria-label="Theme"></button>
  </div>
</header>

<main>
  <div class="wrap">
    <section aria-label="Next paper"><div id="hero"></div></section>
    <section aria-label="Overview"><div class="stats" id="stats"></div></section>

    <section aria-labelledby="subs-h">
      <h2 id="subs-h"></h2>
      <ul class="subs" id="subs"></ul>
    </section>

    <div class="two">
      <section aria-labelledby="plan-h">
        <h2 id="plan-h"></h2>
        <ol class="list" id="plan"></ol>
      </section>
      <section aria-labelledby="tt-h">
        <h2 id="tt-h"></h2>
        <ol class="list tt" id="tt"></ol>
      </section>
    </div>

    <footer><p id="nojs">This page needs <code>shared/sem7.js</code> next to it.</p>
      <p>Progress lives in this browser. Each subject has Export / Import in its settings.</p></footer>
  </div>
</main>

<script src="shared/sem7.js"></script>
<script src="shared/syllabus.js"></script>
<script>
(function(){
  "use strict";
  if(!window.SEM7) return;
  document.getElementById("nojs").remove();

  var S = window.SEM7, I = S.icon;
  var THEME_KEY = "sem7.theme";
  var PLAN_DAYS = 7;

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function plural(n, w){ return n + " " + w + (n === 1 ? "" : "s"); }
  function bar(pct, label){
    return '<div class="bar" role="progressbar" aria-label="' + esc(label) + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>';
  }
  function accStyle(s){ return ' style="--acc:' + s.accent + '"'; }

  document.getElementById("subs-h").innerHTML = I("layers") + "Subjects";
  document.getElementById("plan-h").innerHTML = I("clock") + "Study sessions";
  document.getElementById("tt-h").innerHTML = I("calendar") + "Timetable";

  /* ---------- theme: system -> light -> dark ---------- */
  var ICONS = {
    system:'<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>',
    light:'<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    dark:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>'
  };
  var LABEL = {system:"Match system", light:"Light", dark:"Dark"};
  function applyTheme(t){
    if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else { t = "system"; document.documentElement.removeAttribute("data-theme"); }
    var b = document.getElementById("theme");
    b.innerHTML = ICONS[t];
    b.setAttribute("aria-label", "Theme: " + LABEL[t]);
    b.title = "Theme: " + LABEL[t];
    b.dataset.theme = t;
  }
  document.getElementById("theme").addEventListener("click", function(){
    var order = ["system", "light", "dark"], cur = this.dataset.theme;
    var t = order[(order.indexOf(cur) + 1) % order.length];
    S.lsSet(THEME_KEY, t);
    applyTheme(t);
  });
  applyTheme(S.lsGet(THEME_KEY));

  /* ---------- pieces ---------- */
  function whenText(c){
    if(c.state === "upcoming") return c.days >= 2 ? plural(c.days, "day") : "Tomorrow";
    return c.state === "today" ? "Today" : c.state === "live" ? "Now" : "Done";
  }
  function dateText(s){ var p = S.dateParts(s); return p.dow + " " + p.day + " " + p.mon; }
  function dayLabel(d, now){
    var p = S.dateParts(d), n = S.dayDiff(now, d);
    var rel = n === 0 ? "Today" : n === 1 ? "Tomorrow" : p.dow;
    return '<b>' + rel + '</b>' + p.day + ' ' + p.mon;
  }
  /* Where "Continue" goes: the site's own next item, else its dashboard. */
  function continueHref(s, sum){ return S.subjectHref(s, sum && sum.next && sum.next.target); }

  /* The six syllabus modules with the site's own module figures laid over them. */
  function modules(s, sum){
    var syl = S.syllabus(s.code), got = {};
    (sum ? sum.modules : []).forEach(function(m){ got[m.id] = m.pct; });
    return syl ? syl.modules.map(function(m){
      return { n:m.n, title:m.title, ready:!!m.built, pct:got[m.id] || 0 };
    }) : [];
  }

  function cardHTML(s, sum, now, isNext){
    var c = S.countdown(s, now), soon = c.state !== "done" && c.days <= 3;
    var mods = modules(s, sum), ready = mods.filter(function(m){ return m.ready; }).length;
    var pct = sum ? sum.pct : 0;
    var pips = '<div class="pips">' + mods.map(function(m){
      return '<span class="pip' + (m.ready ? '' : ' pending') + '" title="Module ' + m.n + ' · ' + esc(m.title) +
        (m.ready ? ' · ' + m.pct + '%' : ' · material pending') + '">' + (m.ready ? '<i style="width:' + m.pct + '%"></i>' : '') + '</span>';
    }).join("") + '</div>';
    return '<li class="card acc' + (c.state === "done" ? ' done' : '') + '"' + accStyle(s) + '>' +
      '<div class="hd"><span class="ico">' + I(s.code) + '</span>' +
        '<div class="nm"><h3><a href="' + S.subjectHref(s) + '">' + esc(s.name) + '</a></h3><div class="dt">' + dateText(s) + '</div></div>' +
        '<span class="days' + (soon ? ' soon' : '') + '">' + esc(whenText(c)) + '</span></div>' +
      '<div class="pct"><b>' + pct + '%</b>' + bar(pct, s.short + " progress") + '</div>' +
      '<div class="mods">' + pips + '<span class="ready" title="Modules with study material">' + ready + '/6 ready</span></div>' +
      (sum && sum.next ? '<div class="nexttopic">' + I("play") + '<span>' + esc(sum.next.title) + '</span></div>' : '') +
      '<div class="acts"><a class="btn' + (isNext ? ' primary' : '') + '" href="' + continueHref(s, sum) + '">' +
        (sum && sum.next ? 'Continue' : 'Open') + I("arrow") + '</a></div></li>';
  }

  function chip(s, sums, cls, text){
    return '<a class="chip acc' + (cls ? ' ' + cls : '') + '"' + accStyle(s) + ' href="' + continueHref(s, sums[s.code]) + '">' +
      I(cls === "paper" ? "paper" : s.code) + (text || esc(s.short)) + '</a>';
  }

  /* ---------- render ---------- */
  function render(){
    var now = new Date(), next = S.nextSubject(now), list = S.SUBJECTS, sums = {};
    list.forEach(function(s){ sums[s.code] = S.readSummary(s.code); });

    /* continue: the next paper that still has work, else the next paper */
    var pick = null;
    list.forEach(function(s){
      if(pick || S.countdown(s, now).state === "done") return;
      var x = sums[s.code];
      if(!x || x.pct < 100) pick = s;
    });
    pick = pick || next;

    /* hero: the next paper and where to pick up */
    var hero = document.getElementById("hero");
    if(next){
      var c = S.countdown(next, now), ps = sums[next.code];
      hero.className = "hero acc";
      hero.setAttribute("style", "--acc:" + next.accent);
      hero.innerHTML = '<span class="ico lg">' + I(next.code) + '</span>' +
        '<div class="what"><div class="k">Next paper &middot; ' + dateText(next) + ', ' + S.EXAM.start + '</div>' +
          '<div class="t">' + esc(next.name) + '</div>' +
          (ps && ps.next ? '<div class="d">Up next: ' + esc(ps.next.title) + '</div>' : '') + '</div>' +
        '<div class="count">' + (c.state === "upcoming" ? '<b>' + c.days + '</b><span>' + (c.days === 1 ? 'day' : 'days') + ' left</span>'
                                                       : '<b>' + esc(whenText(c)) + '</b>') + '</div>' +
        '<div class="acts"><a class="btn primary" href="' + continueHref(next, ps) + '">' + (ps && ps.next ? 'Continue' : 'Open ' + esc(next.short)) + I("arrow") + '</a></div>';
    } else {
      hero.className = "hero";
      hero.innerHTML = '<span class="ico lg">' + I("check") + '</span><div class="what"><div class="t">All five papers are done.</div></div>';
    }

    /* overview */
    var avg = Math.round(list.reduce(function(a, s){ return a + (sums[s.code] ? sums[s.code].pct : 0); }, 0) / list.length);
    var withTopics = list.filter(function(s){ return sums[s.code] && sums[s.code].topics; });
    var tLeft = withTopics.reduce(function(a, s){ var t = sums[s.code].topics; return a + t.total - t.done; }, 0);
    var allMods = [].concat.apply([], list.map(function(s){ var y = S.syllabus(s.code); return y ? y.modules : []; }));
    var ready = allMods.filter(function(m){ return m.built; }).length;
    function stat(icon, v, l){ return '<div class="stat"><span class="ico">' + I(icon) + '</span><div><div class="v">' + v + '</div><div class="l">' + l + '</div></div></div>'; }
    document.getElementById("stats").innerHTML =
      stat("target", avg + "%", "Overall progress") +
      stat("checks", withTopics.length ? tLeft : "&mdash;", "Topics left" + (withTopics.length < list.length ? ' <b>&middot; ' + withTopics.length + ' of 5 opened</b>' : '')) +
      stat("layers", ready + "/" + allMods.length, "Modules with material");

    /* subjects */
    document.getElementById("subs").innerHTML = list.map(function(s){ return cardHTML(s, sums[s.code], now, s === pick); }).join("");

    /* sessions */
    var days = S.plan(now, sums, PLAN_DAYS);
    document.getElementById("plan").innerHTML = days.length ? days.map(function(d){
      var slots = '';
      if(d.exam){
        slots += chip(d.exam, sums, "paper", esc(d.exam.short) + ' paper &middot; ' + S.EXAM.start);
        if(d.main) slots += chip(d.main, sums);
      } else if(d.full){
        slots += chip(d.main, sums, "", esc(d.main.short) + ' &middot; full day');
      } else {
        slots += chip(d.main, sums);
        if(d.also) slots += chip(d.also, sums);
      }
      return '<li><div class="day">' + dayLabel(d.date, now) + '</div><div class="slots">' + slots + '</div></li>';
    }).join("") : '<li><div class="slots">No papers left to plan for.</div></li>';

    /* timetable */
    document.getElementById("tt").innerHTML = list.map(function(s){
      var c = S.countdown(s, now);
      return '<li class="acc' + (s === next ? ' next' : '') + (c.state === "done" ? ' done' : '') + '"' + accStyle(s) + '>' +
        '<div class="day">' + dayLabel(S.examStart(s), now) + '</div>' +
        '<div class="s"><span class="ico">' + I(s.code) + '</span><a href="' + S.subjectHref(s) + '" title="' + esc(s.name) + '">' + esc(s.short) + '</a></div>' +
        '<div class="c">' + esc(whenText(c)) + '</div></li>';
    }).join("");
  }

  render();
  /* Stay current: another tab may have published a summary, and countdowns move. */
  window.addEventListener("storage", function(e){ if(!e.key || e.key.indexOf("sem7.") === 0) render(); });
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") render(); });
  window.addEventListener("pageshow", render);
  setInterval(render, 60000);
})();
</script>
</body>
</html>
