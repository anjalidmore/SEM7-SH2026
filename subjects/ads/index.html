const QUIZ = [
/* ---------------- MODULE 1 ---------------- */
{t:"m1t1", m:"m1", stage:"concept", q:"Which of the following best defines Data Science?",
 o:["Writing software applications","Collecting, analysing and extracting knowledge from data to solve problems","Designing computer networks","Storing files in databases"], a:1,
 e:"Data Science is an interdisciplinary field involving collecting, processing, storing, analyzing and interpreting large volumes of structured and unstructured data to extract meaningful insights and knowledge. The other options describe software engineering, networking and database administration respectively — none involves extracting knowledge from data."},
{t:"m1t1", m:"m1", stage:"concept", q:"How are AI, Machine Learning and Data Science related?",
 o:["Data Science ⊃ AI ⊃ ML","AI ⊃ ML, with Data Science as the business application of AI, ML, statistics and visualization","ML ⊃ AI ⊃ Data Science","They are three names for the same field"], a:1,
 e:"AI is the widest field — giving machines the capability of mimicking human cognitive behaviour. ML is a sub-field or tool of AI — learning from data. Data Science is the business application of AI, ML, statistics and visualization. Options A and C invert the nesting; D ignores that each has a distinct scope."},
{t:"m1t2", m:"m1", stage:"recognise", q:"A hospital stores records of 10 million patients. Which data characteristic is being highlighted?",
 o:["Dimensionality","Volume","Accuracy","Visualization"], a:1,
 e:"A count of RECORDS speaks to Volume — how much data there is. Dimensionality would be the number of ATTRIBUTES per patient (e.g. 120 fields each). Accuracy is a property of data quality, not a motivation characteristic, and visualization is a technique."},
{t:"m1t2", m:"m1", stage:"recognise", q:"Each patient record contains 120 attributes including numbers, X-ray images and voice recordings. Which TWO characteristics does this sentence demonstrate?",
 o:["Volume and Accuracy","Dimensionality and Complexity","Volume and Dimensionality","Complexity and Timeliness"], a:1,
 e:"“120 attributes” is the number of columns per record → Dimensionality. “numbers, X-ray images, voice recordings” is a list of mixed formats → Complexity. Volume would need a count of records, which this sentence does not give."},
{t:"m1t2", m:"m1", stage:"concept", q:"Which approach “runs recursively, learning from the predictive errors of each previous cycle, generating a multitude of hypotheses”?",
 o:["Confirmatory analysis","Exploratory analysis","Descriptive statistics","Tabulation"], a:1,
 e:"That is exploratory analysis, associated with machine learning and built for large, high-dimension search spaces. Confirmatory analysis is traditional statistics — it validates ONE hypothesis you already hold. Tukey's point, quoted in the lecture, is that we need both."},
{t:"m1t3", m:"m1", stage:"recognise", q:"A bank wants to predict whether a loan applicant will repay the loan. Which data science task is most appropriate?",
 o:["Clustering","Classification","Regression","Association Analysis"], a:1,
 e:"The target is a LABEL with predefined classes (repay / default), learned from a known dataset — that is classification. Regression predicts a numeric value; clustering discovers groups with no labels given beforehand; association analysis finds items that occur together in transactions."},
{t:"m1t3", m:"m1", stage:"recognise", q:"Banks detect suspicious transactions using:",
 o:["Clustering","Association Analysis","Anomaly Detection","Regression"], a:2,
 e:"Anomaly detection predicts whether a data point is an outlier compared with the others. The lecture's own example for this task is detecting fraudulent credit card transactions and network intrusion, using distance-based, density-based and LOF algorithms."},
{t:"m1t3", m:"m1", stage:"recognise", q:"Predicting electricity demand for next month is an example of:",
 o:["Data Cleaning","Time Series Forecasting","Clustering","Text Mining"], a:1,
 e:"The target is numeric AND it is being predicted for a future timeframe from historical time-stamped values — that is time series forecasting (exponential smoothing, ARIMA). Plain regression predicts a number from other attributes of the same record, with no time dimension."},
{t:"m1t3", m:"m1", stage:"select", q:"A supermarket groups customers into segments without being told in advance who is a student or a luxury buyer. Which task and which algorithm?",
 o:["Classification with decision trees","Clustering with k-Means or DBSCAN","Regression with linear regression","Recommendation with collaborative filtering"], a:1,
 e:"“Without being told in advance” means NO LABELS are given, so the groups must be discovered from inherent properties — that is clustering, done with k-Means or density-based clustering such as DBSCAN. If the segments had been predefined, it would have been classification."},
{t:"m1t3", m:"m1", stage:"concept", q:"Which feature is LEAST useful for predicting employee salary?",
 o:["Experience","Education","Employee ID","Skills"], a:2,
 e:"An Employee ID is a unique identifier — different for every record, so it carries no predictive information about a new employee, even though it could perfectly “explain” the training data. This is exactly why identifier columns are dropped during feature selection."},
{t:"m1t4", m:"m1", stage:"concept", q:"What is the correct order of the data science process?",
 o:["Preparation → Prior Knowledge → Modeling → Knowledge → Application","Prior Knowledge → Preparation → Modeling → Application → Knowledge","Modeling → Preparation → Prior Knowledge → Application → Knowledge","Prior Knowledge → Modeling → Preparation → Knowledge → Application"], a:1,
 e:"Prior Knowledge (what is already known about the business, domain and data) → Preparation (explore, clean, transform, split) → Modeling (build and validate) → Application (deploy and monitor) → Knowledge (the incremental, posterior insight). The process is iterative, not rigid."},
{t:"m1t4", m:"m1", stage:"concept", q:"CRISP-DM stands for:",
 o:["Cross Industry Standard Process for Data Mining","Critical Statistical Process for Data Modelling","Cross Iterative Sampling Process for Data Management","Classification Regression Inference Selection Process"], a:0,
 e:"CRISP-DM = Cross Industry Standard Process for Data Mining, developed by a data-mining consortium in 2000 and the most widely adopted framework. The other named frameworks are SEMMA (SAS), DMAIC (Six Sigma) and KDD."},
{t:"m1t4", m:"m1", stage:"concept", q:"Which sub-step of Prior Knowledge warns that “can a borrower's credit score be predicted using interest rate?” is technically possible but business-wise incorrect?",
 o:["Objective","Subject Area","Data","Correlation vs Causation"], a:3,
 e:"That is the Correlation vs Causation sub-step. The causal direction runs credit score → interest rate, so modelling it backwards produces a prediction that cannot be acted on. Correlation indicates a statistical relationship; it does not guarantee causation."},
{t:"m1t5", m:"m1", stage:"concept", q:"Approximately what percentage of a data scientist's time is typically spent on data preparation?",
 o:["10%","25%","50%","80–90%"], a:3,
 e:"Roughly 80% of a data scientist's time is spent cleaning data, not building models. The lecture also notes that 80% of enterprise AI failures are due to poor data quality rather than algorithms — which is why data preparation has its own syllabus sub-topic."},
{t:"m1t5", m:"m1", stage:"recognise", q:"A borrower's income is recorded as ₹12,50,000 while the dataset median is ₹71,500. How should this be treated?",
 o:["Deleted immediately as an error","Capped to the maximum valid value","Flagged, not deleted — kept for analysis and treated later","Replaced with the mean"], a:2,
 e:"This is an OUTLIER — an extreme but perfectly possible value — so the lecture flags it rather than deleting it, because outliers may be the very thing you are modelling for. Capping is the treatment for INVALID data (like a credit score of 900, outside the legal 300–850 range)."},
{t:"m1t5", m:"m1", stage:"concept", q:"Why is normalization applied before modelling?",
 o:["To remove duplicate records","To scale attributes to a uniform range so one does not dominate purely because its numbers are larger","To increase the number of features","To convert numeric data to categorical"], a:1,
 e:"Income runs into lakhs while credit score sits between 300 and 850. Without normalization to a uniform 0–1 range, income would dominate any distance- or magnitude-based algorithm simply because its numbers are bigger, not because it is more informative."},
{t:"m1t6", m:"m1", stage:"solve", q:"A dataset contains 600 customer records and 5-fold cross validation is used. How many records are used for TRAINING in each iteration?",
 o:["600","500","480","120"], a:2,
 e:"Each fold holds 600/5 = 120 records, which is the test set for that iteration. Training uses the remaining k−1 = 4 folds: 600 − 120 = 480 records. Writing 600 is the classic error — the held-out fold is not available for training."},
{t:"m1t6", m:"m1", stage:"solve", q:"A dataset has 20 patient records. Using LOOCV, how many total iterations are required?",
 o:["1","2","19","20"], a:3,
 e:"In Leave-One-Out CV, k equals the number of records, so there are n = 20 iterations. Each holds out exactly 1 record for testing and trains on the remaining n − 1 = 19."},
{t:"m1t6", m:"m1", stage:"recognise", q:"Original dataset is A B C D E and one bootstrap sample is A C C D E. Which record is the Out-of-Bag (test) data?",
 o:["A","B","C","E"], a:1,
 e:"The OOB set is what is ABSENT from the bootstrap sample. Scanning: A ✓, B ✗, C ✓ (twice), D ✓, E ✓. So B is Out-of-Bag. C appearing twice is a consequence of sampling WITH replacement, not the answer."},
{t:"m1t6", m:"m1", stage:"select", q:"A hospital has only 18 patient records. Which validation technique is most suitable?",
 o:["Hold-out 70:30","k-Fold with k = 10","Leave-One-Out Cross Validation","A single 50:50 split"], a:2,
 e:"With only 18 records, data is desperately scarce and none can be wasted. LOOCV trains on 17 records every time, tests every observation once, and costs only 18 trainings — trivial at this size. A hold-out split would waste ~30% of an already tiny dataset."},
{t:"m1t6", m:"m1", stage:"select", q:"Only 2% of a bank's transactions are fraudulent. Which cross-validation variant is essential?",
 o:["Hold-out validation","Stratified k-Fold","Leave-P-Out","Plain k-Fold"], a:1,
 e:"Stratified k-fold builds each fold to mirror the original class proportions, preventing a fold from accidentally containing no fraudulent transactions at all. With 2% positives, plain k-fold could produce a validation fold with zero positives, making the metric meaningless."},
{t:"m1t6", m:"m1", stage:"concept", q:"Bootstrapping generates samples by:",
 o:["Randomly drawing data points WITHOUT replacement","Randomly drawing data points WITH replacement","Splitting the data into k equal folds","Selecting only the most representative records"], a:1,
 e:"Bootstrap samples are drawn WITH replacement, usually to the same size as the original dataset. That is why some records repeat and others are never drawn — and the ones never drawn form the Out-of-Bag test set."},
{t:"m1t6", m:"m1", stage:"concept", q:"Why do we validate a model?",
 o:["To increase the dataset size","To check how well the model performs on unseen data","To remove duplicate records","To speed up training"], a:1,
 e:"Validation uses records the model never trained on. If it predicts correctly for new cases it generalizes and is useful; otherwise it has simply memorized the training data. Removing duplicates is data cleaning, not validation."},
{t:"m1t7", m:"m1", stage:"recognise", q:"Which question is typically answered by Data Analytics rather than Data Science?",
 o:["What will happen tomorrow?","Which customer is likely to buy a product?","What were last month's sales?","Which movie should Netflix recommend?"], a:2,
 e:"“What were last month's sales?” is backward-looking and descriptive — data analytics territory. The other three are forward-looking predictions, which is data science. The tense of the verb is the fastest test."},
{t:"m1t7", m:"m1", stage:"recognise", q:"Predicting customer churn is an example of:",
 o:["Data Analytics","Data Science","Database Management","Data Storage"], a:1,
 e:"Churn prediction forecasts a FUTURE outcome and typically triggers an automated retention action — predictive and prescriptive analysis, which is data science. Data analytics would instead report how many customers left last quarter and why."},
{t:"m1t7", m:"m1", stage:"concept", q:"Which types of analysis does Data Analytics mostly cover?",
 o:["Predictive and Prescriptive","Descriptive and Diagnostic","Prescriptive only","All four equally"], a:1,
 e:"Data analytics is mostly Descriptive (what happened) and Diagnostic (why it happened). Data science extends into Predictive (what will happen) and Prescriptive (what to do about it), which is the essential difference in scope."},
{t:"m1t8", m:"m1", stage:"select", q:"Amazon's “customers who bought this also bought” feature is powered by:",
 o:["Anomaly detection","Collaborative filtering","Time series forecasting","Hypothesis testing"], a:1,
 e:"Recommendation engines predict the preference of an item for a user, using collaborative filtering, content-based filtering or hybrid recommenders. The lecture names Amazon's feature specifically as collaborative-filtering powered."},

/* ---------------- MODULE 2 ---------------- */
{t:"m2t1", m:"m2", stage:"recognise", q:"“Year Enrolled” (2021, 2022, 2023) is measured at which level?",
 o:["Nominal","Ordinal","Interval","Ratio"], a:2,
 e:"Year is INTERVAL: the gaps are equal and meaningful (one year is one year), but there is no absolute zero year, so ratios are meaningless — “2022 is twice 1011” is nonsense. It looks numeric, which is exactly why it is a favourite trap."},
{t:"m2t1", m:"m2", stage:"recognise", q:"Body temperature measured in °C is at which level of measurement?",
 o:["Nominal","Ordinal","Interval","Ratio"], a:2,
 e:"Interval. The intervals are equal, but 0°C is the freezing point of water — an arbitrary reference, not an absence of heat. So 40°C is NOT twice as hot as 20°C. The test: if changing the unit changes the ratio, the scale is interval, not ratio."},
{t:"m2t1", m:"m2", stage:"concept", q:"Which level of measurement permits ALL statistical operations, including ratios?",
 o:["Nominal","Ordinal","Interval","Ratio"], a:3,
 e:"Ratio adds an absolute zero on top of everything interval provides, so multiplication and division become meaningful. Each level builds on the one before: ratio data can do everything nominal, ordinal and interval data can, plus more."},
{t:"m2t2", m:"m2", stage:"recognise", q:"Classes are given as 10–19, 20–29, 30–39. What must be done before computing the median?",
 o:["Nothing — use them as they are","Apply the correction factor to convert to exclusive classes","Convert them to mid-points only","Double the class width"], a:1,
 e:"There is a gap between 19 and 20, so these are INCLUSIVE classes. The correction factor = (20 − 19)/2 = 0.5 must be subtracted from every lower limit and added to every upper limit, giving 9.5–19.5, 19.5–29.5, etc. Without this the interpolation formula uses the wrong boundaries."},
{t:"m2t2", m:"m2", stage:"solve", q:"In an EXCLUSIVE distribution with classes 0–10, 10–20, 20–30, which class does the value 20 belong to?",
 o:["0–10","10–20","20–30","It is excluded from the table"], a:2,
 e:"In the exclusive method the item equal to the upper limit is EXCLUDED from that class and placed in the next one. So 20 goes into 20–30, not 10–20. Getting this wrong shifts every frequency and therefore every later calculation."},
{t:"m2t2", m:"m2", stage:"concept", q:"Sturges' rule for the number of classes is:",
 o:["k = 1 + 3.322 log N","k = (L − S)/i","k = √N","k = N/10"], a:0,
 e:"k = 1 + 3.322 log N. For N = 100 this gives 7.644 ≈ 8 classes. The formula i = (L − S)/k is for the class INTERVAL once k is chosen, and √n is the rule of thumb for histogram bins."},
{t:"m2t3", m:"m2", stage:"concept", q:"A table showing personnel by gender, salary grade, age group and year is:",
 o:["A simple (one-way) table","A two-way table","A three-way table","A manifold (higher-order) table"], a:3,
 e:"Four characteristics makes it a manifold or higher-order table. The class notes add the practical caution that four or more attributes is generally not feasible in a single table — beyond that, split across tables or use a graph."},
{t:"m2t5", m:"m2", stage:"concept", q:"In a histogram, why are the bars drawn adjacent with no gaps?",
 o:["To save space","Because the data is continuous, so the classes are contiguous","Because the frequencies are equal","Because it is a diagram, not a graph"], a:1,
 e:"A histogram represents CONTINUOUS data grouped into class intervals, and the classes run into one another with no break — so the bars must touch. Gaps between bars are the mark of a bar diagram, which represents categorical or discrete data."},
{t:"m2t5", m:"m2", stage:"recognise", q:"A frequency polygon is plotted against which values on the x-axis?",
 o:["Class lower limits","Class upper limits","Class mid-points","Cumulative frequencies"], a:2,
 e:"A frequency polygon plots frequency against class MID-POINTS, joined by straight lines and closed to the x-axis at both ends. An ogive, by contrast, is plotted against class BOUNDARIES. Mixing these two up is a common error."},
{t:"m2t5", m:"m2", stage:"concept", q:"The two ogives (less-than and more-than) intersect at:",
 o:["The mode","The mean","The median","Q1"], a:2,
 e:"Their point of intersection corresponds to cumulative frequency N/2, so the x-coordinate of the intersection is the MEDIAN. This is the standard method for locating the median graphically."},
{t:"m2t6", m:"m2", stage:"solve", q:"Using step deviation with A = 35, i = 10, N = 110 and Σfd′ = −71, the mean is:",
 o:["34.35","28.55","35.65","41.45"], a:1,
 e:"X̄ = A + (Σfd′/N) × i = 35 + (−71/110) × 10 = 35 − 6.4545 = 28.55. Option A (34.35) is what you get by forgetting the × i — and its suspicious closeness to A = 35 is the tell that the multiplication was missed."},
{t:"m2t6", m:"m2", stage:"solve", q:"The mean marks of 30 boys is 62 and of 20 girls is 55. The combined mean is:",
 o:["58.5","59.2","57.0","60.4"], a:1,
 e:"X̄₁₂ = (N₁X̄₁ + N₂X̄₂)/(N₁+N₂) = (30×62 + 20×55)/50 = (1860+1100)/50 = 59.2. Option A (58.5) is the simple average of the two means, which is only valid when the groups are the SAME size — they are not."},
{t:"m2t6", m:"m2", stage:"solve", q:"The mean of 50 items was 38. An item of 45 was misread as 25. The correct mean is:",
 o:["38.0","38.4","37.6","39.0"], a:1,
 e:"Incorrect ΣX = 38 × 50 = 1900. Correct ΣX = 1900 − 25 + 45 = 1920. Correct mean = 1920/50 = 38.4. Quick check: the value was understated by 20, so the mean rises by 20/50 = 0.4."},
{t:"m2t7", m:"m2", stage:"concept", q:"In the median formula for a continuous series, “cf” refers to the cumulative frequency of:",
 o:["The median class itself","The class immediately BEFORE the median class","The last class","The class with the highest frequency"], a:1,
 e:"cf is the running total up to but NOT including the median class. Using the median class's own cumulative frequency is one of the most common errors — it would make the numerator negative or wildly wrong."},
{t:"m2t7", m:"m2", stage:"select", q:"An income distribution has mean ₹1,63,539 and median ₹71,500. Which should be reported as the typical income, and why?",
 o:["The mean, because it uses all observations","The median, because it is resistant to the extreme values causing the gap","Either — they are equivalent","The mode, always"], a:1,
 e:"A mean more than double the median signals strong positive skew caused by a few very large values. The mean is dragged upward and describes nobody in the dataset; the median is resistant to extremes and represents a genuinely typical borrower. Best practice: report both, and note the gap as evidence of skewness."},
{t:"m2t8", m:"m2", stage:"concept", q:"The empirical relationship between mean, median and mode is:",
 o:["Mode = 2 Median − 3 Mean","Mode = 3 Median − 2 Mean","Mode = 3 Mean − 2 Median","Mode = Mean − Median"], a:1,
 e:"Mode = 3 Median − 2 Mean, valid for a moderately skewed distribution. Substituting it into Sk = (X̄ − Mode)/σ yields Karl Pearson's second formula Sk = 3(X̄ − Median)/σ — which is where that factor of 3 comes from."},
{t:"m2t8", m:"m2", stage:"recognise", q:"For a distribution, Mean = 48.5, Median = 51.2, Mode = 56.6. The distribution is:",
 o:["Positively skewed","Negatively skewed","Symmetrical","Mesokurtic"], a:1,
 e:"The order is Mean < Median < Mode, which is negative skew — the mode is highest, the mean is lowest, and the long tail stretches to the LEFT. The mean is always dragged toward the tail, so a mean below the mode means the tail is on the low side."},
{t:"m2t8", m:"m2", stage:"solve", q:"A modal class has L = 110, f₁ = 50, f₀ = 42, f₂ = 45, i = 10. The mode is:",
 o:["115.00","116.15","113.85","110.00"], a:1,
 e:"Δ₁ = |50−42| = 8, Δ₂ = |50−45| = 5. Mode = 110 + [8/(8+5)] × 10 = 110 + 6.15 = 116.15. Option A (115) is the mid-point of the modal class, which is not the mode — the Δ formula shifts it toward the heavier neighbour."},
{t:"m2t9", m:"m2", stage:"concept", q:"Which of the following is NOT equal to the median?",
 o:["Q2","D5","P50","Q3"], a:3,
 e:"Q₂ = D₅ = P₅₀ = the median, since all three divide the distribution in half. Q₃ is the upper quartile, below which 75% of the data lies — that is P₇₅, not the median."},
{t:"m2t10", m:"m2", stage:"concept", q:"The coefficient of quartile deviation is:",
 o:["(Q3 − Q1)/2","(Q3 − Q1)/(Q3 + Q1)","(Q3 + Q1)/2","(Q3 + Q1 − 2 Median)/(Q3 − Q1)"], a:1,
 e:"Coefficient of Q.D. = (Q₃ − Q₁)/(Q₃ + Q₁) — note the SUM in the denominator, which makes it unit-free. Option A is the quartile deviation itself, and option D is Bowley's coefficient of skewness."},
{t:"m2t10", m:"m2", stage:"select", q:"To compare the variability of employee heights (cm) with salaries (₹), you must use:",
 o:["The range of each","The standard deviation of each","A relative measure such as the coefficient of variation","The interquartile range of each"], a:2,
 e:"Absolute measures carry the data's units, so comparing 45 cm with ₹60,000 is meaningless. A relative measure divides spread by level, so the units cancel and what remains is a pure number expressing spread as a proportion of the typical value."},
{t:"m2t11", m:"m2", stage:"solve", q:"With Σfd′² = 227, Σfd′ = −71, N = 110 and i = 10, the standard deviation is:",
 o:["1.28","12.83","16.47","2.06"], a:1,
 e:"σ = √[227/110 − (−71/110)²] × 10 = √[2.0636 − 0.4166] × 10 = √1.6470 × 10 = 1.2834 × 10 = 12.83. Option A is the value before multiplying by i — forgetting the × i is the standard slip."},
{t:"m2t11", m:"m2", stage:"concept", q:"Why are deviations SQUARED when computing the standard deviation?",
 o:["To make the arithmetic easier","Because deviations from the mean always sum to zero, so signs must be removed","To give equal weight to all values","To convert to a percentage"], a:1,
 e:"Deviations from the mean always sum to zero — a defining property of the mean — so a simple average of deviations is useless. Squaring removes the signs so positives and negatives cannot cancel; the final square root restores the original units. The side effect is extra weight on extreme values."},
{t:"m2t12", m:"m2", stage:"select", q:"A distribution has two classes tied at the maximum frequency. Which Karl Pearson formula should you use?",
 o:["Sk = (Mean − Mode)/σ","Sk = 3(Mean − Median)/σ","Sk = (Q3 + Q1 − 2 Median)/(Q3 − Q1)","Sk = μ3²/μ2³"], a:1,
 e:"A tie at the maximum frequency means the distribution is bimodal and the mode is ill-defined, so the median-based form Sk = 3(Mean − Median)/σ must be used. Option C is Bowley's coefficient (a valid alternative but not Karl Pearson's), and D is β₁."},
{t:"m2t12", m:"m2", stage:"solve", q:"Mean = 45, Mode = 51, σ = 12. Karl Pearson's coefficient of skewness is:",
 o:["+0.5","−0.5","+1.5","−1.5"], a:1,
 e:"Sk = (Mean − Mode)/σ = (45 − 51)/12 = −6/12 = −0.5. The NEGATIVE sign means the mean lies below the mode, so the distribution is negatively skewed with the long tail to the left."},
{t:"m2t12", m:"m2", stage:"solve", q:"Q1 = 24.5, Median = 31.0, Q3 = 42.5. Bowley's coefficient of skewness is:",
 o:["+0.278","−0.278","+0.056","+5.000"], a:0,
 e:"Sk_B = (Q₃ + Q₁ − 2 Median)/(Q₃ − Q₁) = (42.5 + 24.5 − 62.0)/(42.5 − 24.5) = 5.0/18.0 = +0.278. Positive, because Q₃ is 11.5 from the median while Q₁ is only 6.5 — the upper half is more spread out."},
{t:"m2t12", m:"m2", stage:"concept", q:"Bowley's coefficient of skewness is bounded between:",
 o:["0 and 1","−1 and +1","−3 and +3","There is no bound"], a:1,
 e:"Because of its computational basis Bowley's measure is bounded between −1 and +1. Karl Pearson's has no fixed limit — theoretically ±3 — although in practice it rarely exceeds ±1."},
{t:"m2t12", m:"m2", stage:"concept", q:"Karl Pearson's coefficient gives +0.62 while Bowley's gives +0.08 for the same data. The most likely explanation is:",
 o:["One of them has been computed incorrectly","The skewness lies in the tails, outside the quartiles, which Bowley cannot see","The distribution is bimodal","Bowley's formula does not apply to skewed data"], a:1,
 e:"Karl Pearson uses the mean and σ, computed from every observation, so it feels the tails. Bowley uses only Q₁, the median and Q₃ — the middle 50% — and is blind beyond them. Agreement in SIGN with divergence in MAGNITUDE is the signature of a symmetric body with extreme values in one tail."},
{t:"m2t12", m:"m2", stage:"concept", q:"Which statement about dispersion and skewness is correct?",
 o:["Dispersion concerns direction; skewness concerns amount","Dispersion concerns the amount of variation; skewness concerns its direction","Both measure the same property","Skewness is always computed before dispersion"], a:1,
 e:"Dispersion is concerned with the AMOUNT of variation and is always computed; skewness is concerned with the DIRECTION of variation (departure from symmetry), depends on the amount of dispersion, and is rarely calculated in business series."},
{t:"m2t13", m:"m2", stage:"concept", q:"A distribution with β₂ = 4.2 is:",
 o:["Platykurtic — flatter than normal","Mesokurtic — same as normal","Leptokurtic — more peaked than normal","Impossible; β₂ cannot exceed 3"], a:2,
 e:"β₂ > 3 means leptokurtic: a narrow, tall peak, more peaked than the normal curve, with heavier tails and more outlier-prone behaviour. Excess kurtosis here is γ₂ = 4.2 − 3 = +1.2."},
{t:"m2t13", m:"m2", stage:"solve", q:"For x = 2, 4, 6, 8, 10: μ₂ = 8 and μ₄ = 108.8. What is β₂ and what does it mean?",
 o:["13.6 — leptokurtic","1.7 — platykurtic","1.7 — leptokurtic","3.0 — mesokurtic"], a:1,
 e:"β₂ = μ₄/μ₂² = 108.8/8² = 108.8/64 = 1.7. Since 1.7 < 3 the distribution is PLATYKURTIC — flatter than normal, with lighter tails and less outlier-prone. Option A comes from dividing by μ₂ instead of μ₂²."},
{t:"m2t13", m:"m2", stage:"concept", q:"Why can β₁ = μ₃²/μ₂³ not indicate the DIRECTION of skewness?",
 o:["Because μ₃ is always positive","Because μ₃ is squared, which destroys the sign","Because it uses the fourth moment","Because it is bounded between 0 and 1"], a:1,
 e:"μ₃ itself carries direction — odd powers preserve sign, so a left-heavy distribution gives μ₃ < 0. But β₁ squares it, so β₁ ≥ 0 always and mirror-image distributions give identical values. For direction, quote the sign of μ₃ or use a signed measure."},
{t:"m2t14", m:"m2", stage:"concept", q:"Which statement is correct?",

{m:"m1", h:"Module 1 traps", b:`<ol class="list" style="margin-bottom:0">
<li><b>k-fold training size.</b> Train = N − N/k, not N. With 600 records and k = 5 it is 480, not 600.</li>
<li><b>Volume vs Dimensionality.</b> Rows are volume; columns are dimensionality. Exam stems always state both together to see if you separate them.</li>
<li><b>Bootstrap OOB.</b> The Out-of-Bag set is what is <i>missing</i> from the sample, not what is duplicated in it.</li>
<li><b>Outliers are flagged, not deleted.</b> Capping is for <i>invalid</i> data (a credit score of 900); flagging is for extreme-but-possible values.</li>

    Do not forget the × i

MEDIAN (continuous)
    Median = L + [(N/2 - cf)/f] × i
    cf = cumulative f of the class BEFORE the median class

MODE (continuous)
    Mode = L + [&Delta;1/(&Delta;1 + &Delta;2)] × i
    &Delta;1 = |f1 - f0|,  &Delta;2 = |f1 - f2|
    Empirical:  Mode = 3 Median - 2 Mean

QUARTILES / DECILES / PERCENTILES (continuous)
    Q_k = L + [(kN/4   - cf)/f] × i
    D_k = L + [(kN/10  - cf)/f] × i
    P_k = L + [(kN/100 - cf)/f] × i

DISPERSION
    Q.D. = (Q3 - Q1)/2
    Coefficient of Q.D. = (Q3 - Q1)/(Q3 + Q1)      <- SUM below
    &sigma; = &radic;[&Sigma;fd'²/N - (&Sigma;fd'/N)²] × i
    C.V. = (&sigma;/X̄) × 100 %

SKEWNESS
    Sk_p = (Mean - Mode)/&sigma;              [mode well defined]
    Sk_p = 3(Mean - Median)/&sigma;           [ill-defined / bimodal]
    Sk_B = (Q3 + Q1 - 2 Median)/(Q3 - Q1)  [bounded -1 to +1]

KURTOSIS
    &beta;2 = &mu;4/&mu;2²      >3 lepto · =3 meso · <3 platy

CORRELATION
    r = &Sigma;xy / &radic;(&Sigma;x² × &Sigma;y²)         [actual mean]
    r = [N&Sigma;XY - (&Sigma;X)(&Sigma;Y)] / {&radic;[N&Sigma;X²-(&Sigma;X)²] × &radic;[N&Sigma;Y²-(&Sigma;Y)²]}
    -1 &le; r &le; +1  always

BOX PLOT
    IQR = Q3 - Q1
    Fences: Q1 - 1.5×IQR   and   Q3 + 1.5×IQR

BUILDING THE TABLE
    Correction factor = (lower of 2nd class - upper of 1st)/2
    Sturges:  k = 1 + 3.322 log N       i = (L - S)/k</div>`},

{m:"m2", h:"The five traps that cost the most marks", b:`<ol class="list" style="margin-bottom:0">
<li><b>Inclusive classes not converted.</b> If there is a gap between classes (10–19, 20–29), apply the correction factor <i>before</i> any median, quartile or mode calculation. The class notes star this.</li>
<li><b>Forgetting × i</b> in the step-deviation mean or standard deviation. The tell: your mean comes out suspiciously close to the assumed mean A.</li>
<li><b>Missing a bimodal distribution.</b> Scan the frequency column for a repeated maximum. If two classes tie, the mode is ill-defined and you must use Sk = 3(X̄ − Median)/σ — and say why.</li>
<li><b>Using cf of the median class</b> instead of the class before it, in every interpolation formula.</li>
<li><b>Giving a number with no interpretation.</b> The official focus list names “interpretation of statistical measures” as its own item.</li>
</ol>`},

function reviewOf(m){ return REVIEW.filter(r => r.m === m); }
/* =====================================================================
   ============================  APPLICATION  ==========================
   Progress lives in localStorage, per browser, and is derived entirely
   from the individual questions you mark — never from whole topics.
   Nothing is hard-coded: a fresh browser always starts at 0%.
   ===================================================================== */
const KEY = "ads_study_guide_cepec7041_v2";
const THEME_KEY = "ads_study_guide_theme";

function blankProgress(){
  return {
    examples:{},      /* solved-example id -> true (worked / reviewed) */
    practice:{},      /* practice-question id -> true (attempted)      */
    quizTopic:{},     /* topicId -> {c: correct, n: total}             */
    quizStage:{},     /* stage   -> {c: correct, n: total}             */
    lastStudied:null,
    streak:0, lastVisit:null, firstVisit:null
  };
}
let P = blankProgress();

/* ---------- indexes built once from the data ---------- */
const TOPIC_BY_ID = {};
TOPICS.forEach(t => TOPIC_BY_ID[t.id] = t);
const ALL_EXAMPLES = [];
TOPICS.forEach(t => (t.examples||[]).forEach(e => ALL_EXAMPLES.push(Object.assign({}, e, {topic:t.id, m:t.m}))));
const ALL_PRACTICE = [];
TOPICS.forEach(t => (t.practice||[]).forEach(p => ALL_PRACTICE.push(Object.assign({}, p, {topic:t.id, m:t.m}))));
const ALL_QUESTIONS = [];
TOPICS.forEach(t => (t.questions||[]).forEach((q,i) => ALL_QUESTIONS.push(Object.assign({}, q, {topic:t.id, m:t.m, id:t.id+"_q"+i}))));

function topicsOf(m){ return TOPICS.filter(t => t.m === m); }
function moduleOf(id){ return MODULES.find(x => x.id === id); }
/* Theory track vs Numericals track */
function trackOf(t){ return t.type === "theory" ? "theory" : "numerical"; }
function topicsInTrack(m, track){ return topicsOf(m).filter(t => trackOf(t) === track); }

/* ---------- persistence ---------- */
function today(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw){ P = blankProgress(); P.firstVisit = today(); return; }
    const v = validateProgress(JSON.parse(raw));
    P = v.ok ? v.data : blankProgress();
    if(!P.firstVisit) P.firstVisit = today();
  }catch(e){ P = blankProgress(); P.firstVisit = today(); }
}
function validateProgress(o){
  if(!o || typeof o !== "object" || Array.isArray(o)) return {ok:false};
  /* Must actually look like one of our progress files, so an unrelated JSON
     object cannot be imported and silently wipe everything to 0%. */
  const isObj = x => !!x && typeof x === "object" && !Array.isArray(x);
  const looksRight = o._app === "ads-study-guide" || o._app === "ads-study-hub" ||
    ["examples","practice","quizTopic","quizStage"].some(k => isObj(o[k]));
  if(!looksRight) return {ok:false};
  const d = blankProgress();
  const topicIds    = new Set(TOPICS.map(t=>t.id));
  const exampleIds  = new Set(ALL_EXAMPLES.map(e=>e.id));
  const practiceIds = new Set(ALL_PRACTICE.map(p=>p.id));
  const stages      = new Set(["recognise","select","solve","concept"]);
  const pick = (src, allow, fn) => {
    const out = {};
    if(src && typeof src === "object" && !Array.isArray(src)){
      for(const k of Object.keys(src)){
        if(!allow.has(k)) continue;
        const v = fn(src[k]);
        if(v !== undefined) out[k] = v;
      }
    }
    return out;
  };
  const score = v => {
    if(!v || typeof v !== "object") return undefined;
    const c = +v.c, n = +v.n;
    if(!isFinite(c) || !isFinite(n) || n <= 0 || c < 0 || c > n) return undefined;
    return {c:Math.round(c), n:Math.round(n)};
  };
  d.examples  = pick(o.examples, exampleIds, v => v === true ? true : undefined);
  d.practice  = pick(o.practice, practiceIds, v => v === true ? true : undefined);
  d.quizTopic = pick(o.quizTopic, topicIds, score);
  d.quizStage = pick(o.quizStage, stages, score);
  d.lastStudied = (typeof o.lastStudied === "string" && topicIds.has(o.lastStudied)) ? o.lastStudied : null;
  d.lastVisit   = typeof o.lastVisit === "string" ? o.lastVisit : null;
  d.firstVisit  = typeof o.firstVisit === "string" ? o.firstVisit : today();
  d.streak      = Math.max(0, Math.min(3650, +o.streak || 0));
  return {ok:true, data:d};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(P)); }
  catch(e){ toast("Could not save — browser storage may be blocked."); }
}
function touchVisit(){
  const t = today();
  if(P.lastVisit === t) return;
  if(!P.lastVisit) P.streak = 1;
  else{
    const gap = Math.round((new Date(t+"T00:00:00") - new Date(P.lastVisit+"T00:00:00"))/86400000);
    P.streak = gap === 1 ? (P.streak||0)+1 : 1;
  }
  P.lastVisit = t; save();
}

/* =====================================================================
   PROGRESS — derived from the individual questions marked, never stored.
   A topic's "items" are its solved examples plus its practice questions.
   ===================================================================== */
function topicItems(t){
  const items = [];
  (t.examples||[]).forEach(e => items.push({k:"ex", id:e.id}));
  (t.practice||[]).forEach(p => items.push({k:"pr", id:p.id}));
  return items;
}
function itemDone(it){ return it.k === "ex" ? !!P.examples[it.id] : !!P.practice[it.id]; }

function topicProgress(t){
  const items = topicItems(t);
  const done = items.filter(itemDone).length;
  return {done, total:items.length, pct: items.length ? Math.round(done/items.length*100) : 0};
}
function topicStatus(id){
  const t = TOPIC_BY_ID[id];
  if(!t) return "none";
  const p = topicProgress(t);
  if(!p.total) return "none";
  if(p.done === p.total) return "done";
  return p.done > 0 ? "progress" : "none";
}
/* Aggregate over a list of topics, weighted by number of questions. */
function progressOf(list){
  let done = 0, total = 0, topicsDone = 0;
  list.forEach(t => {
    const p = topicProgress(t);
    done += p.done; total += p.total;
    if(p.total && p.done === p.total) topicsDone++;
  });
  return {done, total, pct: total ? Math.round(done/total*100) : 0,
          topicsDone, topics:list.length};
}
function overallProgress(){ return progressOf(TOPICS); }
function moduleProgress(m){ return progressOf(topicsOf(m)); }
function trackProgress(track){ return progressOf(TOPICS.filter(t => trackOf(t) === track)); }
function moduleTrackProgress(m, track){ return progressOf(topicsInTrack(m, track)); }

/* A vs B facts — used only on the comparison page */
function hasBExtras(t){ return !!(t.bExtras && t.bExtras.length); }
function hasAExtras(t){ return !!(t.aExtras && t.aExtras.length); }
function bExtraTopics(){ return TOPICS.filter(hasBExtras); }
function aExtraTopics(){ return TOPICS.filter(hasAExtras); }
function countBExtras(){ return TOPICS.reduce((a,t)=>a+(t.bExtras?t.bExtras.length:0),0); }
function countAExtras(){ return TOPICS.reduce((a,t)=>a+(t.aExtras?t.aExtras.length:0),0); }

function quizOverall(){
  let c=0, n=0;
  Object.values(P.quizTopic).forEach(v => { c += v.c; n += v.n; });
  return {c, n, pct: n ? Math.round(c/n*100) : null};
}
/* A topic is weak if it has been quizzed at least twice and scored < 60%. */
function weakTopics(){
  const out = [];
  Object.keys(P.quizTopic).forEach(id => {
    const v = P.quizTopic[id];
    if(!TOPIC_BY_ID[id] || v.n < 2) return;
    const pct = Math.round(v.c/v.n*100);
    if(pct < 60) out.push({topic:TOPIC_BY_ID[id], pct, c:v.c, n:v.n});
  });
  return out.sort((a,b) => a.pct - b.pct);
}
function stageStats(){
  const labels = {recognise:"Recognising the question type", select:"Selecting the method", solve:"Solving", concept:"Concept recall"};
  return Object.keys(labels).map(s => {
    const v = P.quizStage[s];
    return {stage:s, label:labels[s], c:v?v.c:0, n:v?v.n:0, pct: v && v.n ? Math.round(v.c/v.n*100) : null};
  });
}

/* ---------- "Study next" — transparent rule order ------------------- */
function studyNext(){
  const prio = t => (t.priority === "high" ? 0 : t.priority === "medium" ? 1 : 2);
  const started = t => topicProgress(t).done > 0 ? 0 : 1;

  const weak = weakTopics();
  if(weak.length) return {topic:weak[0].topic, rule:1};

  const c1 = TOPICS.filter(t => t.priority === "high" && topicStatus(t.id) === "progress");
  if(c1.length) return {topic:c1[0], rule:2};

  const c2 = TOPICS.filter(t => t.priority === "high" && topicStatus(t.id) === "none")
    .sort((a,b) => (trackOf(a)==="numerical"?0:1) - (trackOf(b)==="numerical"?0:1));
  if(c2.length) return {topic:c2[0], rule:3};

  const c3 = TOPICS.filter(t => topicStatus(t.id) !== "done")
    .sort((a,b) => prio(a)-prio(b) || started(a)-started(b));
  if(c3.length) return {topic:c3[0], rule:4};

  if(quizOverall().n < QUIZ.length) return {topic:null, view:"quiz", rule:5};
  return {topic:null, view:"exam", rule:6};
}
/* ---------------------------- helpers ------------------------------- */
const $  = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function strip(h){ const d = document.createElement("div"); d.innerHTML = h; return (d.textContent||"").replace(/\s+/g," ").trim(); }
function clip(s,n){
  s = String(s).trim();
  if(s.length <= n) return s;
  const cut = s.slice(0,n), sp = cut.lastIndexOf(" ");
  return (sp > n*0.6 ? cut.slice(0,sp) : cut).replace(/[,;:.\s]+$/,"") + "…";
}
let toastTimer = null;

function classPill(c){ const L = CLASS_LABEL[c]; return '<span class="pill '+L.pill+'" title="'+esc(L.long)+'">'+L.short+'</span>'; }

    .sort((a,b) => ((a.priority==="high"?0:a.priority==="medium"?1:2) - (b.priority==="high"?0:b.priority==="medium"?1:2)));

  list.forEach(t => { h += topicCard(t); });
  return h;
}

function vRecognition(){
  let h = '<h1>Question Recognition</h1><p class="lead">Not <i>how do I solve it</i> but <b>how do I know what kind of question this is</b>. '+
    'Most lost marks are recognition failures, not arithmetic failures — applying the mode formula to a bimodal distribution is perfect arithmetic and zero marks.</p>';

  h += '<div class="box exam"><h5>The three-stage habit</h5>'+
   '<div class="dtree">Read the question\n'+
   '     |\n'+
   ' 1. RECOGNISE  -> what category of question is this?\n'+
   '     |\n'+
   ' 2. SELECT     -> which formula / method does that category use?\n'+
   '     |\n'+
   ' 3. SOLVE      -> execute, then INTERPRET the number\n</div>'+
   '<p style="margin:0">The Quiz tracks these three separately, so you can see which stage is costing you.</p></div>';

  h += '<h2>Which Module 2 measure is being asked for?</h2>'+
   '<div class="dtree">Read the question\n'+
   '     |\n'+
   'What is being asked for?\n'+
   '     |\n'+
   '     +-- "average", "typical value"  -> CENTRAL TENDENCY\n'+
   '     |        +-- uses all values, further algebra -> MEAN\n'+
   '     |        +-- extremes / open-end class        -> MEDIAN\n'+
   '     |        +-- "most common", "which size"      -> MODE\n'+
   '     |\n'+
   '     +-- "spread", "variation", "consistency" -> DISPERSION\n'+
   '     |        +-- just two extreme values     -> RANGE\n'+
   '     |        +-- middle 50% / open-end class -> QUARTILE DEVIATION\n'+
   '     |        +-- all values, further algebra -> STANDARD DEVIATION\n'+
   '     |        +-- different units or means    -> COEFFICIENT (relative)\n'+
   '     |\n'+
   '     +-- "symmetry", "skewed", "which side"   -> SKEWNESS\n'+
   '     |        +-- mode well defined           -> KARL PEARSON (i)\n'+
   '     |        +-- bimodal / no clear mode     -> KARL PEARSON (ii)\n'+
   '     |        +-- open-end / quartiles given  -> BOWLEY\n'+
   '     |\n'+
   '     +-- "peakedness", "flat", "beta-2"       -> KURTOSIS\n'+
   '     |\n'+
   '     +-- TWO variables, "relationship"        -> CORRELATION\n'+
   '              +-- means are whole numbers -> Method 1 (actual mean)\n'+
   '              +-- means are fractional    -> Method 2 (direct)\n'+
   '              +-- assumed means given     -> Method 3 (assumed mean)\n</div>';

  h += '<h2>Which chart or graph?</h2>'+
   '<div class="dtree">How many variables must be shown?\n'+
   '     |\n'+
   '     +-- ONE  -> UNIVARIATE\n'+
   '     |     +-- shape of a continuous distribution -> HISTOGRAM\n'+
   '     |     +-- compare two distributions          -> FREQUENCY POLYGON\n'+
   '     |     +-- cumulative / median graphically    -> OGIVE\n'+
   '     |     +-- quartiles and outliers             -> BOX PLOT\n'+
   '     |     +-- categorical data                   -> BAR DIAGRAM (gaps)\n'+
   '     |     +-- parts of one whole                 -> PIE DIAGRAM\n'+
   '     |\n'+
   '     +-- TWO   -> SCATTER PLOT\n'+
   '     +-- THREE in one chart -> BUBBLE CHART (3rd = size)\n'+
   '     +-- MANY, all pairs    -> SCATTER MATRIX\n</div>';

  h += '<h2>Module 1 validation questions</h2>'+
   '<div class="dtree">What does the question give you?\n'+
   '     |\n'+
   '     +-- N and a percentage / ratio -> HOLD-OUT arithmetic\n'+
   '     |        Train = p x N,  Test = (1-p) x N\n'+
   '     |\n'+
   '     +-- N and a value of k         -> K-FOLD arithmetic\n'+
   '     |        Fold = N/k,  Test = N/k,  TRAIN = N - N/k\n'+
   '     |\n'+
   '     +-- N and "leave one out"      -> LOOCV\n'+
   '     |        Train = n-1,  Test = 1,  Iterations = n\n'+
   '     |\n'+
   '     +-- Original set + a sample    -> BOOTSTRAP / OOB\n'+
   '     |        OOB = what is MISSING from the sample\n'+
   '     |\n'+
   '     +-- "which technique and why?" -> JUDGEMENT, not arithmetic\n'+
   '              huge dataset       -> hold-out\n'+
   '              tiny dataset       -> LOOCV\n'+
   '              imbalanced classes -> stratified k-fold\n'+
   '              small + expensive  -> bootstrap\n</div>';

  /* Compact lookup: one line per topic, linking straight to it */
  h += '<h2>Clue &rarr; topic lookup</h2>'+
    '<p class="lead" style="margin-top:-.4rem">The single strongest clue for each topic, and the first move to make. '+

    topicsOf(m.id).forEach(t => {

        '<td>'+t.recognition.firstStep+'</td>'+
        '<td><button class="small" data-topic="'+t.id+'">Open</button></td></tr>';
    });
    h += '</tbody></table></div>';
  });
  return h;
}
/* ------------------------------- QUIZ ------------------------------- */
/* quizState: {ids:[indexes], answers:[], checked:[], done:false} */
let quizState = null;
let quizSetup = {module:"all", n:12};

function buildQuiz(){
  let pool = QUIZ.map((q,i) => i);
  if(quizSetup.module !== "all") pool = pool.filter(i => QUIZ[i].m === quizSetup.module);
  /* bias the selection toward weak topics, then shuffle */
  const weakIds = new Set(weakTopics().map(w => w.topic.id));
  const weakFirst = pool.filter(i => weakIds.has(QUIZ[i].t));
  const rest = pool.filter(i => !weakIds.has(QUIZ[i].t));
  const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const ids = shuffle(weakFirst).concat(shuffle(rest)).slice(0, Math.min(quizSetup.n, pool.length));
  quizState = {ids:shuffle(ids), answers:new Array(ids.length).fill(null), checked:new Array(ids.length).fill(false), done:false};
}
function vQuiz(){
  const qo = quizOverall();
  let h = '<h1>Quiz</h1>';

  if(!quizState){
    h += '<p class="lead">'+QUIZ.length+' questions across both modules. They test four different skills, and your results are tracked separately for each: '+
      '<b>recognising</b> the question type, <b>selecting</b> the right method, <b>solving</b>, and <b>concept recall</b>. '+
      'Wrong answers feed the weak-topic detector on the dashboard.</p>';
    if(qo.n) h += '<div class="banner info">Your running accuracy so far: <b>'+qo.pct+'%</b> ('+qo.c+' of '+qo.n+' correct). '+
      'New quizzes prioritise your weak topics automatically.</div>';
    const st = stageStats().filter(s=>s.n>0);
    if(st.length){
      h += '<div class="card"><h4>Your skills so far</h4>';
      st.forEach(s => { h += '<div style="margin-bottom:9px"><div class="badge-row" style="margin-bottom:3px">'+
        '<span style="font-size:.86rem;font-weight:650">'+esc(s.label)+'</span><span style="margin-left:auto;font-size:.82rem;color:var(--ink-soft)">'+s.c+'/'+s.n+' &middot; '+s.pct+'%</span></div>'+pbar(s.pct, barClass(s.pct))+'</div>'; });
      h += '</div>';
    }
    h += '<div class="toolbar"><label for="qm">Module</label><select id="qm" data-qs="module">'+
      '<option value="all"'+(quizSetup.module==="all"?" selected":"")+'>Both modules</option>'+
      MODULES.map(m=>'<option value="'+m.id+'"'+(quizSetup.module===m.id?" selected":"")+'>Module '+m.num+' only</option>').join("")+
      '</select><label for="qn">Questions</label><select id="qn" data-qs="n">'+
      [8,12,20,QUIZ.length].map(n=>'<option value="'+n+'"'+(quizSetup.n===n?" selected":"")+'>'+(n===QUIZ.length?"All ("+n+")":n)+'</option>').join("")+
      '</select></div>';
    h += '<button class="primary big" data-quizstart="1">Start quiz</button>';

  }

  const qs = quizState.ids.map(i => QUIZ[i]);
  if(quizState.done){
    const score = quizState.answers.reduce((a,v,i) => a + (v === qs[i].a ? 1 : 0), 0);
    const pct = Math.round(score/qs.length*100);
    const wrong = qs.map((q,i)=>({q,i})).filter(x => quizState.answers[x.i] !== x.q.a);
    h += '<div class="card" style="text-align:center"><div style="font-size:2.5rem;font-weight:800;color:'+(pct>=60?"var(--good)":"var(--bad)")+'">'+pct+'%</div>'+
      '<p style="margin:.3rem 0 0"><b>'+score+'</b> correct &middot; <b>'+(qs.length-score)+'</b> incorrect &middot; out of '+qs.length+'</p>'+
      pbar(pct, pct>=60?"good":"bad")+'</div>';
    if(wrong.length){
      h += '<h2>Revisit these topics</h2>';
      const seen = {};
      wrong.forEach(x => {
        const t = TOPIC_BY_ID[x.q.t];
        if(!t || seen[t.id]) return; seen[t.id] = 1;
        h += '<div class="card tight"><div class="badge-row" style="margin-bottom:5px">'+pill("high","Missed")+prioPill(t.priority)+
          '<span style="margin-left:auto"><button class="small" data-topic="'+t.id+'">Review</button></span></div>'+
          '<p style="margin:0;font-weight:650;font-size:.92rem">'+t.title+'</p>'+
          '<p class="muted" style="margin:3px 0 0">Recommended: recognition clues &rarr; solved example &rarr; practice questions.</p></div>';
      });
    } else {
      h += '<div class="banner info">Every answer correct. Move on to the next weakest area, or take a longer quiz.</div>';
    }
    h += '<div class="btn-row" style="margin-top:12px"><button class="primary" data-quizreset="1">Take another quiz</button>'+
      '<button data-go="dashboard">Back to dashboard</button></div>';
    return h;
  }

  const answered = quizState.checked.filter(Boolean).length;
  h += '<p class="lead">'+qs.length+' questions. Answer, check, and read the explanation &mdash; the explanation is where the learning is.</p>'+
    '<div class="card tight"><div class="badge-row"><b>Progress</b><span style="margin-left:auto;font-weight:700">'+answered+' / '+qs.length+' checked</span></div>'+
    pbar(Math.round(answered/qs.length*100))+'</div>';

  const stageLabel = {recognise:"Recognise the type", select:"Select the method", solve:"Solve", concept:"Concept"};
  qs.forEach((q,i) => {
    const chosen = quizState.answers[i], done = quizState.checked[i];
    const t = TOPIC_BY_ID[q.t];
    h += '<div class="quiz-q"><div class="badge-row" style="margin-bottom:7px">'+
      '<span class="stage-tag">'+esc(stageLabel[q.stage]||q.stage)+'</span>'+
      '<span class="pill low">Module '+q.m.slice(1)+'</span>'+
      (t?'<span class="pill marks">'+esc(clip(strip(t.title),30))+'</span>':'')+'</div>'+
      '<div style="font-weight:700;margin-bottom:8px">'+(i+1)+'. '+esc(q.q)+'</div>';
    q.o.forEach((o,oi) => {
      let cls = "quiz-opt";
      if(done){ if(oi === q.a) cls += " correct"; else if(oi === chosen) cls += " incorrect"; }
      else if(oi === chosen) cls += " chosen";
      h += '<button class="'+cls+'" data-qopt="'+oi+'" data-qi="'+i+'"'+(done?" disabled":"")+'>'+
        '<span class="mk">'+String.fromCharCode(65+oi)+'</span>'+esc(o)+'</button>';
    });
    if(done){
      const ok = chosen === q.a;
      h += '<div class="quiz-fb '+(ok?"correct":"incorrect")+'"><b>'+(ok?"Correct. ":"Not quite. ")+'</b>'+esc(q.e)+
        (t?' <button class="small" data-topic="'+t.id+'" style="margin-left:6px">Open topic</button>':'')+'</div>';
    } else {
      h += '<div class="reveal-row"><button class="small primary" data-qcheck="'+i+'">Check answer</button></div>';
    }
    h += '</div>';
  });
  const all = quizState.checked.every(Boolean);
  h += '<div class="btn-row"><button class="primary big" data-quizfinish="1"'+(all?"":" disabled")+'>'+
    (all?"Finish and see score":"Check every question to finish")+'</button>'+
    '<button data-quizreset="1">Abandon and restart</button></div>';
  return h;
}

let searchQ = "";
function searchIndex(){
  const idx = [];
  TOPICS.forEach(t => {
    const m = moduleOf(t.m);
    const base = "Module "+m.num+" → "+strip(t.title);
    idx.push({kind:"Topic", path:base, title:strip(t.title),
      text:strip(t.whatIs)+" "+strip(t.concept)+" "+t.needToKnow.map(strip).join(" ")+" "+t.summary, go:{topic:t.id}});
    (t.examples||[]).forEach(e => idx.push({kind:"Worked example", path:base+" → Practice",
      title:e.title, text:strip(e.q)+" "+e.category+" "+strip(e.answer), go:{topic:t.id, anchor:"ex_"+e.id}}));
    (t.practice||[]).forEach(p => idx.push({kind:"Practice", path:base+" → Practice",
      title:clip(strip(p.q),80), text:strip(p.q)+" "+strip(p.a), go:{topic:t.id, anchor:"pr_"+p.id}}));
    (t.questions||[]).forEach(q => idx.push({kind:"Likely question", path:base,
      title:q.q, text:q.q, go:{topic:t.id}}));
    idx.push({kind:"Recognition", path:base+" → Question recognition", title:"How to recognise: "+strip(t.title),
      text:t.recognition.clues.map(strip).join(" ")+" "+t.recognition.wording.join(" ")+" "+strip(t.recognition.trap),
      go:{topic:t.id}});
  });
  FORMULAE.forEach(g => g.items.forEach(it => idx.push({kind:"Formula", path:"Formulae → "+strip(g.g), title:strip(it.f),
    text:strip(it.f)+" "+strip(it.m)+" "+strip(it.w), go:{view:"formula"}})));
  REVIEW.forEach(r => idx.push({kind:"Quick Review", path:"Module "+r.m.slice(1)+" → Quick Review", title:strip(r.h),
    text:strip(r.b), go:{view:r.m, sub:"review"}}));
  QUIZ.forEach(q => idx.push({kind:"Quiz question", path:"Quiz", title:q.q, text:q.q+" "+q.e, go:{view:"quiz"}}));
  AB_MAP.rows.forEach(r => idx.push({kind:"A vs B", path:"COMP A vs COMP B", title:strip(r.topic),
    text:strip(r.topic)+" "+strip(r.note), go:{view:"compare"}}));
  return idx;
}
let SEARCH_INDEX = null;
function highlight(text, q){
  if(!q) return esc(text);
  const parts = q.trim().split(/\s+/).filter(Boolean).map(p => p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(!parts.length) return esc(text);
  let out = esc(text);
  parts.forEach(p => { out = out.replace(new RegExp("("+p+")","ig"), "<mark>$1</mark>"); });
  return out;
}
function vSearch(){
  if(!SEARCH_INDEX) SEARCH_INDEX = searchIndex();
  let h = '<h1>Search</h1><p class="lead">Searches topics, worked examples, practice questions, recognition clues, formulas and quick review.</p>';
  h += '<div class="toolbar"><input type="search" id="searchInput" placeholder="Search everything…" value="'+esc(searchQ)+'" '+
    'style="flex:1;min-width:220px;font-size:.95rem;padding:8px 11px" autocomplete="off"><span class="count" id="searchCount"></span></div>';
  h += '<div id="searchResults"></div>';
  return h;
}
function renderSearchResults(){
  const box = $("#searchResults"), cnt = $("#searchCount");
  if(!box) return;
  const q = searchQ.trim().toLowerCase();
  if(q.length < 2){ box.innerHTML = '<div class="empty">Type at least two characters.</div>'; if(cnt) cnt.textContent = ""; return; }
  const terms = q.split(/\s+/).filter(Boolean);
  const scored = [];
  SEARCH_INDEX.forEach(it => {
    const hay = (it.title+" "+it.text+" "+it.path).toLowerCase();
    let sc = 0, all = true;
    terms.forEach(t => {
      if(hay.indexOf(t) === -1){ all = false; return; }
      sc += 1;
      if(it.title.toLowerCase().indexOf(t) !== -1) sc += 3;
      if(it.path.toLowerCase().indexOf(t) !== -1) sc += 1;
    });
    if(all) scored.push({it, sc});
  });
  scored.sort((a,b) => b.sc - a.sc);
  if(cnt) cnt.textContent = scored.length + " result" + (scored.length===1?"":"s");
  if(!scored.length){ box.innerHTML = '<div class="empty">Nothing found for &ldquo;'+esc(searchQ)+'&rdquo;.</div>'; return; }
  box.innerHTML = scored.slice(0,60).map(s => {
    const it = s.it;
    const go = it.go.topic
      ? ' data-topic="'+it.go.topic+'"'+(it.go.anchor?' data-anchor="'+it.go.anchor+'"':'')
      : ' data-go="'+it.go.view+'"'+(it.go.sub?' data-gosub="'+it.go.sub+'"':'');
    return '<div class="sr-item"'+go+' role="button" tabindex="0">'+
      '<div class="sr-path">'+pill("marks",it.kind)+' '+esc(it.path)+'</div>'+
      '<div class="sr-title">'+highlight(it.title, searchQ)+'</div>'+
      '<div class="sr-snip">'+highlight(clip(it.text,190), searchQ)+'</div></div>';
  }).join("");
}

function goto(v, opts){
  opts = opts || {};
  view = v;
  if(opts.topic){ currentTopic = opts.topic; P.lastStudied = opts.topic; save(); }
  if(opts.anchor) pendingAnchor = opts.anchor;
  if(!opts.keepScroll) window.scrollTo(0,0);
  render();
}
function openTopic(id, anchor){
  const t = TOPIC_BY_ID[id];
  if(!t) return;
  if(anchor) revealed[anchor] = true;
  goto("topic", {topic:id, anchor:anchor});
}
/* re-render without losing the reader's place */
function rerender(){ const y = window.scrollY; render(); window.scrollTo(0, y); }

/* ------------------------------ EVENTS ------------------------------ */
document.addEventListener("click", function(e){
  const el = e.target.closest("button, a, .sr-item");
  if(!el) return;
  const d = el.dataset;

  if(d.topic){ openTopic(d.topic, d.anchor); return; }
  if(d.sub && d.mid){ subTab[d.mid] = d.sub; if(view === d.mid) rerender(); else goto(d.mid); return; }
  if(d.go){
    e.preventDefault();
    if(d.gosub && subTab[d.go] !== undefined) subTab[d.go] = d.gosub;
    goto(d.go);
    return;
  }

  /* reveal toggles (solutions, hints, answer skeletons) */
  if(d.reveal){
    const id = d.reveal;
    if(revealed[id]) delete revealed[id]; else revealed[id] = true;
    rerender();
    return;
  }
  /* question completion — the only thing that moves progress */
  if(d.exdone){
    if(P.examples[d.exdone]) delete P.examples[d.exdone];
    else { P.examples[d.exdone] = true; if(currentTopic) P.lastStudied = currentTopic; }
    save(); rerender(); return;
  }
  if(d.prdone){
    if(P.practice[d.prdone]) delete P.practice[d.prdone];
    else { P.practice[d.prdone] = true; if(currentTopic) P.lastStudied = currentTopic; }
    save(); rerender(); return;
  }

  /* quiz */
  if(d.quizstart){ buildQuiz(); goto("quiz"); return; }
  if(d.quizreset){ quizState = null; goto("quiz"); return; }
  if(d.qopt !== undefined && d.qi !== undefined){
    const i = +d.qi;
    if(quizState && !quizState.checked[i]){ quizState.answers[i] = +d.qopt; rerender(); }
    return;
  }
  if(d.qcheck !== undefined){
    const i = +d.qcheck;
    if(!quizState) return;
    if(quizState.answers[i] === null){ toast("Select an answer first."); return; }
    quizState.checked[i] = true;
    /* record immediately, so partial quizzes still count */
    const q = QUIZ[quizState.ids[i]];
    const correct = quizState.answers[i] === q.a;
    const bump = (obj, k) => { const v = obj[k] || {c:0,n:0}; v.n++; if(correct) v.c++; obj[k] = v; };
    bump(P.quizTopic, q.t); bump(P.quizStage, q.stage);
    save(); rerender();
    return;
  }
  if(d.quizfinish){ if(quizState){ quizState.done = true; save(); goto("quiz"); } return; }

  /* theme */
  if(d.theme){ setTheme(d.theme); rerender(); return; }

  /* topbar icons */
  if(el.id === "searchBtn"){ goto("search"); return; }
  if(el.id === "settingsBtn"){ goto("settings"); return; }
  if(el.id === "themeBtn"){
    const cur = document.documentElement.getAttribute("data-theme");
    const isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    setTheme(isDark ? "light" : "dark");
    rerender();
    return;
  }
  /* settings buttons */
  if(el.id === "exportBtn"){ doExport(); return; }
  if(el.id === "importBtn"){ $("#importFile").click(); return; }
  if(el.id === "resetBtn"){ askReset(); return; }
});

document.addEventListener("keydown", function(e){
  if(e.key === "/" && view !== "search" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); goto("search"); return;
  }
  if(e.key === "Enter" || e.key === " "){

/* ------------------ export / import / reset / theme ------------------ */
function doExport(){
  try{
    const payload = Object.assign({}, P, {
      _app:"ads-study-guide", _course:EXAM.code, _exportedAt:new Date().toISOString()
    });
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "ads-progress-"+today()+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("Progress exported.");
  }catch(err){ toast("Export is not supported in this browser."); }
}
function doImport(file){
  const r = new FileReader();
  r.onload = function(){
    let parsed;
    try{ parsed = JSON.parse(r.result); }
    catch(err){ toast("That is not valid JSON — nothing was changed."); return; }
    const v = validateProgress(parsed);
    if(!v.ok){ toast("Not a recognised progress file — nothing was changed."); return; }
    P = v.data; save(); render();
    toast("Progress imported — readiness now "+overallProgress().pct+"%.");
  };
  r.onerror = function(){ toast("Could not read that file."); };
  r.readAsText(file);
}
function askReset(){
  const ok = confirm("Reset all your ADS study progress?\n\nThis clears every question you have marked done and all quiz scores, in THIS BROWSER only.\n\nThe study material is not affected, and nobody else's progress is affected.\n\nThis cannot be undone. Export first if you may want it back.");
  if(!ok) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  P = blankProgress(); P.firstVisit = today();
  quizState = null; revealed = {};
  save(); goto("dashboard");
  toast("Progress reset. You are back at 0%.");
}
function setTheme(t){
  try{
    if(t === "system"){ localStorage.removeItem(THEME_KEY); document.documentElement.removeAttribute("data-theme"); }
    else { localStorage.setItem(THEME_KEY, t); document.documentElement.setAttribute("data-theme", t); }
  }catch(e){
    if(t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }
  toast(t === "dark" ? "Dark theme." : t === "light" ? "Light theme." : "Matching your system theme.");
}
function initTheme(){
  let t = null;
  try{ t = localStorage.getItem(THEME_KEY); }catch(e){}
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
}

/* ------------------------------- BOOT ------------------------------- */
initTheme();
load();
touchVisit();
render();

</script>
