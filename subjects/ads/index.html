<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADS MSE Study Guide</title>
<meta name="description" content="Mid-Semester Exam preparation for CEPEC7041 Applied Data Science. Modules 1–2, 30 marks, 1.5 hours. Built from the official syllabus, both COMP A and COMP B lecture decks, the class notes, the formula sheet and CIA-2. Progress saved locally in your browser.">
<style>
:root{
  --bg:#f5f7f9; --panel:#ffffff; --panel-2:#eef1f5; --panel-3:#e6eaf0;
  --ink:#161b24; --ink-soft:#4c5566; --ink-mute:#78out;
  --ink-mute:#78829a;
  --border:#dce1e9; --border-2:#c3cbd8;
  --accent:#1f5f8b; --accent-soft:#e8f1f8; --accent-dark:#14425f; --accent-line:#aecbe2;
  --good:#16794f; --good-soft:#e3f3ea; --good-line:#aedcc3;
  --bad:#a8322a; --bad-soft:#fbe9e7; --bad-line:#efc0ba;
  --warn:#8d6108; --warn-soft:#fdf3dc; --warn-line:#ebd39f;
  --violet:#5b4b9e; --violet-soft:#eeebf8; --violet-line:#c6bdea;
  --shadow:0 1px 2px rgba(15,20,30,.05), 0 1px 3px rgba(15,20,30,.04);
  --shadow-2:0 2px 6px rgba(15,20,30,.07), 0 8px 24px rgba(15,20,30,.05);
  --radius:9px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  --bg:#11141a; --panel:#191d25; --panel-2:#212632; --panel-3:#2a3040;
  --ink:#e7eaf0; --ink-soft:#a9b1c0; --ink-mute:#7f8899;
  --border:#282e3a; --border-2:#39414f;
  --accent:#7cb4da; --accent-soft:#16283a; --accent-dark:#9bc9e8; --accent-line:#2e4d68;
  --good:#57c78c; --good-soft:#11281c; --good-line:#204a31;
  --bad:#ec8b7e; --bad-soft:#2a1512; --bad-line:#56221b;
  --warn:#e0af57; --warn-soft:#291f0d; --warn-line:#53401a;
  --violet:#a495e8; --violet-soft:#1d1a30; --violet-line:#3b3363;
  --shadow:0 1px 3px rgba(0,0,0,.45);
  --shadow-2:0 4px 16px rgba(0,0,0,.5);
 }
}
:root[data-theme="dark"]{
  --bg:#11141a; --panel:#191d25; --panel-2:#212632; --panel-3:#2a3040;
  --ink:#e7eaf0; --ink-soft:#a9b1c0; --ink-mute:#7f8899;
  --border:#282e3a; --border-2:#39414f;
  --accent:#7cb4da; --accent-soft:#16283a; --accent-dark:#9bc9e8; --accent-line:#2e4d68;
  --good:#57c78c; --good-soft:#11281c; --good-line:#204a31;
  --bad:#ec8b7e; --bad-soft:#2a1512; --bad-line:#56221b;
  --warn:#e0af57; --warn-soft:#291f0d; --warn-line:#53401a;
  --violet:#a495e8; --violet-soft:#1d1a30; --violet-line:#3b3363;
  --shadow:0 1px 3px rgba(0,0,0,.45);
  --shadow-2:0 4px 16px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.58;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
a{color:var(--accent)}
img,svg{max-width:100%}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* ---------- topbar ---------- */
header.topbar{background:var(--panel);border-bottom:1px solid var(--border);
 position:sticky;position:-webkit-sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(15,20,30,.06)}
:root[data-theme="dark"] header.topbar{box-shadow:0 1px 10px rgba(0,0,0,.4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) header.topbar{box-shadow:0 1px 10px rgba(0,0,0,.4)}}
.topbar-inner{max-width:1140px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:.92rem;white-space:nowrap;line-height:1.2;cursor:pointer;background:none;border:none;
 color:var(--ink);padding:0 2px 0 0;text-align:left;font-family:inherit;letter-spacing:-.01em}
.brand:hover{background:none;color:var(--accent)}
nav.maintabs{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
nav.maintabs button{background:none;border:1px solid transparent;color:var(--ink-soft);
 padding:5px 9px;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:620;font-family:inherit;white-space:nowrap}
nav.maintabs button:hover{background:var(--accent-soft);color:var(--ink)}
nav.maintabs button.active{background:var(--accent);color:#fff}
:root[data-theme="dark"] nav.maintabs button.active{color:#0e1620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.maintabs button.active{color:#0e1620}}
.icon-btn{width:31px;height:31px;padding:0;display:inline-flex;align-items:center;justify-content:center;
 border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer;font-size:.9rem}
.icon-btn:hover{background:var(--panel-2)}
main{max-width:1140px;margin:0 auto;padding:20px 16px 80px}

/* ---------- typography ---------- */
h1{font-size:1.5rem;margin:.1rem 0 .3rem;letter-spacing:-.015em;line-height:1.25}
h2{font-size:1.14rem;margin:1.8rem 0 .7rem;border-bottom:2px solid var(--accent-soft);padding-bottom:6px;letter-spacing:-.01em}
h3{font-size:1.01rem;margin:1.2rem 0 .45rem;letter-spacing:-.005em}
h4{font-size:.74rem;margin:1.05rem 0 .35rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-mute);font-weight:750}
p{margin:.5rem 0}
.lead{color:var(--ink-soft);font-size:.92rem;margin:.35rem 0 1.15rem;max-width:74ch}
code{font-family:var(--mono);font-size:.86em;background:var(--panel-2);padding:.08em .34em;border-radius:4px;border:1px solid var(--border)}
.muted{color:var(--ink-mute);font-size:.78rem}
strong,b{font-weight:700}

/* ---------- cards & layout ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
 padding:15px 17px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.tight{padding:12px 14px}
.grid{display:grid;gap:12px}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;text-align:center}
.stat .num{font-size:1.55rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .label{font-size:.66rem;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.05em;margin-top:3px;font-weight:700}
.stat .sub{font-size:.72rem;color:var(--ink-soft);margin-top:3px}
.progressbar{background:var(--border);border-radius:20px;height:7px;overflow:hidden;margin-top:7px}
.progressbar>div{background:var(--accent);height:100%;transition:width .35s}
.progressbar.good>div{background:var(--good)}
.progressbar.bad>div{background:var(--bad)}
.progressbar.warn>div{background:var(--warn)}

/* ---------- subtabs ---------- */
.subtabs{display:flex;gap:2px;flex-wrap:wrap;margin:14px 0 16px;border-bottom:1px solid var(--border)}
.subtabs button{background:none;border:none;border-bottom:3px solid transparent;color:var(--ink-soft);
 padding:8px 12px;cursor:pointer;font-size:.85rem;font-weight:650;font-family:inherit}
.subtabs button:hover{color:var(--ink)}
.subtabs button.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ---------- buttons ---------- */
button,.btn{font-family:inherit;font-size:.83rem;padding:6px 12px;border-radius:6px;
 border:1px solid var(--border-2);background:var(--panel);color:var(--ink);cursor:pointer;font-weight:640}
button:hover{background:var(--panel-2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
:root[data-theme="dark"] button.primary{color:#0e1620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#0e1620}}
button.small{padding:3px 9px;font-size:.75rem}
button.big{padding:9px 18px;font-size:.9rem}
button:disabled{opacity:.42;cursor:default}
button.sel-good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
button.sel-warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
button.sel-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

/* ---------- pills / badges ---------- */
.pill{display:inline-block;font-size:.64rem;font-weight:800;padding:2px 8px;border-radius:20px;
 text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;border:1px solid transparent;vertical-align:middle}
.pill.common{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.pill.bonly{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.aonly{background:var(--panel-2);color:var(--ink-mute);border-color:var(--border-2)}
.pill.high{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.pill.medium{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.low{background:var(--panel-2);color:var(--ink-mute);border-color:var(--border)}
.pill.marks{background:var(--panel-2);color:var(--ink-soft);border-color:var(--border)}
.pill.lo{background:var(--violet-soft);color:var(--violet);border-color:var(--violet-line)}
.pill.num{background:var(--violet-soft);color:var(--violet);border-color:var(--violet-line)}
.pill.theory{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.done{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.pill.prog{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.basic{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.pill.standard{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.moderate{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.challenging{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.pill.highvalue{background:var(--violet-soft);color:var(--violet);border-color:var(--violet-line)}
.pill.src{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.pill.pred{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.badge-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}

/* ---------- topic cards ---------- */
.topic{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
 padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow);border-left:4px solid var(--border-2)}
.topic.p-high{border-left-color:var(--accent)}
.topic.p-medium{border-left-color:var(--border-2)}
.topic.p-low{border-left-color:var(--border)}
.topic.is-done{border-left-color:var(--good)}
.topic .qmeter{display:flex;align-items:center;gap:9px;margin-top:8px}
.topic .qmeter .progressbar{flex:1;margin:0}
.topic .qmeter .qn{font-size:.75rem;color:var(--ink-mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.topic .th{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.topic .tt{font-weight:700;font-size:.98rem;flex:1;min-width:190px;line-height:1.4}
.topic .tsum{font-size:.86rem;color:var(--ink-soft);margin:.2rem 0 .6rem}
.status-dot{font-family:var(--mono);font-weight:800;font-size:.9rem;margin-right:2px}
.status-dot.done{color:var(--good)} .status-dot.prog{color:var(--warn)} .status-dot.none{color:var(--ink-mute)}

/* ---------- boxes ---------- */
.box{border-radius:7px;padding:10px 13px;margin:10px 0;font-size:.88rem;line-height:1.58}
.box>h5{margin:0 0 .4rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:800}
.box p:first-of-type{margin-top:0} .box p:last-child{margin-bottom:0}
.box ul,.box ol{margin:.4rem 0;padding-left:1.25rem}
.box li{margin-bottom:.3rem}
.box.recog{background:var(--violet-soft);border-left:3px solid var(--violet)}
.box.recog>h5{color:var(--violet)}
.box.exam{background:var(--accent-soft);border-left:3px solid var(--accent)}
.box.exam>h5{color:var(--accent)}
.box.mistake{background:var(--bad-soft);border-left:3px solid var(--bad)}
.box.mistake>h5{color:var(--bad)}
.box.tip{background:var(--good-soft);border-left:3px solid var(--good)}
.box.tip>h5{color:var(--good)}
.box.warn{background:var(--warn-soft);border-left:3px solid var(--warn)}
.box.warn>h5{color:var(--warn)}
.box.neutral{background:var(--panel-2);border-left:3px solid var(--border-2)}
.box.neutral>h5{color:var(--ink-mute)}

/* ---------- formula / flow ---------- */
.formula{background:var(--panel-2);border:1px solid var(--border);border-left:4px solid var(--accent);
 border-radius:5px;padding:11px 14px;margin:10px 0;font-family:var(--mono);font-size:.83rem;
 line-height:1.65;white-space:pre-wrap;overflow-x:auto}
.flow{background:var(--accent-soft);border-radius:7px;padding:11px 14px;margin:10px 0;
 font-family:var(--mono);font-size:.76rem;line-height:1.5;white-space:pre;overflow-x:auto}
.answer{background:var(--good-soft);border:1px solid var(--good-line);color:var(--good);
 border-radius:7px;padding:9px 13px;margin:10px 0;font-weight:700;font-size:.89rem}
.answer b{color:var(--good)}

/* ---------- tables ---------- */
.scroll{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch;border-radius:6px}
table.t{border-collapse:collapse;font-size:.82rem;margin:0;min-width:100%}
table.t th,table.t td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--accent-soft);font-weight:730;white-space:nowrap}
table.t tbody tr:nth-child(even){background:var(--panel-2)}
table.t td code{white-space:nowrap}
table.t.num td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.95em}
ul.list,ol.list{margin:.5rem 0;padding-left:1.3rem;font-size:.9rem}
ul.list li,ol.list li{margin-bottom:.32rem}

/* ---------- steps ---------- */
ol.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0}
ol.steps li{counter-increment:s;position:relative;padding:9px 0 9px 36px;border-bottom:1px dashed var(--border);font-size:.88rem}
ol.steps li:last-child{border-bottom:none}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:25px;height:25px;border-radius:50%;
 background:var(--accent-soft);color:var(--accent);font:800 .72rem/25px var(--mono);text-align:center;border:1px solid var(--accent-line)}

/* ---------- reveal ---------- */
.reveal-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}
.hidden-body{display:none;padding-top:11px;border-top:1px dashed var(--border);margin-top:11px}
.hidden-body.show{display:block}
.hidden-body>*:first-child{margin-top:0}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;
 background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px;box-shadow:var(--shadow)}
.toolbar select,.toolbar input[type=search],.toolbar input[type=text]{
 padding:5px 9px;border-radius:6px;border:1px solid var(--border-2);background:var(--panel);
 color:var(--ink);font-size:.83rem;font-family:inherit;max-width:100%}
.toolbar label{font-size:.76rem;font-weight:730;color:var(--ink-soft)}
.count{margin-left:auto;font-size:.77rem;color:var(--ink-mute);font-variant-numeric:tabular-nums}

/* ---------- quiz ---------- */
.quiz-q{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.quiz-q:last-of-type{border-bottom:none}
.quiz-opt{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 11px;font-weight:500;line-height:1.45}
.quiz-opt .mk{font-family:var(--mono);font-weight:800;margin-right:8px;font-size:.8rem}
.quiz-opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.quiz-opt.incorrect{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.quiz-opt.chosen{background:var(--accent-soft);border-color:var(--accent)}
.quiz-fb{margin-top:10px;font-size:.86rem;padding:10px 12px;border-radius:7px;line-height:1.58}
.quiz-fb.correct{background:var(--good-soft);border-left:3px solid var(--good)}
.quiz-fb.incorrect{background:var(--bad-soft);border-left:3px solid var(--bad)}
.stage-tag{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
 color:var(--violet);background:var(--violet-soft);border:1px solid var(--violet-line);padding:2px 8px;border-radius:20px}

/* ---------- search ---------- */
.sr-item{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:10px 13px;margin-bottom:8px;
 cursor:pointer;box-shadow:var(--shadow)}
.sr-item:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.sr-path{font-size:.71rem;color:var(--ink-mute);font-family:var(--mono);margin-bottom:3px}
.sr-title{font-weight:700;font-size:.9rem}
.sr-snip{font-size:.81rem;color:var(--ink-soft);margin-top:3px}
mark{background:var(--warn-soft);color:var(--ink);padding:0 2px;border-radius:3px;font-weight:650}

/* ---------- misc ---------- */
.empty{text-align:center;padding:30px 16px;color:var(--ink-mute);font-size:.88rem;
 border:1px dashed var(--border-2);border-radius:var(--radius);background:var(--panel)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(180%);
 background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:.85rem;font-weight:640;
 box-shadow:0 4px 20px rgba(0,0,0,.28);z-index:400;transition:transform .28s;max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
footer{text-align:center;color:var(--ink-mute);font-size:.76rem;padding:28px 16px;line-height:1.75;
 border-top:1px solid var(--border);margin-top:30px}
details{border:1px solid var(--border);border-radius:7px;margin:9px 0;background:var(--panel);overflow:hidden}
details>summary{cursor:pointer;padding:9px 12px;font-weight:660;font-size:.86rem;list-style:none;
 background:var(--panel-2);display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"\25B8";font-size:.75rem;color:var(--ink-mute);transition:transform .15s;flex:none}
details[open]>summary::before{transform:rotate(90deg)}
.dbody{padding:12px 14px;border-top:1px solid var(--border)}
.dbody>*:first-child{margin-top:0} .dbody>*:last-child{margin-bottom:0}
.banner{border-radius:var(--radius);padding:13px 16px;margin-bottom:14px;font-size:.88rem;line-height:1.6}
.banner.info{background:var(--accent-soft);border:1px solid var(--accent-line)}
.banner.alert{background:var(--warn-soft);border:1px solid var(--warn-line)}
.banner b{font-weight:800}
.kbd{font-family:var(--mono);font-size:.75rem;background:var(--panel-2);border:1px solid var(--border-2);
 border-bottom-width:2px;border-radius:4px;padding:1px 5px}
.dtree{font-family:var(--mono);font-size:.76rem;line-height:1.6;white-space:pre;overflow-x:auto;
 background:var(--panel-2);border:1px solid var(--border);border-radius:7px;padding:12px 14px;margin:10px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
@media(max-width:700px){
 h1{font-size:1.24rem}
 nav.maintabs button{padding:5px 8px;font-size:.78rem}
 main{padding:15px 12px 60px}
 .count{margin-left:0}
 .toolbar{gap:6px}
 .card{padding:13px 14px}
}
@media print{
 header.topbar,.subtabs,.reveal-row,.toolbar,button,footer{display:none!important}
 .hidden-body{display:block!important}
 body{background:#fff}
 .card,.topic{break-inside:avoid;box-shadow:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" data-go="dashboard">ADS MSE Study Guide</button>
    <nav class="maintabs" id="mainNav" aria-label="Main sections">
      <button data-go="dashboard" class="active">Dashboard</button>
      <button data-go="m1">Module 1</button>
      <button data-go="m2">Module 2</button>
      <button data-go="recognition">Recognition</button>
      <button data-go="quiz">Quiz</button>
      <button data-go="formula">Formulae</button>
      <button data-go="exam">Exam Mode</button>
      <button data-go="compare">A vs B</button>
    </nav>

   <b>3. Complexity</b> — how hard the question is to answer; extracting meaningful patterns from such data is challenging, especially when formats are mixed.<br><br>
   <i>Add one line: falling storage/processing cost plus rising capture and granularity is <b>why</b> volume exploded.</i>`},
  {id:"p_m1t2_2", d:"standard", marks:5, q:"A ride-hailing company logs 8 crore trips per month. Each trip record has 45 fields, plus a GPS trace, a driver photo and free-text rider feedback. Identify and justify the characteristics that motivate a data science approach.",
   hint:"Same table structure as Apollo.",
   a:`<div class="scroll"><table class="t"><thead><tr><th>Characteristic</th><th>Justification</th></tr></thead><tbody>
   <tr><td><b>High Volume</b></td><td>8 crore trip records <i>per month</i>, so the dataset grows continuously and manual or spreadsheet analysis is impossible.</td></tr>
   <tr><td><b>High Dimensionality</b></td><td>45 structured fields per trip, before the unstructured additions — high-dimensional data requiring vector/matrix representation, and vulnerable to the curse of dimensionality.</td></tr>
   <tr><td><b>High Complexity</b></td><td>Mixed formats — structured fields, a GPS trace (spatio-temporal sequence), an image, and free text — plus interactions between them (e.g. route taken vs feedback sentiment). Traditional analysis handles none of these together.</td></tr>
   </tbody></table></div>
   <i>Closing line worth a mark: because the questions asked of this data (predict demand, price dynamically, detect fraud) are themselves complex, both <b>exploratory</b> and <b>confirmatory</b> analysis are needed — Tukey's point.</i>`},
  {id:"p_m1t2_3", d:"moderate", marks:5, q:"Compare confirmatory and exploratory analysis. Why does the lecture insist we need both?",

   a:`<div class="scroll"><table class="t"><thead><tr><th>Aspect</th><th>Confirmatory</th><th>Exploratory</th></tr></thead><tbody>
   <tr><td>Associated with</td><td>Traditional statistical analysis</td><td>Machine learning</td></tr>
   <tr><td>What it does</td><td>Validates a hypothesis you already hold</td><td>Searches for an algorithmic model predicting output from inputs</td></tr>
   <tr><td>Hypotheses</td><td>Tests one</td><td>Generates a multitude, running recursively and learning from each cycle's predictive errors</td></tr>
   <tr><td>Best at</td><td>Simple relationships between a response and its inputs</td><td>Large, high-dimension search spaces</td></tr>
   <tr><td>Breaks down when</td><td>Data gets large and complex</td><td>You need a defensible causal claim, not just a pattern</td></tr>
   </tbody></table></div>
   <b>Why both:</b> exploratory methods find candidate patterns in data too large and high-dimensional for a human to hypothesise about; confirmatory methods are what establish whether a specific pattern is real and not an artefact. Neither replaces the other — the lecture quotes <b>John Tukey (1980): “We need both exploratory and confirmatory.”</b>`}],

 id:"m1t4", m:"m1", title:"The Data Science Process (CRISP-DM, 5 steps)",

 concept:`<h4>The four common process frameworks</h4>
<div class="scroll"><table class="t"><thead><tr><th>Framework</th><th>Expansion</th><th>Origin</th></tr></thead><tbody>
<tr><td><b>CRISP-DM</b></td><td>Cross Industry Standard Process for Data Mining</td><td>Data-mining consortium, 2000 — <b>the most widely adopted</b></td></tr>
<tr><td><b>SEMMA</b></td><td>Sample, Explore, Modify, Model, Assess</td><td>SAS Institute</td></tr>
<tr><td><b>DMAIC</b></td><td>Define, Measure, Analyze, Improve, Control</td><td>Six Sigma practice</td></tr>
<tr><td><b>KDD</b></td><td>Selection, Preprocessing, Transformation, Data Mining, Interpretation, Evaluation</td><td>Knowledge Discovery in Databases</td></tr>
</tbody></table></div>
<div class="box neutral"><h5>CRISP-DM's own five phases</h5>
<p style="margin:0">1. Problem Understanding (define business goals and success criteria) → 2. Prepare the Data (collect, clean, sample) → 3. Develop the Model (select and train candidates) → 4. Apply the Model (test performance on real-world data) → 5. Deploy &amp; Maintain (operationalize and monitor over time).</p></div>

<h4>Step 1 — Prior Knowledge</h4>
<p>Information already known about a subject. The process begins here, <b>before any data is touched</b>. A data science problem does not arise in isolation — it is built on existing subject-matter expertise, business context and historical understanding. It has four parts:</p>
<div class="scroll"><table class="t"><thead><tr><th>Sub-step</th><th>What it covers</th></tr></thead><tbody>
<tr><td><b>1.1 Objective</b></td><td>The process starts with a business objective or analytical question — <b>the most important step in the lifecycle</b>. A clear objective helps identify the right data, select appropriate algorithms and align analysis with business goals. Example: “Can we predict the interest rate for a new borrower using past loan data?”</td></tr>
<tr><td><b>1.2 Subject Area (domain knowledge)</b></td><td>Data science reveals many patterns but not all are valid — false/spurious patterns are common. The data scientist must identify relevant patterns and reject misleading correlations. <i>“Data reveals patterns, but domain knowledge decides which patterns matter.”</i></td></tr>
<tr><td><b>1.3 Data</b></td><td>Understand how data is collected, stored, transformed and reported. Review what is available and identify gaps. Key factors: data quality and quantity, availability and gaps, and whether limitations require <b>changing the business question</b>. <i>“A model is only as good as the data used to build it.”</i></td></tr>
<tr><td><b>1.4 Correlation vs Causation</b></td><td>Correlation indicates a statistical relationship; causation implies one variable directly influences another. <b>Correlation does not guarantee causation.</b> Example: “Can a borrower's credit score be predicted using interest rate?” is technically possible but business-wise incorrect — the causal direction is <b>credit score → interest rate</b>.</td></tr>
</tbody></table></div>

<h4>Step 2 — Preparation (explore, clean, transform, split)</h4>
<p>Covered in full in the next topic. In brief: <b>2.1 Data Exploration</b> uses descriptive statistics and visualization to expose the dataset's structure; <b>2.2 Data Preparation</b> cleans the five classes of problem and then transforms the data for the algorithm.</p>

<h4>Step 3 — Modeling</h4>
<p>Building a representative model, abstracted from training data and validated against test data. Includes the train/test split, cross-validation, ensemble modeling and bootstrapping — all in the Model Building topic.</p>

<h4>Step 4 — Application (deployment)</h4>
<p>Deployment is where a model becomes production-ready. Assessed across <b>five dimensions</b>:</p>
<div class="scroll"><table class="t"><thead><tr><th>Dimension</th><th>What it means</th></tr></thead><tbody>
<tr><td><b>Production readiness</b></td><td>Real-time credit decisions vs batch-processed customer segmentation — the use case sets the bar.</td></tr>
<tr><td><b>Technical integration</b></td><td>Models port via PMML or by invoking the data science tool directly inside production applications.</td></tr>
<tr><td><b>Response time</b></td><td>k-NN is slow to predict but fast to build; decision trees are the reverse — trade-offs must be weighed.</td></tr>
<tr><td><b>Model refresh</b></td><td>Conditions change after deployment; test error routinely and refresh when it exceeds a threshold.</td></tr>
<tr><td><b>Assimilation</b></td><td>Translate findings into organizational knowledge — quantify risk and business impact, not just the model.</td></tr>
</tbody></table></div>

<h4>Step 5 — Knowledge</h4>
<p>From prior knowledge to <b>posterior knowledge</b> — the incremental insight gained. Not all discovered patterns lead to incremental knowledge; it is up to the practitioner to invalidate spurious, irrelevant signals. The process is <b>a framework to invoke the right questions</b>, not a set of rigid rules — a set of iterative, distinct steps that aid knowledge discovery.</p>`,

    "<b>2 · Preparation.</b> Explore the five records; scale usage to a z-score so it is comparable with tenure; recode churn from Yes/No to 1/0; confirm no missing values remain. Hold back the unlabelled customer C005 as the test row.",
    "<b>3 · Modeling.</b> Train on the four labelled customers. The learned rule from the deck is: <b>Support Calls ≥ 4 → predict Churn.</b> Test on C005, who made 2 support calls → predict “No churn”, which matches the actual outcome. 1 correct out of 1 test row.",
    "<b>4 · Application.</b> Wire the rule into the CRM so that any customer whose support-call count crosses 4 is flagged automatically, in real time.",
    "<b>5 · Knowledge &amp; actions.</b> Flagged customers get a proactive retention call and a loyalty discount before they consider leaving."],
   answer:`<div class="scroll"><table class="t"><thead><tr><th>Step</th><th>Applied to telecom churn</th></tr></thead><tbody>
   <tr><td><b>1. Prior Knowledge</b></td><td>Objective: predict subscription cancellation. Domain: understand the telecom business and what decision the prediction drives. Data: usage, tenure, support calls, churn label. Causation: support calls plausibly drive churn, not the reverse.</td></tr>
   <tr><td><b>2. Preparation</b></td><td>Usage scaled to a z-score; churn recoded as 0/1; no missing values remain; C005 held out as the unlabelled test row.</td></tr>
   <tr><td><b>3. Modeling</b></td><td>Train on C001–C004. Learned rule: <b>Support Calls ≥ 4 → Churn</b>. Test C005 (2 calls) → predicted “No churn” = actual. ✓</td></tr>
   <tr><td><b>4. Application</b></td><td>Rule deployed into the CRM; customers crossing 4 support calls are flagged automatically in real time.</td></tr>
   <tr><td><b>5. Knowledge</b></td><td>Flagged customers receive a proactive retention call and a loyalty discount — the insight becomes an organizational action.</td></tr>
   </tbody></table></div>
   <i>Note how small the “model” is. The examiner is testing the <b>process</b>, not the sophistication of the algorithm.</i>`,
   why:"The five steps map onto any scenario because they are organised around <em>what you know</em> (1), <em>what you have</em> (2), <em>what you build</em> (3), <em>where it runs</em> (4) and <em>what you learned</em> (5).",
   trap:"Spending the whole answer on step 3. Steps 1 and 2 carry more marks in this course — data preparation is roughly 80% of the real work, and the syllabus gives it its own sub-topic."}],
 practice:[
  {id:"p_m1t4_1", d:"basic", marks:5, q:"Explain the data science process with a neat labelled diagram.",
   hint:"Five boxes, arrows, labels on the right.",
   a:`<div class="flow">   Business understanding      Data understanding
             \\                    /
              \\                  /            1. PRIOR KNOWLEDGE
               v                v
                 [ Prepare data ]              2. PREPARATION
                        |
                        v
 Training data -> [ Build model using algorithms ]
                        |                       3. MODELING
                        v
 Testing data  -> [ Apply model & evaluate performance ]
                        |
                        v
                  [ Deployment ]                4. APPLICATION
                        |
                        v
              [ Knowledge & actions ]           5. KNOWLEDGE</div>
   <b>1. Prior Knowledge</b> — what is already known about the subject, business context and data, before any data is touched. Sub-steps: objective, subject area, data, correlation vs causation.<br>
   <b>2. Preparation</b> — explore the data, clean it (duplicates, missing, invalid, inconsistent, outliers), transform it (encoding, normalization, feature selection, sampling) and split into train/test.<br>
   <b>3. Modeling</b> — build a representative model from training data using learning algorithms; validate it on test data.<br>
   <b>4. Application</b> — deploy the model into production and monitor it; refresh when test error exceeds a threshold.<br>
   <b>5. Knowledge</b> — the incremental (posterior) knowledge gained; invalidate spurious signals and turn valid findings into action.<br><br>
   <b>Closing line:</b> the process is not a rigid set of rules but a set of <b>iterative</b>, distinct steps that aid knowledge discovery.`},
  {id:"p_m1t4_2", d:"standard", marks:5, q:"What is Prior Knowledge? Explain its four components using the loan interest rate example.",
   hint:"Objective, subject area, data, causation.",
   a:`<b>Prior knowledge</b> is information already known about a subject or domain. The data science process begins here, before any data is touched; a data science problem never arises in isolation but is built on existing subject-matter expertise, business context and historical understanding.<br><br>
   <b>1. Objective</b> — the business objective or analytical question, and the most important step in the lifecycle. Here: <i>“Can we predict the interest rate for a new borrower using past loan data?”</i> A clear objective identifies the right data, the right algorithms, and keeps the analysis aligned to business goals.<br><br>
   <b>2. Subject area (domain knowledge)</b> — to predict interest rate you must be able to answer: how does the lending business actually work; why does this prediction matter and what decision does it drive; what data can be collected from borrowers; what cannot be, due to regulation or policy; what external factors also move the rate. Domain knowledge is what lets you reject spurious patterns.<br><br>
   <b>3. Data</b> — review the available borrower records (credit score, annual income, state, interest rate); check quality and quantity, identify gaps and missing values, and decide whether limitations mean the business question must change.<br><br>
   <b>4. Correlation vs causation</b> — the model must run in the correct causal direction. <i>“Can a borrower's credit score be predicted using interest rate?”</i> is technically possible but business-wise incorrect: the true direction is <b>credit score → interest rate</b>. Correlation does not guarantee causation.`},
  {id:"p_m1t4_3", d:"moderate", marks:5, q:"Name four data science process frameworks, expand each acronym, and state which is most widely adopted.",
   hint:"CRISP-DM, SEMMA, DMAIC, KDD.",
   a:`<div class="scroll"><table class="t"><thead><tr><th>Framework</th><th>Expansion</th><th>Origin</th></tr></thead><tbody>
   <tr><td><b>CRISP-DM</b></td><td>Cross Industry Standard Process for Data Mining</td><td>Data-mining consortium, 2000</td></tr>
   <tr><td><b>SEMMA</b></td><td>Sample, Explore, Modify, Model, Assess</td><td>SAS Institute</td></tr>
   <tr><td><b>DMAIC</b></td><td>Define, Measure, Analyze, Improve, Control</td><td>Six Sigma practice</td></tr>
   <tr><td><b>KDD</b></td><td>Selection, Preprocessing, Transformation, Data Mining, Interpretation, Evaluation</td><td>Knowledge Discovery in Databases</td></tr>
   </tbody></table></div>
   <b>CRISP-DM is the most widely adopted</b> framework for developing data science solutions (Chapman et al., 2000). Its five phases are: Problem Understanding → Prepare the Data → Develop the Model → Apply the Model → Deploy &amp; Maintain, which map directly onto the five-step process taught in class.`},
  {id:"p_m1t4_4", d:"standard", marks:5, q:"Explain the Application (deployment) step across its five dimensions, and explain what “model refresh” protects against.",
   hint:"Five named dimensions.",
   a:`Deployment is where a model becomes production-ready. It is assessed across five dimensions:<br><br>
   <b>1. Production readiness</b> — the use case sets the bar. Real-time credit decisions demand far more than batch-processed customer segmentation.<br>
   <b>2. Technical integration</b> — models port via PMML or by invoking the data science tool directly inside production applications.<br>
   <b>3. Response time</b> — k-NN is slow to predict but fast to build; decision trees are the reverse. The trade-off must match the use case.<br>
   <b>4. Model refresh</b> — conditions change after deployment, so test error must be measured routinely and the model refreshed when error exceeds a threshold.<br>
   <b>5. Assimilation</b> — translate findings into organizational knowledge; quantify risk and business impact, not just model accuracy.<br><br>
   <b>What model refresh protects against:</b> the world drifting away from the data the model was trained on. A model trained on pre-pandemic commuting or spending patterns silently degrades as behaviour changes — accuracy falls even though the model itself has not changed. Routine error testing detects the drift; refreshing retrains the model on current data.`}],

 whatIs:`<p>Real-world data is messy. <b>Exploration</b> is how the problems get found; <b>preparation</b> is how they get fixed. Roughly <b>80% of a data scientist's time is spent cleaning data, not building models</b> — a figure both classes quote, and one COMP A's revision quiz asks directly.</p>`,

 concept:`<h4>Step 2.1 — Data exploration finds the problems</h4>
<p>Descriptive statistics plus a visualization expose the dataset's structure. In the lecture's 14-row loan dataset:</p>
<div class="scroll"><table class="t num"><thead><tr><th>Field</th><th>Mean</th><th>Median</th><th>Std Dev</th></tr></thead><tbody>
<tr><td>Credit Score</td><td>699.6</td><td>700</td><td>110.8</td></tr>
<tr><td>Interest Rate (%)</td><td>6.20</td><td>6.25</td><td>0.60</td></tr>
<tr><td>Annual Income</td><td>1,63,539</td><td>71,500</td><td>large</td></tr>
</tbody></table></div>
<div class="box tip"><h5>The diagnostic reasoning — learn this move</h5>
<p style="margin:0">For credit score and interest rate, <b>mean and median are close</b>, so no skew. But the income mean is <b>more than double its median</b> — a red flag that a single extreme value is dragging the average up. A scatterplot then shows a credit score of 900, which is off the valid 300–850 scale. <b>This is Module 2's skewness logic being used in Module 1</b>, and it is exactly the kind of cross-module link that scores well.</p></div>

<h4>Step 2.2 — Cleaning: the five problems</h4>
<div class="scroll"><table class="t"><thead><tr><th>Issue</th><th>What it looks like</th><th>Found in the lecture's data</th><th>Fix applied</th></tr></thead><tbody>
<tr><td><b>Duplicate records</b></td><td>The same entity appears more than once, inflating counts and skewing statistics</td><td>Borrower 04's row repeated</td><td>Dropped the repeated row — 14 rows became 13</td></tr>
<tr><td><b>Inconsistent values</b></td><td>The same fact recorded different ways</td><td>“New York” where every other row says “NY”</td><td>Standardized to “NY” — one canonical state code</td></tr>
<tr><td><b>Missing values</b></td><td>Gaps in the data — identified during exploration, fixed during preparation</td><td>Borrower 11's income blank</td><td>Imputed with the dataset median (₹71,250)</td></tr>
<tr><td><b>Invalid data</b></td><td>Impossible values, like a credit score of 900 or a negative age</td><td>Borrower 12's score = 900, outside the valid 300–850 range</td><td>Capped to the valid maximum, 850</td></tr>
<tr><td><b>Outliers</b></td><td>Extreme values that may be errors — <i>or the very thing you are modelling for</i></td><td>Borrower 13's income = ₹12,50,000</td><td><b>Flagged, not deleted</b> — kept for analysis and treated later</td></tr>
</tbody></table></div>

<h4>Step 2.2 — Transforming: the five operations</h4>
<div class="scroll"><table class="t"><thead><tr><th>Operation</th><th>What it does</th><th>Worked detail from the lecture</th></tr></thead><tbody>
<tr><td><b>Data types &amp; conversion</b></td><td>Numeric, categorical, or converted via encoding or binning</td><td>State → label encoding: NY = 0, CA = 1, TX = 2, FL = 3. Ordinal encoding example: poor = 400.</td></tr>
<tr><td><b>Transformation (normalization)</b></td><td>Scales attributes to a uniform 0–1 range so that one attribute does not dominate purely because its numbers are bigger</td><td>Income (in lakhs) vs credit score (hundreds) — log-transform income, then normalize both to 0–1.</td></tr>
<tr><td><b>Feature selection</b></td><td>Reduce attributes without losing performance — <b>mitigates the curse of dimensionality</b></td><td><i>Kept:</i> credit_score, income_log, interest_rate (target). <i>Dropped:</i> borrower_id (a unique identifier) and the raw state text.</td></tr>
<tr><td><b>Data sampling</b></td><td>A representative subset speeds up modeling; <b>stratified sampling</b> balances rare classes</td><td>Used when the full dataset is too large to model quickly.</td></tr>
<tr><td><b>Training / test split</b></td><td>Hold data back so the model can be scored on records it never saw</td><td><b>Rule of thumb: two-thirds training, one-third testing.</b> The lecture splits 13 clean records into 9 train / 4 test (69% / 31%).</td></tr>
</tbody></table></div>
<div class="box warn"><h5>Why borrower_id is dropped — a favourite short question</h5>
<p style="margin:0">A unique identifier is different for every record, so it can perfectly “explain” the training data while carrying <b>zero</b> predictive information about a new borrower. COMP A's revision quiz asks exactly this in the form <i>“Which feature is least useful for predicting employee salary?”</i> — the answer is <b>Employee ID</b>.</p></div>`,

  short:"Cleaning fixes duplicates, inconsistent values, missing values, invalid data and outliers. Transforming covers type conversion/encoding, normalization, feature selection, sampling and the train/test split.",

 examples:[

 practice:[
  {id:"p_m1t5_1", d:"basic", marks:5, q:"List the five data quality problems found during data exploration and the standard fix for each.",
   hint:"Duplicate, inconsistent, missing, invalid, outlier.",
   a:`<div class="scroll"><table class="t"><thead><tr><th>Problem</th><th>Meaning</th><th>Fix</th></tr></thead><tbody>
   <tr><td>Duplicate records</td><td>The same entity appears more than once, inflating counts and skewing statistics</td><td>Drop the repeated rows</td></tr>
   <tr><td>Inconsistent values</td><td>The same fact recorded in different ways (“NY” vs “New York”)</td><td>Standardize to one canonical form</td></tr>
   <tr><td>Missing values</td><td>Gaps in the data, found during exploration</td><td>Impute — with the median if the column is skewed</td></tr>
   <tr><td>Invalid data</td><td>Impossible values (credit score 900, negative age)</td><td>Cap to the valid range, or correct/remove</td></tr>

  {id:"p_m1t5_2", d:"standard", marks:5, q:"Why is normalization required before modelling? Explain feature selection and why an ID column is dropped.",
   hint:"Scale dominance; curse of dimensionality.",
   a:`<b>Normalization.</b> Attributes arrive on wildly different scales — annual income runs into lakhs while credit score sits between 300 and 850. Any algorithm that uses distance or magnitude would let income dominate purely because its numbers are bigger, not because it is more informative. Normalization scales attributes to a uniform <b>0–1 range</b> so each contributes on its merits. In the lecture, income is first log-transformed and then normalized alongside credit score.<br><br>
   <b>Feature selection.</b> Reducing the number of attributes without losing performance. This <b>mitigates the curse of dimensionality</b> — as dimensions increase, model complexity increases and the data becomes sparse relative to the space it occupies. In the lecture, credit_score, income_log and the target interest_rate are <b>kept</b>; borrower_id and the raw state text are <b>dropped</b>.<br><br>
   <b>Why the ID column is dropped.</b> A unique identifier takes a different value for every record. It can therefore appear to “explain” the training data perfectly while carrying <b>no predictive information whatsoever</b> about a new record — the model would simply memorise IDs. The same logic makes Employee ID the least useful feature for predicting salary.`},
  {id:"p_m1t5_3", d:"moderate", marks:5, q:"A dataset of 13 clean records is split 9 train / 4 test. State the rule of thumb, and explain what is lost by holding back test data.",
   hint:"Two-thirds / one-third — and this motivates cross-validation.",
   a:`<b>The rule of thumb:</b> roughly <b>two-thirds training data, one-third held out for testing</b>. Here 9/13 = 69% train and 4/13 = 31% test, which matches.<br><br>
   <b>What is lost.</b> Every record used for testing is a record the model never got to learn from. With only 13 records, holding back 4 removes nearly a third of the available signal. Worse, the single score you get depends entirely on <i>which</i> records happened to land in the test set — a lucky split can make a weak model look strong, an unlucky split the reverse, and there is no way to know how much the score would move under a different split.<br><br>
   <b>What this motivates.</b> Exactly this weakness is the argument for <b>cross-validation</b>: every record takes a turn in the validation set, so the entire dataset is used for both training and validation (just not at the same time), and averaging across folds smooths out the effect of any one unusual split. Small datasets suffer most from a single hold-out, which is why they benefit most from k-fold or LOOCV.`}],

  method:"For arithmetic: write the formula, substitute, state the answer with units (“records”, “iterations”). For choice questions: name the technique, then give the reason in terms of <b>dataset size</b> and <b>computational cost</b>.",
  trap:"In k-fold, the number of <b>testing</b> records per iteration is N/k — but the number of <b>training</b> records is N − N/k, not N. Students routinely write “training = 600” for a 600-record 5-fold problem; it is 480."},
 concept:`<h4>Why validate at all?</h4>
<p>The lecture's framing: a hospital trains a model on 10,000 patient records. Validation uses <b>new patients who were not part of training</b>. If the model correctly predicts disease for new patients, it is useful; otherwise <b>it has simply memorized the old data</b>.</p>
<div class="box warn"><h5>The problem with a single train/test split</h5>
<ul style="margin:0">
<li>One split gives one score, and that score depends entirely on which records happen to land in the test set.</li>
<li>A lucky split can make a weak model look great; an unlucky split can make a good model look bad.</li>
<li>Every record used for testing is a record the model never got to learn from.</li>
<li>Small datasets suffer most — losing 30% of records to testing is a real loss of signal.</li>
<li>There is no way to know how much the reported score would change with a different split.</li>
</ul></div>
<div class="box tip"><h5>What cross-validation fixes</h5>
<ul style="margin:0">
<li>Every record takes a turn in the validation set — nothing is wasted.</li>
<li>Uses the entire dataset for both training and validation, <b>just not at the same time</b>.</li>
<li>Averaging across k folds smooths out the effect of any one unusual split.</li>
<li>Makes overfitting easier to spot — a model that only works on one split will not score well across all of them.</li>
</ul>
<div class="formula" style="margin-bottom:0">Accuracy_cv  =  (1/k) &Sigma; Accuracy_i</div></div>

<h4>The techniques compared</h4>
<div class="scroll"><table class="t"><thead><tr><th>Technique</th><th>How it works</th><th>Advantages</th><th>Drawbacks</th></tr></thead><tbody>
<tr><td><b>Hold-out</b></td><td>Shuffle, then split once into training and test sets. Common ratios 70/30 or 80/20.</td><td>Very simple · fast · suitable for large datasets</td><td>Score depends heavily on which records land in test; no averaging to smooth it out</td></tr>
<tr><td><b>k-Fold CV</b></td><td>Split into k equal folds; each fold takes a turn as validation while the other k−1 train. Average the k scores. k = 5 is common.</td><td>Every record is used for both training and testing · more reliable · less dependent on one random split</td><td>Trains the model k times instead of once — expensive. With 10,000 models and 10-fold, that is 1,00,000 trainings.</td></tr>
<tr><td><b>Stratified k-Fold</b></td><td>Like k-fold, but each fold preserves the original <b>class proportions</b>.</td><td>Prevents a fold containing only one class · essential for imbalanced problems like fraud or churn</td><td>Same computational cost as k-fold</td></tr>
<tr><td><b>Leave-One-Out (LOOCV)</b></td><td>k equals the number of records. Each iteration holds out exactly <b>one</b> record; train on the remaining n−1. Run n iterations.</td><td>Almost the entire dataset trains every time · excellent when data is scarce · every observation is tested</td><td>Very expensive — 1000 records means 1000 trainings. Because training sets differ by only one record, the models are very similar, making evaluation sensitive to small changes.</td></tr>
<tr><td><b>Leave-P-Out</b></td><td>Generalization of LOOCV: hold out every possible group of p records. C(n, p) combinations.</td><td>Most exhaustive</td><td>C(n, p) grows explosively — C(10,2) is already 45. Practical only on small datasets.</td></tr>
<tr><td><b>Bootstrap</b></td><td>Generate samples by randomly drawing data points <b>with replacement</b>. Sample size usually equals the original dataset size. Records <i>not</i> selected form the <b>Out-of-Bag (OOB)</b> test set.</td><td>Useful for very small datasets · estimates model stability · widely used for confidence intervals and model uncertainty</td><td>Samples come from the same original data, so they may not represent unseen real-world data. <b>If the original dataset is biased, the bootstrap samples carry that bias.</b></td></tr>
</tbody></table></div>

<h4>Bootstrapping, concretely</h4>
<div class="formula">Original Data       :  A  B  C  D  E
Bootstrap Sample 1  :  A  C  C  D  E     -> B is Out-of-Bag
Bootstrap Sample 2  :  A  B  D  D  C     -> E is Out-of-Bag

Notice: some records repeat, some are missing.
That is what "with replacement" means.</div>
<p><b>Out-of-Bag (OOB):</b> in bootstrap validation the training sample is created by sampling with replacement; the test set is formed from the records <b>not selected</b> in that bootstrap sample. <i>(The OOB term is spelled out in the COMP A deck; COMP B teaches the same mechanism.)</i></p>

<h4>Ensemble modeling <span class="pill bonly">COMP B ONLY</span></h4>
<p>Multiple diverse, independent base models are combined to predict one outcome; the combined “meta model” is the <b>ensemble model</b>. As long as base models are diverse, prediction error decreases — the “wisdom of crowds”. Though built from many models, an ensemble acts and performs as a single model. Two steps: models are <b>trained independently</b>, then their predictions are <b>aggregated</b> by voting, averaging or weighting. A group of weak learners forms one strong learner.</p>`,

 examples:[
  {id:"ex_m1t6_1", topic:"m1t6", title:"Split and fold calculations — the six standard forms",
   category:"Validation split arithmetic",
   recog:"A record count plus either a ratio, a value of k, or the words leave-one-out. Pure arithmetic — show the division.",
   need:"Three formulas: hold-out split, fold size, LOOCV counts.",
   q:"(a) 1000 records, 80% training. Find training and testing records. (b) 250 records, 70:30 hold-out. Find both. (c) 500 records, 5-fold. Find number of folds and records per fold. (d) 1200 records, 10 folds. Records per fold? (e) 600 records, 5-fold. Records tested per iteration and records trained on? (f) 20 patient records, LOOCV. Training per iteration, testing, and total iterations?",
   steps:[
    "<b>(a)</b> Training = 80% of 1000 = 800. Testing = 1000 − 800 = <b>200</b>.",
    "<b>(b)</b> Training = 70% of 250 = 175. Testing = 30% of 250 = <b>75</b>.",
    "<b>(c)</b> Folds = k = <b>5</b>. Records per fold = N/k = 500/5 = <b>100</b>.",
    "<b>(d)</b> Records per fold = 1200/10 = <b>120</b>.",
    "<b>(e)</b> Testing per iteration = one fold = 600/5 = <b>120</b>. Training = N − N/k = 600 − 120 = <b>480</b>.",
    "<b>(f)</b> LOOCV holds out exactly one record: testing = <b>1</b>, training = n − 1 = <b>19</b>, iterations = n = <b>20</b>."],
   answer:`<div class="scroll"><table class="t"><thead><tr><th>Part</th><th>Setup</th><th>Working</th><th>Answer</th></tr></thead><tbody>
   <tr><td>(a)</td><td>1000 records, 80% train</td><td>0.80 × 1000 = 800; 1000 − 800</td><td>Train <b>800</b>, Test <b>200</b></td></tr>
   <tr><td>(b)</td><td>250 records, 70:30</td><td>0.70 × 250 = 175; 0.30 × 250 = 75</td><td>Train <b>175</b>, Test <b>75</b></td></tr>
   <tr><td>(c)</td><td>500 records, 5-fold</td><td>500 / 5</td><td><b>5</b> folds, <b>100</b> records each</td></tr>
   <tr><td>(d)</td><td>1200 records, 10 folds</td><td>1200 / 10</td><td><b>120</b> per fold</td></tr>
   <tr><td>(e)</td><td>600 records, 5-fold</td><td>600/5 = 120; 600 − 120 = 480</td><td>Test <b>120</b>, Train <b>480</b></td></tr>
   <tr><td>(f)</td><td>20 records, LOOCV</td><td>n−1 = 19; k = n = 20</td><td>Train <b>19</b>, Test <b>1</b>, Iterations <b>20</b></td></tr>
   </tbody></table></div>`,
   why:"All six reduce to one idea: a fold is N/k records, and whatever is not in the held-out fold is training data. LOOCV is just k = n.",
   trap:"Part (e) is the one that catches people — writing training = 600. The held-out fold is not available for training, so training = 600 − 120 = 480."},
  {id:"ex_m1t6_2", topic:"m1t6", title:"Identifying Out-of-Bag records from a bootstrap sample",
   category:"Bootstrap / OOB identification",
   recog:"An original dataset and a bootstrap sample are printed side by side. You are asked which records serve as test data.",
   need:"Bootstrap = sampling with replacement; OOB = records not selected.",
   q:"Original dataset: A B C D E. One bootstrap sample obtained is: A C C D E. Which record can be used as Out-of-Bag (test) data? Explain why some records repeat.",
   steps:[
    "<b>List the original records:</b> A, B, C, D, E — five records.",
    "<b>List what appears in the sample:</b> A, C, C, D, E. C appears twice.",
    "<b>Find what is missing:</b> compare the two sets. A ✓, B ✗, C ✓, D ✓, E ✓. <b>B is absent.</b>",
    "<b>Conclude:</b> B is the Out-of-Bag record and forms the test set for this bootstrap iteration.",
    "<b>Explain the repetition:</b> the sample is drawn <b>with replacement</b>, so a record can be picked more than once. The sample size is kept equal to the original (5 draws), so if C is drawn twice, some other record must be missed — here, B."],
   answer:`<div class="answer"><b>Out-of-Bag (test) record: B</b></div>
   <b>Why C repeats and B is missing.</b> Bootstrapping generates samples by randomly drawing data points <b>with replacement</b>, and the sample size is usually kept the same as the original dataset. Because each of the five draws can select any record — including one already drawn — some records appear more than once (C twice) and others are never selected at all (B). The records not selected are the <b>Out-of-Bag samples</b>, and they form the test set for that bootstrap iteration.<br><br>
   <i>This is what makes bootstrap useful for small datasets: it manufactures many different training sets from the same limited data, and each one comes with a free, automatically-held-out test set.</i>`,
   why:"Sampling with replacement decouples “how many draws” from “how many distinct records”, which is exactly what lets you build many different training sets from one small dataset.",
   trap:"Answering “C” because it looks unusual. The OOB set is what is <em>absent</em> from the sample, not what is duplicated in it."},
  {id:"ex_m1t6_3", topic:"m1t6", title:"Choosing the right validation technique for a given dataset",
   category:"Technique selection / justification",
   recog:"A dataset size or constraint plus “which technique is better and why?”. No arithmetic — the marks are in the reasoning.",
   need:"The cost-vs-data-scarcity trade-off.",
   q:"(a) A company has 5 million customer records. Hold-out or Leave-One-Out? (b) A hospital has only 18 patient records. Hold-out, k-Fold or Leave-One-Out? (c) A startup has only 100 customer records and collecting new data is expensive. Which technique?",
   steps:[
    "<b>Identify the constraint.</b> Is data <i>abundant</i> (cost is the binding constraint) or <i>scarce</i> (information is the binding constraint)?",
    "<b>(a) 5 million records — data is abundant.</b> LOOCV would require 5 million model trainings, which is computationally impossible. With that many records, even a 30% hold-out leaves 3.5 million training records — plenty. → <b>Hold-out.</b>",
    "<b>(b) 18 records — data is desperately scarce.</b> A 70/30 hold-out would train on only 12 records and test on 6, and the score would depend enormously on which 6. LOOCV trains on 17 records every time and tests all 18. 18 trainings is trivial. → <b>Leave-One-Out.</b>",
    "<b>(c) 100 records, expensive to collect.</b> The problem is not just testing but knowing <i>how stable</i> the model is. Bootstrapping creates many new training sets by sampling with replacement, giving both extra training sets and OOB test sets, and it is the technique used to estimate confidence intervals and model uncertainty. → <b>Bootstrapping.</b>"],
   answer:`<div class="scroll"><table class="t"><thead><tr><th>Scenario</th><th>Technique</th><th>Justification</th></tr></thead><tbody>
   <tr><td>(a) 5 million records</td><td><b>Hold-out</b></td><td>Simple, fast and suitable for large datasets. LOOCV would need 5 million trainings — computationally impossible. With millions of records, a single split still leaves ample training data and the score is stable.</td></tr>
   <tr><td>(b) 18 patient records</td><td><b>Leave-One-Out (LOOCV)</b></td><td>Data is scarce and none can be wasted. LOOCV trains on 17 records each time, tests every observation once, and costs only 18 trainings — trivial at this size. A hold-out split would waste ~30% of an already tiny dataset and give a score that depends on luck.</td></tr>
   <tr><td>(c) 100 records, expensive to collect</td><td><b>Bootstrapping</b></td><td>Creates new datasets by sampling with replacement, so the limited data is reused to estimate model stability, confidence intervals and uncertainty. Unselected records form the OOB test set. <i>Caveat to state: if the original 100 records are biased, every bootstrap sample inherits that bias.</i></td></tr>
   </tbody></table></div>`,
   why:"There is one trade-off underneath all three: LOOCV maximises training data but costs n trainings, hold-out minimises cost but wastes data. Dataset size decides which cost you can afford to pay.",
   trap:"Recommending k-fold for everything. It is the sensible default, but the examiner is testing whether you notice the <em>extremes</em> — millions of records, or eighteen."}],
 practice:[
  {id:"p_m1t6_1", d:"basic", marks:3, q:"A dataset contains 800 records and is split 75:25 for hold-out validation. Find the number of training and testing records.",
   hint:"Straight percentages.",
   a:`Training = 75% of 800 = 0.75 × 800 = <b>600 records</b><br>Testing = 25% of 800 = 0.25 × 800 = <b>200 records</b><br>Check: 600 + 200 = 800 ✓<br><br><i>State the rule of thumb alongside: roughly two-thirds training, one-third testing.</i>`},
  {id:"p_m1t6_2", d:"standard", marks:5, q:"A dataset contains 900 records and 6-fold cross validation is used. Find (a) records per fold, (b) records used for testing in each iteration, (c) records used for training in each iteration, (d) total number of times the model is trained.",
   hint:"Fold size, then N minus fold size.",
   a:`<b>(a) Records per fold</b> = N/k = 900/6 = <b>150 records</b><br><br>
   <b>(b) Testing per iteration</b> = one fold = <b>150 records</b><br><br>
   <b>(c) Training per iteration</b> = N − N/k = 900 − 150 = <b>750 records</b> (the remaining k−1 = 5 folds)<br><br>
   <b>(d) Total trainings</b> = k = <b>6</b> — the model is built once per iteration, and the six validation scores are averaged:<br>
   <div class="formula" style="margin-bottom:0">Accuracy_cv = (1/6) &Sigma; Accuracy_i</div>
   <i>Part (c) is where marks are lost. The held-out fold is not available for training.</i>`},
  {id:"p_m1t6_3", d:"standard", marks:5, q:"A dataset has 25 records. Using LOOCV, find the training size, testing size and number of iterations. State one advantage and one drawback.",
   hint:"n−1, 1, n.",
   a:`<b>Training records per iteration</b> = n − 1 = <b>24</b><br>
   <b>Testing records per iteration</b> = <b>1</b><br>
   <b>Total iterations</b> = n = <b>25</b><br><br>
   <b>Advantage:</b> almost the entire dataset is used for training every time, which is excellent when data is scarce, and every observation gets tested exactly once.<br><br>
   <b>Drawback:</b> the model must be trained 25 times — and for 10,000 records it would be 10,000 times, which is very computationally expensive. Also, because each training set differs from the next by only one record, the resulting models are very similar, making the evaluation sensitive to small changes.`},
  {id:"p_m1t6_4", d:"moderate", marks:5, q:"Compare hold-out, k-fold and LOOCV on: how the split is made, cost, data efficiency, and when to use each.",
   hint:"A four-row comparison table.",
   a:`<div class="scroll"><table class="t"><thead><tr><th>Aspect</th><th>Hold-out</th><th>k-Fold CV</th><th>LOOCV</th></tr></thead><tbody>
   <tr><td><b>Split</b></td><td>One random split, e.g. 70/30 or 80/20</td><td>k equal folds; each takes a turn as validation</td><td>k = n; one record held out at a time</td></tr>
   <tr><td><b>Models trained</b></td><td>1</td><td>k (commonly 5 or 10)</td><td>n — one per record</td></tr>
   <tr><td><b>Data efficiency</b></td><td>Poor — 20–30% of records never train the model</td><td>Good — every record trains in k−1 iterations and validates in exactly one</td><td>Best — n−1 records train every time</td></tr>
   <tr><td><b>Score stability</b></td><td>Depends entirely on which records land in test</td><td>Averaged over k folds, so much more stable</td><td>Every record tested, but models are near-identical so it can be sensitive</td></tr>
   <tr><td><b>Use when</b></td><td>The dataset is large and you need speed</td><td>General-purpose default</td><td>The dataset is very small and no data can be wasted</td></tr>
   </tbody></table></div>
   <b>One-line summary:</b> as you move left to right you buy better use of your data with more computation.`},
  {id:"p_m1t6_5", d:"moderate", marks:5, q:"A bank builds a fraud detection model. Only 2% of transactions are fraudulent. Which cross-validation variant should it use and why? What would go wrong with plain k-fold?",
   hint:"Class imbalance.",
   a:`<b>Use stratified k-fold cross-validation.</b><br><br>
   <b>How it works:</b> look at the proportion of each class label in the full dataset, then build each of the k folds so it <b>mirrors that same proportion</b>, and run standard k-fold on top of these balanced folds.<br><br>
   <b>Why it is needed here:</b> with only 2% fraud, a plain random k-fold split can easily produce a fold that contains <b>no fraudulent transactions at all</b>. If the validation fold has zero positives, the fraud-detection metric for that fold is meaningless — a model that predicts “never fraud” would score 100%. Stratification prevents a fold from accidentally containing only one class.<br><br>
   <b>Cost:</b> the same as ordinary k-fold — stratification changes how folds are composed, not how many models are trained. The lecture calls it <i>essential for imbalanced problems like fraud or churn, where the minority class can otherwise vanish from a fold entirely.</i>`},
  {id:"p_m1t6_6", d:"challenging", marks:5, q:"Explain bootstrapping. For original data {P, Q, R, S, T} with bootstrap sample {P, R, R, T, T}, identify the OOB records. Why does bootstrap not remove bias?",
   hint:"Which originals are absent?",
   a:`<b>Bootstrapping</b> is the process of generating bootstrapped samples from a dataset by randomly drawing data points <b>with replacement</b>. The sample size is usually the same as the original dataset, so some records repeat and some are never drawn. In bootstrap validation the training sample is the bootstrap sample; the test set is formed from the records not selected — the <b>Out-of-Bag (OOB)</b> samples.<br><br>
   <b>For this sample:</b> original = {P, Q, R, S, T}; sample = {P, R, R, T, T}.<br>
   Present: P ✓, R ✓ (twice), T ✓ (twice). Absent: <b>Q and S</b>.<br>
   <div class="answer">Out-of-Bag (test) records: <b>Q and S</b></div>
   <b>Why bootstrap does not remove bias.</b> Every bootstrap sample is drawn from the <i>same original dataset</i>. Resampling can tell you how much your estimate would wobble under different draws — which is why it is used for confidence intervals and model stability — but it cannot introduce information that was never collected. <b>If the original dataset is biased, the bootstrap samples will also carry that bias</b>, and they may not fully represent unseen real-world data.`}],

 whatIs:`<p>A dataset consists of two types of data: <b>categorical</b> and <b>numerical</b>. Every column sits at one of <b>four levels of measurement</b>, and <b>the level determines which statistical calculations are valid</b>. That last sentence is the whole point of the topic.</p>`,

  "That interval has no absolute zero; ratio does.",
  "Which statistics are permitted at each level.",

 recognition:{
  clues:["The data is <b>names or labels with no order</b> (cuisine, blood group, gender, city) → <b>Nominal</b>.",

  firstStep:"For each column ask three questions in order: <b>(1) Can I order the values?</b> No → nominal. <b>(2) Are the gaps equal?</b> No → ordinal. <b>(3) Is there a true zero?</b> No → interval; yes → ratio.",

 concept:`<h4>The four levels — a cumulative ladder</h4>
<div class="scroll"><table class="t"><thead><tr><th>Level</th><th>What it is</th><th>Adds over the previous level</th><th>Examples</th><th>Valid operations</th></tr></thead><tbody>
<tr><td><b>Nominal</b></td><td>Named</td><td>—</td><td>Favourite cuisine, gender, blood group, city, roll number</td><td>Equality only — count, mode. <b>No mathematical computations.</b></td></tr>
<tr><td><b>Ordinal</b></td><td>Named + Ordered</td><td>A meaningful order</td><td>Class standing (Senior &gt; Junior &gt; Sophomore &gt; Freshman), grades, satisfaction ratings, ranks</td><td>Order comparisons; median, quartiles, percentiles. Mean is questionable.</td></tr>
<tr><td><b>Interval</b></td><td>Named + Ordered + Proportionate interval between values</td><td>Equal, meaningful gaps</td><td>Year enrolled, temperature in °C or °F, IQ scores</td><td>Addition and subtraction; mean, standard deviation. <b>Ratios are meaningless.</b></td></tr>
<tr><td><b>Ratio</b></td><td>Named + Ordered + Proportionate interval + <b>absolute zero</b></td><td>A true zero meaning “none”</td><td>GPA, height, weight, income, age, marks, distance</td><td>All operations including multiplication and division; every statistic is valid.</td></tr>
</tbody></table></div>
<div class="box tip"><h5>The one-line rule from the deck</h5>
<p style="margin:0">“Each level builds on the one before it — <b>Ratio data can do everything Nominal, Ordinal and Interval data can do, plus more</b>.” So when in doubt, ask what the level is <i>missing</i>, not what it has.</p></div>

<h4>Worked classification — the campus student survey</h4>
<div class="scroll"><table class="t"><thead><tr><th>Column</th><th>Sample values</th><th>Level</th><th>Why</th></tr></thead><tbody>
<tr><td>Favorite Cuisine</td><td>Italian, Mexican, Thai, Indian</td><td><b>Nominal</b></td><td>Qualitative only — names, labels or qualities. Values can only be checked for equality; there is no natural order.</td></tr>
<tr><td>Class Standing</td><td>Senior, Junior, Sophomore, Freshman</td><td><b>Ordinal</b></td><td>There is a genuine order, but the “distance” between Junior and Senior is not a measurable quantity.</td></tr>
<tr><td>Year Enrolled</td><td>2021, 2022, 2023, 2024</td><td><b>Interval</b></td><td>Equal gaps of one year, so subtraction is meaningful — but there is no absolute zero year, so “2022 is twice 1011” is nonsense.</td></tr>
<tr><td>GPA</td><td>3.8, 3.4, 3.6, 3.1</td><td><b>Ratio</b></td><td>Equal intervals <b>and</b> a true zero (GPA 0 means no grade points at all), so a GPA of 3.6 really is twice 1.8.</td></tr>
</tbody></table></div>

<h4>Properties of data</h4>
<p>Alongside the measurement level, the deck lists the properties that make data usable. In the data-science process these are exactly what data exploration checks for and data preparation fixes:</p>
<ul class="list">
<li><b>Accuracy</b> — values correctly represent reality (no invalid entries such as a credit score of 900).</li>
<li><b>Completeness</b> — no missing values or gaps.</li>
<li><b>Consistency</b> — the same fact recorded the same way everywhere (“NY”, not sometimes “New York”).</li>
<li><b>Uniqueness</b> — no duplicate records inflating counts.</li>
<li><b>Timeliness / relevance</b> — the data is current and pertinent to the question being asked.</li>
</ul>`,

   a:`<div class="scroll"><table class="t"><thead><tr><th>Level</th><th>Adds</th><th>Example</th><th>Valid statistics</th></tr></thead><tbody>
   <tr><td><b>Nominal</b></td><td>Names only</td><td>Favourite cuisine; blood group</td><td>Count, mode. Equality checks only — no arithmetic.</td></tr>

  {id:"p_m2t1_2", d:"standard", marks:5, q:"Why can you compute a mean for interval data but not for nominal data? Why can you compute a ratio for ratio data but not interval data?",
   hint:"Equal gaps enable addition; true zero enables division.",
   a:`<b>Mean for interval but not nominal.</b> A mean is a sum divided by a count, so addition must be meaningful. At the <b>nominal</b> level values are only names — “Italian + Mexican” has no meaning, and the values can only be checked for equality, so no mathematical computation is possible. At the <b>interval</b> level the gaps between values are equal and proportionate, so differences and sums genuinely represent quantity, which makes the mean well defined.<br><br>
   <b>Ratio for ratio but not interval.</b> A ratio such as “twice as much” requires a fixed origin — a zero that means <i>none of the quantity</i>. Interval scales lack this: 0°C is the freezing point of water, an arbitrary convention, so 40°C is <b>not</b> twice as hot as 20°C (convert both to °F and the ratio changes, which proves the ratio is not a property of the data). Ratio scales have an <b>absolute zero</b> — ₹0 income really is no income — so the ratio is invariant and meaningful.<br><br>
   <b>Quick test to quote:</b> if changing the unit changes the ratio, the scale is interval, not ratio.`}],

 summary:"Building a frequency distribution from raw data — and the exclusive vs inclusive trap the class notes star. CIA-2 opened with exactly this.",
 whatIs:`<p><b>Classification</b> is the process of arranging raw data into groups or classes according to resemblances and similarities. A <b>frequency distribution</b> groups raw data into classes and records how many cases fall into each. When items are expressed as a proportion of the total it becomes a <b>relative frequency</b> (or percentage) distribution.</p>
<div class="box warn"><h5>Why this topic is near-certain</h5>
<p style="margin:0"><b>CIA-2 part (a) was exactly this:</b> “Construct an exclusive continuous frequency distribution using a class width of 10, with the lower limit of the first class interval starting at 0.” Every subsequent part of that question depended on getting the table right. Build the distribution carefully — the whole 10 marks hang off it.</p></div>`,

 concept:`<h4>Bases of classification</h4>
<div class="scroll"><table class="t"><thead><tr><th>Basis</th><th>Also called</th><th>Meaning</th><th>Example</th></tr></thead><tbody>
<tr><td><b>Area-wise</b></td><td>Geographical</td><td>Data grouped by location</td><td>Production by state; population by city</td></tr>
<tr><td><b>Time-wise</b></td><td>Chronological</td><td>Data grouped by time period</td><td>Sales by year; rainfall by month</td></tr>
<tr><td><b>By attribute</b></td><td>Qualitative</td><td>Grouped by a quality that cannot be measured numerically</td><td>Gender, literacy, religion, employment status</td></tr>
<tr><td><b>By magnitude</b></td><td>Quantitative</td><td>Grouped by a measurable variable — this produces a frequency distribution</td><td>Income, marks, height, commuting time</td></tr>
</tbody></table></div>

<h4>The four technical terms</h4>
<div class="scroll"><table class="t"><thead><tr><th>Term</th><th>Definition</th><th>Example</th></tr></thead><tbody>
<tr><td><b>Class limits</b></td><td>The lowest and highest values a class can include. The <i>lower limit</i> is the value below which no item in that class can fall; the <i>upper limit</i> the value above which none can fall.</td><td>Class 20–40 → lower limit 20, upper limit 40</td></tr>
<tr><td><b>Class interval</b></td><td>The difference between a class's upper and lower limits.</td><td>Class 100–200 → interval = 200 − 100 = 100</td></tr>
<tr><td><b>Class frequency</b></td><td>The number of observations falling in a particular class. Summing all class frequencies gives N.</td><td>If ₹10,000–₹15,000 has frequency 50, then 50 persons earn in that range</td></tr>
<tr><td><b>Class mid-point</b> (class mark)</td><td>The value halfway between the lower and upper limits. <b>Used to represent the whole class</b> in all further statistical work.</td><td>Mid-point = (Upper + Lower)/2 → for 20–30, m = 25</td></tr>
</tbody></table></div>

<h4>Choosing the classes</h4>
<div class="formula">Class interval:   i = (L - S) / k
     L = largest item, S = smallest item, k = number of classes

Example: salaries range 10,000 to 30,000 and 10 classes are wanted
     i = (30,000 - 10,000) / 10 = 2,000
     Classes: 10,000-12,000, 12,000-14,000, ...

Number of classes (Sturges' Rule):   k = 1 + 3.322 log N
     N = 10   ->  k = 4.322 ~ 4
     N = 100  ->  k = 7.644 ~ 8

k is conventionally kept between 4 and 20 classes.</div>

<h4>Exclusive vs Inclusive — starred in the class notes</h4>
<div class="scroll"><table class="t"><thead><tr><th></th><th>Exclusive method</th><th>Inclusive method</th></tr></thead><tbody>
<tr><td><b>How classes look</b></td><td>10–20, 20–30, 30–40 — the upper limit of one class <b>is</b> the lower limit of the next</td><td>10–19, 20–29, 30–39 — there is a <b>gap</b> between classes</td></tr>
<tr><td><b>Boundary item</b></td><td>The item equal to the upper limit is <b>excluded</b> and placed in the next class</td><td>The upper limit is <b>included</b> in the class itself</td></tr>
<tr><td><b>Ensures</b></td><td>Continuity of data</td><td>Avoids ambiguity for discrete data</td></tr>
<tr><td><b>Use for</b></td><td><b>Continuous</b> variables</td><td><b>Discrete</b> variables</td></tr>
</tbody></table></div>
<div class="box warn"><h5>The correction factor — write this in your answer whenever classes are inclusive</h5>
<div class="formula" style="margin:.4rem 0">Correction factor = (Lower limit of 2nd class - Upper limit of 1st class) / 2

Then:  SUBTRACT it from every lower limit
       ADD it to every upper limit</div>
<p style="margin:0">For 10–19, 20–29, …: CF = (20 − 19)/2 = <b>0.5</b>, giving 9.5–19.5, 19.5–29.5, … For 100–109, 110–119, …: CF = (110 − 109)/2 = <b>0.5</b>, giving 99.5–109.5, 109.5–119.5, … <b>This must be done before computing median, quartiles or mode</b>, because those formulas interpolate across class boundaries and assume the classes are continuous.</p></div>

<h4>Discrete frequency distribution — the tally method</h4>
<p>For a variable with exact, countable values. One row per distinct value, tallied. The lecture's worked example: 35 families and the number of children per family.</p>
<div class="scroll"><table class="t"><thead><tr><th>No. of children</th><th>Tally</th><th>Frequency</th></tr></thead><tbody>
<tr><td>0</td><td>||</td><td>2</td></tr><tr><td>1</td><td>|</td><td>1</td></tr>
<tr><td>2</td><td>||||</td><td>4</td></tr><tr><td>3</td><td>|||| |</td><td>6</td></tr>
<tr><td>4</td><td>||||</td><td>5</td></tr><tr><td>5</td><td>||||</td><td>5</td></tr>
<tr><td>6</td><td>|||</td><td>3</td></tr><tr><td>7</td><td>||||</td><td>4</td></tr>
<tr><td>8</td><td>||</td><td>2</td></tr><tr><td>9</td><td>||</td><td>2</td></tr>
<tr><td>10</td><td></td><td>0</td></tr><tr><td>11</td><td></td><td>0</td></tr>
<tr><td>12</td><td>|</td><td>1</td></tr>
<tr><td><b>Total</b></td><td></td><td><b>35</b></td></tr>
</tbody></table></div>
<p><b>Always total the frequency column and check it equals N.</b> It is the only self-check available, and it catches tallying slips before they poison every later calculation.</p>`,

 practice:[
  {id:"p_m2t2_1", d:"basic", marks:5, q:"Define class limits, class interval, class frequency and class mid-point, with one example each.",
   hint:"Straight from the four terms.",
   a:`<b>Class limits</b> — the lowest and highest values a class can include. The lower limit is the value below which no item in that class can fall; the upper limit is the value above which none can fall. <i>Example:</i> for class 20–40, lower limit = 20, upper limit = 40.<br><br>
   <b>Class interval</b> — the difference between the upper and lower limits of a class. <i>Example:</i> for class 100–200, the class interval is 200 − 100 = 100. The width chosen (10, 20, 50, 100…) depends on the range of the data and the detail required.<br><br>
   <b>Class frequency</b> — the number of observations falling in a particular class. <i>Example:</i> if the class ₹10,000–₹15,000 has frequency 50, then 50 persons have incomes in that range. Adding all class frequencies gives the total frequency N.<br><br>
   <b>Class mid-point (class mark)</b> — the value halfway between the lower and upper limits, <b>used to represent the entire class</b> in further statistical work. <div class="formula" style="margin:.3rem 0 0">Mid-point m = (Upper limit + Lower limit) / 2   ->  for 20-30, m = 25</div>`},

   hint:"Difference between consecutive mid-values = width.",
   a:`<b>Step 1 — find the class width.</b> The difference between consecutive mid-values equals the class width:<br>

   <b>Step 2 — recover the limits.</b> Each mid-point sits halfway across its class, so subtract and add i/2 = 5:<br>
   <div class="scroll"><table class="t num"><thead><tr><th>Mid-value m</th><th>Lower limit (m − i/2)</th><th>Upper limit (m + i/2)</th><th>Class</th></tr></thead><tbody>
