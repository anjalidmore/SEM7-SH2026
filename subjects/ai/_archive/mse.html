{id:"m3t1", lo:"LO 3.1", marks:5, priority:"high", src:"Chpt 3 Knowledge slides 2–3; Notebook A p.13",
 q:"Explain a knowledge-based agent and how TELL and ASK operate.",
 a:`<p>A knowledge-based agent includes a <b>knowledge base</b> and an <b>inference system</b>.</p>
<ul class="list">
<li>A <b>knowledge base</b> is a set of representations of facts of the world.</li>
<li>Each individual representation is called a <b>sentence</b>.</li>
<li>The sentences are expressed in a <b>knowledge representation language</b>.</li>
<li><b>Inference</b> is deriving new sentences from old.</li>
</ul>
<h4>How it operates</h4>
<ol class="list">
<li>It <b>TELLs</b> the knowledge base what it perceives.</li>
<li>It <b>ASKs</b> the knowledge base what action it should perform.</li>
<li>It <b>performs</b> the chosen action.</li>
</ol>
<div class="note-note"><b>Fundamental property of logical reasoning:</b> in each case for which the agent draws a conclusion based on the available information, <b>that conclusion is guaranteed to be correct if the available information is correct.</b></div>
<h4>What is a logic?</h4>
<ul class="list">
<li>A language with <b>concrete rules</b> and <b>no ambiguity</b> in representation — very unlike natural languages such as English.</li>
<li>A statement can be represented in different logics, and perhaps differently within the same logic.</li>
<li><b>Expressiveness</b> of a logic = how much can we say in this language.</li>
</ul>`,
 understand:"TELL and ASK are the only two operations. Everything else in Module 3 — propositional logic, FOL, resolution, chaining — is machinery for implementing ASK, i.e. answering 'does my knowledge base entail this?'. The guarantee in the highlighted box is what makes logic worth the trouble: if your facts are right, your conclusions are provably right.",
 examAnswer:"Definition of KB and inference engine → the three-step TELL/ASK/act cycle → a block diagram → close with the fundamental property of logical reasoning.",
 mistakes:"Confusing TELL (adds a percept INTO the KB) with ASK (queries it). Calling each fact a 'rule' — in this terminology each individual representation is a SENTENCE. Omitting the inference engine, which leaves you describing a database.",
 diagram:"Draw: an outer Agent box containing a 'Knowledge Base' box and an 'Inference engine' box, with TELL and ASK arrows between them, percepts arriving into the KB and an action leaving from the inference engine."},

{id:"m3t2", lo:"LO 3.1", marks:10, priority:"high", src:"Chpt 3 Knowledge slides 4–13; Notebook A p.13",
 q:"Describe the Wumpus World: PEAS, environment properties, and its propositional representation.",
 a:`<div class="note-note">The MSE list in the class notes opens Module 3 with <b>“Wumpus World Ex.”</b> — this is a named, expected question.</div>
<p>The agent explores a cave of rooms connected by passageways. Somewhere lurks the <b>Wumpus</b>, which eats any agent entering its room. Some rooms contain <b>bottomless pits</b>. Occasionally there is a heap of <b>gold</b>. The agent always starts at <b>[1,1]</b> and must find the gold, return to [1,1] and climb out.</p>
<h4>PEAS</h4>
<p><b>Performance measure:</b> +1000 for picking up the gold; −1000 for falling into a pit or being eaten; −1 for each action taken; −10 for using up the arrow. The game ends if the agent dies or comes out of the cave.</p>
<p><b>Environment:</b> a 4 × 4 grid of rooms. The agent starts at [1,1] facing right. Gold and Wumpus locations are chosen randomly with uniform distribution from squares other than the start. Each square other than the start can be a pit with <b>probability 0.2</b>.</p>
<p><b>Actuators:</b> Left turn, Right turn, Move forward, Grab, Shoot.</p>
<p><b>Sensors — five, each giving one bit:</b></p>
<ul class="list">
<li><b>Stench</b> — in the Wumpus's square and the directly (not diagonally) adjacent squares.</li>
<li><b>Breeze</b> — in the squares directly adjacent to a pit.</li>
<li><b>Glitter</b> — in the square where the gold is.</li>
<li><b>Bump</b> — when the agent walks into a wall.</li>
<li><b>Scream</b> — when the Wumpus is killed it emits a woeful scream, perceivable anywhere in the cave.</li>
</ul>
<h4>Environment properties</h4>
<div class="scroll"><table class="t"><tbody>
<tr><td><b>Partially observable</b></td><td>The agent can only perceive the close environment, such as an adjacent room.</td></tr>
<tr><td><b>Deterministic</b></td><td>The result and outcome of the world are already known.</td></tr>
<tr><td><b>Sequential</b></td><td>The order is important.</td></tr>
<tr><td><b>Static</b></td><td>The Wumpus and pits do not move.</td></tr>
<tr><td><b>Discrete</b></td><td>The environment is discrete.</td></tr>
<tr><td><b>Single agent</b></td><td>One agent only; the Wumpus is not considered an agent.</td></tr>
</tbody></table></div>
<h4>Atomic propositions</h4>
<div class="formula">P&#7522;,&#11388;  true if there is a Pit in room [i, j]
B&#7522;,&#11388;  true if the agent perceives a Breeze in [i, j]
W&#7522;,&#11388;  true if there is a Wumpus in square [i, j]
S&#7522;,&#11388;  true if the agent perceives a Stench in [i, j]
V&#7522;,&#11388;  true if square [i, j] is Visited
G&#7522;,&#11388;  true if there is Gold (and glitter) in [i, j]
OK&#7522;,&#11388; true if the room is safe</div>
<p>The rule that links a percept to the world — and the one you will be asked to convert to CNF:</p>
<div class="formula">B&#8321;,&#8321;  ⇔  (P&#8321;,&#8322;  ∨  P&#8322;,&#8321;)</div>`,
 understand:"The Wumpus world exists to demonstrate one thing: logical inference lets an agent know things it never directly perceived. The agent never sees a pit — it perceives a breeze in [1,2] and [2,1] and DEDUCES that [2,2] is safe and a pit lies in [1,3] or [3,1].",
 examAnswer:"Scenario → full PEAS → the six environment properties with justification → the atomic propositions → draw the 4×4 grid with pits, breezes, the Wumpus, stenches and the gold → close with one worked inference.",
 mistakes:"Saying the environment is fully observable — it is PARTIALLY observable, which is the whole point. Calling the Wumpus a second agent — the slides state it is not, so the environment is single-agent. Perceiving stench or breeze diagonally — only DIRECTLY adjacent squares. Forgetting the −10 arrow penalty or the −1 per action.",
 diagram:"Draw the 4×4 grid. Mark START at [1,1], put the Wumpus with Stench in its four neighbours, pits with Breeze in their neighbours, and Glitter on the gold square. Label rows 1–4 and columns 1–4."},

{id:"m3t3", lo:"LO 3.1", marks:5, priority:"high", src:"Chpt 3 Knowledge slides 20–23",
 q:"Explain propositional logic and its connectives. Convert the given English statements.",
 a:`<p>Propositional logic is also called <b>Boolean logic</b> as it works on 0 and 1. Symbolic variables (A, B, C, P, Q, R) represent propositions.</p>
<ul class="list">
<li>Propositions can be either <b>true or false, but not both</b>.</li>
<li>A formula which is <b>always true is a tautology</b> (also called a valid sentence).</li>
<li>A formula which is <b>always false is a contradiction</b>.</li>
<li>Questions, commands and opinions are <b>not</b> propositions — "Where is Rohini", "How are you", "What is your name".</li>
</ul>
<div class="scroll"><table class="t"><thead><tr><th>Connective</th><th>Symbol</th><th>Name</th><th>Example</th></tr></thead><tbody>
<tr><td>Negation</td><td>¬P</td><td>NOT</td><td>A literal is positive or negative</td></tr>
<tr><td>Conjunction</td><td>P ∧ Q</td><td>AND</td><td>Rohan is intelligent and hardworking</td></tr>
<tr><td>Disjunction</td><td>P ∨ Q</td><td>OR</td><td>Richa is a doctor or engineer</td></tr>
<tr><td>Implication</td><td>P → Q</td><td>if–then</td><td>If it is raining, then the street is wet</td></tr>
<tr><td>Biconditional</td><td>P ⇔ Q</td><td>if and only if</td><td>If I am breathing, then I am alive</td></tr>
</tbody></table></div>
<h4>Worked conversions from the lecture</h4>
<div class="scroll"><table class="t"><thead><tr><th>English</th><th>PL</th><th>Type</th></tr></thead><tbody>
<tr><td>It is raining.</td><td>P</td><td>Simple statement</td></tr>
<tr><td>It is not raining.</td><td>¬P</td><td>Negation</td></tr>
<tr><td>It is raining and it is cold.</td><td>P ∧ Q</td><td>Conjunction</td></tr>
<tr><td>It is raining or it is cold.</td><td>P ∨ Q</td><td>Disjunction</td></tr>
<tr><td>If it is raining, then the ground is wet.</td><td>P → Q</td><td>Implication</td></tr>
<tr><td>The light is on if and only if the switch is pressed.</td><td>P ↔ Q</td><td>Bi-conditional</td></tr>
</tbody></table></div>`,
 understand:"Always DEFINE your propositional symbols before using them — 'Let P = it is raining, Q = the ground is wet'. Answers that jump straight to P → Q without the legend lose marks even when the logic is right. Watch for 'unless': A unless B becomes ¬B → A.",
 examAnswer:"Definition → the true/false-not-both rule → the five connectives table → tautology and contradiction → 3–4 English-to-PL conversions with the symbol legend written out.",
 mistakes:"Using → for 'and'. Treating a question or command as a proposition. Forgetting to define what each symbol stands for. Mixing up tautology (always true) with contradiction (always false)."},

{id:"m3t4", lo:"LO 3.1", marks:5, priority:"high", src:"Chpt 3 Knowledge slide 29",
 q:"Differentiate propositional logic from first-order predicate logic.",
 a:`<div class="scroll"><table class="t"><thead><tr><th>Propositional Logic</th><th>First-Order Predicate Logic</th></tr></thead><tbody>
<tr><td>Can represent small worlds</td><td>Very well represents complex worlds</td></tr>
<tr><td>Weak knowledge representation language</td><td>Strong knowledge representation language</td></tr>
<tr><td>Uses symbols to represent propositions</td><td>Uses predicates involving constants, variables, functions, relations</td></tr>
<tr><td>Cannot express specialization or generalization</td><td>Can express specialization and generalization using relations</td></tr>
<tr><td>Foundational level logic</td><td>Higher level logic</td></tr>
<tr><td>Not sufficiently expressive for complex statements</td><td>Sufficiently expressive for complex statements</td></tr>
<tr><td>World contains <b>facts</b></td><td>World contains <b>objects, relations, functions</b></td></tr>
</tbody></table></div>`,
 understand:"The one-sentence reason FOL wins: propositional logic has no variables, so it cannot say 'all'. 'All men are mortal' would need a separate proposition for every man who ever lived; FOL says it once with ∀x.",
 examAnswer:"Present it as the seven-row table — a table is faster to write and easier to mark than prose. Add the one illustrative pair (a separate symbol per man vs ∀x (Man(x) → Mortal(x))).",
 mistakes:"Writing it as a paragraph. Saying propositional logic 'cannot be used in AI' — the Wumpus world reasoning in this very module is propositional. Missing the last row: PL's world contains facts, FOL's contains objects, relations and functions."},

{id:"m3t5", lo:"LO 3.2", marks:5, priority:"high", src:"Chpt 3 slide 31; Notebook A p.15, Notebook B p.12",
 q:"State the inference rules used for automated reasoning, with an example of each.",
 a:`<h4>1. Modus Ponens</h4>
<p>If <b>P → Q</b> and <b>P</b> is true, then <b>Q</b> must be true.</p>
<div class="formula">(Student(x) → Studies(x, AI)),  Student(John)
  ⟹  Studies(John, AI)</div>
<h4>2. And-Elimination</h4>
<p>If we know <b>P ∧ Q</b>, we can infer P or Q separately.</p>
<div class="formula">Student(John) ∧ Studies(John, AI)
  ⟹  Student(John)   and   Studies(John, AI)</div>
<h4>3. Biconditional Elimination</h4>
<p>If <b>P ↔ Q</b> is true, we can derive both <b>P → Q</b> and <b>Q → P</b>.</p>
<div class="formula">Bachelor(x) ↔ (Unmarried(x) ∧ Male(x))
  ⟹  Bachelor(x) → (Unmarried(x) ∧ Male(x))
  and (Unmarried(x) ∧ Male(x)) → Bachelor(x)</div>
<h4>4. Resolution</h4>
<p>Works on the <b>conjunction of disjunctions of literals</b> (CNF). Covered as its own topic.</p>
<h4>Logical equivalence</h4>
<p>Two sentences are logically equivalent iff they are true in the same models: α ≡ β iff α ⊨ β and β ⊨ α.</p>`,
 understand:"Modus ponens is the engine of forward chaining, and backward chaining is modus ponens run in reverse. Getting this one rule right gives you the core of three separate exam topics. The extra-problems handout uses 'prove using modus ponens AND resolution' as a standard two-part question — the same knowledge base proved twice.",
 examAnswer:"All four rules, each with the rule statement and a one-line worked example. Add the logical-equivalence definition for the last mark.",
 mistakes:"Affirming the consequent — from P → Q and Q, concluding P. That is INVALID and is not modus ponens. Forgetting that biconditional elimination gives TWO implications."},

{id:"m3t6", lo:"LO 3.2", marks:5, priority:"high", src:"Chpt 3 Forward_Backward_Chaining slide 12",
 q:"Explain unification with an example. What role does it play in resolution?",
 a:`<p><b>Unification enables the appropriate rule to be applied.</b> Rules usually contain variables; unification finds the substitutions that make a rule match a fact or a goal.</p>
<div class="scroll"><table class="t"><tbody>
<tr><td><b>Rule pattern</b></td><td><code>Missile(x) → Weapon(x)</code></td></tr>
<tr><td><b>Known fact</b></td><td><code>Missile(M1)</code></td></tr>
<tr><td><b>Substitution</b></td><td><code>{ x / M1 }</code></td></tr>
<tr><td><b>After substitution</b></td><td><code>Missile(M1) → Weapon(M1)</code></td></tr>
</tbody></table></div>
<div class="note-warn"><b>Remember:</b> unification does <b>not</b> itself prove the conclusion — it enables the appropriate rule to be applied.</div>
<p>In the West example, unification gives x = West, y = M1, z = Nono, after which all subgoals of Criminal(West) succeed.</p>`,
 understand:"Unification is the glue that makes FOL resolution and chaining work. Propositional resolution can just look for matching symbols; in FOL the symbols contain variables, so before you can resolve ¬food(x) against food(Peanuts) you must bind x to Peanuts.",
 examAnswer:"Definition → the Missile/Weapon worked table with the substitution → the caveat that it does not itself prove anything → its role in resolution and backward chaining. In any proof, WRITE THE SUBSTITUTION IN BRACES next to every step — marks are given for showing them.",
 mistakes:"Saying unification proves the conclusion. Writing the substitution backwards — the class convention is {value/variable}, e.g. {Peanuts/x}. Unifying two different constants — constants only unify with themselves or with a variable."},

{id:"m3t7", lo:"LO 3.3", marks:5, priority:"medium", src:"Chpt 3 Knowledge slide 38; Notebook A p.16",
 q:"What is a Horn clause? Show the rewrite and explain why it matters.",
 a:`<p>General resolution can be <b>computationally expensive</b> as the number of clauses increases. Horn clauses restrict the form to make inference efficient.</p>
<div class="note-note"><b>A Horn clause is a clause containing at most one positive literal.</b></div>
<div class="formula">¬A ∨ ¬B ∨ C          ← Horn clause: C is the only positive literal

¬A ∨ ¬B  =  ¬(A ∧ B)     by De Morgan

so     ¬(A ∧ B) ∨ C   ≡   A ∧ B → C</div>
<p>General form:</p>
<div class="formula">A&#8321; ∧ A&#8322; ∧ … ∧ A&#8345;  →  B

IF all premises are true, THEN conclude B.</div>
<h4>Why they matter</h4>
<ul class="list">
<li>Can naturally represent knowledge as <b>IF–THEN rules</b>.</li>
<li>Allow <b>efficient inference</b>.</li>
<li>Form the basis for <b>Forward Chaining and Backward Chaining</b>.</li>
</ul>
<div class="formula">Horn Clauses  →  Forward Chaining  →  Backward Chaining</div>`,
 understand:"The rewrite is worth doing slowly once, because it explains why rule-based expert systems and Prolog exist at all. A clause with one positive literal IS an IF–THEN rule — so a knowledge base of Horn clauses is a knowledge base of rules, and chaining algorithms can run over it directly instead of doing general resolution. The price of that efficiency: you cannot express 'A or B is true' (two positive literals).",
 examAnswer:"Definition → the worked De Morgan rewrite to IF–THEN form → the general form → the three reasons they matter → the limitation.",
 mistakes:"Saying 'exactly one positive literal' — it is AT MOST one, so an all-negative clause is also Horn. Failing to show the rewrite, which is the point of the question."},

{id:"m3t8", lo:"LO 3.6", marks:5, priority:"high", src:"Chpt 3 chaining deck slide 13; Knowledge slides 55–61",
 q:"Compare forward and backward reasoning.",
 a:`<div class="scroll"><table class="t"><thead><tr><th>Feature</th><th>Forward Chaining</th><th>Backward Chaining</th></tr></thead><tbody>
<tr><td><b>Starting point</b></td><td>Known facts</td><td>Goal / query</td></tr>
<tr><td><b>Direction</b></td><td>Facts → conclusions</td><td>Goal → subgoals → facts</td></tr>
<tr><td><b>Type</b></td><td><b>Data-driven</b></td><td><b>Goal-driven</b></td></tr>
<tr><td><b>Approach</b></td><td>Down-up (bottom to top)</td><td>Up-down (top to bottom)</td></tr>
<tr><td><b>Main question</b></td><td>What follows from what I know?</td><td>What must be true to prove this?</td></tr>
<tr><td><b>Useful when</b></td><td>Many conclusions may be needed</td><td>A specific query must be answered</td></tr>
<tr><td><b>Stopping</b></td><td>Goal reached / no new facts</td><td>Goal proved / a required subgoal fails</td></tr>
<tr><td><b>Applications</b></td><td>Planning, monitoring, controlling, interpreting; expert systems and production rule systems</td><td>Debugging, diagnostics, prescription; inference engines and complex databases</td></tr>
</tbody></table></div>
<h4>Advantages and disadvantages</h4>
<p><b>Forward — advantages:</b> can draw multiple conclusions; good basis for arriving at conclusions; more flexible, as it has no limitation on the data derived. <b>Disadvantages:</b> may be time-consuming — it can take a lot of time to eliminate and synchronise available data; the explanation of facts is not very clear.</p>
<p><b>Backward — advantages:</b> the result is already known so it is easy to deduce inferences; quicker than forward chaining because the endpoint is available; correct solutions derived effectively if pre-determined rules are met. <b>Disadvantages:</b> reasoning can only start if the endpoint is known; it does not deduce multiple solutions; it derives only the data needed, making it less flexible.</p>
<div class="note-note"><b>Memory line:</b> Forward asks “What can I conclude?” · Backward asks “What must I prove?” · <b>The modus ponens inference rule is the basis for backward chaining.</b></div>`,
 understand:"LO 3.6 exists solely to compare these, so a table is the expected form. Choose forward when new facts arrive continuously and you want all consequences (monitoring, alerts, applying eligibility rules to every student). Choose backward for a specific query with a large search space (diagnosis, 'is Riya eligible for this job?'). The slides caution these are typical use cases, not absolute restrictions — a system may combine both.",
 examAnswer:"The comparison table on all seven or eight rows, then one advantage and one disadvantage each, then the memory line. Close with: same knowledge base, opposite reasoning direction.",
 mistakes:"Calling backward chaining 'data-driven' or forward chaining 'goal-driven' — the slides list this as a common student mistake. Writing it as prose instead of a table."},

{id:"m3t9", lo:"LO 3.4", marks:5, priority:"high", src:"Chpt 3 semantic deck slides 4–6; Notebook A p.19",
 q:"Construct a semantic network. Explain inheritance and how exceptions are handled.",
 a:`<div class="note-note"><b>A semantic network is a graph in which nodes represent concepts, objects or classes and labelled links represent their semantic relationships.</b></div>
<ul class="list">
<li>Common links: <b>IS-A, INSTANCE-OF, HAS-A, PART-OF</b>.</li>
<li>Knowledge is visually intuitive and supports <b>inheritance</b>.</li>
</ul>
<h4>Inheritance</h4>
<p>Store a general property <b>once</b> and inherit it down the hierarchy. Bird has → Wings, has → Feathers, and by default can → Fly. Sparrow inherits all of these.</p>
<div class="note-warn"><b>Exam point:</b> inheritance avoids repeating general properties, but <b>exceptions must be represented explicitly</b>. Penguin IS-A Bird, but Penguin <b>cannot</b> → Fly, and that exception must be stated on the Penguin node.</div>
<h4>The class-activity rubric (Notebook A, p.19)</h4>
<p>Domain: <b>college placement</b>. Use at least <b>6 nodes</b>, at least <b>5 labelled relationships</b>, include at least one <b>IS-A</b> relationship, and identify one <b>property that could be inherited</b>.</p>
<p><b>The answer drawn in class:</b> Student —IS-A→ Rhea · Rhea —HAS-SKILL→ JAVA · Rhea —studies in→ FCRIT · Student —applies for→ JOB · JOB —offered by→ TCS · TCS —gives→ Offer Letter · Student —has→ Referral · Referral —gets→ Offer Letter.</p>`,
 understand:"The exception problem is the whole reason this topic is examinable rather than trivial. Inheritance is what makes the network compact; exceptions are what make it correct. A question asking you to 'construct' a semantic network is really asking whether you know to mark the exception.",
 examAnswer:"The verb in LO 3.4 is CONSTRUCT, so a drawing is expected, not a description. Draw the network, label every arrow, include an IS-A link, and annotate one inherited property plus one exception. Then define the network and inheritance in two lines each.",
 mistakes:"Drawing unlabelled arrows — the labels are what make it semantic. Forgetting the exception case, which is the standard follow-up. Confusing IS-A (class to superclass) with INSTANCE-OF (individual to class).",
 diagram:"Essential. Animal —IS-A← Mammal and Bird; Mammal → Cat, Dog; Bird → Sparrow, Penguin. Attach 'can fly' to Bird and 'cannot fly' to Penguin, marked as an exception."},

{id:"m3t10", lo:"LO 3.4", marks:5, priority:"high", src:"Chpt 3 semantic deck slides 7–13",
 q:"Differentiate an ontology from a knowledge graph. Give the building blocks of each.",
 a:`<p>An <b>ontology</b> is a <b>formal, shared specification of concepts and relationships in a domain</b> — the schema of meaning. It defines classes, properties and relationships, can express constraints and hierarchies, provides a common vocabulary, and supports consistency and reasoning.</p>
<div class="scroll"><table class="t"><thead><tr><th>Ontology building block</th><th>Meaning</th><th>Example</th></tr></thead><tbody>
<tr><td><b>Classes</b></td><td>Categories</td><td>Student, Company, Job, Skill</td></tr>
<tr><td><b>Individuals</b></td><td>Instances</td><td>Riya, TCS, DeveloperJob</td></tr>
<tr><td><b>Object properties</b></td><td>Link entity → entity</td><td>hasSkill, offersJob, appliesFor</td></tr>
<tr><td><b>Data properties</b></td><td>Link entity → value</td><td>CGPA = 8.4, salary = 8 LPA</td></tr>
<tr><td><b>Constraints</b></td><td>Restrictions on validity</td><td>Job requires ≥ 1 Skill</td></tr>
</tbody></table></div>
<p>A <b>knowledge graph</b> represents facts as <b>entities connected by typed relationships</b>. RDF-based knowledge graphs express statements as triples.</p>
<div class="formula">Triple  =  ( Subject , Predicate , Object )
           e.g.  ( Riya , hasSkill , Python )</div>
<div class="scroll"><table class="t"><thead><tr><th>Aspect</th><th>Ontology</th><th>Knowledge Graph</th></tr></thead><tbody>
<tr><td><b>Purpose</b></td><td>Defines domain meaning / schema</td><td>Stores connected facts / instances</td></tr>
<tr><td><b>Contains</b></td><td>Classes, properties, constraints</td><td>Entities, relations, attributes</td></tr>
<tr><td><b>Example</b></td><td>Student hasSkill Skill</td><td>Riya hasSkill Python</td></tr>
<tr><td><b>Question answered</b></td><td>What kinds of things and links are valid?</td><td>What facts are known about actual entities?</td></tr>
<tr><td><b>Analogy</b></td><td><b>Grammar / blueprint</b></td><td><b>Sentences / populated map</b></td></tr>
</tbody></table></div>
<h4>Taxonomy vs Ontology</h4>
<p>A <b>taxonomy</b> mainly classifies using IS-A links (Job → Technical Job, Management Job). An <b>ontology</b> adds richer relationships, properties and constraints.</p>`,
 understand:"The analogy row is the fastest way to make this stick: ontology = grammar, knowledge graph = the sentences written in that grammar. The retrieval point is what makes knowledge graphs matter — the graph can connect Riya's skill to a job requirement even though nobody ever stored the statement 'Riya matches this job'.",
 examAnswer:"Define each in one line, give the ontology building blocks, give the triple form, then the five-row comparison table ending with the analogy. Add the taxonomy contrast for the last mark.",
 mistakes:"Treating ontology and knowledge graph as synonyms — the slides warn explicitly against this. Confusing object properties (entity → entity) with data properties (entity → value). Drawing a triple with the predicate as a node — the predicate is the labelled EDGE."},

{id:"m3t11", lo:"LO 3.5", marks:5, priority:"high", src:"Chpt 3 semantic deck slides 14–19",
 q:"Apply Semantic Web concepts to explain how intelligent information retrieval is enhanced.",
 a:`<div class="note-note">The <b>Semantic Web</b> aims to make Web data <b>machine-readable and linkable using explicit meaning</b>, not just hyperlinks between pages.</div>
<ul class="list">
<li>Traditional Web: <b>documents linked to documents</b>.</li>
<li>Semantic Web: <b>data linked to data with explicit meaning</b>.</li>
<li>Uses shared identifiers and vocabularies; enables integration across sources; supports machine-readable discovery and reasoning.</li>
</ul>
<h4>The technology stack</h4>
<div class="scroll"><table class="t"><thead><tr><th>Layer</th><th>Role</th></tr></thead><tbody>
<tr><td><b>URI / IRI</b></td><td>Global identifiers — <b>Identify</b></td></tr>
<tr><td><b>RDF</b></td><td>Triples / graph data model — <b>Represent</b></td></tr>
<tr><td><b>RDFS</b></td><td>Classes &amp; property vocabularies — <b>Describe meaning</b></td></tr>
<tr><td><b>OWL</b></td><td>Richer ontology semantics — <b>Describe meaning</b></td></tr>
<tr><td><b>SPARQL</b></td><td>Query graph data — <b>Query</b></td></tr>
<tr><td><b>Applications</b></td><td>Intelligent retrieval</td></tr>
</tbody></table></div>
<div class="note-tip"><b>Memory aid from the slides:</b> URI/IRI = Identify · RDF = Represent · RDFS/OWL = Describe meaning · SPARQL = Query.</div>
<h4>RDF and SPARQL</h4>
<p>In an RDF graph, the <b>subject and object are nodes</b>; the <b>predicate labels the directed edge</b>. SPARQL retrieves RDF data by matching <b>graph patterns</b>:</p>
<div class="formula">SELECT ?student ?job
WHERE {
  ?student  hasSkill       ?skill .
  ?job      requiresSkill  ?skill .
}</div>
<h4>Why retrieval improves</h4>
<p>Query: <i>"Which students match jobs requiring Python?"</i> Retrieval traverses multiple relationships — Student —hasSkill→ Python —requiredBy→ Developer Job — to discover an answer that <b>is not stored as one explicit sentence</b>. Keyword search matches words; semantic retrieval follows relationships.</p>
<h4>How the four concepts fit together</h4>
<div class="formula">Semantic Network → Ontology → Knowledge Graph → Semantic Web
 (relationships)  (formal      (connected     (linked data
                   meaning)      facts)        across systems)</div>
<p><i>A conceptual progression for learning, not a strict historical pipeline — in real systems these overlap.</i></p>`,
 understand:"The examinable comparison at the end of the deck asks for the main focus, representation, typical element and one strength of each of the four concepts. Semantic network → relationships → IS-A link → intuitive. Ontology → meaning + constraints → class/property → precise semantics. Knowledge graph → entities + facts → triple → rich retrieval. Semantic Web → interoperability → RDF/OWL/SPARQL → cross-source integration.",
 examAnswer:"Definition and the documents-vs-data contrast → the stack table with the memory aid → the RDF triple → a short SPARQL pattern → close with the retrieval example showing an answer that was never explicitly stored.",
 mistakes:"Saying the Semantic Web replaces the current Web — it adds a machine-readable meaning layer. Confusing RDF (the triple data model) with RDFS (class and property vocabularies). Describing SPARQL as SQL for tables — it matches GRAPH PATTERNS."}
];

   <b>Initial state:</b> any given configuration.<br>

{
 id:"n_astar", lo:"LO 2.3", marks:10, priority:"high", title:"A* Search",
 src:"CIA-02 Q1 · Notebook A p.7–8 · Notebook B p.2–5",
 concept:`A* combines the cost already paid with the estimated cost remaining, so it avoids expanding paths that are already expensive while still guaranteeing the optimal solution when h is admissible. The class notes list A* explicitly as an MSE numerical, and CIA-02 Q1 was exactly this.`,
 formula:`f(n) = g(n) + h(n)

g(n) = cost so far to reach n      (actual, from the start)
h(n) = estimated cost n → goal     (the heuristic, given in the question)
f(n) = estimated total cost of the path through n`,
 vars:[["OPEN","the fringe — generated but not yet expanded nodes, each tagged with its f value"],
       ["CLOSED","nodes already expanded. The least-f node moves from OPEN to CLOSED"],
       ["Tie-break","when two nodes share the same f, close the one with the SMALLER h — it is closer to the goal (Notebook B, p.2)"]],
 algo:`1. Initialise: OPEN = {s}, CLOSED = { }, g(s) = 0, f(s) = h(s).
2. Fail: if OPEN = { }, terminate and fail.
3. Select: take the minimum-f state n from OPEN, move it to CLOSED.
4. Terminate: if n is a goal, terminate with success and return f(n).
   Recover the solution by backtracking the parent pointers.
5. Expand: otherwise generate the successors of n, add them to OPEN,
   and repeat until the goal node is reached.`,
 props:"Complete: <b>Yes</b> · Optimal: <b>Yes</b> (if h is admissible) · Time: O(b<sup>d</sup>) · Space: O(b<sup>d</sup>)",
 limits:["High memory usage — keeps every generated node.","Time consuming on large graphs.",
  "Heavily dependent on the heuristic: a good heuristic gives a faster search; a poor heuristic makes it behave like uniform-cost search.",
  "Poor scalability.","Explores many unnecessary nodes."],
 worked:{
  title:"CIA-02 Q1 — perform A* on the graph and find the shortest path from a to z",
  given:`Heuristics: h(a)=14, h(b)=12, h(c)=11, h(d)=6, h(e)=4, h(f)=11, h(z)=0
Edges: a–b = 4, a–c = 3, b–f = 5, b–e = 12, f–z = 16, c–e = 10, c–d = 7, d–e = 2, e–z = 5`,
  steps:[
   `<b>Initialise.</b> OPEN = { a<sup>(0+14)=14</sup> }, CLOSED = { }.`,
   `<b>Expand a</b> (f = 14). Successors: b with g = 4, f = 4+12 = <b>16</b>; c with g = 3, f = 3+11 = <b>14</b>.<br>OPEN = { c¹⁴, b¹⁶ } · CLOSED = { a }`,
   `<b>Expand c</b> (f = 14). Successors: e with g = 3+10 = 13, f = <b>17</b>; d with g = 3+7 = 10, f = <b>16</b>.<br>OPEN = { b¹⁶, d¹⁶, e¹⁷ } · CLOSED = { a, c }`,
   `<b>Tie at f = 16</b> between b and d. Apply the tie-break rule: h(d) = 6 &lt; h(b) = 12, so <b>expand d</b>. Successor e via d has g = 10+2 = 12, f = <b>16</b> — better than the earlier g(e) = 13, so <b>update e to g = 12 and repoint its parent to d</b>.<br>OPEN = { b¹⁶, e¹⁶ } · CLOSED = { a, c, d }`,
   `<b>Expand e</b> (f = 16, h(e) = 4 &lt; h(b) = 12). Successor z with g = 12+5 = 17, f = <b>17</b>.<br>OPEN = { b¹⁶, z¹⁷ } · CLOSED = { a, c, d, e }`,
   `<b>Expand b</b> (f = 16). Successors: f with g = 9, f = 9+11 = <b>20</b>; e via b has g = 16, worse than 12 — discard.<br>OPEN = { z¹⁷, f²⁰ }`,
   `<b>Expand z</b> (f = 17) — it is the goal and nothing in OPEN has f &lt; 17, so terminate with success.`,
   `<b>Recover the path by following parent pointers backwards from z:</b> z ← e ← d ← c ← a.`],
  answer:"Shortest path: a → c → d → e → z, cost = 3 + 7 + 2 + 5 = 17. CLOSED order: a, c, d, e, z (note that b is never expanded before the goal).",
  check:"Check every alternative by hand: a–c–e–z = 3+10+5 = 18; a–b–e–z = 4+12+5 = 21; a–b–f–z = 4+5+16 = 25. So 17 is genuinely optimal. ✓"},
 mistakes:[
  `<b>Stopping as soon as the goal is GENERATED.</b> A* terminates when the goal is <i>selected for expansion</i> (popped as the minimum f). Stopping early gives a suboptimal answer — see the exam-level practice problem below, where it gives 19 instead of 18.`,
  `<b>Reading the path off the CLOSED list.</b> The class notes say it twice, once in red: <i>"Don't write the path by directly looking at closed list. Directly go like: G ka parent is D"</i> and <i>"A* makes final path w.r.t. the parent node and starting from G going in reverse."</i>`,
  `Not updating g(n) when a cheaper route to an already-generated node is found. In the worked example, e must be re-costed from 13 down to 12 via d, and its parent repointed.`,
  `Forgetting to add h to g — that turns A* into uniform-cost search.`,
  `Adding a heuristic for the goal. h(goal) = 0 always.`],
 practice:[
  {id:"p_a1", d:"easy", q:"For the CIA-02 graph, what are f(b) and f(c) immediately after expanding the start node a? Which is expanded next?",
   a:`g(b) = 4 and h(b) = 12, so <b>f(b) = 16</b>.<br>g(c) = 3 and h(c) = 11, so <b>f(c) = 14</b>.<br><br>c has the smaller f, so <b>c is expanded next</b>.`},
  {id:"p_a2", d:"basic", q:"Two nodes are both in OPEN with f = 16. One has h = 6, the other h = 12. Which do you expand, and why?",
   a:`Expand the one with <b>h = 6</b>.<br><br>The tie-breaking rule recorded in the class notes (Notebook B, p.2) is: when f values are equal, look at the value of h(n) and close the one with the <b>least h(n)</b> — a smaller h means the node is estimated to be closer to the goal, so it is more likely to lead quickly to a solution.`},
  {id:"p_a3", d:"moderate", q:"In the CIA-02 worked example, node e was first generated from c with g = 13, then later reached from d with g = 12. What must A* do, and why does it matter twice over?",
   a:`A* must <b>update</b> e: set g(e) = 12, recompute f(e) = 12 + 4 = 16, and <b>change e's parent pointer from c to d</b>.<br><br>
   It matters for two separate reasons:<br>
   <b>(1) Cost.</b> Without the update the reported answer would be 3+10+5 = 18 instead of 17.<br>
   <b>(2) Path.</b> The parent pointer is what the path is recovered from, so without the update you would report a → c → e → z rather than a → c → d → e → z.<br><br>
   This is the step students most often skip.`},
  {id:"p_a4", d:"difficult", q:"Perform A* on this graph and give the path and cost. h(S)=17, h(A)=10, h(B)=13, h(C)=4, h(D)=2, h(E)=4, h(F)=1, h(G)=0. Edges: S–A 6, S–B 5, S–C 10, A–E 6, B–E 6, B–D 7, B–C 4, C–D 6, D–E 2, D–F 6, E–F 4, F–G 3.",
   a:`<b>Expand S</b> (f=17): A g=6 f=<b>16</b>; B g=5 f=<b>18</b>; C g=10 f=<b>14</b>.<br>
   <b>Expand C</b> (14): D g=16 f=<b>18</b>.<br>
   <b>Expand A</b> (16): E g=12 f=<b>16</b>.<br>
   <b>Expand E</b> (16): F g=16 f=<b>17</b>.<br>
   <b>Expand F</b> (17): G g=19 f=<b>19</b>.<br>
   OPEN now = { B¹⁸, D¹⁸, G¹⁹ }. <b>G is not the minimum</b> — B and D are, at 18.<br>
   <b>Expand B</b> (18): E improves to g = 5+6 = 11 (f=15); D improves to g = 5+7 = 12 (f=14).<br>
   <b>Expand D</b> (14): F via D would be g=18, worse than 16 — no change.<br>
   <b>Expand E</b> (15): F improves to g = 11+4 = 15, f = <b>16</b>.<br>
   <b>Expand F</b> (16): G improves to g = 15+3 = <b>18</b>.<br>
   <b>Expand G</b> (18) — now it is the minimum, so terminate.<br><br>
   <div class="answer">Path S → B → E → F → G, cost = 5 + 6 + 4 + 3 = <b>18</b></div>`},
  {id:"p_a5", d:"exam-level", q:"THE TRAP. On the graph in the previous question, a student stops the moment G first appears in OPEN and reports cost 19 by the path S→C→A→E→F→G. Identify BOTH errors and give the correct answer.",
   a:`This is the mistake the class notes flag with <i>"not optimal"</i> written beside it (Notebook B, p.4), corrected on the next page to <i>"ans = 18"</i>.<br><br>
   <b>Error 1 — terminating too early.</b> When G was first generated it had f = 19, but B and D were still in OPEN with f = 18 &lt; 19. A* must expand the <b>minimum-f</b> node, so B and D come first — and expanding B improves the route to E and D, which eventually yields G at cost 18. <b>A* terminates when the goal is SELECTED for expansion, not when it is generated.</b><br><br>
   <b>Error 2 — reading the path off the CLOSED list.</b> The CLOSED order was S, C, A, E, F, G, and the student wrote that sequence out as if it were the path. But C is not on the path to A at all — the path must be recovered by following <b>parent pointers backwards from G</b>. The 19-cost route is actually S→A→E→F→G.<br><br>
   <div class="answer">Correct answer: S → B → E → F → G, cost = <b>18</b></div>`},
  {id:"p_a6", d:"exam-level", q:"State the four properties of A* and its five limitations, as recorded in the class notes.",
   a:`<b>Properties:</b> Complete — Yes. Optimal — Yes (if h is admissible). Time — O(b<sup>d</sup>). Space — O(b<sup>d</sup>).<br><br>
   <b>Limitations (Notebook A, p.7):</b><br>
   (i) High memory usage.<br>
   (ii) Time consuming.<br>
   (iii) Heavily dependent on the heuristic — a good heuristic gives a faster search, a poor heuristic makes it behave more like uniform-cost search.<br>
   (iv) Poor scalability.<br>
   (v) Explores many unnecessary nodes.`}]
},

{
 id:"n_ab", lo:"LO 2.5", marks:10, priority:"high", title:"Minimax & Alpha–Beta Pruning",
 src:"CIA-02 Q2 · Notebook A p.11–12 · Notebook B p.6–7",
 concept:`Minimax computes the value each player can guarantee under perfect play. Alpha–beta pruning reaches the SAME decision while skipping branches that cannot change it. The class notes list both as MSE numericals and mark adversarial search "★ 10 marks".`,
 formula:`Prune when   α ≥ β

α (alpha) — for MAX. Best (highest) value MAX has found so far.
            MAX wants α to increase.   Starts at −∞
β (beta)  — for MIN. Best (lowest) value MIN has found so far.
            MIN wants β to decrease.   Starts at +∞

For MAX, update alpha.    For MIN, update beta.`,
 vars:[["△","MAX node — takes the maximum of its children"],
       ["▽","MIN node — takes the minimum of its children"],
       ["□","terminal utilities, always from MAX's perspective"]],
 algo:`Traverse strictly LEFT TO RIGHT, depth-first.
Carry α and β DOWN into children; carry values UP to parents.
After each child returns, update α (at MAX) or β (at MIN),
then test α ≥ β before visiting the next sibling.`,
 worked:{
  title:"Class example (Notebook A, p.12) — leaves −4, −9, 9, 6, −17, −4, −11, 7",
  given:`Root = MAX (△), level 2 = MIN (▽), level 3 = MAX (△), 8 leaves left to right.`,
  steps:[
   `<b>Root A (MAX):</b> α = −∞, β = +∞. Descend to B₁.`,
   `<b>B₁ (MIN):</b> α = −∞, β = +∞. Descend to C₁.`,
   `<b>C₁ (MAX):</b> leaf −4 → α = −4. Leaf −9 → no change. <b>C₁ returns −4.</b>`,
   `<b>Back at B₁:</b> β = min(+∞, −4) = <b>−4</b>. Test α ≥ β? −∞ ≥ −4 is false, so continue to C₂.`,
   `<b>C₂ (MAX):</b> inherits α = −∞, β = −4. Leaf 9 → α = 9. Test: <b>α = 9 ≥ β = −4 → PRUNE.</b> The next leaf (<b>6</b>) is never examined. C₂ returns 9.`,
   `<b>Back at B₁:</b> β = min(−4, 9) = −4. <b>B₁ returns −4.</b>`,
   `<b>Back at root A:</b> α = max(−∞, −4) = <b>−4</b>. Descend to B₂ with α = −4, β = +∞.`,
   `<b>C₃ (MAX):</b> α = −4, β = +∞. Leaf −17 → value −17. Leaf −4 → value −4. <b>C₃ returns −4.</b>`,
   `<b>Back at B₂:</b> β = min(+∞, −4) = −4. Test: <b>α = −4 ≥ β = −4 → PRUNE.</b> The entire node C₄ and both its leaves (<b>−11 and 7</b>) are never examined. B₂ returns −4.`,
   `<b>Root A:</b> α = max(−4, −4) = <b>−4</b>.`],
  answer:"Root value = −4, with α = −4 and β = +∞ at the root. Pruned: the leaf 6 (under C₂), and the whole right-most MAX node C₄ with its leaves −11 and 7 — 3 of 8 leaves saved.",
  check:`Cross-check with plain minimax: C₁ = max(−4,−9) = −4, C₂ = max(9,6) = 9, C₃ = max(−17,−4) = −4, C₄ = max(−11,7) = 7. Then B₁ = min(−4,9) = −4, B₂ = min(−4,7) = −4. Root = max(−4,−4) = −4. ✓ Same answer, fewer nodes — exactly as the theory promises.`},
 mistakes:[
  `Updating β at a MAX node or α at a MIN node. <b>MAX updates α; MIN updates β.</b>`,
  `Testing the pruning condition before any child has returned. You can only prune after at least one child has a value.`,
  `Pruning on α &gt; β only. The condition is <b>α ≥ β</b> — equality prunes too, as node C₄ above shows.`,
  `Traversing right-to-left. Alpha–beta is order-dependent; unless told otherwise, always go strictly left-to-right.`,
  `Claiming alpha–beta gives a different answer from minimax — it gives the identical decision.`],
 practice:[
  {id:"p_ab1", d:"easy", q:"A MIN node has three children with minimax values 12, 5 and 8. What does it return, and why?",
   a:`It returns <b>5</b>. A MIN node models the opponent, who chooses the option that is <i>worst for MAX</i> — the minimum of its children's values.`},
  {id:"p_ab2", d:"basic", q:"State the pruning condition, say which value each player updates, and give the initial values at the root.",
   a:`<b>Pruning condition:</b> α ≥ β ⇒ prune the remaining branches at that node.<br><br>
   <b>α</b> belongs to <b>MAX</b> — the best (highest) value MAX has found so far; MAX wants α to increase.<br>
   <b>β</b> belongs to <b>MIN</b> — the best (lowest) value MIN has found so far; MIN wants β to decrease.<br><br>
   <b>At the root:</b> α = −∞, β = +∞.`},
  {id:"p_ab3", d:"moderate", q:"Compute the minimax value for the tree with leaves −2, 15, 3, 6, −13, −3, 7, 6 (root MAX, level 2 MIN, level 3 MAX). What does alpha–beta prune?",
   a:`<b>Minimax:</b><br>Level 3 (MAX): max(−2,15) = 15 · max(3,6) = 6 · max(−13,−3) = −3 · max(7,6) = 7<br>
   Level 2 (MIN): B₁ = min(15,6) = 6 · B₂ = min(−3,7) = −3<br>
   Root (MAX): max(6, −3) = <b>6</b>. MAX plays the left branch.<br><br>
   <b>Alpha–beta trace:</b> C₁ returns 15, so β(B₁) = 15. C₂ with β = 15: leaf 3 → α = 3, leaf 6 → α = 6; neither reaches 15, so nothing is pruned and C₂ returns 6. B₁ returns min(15,6) = 6, so α(root) = 6.<br>
   B₂ inherits α = 6. C₃ returns −3, so β(B₂) = −3. Now <b>α = 6 ≥ β = −3 → PRUNE C₄ entirely</b>, including leaves <b>7 and 6</b>.<br><br>
   <div class="answer">Root = 6. Pruned: node C₄ and its two leaves (7 and 6).</div>`},
  {id:"p_ab4", d:"difficult", q:"CIA-02 Q2. Perform alpha–beta on the tree with leaves −16, 8, 0, 12, 13, −6, −15, −2 (root MAX, level 2 MIN, level 3 MAX). Give the root value and list what is pruned.",
   a:`<b>C₁ (MAX):</b> −16 → α = −16; 8 → α = 8. Returns <b>8</b>.<br>
   <b>B₁ (MIN):</b> β = 8. α = −∞ &lt; 8, so continue.<br>
   <b>C₂ (MAX):</b> α = −∞, β = 8. Leaf 0 → α = 0 (0 &lt; 8, continue). Leaf 12 → α = 12; now α = 12 ≥ β = 8 — but 12 was the <i>last</i> child, so there is nothing left to prune. Returns <b>12</b>.<br>
   <b>B₁:</b> β = min(8, 12) = <b>8</b>. Root α = 8.<br>
   <b>C₃ (MAX):</b> α = 8, β = +∞. 13 → α = 13; −6 → no change. Returns <b>13</b>.<br>
   <b>B₂:</b> β = 13. α = 8 &lt; 13, so continue.<br>
   <b>C₄ (MAX):</b> α = 8, β = 13. Leaves −15 and −2 → returns <b>−2</b>.<br>
   <b>B₂:</b> β = min(13, −2) = −2. Now α = 8 ≥ β = −2 → prune — but C₄ was B₂'s last child, so again nothing remains.<br><br>
   <div class="answer">Root = max(8, −2) = <b>8</b>. MAX plays the left branch. With strict left-to-right ordering, <b>no leaves are actually pruned</b> in this tree.</div>
   <i>This is a legitimate and important answer. State clearly that the cut-off condition is reached at C₂ (α = 12 ≥ β = 8) and at B₂ (α = 8 ≥ β = −2), but that in both cases no unexplored siblings remain, so no saving is made. Examiners award marks for the correct α/β trace, not for pruning something that was not there.</i>`},
  {id:"p_ab5", d:"exam-level", q:"Two students run alpha–beta on the same tree but visit children in opposite orders and prune different numbers of nodes. One concludes alpha–beta is unreliable. Is that right?",
   a:`<b>No — the student is wrong about reliability, but right that the count changes.</b><br><br>
   <b>What does change:</b> alpha–beta is order-dependent. How many nodes get pruned depends entirely on the order children are visited. In the best case (best move first) far more of the tree is cut; in the worst case nothing is pruned and it degenerates to plain minimax.<br><br>
   <b>What does not change:</b> the <b>decision</b>. Alpha–beta only ever discards branches that provably cannot affect the final minimax value — that is exactly what the α ≥ β test establishes. Both students must arrive at the same root value and the same optimal move.<br><br>
   <div class="answer">Alpha–beta = the same correct decision as minimax, with a variable, order-dependent saving in nodes explored.</div>`}]
}
];

{
 id:"n_fol", lo:"LO 3.1", marks:5, priority:"high", title:"English → First-Order Predicate Logic",
 src:"Chpt 3 slides 24–28 · extra problems.docx · Notebook A p.14–15 · Notebook B p.8–10",
 concept:`Translate English sentences into FOL. The MSE list names "convert sentence" explicitly, the extra-problems handout is almost entirely conversion practice, and the class notes devote three pages to the patterns. This is the single highest-frequency Module 3 task.`,
 formula:`∀x  P(x) → Q(x)      for "all"
∃x  P(x) ∧ Q(x)      for "some"

O-P-Q-C   Object · Predicate · Quantifier · Connective`,
 vars:[["Constants","objects — john, apples, Peanuts. Nouns and noun phrases."],
       ["Predicates","properties and relations — likes(john, apples). Verbs and verb phrases."],
       ["Functions","transform objects, one value per input — fatherof(John)."],
       ["∀ universal","true for ALL objects"],["∃ existential","exists AT LEAST ONE object"]],
 algo:`The five rules from class (Notebook B, p.9):

1. 'Every' / 'All'  use  →
2. 'Some'  uses  AND (∧)
3. One object   → unary predicate  (a property)
   Two objects  → binary predicate (a relationship)
4. Be careful with 'No'
5. When there are different people, use two variables`,
 worked:{
  title:"The four master patterns and the class examples",
  given:`These four patterns cover almost every sentence you will be given (Notebook A p.15, Notebook B p.10).`,
  steps:[
   `<b>All A are B</b> &nbsp;→&nbsp; <code>∀x [ A(x) → B(x) ]</code>`,
   `<b>Some A are B</b> &nbsp;→&nbsp; <code>∃x [ A(x) ∧ B(x) ]</code>`,
   `<b>No A are B</b> &nbsp;→&nbsp; <code>∀x [ A(x) → ¬B(x) ]</code>`,
   `<b>Every A relates to some B</b> &nbsp;→&nbsp; <code>∀x [ A(x) → ∃y ( B(y) ∧ R(x,y) ) ]</code>`,
   `<b>All students study mathematics.</b><br><code>∀x ( Student(x) → Studies(x, Mathematics) )</code>`,
   `<b>Some students play football.</b><br><code>∃x ( Student(x) ∧ Plays(x, Football) )</code>`,
   `<b>If a person is a teacher, then they teach some subject.</b><br><code>∀x ( Teacher(x) → ∃y Teaches(x, y) )</code>`,
   `<b>No student is lazy.</b><br><code>∀x ( Student(x) → ¬Lazy(x) )</code>`,
   `<b>Every father loves his child.</b><br><code>∀x ∀y ( Father(x,y) → Loves(x,y) )</code> — two different people, so two variables.`,
   `<b>Every dog barks and has four legs.</b><br><code>∀x ( Dog(x) → ( Barks(x) ∧ HasFourLegs(x) ) )</code>`],
  answer:"Identify the quantifier word first — 'all/every' → ∀ with →; 'some/there is' → ∃ with ∧; 'no' → ∀ with ¬ in the consequent. Then count how many distinct people or objects the sentence mentions to decide how many variables you need.",
  check:"Read your formula back in English. ∀x (Student(x) ∧ Studies(x, Maths)) reads as 'everything in the universe is a student who studies maths' — including chairs and planets. If the read-back is absurd, you have used the wrong connective."},
 mistakes:[
  `<b>∀ with ∧</b> instead of →. This asserts the property of every object in the universe.`,
  `<b>∃ with →</b> instead of ∧. This is trivially satisfied by anything failing the antecedent, so it says almost nothing.`,
  `Using one variable when the sentence mentions two different people.`,
  `Mis-scoping quantifiers. 'You can fool some of the people all of the time' is ∃x ∀t …, whereas 'all of the people some of the time' is ∀x ∃t … — the ORDER changes the meaning.`,
  `Handling 'No' as ¬∀. 'No A are B' is ∀x (A(x) → ¬B(x)), not ¬∀x (A(x) → B(x)) — the latter only says 'not all'.`],
 practice:[
  {id:"p_f1", d:"easy", q:"Convert: (a) All birds fly. (b) Some boys play cricket. (c) Every man respects his parent.",
   a:`(a) <code>∀x ( bird(x) → fly(x) )</code><br>(b) <code>∃x ( boys(x) ∧ play(x, cricket) )</code><br>(c) <code>∀x ( man(x) → respects(x, parent) )</code><br><br><i>Note the pattern: 'all' → implication, 'some' → conjunction.</i>`},
  {id:"p_f2", d:"easy", q:"Convert: (a) All men drink coffee. (b) Some men drink coffee. (c) Riya is intelligent. (d) Riya likes AI.",
   a:`(a) <code>∀x ( man(x) → drink(x, coffee) )</code><br>(b) <code>∃x ( man(x) ∧ drink(x, coffee) )</code><br>
   (c) <code>Intelligent(Riya)</code> — one object, so a <b>unary</b> predicate (a property).<br>
   (d) <code>likes(Riya, AI)</code> — two objects, so a <b>binary</b> predicate (a relationship).`},
  {id:"p_f3", d:"basic", q:"Convert: (a) Every doctor has a degree. (b) Some doctors are researchers. (c) No student is absent.",
   a:`(a) <code>∀x ( Doctor(x) → hasdegree(x) )</code><br>(b) <code>∃x ( Doctor(x) ∧ researcher(x) )</code><br>(c) <code>∀x ( student(x) → ¬Absent(x) )</code>`},
  {id:"p_f4", d:"moderate", q:"Convert: (a) Not all students like both Mathematics and Science. (b) Everyone likes McDonalds. (c) All children like McDonalds. (d) Everyone likes McDonalds unless they are allergic to it.",
   a:`(a) <code>¬∀x [ student(x) → like(x, Mathematics) ∧ like(x, Science) ]</code><br>
   (b) <code>∀x likes(x, McDonalds)</code> — no guard needed; the claim really is about everyone.<br>
   (c) <code>∀x ( child(x) ⇒ likes(x, McDonalds) )</code> — a guard IS needed, because the claim is restricted to children.<br>
   (d) <code>∀x ( ¬allergic(x, McDonalds) ⇒ likes(x, McDonalds) )</code> — 'unless B' becomes 'if not B'.<br><br>
   <i>Compare (b) and (c): the guard appears exactly when the English restricts the class.</i>`},
  {id:"p_f5", d:"difficult", q:"Convert: (a) A person buys an expensive policy. (b) No person buys an expensive policy. (c) Every person who buys a policy is smart. (d) Every person who exercises is healthier than a person who does not.",
   a:`(a) <code>∃x ∃y ( Person(x) ∧ Policy(y) ∧ Expensive(y) ∧ Buys(x,y) )</code><br>
   (b) <code>∀x ∀y ( Person(x) ∧ Policy(y) ∧ Expensive(y) → ¬Buys(x,y) )</code><br>
   (c) <code>∀x ( Person(x) ∧ Buys(x, Policy) → Smart(x) )</code><br>
   (d) <code>∀x ∀y ( ( Person(x) ∧ Exercises(x) ∧ Person(y) ∧ ¬Exercises(y) ) → Healthier(x,y) )</code><br><br>
   <i>(d) is a comparative — it needs two variables because it compares two different people.</i>`},
  {id:"p_f6", d:"exam-level", q:"Convert: (a) If a robot has a key and is activated, it can enter any unlocked room. (b) No one who cheats in an exam is an honest student. (c) If a suspect is guilty, then at least one piece of evidence must exist against them. (d) There is a student who studies every subject.",
   a:`(a) <code>∀x ∀y ( ( Robot(x) ∧ HasKey(x) ∧ Activated(x) ∧ Unlocked(y) ) → Enter(x,y) )</code> — 'any unlocked room' inside a conditional becomes a universal over y.<br>
   (b) <code>∀x ( Cheats(x, Exam) → ¬HonestStudent(x) )</code><br>
   (c) <code>∀x ( Guilty(x) → ∃y Evidence(y, x) )</code> — 'at least one' is an existential <b>nested inside</b> the universal.<br>
   (d) <code>∃x ( Student(x) ∧ ∀y ( Subject(y) → Studies(x,y) ) )</code> — existential outside, universal inside; the order matters.<br><br>
   <i>Pattern check: whenever the English says 'at least one' or 'some' AFTER an 'if', you need ∃ nested inside ∀.</i>`}]
},

{
 id:"n_cnf", lo:"LO 3.2", marks:5, priority:"high", title:"Conversion to CNF",
 src:"Chpt 3 slides 34, 43–45 · Notebook A p.15–16 · Notebook B p.12",
 concept:`Resolution only works on clauses — disjunctions of literals. CNF conversion is the mechanical preprocessing step, examined both on its own and as step 2 of every resolution proof.`,
 formula:`CNF = a conjunction of disjunctions of literals
      e.g.  (A ∨ ¬B) ∧ (B ∨ ¬C ∨ ¬D)

Literal = an atom or its negation      Clause = an OR of literals`,
 vars:[["Skolemization","removing ∃. A constant replacing an ∃-variable is a Skolem constant; a function used to replace one is a Skolem function. A skolemized sentence is satisfiable exactly when the original is."]],
 algo:`Propositional — the four short rules (Notebook A, p.16):
1. Eliminate ⇔ , replacing α ⇔ β with (α → β) ∧ (β → α)
2. Eliminate → , replacing α → β with ¬α ∨ β
3. Move ¬ inwards using De Morgan's rules and double negation
4. Apply distributivity (∨ over ∧) and flatten

First-order — insert two extra steps:
   … 3. Move ¬ inwards
       4. Rename / standardize variables
       5. Skolemize (eliminate ∃)
       6. Drop the universal quantifiers
       7. Distribute ∨ over ∧`,
 worked:{
  title:"Convert the Wumpus-world breeze rule to CNF",
  given:`B₁,₁ ⇔ (P₁,₂ ∨ P₂,₁)`,
  steps:[
   `<b>Step 1 — Eliminate ⇔</b>, replacing α ⇔ β with (α → β) ∧ (β → α):<br><code>(B₁,₁ → (P₁,₂ ∨ P₂,₁)) ∧ ((P₁,₂ ∨ P₂,₁) → B₁,₁)</code>`,
   `<b>Step 2 — Eliminate →</b>, replacing α → β with ¬α ∨ β:<br><code>(¬B₁,₁ ∨ P₁,₂ ∨ P₂,₁) ∧ (¬(P₁,₂ ∨ P₂,₁) ∨ B₁,₁)</code>`,
   `<b>Step 3 — Move ¬ inwards</b> using De Morgan and double negation:<br><code>(¬B₁,₁ ∨ P₁,₂ ∨ P₂,₁) ∧ ((¬P₁,₂ ∧ ¬P₂,₁) ∨ B₁,₁)</code>`,
   `<b>Step 4 — Apply distributivity</b> of ∨ over ∧ and flatten:<br><code>(¬B₁,₁ ∨ P₁,₂ ∨ P₂,₁) ∧ (¬P₁,₂ ∨ B₁,₁) ∧ (¬P₂,₁ ∨ B₁,₁)</code>`],
  answer:"Three clauses: (¬B₁,₁ ∨ P₁,₂ ∨ P₂,₁), (¬P₁,₂ ∨ B₁,₁), (¬P₂,₁ ∨ B₁,₁). Each is a disjunction of literals joined by ∧ — that is CNF.",
  check:"Count the clauses. A ⇔ always produces at least two implications, so a biconditional can never collapse to a single clause. If you got one clause from a ⇔, you dropped half the sentence."},
 mistakes:[
  `Distributing ∧ over ∨ instead of ∨ over ∧. CNF is <b>AND of ORs</b>, so you push the ORs down.`,
  `Skipping the rename/standardize step in FOL, then resolving two clauses that accidentally share a variable name.`,
  `Dropping the universal quantifiers BEFORE skolemizing. The order is rename → skolemize → drop ∀.`,
  `Forgetting that ⇔ produces two implications, so the answer must have at least two clauses.`],
 practice:[
  {id:"p_c1", d:"easy", q:"Convert A → B to clausal form. Then rewrite ¬A ∨ ¬B ∨ C as an implication.",
   a:`<b>A → B</b> becomes <code>¬A ∨ B</code>.<br><br>
   <b>¬A ∨ ¬B ∨ C:</b> group the negatives — ¬A ∨ ¬B = ¬(A ∧ B) by De Morgan, so the clause is <code>¬(A ∧ B) ∨ C</code> = <b><code>A ∧ B → C</code></b>.<br><br>
   <i>This is exactly the Horn-clause rewrite: a clause with at most one positive literal is an IF–THEN rule.</i>`},
  {id:"p_c2", d:"moderate", q:"Convert to CNF: ∀x ( food(x) → likes(John, x) ) and ∀x ∀y ( eats(x,y) ∧ ¬killed(x) → food(y) ).",
   a:`<b>First sentence.</b> Eliminate →: <code>∀x ( ¬food(x) ∨ likes(John, x) )</code>. No ∃ to skolemize. Drop ∀:<br>
   <b><code>¬food(x) ∨ likes(John, x)</code></b><br><br>
   <b>Second sentence.</b> Eliminate →: <code>∀x∀y ( ¬[ eats(x,y) ∧ ¬killed(x) ] ∨ food(y) )</code><br>
   Move ¬ inwards by De Morgan: <code>∀x∀y ( ¬eats(x,y) ∨ killed(x) ∨ food(y) )</code><br>
   Rename to y, z and drop ∀:<br>
   <b><code>¬eats(y,z) ∨ killed(y) ∨ food(z)</code></b>`},
  {id:"p_c3", d:"exam-level", q:"Explain Skolemization, when to use a constant versus a function, and why it is valid.",
   a:`<b>What it is.</b> Skolemization removes existential quantifiers, named after the logician Skolem. A constant replacing an ∃-variable is a <b>Skolem constant</b>; a function used in replacing a variable is a <b>Skolem function</b>.<br><br>
   <b>Which to use.</b> If the ∃ is not inside any ∀, replace the variable with a fresh <i>constant</i>: ∃x P(x) becomes P(C). If the ∃ falls inside one or more ∀, the witness may depend on those variables, so replace it with a <i>function</i> of them: ∀x ∃y Loves(x,y) becomes ∀x Loves(x, f(x)).<br><br>
   <b>Why it is valid.</b> A skolemized sentence is <b>satisfiable exactly when the original is satisfiable</b>. Resolution is a refutation procedure — it only ever asks whether a clause set is unsatisfiable — so preserving satisfiability is all that is required. Note it does <i>not</i> preserve logical equivalence, only satisfiability.`}]
},

{
 id:"n_res", lo:"LO 3.2", marks:10, priority:"high", title:"Resolution",
 src:"Chpt 3 slides 35–46 · extra problems.docx · Notebook A p.16–18 · Notebook B p.14–18",
 concept:`Resolution is proof by contradiction. To prove KB ⊨ α, assume ¬α, add it to the knowledge base, and derive the empty clause. Reaching ☐ means the assumption was impossible, so α must be true. The MSE list names "Resolution graph" explicitly.`,
 formula:`From (A ∨ B) and (¬B ∨ C), infer (A ∨ C)
        — resolve on the complementary pair B / ¬B

☐  = the empty clause = a disjunction of no disjuncts = FALSE`,
 vars:[["Complementary literals","a pair like P and ¬P. Remove both, then OR together everything that is left."],
       ["Resolvent","the new clause produced; added to the set if not already present."],
       ["☐ empty clause","arises from resolving two complementary UNIT literals. It signals a contradiction."]],
 algo:`The four steps (Notebook A, p.16):

1. Conversion of facts into first-order logic / propositional logic
2. Convert the FOL statements into CNF
3. Negate the statement which needs to be proved (proof by contradiction)
4. Draw the resolution graph (with unification)

When do we stop?
  Case 1: empty clause ☐ obtained  ⇒ contradiction ⇒ KB ⊨ α  ✓ PROVED
  Case 2: no new clause can be generated ⇒ KB ⊭ α  ✗ NOT PROVED`,
 worked:{
  title:"Class example (Notebook A p.16, Notebook B p.14) — prove Raja is angry",
  given:`Facts: (1) Renee is hungry. (2) If Renee is hungry, she barks. (3) If Renee is barking, then Raja is angry.
Convert to propositional logic and prove by resolution that Raja is angry.`,
  steps:[
   `<b>Step 1 — Conversion to propositional logic.</b><br>Let <code>p</code> = Renee is hungry, <code>q</code> = Renee is barking, <code>r</code> = Raja is angry.<br>1) <code>p</code> &nbsp; 2) <code>p → q</code> &nbsp; 3) <code>q → r</code>`,
   `<b>Step 2 — Conversion to CNF.</b> Replace each α → β with ¬α ∨ β:<br>1) <code>p</code> &nbsp; 2) <code>¬p ∨ q</code> &nbsp; 3) <code>¬q ∨ r</code>`,
   `<b>Step 3 — Negate the statement to be proved.</b> The goal is r, so assume <code>¬r</code> and add it as clause 4.`,
   `<b>Step 4a.</b> Resolve <code>¬r</code> with <code>(¬q ∨ r)</code>. Complementary pair r / ¬r; removing both leaves <b><code>¬q</code></b> — clause 5.`,
   `<b>Step 4b.</b> Resolve <code>¬q</code> with <code>(¬p ∨ q)</code>. Complementary pair q / ¬q; removing both leaves <b><code>¬p</code></b> — clause 6.`,
   `<b>Step 4c.</b> Resolve <code>¬p</code> with <code>p</code>. Both are unit clauses and complementary, so nothing remains: the <b>empty clause ☐</b>.`],
  answer:"The empty clause is derived, so the assumption ¬r is false. Therefore r is true — Raja is angry. ∎",
  check:"Sanity check by forward reasoning: p is given; p → q gives q; q → r gives r. Same conclusion reached directly. ✓"},
 mistakes:[
  `<b>Forgetting to negate the goal.</b> Resolution is a refutation method — without ¬α you can never reach ☐.`,
  `Resolving two clauses on more than one complementary pair at once. Resolve on exactly one pair per step.`,
  `Combining the remaining literals with ∧. They are always combined with <b>∨</b> — the class notes underline this: "always combined with OR".`,
  `Concluding 'α is false' when no contradiction is found. It only means the KB cannot prove α.`,
  `Forgetting the substitution when variables are present. Write {Peanuts/x} beside every FOL resolution step.`],
 practice:[
  {id:"p_r1", d:"moderate", q:"From extra problems.docx: (i) Mammals drink milk. (ii) Man is mortal. (iii) Man is a mammal. (iv) Tom is a man. Prove Tom drinks milk, using (a) modus ponens and (b) resolution.",
   a:`<b>Step 1 — Convert to PL/FOL:</b><br>
   P: <code>mammal(Tom) → drink(Tom, Milk)</code><br>Q: <code>man(Tom) → mortal(Tom)</code><br>
   R: <code>man(Tom) → mammal(Tom)</code><br>S: <code>man(Tom)</code><br><br>
   <b>(a) Proof by modus ponens (forward chaining):</b><br>
   1. mammal(Tom) → drink(Tom, Milk) &nbsp;[Premise]<br>
   2. man(Tom) → mortal(Tom) &nbsp;[Premise]<br>
   3. man(Tom) → mammal(Tom) &nbsp;[Premise]<br>
   4. man(Tom) &nbsp;[Premise]<br>
   5. <b>mammal(Tom)</b> &nbsp;[Modus ponens (3,4)]<br>
   6. <b>drink(Tom, Milk)</b> &nbsp;[Modus ponens (1,5)] — hence the proof.<br><br>
   <b>(b) Proof by resolution.</b> Clausal form:<br>
   1) <code>¬mammal(Tom) ∨ drink(Tom, Milk)</code><br>2) <code>¬man(Tom) ∨ mortal(Tom)</code><br>
   3) <code>¬man(Tom) ∨ mammal(Tom)</code><br>4) <code>man(Tom)</code><br><br>
   Negate the goal: <code>¬drink(Tom, Milk)</code>.<br>
   ¬drink(Tom,Milk) + (1) → <code>¬mammal(Tom)</code><br>
   ¬mammal(Tom) + (3) → <code>¬man(Tom)</code><br>
   ¬man(Tom) + (4) → <b>☐ Null clause</b><br><br>
   <div class="answer">Hence drink(Tom, Milk) is true by contradiction. Note clause (2) was never used — that is perfectly acceptable.</div>`},
  {id:"p_r2", d:"moderate", q:"For the same knowledge base, prove that Tom is mortal by modus ponens and by resolution.",
   a:`<b>Modus ponens:</b> from Q: man(Tom) → mortal(Tom) and S: man(Tom), infer <code>mortal(Tom)</code> by Modus ponens (2,4). A single step.<br><br>
   <b>Resolution:</b> negate the goal to get <code>¬mortal(Tom)</code>.<br>
   ¬mortal(Tom) + <code>¬man(Tom) ∨ mortal(Tom)</code> → <code>¬man(Tom)</code><br>
   ¬man(Tom) + <code>man(Tom)</code> → <b>☐ Null clause</b><br><br>
   <div class="answer">Hence mortal(Tom) is true by contradiction.</div>`},
  {id:"p_r3", d:"difficult", q:"From extra problems.docx: (i) If a triangle is equilateral then it is isosceles. (ii) If a triangle is isosceles then sides AB and AC are equal. (iii) If AB and AC are equal then angles B and C are equal. (iv) ABC is an equilateral triangle. Prove angle B = angle C by modus ponens and resolution.",
   a:`<b>Step 1 — Convert into PL/FOL:</b><br>
   <code>Equilateral(ABC) → Isosceles(ABC)</code><br><code>Isosceles(ABC) → Equal(AB, AC)</code><br>
   <code>Equal(AB, AC) → Equal(B, C)</code><br><code>Equilateral(ABC)</code><br><br>
   <b>Proof by modus ponens (forward chaining).</b> Goal: Equal(B,C).<br>
   1. Equilateral(ABC) → Isosceles(ABC) &nbsp;[Premise]<br>
   2. Isosceles(ABC) → Equal(AB,AC) &nbsp;[Premise]<br>
   3. Equal(AB,AC) → Equal(B,C) &nbsp;[Premise]<br>
   4. Equilateral(ABC) &nbsp;[Premise]<br>
   5. <b>Isosceles(ABC)</b> &nbsp;[Modus ponens (1,4)]<br>
   6. <b>Equal(AB,AC)</b> &nbsp;[Modus ponens (2,5)]<br>
   7. <b>Equal(B,C)</b> &nbsp;[Modus ponens (3,6)] — hence the proof.<br><br>
   <b>Proof by resolution.</b> Clausal form (A → B ⇒ ¬A ∨ B):<br>
   1) <code>¬Equilateral(ABC) ∨ Isosceles(ABC)</code><br>2) <code>¬Isosceles(ABC) ∨ Equal(AB,AC)</code><br>
   3) <code>¬Equal(AB,AC) ∨ Equal(B,C)</code><br>4) <code>Equilateral(ABC)</code><br><br>
   Assume the negation: <code>¬Equal(B,C)</code>.<br>
   ¬Equal(B,C) + (3) → <code>¬Equal(AB,AC)</code><br>
   ¬Equal(AB,AC) + (2) → <code>¬Isosceles(ABC)</code><br>
   ¬Isosceles(ABC) + (1) → <code>¬Equilateral(ABC)</code><br>
   ¬Equilateral(ABC) + (4) → <b>☐ Null clause</b><br><br>
   <div class="answer">Hence Equal(B,C) is true by contradiction.</div>`},
  {id:"p_r4", d:"exam-level", q:"THE CLASSIC. (1) John likes all kinds of food. (2) Apple and vegetables are food. (3) Anything anyone eats and is not killed by is food. (4) Anil eats peanuts and is still alive. (5) Harry eats everything that Anil eats. Prove by resolution that John likes peanuts.",
   a:`<b>Step 1 — Conversion of facts into FOPL:</b><br>
   a) <code>∀x food(x) → likes(John, x)</code><br>
   b) <code>food(Apple) ∧ food(vegetables)</code><br>
   c) <code>∀x ∀y eats(x,y) ∧ ¬killed(x) → food(y)</code><br>
   d) <code>eats(Anil, Peanuts) ∧ alive(Anil)</code><br>
   e) <code>∀x eats(Anil, x) → eats(Harry, x)</code><br>
   f) <code>∀x killed(x) → ¬alive(x)</code> &nbsp;<i>added predicate</i><br>
   g) <code>∀x alive(x) → ¬killed(x)</code> &nbsp;<i>added predicate</i><br>
   h) Goal: <code>likes(John, Peanuts)</code><br><br>
   <b>Step 2 — Convert to CNF</b> (eliminate implications, move ¬ inwards, standardize variables, drop ∀ — no existentials, so no Skolemization):<br>
   1) <code>¬food(x) ∨ likes(John, x)</code><br>2) <code>food(Apple)</code><br>3) <code>food(vegetables)</code><br>
   4) <code>¬eats(y,z) ∨ killed(y) ∨ food(z)</code><br>5) <code>eats(Anil, Peanuts)</code><br>6) <code>alive(Anil)</code><br>
   7) <code>¬eats(Anil, w) ∨ eats(Harry, w)</code><br>8) <code>killed(g) ∨ alive(g)</code><br>9) <code>¬alive(k) ∨ ¬killed(k)</code><br><br>
   <b>Step 3 — Negate the conclusion:</b> <code>¬likes(John, Peanuts)</code><br><br>
   <b>Step 4 — Resolution graph with unification:</b><br>
   1. <code>¬likes(John,Peanuts)</code> + <code>¬food(x) ∨ likes(John,x)</code> &nbsp;{Peanuts/x}&nbsp; → <code>¬food(Peanuts)</code><br>
   2. + <code>¬eats(y,z) ∨ killed(y) ∨ food(z)</code> &nbsp;{Peanuts/z}&nbsp; → <code>¬eats(y,Peanuts) ∨ killed(y)</code><br>
   3. + <code>eats(Anil,Peanuts)</code> &nbsp;{Anil/y}&nbsp; → <code>killed(Anil)</code><br>
   4. + <code>¬alive(k) ∨ ¬killed(k)</code> &nbsp;{Anil/k}&nbsp; → <code>¬alive(Anil)</code><br>
   5. + <code>alive(Anil)</code> → <b>☐ empty clause</b><br><br>
   <div class="answer">Since we obtain the empty clause at the end of the resolution graph, ¬likes(John, Peanuts) is false — hence <b>John likes peanuts</b>. The assumption was incorrect.</div>
   <i>Clauses 2, 3 and 7 are never used. That is expected and costs no marks.</i>`}]
},

{
 id:"n_chain", lo:"LO 3.3", marks:10, priority:"high", title:"Forward & Backward Chaining",
 src:"Chpt 3 Forward_Backward_Chaining deck (full) · Knowledge slides 55–64",
 concept:`Two directions of rule-based reasoning over the same knowledge base. Forward chaining starts from known facts and derives everything that follows; backward chaining starts from a goal and works back to the facts. The MSE list names both.`,
 formula:`Forward:   FACTS → rules → new FACTS → goal      (data-driven)
Backward:  GOAL → rules → subgoals → facts       (goal-driven)`,
 vars:[["Fact","something the system knows, e.g. GoodCoding(Riya)"],
       ["Rule","how new knowledge is derived, e.g. GoodCoding(x) ∧ GoodAptitude(x) → TechnicalEligible(x)"],
       ["Inference","using existing facts + rules to derive information that was not explicitly stored"],
       ["Substitution","the variable binding found by unification, e.g. x = Riya. Show it at every step."]],
 algo:`FORWARD CHAINING
1. Start with all known facts.
2. Find rules whose premises are satisfied.
3. Fire a rule and add its conclusion as a new fact.
4. Repeat with the expanded fact set.
5. Stop when the goal is derived or no new facts can be generated.

BACKWARD CHAINING
1. Start with the query/goal to be proved.
2. Find a rule whose conclusion matches the goal.
3. Replace the goal by the rule's premises (subgoals).
4. Recursively prove each subgoal using facts or other rules.
5. Succeed if all required subgoals are proved; otherwise backtrack/fail.`,
 worked:{
  title:"Placement eligibility — derive the goal in both directions",
  given:`Known facts: GoodCoding(Riya), GoodAptitude(Riya), GoodCommunication(Riya)
Rules:
  R1: GoodCoding(x) ∧ GoodAptitude(x)          → TechnicalEligible(x)
  R2: TechnicalEligible(x) ∧ GoodCommunication(x) → InterviewReady(x)
  R3: InterviewReady(x)                         → PlacementReady(x)`,
  steps:[
   `<b>FORWARD CHAINING — initial KB:</b> GoodCoding(Riya), GoodAptitude(Riya), GoodCommunication(Riya).`,
   `<b>R1 matches</b> with the substitution x = Riya, since both GoodCoding(Riya) and GoodAptitude(Riya) are present → derive <b>TechnicalEligible(Riya)</b>.`,
   `<b>R2 now matches</b> (x = Riya): TechnicalEligible(Riya) is now a fact and GoodCommunication(Riya) was given → derive <b>InterviewReady(Riya)</b>.`,
   `<b>R3 now matches</b> (x = Riya) → derive <b>PlacementReady(Riya)</b>. Goal reached ✓`,
   `<b>BACKWARD CHAINING — goal:</b> PlacementReady(Riya)?`,
   `R3 concludes PlacementReady, so the goal is replaced by the subgoal <b>InterviewReady(Riya)</b>.`,
   `R2 concludes InterviewReady, so this splits into two subgoals: <b>TechnicalEligible(Riya)</b> and <b>GoodCommunication(Riya)</b>. The second is already a known fact ✓`,
   `R1 concludes TechnicalEligible, so it splits into <b>GoodCoding(Riya)</b> and <b>GoodAptitude(Riya)</b> — both known facts ✓`,
   `All subgoals are proved, so PlacementReady(Riya) succeeds.`],
  answer:"Both directions prove PlacementReady(Riya). Forward derived TechnicalEligible → InterviewReady → PlacementReady from the facts; backward reduced PlacementReady to subgoals until it reached known facts.",
  check:"Exam tip from the slides: write the substitution (e.g. x = Riya) and the new fact generated after each rule fires. That trace is what earns the marks."},
 mistakes:[
  `Starting forward chaining from the goal instead of from the known facts.`,
  `Calling backward chaining 'data-driven' or forward chaining 'goal-driven'.`,
  `Applying a rule before ALL its required premises are satisfied.`,
  `Forgetting substitutions/unification when variables are present.`,
  `Treating a failed proof as proof that the query is false — it may only mean the KB cannot prove it.`,
  `Writing only the final conclusion without showing the inference sequence.`],
 practice:[
  {id:"p_ch1", d:"basic", q:"Which direction would you choose for each, and why? (A) Given all students' marks, skills and attendance, determine every student who becomes placement-eligible. (B) A recruiter asks: is Riya eligible for Job J? (C) A rule-based alert system receives sensor facts continuously. (D) A diagnostic system is asked whether a specific fault F explains the symptoms.",
   a:`<b>(A) Forward chaining.</b> You want ALL possible conclusions from a body of data, not the answer to one question.<br><br>
   <b>(B) Backward chaining.</b> A single specific query — only rules relevant to that goal need be explored.<br><br>
   <b>(C) Forward chaining.</b> New facts arrive continuously and every applicable consequence must be triggered — the classic monitoring / rule-trigger case.<br><br>
   <b>(D) Backward chaining.</b> Diagnosis with a specific hypothesis to confirm — the endpoint is known.`},
  {id:"p_ch2", d:"exam-level", q:"THE CLASSIC. The law says it is a crime for an American to sell weapons to hostile nations. Nono, an enemy of America, has some missiles, all sold to it by Colonel West, who is American. Prove Criminal(West) by (a) forward chaining and (b) backward chaining.",
   a:`<b>Facts:</b> American(West), Missile(M1), Owns(Nono, M1), Enemy(Nono, America).<br><br>
   <b>Rules:</b><br>R1: Missile(x) → Weapon(x)<br>R2: Missile(x) ∧ Owns(Nono,x) → Sells(West,x,Nono)<br>
   R3: Enemy(x, America) → Hostile(x)<br>R4: American(x) ∧ Weapon(y) ∧ Sells(x,y,z) ∧ Hostile(z) → Criminal(x)<br><br>
   <b>(a) Forward chaining</b> — start from facts and derive:<br>
   1. Missile(M1) fires R1 {x/M1} → <b>Weapon(M1)</b><br>
   2. Missile(M1) + Owns(Nono,M1) fire R2 {x/M1} → <b>Sells(West, M1, Nono)</b><br>
   3. Enemy(Nono,America) fires R3 {x/Nono} → <b>Hostile(Nono)</b><br>
   4. American(West) + Weapon(M1) + Sells(West,M1,Nono) + Hostile(Nono) fire R4 → <b>Criminal(West) ✓</b><br><br>
   <b>(b) Backward chaining</b> — start from the goal and reduce:<br>
   1. Goal: <b>Criminal(West)?</b> R4 concludes Criminal, giving four subgoals.<br>
   2. American(West)? — a known fact ✓<br>
   3. Weapon(y)? — R1 reduces it to Missile(y); Missile(M1) is a fact, so y = M1 ✓<br>
   4. Sells(West,y,z)? — R2 reduces it to Missile(M1) ∧ Owns(Nono,M1); both facts, so z = Nono ✓<br>
   5. Hostile(z)? — R3 reduces it to Enemy(Nono,America), a fact ✓<br><br>
   <div class="answer">Unification gives x = West, y = M1, z = Nono, so all subgoals succeed and Criminal(West) is proved.</div>
   <i>Close with: same knowledge base, opposite reasoning direction.</i>`}]
}
];
