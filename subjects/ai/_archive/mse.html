NUM.m1 = [
{
 id:"n_peas", lo:"LO 1.2", marks:5, priority:"high", title:"PEAS Specification Drill",
 src:"Chpt 1 slides 72–74 · CIA-01 Section D",
 concept:"PEAS is how you specify a task environment before designing an agent. CIA-01 handed out a blank PEAS table to fill in for an assigned system, and the MSE brief for Module 1 is 'identify & suggest' — so expect to be given a system you have never seen and asked to specify it.",
 formula:`P — Performance measure : the unit that defines the success of an agent
E — Environment         : the surrounding of the agent at every instant
A — Actuators           : the part that delivers the output of an action
S — Sensors             : the receptive parts that take in the input`,
 vars:[["Order matters","Write P first. The performance measure defines what 'good' means, and every later choice is judged against it."],
       ["Sensors = IN","What the agent perceives. For a software agent this is still data — an incoming email, a click, a GPS reading."],
       ["Actuators = OUT","What the agent does to the environment. For a software agent: a displayed route, a moved email, a booked appointment."]],
 algo:`How to build a PEAS table for a system you have never seen:

1. Ask "how would I score this system out of 10?"   -> Performance
2. Ask "what does it operate inside / on?"          -> Environment
3. Ask "what does it change about the world?"       -> Actuators
4. Ask "what does it read to decide?"               -> Sensors

Give 3-5 concrete items per row. One-word rows lose marks.`,
 worked:{
  title:"Google Maps — the full PEAS specification",
  given:"A navigation app that takes a destination and guides the user there.",
  steps:[
   `<b>P — Performance measure.</b> Shortest travel time · accurate ETA · fewest tolls or least fuel where requested · route stays legal and drivable · reroutes quickly when conditions change.<br><i>Note how each item is measurable. "Works well" would score nothing.</i>`,
   `<b>E — Environment.</b> The road network · live traffic conditions · other vehicles · road closures, accidents and diversions · the user and their chosen destination.`,
   `<b>A — Actuators.</b> The displayed route on screen · turn-by-turn voice instructions · rerouting when the user goes off-route · updated ETA · lane guidance.<br><i>A software agent's actuators are outputs, not motors.</i>`,
   `<b>S — Sensors.</b> GPS receiver · the user's typed destination · crowd-sourced speed data from other devices on the same roads · the stored map database · user-reported incidents.`],
  answer:"P: travel time, ETA accuracy, tolls/fuel, legality, reroute speed. E: road network, traffic, other vehicles, closures, the user. A: displayed route, voice instructions, rerouting, ETA updates. S: GPS, destination input, crowd-sourced traffic, map database, incident reports.",
  check:"Check each row against the definition. Is every P item something you could actually measure? Is every S item information coming IN, and every A item something going OUT? If a row has one word in it, you have not finished."},
 mistakes:[
  `<b>Swapping actuators and sensors</b>, especially for software agents. Sensors are IN, actuators are OUT.`,
  `A vague performance measure like "gives good results". It must be measurable — time, accuracy, safety, cost.`,
  `Reducing the environment to one noun. "Roads" is not enough for a taxi — include other cars, pedestrians and signs.`,
  `Writing PEAS in the wrong order, or omitting the expansion of the acronym.`,
  `Giving one item per row. Three to five concrete items per row is what a 5-mark answer looks like.`],
 practice:[
 {id:"pq1", d:"basic", q:"<b>Q1.</b> Give the full PEAS specification for <b>Google Maps</b>.",
  a:`<b>P — Performance measure:</b> shortest travel time; accurate ETA; fewest tolls / least fuel when requested; legal and drivable route; speed of rerouting when conditions change.<br><br>
  <b>E — Environment:</b> the road network; live traffic conditions; other vehicles; road closures, accidents and diversions; the user and their destination.<br><br>
  <b>A — Actuators:</b> the route drawn on screen; turn-by-turn voice instructions; rerouting; updated ETA; lane guidance.<br><br>
  <b>S — Sensors:</b> GPS; the destination typed by the user; crowd-sourced speed data from other devices; the stored map database; user-reported incidents.`},
 {id:"pq2", d:"basic", q:"<b>Q2.</b> Give the full PEAS specification for <b>Netflix's recommendation system</b>.",
  a:`<b>P — Performance measure:</b> watch time; how often a recommended title is actually played; user retention / subscription renewal; relevance of the ranked list; low rate of abandoned titles.<br><br>
  <b>E — Environment:</b> the catalogue of available titles; the user; the viewing histories of other users; the device and available bandwidth; regional licensing restrictions.<br><br>
  <b>A — Actuators:</b> the recommendation rows displayed; the ordering of titles; which thumbnail is shown for each title; autoplay previews; notification emails.<br><br>
  <b>S — Sensors:</b> viewing history; thumbs up/down ratings; search queries; how long each title was watched and where the user stopped; device type; time of day.<br><br>
  <i>Note that "which thumbnail is shown" is a genuine actuator — it changes what the user sees and therefore what they choose.</i>`},
 {id:"pq3", d:"basic", q:"<b>Q3.</b> Give the full PEAS specification for <b>Tesla Full Self-Driving</b>.",
  a:`<b>P — Performance measure:</b> safety (collisions avoided); obeying traffic law; passenger comfort (smooth acceleration and braking); journey time; energy efficiency.<br><br>
  <b>E — Environment:</b> roads and lane markings; other vehicles; pedestrians and cyclists; traffic signals and signs; weather and lighting conditions.<br><br>
  <b>A — Actuators:</b> steering; accelerator; brake; indicators; horn; headlights.<br><br>
  <b>S — Sensors:</b> cameras; ultrasonic sensors; radar; GPS; inertial measurement unit; wheel-speed sensors.<br><br>
  <i>This is the automated taxi driver from the lecture in modern form — if you know that PEAS table, you can produce this one.</i>`},
 {id:"pq4", d:"moderate", q:"<b>Q4.</b> Give the full PEAS specification for an <b>AI hospital assistant</b> that monitors patients and coordinates care.",
  a:`<b>P — Performance measure:</b> patient safety; accuracy of alerts (high true-positive rate); response time from event to alert; low false-alarm rate; reduction in staff workload.<br><br>
  <b>E — Environment:</b> patients; the ward and its equipment; doctors and nurses; the hospital IT and scheduling systems; medicine inventory.<br><br>
  <b>A — Actuators:</b> alerts sent to staff; appointments booked; medication reminders issued; patient records updated; medicine orders placed.<br><br>
  <b>S — Sensors:</b> vital-sign monitors (heart rate, blood pressure, SpO₂); patient wearables; electronic health records; laboratory results; input typed by staff.<br><br>
  <i>Low false-alarm rate belongs in P, not E — a system that alerts constantly is unsafe because staff stop listening.</i>`},
 {id:"pq5", d:"moderate", q:"<b>Q5.</b> Give the full PEAS specification for a <b>delivery drone</b>.",
  a:`<b>P — Performance measure:</b> successful on-time delivery; package delivered intact; battery efficiency / range used; flight safety; compliance with airspace rules.<br><br>
  <b>E — Environment:</b> airspace; buildings, trees and power lines; weather, especially wind and rain; other drones and aircraft; the landing site; people on the ground.<br><br>
  <b>A — Actuators:</b> rotors and propellers; steering and altitude control; the package release mechanism; camera gimbal; landing gear.<br><br>
  <b>S — Sensors:</b> GPS; altimeter / barometer; cameras; LiDAR or ultrasonic obstacle sensors; inertial measurement unit; battery-level sensor; wind sensor.`},
 {id:"pq6", d:"moderate", q:"<b>Q6.</b> Give the full PEAS specification for a <b>smart farming system</b>.",
  a:`<b>P — Performance measure:</b> crop yield per hectare; water used per unit of yield; fertiliser and pesticide efficiency; input cost; long-term soil health and sustainability.<br><br>
  <b>E — Environment:</b> the field and its soil; the crops at their current growth stage; weather; pests and disease; the irrigation and machinery infrastructure; the farmer.<br><br>
  <b>A — Actuators:</b> irrigation valves opened and closed; fertiliser and pesticide sprayers; automated machinery (seeders, harvesters); alerts and recommendations sent to the farmer.<br><br>
  <b>S — Sensors:</b> soil moisture sensors; temperature and humidity sensors; soil pH and nutrient sensors; drone or satellite imagery of the crop; a weather forecast feed.`},
 {id:"pq7", d:"basic", q:"<b>Q7.</b> A student writes this PEAS row for a spam filter — <i>Actuators: the incoming email. Sensors: moving the email to the spam folder.</i> What is wrong, and why is this error so common for software agents?",
  a:`The two rows are <b>swapped</b>.<br><br>
  <b>Correct:</b> <i>Sensors</i> = the incoming email, its sender, subject, body and headers — this is information coming IN. <i>Actuators</i> = moving the email to the spam folder, flagging it, or letting it through — this is the agent acting ON its environment.<br><br>
  <b>Why it is common:</b> for a robot the distinction is physical and obvious — cameras in, motors out. For a software agent both sides are just data, so there is no physical cue. The reliable test is direction: <b>sensors bring information IN, actuators push change OUT.</b>`},
 {id:"pq8", d:"moderate", q:"<b>Q8.</b> Why does the performance measure come first in PEAS, and what goes wrong if you cannot state it?",
  a:`<b>Why it comes first:</b> the performance measure defines what "good" means for this agent. Every later design choice — which sensors are worth having, which actions are worth taking — is judged against it. It is also the P in the definition of a rational agent: <i>"a rational agent should select an action that is expected to maximise its performance measure."</i><br><br>
  <b>What goes wrong without it:</b> you cannot say whether the agent is rational at all, because rationality is defined relative to a performance measure. You also cannot compare two designs. A vacuum that cleans fast but destroys the carpet is only "worse" once you have written down that carpet damage counts.<br><br>
  <b>Exam point:</b> the performance measure should be stated as something <i>measurable</i> — safety, time, cleanliness, cost — never as "works well".`},
 {id:"pq9", d:"difficult", q:"<b>Q9.</b> Compare the PEAS of <b>Netflix</b> and a <b>delivery drone</b>. Which parts of PEAS differ most sharply, and what does that tell you about the two agents?",
  a:`<b>Performance measure</b> — Netflix optimises a <i>soft, statistical</i> quantity (watch time, retention) where being slightly wrong costs very little. The drone optimises a <i>hard safety</i> quantity where a single failure is catastrophic. This changes the whole design: the drone needs redundant sensors, Netflix does not.<br><br>
  <b>Environment</b> — Netflix's environment is <i>digital and bounded</i>: a finite catalogue and a user. The drone's is <i>physical and open-ended</i>: wind, trees, power lines, people.<br><br>
  <b>Actuators</b> — the sharpest contrast. Netflix's actuators only change <i>what a user sees</i>; the drone's actuators change <i>physical state in the world</i> and are irreversible.<br><br>
  <b>Sensors</b> — Netflix senses <i>behaviour</i> (clicks, watch duration); the drone senses <i>physics</i> (position, altitude, obstacles).<br><br>
  <b>What it tells you:</b> the same four-part framework describes both, which is the point of PEAS — but the <i>cost of being wrong</i>, which lives in P, is what actually drives how much sensing and redundancy each agent needs.`},
 {id:"pq10", d:"exam-level", q:"<b>Q10.</b> You are given an AI system you have never seen before and asked for its PEAS. Describe the procedure you would follow, and state the two most likely ways to lose marks.",
  a:`<b>The procedure — four questions, in this order:</b><br>
  1. <i>"How would I score this system out of 10?"</i> → <b>Performance measure.</b> Force every answer into something measurable.<br>
  2. <i>"What does it operate inside or on?"</i> → <b>Environment.</b> Include the other agents in it — other vehicles, other users, the human operator.<br>
  3. <i>"What does it change about the world?"</i> → <b>Actuators.</b><br>
  4. <i>"What does it read in order to decide?"</i> → <b>Sensors.</b><br><br>
  Then write it as a <b>four-row table</b> with 3–5 concrete items per row.<br><br>
  <b>The two most likely ways to lose marks:</b><br>
  <b>(1) A vague performance measure.</b> "Gives good recommendations" is unmarkable; "click-through rate on recommended titles and total watch time" is.<br>
  <b>(2) Swapping sensors and actuators</b> on a software agent, because neither is physical. Apply the direction test: IN is a sensor, OUT is an actuator.<br><br>
  <i>Add one line at the end noting the environment type (partially observable, stochastic, dynamic…) — it costs a sentence and shows you can connect PEAS to LO 1.6.</i>`}]
},

{
 id:"n_env", lo:"LO 1.6", marks:10, priority:"high", title:"Environment Classification Drill",
 src:"Chpt 1 slides 78–83 · CIA-01 Section E · class activity slide 115",
 concept:"LO 1.6 is a whole learning outcome dedicated to identifying environment types, and CIA-01 Section E was a six-row table to fill in with two properties justified. Expect to be handed a system and asked to classify it on all six pairs.",
 formula:`1. Fully observable   vs  Partially observable
2. Deterministic      vs  Stochastic
3. Episodic           vs  Sequential
4. Static             vs  Dynamic
5. Discrete           vs  Continuous
6. Single agent       vs  Multi-agent`,
 vars:[["Fully observable","sensors detect ALL aspects relevant to the choice of action"],
       ["Deterministic","the next state is completely predictable from the current state and the action"],
       ["Episodic","experience divides into atomic episodes; the choice in each depends only on that episode"],
       ["Static","nothing but the agent changes. Other agents make an environment DYNAMIC"],
       ["Discrete","time moves in fixed steps, usually one measurement per step"],
       ["Multi-agent","other agents present; may be competitive or co-operative. Human users count as agents"]],
 algo:`A fast way to classify anything, in this order:

1. Are there other agents (people, vehicles, users)?
   YES -> multi-agent AND dynamic, and usually stochastic too.
2. Do the sensors see everything that matters for the decision?
   NO  -> partially observable.
3. Does an earlier decision constrain a later one?
   YES -> sequential.
4. Do readings arrive as continuous signals or fixed steps?
   Signals -> continuous.

Anchors worth memorising from the lecture table:
   Taxi driving     = No on ALL six columns
   Crossword puzzle = Yes on ALL six columns`,
 worked:{
  title:"Classify Google Maps across all six properties",
  given:"Justify each answer — the justification is where the marks are.",
  steps:[
   `<b>Partially observable.</b> The app cannot see every road at once. An accident two junctions ahead is not visible until someone reports it or traffic data reflects it, yet it is highly relevant to the choice of route.`,
   `<b>Stochastic.</b> The next state is not predictable from the current one — traffic can build or clear for reasons outside the model. Two identical journeys can produce different travel times.`,
   `<b>Sequential.</b> Each routing decision constrains the next: once you have been sent down a motorway you cannot cheaply reconsider the junction you passed. Choices are not independent episodes.`,
   `<b>Dynamic.</b> Traffic changes <i>while the route is being computed</i>. This is forced by the presence of other drivers — the lecture states directly that other agents make an environment dynamic.`,
   `<b>Continuous.</b> Position, speed and time all vary continuously; the vehicle does not jump between discrete cells.`,
   `<b>Multi-agent.</b> Every other driver is an agent, and other Google Maps users are too — indeed the crowd-sourced speed data means their behaviour directly changes this agent's percepts. Largely co-operative, but competitive for road capacity.`],
  answer:"Google Maps: partially observable · stochastic · sequential · dynamic · continuous · multi-agent — the same profile as taxi driving, which the lecture table marks 'No' on every column.",
  check:"Cross-check against the anchors. If your system involves other people moving around in the physical world, it should look like taxi driving (No on everything). If it is a solitary puzzle with fixed rules, it should look like the crossword (Yes on everything). A system that comes out mixed needs a second look at the justification."},
 mistakes:[
  `Calling an environment partially observable just because it is <i>large</i>. The test is whether sensors capture what is <b>relevant to the action choice</b>.`,
  `Marking a physical-world system as <b>discrete</b>. If position, speed or time vary smoothly, it is continuous.`,
  `Forgetting that <b>other agents make an environment dynamic</b> — so multi-agent and dynamic almost always travel together.`,
  `Classifying <b>medical diagnosis as multi-agent</b>. The lecture table lists it as <b>single agent</b>.`,
  `Giving the six labels with no justification. CIA-01 asked for two properties to be justified explicitly, so expect the same.`],
 practice:[
 {id:"eq1", d:"basic", q:"<b>Q1.</b> Classify <b>Netflix's recommender</b> across all six properties, with justification.",
  a:`<b>Partially observable</b> — it sees clicks and watch duration, but not mood, who else is in the room, or why a title was abandoned.<br>
  <b>Stochastic</b> — the same recommendation to the same user does not reliably produce the same response.<br>
  <b>Sequential</b> — what it recommends now becomes training data and shapes what it can recommend later.<br>
  <b>Dynamic</b> — the catalogue changes, and tastes drift, independently of the agent.<br>
  <b>Discrete</b> — the catalogue is a finite set of titles and the action is choosing which to place in which slot. <i>(Accept continuous if you argue watch-time is measured continuously — but say which you mean.)</i><br>
  <b>Multi-agent</b> — the user is another agent, and collaborative filtering means other users' behaviour directly changes this agent's percepts.`},
 {id:"eq2", d:"basic", q:"<b>Q2.</b> Classify <b>Tesla FSD</b> across all six properties.",
  a:`<b>Partially observable</b> — occlusion by other vehicles, blind bends, weather limiting sensor range.<br>
  <b>Stochastic</b> — a pedestrian may step out; another driver may brake without warning.<br>
  <b>Sequential</b> — a lane change now determines which exits are reachable later.<br>
  <b>Dynamic</b> — the road situation changes while the car is deliberating.<br>
  <b>Continuous</b> — steering angle, speed and position all vary smoothly.<br>
  <b>Multi-agent</b> — other drivers, cyclists and pedestrians, and it is partly competitive (merging) and partly co-operative (giving way).<br><br>
  <i>This is exactly the "taxi driving" row of the lecture table: No on all six columns.</i>`},
 {id:"eq3", d:"moderate", q:"<b>Q3.</b> Classify a <b>delivery drone</b> and a <b>smart farming system</b>. Where do they differ, and why?",
  a:`<b>Delivery drone:</b> partially observable (cannot see behind buildings) · stochastic (wind gusts, birds) · sequential (altitude and battery decisions compound) · dynamic (weather and other aircraft move) · continuous (position, altitude, thrust) · multi-agent (other drones, aircraft, people on the ground).<br><br>
  <b>Smart farming:</b> partially observable (sensors sample a few points, not the whole field) · stochastic (weather and pests) · sequential (irrigating today changes soil state tomorrow) · dynamic (crops grow and weather changes regardless of the agent) · continuous (moisture, temperature and pH are continuous quantities) · <b>multi-agent</b> if the farmer intervenes, otherwise arguably <b>single agent</b>.<br><br>
  <b>The key difference:</b> the drone operates in an environment <i>densely populated by other agents</i>, whereas smart farming's environment is mostly <i>non-agent physical processes</i> — weather and pests change the world but are not agents pursuing goals. State that distinction explicitly; the lecture defines another agent strictly as something that changes from step to step, and notes human users count.`},
 {id:"eq4", d:"moderate", q:"<b>Q4.</b> Classify an <b>AI hospital assistant</b>, and justify any TWO of the properties in detail (as CIA-01 asked).",
  a:`<b>Full classification:</b> partially observable · stochastic · sequential · dynamic · continuous · multi-agent.<br><br>
  <b>Justification 1 — partially observable.</b> The agent perceives vital signs, lab results and recorded notes, but a patient's true condition is far richer than what is instrumented. Pain, symptoms not yet reported, and conditions with no attached sensor are all relevant to the decision and invisible to the agent. Because the relevant state is not fully captured, the environment is partially observable.<br><br>
  <b>Justification 2 — dynamic.</b> The patient's condition changes continuously and independently of the agent, and doctors and nurses act on the patient too. The world does not pause while the agent computes, which is the definition of a dynamic environment. Note that this is forced by the presence of the other agents (the staff), consistent with the rule that other agents make an environment dynamic.`},
 {id:"eq5", d:"moderate", q:"<b>Q5.</b> Reproduce the lecture's classification table for Solitaire, Backgammon, Taxi driving, Medical diagnosis and Crossword puzzle.",
  a:`<div class="scroll"><table class="t"><thead><tr><th>Task environment</th><th>Fully obs.?</th><th>Determ.?</th><th>Episodic?</th><th>Static?</th><th>Discrete?</th><th>Single agent?</th></tr></thead><tbody>
  <tr><td>Solitaire</td><td>No</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
  <tr><td>Backgammon</td><td>Yes</td><td>No</td><td>No</td><td>Yes</td><td>Yes</td><td>No</td></tr>
  <tr><td>Taxi driving</td><td>No</td><td>No</td><td>No</td><td>No</td><td>No</td><td>No</td></tr>
  <tr><td>Medical diagnosis</td><td>No</td><td>No</td><td>No</td><td>No</td><td>No</td><td><b>Yes</b></td></tr>
  <tr><td>Crossword puzzle</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
  </tbody></table></div>
  <b>The two rows to memorise as anchors:</b> taxi driving is <b>No on everything</b>; crossword puzzle is <b>Yes on everything</b>. And note the trap: <b>medical diagnosis is single agent</b>, despite being No on the other five.`},
 {id:"eq6", d:"difficult", q:"<b>Q6.</b> Two students disagree: one says a robot vacuum is in a static environment, the other says dynamic. Who is right, and what does the disagreement reveal?",
  a:`<b>It depends on the room, and the correct answer is to say so with a criterion.</b><br><br>
  <b>Static case:</b> an empty room with fixed furniture. Nothing but the agent changes, so the environment is static — comparable to the lecture's "mowing a lawn is static" example.<br><br>
  <b>Dynamic case:</b> a room with people or pets moving through it. The lecture's own aside is exactly this — <i>"mowing a lawn is static (unless there is a cat…)"</i>. Once another agent is present the environment becomes both <b>dynamic and multi-agent</b>.<br><br>
  <b>What it reveals:</b> environment properties are properties of the <b>task environment as specified</b>, not of the machine. That is why you must state your assumption before classifying. In the exam, write one line — "assuming an unoccupied room" — and then classify. A justified assumption scores; an unstated one looks like a guess.`},
 {id:"eq7", d:"exam-level", q:"<b>Q7.</b> A system is described as multi-agent. Which OTHER properties does that almost force, and why? Use this to explain why taxi driving is 'No' on all six columns.",
  a:`<b>Multi-agent almost forces three others:</b><br><br>
  <b>1. Dynamic.</b> Other agents act while our agent is deliberating, so the world changes without our agent doing anything. The lecture states this directly: other agents in an environment make it dynamic.<br><br>
  <b>2. Stochastic.</b> We cannot predict another agent's choice with certainty, so the next state is not determined by our action alone. (The lecture's term for "deterministic except for the actions of other agents" is <b>strategic</b>.)<br><br>
  <b>3. Partially observable.</b> Other agents' <i>intentions</i> are never observable — only their actions. So a state variable that matters enormously for our decision is hidden by construction.<br><br>
  <b>Applying it to taxi driving:</b> the road is full of other drivers and pedestrians. That single fact gives multi-agent, dynamic, stochastic and partially observable. Add that a real road is a physical space (continuous) and that earlier turns constrain later ones (sequential), and every one of the six columns comes out on the "harder" side — which is precisely why the lecture table shows taxi driving as No on all six.<br><br>
  <i>This is the single most useful reasoning chain for Module 1: find the other agents first, and four of the six answers fall out.</i>`}]
}
];

 {t:"m1t12", tag:"AI or not", q:"A pocket calculator computes 47 × 23. Is this AI?",
  o:["Yes — it processes input and produces output","No — it follows a fixed procedure with no perception, learning or choice between actions","Yes — it is a computer program","No — because it is not connected to the internet"], a:1,
  e:"Not AI. The test is perceive → reason → decide → act. A calculator executes one fixed deterministic procedure; it never perceives its environment and never chooses between alternative actions. This is automation, not AI."},
 {t:"m1t12", tag:"AI or not", q:"A washing machine runs a 40-minute cotton cycle on a timer. Is this AI?",
  o:["Yes — it is automatic","No — a preset program on a timer is automation, not AI","Yes — it senses water level","No — because it has no screen"], a:1,
  e:"Not AI. A preset timed program involves no perception of the environment and no decision between actions. Note the nuance worth stating in an exam: a modern load-sensing machine that adapts the cycle WOULD be a borderline simple reflex agent."},
 {t:"m1t12", tag:"AI or not", q:"A Gmail spam filter moves an incoming email to the spam folder. Is this AI, and if so what kind of agent?",
  o:["Not AI — it just matches keywords","AI — a simple reflex agent using condition-action rules","AI — a utility-based agent","Not AI — it has no sensors"], a:1,
  e:"AI, and the lecture names it explicitly as the example of a SIMPLE REFLEX AGENT. It maps the current percept (the email) to an action via condition-action rules: if {set of percepts} then {set of actions}."},
 {t:"m1t5", tag:"Agent type", q:"A Roomba remembers which parts of the room it has already cleaned, where the obstacles are, and its battery level. Which agent type is this?",
  o:["Simple reflex agent","Model-based agent","Goal-based agent","Learning agent"], a:1,
  e:"Model-based. It maintains an INTERNAL STATE built from percept history plus a MODEL of how the world works, which is what lets it operate in a partially observable room. The lecture gives Roomba as its example of a model-based agent."},
 {t:"m1t5", tag:"Agent type", q:"Google Maps is given the destination 'airport' and searches for a route. Which agent type, and what capability forces that answer?",
  o:["Model-based — it remembers the map","Goal-based — it has explicit goal information and searches/plans to achieve it","Utility-based — it picks the fastest route","Simple reflex — it reacts to the road"], a:1,
  e:"Goal-based. The capability that forces it is having explicit GOAL information and considering a long sequence of actions to reach it — the lecture calls that searching and planning, which makes the agent proactive. Google Maps is the lecture's own example."},
 {t:"m1t5", tag:"Agent type", q:"Uber must choose between several routes that all reach the destination, and picks based on fastest, cheapest, safest and least traffic. Which agent type?",
  o:["Goal-based","Utility-based","Model-based","Simple reflex"], a:1,
  e:"Utility-based. All the options achieve the goal, so a goal test cannot separate them. The utility function maps each state to a REAL NUMBER, letting the agent choose the BEST way rather than just any way. Uber is the lecture's example."},
 {t:"m1t5", tag:"Agent type", q:"Netflix continuously improves its recommendations based on what you and millions of others actually watch. Which agent type?",
  o:["Goal-based","Utility-based","Learning agent","Model-based"], a:2,
  e:"Learning agent. The distinguishing capability is IMPROVEMENT OVER TIME from experience. The lecture lists ChatGPT, Netflix, Spotify, YouTube and Tesla FSD as its learning-agent examples."},
 {t:"m1t5", tag:"Agent type", q:"Which of these is the correct ladder of agent types, in order of increasing capability?",
  o:["Reflex → goal → model → utility → learning","Reflex → +memory (model) → +goal → +preference (utility) → +improvement (learning)","Model → reflex → utility → goal → learning","Learning → utility → goal → model → reflex"], a:1,
  e:"Each type adds exactly one capability: Reflex (current percept only) → +memory = Model-based → +goal = Goal-based → +preference between ways of reaching the goal = Utility-based → +improvement over time = Learning. To classify any system, ask: does it remember? does it compare alternatives?"},
 {t:"m1t5", tag:"Agent type", q:"A thermostat switches the heating on when the temperature drops below 20°C. Which agent type?",
  o:["Simple reflex agent","Model-based agent","Utility-based agent","Not an agent at all"], a:0,
  e:"Simple reflex agent. It maps the current percept straight to an action via a condition-action rule, with no memory and no goal reasoning. Note it IS a legitimate agent — simple does not mean 'not an agent'."},
 {t:"m1t6", tag:"Environment", q:"A self-driving car cannot see what is around the next bend. Which environment property does this illustrate?",
  o:["Stochastic","Partially observable","Dynamic","Continuous"], a:1,

 {t:"m1t6", tag:"Environment", q:"Other cars move while your agent is still deciding what to do. Which property does that force?",
  o:["Episodic","Discrete","Dynamic","Fully observable"], a:2,
  e:"Dynamic. The environment changes over time independently of the agent. The lecture states directly that other agents in an environment make it dynamic."},
 {t:"m1t6", tag:"Environment", q:"In a game of chess, the next state is completely determined by the current state and the move played. Which property is this?",
  o:["Deterministic","Stochastic","Strategic","Episodic"], a:0,

 {t:"m1t6", tag:"Environment", q:"A mail-sorting system handles each letter independently — nothing about letter 5 depends on letter 4. Which property?",
  o:["Sequential","Episodic","Static","Single agent"], a:1,
  e:"Episodic. Experience divides into atomic episodes, and the choice of action in each episode depends only on that episode. The lecture gives mail sorting and a part-picking robot as its episodic examples; chess is the contrasting sequential one."},
 {t:"m1t6", tag:"Environment", q:"In the lecture's classification table, which task environment is 'No' on ALL six columns?",
  o:["Crossword puzzle","Solitaire","Taxi driving","Image analysis"], a:2,

 {t:"m1t6", tag:"Environment", q:"In the lecture's table, medical diagnosis is classified as:",
  o:["Multi-agent","Single agent","Episodic","Fully observable"], a:1,
  e:"SINGLE AGENT — even though it is partially observable, stochastic, sequential, dynamic and continuous. This row is a favourite trap because everything else about it looks 'hard'."},
 {t:"m1t6", tag:"Environment", q:"A system is multi-agent. Which set of properties does that almost always force?",
  o:["Static, discrete and episodic","Dynamic, stochastic and partially observable","Fully observable and deterministic","Episodic and single-step"], a:1,
  e:"Dynamic (others act while you deliberate), stochastic (you cannot predict their choices), and partially observable (their INTENTIONS are never observable, only their actions). Finding the other agents first gives you four of the six answers."},
 {t:"n_peas", tag:"PEAS", q:"For a spam filter, the incoming email is the ___ and moving it to the spam folder is the ___.",
  o:["actuator ... sensor","sensor ... actuator","environment ... performance measure","performance measure ... environment"], a:1,
  e:"Sensor then actuator. Sensors bring information IN; actuators push change OUT. This is the single most common PEAS error for software agents, because neither side is physical."},
 {t:"n_peas", tag:"PEAS", q:"Which of these is an acceptable PERFORMANCE MEASURE for an automated taxi?",
  o:["Roads, other cars, pedestrians, road signs","Steering, accelerator, brake, horn","Safety, time, legal drive, comfort","Camera, sonar, GPS, speedometer"], a:2,
  e:"Safety, time, legal drive, comfort — the lecture's own P row, and every item is measurable. The other three options are the E, A and S rows respectively."},
 {t:"n_peas", tag:"PEAS", q:"For Netflix, 'which thumbnail image is shown for a title' belongs in which PEAS row?",
  o:["Sensors","Actuators","Environment","Performance measure"], a:1,
  e:"Actuators. It is an output that changes what the user sees, and therefore what they choose. Anything the agent does TO its environment is an actuator, even when it is purely on a screen."},
 {t:"n_peas", tag:"PEAS", q:"Why must the performance measure be written first in a PEAS specification?",
  o:["Because P comes first alphabetically","Because it defines what 'good' means, and every later design choice is judged against it","Because sensors depend on it physically","It does not matter — any order is fine"], a:1,
  e:"It defines the criterion of success, so it is what makes rationality meaningful — a rational agent selects the action expected to maximise its PERFORMANCE MEASURE. Without it you cannot say whether the agent is rational or compare two designs."},
 {t:"m1t8", tag:"Traditional vs Agentic", q:"An AI is asked to 'plan my Goa trip'. It finds flights, compares hotels, checks the weather, books with approval, adds the itinerary to your calendar and emails a confirmation. Traditional or Agentic?",
  o:["Traditional — it produced a plan","Agentic — multi-step workflow, tool use, memory and autonomous action","Traditional — it needed approval","Agentic — because it used the internet"], a:1,
  e:"Agentic, and this is the lecture's own worked contrast. Traditional AI returns the itinerary; agentic AI completes the goal through a multi-step workflow using external tools, maintaining context, acting autonomously WITHIN PERMISSIONS."},
 {t:"m1t8", tag:"Traditional vs Agentic", q:"Which task is best handled by Traditional AI rather than Agentic AI?",
  o:["Book a flight","Generate a report from material you have already supplied","Research a topic across many sources","Monitor stock prices and trigger alerts"], a:1,
  e:"Generating a report from supplied material is a single response with no external action needed. The other three all require multi-step workflows, tool use or continuous perception over time. Note the nuance: if the system must GATHER the material first, even report-writing becomes agentic."},
 {t:"m1t8", tag:"Traditional vs Agentic", q:"Which four axes does LO 1.5 name for comparing Traditional and Agentic AI?",
  o:["Speed, accuracy, cost, scale","Autonomy, memory, tool usage, goal orientation","Sensors, actuators, environment, performance","Perception, reasoning, learning, acting"], a:1,
  e:"Autonomy, memory, tool usage and goal orientation. These four words are named verbatim in the learning outcome, so use them as the row headings of your comparison table and you cannot lose structure marks."},
 {t:"m1t3", tag:"Rationality", q:"A self-driving car obeys every rule and drives safely, but is hit by a falling engine block from an overpass. Was the agent rational?",
  o:["No — the outcome was bad","Yes — it selected the action expected to maximise its performance measure given the available evidence","No — a rational agent would have predicted it","Only if it survived"], a:1,
  e:"Yes. Rationality is about the DECISION PROCESS, not the outcome. A rational agent maximises EXPECTED performance given the evidence in its percept sequence — it is not omniscient. Dropping the word 'expected' from the definition is what loses this mark."},
 {t:"m1t7", tag:"Categorization", q:"Which of the four approaches to AI does this course adopt, and what does it mean?",
  o:["Thinking humanly — modelling human cognition","Acting humanly — passing the Turing Test","Thinking rationally — reasoning by the laws of logic","Acting rationally — doing what is expected to maximise goal achievement given available information"], a:3,
  e:"Acting rationally. Everything in Modules 2 and 3 — search, heuristics, optimisation, knowledge, reasoning — is machinery for an agent that ACTS to maximise its expected performance. The other three fall short: imitating humans is not the engineering goal, cognitive modelling needs a theory we lack, and logic cannot express uncertainty."}
];

 {t:"n_astar", q:"When should A* terminate?",

 {t:"m2t2", q:"BFS uses which data structure, and DFS which?",

 {t:"m2t6", q:"Which hill-climbing variant reliably escapes local optima?",

  e:"Random-restart runs the algorithm repeatedly from different randomly generated initial states, so a trapped run is simply abandoned and restarted. Stochastic adds randomness in WHICH uphill neighbour is chosen, but never accepts a worse one, so it can still be trapped."},
 {t:"m2t6", q:"Stochastic hill climbing may accept a neighbour that is worse than the current state.",
  o:["True","False"], a:1,
  e:"False. Stochastic hill climbing randomly selects among the UPHILL neighbours, with greater improvement giving higher probability. It never chooses a worse neighbour. Accepting worse moves with probability e^(ΔE/T) is what simulated annealing does."},
 {t:"m2t6", q:"What is a plateau in hill climbing?",

  e:"A plateau is a FLAT region where the function has a constant value, so all neighbours look the same and the algorithm cannot decide where to go. A peak where neighbours are lower is a local maximum — a different problem."},
 {t:"m2t7", q:"In simulated annealing, a bad move (ΔE < 0) is accepted with probability:",
  o:["1/T","e^(ΔE/T)","ΔE × T","0 — bad moves are never accepted"], a:1,
  e:"e^(ΔE/T). As T decreases this probability falls towards zero, so late in the run the algorithm behaves like ordinary hill climbing. Good moves (ΔE > 0) are accepted unconditionally."},
 {t:"m2t7", q:"Which is NOT one of the three stopping criteria for simulated annealing given in the lecture?",

 {t:"m2t7", q:"Simulated annealing is a memory-based algorithm.",

 {t:"m2t8", q:"In roulette-wheel selection, an individual's chance of being selected is:",

  e:"Directly proportional to fitness — more area on the wheel means more chance. Fitness ∝ area ∝ selection. It is probabilistic, so a low-fitness individual can still be selected, which preserves diversity."},
 {t:"m2t9", q:"In a minimax game tree, terminal utility values are given from whose perspective?",

  e:"Always from MAX's perspective. In chess: Win = +1, Draw = 0, Loss = −1 for MAX. MIN then works to minimise that same number."},
 {t:"m2t4", q:"Greedy best-first search is:",

 {t:"m3t7", q:"A Horn clause is a clause containing:",

  e:"At most one positive literal. That is why ¬A ∨ ¬B ∨ C is Horn (C is the only positive literal) and rewrites as A ∧ B → C. An all-negative clause is also Horn."},
 {t:"m3t6", q:"What does unification actually do?",

{id:"nb4", m:"m2", page:"Notebook A · p.4 · 27/7", title:"Problem solving agent · Water jug problem",
 body:`<div class="flow">1. formulate  ┐
2. search     ├── steps
3. execute    ┘</div>
<h4>Structure of problem solving agent</h4>
<ol class="list"><li>Goal state</li><li>Action</li><li>Goal formulation</li><li>Problem formulation</li></ol>
<p><b>Problem solving:</b> the way in which an agent finds a sequence of actions that achieves its goals, when no single action will do.</p>
<div class="note-note"><b>Problem formulation — why?</b> The notes answer in two words: <b>for searching</b>.</div>
<p>Also noted: <b>there can be multiple goal states.</b></p>
<h4>Water jug problem</h4>
<p>Get 2 gallon water in 4 gallon jug, with unlimited water supply.</p>
<div class="formula">initial state:  (x, y) = (0, 0)
goal state:     (x, y) = (2,0), (2,1), (2,2), (2,3)</div>
<p><b>States: possible paths / states</b></p>
<div class="flow">(i)  (0,0) ──fill 3 jug──► (0,3) ──pour into 4 jug──► (3,0)
     ──fill 3 jug──► (3,3) ──pour into 4 jug till full──► (4,2)
     ──pour out 4 jug──► (0,2) ──pour 3 jug's water into 4 jug──► (2,0)

(ii) (0,0) ──fill 4 jug──► (4,0) ──pour into 3 jug──► (1,3)
     ──empty 3 jug──► (1,0) ──pour water into 3 jug──► (0,1)
     ──fill 4 jug──► (4,1) ──pour just 2 gal into 3 jug──► (2,3)</div>
<p>The seven-step version also written on the page: 1. fill 3 jug · 2. pour in 4 water jug · 3. fill 3 jug again · 4. pour in 4 till it is full · 5. 2 gall. left in 3 jug · 6. pour out 4 jug · 7. fill with water from 3 jug.</p>`},

{id:"nb5", m:"m2", page:"Notebook A · p.5", title:"River crossing · Search strategies",
 body:`<h4>River crossing problem</h4>
<p>3 missionaries &amp; 3 cannibals. There should be equal no. of both. Max no. of people in boat = 2.</p>
<p><b>Goal:</b> all the missionaries &amp; cannibals need to cross the river. (x,y) = (6,0) = [3M, 3C, R]</p>
<div class="formula">x → on the left
y → on the right
initial state: (x,y) = (0,6) = [3M, 3C, L]</div>
<h4>Search algorithms</h4>
<p><b>i) Un-informed search algo:</b> it has no other info (extra) except the problem statement. e.g. BFS, DFS, iterative deepening search (combination of BFS &amp; DFS).</p>
<p><b>ii) Informed search algo:</b> it knows where to look for the solution.</p>
<h4>Search strategies — the four criteria</h4>
<ol class="list"><li>completeness</li><li>time complexity</li><li>space complexity</li><li>optimality</li></ol>
<div class="formula">b : max branching factor of the search tree
d : depth of the goal node (least-cost sol&#8319;)
m : maximum depth of the tree state space  (may be ∞)</div>`},

{id:"nb6", m:"m2", page:"Notebook A · p.6", title:"BFS · DFS · DLS · IDS · Best-first",
 body:`<h4>Uninformed</h4>
<div class="formula">BFS   time  : b&#7496;        space : b&#7504;
      ✓ shallowest sol&#8319; is found

DFS   time  : b&#7504;  (worst case, m ≥ d)
      space : bm
      ✓ occupies less space

Depth-limited search — it is depth first search with depth limit ℓ

Iterative deepening search
  taken from BFS : we use its quality of ensuring to check
                   for the shallowest sol&#8319;
  taken from DFS : the tree is being searched in DFS manner
  all data is taken at every level &amp; discarded after
  the level is visited

  complete : yes
  optimal  : yes, if step costs are equal
  time     : O(b&#7496;) = d(b) + (d−1)b² + (d−2)b³ + … + (1)b&#7496;
  space    : O(bd)</div>
<h4>Informed search algorithms</h4>
<p><b>Heuristic function:</b> an intelligent estimate or rule of thumb that guides the search towards the goal quickly.</p>
<div class="formula">1. Best-First-Search  (greedy search)
   evaluation f&#8319; :  f(n) = h(n)     ← node's dist. to goal node

   it expands the node that appears to be closest to goal

   complete : No, can get stuck in loops
   time     : O(b&#7504;)
   space    : O(b&#7504;) ; keeps all nodes in memory
   optimal  : No</div>`},

{id:"nb7", m:"m2", page:"Notebook A · p.7 · 3/8", title:"A* search — definition, limitations, worked example",
 body:`<p><b>Idea:</b> avoid expanding paths that are already expensive.</p>
<div class="formula">f(n) = g(n) + h(n)
       │      │      └─ estimated cost from n to goal
       │      └──────── cost so far to reach n
       └─────────────── estimated total cost of path
                        through n to goal

complete : yes      optimal : yes
Time     : O(b&#7496;)    Space   : O(b&#7496;)</div>
<p><b>Admissible heuristics:</b> create such a function that never overestimates the cost to reach the goal node. e.g. 8 puzzle.</p>
<h4>Limitations</h4>
<ol class="list">
<li>High memory usage</li><li>Time consuming</li>
<li>Heavily dependent on the heuristic — good heuristic → faster search; poor heuristic → behaves more like uniform cost search</li>
<li>Poor scalability</li><li>Explores many unnecessary nodes</li>
</ol>
<h4>The worked example on the same page</h4>
<p>Graph with h values: S=14, B=12, C=11, D=6, E=4, F=11, G=0. Edges S–B 4, S–C 3, B–F 5, B–E 12, F–G 16, C–E 10, C–D 7, D–E 2, E–G 5.</p>
<div class="scroll"><table class="t"><thead><tr><th>OPEN list</th><th>CLOSED list</th></tr></thead><tbody>
<tr><td>S<sup>(0+14)</sup></td><td>S<sup>14</sup></td></tr>
<tr><td>B<sup>(4+12)</sup> &nbsp; C<sup>(3+11)</sup></td><td>C<sup>14</sup></td></tr>
<tr><td>B<sup>16</sup> &nbsp; D<sup>(10+6)</sup> &nbsp; E</td><td>D<sup>16</sup></td></tr>
<tr><td>B<sup>16</sup> &nbsp; E<sup>17</sup> &nbsp; F<sup>(12+4)</sup></td><td>E<sup>16</sup></td></tr>
<tr><td>B<sup>16</sup> &nbsp; E<sup>17</sup> &nbsp; G<sup>(17+0)</sup></td><td>G<sup>17</sup></td></tr>
</tbody></table></div>
<p><b>g(n)</b> = actual from start · <b>h(n)</b> = estimated. Marginal note: <i>since B has the same value we close it before / choose which is closest to the goal node using h(n) : h(n) &lt; h(n)</i>.</p>
<div class="answer">Closed order S, C, D, E, G — path S → C → D → E → G, cost 17.</div>`},

{id:"nb8", m:"m2", page:"Notebook A · p.8 · 6/8 · Notebook B p.3–5", title:"A* — the suboptimality trap",
 body:`<p>The question as written: <i>"Consider the graph given below. Assume that initial state is S &amp; the goal state is G. Show how A* search would create a search tree to find a path from S to G at each step of the search algo. Show which node is being expanded &amp; the content of the fringe (or OPEN). Also report the eventual sol&#8319; found by the algo &amp; the sol&#8319; cost, assuming the SLD as the heuristic f&#8319;."</i></p>
<p>h(S)=17, h(A)=10, h(B)=13, h(C)=4, h(D)=2, h(E)=4, h(F)=1, h(G)=0.</p>
<div class="note-warn"><b>Marked "not optimal" in the margin.</b> The first trace ran:<br>
CLOSED: S¹⁷, C¹⁴, A¹⁶, E¹⁶, F¹⁷, G¹⁹ → <b>path written as S→C→A→E→F→G, cost = 19</b>.<br>
Two separate errors are being flagged here.</div>
<div class="note-tip"><b>Corrected on the next page: "ans = 18", path S → B → E → F → G.</b><br>
The continued CLOSED list runs S¹⁷, C¹⁴, A¹⁶, E¹⁶, F¹⁷, D¹⁸, B¹⁸, D¹⁴, E¹⁵, F¹⁶, G¹⁸.</div>
<h4>The two notes written in red</h4>
<div class="note-warn"><b>★ Note:</b> A* makes final path w.r.t. the parent node &amp; starting from G &amp; going in reverse.<br><br>
<b>★★ Don't write the path by directly looking at closed list. Directly go like: G ka parent is D.</b></div>
<p><b>What this means for the exam.</b> Two things can go wrong and both are being corrected here:</p>
<ol class="list">

</ol>`},

{id:"nb9", m:"m2", page:"Notebook A · p.9", title:"Optimality of A* · Local search · Hill climbing",
 body:`<h4>Optimality of A*</h4>
<p>If the heuristic f&#8319; h(n) is admissible (never overestimates the remaining cost), then A* always finds the optimal path.</p>
<div class="formula">Let  G  = optimal Goal
     C* = optimal cost
     G₂ = suboptimal goal (cost ↑ than C*)

∵ G₂ is not optimal
     f(G₂) = g(G₂) > C*

node n still in OPEN list &amp; lies on optimal path.
cause heuristic is admissible:
     f(n) = g(n) + h(n) ≤ C*
∴    f(n) ≤ C* < f(G₂)

⇒ A* will expand the node with the smallest f-value
∵ f(n) < f(G₂) ; A* will expand n before G₂</div>
<p>By repeatedly expanding such nodes, A* reaches the optimal goal G before it can ever choose the suboptimal goal G₂.</p>
<p><b>Conclusion:</b> A* always returns the optimal sol&#8319; if h(n) is admissible.</p>
<h4>Local search algorithms</h4>
<p>Interested in final goal &amp; not the path — <b>path is not imp.</b> e.g. n-queens.</p>
<h4>Hill-climbing search</h4>
<p>The landscape drawn in class, with these features labelled: <b>shoulder</b>, <b>global maximum</b>, <b>local maximum</b>, <b>"flat" local maximum</b>, <b>current state</b>, <b>state space</b>, and the note <b>ridges (local max)</b>.</p>
<div class="note-warn"><b>problem: ridges, local maxima, plateaux</b></div>`},

{id:"nb10", m:"m2", page:"Notebook A · p.10 · 10/8", title:"Hill climbing types · Simulated annealing",
 body:`<div class="note-note">Margin note on this page: <b>Hill climbing → ★ problems diagram + naming to overcome — the variants.</b> That is the shape of the expected answer.</div>
<h4>Types</h4>
<ol class="list">
<li><b>Simple hill climbing</b> — generates 1 neighbour only, moves only if the neighbour value is uphill value &amp; so on.</li>
<li><b>Steepest-ascent hill climbing</b> — generates all, chooses the highest.</li>
<li><b>Stochastic hill climbing</b> (better uphill) — generates all.</li>
<li><b>Random-restart hill climbing</b> — runs algo multiple times, each time with a diff. randomly generated initial state.</li>
</ol>
<h4>Simulated Annealing search — <span class="hi">theory</span></h4>
<p>It is named so because of its analogy to the process of physical annealing with solids.</p>
<ul class="list">
<li>Escape the local maxima by allowing some 'bad' moves but gradually decreases their frequency. (In the start, very frequently bad moves are allowed; towards the end, fewer bad moves.)</li>
<li>It allows bad moves with some probability <b>e<sup>ΔE/T</sup></b></li>
<li>At every step, we calc ΔE:
<div class="formula">ΔE > 0 : positive ; neighbour is good move
ΔE < 0 : negative ; neighbour is bad</div></li>
</ul>
<h4>Stopping criteria</h4>
<ol class="list">
<li>given minimum value of the temp. has been reached.</li>
<li>a certain no. of iterations has passed w/o acceptance of a new sol&#8319;.</li>
<li>a specified no. of total iterations has been executed.</li>
</ol>`},

{id:"nb11", m:"m2", page:"Notebook A · p.11 · 13/8", title:"Genetic algorithm · Adversarial search · Min-max",
 body:`<h4>3. Genetic Algorithm</h4>
<p>Better for large state space. Idea: from genetics &amp; natural selection.</p>
<ul class="list">
<li>to generate high quality sol&#8319; for optimization problem</li>
<li>select the best, leave the rest</li>
<li>fitness f&#8319; → heuristic f&#8319;</li>
</ul>
<div class="note-warn"><b>★ 10 marks</b> — written beside the next heading.</div>
<h4>iv) Adversarial search</h4>
<p>There exists an opponent who always has optimal move &amp; acc. to that we decide how to move. It is multi-agent.</p>
<p><b>Game playing:</b> e.g. tic tac toe.</p>
<h4>Min-max search (uses DFS)</h4>
<ul class="list">
<li>max nodes → chooses the highest value</li>
<li>min nodes → chooses the lowest value</li>
<li>starts from bottom</li>
<li>MAX chooses its best move assuming that MIN will always make the best possible counter-move</li>
</ul>
<p>When the tree is too big to find the sol&#8319; at every level, we apply <b>Alpha Beta Pruning</b>: it improves Minimax by eliminating branches that cannot affect final decision.</p>
<div class="formula">α → for MAX          β → for MIN

pruning condition :  α ≥ β  ⇒ prune

△ = max      ▽ = min      □ = utilities</div>`},

{id:"nb12", m:"m2", page:"Notebook A · p.12 · 17/8 · Notebook B p.6–7", title:"Min-max with pruning — worked example",
 body:`<p>Leaves, left to right: <b>−4, −9, 9, 6, −17, −4, −11, 7</b>. Root = MAX, level 2 = MIN, level 3 = MAX.</p>
<pre class="flow">                    α=−∞→−4
                       △  −4                      max
                  ╱          ╲
     α=−∞            ▽ −4      ▽ −4   α=−4        min
     β=−4         ╱      ╲    ╱     ╲  β=∞→−4
              △−4      △ 9   △ −4    △  ⟵ pruned  max
             ╱  ╲     ╱  ╲   ╱  ╲    ╱ ╲
           −4   −9   9    6 −17  −4 −11  7
                          ↑pruned      ↑↑ pruned</pre>
<div class="answer">final value at root node: −4 &nbsp;·&nbsp; α = −4 &nbsp;·&nbsp; β = ∞</div>
<p>From Notebook B p.7, written beside the same tree: <b>for max, update alpha · for min, update beta</b> · <i>"search in DFS way"</i> · the pruned branches are marked with crosses and the note <b>pruned as α ≥ −4</b>.</p>
<p>From Notebook B p.6:</p>
<div class="formula">MAX → tries to max val.
MIN → tries to lower val.

α = −∞ → initially. stores the best possible MAX val.
β = ∞  → initially. stores the best possible MIN val.

MIN MAX algo searches the entire tree.
Hence we use α–β pruning.</div>`},

{id:"nb14", m:"m3", page:"Notebook A · p.14 · Notebook B p.8–9 · 27/8", title:"First order predicate logic — the rules",
 body:`<h4>The four building blocks</h4>
<div class="formula">O — Object
P — Predicate
Q — Quantifier
C — Connective</div>
<h4>The five rules</h4>
<ol class="list">
<li>'Every / All' use <b>→</b></li>
<li>'Some' uses <b>AND</b> (∧)</li>
<li>One object — <b>unary</b> predicate: property<br>Two objects — <b>binary</b> predicate: relationship</li>
<li>Be careful with <b>'NO'</b></li>
<li>When there are diff. people then use <b>two variables</b></li>
</ol>
<h4>The six worked conversions</h4>
<div class="formula">i)   All students study mathematics
     ∀x (Student(x) → Studies(x, Maths))

ii)  Some students play football
     ∃x (Student(x) ∧ Plays(x, Football))

iii) If a person is a teacher, then they teach some subject
     ∀x (Teacher(x) → ∃y Teaches(x,y))

iv)  No student is lazy
     ∀x (Student(x) → ¬Lazy(x))

v)   Every father loves his child
     ∀x ∀y (Father(x,y) → Loves(x,y))

vi)  Every dog barks &amp; has four legs
     ∀x (Dog(x) → (Barks(x) ∧ HasFourLegs(x)))</div>`},

{id:"nb15", m:"m3", page:"Notebook A · p.15 · Notebook B p.10", title:"The four master patterns · Inference rules",
 body:`<div class="formula">i)   All A are B
     ∀x [ A(x) → B(x) ]

ii)  Some A are B
     ∃x [ A(x) ∧ B(x) ]

iii) No A are B
     ∀x [ A(x) → ¬B(x) ]

iv)  Every A relates to B
     ∀x [ A(x) → ∃y ( B(y) ∧ R(x,y) ) ]</div>
<h4>Examples written under them</h4>
<div class="formula">Every doctor has a degree   ∀x Doctor(x) → hasdegree(x)
Some doctors are researchers ∃x Doctor(x) ∧ Researchers(x)
Rhea is intelligent          Intelligent(Rhea)
Rhea likes AI                likes(Rhea, AI)
No student is absent         ∀x student(x) → ¬Absent(x)
Every father loves his child ∀x∀y (Father(x,y) → Loves(x,y))

If a person is a doctor, then they have degree &amp; help patients
  ∀x (Person(x) ∧ doctor(x)) → (have degree(x) ∧ help patient(x))
  ∀x (Doctor(x) → (have degree(x) ∧ helps patients(x)))

If a person is rich then they have a high paying job or
inherited wealth
  ∀x [(Person(x) ∧ Rich(x)) → (highpayingjob(x) ∨
                               has inherited wealth(x))]</div>
<h4>Inference Rules</h4>
<div class="formula">i)   Modus Ponens
     if P → Q &amp; P is true, then Q must be true

ii)  And elimination
     If P ∧ Q, we can infer P or Q separately

iii) Biconditional elimination
     if P ↔ Q is true, then we can derive both P → Q &amp; Q → P

iv)  Resolution Algo
     conjunction of disjunctions of literals</div>`},

{id:"nb16", m:"m3", page:"Notebook A · p.16 · 31/8 · Notebook B p.12", title:"CNF steps · Horn clauses · Unification · Resolution steps",
 body:`<h4>Steps to convert to CNF form (with example of Wumpus world)</h4>
<div class="formula">Eg:  B₁,₁ ⇔ (P₁,₂ ∨ P₂,₁)

1. Eliminate ⇔ , replacing α ⇔ β with (α → β) ∧ (β → α)
   (B₁,₁ → (P₁,₂ ∨ P₂,₁)) ∧ ((P₁,₂ ∨ P₂,₁) → B₁,₁)

2. Eliminate → , replacing α → β with ¬α ∨ β
   (¬B₁,₁ ∨ P₁,₂ ∨ P₂,₁) ∧ (¬(P₁,₂ ∨ P₂,₁) ∨ B₁,₁)

3. Move ¬ inwards using De Morgan's rule &amp; double negation
   (¬B₁,₁ ∨ P₁,₂ ∨ P₂,₁) ∧ ((¬P₁,₂ ∧ ¬P₂,₁) ∨ B₁,₁)

4. Apply distributivity law (∧ over ∨) and flatten
   (¬B₁,₁ ∨ P₁,₂ ∨ P₂,₁) ∧ (¬P₁,₂ ∨ B₁,₁) ∧ (¬P₂,₁ ∨ B₁,₁)</div>
<p><b>Short version written beside it:</b> 1. α ↔ β becomes α→β ∧ β→α · 2. α→β becomes ¬α ∨ β · 3. move ¬ inside · 4. distributivity.</p>
<h4>Horn clauses</h4>
<ul class="list">
<li>has atmost 1 positive literal</li>
<li>can be easily converted into implication or IF-THEN clause</li>
</ul>
<div class="formula">eg:  ¬A ∨ ¬B ∨ C
     ¬(A ∨ B) ∨ C
        ↓      ↓
        α      β
     ¬α ∨ β  ⇒  α → β</div>
<h4>Unification</h4>
<p>It enables the appropriate rule to be applied.</p>
<h4>Steps for Resolution</h4>
<ol class="list">
<li>Conversion of facts into first-order logic / propositional logic</li>
<li>Convert FOL statements into CNF</li>
<li>Negate the statement which needs to prove (proof by contradiction)</li>
<li>Draw resolution graph (unification)</li>
</ol>
<h4>The worked example on the same page</h4>
<p>Consider the given facts: 1. Renee is hungry. 2. If Renee is hungry, she barks. 3. If Renee is barking, then Raja is angry. Convert to propositional logic &amp; prove by resolution that Raja is angry.</p>
<div class="formula">Step I: conversion to propositional logic
   p : Renee is hungry
   q : Renee is barking
   r : Raja is angry
   1) p     2) p → q     3) q → r

Step II: conversion to CNF form
   1) p     2) ¬p ∨ q    3) ¬q ∨ r

Step III: Negate the statement to be proved →  ¬r

Step IV:
   ¬r  +  (¬q ∨ r)   →  ¬q
   ¬q  +  (¬p ∨ q)   →  ¬p
   ¬p  +  p          →  ☐  empty clause

   our assumption is wrong  ∴ Raja is angry</div>`},

{id:"nb17", m:"m3", page:"Notebook A · p.17–18 · Notebook B p.15–18", title:"Resolution — John likes peanuts (full proof)",
 body:`<h4>Knowledge base</h4>
<ol class="list">
<li>John likes all kinds of food.</li><li>Apple and vegetable are food.</li>
<li>Anything anyone eats &amp; not killed is food.</li><li>Anil eats peanuts &amp; still alive.</li>
<li>Harry eats everything that Anil eats.</li>
</ol>
<p>Prove by resolution that: <b>6. John likes peanuts.</b></p>
<h4>Step 1 — Conversion of facts into FOPL</h4>
<div class="formula">a) ∀x : food(x) → likes(John, x)
b) food(Apple) ∧ food(vegetables)
c) ∀x ∀y : eats(x,y) ∧ ¬killed(x) → food(y)
d) eats(Anil, Peanuts) ∧ alive(Anil)
e) ∀x : eats(Anil, x) → eats(Harry, x)
f) ∀x : ¬killed(x) → alive(x)      ⎫ added
g) ∀x : alive(x) → ¬killed(x)      ⎭ predicates
h) likes(John, Peanuts)</div>
<h4>Step 2 — Convert to CNF form</h4>
<div class="formula">a) ∀x  ¬food(x) ∨ likes(John, x)
b) food(Apple) ∧ food(vegetables)
c) ∀x∀y  ¬(eats(x,y) ∧ ¬killed(x)) ∨ food(y)
   ∀x∀y  ¬eats(x,y) ∨ killed(x) ∨ food(y)
d) eats(Anil, Peanuts) ∧ alive(Anil)
e) ∀x  ¬eats(Anil, x) ∨ eats(Harry, x)
f) ∀x  ¬(¬killed(x)) ∨ alive(x)  →  killed(x) ∨ alive(x)
g) ∀x  ¬alive(x) ∨ ¬killed(x)
h) likes(John, Peanuts)</div>
<p>Then: rename / standardize variables · eliminate existential quantifiers by Skolemization (none here) · drop universal quantifiers.</p>
<h4>Step 3 — Negate the statement to be proved</h4>
<p>Assume the negation of "John likes Peanuts": <code>¬(likes(John, Peanuts))</code></p>
<h4>Step 4 — The resolution graph</h4>
<div class="flow">¬likes(John,Peanuts)     ¬food(x) ∨ likes(John,x)
         │                    {Peanuts / x}
         └────────┬───────────────┘
                  ▼
        ¬food(Peanuts)        ¬eats(y,z) ∨ killed(y) ∨ food(z)
                  │                {Peanuts / z}
                  └────────┬───────────────┘
                           ▼
     ¬eats(y,Peanuts) ∨ killed(y)      eats(Anil, Peanuts)
                           │                {Anil / y}
                           └────────┬───────────────┘
                                    ▼
                 killed(Anil)     ¬alive(k) ∨ ¬killed(k)
                                    │        {Anil / k}
                                    └────┬──────────┘
                                         ▼
                          ¬alive(Anil)        alive(Anil)
                                         │
                                         └────┬─────┘
                                              ▼
                                            {  }
                                        empty clause</div>
<div class="answer">Since we get an empty clause in the end of resolution graph, we prove that ¬likes(John, Peanuts) is false and <b>John likes peanuts</b>. Hence proved — assumption incorrect.</div>
<div class="note-tip"><b>Two margin notes worth keeping (Notebook B, p.18):</b><br>
★ you can also take p or q in p ∧ q<br>
★ even if some statements aren't used, it is fine<br>
★ a clause is <b>always combined with OR</b></div>`},

   {q:"(a) A hospital deploys an AI system that reads a patient's smartwatch data continuously, remembers their history, decides when to alert a doctor, and books an appointment through the hospital's API. (i) Classify it as simple reflex / model-based / goal-based / utility-based / learning, and justify with two reasons. (ii) Classify its environment across all six properties. (iii) Is it Traditional AI or Agentic AI? Justify on the four axes.",
    a:`<b>(i) Agent type — Learning agent</b> (accept model-based/goal-based with strong justification, but learning is best).<br>
    Reason 1: it <i>remembers patient history</i>, so it maintains an internal state — at minimum model-based.<br>
    Reason 2: it <i>decides when to alert</i> based on a goal (patient safety) and improves its thresholds from data, which is the learning element plus critic.<br><br>
    <b>(ii) Environment:</b><br>
    Partially observable — sensors capture only vitals, not the patient's full condition.<br>
    Stochastic — physiological responses are not fully predictable.<br>
    Sequential — earlier readings affect later decisions.<br>
    Dynamic — the patient's state changes while the system deliberates.<br>
    Continuous — vitals arrive as continuous signals.<br>
    Multi-agent — the doctor, the patient and the booking system are other agents.<br><br>
    <b>(iii) Agentic AI.</b> <i>Autonomy</i> — acts without being prompted each time (within permissions). <i>Memory</i> — maintains patient context across time. <i>Tool usage</i> — calls the hospital booking API. <i>Goal orientation</i> — completes a multi-step workflow (monitor → detect → alert → book), not a single response.`},
   {q:"(b) Write the PEAS description for an automated taxi driver. Then explain, with reference to your PEAS, why the environment is dynamic and multi-agent.",
    a:`<b>PEAS table:</b><br>
    <i>Performance measure</i> — safety, time, legal drive, comfort.<br>
    <i>Environment</i> — roads, other cars, pedestrians, road signs.<br>
    <i>Actuators</i> — steering, accelerator, brake, signal, horn.<br>
    <i>Sensors</i> — camera, sonar, GPS, speedometer, odometer, accelerometer, engine sensors, keyboard.<br><br>
    <b>Why dynamic:</b> the Environment row itself contains other cars and pedestrians, which move while the agent is deliberating. The world does not wait for the agent to decide, so it is dynamic rather than static.<br>
    <b>Why multi-agent:</b> those same other cars and pedestrians are themselves agents pursuing their own goals, and they may be competitive (racing for a gap) or co-operative (letting you merge). A strict definition of another agent is anything that changes from step to step.`},
   {q:"(c) Explain the four approaches to categorizing intelligent systems. State which approach modern AI follows and why the other three are insufficient on their own.",
    a:`<b>The 2×2 grid:</b> thinking vs acting, crossed with humanly vs rationally.<br><br>
    <b>1. Acting humanly — Turing Test.</b> A human interrogator cannot tell whether the responses come from a human or a machine. Requires NLP, knowledge representation, automated reasoning and machine learning; the total test adds computer vision and robotics.<br>
    <b>2. Thinking humanly — cognitive modelling.</b> Humans observed from the inside, via introspection or psychological experiments. This is Cognitive Science.<br>
    <b>3. Thinking rationally — laws of thought.</b> Rationality through logic.<br>
    <b>4. Acting rationally — the rational agent.</b> Doing the right thing: maximising expected goal achievement given the available information.<br><br>
    <b>Modern AI follows approach 4.</b><br>
    Why the others fall short: <i>(1)</i> imitating humans is not the engineering goal — we want systems that do well, not systems that pass as human. <i>(2)</i> cognitive modelling requires a theory of human cognition we do not have. <i>(3)</i> humans are not always rational, logic cannot express uncertainty, and the logical approach is often computationally infeasible without guidance.`}]},

   {q:"(b) Perform alpha–beta pruning on the tree with leaves −4, −9, 9, 6, −17, −4, −11, 7 (root MAX, level 2 MIN, level 3 MAX). Annotate each node with α and β, state what is pruned and why, and give the root value.",
    a:`<b>C₁ (MAX, α=−∞ β=+∞):</b> −4 → α=−4; −9 → no change. Returns <b>−4</b>.<br>
    <b>B₁ (MIN):</b> β = −4. α = −∞ &lt; −4, continue.<br>
    <b>C₂ (MAX, α=−∞ β=−4):</b> leaf 9 → α = 9. Test α ≥ β: <b>9 ≥ −4 → PRUNE</b>, so leaf <b>6</b> is never examined. Returns 9.<br>
    <b>B₁:</b> β = min(−4, 9) = −4. Returns <b>−4</b>. Root α = −4.<br>
    <b>C₃ (MAX, α=−4 β=+∞):</b> −17, then −4. Returns <b>−4</b>.<br>
    <b>B₂ (MIN):</b> β = −4. Test α ≥ β: <b>−4 ≥ −4 → PRUNE</b>. The whole of C₄ and its leaves <b>−11 and 7</b> are never examined.<br><br>
    <div class="answer">Root value = <b>−4</b> (α = −4, β = +∞ at the root). Pruned: leaf 6, plus node C₄ with leaves −11 and 7 — 3 of 8 leaves saved.</div>
    Note explicitly that equality (α = β = −4) is enough to prune, and that alpha–beta returns the same decision as minimax.`},
   {q:"(c) Explain simulated annealing: its analogy, its acceptance rule and its three stopping criteria. Contrast it with hill climbing in one line.",
    a:`<b>Analogy.</b> Named after physical annealing of solids: heat a crystalline solid, then cool it very slowly until it reaches its minimum lattice energy state, free of defects. Slow cooling gives structural integrity; fast cooling gives a fragile structure.<br><br>
    <b>Correspondence:</b> system states ↔ solutions · energy ↔ cost · change of state ↔ neighbouring solutions · temperature ↔ control parameter T · frozen state ↔ heuristic solution.<br><br>
    <b>Acceptance rule.</b> At every step compute ΔE.<br>
    ΔE &gt; 0 (good move) → accept unconditionally.<br>
    ΔE &lt; 0 (bad move) → accept with probability <b>e<sup>ΔE/T</sup></b>.<br>
    As T falls this probability tends to zero, so bad moves become rarer.<br><br>
    <b>Three stopping criteria:</b><br>
    1. A given minimum value of the temperature has been reached.<br>
    2. A certain number of iterations has passed without acceptance of a new solution.<br>
    3. A specified number of total iterations has been executed.<br><br>
    <b>Contrast:</b> hill climbing never goes downhill so it gets trapped in local optima; simulated annealing goes downhill sometimes, with decreasing probability, so it escapes and still settles. Add: if T decreases slowly enough, SA finds a global optimum with probability approaching 1, and SA is memoryless.`}]},

    a:`<b>Definition first:</b> a semantic network is a graph in which nodes represent concepts, objects or classes and labelled links represent their semantic relationships (IS-A, INSTANCE-OF, HAS-A, PART-OF).<br><br>

/* Render a weighted graph with heuristics. opts.path highlights a route. */
function graphSVG(key, opts){
  const g = GRAPHS[key]; if(!g) return "";
  opts = opts || {};
  const path = opts.path || null;
  const pos = {}; g.nodes.forEach(n => pos[n.id] = n);
  const onPath = (a,b) => {
    if(!path) return false;
    for(let i=0;i<path.length-1;i++){
      if((path[i]===a && path[i+1]===b) || (path[i]===b && path[i+1]===a)) return true;
    }
    return false;
  };
  let out = '<svg viewBox="0 0 '+g.w+' '+g.h+'" role="img" aria-label="'+esc(g.title)+'">';
  g.edges.forEach(function(e){
    const A = pos[e[0]], B = pos[e[1]];
    const hi = onPath(e[0], e[1]);
    out += '<line x1="'+A.x+'" y1="'+A.y+'" x2="'+B.x+'" y2="'+B.y+'" class="ge'+(hi?" hi":(path?" dim":""))+'"/>';
    const mx = (A.x+B.x)/2, my = (A.y+B.y)/2;
    out += '<rect x="'+(mx-12)+'" y="'+(my-10)+'" width="24" height="20" rx="4" class="gw"/>'+
           '<text x="'+mx+'" y="'+my+'" class="gwt">'+e[2]+'</text>';
  });
  g.nodes.forEach(function(n){
    let cls = "gn";
    if(path){ cls += path.indexOf(n.id)>=0 ? " on" : " off"; }
    else if(n.id===g.goal) cls += " goal";
    else if(n.id===g.start) cls += " start";
    out += '<circle cx="'+n.x+'" cy="'+n.y+'" r="19" class="'+cls+'"/>'+
           '<text x="'+n.x+'" y="'+n.y+'" class="gnt">'+n.id+'</text>'+
           '<text x="'+n.x+'" y="'+(n.y+32)+'" class="gh">h='+n.h+'</text>';
  });
  out += '</svg>';
  const cap = opts.cap || (g.title + " · orange = heuristic h(n), boxed number on each edge = actual cost");
  return '<div class="gwrap">'+out+'<div class="gcap">'+esc(cap)+'</div></div>';
}

/* Render a 3-level game tree from 8 leaves. Values/pruning optional. */
function treeSVG(leaves, opts){
  opts = opts || {};
  const W = 580, H = 300;
  const lx = i => 46 + i*(488/7);
  const LY = 246, L3Y = 186, L2Y = 122, RY = 58;
  const x3 = i => (lx(2*i) + lx(2*i+1))/2;
  const x2 = i => (x3(2*i) + x3(2*i+1))/2;
  const xr = (x2(0) + x2(1))/2;
  const show = !!opts.values;
  const v3 = i => Math.max(leaves[2*i], leaves[2*i+1]);
  const v2 = i => Math.min(v3(2*i), v3(2*i+1));
  const vr = Math.max(v2(0), v2(1));
  const pL = opts.prunedLeaves || [], pN = opts.prunedNodes || [];
  const isPL = i => pL.indexOf(i) >= 0;
  const isPN = i => pN.indexOf(i) >= 0;

  let out = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Game tree with leaves '+leaves.join(", ")+'">';
  out += '<text x="6" y="'+RY+'" class="trole">MAX</text><text x="6" y="'+L2Y+'" class="trole">MIN</text>'+
         '<text x="6" y="'+L3Y+'" class="trole">MAX</text><text x="6" y="'+LY+'" class="trole">leaf</text>';
  for(let i=0;i<2;i++) out += '<line x1="'+xr+'" y1="'+(RY+13)+'" x2="'+x2(i)+'" y2="'+(L2Y-13)+'" class="te"/>';
  for(let i=0;i<4;i++){
    const par = Math.floor(i/2);
    out += '<line x1="'+x2(par)+'" y1="'+(L2Y+13)+'" x2="'+x3(i)+'" y2="'+(L3Y-13)+'" class="te'+(isPN(i)?" pruned":"")+'"/>';
  }
  for(let i=0;i<8;i++){
    const par = Math.floor(i/2);
    out += '<line x1="'+x3(par)+'" y1="'+(L3Y+13)+'" x2="'+lx(i)+'" y2="'+(LY-11)+'" class="te'+((isPL(i)||isPN(par))?" pruned":"")+'"/>';
  }
  out += '<path d="M'+xr+' '+(RY-13)+' L'+(xr+15)+' '+(RY+13)+' L'+(xr-15)+' '+(RY+13)+' Z" class="tn"/>';
  if(show) out += '<text x="'+xr+'" y="'+(RY-22)+'" class="tvt">'+vr+'</text>';
  for(let i=0;i<2;i++){
    out += '<path d="M'+(x2(i)-15)+' '+(L2Y-13)+' L'+(x2(i)+15)+' '+(L2Y-13)+' L'+x2(i)+' '+(L2Y+13)+' Z" class="tn"/>';
    if(show) out += '<text x="'+(x2(i)+27)+'" y="'+(L2Y-4)+'" class="tvt">'+v2(i)+'</text>';
  }
  for(let i=0;i<4;i++){
    out += '<path d="M'+x3(i)+' '+(L3Y-13)+' L'+(x3(i)+14)+' '+(L3Y+13)+' L'+(x3(i)-14)+' '+(L3Y+13)+' Z" class="tn'+(isPN(i)?" pruned":"")+'"/>';
    if(show && !isPN(i)) out += '<text x="'+x3(i)+'" y="'+(L3Y-22)+'" class="tvt">'+v3(i)+'</text>';
  }
  for(let i=0;i<8;i++){
    const pr = isPL(i) || isPN(Math.floor(i/2));
    out += '<rect x="'+(lx(i)-19)+'" y="'+(LY-11)+'" width="38" height="24" rx="4" class="tl'+(pr?" pruned":"")+'"/>'+
           '<text x="'+lx(i)+'" y="'+(LY+1)+'" class="tlt'+(pr?" pruned":"")+'">'+leaves[i]+'</text>';
  }
  out += '</svg>';
  const cap = opts.cap || "△ = MAX · ▽ = MIN · □ = utility values, from MAX's perspective";
  return '<div class="gwrap">'+out+'<div class="gcap">'+esc(cap)+'</div></div>';
}

const KEY = "cepcc712_mse_prep_v1";
const THEME_KEY = "sem7.theme";

function blank(){ return {conf:{}, quiz:{}, revealed:{}, notesRead:{}, lastVisit:null, streak:0, firstVisit:null}; }
let P = blank();

/* conf[id] = "good" | "shaky" | "bad"  — self-rated confidence per item */
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw){ P = blank(); P.firstVisit = today(); return; }
    const v = validate(JSON.parse(raw));
    P = v.ok ? v.data : blank();
    if(!P.firstVisit) P.firstVisit = today();
  }catch(e){ P = blank(); P.firstVisit = today(); }
}
function validate(o){
  if(!o || typeof o!=="object" || Array.isArray(o)) return {ok:false};
  const d = blank();
  const ids = new Set(allItemIds());
  const qids = new Set(["m1","m2","m3"]);
  const nids = new Set(NOTES.map(n=>n.id));
  const pick=(src,allow,fn)=>{const out={};
    if(src&&typeof src==="object"&&!Array.isArray(src))
      for(const k of Object.keys(src)){ if(!allow.has(k))continue; const v=fn(src[k]); if(v!==undefined)out[k]=v; }
    return out;};
  d.conf = pick(o.conf, ids, v => ["good","shaky","bad"].includes(v)?v:undefined);
  d.revealed = pick(o.revealed, ids, v => v===true?true:undefined);
  d.notesRead = pick(o.notesRead, nids, v => v===true?true:undefined);
  d.quiz = pick(o.quiz, qids, v=>{
    if(!v||typeof v!=="object") return undefined;
    const s=+v.score, t=+v.total;
    if(!isFinite(s)||!isFinite(t)||t<=0) return undefined;
    return {score:Math.max(0,Math.min(s,t)), total:t, at:typeof v.at==="string"?v.at:today()};
  });
  d.lastVisit = typeof o.lastVisit==="string"?o.lastVisit:null;
  d.firstVisit = typeof o.firstVisit==="string"?o.firstVisit:today();
  d.streak = Math.max(0, Math.min(3650, +o.streak||0));
  return {ok:true, data:d};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(P)); }catch(e){ toast("Could not save — storage may be blocked."); } }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function touch(){
  const t=today(); if(P.lastVisit===t) return;
  if(!P.lastVisit) P.streak=1;
  else{ const g=Math.round((new Date(t+"T00:00:00")-new Date(P.lastVisit+"T00:00:00"))/86400000);
        P.streak = g===1 ? (P.streak||0)+1 : 1; }
  P.lastVisit=t; save();
}

/* ------------------------- selectors ------------------------------- */
const MIDS = ["m1","m2","m3"];
function theoryOf(m){ return THEORY[m]||[]; }
function numOf(m){ return NUM[m]||[]; }
function allItems(m){ return theoryOf(m).concat(numOf(m)); }
function allItemIds(){
  let out=[];
  MIDS.forEach(m=>{ allItems(m).forEach(i=>{ out.push(i.id);
    (i.practice||[]).forEach(p=>out.push(p.id)); }); });
  return out;
}
function itemById(id){
  for(const m of MIDS){ const f=allItems(m).find(i=>i.id===id); if(f) return f; }
  return null;
}
function losOf(m){ return LOS.filter(l=>l.m===m); }
function itemsForLO(lo){
  let out=[];
  MIDS.forEach(m=>allItems(m).forEach(i=>{ if(i.lo===lo) out.push(i); }));
  return out;
}
const conf = id => P.conf[id] || null;
const CONF_SCORE = {good:1, shaky:0.5, bad:0};

/* Readiness = mean confidence over every item in scope (unrated = 0). */
function readiness(items){
  if(!items.length) return {pct:0, rated:0, total:0, good:0, shaky:0, bad:0};
  let sum=0, rated=0, good=0, shaky=0, bad=0;
  items.forEach(i=>{ const c=conf(i.id);
    if(c){ rated++; sum+=CONF_SCORE[c]; if(c==="good")good++; else if(c==="shaky")shaky++; else bad++; }});
  return {pct:Math.round(sum/items.length*100), rated, total:items.length, good, shaky, bad};
}
function moduleItems(m){
  let out = allItems(m).slice();
  allItems(m).forEach(i=>(i.practice||[]).forEach(p=>out.push(p)));
  return out;
}
function moduleReadiness(m){ return readiness(moduleItems(m)); }
function overall(){
  let all=[]; MIDS.forEach(m=>all=all.concat(moduleItems(m)));
  return readiness(all);
}
function weakItems(){
  let out=[];
  MIDS.forEach(m=>allItems(m).forEach(i=>{
    const c=conf(i.id);
    if(c==="bad"||c==="shaky") out.push({item:i, m, c});
  }));
  return out.sort((a,b)=> (a.c==="bad"?0:1)-(b.c==="bad"?0:1));
}
function quizPerf(){
  const t=Object.values(P.quiz); if(!t.length) return null;
  const s=t.reduce((a,q)=>a+q.score,0), n=t.reduce((a,q)=>a+q.total,0);
  return {taken:t.length, score:s, total:n, pct:Math.round(s/n*100)};
}
/* Rule-based next-step recommendation. */
function nextStep(){
  const w = weakItems().filter(x=>x.c==="bad");
  if(w.length) return {kind:"weak", item:w[0].item, m:w[0].m,
    why:'You marked this "Couldn’t do it"', plan:"Re-read the answer, then the exam-answer box, then re-rate."};
  const unrated=[];
  MIDS.forEach(m=>allItems(m).forEach(i=>{ if(!conf(i.id) && i.priority==="high") unrated.push({i,m}); }));
  if(unrated.length) return {kind:"new", item:unrated[0].i, m:unrated[0].m,
    why:"High priority and not yet attempted", plan:"Read it, self-test, then rate your confidence."};
  const anyUnrated=[];
  MIDS.forEach(m=>allItems(m).forEach(i=>{ if(!conf(i.id)) anyUnrated.push({i,m}); }));
  if(anyUnrated.length) return {kind:"new", item:anyUnrated[0].i, m:anyUnrated[0].m,
    why:"Not yet attempted", plan:"Read it and rate your confidence."};
  const noq = MIDS.find(m=>!P.quiz[m]);
  if(noq) return {kind:"quiz", m:noq, why:"Everything rated — now test recall", plan:"Take the module quiz."};
  const shaky = weakItems();
  if(shaky.length) return {kind:"weak", item:shaky[0].item, m:shaky[0].m,
    why:'Still marked "Shaky"', plan:"Push it to solid before the exam."};
  return {kind:"mock", why:"Everything rated solid and all quizzes taken", plan:"Sit the full mock paper under timed conditions."};
}

/* Trim to n chars without cutting a word in half. */
function clip(s,n){
  s=String(s).trim();
  if(s.length<=n) return s;
  const cut=s.slice(0,n);
  const sp=cut.lastIndexOf(" ");
  return (sp>n*0.6 ? cut.slice(0,sp) : cut).replace(/[,;:.\s]+$/,"")+"…";
}

/* ------------------------------ MODULE ------------------------------ */
function vModule(m){
  const mod = MODULES.find(x=>x.id===m), r = moduleReadiness(m), g = MSE_GUIDANCE[m];
  let h = '<h1>Module '+mod.num+' — '+esc(mod.title)+'</h1>'+
   '<p class="lead">'+esc(mod.hours)+' hours · answered as <b>Q'+mod.num+'</b> of the paper, 10 marks.</p>';

  h += '<div class="card"><div class="badge-row" style="margin-bottom:7px"><b>Readiness</b>'+
    '<span style="margin-left:auto;font-weight:800;color:var(--accent)">'+r.pct+'%</span></div>'+pbar(r.pct, r.pct>=70?"good":"")+
    '<p class="small-muted" style="margin:.5rem 0 0">'+r.rated+' of '+r.total+' items rated · '+
    r.good+' solid · '+r.shaky+' shaky · '+r.bad+' weak</p></div>';

  h += '<div class="note-warn"><b>What the notes say about this module:</b> '+esc(g.raw)+'</div>';

  h += '<div class="subtabs" role="tablist">'+
   ['outcomes','theory','numericals','quiz'].map(function(s){
     const label = {outcomes:"Learning Outcomes",theory:"Theory Q&A",numericals:"Numericals",quiz:"Quiz"}[s];
     const n = s==="theory"?theoryOf(m).length : s==="numericals"?numOf(m).length : s==="quiz"?(QUIZ[m]||[]).length : losOf(m).length;
     if(s==="numericals" && !numOf(m).length) return "";
     return '<button role="tab" aria-selected="'+(sub[m]===s)+'" class="'+(sub[m]===s?"active":"")+'" data-sub="'+s+'" data-m="'+m+'">'+label+' ('+n+')</button>';
   }).join("")+'</div>';

  h += '<div class="subview active">';
  if(sub[m]==="outcomes")        h += vOutcomes(m);
  else if(sub[m]==="theory")     h += vTheory(m);
  else if(sub[m]==="numericals") h += vNumericals(m);
  else                           h += vQuiz(m);
  h += '</div>';
  return h;
}
