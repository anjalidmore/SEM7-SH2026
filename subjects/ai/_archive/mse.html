/* --------------------------- QUIZ SUB-VIEW -------------------------- */
function vQuiz(m){
  const qs = QUIZ[m]||[];
  const st = quizState[m] || (quizState[m] = {answers:new Array(qs.length).fill(null), checked:new Array(qs.length).fill(false), done:false});
  const prev = P.quiz[m];

  let h = '<p class="lead">'+qs.length+' questions on Module '+m.slice(1)+'. Answer, check, and read the explanation — wrong answers tell you exactly which topic to revisit.</p>';
  if(prev && !st.done) h += '<div class="note-note"><b>Last attempt:</b> '+prev.score+' / '+prev.total+' ('+Math.round(prev.score/prev.total*100)+'%) on '+esc(prev.at)+'.</div>';

  if(st.done){
    const score = st.answers.reduce((a,v,i)=>a+(v===qs[i].a?1:0),0);
    const pct = Math.round(score/qs.length*100);
    const wrong = qs.map((q,i)=>({q,i})).filter(x=>st.answers[x.i]!==x.q.a);
    h += '<div class="card" style="text-align:center"><div class="num" style="font-size:2.4rem;font-weight:800;color:'+(pct>=60?"var(--good)":"var(--bad)")+'">'+pct+'%</div>'+
      '<p style="margin:.3rem 0 0"><b>'+score+'</b> correct · <b>'+(qs.length-score)+'</b> incorrect · out of '+qs.length+'</p>'+
      pbar(pct, pct>=60?"good":"bad")+'</div>';
    if(wrong.length){
      h += '<h3>Revisit these</h3><div class="card">';
      const seen={};
      wrong.forEach(function(x){
        const it = itemById(x.q.t);
        if(!it || seen[x.q.t]) return; seen[x.q.t]=1;
        h += '<div style="display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)">'+
          pill("high","✗")+'<span style="flex:1;font-size:.88rem">'+esc(it.title||clip(strip(it.q),80))+'</span>'+
          '<button class="small" data-jump="'+it.id+'" data-m="'+m+'">Review</button></div>';
      });
      h += '</div>';
    }
    h += '<div class="btn-row" style="margin-top:12px"><button class="primary" data-retake="'+m+'">Retake quiz</button></div>';
    return h;
  }

  qs.forEach(function(q,i){
    const chosen = st.answers[i], done = st.checked[i];
    h += '<div class="quiz-q"><div class="q" style="font-weight:700;margin-bottom:8px">'+(i+1)+'. '+esc(q.q)+'</div>';
    q.o.forEach(function(o,oi){
      let cls="quiz-opt";
      if(done){ if(oi===q.a) cls+=" correct"; else if(oi===chosen) cls+=" incorrect"; }
      else if(oi===chosen) cls+=" sel-good";
      h += '<button class="'+cls+'" data-opt="'+oi+'" data-qi="'+i+'" data-m="'+m+'"'+(done?" disabled":"")+'>'+
        '<span class="mk">'+String.fromCharCode(65+oi)+'</span>'+esc(o)+'</button>';
    });
    if(done){
      const ok = chosen===q.a;
      h += '<div class="quiz-fb '+(ok?"correct":"incorrect")+'"><b>'+(ok?"Correct. ":"Not quite. ")+'</b>'+esc(q.e)+'</div>';
    } else {
      h += '<div class="reveal-row"><button class="small primary" data-check="'+i+'" data-m="'+m+'">Check answer</button></div>';
    }
    h += '</div>';
  });
  const allDone = st.checked.every(Boolean);
  h += '<div class="btn-row"><button class="primary" data-finish="'+m+'"'+(allDone?"":" disabled")+'>'+
    (allDone?"Finish and see score":"Answer all questions to finish")+'</button></div>';
  return h;
}

  MOCK.questions.forEach(function(q){

  const left = Math.max(0, MOCK.minutes*60 - Math.floor((Date.now()-mockStart)/1000));
  return String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
}

/* ------------------------------ ROUTER ------------------------------ */
function renderAll(){
  const app = $("#app");
  let h = "";
  if(view==="dashboard")      h = vDashboard();
  else if(MIDS.includes(view))h = vModule(view);
  else if(view==="notes")     h = vNotes();
  else if(view==="mock")      h = vMock();
  else if(view==="guide")     h = vGuide();
  else if(view==="coverage")  h = vCoverage();
  app.innerHTML = '<div class="view active">'+h+'</div>';
  $$("#mainNav button").forEach(b=>b.classList.toggle("active", b.dataset.view===view));
}

/* ------------------------------ EVENTS ------------------------------ */
document.addEventListener("click", function(e){
  const t = e.target.closest("button, a");
  if(!t) return;
  const d = t.dataset;

  if(d.view){ view = d.view; window.scrollTo(0,0); renderAll(); return; }
  if(d.go){
    if(MIDS.includes(d.go)){ view = d.go; if(d.sub) sub[d.go] = d.sub; }
    else view = d.go;
    window.scrollTo(0,0); renderAll(); return;
  }
  if(d.sub && d.m){ sub[d.m] = d.sub; renderAll(); return; }
  if(d.conf){ setConf(d.id, d.conf); return; }
  if(d.reveal){
    const id = d.reveal;
    if(P.revealed[id]) delete P.revealed[id]; else P.revealed[id] = true;
    save(); renderAll();
    const el = document.getElementById("item_"+id);
    if(el) el.scrollIntoView({block:"nearest"});
    return;
  }
  if(d.revealall){ theoryOf(d.revealall).forEach(i=>P.revealed[i.id]=true); save(); renderAll(); return; }
  if(d.hideall){ theoryOf(d.hideall).forEach(i=>delete P.revealed[i.id]); save(); renderAll(); return; }
  if(d.noteread){
    if(P.notesRead[d.noteread]) delete P.notesRead[d.noteread]; else P.notesRead[d.noteread] = true;
    save(); renderAll(); return;
  }
  if(d.jump){
    const m = d.m;
    if(MIDS.includes(m)){
      view = m;
      sub[m] = numOf(m).some(n=>n.id===d.jump) ? "numericals" : "theory";
      filters[m] = {lo:"all", pri:"all"};
      P.revealed[d.jump] = true; save(); renderAll();
      const el = document.getElementById("item_"+d.jump);
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    }
    return;
  }
  /* quiz */
  if(d.opt !== undefined && d.qi !== undefined){
    const m = d.m, st = quizState[m];
    if(st && !st.checked[+d.qi]){ st.answers[+d.qi] = +d.opt; renderAll(); }
    return;
  }
  if(d.check !== undefined){
    const m = d.m, i = +d.check, st = quizState[m];
    if(st.answers[i] === null){ toast("Select an answer first."); return; }
    st.checked[i] = true; renderAll(); return;
  }
  if(d.finish){
    const m = d.finish, qs = QUIZ[m], st = quizState[m];
    const score = st.answers.reduce((a,v,i)=>a+(v===qs[i].a?1:0),0);
    P.quiz[m] = {score:score, total:qs.length, at:today()};
    /* Feed wrong answers into confidence: anything missed is flagged shaky
       unless the student has already rated it worse. */
    qs.forEach(function(q,i){
      if(st.answers[i] !== q.a){
        const cur = P.conf[q.t];
        if(cur !== "bad") P.conf[q.t] = "shaky";
      }
    });
    st.done = true; save(); window.scrollTo(0,0); renderAll(); return;
  }
  if(d.retake){ delete quizState[d.retake]; window.scrollTo(0,0); renderAll(); return; }
  /* mock timer */
  if(d.mock){
    if(d.mock==="start"){ mockStart = Date.now(); startClock(); }
    else if(d.mock==="stop"){ mockStart = null; stopClock(); }
    else { mockStart = null; stopClock(); }
    renderAll(); return;
  }
  if(t.id==="resetLink"){ e.preventDefault(); askReset(); return; }
  if(t.id==="exportLink"){ e.preventDefault(); doExport(); return; }
  if(t.id==="importLink"){ e.preventDefault(); $("#importFile").click(); return; }
  if(t.id==="themeBtn"){
    const cur = document.documentElement.getAttribute("data-theme");
    const isDark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    setTheme(isDark ? "light" : "dark"); return;
  }
});

document.addEventListener("change", function(e){
  const d = e.target.dataset;
  if(d.filter && d.m){ filters[d.m][d.filter] = e.target.value; renderAll(); return; }
  if(d.notesfilter){ notesFilter = e.target.value; renderAll(); return; }
  if(e.target.id==="importFile" && e.target.files && e.target.files[0]){
    doImport(e.target.files[0]); e.target.value = "";
  }
});

function startClock(){
  stopClock();
  mockTimer = setInterval(function(){
    const el = $("#mockClock");
    if(!el){ stopClock(); return; }
    el.textContent = fmtClock();
    if(mockStart && Date.now()-mockStart >= MOCK.minutes*60000){ stopClock(); mockStart=null; toast("Time is up."); renderAll(); }
  }, 1000);
}
function stopClock(){ if(mockTimer){ clearInterval(mockTimer); mockTimer=null; } }

/* --------------------- export / import / reset ---------------------- */
function doExport(){
  try{
    const blob = new Blob([JSON.stringify(Object.assign({},P,{exportedAt:new Date().toISOString(),course:EXAM.code}),null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "ai-mse-progress-"+today()+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast("Progress exported.");
  }catch(e){ toast("Export failed in this browser."); }
}
function doImport(file){
  const r = new FileReader();
  r.onload = function(){
    let parsed;
    try{ parsed = JSON.parse(r.result); }
    catch(e){ toast("Not valid JSON — nothing was changed."); return; }
    const v = validate(parsed);
    if(!v.ok){ toast("Not a recognised progress file — nothing was changed."); return; }
    P = v.data; save(); renderAll(); toast("Progress imported — readiness "+overall().pct+"%.");
  };
  r.onerror = function(){ toast("Could not read that file."); };
  r.readAsText(file);
}
function askReset(){
  if(confirm("Reset all your MSE prep progress?\n\nThis clears your confidence ratings, quiz scores and revealed answers in THIS browser only. The study material is not affected, and nobody else's progress is affected.\n\nThis cannot be undone.")){
    try{ localStorage.removeItem(KEY); }catch(e){}
    P = blank(); P.firstVisit = today(); quizState = {}; save();
    view = "dashboard"; window.scrollTo(0,0); renderAll();
    toast("Progress reset.");
  }
}

/* ------------------------------ theme ------------------------------- */
function setTheme(t){
  try{
    if(t==="system"){ localStorage.removeItem(THEME_KEY); document.documentElement.removeAttribute("data-theme"); }
    else{ localStorage.setItem(THEME_KEY,t); document.documentElement.setAttribute("data-theme",t); }
  }catch(e){ document.documentElement.setAttribute("data-theme",t); }
  toast(t==="dark"?"Dark theme.":"Light theme.");
}
function initTheme(){
  let t=null; try{ t=localStorage.getItem(THEME_KEY); }catch(e){}
  if(t==="light"||t==="dark") document.documentElement.setAttribute("data-theme",t);
}

/* ------------------------------- boot ------------------------------- */
initTheme();
load();
touch();
renderAll();
</script>
