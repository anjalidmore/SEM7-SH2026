<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI MSE Prep — CEPCC712 · Modules 1–3</title>
<meta name="description" content="Mid-Semester Exam preparation for CEPCC712 Artificial Intelligence. Modules 1–3, 30 marks. Built from the learning outcomes and class notes. Progress saved locally.">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f1f3f6;
  --ink:#1a1f2b; --ink-soft:#525a6b; --ink-mute:#7d8598;
  --border:#dde1e8; --border-2:#c8cedb;
  --accent:#25597f; --accent-soft:#e9f0f6; --accent-dark:#17415f; --accent-line:#b9cfe0;
  --good:#1c7a4d; --good-soft:#e4f3ea; --good-line:#b3ddc4;
  --bad:#b03528; --bad-soft:#fbeae8; --bad-line:#f0c4bd;
  --warn:#96650a; --warn-soft:#fdf2dd; --warn-line:#ecd5a4;
  --shadow:0 1px 2px rgba(16,20,28,.06), 0 1px 3px rgba(16,20,28,.04);
  --radius:8px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  --bg:#12151b; --panel:#1a1e26; --panel-2:#222732;
  --ink:#e6e9ef; --ink-soft:#aab2c0; --ink-mute:#828b9c;
  --border:#2a303c; --border-2:#3a4252;
  --accent:#7fb3d8; --accent-soft:#1a2a38; --accent-dark:#9cc6e6; --accent-line:#31506a;
  --good:#5cc98d; --good-soft:#12291d; --good-line:#224c33;
  --bad:#eb8a7d; --bad-soft:#2a1512; --bad-line:#57231c;
  --warn:#e0af57; --warn-soft:#291f0d; --warn-line:#54401a;
  --shadow:0 1px 3px rgba(0,0,0,.45);
 }
}
:root[data-theme="dark"]{
  --bg:#12151b; --panel:#1a1e26; --panel-2:#222732;
  --ink:#e6e9ef; --ink-soft:#aab2c0; --ink-mute:#828b9c;
  --border:#2a303c; --border-2:#3a4252;
  --accent:#7fb3d8; --accent-soft:#1a2a38; --accent-dark:#9cc6e6; --accent-line:#31506a;
  --good:#5cc98d; --good-soft:#12291d; --good-line:#224c33;
  --bad:#eb8a7d; --bad-soft:#2a1512; --bad-line:#57231c;
  --warn:#e0af57; --warn-soft:#291f0d; --warn-line:#54401a;
  --shadow:0 1px 3px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
a{color:var(--accent)}
img,svg{max-width:100%}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
/* ---------- topbar ---------- */
header.topbar{background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.topbar-inner{max-width:1080px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.02rem;white-space:nowrap;line-height:1.25}
.brand small{display:block;font-weight:400;color:var(--ink-soft);font-size:.7rem;letter-spacing:.01em}
nav.maintabs{display:flex;gap:3px;flex-wrap:wrap;flex:1}
nav.maintabs button{background:none;border:1px solid transparent;color:var(--ink-soft);
 padding:6px 9px;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:600;font-family:inherit;white-space:nowrap}
nav.maintabs button:hover{background:var(--accent-soft);color:var(--ink)}
nav.maintabs button.active{background:var(--accent);color:#fff}
:root[data-theme="dark"] nav.maintabs button.active{color:#101820}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.maintabs button.active{color:#101820}}
.icon-btn{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;
 border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer;font-size:.95rem}
main{max-width:1080px;margin:0 auto;padding:18px 16px 70px}
.view{display:none} .view.active{display:block}
/* ---------- typography ---------- */
h1{font-size:1.45rem;margin:.1rem 0 .3rem;letter-spacing:-.01em}
h2{font-size:1.13rem;margin:1.7rem 0 .6rem;border-bottom:2px solid var(--accent-soft);padding-bottom:6px}
h3{font-size:1rem;margin:1.1rem 0 .4rem}
h4{font-size:.8rem;margin:1rem 0 .35rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-mute)}
p{margin:.5rem 0}
.lead{color:var(--ink-soft);font-size:.92rem;margin:.3rem 0 1.1rem;max-width:66ch}
code{font-family:var(--mono);font-size:.86em;background:var(--panel-2);padding:.08em .34em;border-radius:4px;border:1px solid var(--border)}
/* ---------- cards & layout ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
 padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.grid.stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;text-align:center}
.stat .num{font-size:1.5rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.stat .label{font-size:.68rem;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
.stat .sub{font-size:.72rem;color:var(--ink-soft);margin-top:3px}
.progressbar{background:var(--border);border-radius:20px;height:8px;overflow:hidden;margin-top:7px}
.progressbar>div{background:var(--accent);height:100%;transition:width .3s}
.progressbar.good>div{background:var(--good)}
.progressbar.bad>div{background:var(--bad)}
/* ---------- subtabs ---------- */
.subtabs{display:flex;gap:2px;flex-wrap:wrap;margin:12px 0 16px;border-bottom:1px solid var(--border)}
.subtabs button{background:none;border:none;border-bottom:3px solid transparent;color:var(--ink-soft);
 padding:8px 13px;cursor:pointer;font-size:.87rem;font-weight:600;font-family:inherit}
.subtabs button:hover{color:var(--ink)}
.subtabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.subview{display:none} .subview.active{display:block}
/* ---------- buttons ---------- */
button,.btn{font-family:inherit;font-size:.84rem;padding:6px 12px;border-radius:6px;
 border:1px solid var(--border-2);background:var(--panel);color:var(--ink);cursor:pointer;font-weight:600}
button:hover{background:var(--panel-2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
:root[data-theme="dark"] button.primary{color:#101820}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#101820}}
button.small{padding:3px 9px;font-size:.76rem}
button.ghost{background:none;border-color:transparent}
button.ghost:hover{border-color:var(--border);background:var(--panel-2)}
button:disabled{opacity:.42;cursor:default}
button.sel-good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
button.sel-warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
button.sel-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
/* ---------- pills ---------- */
.pill{display:inline-block;font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:20px;
 text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;border:1px solid transparent}
.pill.high{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.pill.medium{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.low{background:var(--panel-2);color:var(--ink-mute);border-color:var(--border)}
.pill.lo{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.marks{background:var(--panel-2);color:var(--ink-soft);border-color:var(--border)}
.pill.num{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.pill.easy{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.pill.basic{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.pill.moderate{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.pill.difficult{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-line)}
.pill.examlevel{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.notes{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.pill.done{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* ---------- Q&A cards ---------- */
.qa{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
 padding:13px 15px;margin-bottom:11px;box-shadow:var(--shadow)}
.qa .meta{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.qa .q{font-weight:700;font-size:.95rem;line-height:1.5}
.qa .a{display:none;padding-top:10px;border-top:1px dashed var(--border);margin-top:10px;font-size:.9rem}
.qa .a.show{display:block}
.qa .a p:first-child{margin-top:0}
.reveal-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;align-items:center}
.conf-label{font-size:.72rem;color:var(--ink-mute);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.box{border-radius:6px;padding:9px 12px;margin-top:9px;font-size:.87rem;line-height:1.55}
.box b{font-weight:800}
.box.exam{background:var(--accent-soft);border-left:3px solid var(--accent)}
.box.exam b{color:var(--accent)}
.box.mistake{background:var(--bad-soft);border-left:3px solid var(--bad)}
.box.mistake b{color:var(--bad)}
.box.diagram{background:var(--warn-soft);border-left:3px solid var(--warn)}
.box.diagram b{color:var(--warn)}
.box.und{background:var(--panel-2);border-left:3px solid var(--border-2)}
.box p:last-child{margin-bottom:0}
.box ul,.box ol{margin:.4rem 0;padding-left:1.2rem}
/* ---------- toolbar / filters ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;
 background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px}
.toolbar select,.toolbar input[type=text],.toolbar input[type=search]{
 padding:5px 8px;border-radius:6px;border:1px solid var(--border-2);background:var(--panel);
 color:var(--ink);font-size:.84rem;font-family:inherit;max-width:100%}
.toolbar label{font-size:.78rem;font-weight:700;color:var(--ink-soft)}
.count{margin-left:auto;font-size:.78rem;color:var(--ink-mute);font-variant-numeric:tabular-nums}
/* ---------- LO blocks ---------- */
.lo{border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);
 padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.lo.strong{border-left:4px solid var(--good)}
.lo.mid{border-left:4px solid var(--warn)}
.lo.weakb{border-left:4px solid var(--bad)}
.lo.none{border-left:4px solid var(--border-2)}
.lo-h{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.lo-text{font-size:.92rem;font-weight:600;line-height:1.5;margin:0 0 8px}
.lo-meter{display:flex;gap:8px;align-items:center;font-size:.75rem;color:var(--ink-soft)}
.lo-meter .progressbar{flex:1;margin:0}
.lo-links{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.chip{display:inline-block;font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:20px;
 border:1px solid var(--border-2);background:var(--panel);color:var(--ink-soft);cursor:pointer;font-family:inherit;
 max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
/* ---------- formulas / notes styling ---------- */
.formula{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);
 border-radius:4px;padding:10px 14px;margin:10px 0;font-family:var(--mono);font-size:.84rem;
 line-height:1.6;white-space:pre-wrap;overflow-x:auto}
.flow{background:var(--accent-soft);border-radius:6px;padding:10px 14px;margin:10px 0;
 font-family:var(--mono);font-size:.77rem;line-height:1.5;white-space:pre;overflow-x:auto}
.note-note{background:var(--accent-soft);border-radius:6px;padding:9px 12px;margin:10px 0;font-size:.86rem}
.note-note b{color:var(--accent)}
.note-warn{background:var(--bad-soft);border-left:3px solid var(--bad);border-radius:4px;
 padding:9px 12px;margin:10px 0;font-size:.86rem}
.note-warn b{color:var(--bad)}
.note-tip{background:var(--good-soft);border-left:3px solid var(--good);border-radius:4px;
 padding:9px 12px;margin:10px 0;font-size:.86rem}
.note-tip b{color:var(--good)}
.hi{background:var(--warn-soft);padding:0 3px;border-radius:3px;font-weight:600}
.scroll{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;font-size:.82rem;margin:0;min-width:100%}
table.t th,table.t td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--accent-soft);font-weight:700;white-space:nowrap}
table.t td code{white-space:nowrap}
ul.list,ol.list{margin:.5rem 0;padding-left:1.35rem;font-size:.9rem}
ul.list li,ol.list li{margin-bottom:.32rem}
/* ---------- notes view ---------- */
.nb{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
 padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.nb-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
 border-bottom:1px solid var(--border);padding-bottom:7px;margin-bottom:10px}
.nb-h h3{margin:0;font-size:1.02rem;color:var(--accent)}
.nb-page{font-size:.68rem;color:var(--accent);font-weight:700;white-space:nowrap;
 background:var(--accent-soft);padding:3px 9px;border-radius:20px;border:1px solid var(--accent-line)}
/* ---------- numericals ---------- */
.step{background:var(--accent-soft);border-radius:6px;padding:10px 13px;margin:9px 0;font-size:.88rem}
.step b{color:var(--accent)}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 34px;border-bottom:1px dashed var(--border);font-size:.88rem}
ol.steps li:last-child{border-bottom:none}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:50%;
 background:var(--accent-soft);color:var(--accent);font:800 .72rem/24px var(--mono);text-align:center;border:1px solid var(--accent-line)}
.answer{background:var(--good-soft);border:1px solid var(--good-line);color:var(--good);
 border-radius:6px;padding:9px 13px;margin:10px 0;font-weight:700;font-size:.89rem}
.practice{border:1px solid var(--border);border-radius:6px;padding:11px 13px;margin-bottom:9px;background:var(--panel)}
.practice .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.practice .pq{font-size:.89rem;flex:1;min-width:200px}
.solution{display:none;background:var(--accent-soft);border-radius:6px;padding:10px 13px;margin-top:9px;font-size:.87rem;line-height:1.6}
.solution.show{display:block}
/* ---------- quiz ---------- */
.quiz-q{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.quiz-q:last-child{border-bottom:none}
.quiz-opt{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 11px;font-weight:500;line-height:1.45}
.quiz-opt .mk{font-family:var(--mono);font-weight:800;margin-right:7px;font-size:.8rem}
.quiz-opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:700}
.quiz-opt.incorrect{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.quiz-fb{margin-top:9px;font-size:.86rem;padding:9px 12px;border-radius:6px;line-height:1.55}
.quiz-fb.correct{background:var(--good-soft);border-left:3px solid var(--good)}
.quiz-fb.incorrect{background:var(--bad-soft);border-left:3px solid var(--bad)}
/* ---------- coverage table ---------- */
table.cov{width:100%;border-collapse:collapse;font-size:.82rem}
table.cov th,table.cov td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top}
table.cov th{background:var(--accent-soft);font-weight:700}
.ok{color:var(--good);font-weight:800}
.no{color:var(--bad);font-weight:800}
/* ---------- graphs & trees ---------- */
.gwrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
 padding:12px;margin:10px 0;overflow-x:auto}
.gwrap svg{display:block;margin:0 auto;max-width:100%;height:auto;min-width:340px}
.gcap{font-size:.76rem;color:var(--ink-mute);text-align:center;margin-top:8px;
 padding-top:7px;border-top:1px solid var(--border)}
.ge{stroke:var(--border-2);stroke-width:1.8}
.ge.hi{stroke:var(--accent);stroke-width:3.4}
.ge.dim{stroke:var(--border);stroke-width:1.4;opacity:.45}
.gw{fill:var(--panel);stroke:var(--border);stroke-width:1}
.gwt{fill:var(--ink);font:700 11px var(--mono);text-anchor:middle;dominant-baseline:middle}
.gn{fill:var(--panel-2);stroke:var(--border-2);stroke-width:1.8}
.gn.start{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.4}
.gn.goal{fill:var(--good-soft);stroke:var(--good);stroke-width:2.4}
.gn.on{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.6}
.gn.off{opacity:.4}
.gnt{fill:var(--ink);font:700 14px var(--sans);text-anchor:middle;dominant-baseline:middle}
.gh{fill:var(--warn);font:700 11px var(--mono);text-anchor:middle;dominant-baseline:middle}
.gg{fill:var(--accent);font:700 10.5px var(--mono);text-anchor:middle;dominant-baseline:middle}
.tn{fill:var(--panel-2);stroke:var(--border-2);stroke-width:1.8}
.tn.pruned{opacity:.28}
.tl{fill:var(--panel);stroke:var(--border-2);stroke-width:1.6}
.tl.pruned{opacity:.28}
.tlt{fill:var(--ink);font:700 12px var(--mono);text-anchor:middle;dominant-baseline:middle}
.tvt{fill:var(--accent);font:800 12px var(--mono);text-anchor:middle;dominant-baseline:middle}
.te{stroke:var(--border-2);stroke-width:1.8}
.te.pruned{stroke:var(--bad);stroke-width:1.8;stroke-dasharray:5 4}
.trole{fill:var(--ink-mute);font:700 10px var(--mono);text-anchor:start;dominant-baseline:middle}
/* ---------- misc ---------- */
.empty{text-align:center;padding:28px 16px;color:var(--ink-mute);font-size:.88rem;
 border:1px dashed var(--border-2);border-radius:var(--radius);background:var(--panel)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(160%);
 background:var(--ink);color:var(--bg);padding:9px 17px;border-radius:20px;font-size:.85rem;font-weight:600;
 box-shadow:0 4px 18px rgba(0,0,0,.25);z-index:300;transition:transform .28s;max-width:92vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
hr.sep{border:none;border-top:1px solid var(--border);margin:16px 0}
footer{text-align:center;color:var(--ink-mute);font-size:.77rem;padding:26px 16px;line-height:1.7}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent);font-size:1.15rem}
details{border:1px solid var(--border);border-radius:6px;margin:9px 0;background:var(--panel);overflow:hidden}
details>summary{cursor:pointer;padding:8px 12px;font-weight:650;font-size:.87rem;list-style:none;
 background:var(--panel-2);display:flex;align-items:center;gap:7px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";font-size:.75rem;color:var(--ink-mute);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
.dbody{padding:11px 13px;border-top:1px solid var(--border)}
.dbody>*:first-child{margin-top:0} .dbody>*:last-child{margin-bottom:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:680px){
 .brand{font-size:.92rem}
 h1{font-size:1.2rem}
 nav.maintabs button{padding:5px 9px;font-size:.8rem}
 main{padding:14px 12px 60px}
 .count{margin-left:0}
 .toolbar{flex-direction:column;align-items:stretch}
}
@media print{
 header.topbar,.subtabs,.reveal-row,.toolbar,button{display:none!important}
 .qa .a{display:block!important}
 .view{display:block!important}
}
</style>

{id:"m1t2", lo:"LO 1.2", marks:5, priority:"high", src:"Chpt 1 slides 65–66, 71, 75–76",

 a:`<h4>Terminology</h4>
<ul class="list">
<li><b>Performance measure</b> — the criteria determining the success of an agent.</li>
<li><b>Behaviour / action</b> — the action performed after a specified sequence of percepts.</li>
<li><b>Percept</b> — the agent's perceptual inputs at a specified instant.</li>
<li><b>Percept sequence</b> — the history of everything the agent has perceived to date.</li>
<li><b>Agent function</b> — a map from the percept sequence to an action.</li>
</ul>
<div class="formula">a = F(p)          F : P → A

Generally an action may depend on ALL percepts observed:
a&#8342; = F(p&#8320; p&#8321; p&#8322; … p&#8342;)     F : P* → A</div>
<h4>Structure</h4>
<div class="formula">Agent = Architecture + Agent Program</div>
<ul class="list">
<li><b>Architecture</b> — the machinery that the agent executes on.</li>
<li><b>Agent program</b> — an implementation of the agent function.</li>
</ul>
<p>The <b>agent function is an abstract mathematical description</b>; the <b>agent program is the concrete implementation</b> running on the architecture.</p>`,

{id:"m1t5", lo:"LO 1.3", marks:10, priority:"high", src:"Chpt 1 slides 84–95; Notebook A p.3; CIA-01 Section C",
 q:"Classify agents as simple reflex, model-based, goal-based, utility-based and learning agents. Explain each with a diagram and a real example.",
 a:`<h4>1. Simple reflex agent</h4>
<p>The simplest kind. Selects an action based on the <b>current percept, ignoring the rest of the percept history</b>. The percept-to-action mapping is a set of <b>condition–action rules</b>: <code>if {set of percepts} then {set of actions}</code>. e.g. if it is raining then put up umbrella. <b>Example: spam email filter.</b></p>
<p><b>Limitations:</b> intelligence is very limited; works only in a fully observable environment; holds no knowledge of non-perceptual parts of the state; the static rule base is usually too big to generate and store; any change to the environment requires the rules to be updated.</p>
<h4>2. Model-based agent</h4>
<p>Works in a <b>partially observable</b> environment and tracks the situation. Two factors: a <b>Model</b> — knowledge about how things happen in the world; and an <b>Internal State</b> — a representation of the current state based on percept history. Updating the state needs to know how the world evolves and how the agent's action affects the world. <b>Example: Roomba</b> — remembers cleaned area, obstacles, battery level.</p>
<h4>3. Goal-based agent</h4>
<p>Knowledge of the current state is not always enough — the agent needs a <b>goal</b> describing desirable situations. Extends the model-based agent with goal information and chooses actions that achieve the goal. Considering long sequences of possible actions is called <b>searching and planning</b>, which makes the agent proactive. <b>Example: Google Maps</b> — goal: reach the airport.</p>
<h4>4. Utility-based agent</h4>
<p>Like goal-based, but adds a <b>utility measurement</b> — a measure of success at a given state. Acts not only on goals but on the <b>best way</b> to achieve the goal, which matters when there are multiple alternatives. The <b>utility function maps each state to a real number</b>. <b>Example: Uber</b> — chooses fastest / cheapest / safest / least traffic.</p>
<h4>5. Learning agent</h4>
<p>Learns from past experience; starts with basic knowledge and adapts automatically. <b>Four conceptual components:</b></p>
<ul class="list">
<li><b>Learning element</b> — makes improvements by learning from the environment.</li>
<li><b>Critic</b> — gives the learning element feedback on how well the agent is doing against a fixed performance standard.</li>
<li><b>Performance element</b> — selects external actions.</li>
<li><b>Problem generator</b> — suggests actions leading to new and informative experiences.</li>
</ul>
<p><b>Examples: ChatGPT, Netflix, Spotify, YouTube, Tesla FSD.</b></p>`,
 understand:"They form a ladder, each adding exactly one capability: Reflex (current percept) → +memory = Model-based → +goal = Goal-based → +preference between ways of reaching the goal = Utility-based → +improvement over time = Learning. To classify any system, ask two questions: does it remember? and does it compare alternatives?",
 examAnswer:"All five in order. For each: one-line definition, what it adds over the previous type, a labelled block diagram, one real example. The learning agent's four components are almost always asked — name all four. Close with the ladder sentence.",

{id:"m1t6", lo:"LO 1.6", marks:10, priority:"high", src:"Chpt 1 slides 78–83; CIA-01 Section E",
 q:"Identify the types of agent environments. Classify the given task environments across all six properties.",
 a:`<h4>The six property pairs</h4>
<ol class="list">
<li><b>Fully vs Partially observable</b> — fully observable if the sensors detect <i>all aspects relevant to the choice of action</i>. Partial observability comes from noisy, inaccurate or missing sensors. Chess is fully observable; driving is not (what is round the next bend).</li>
<li><b>Deterministic vs Stochastic</b> — deterministic if the next state is completely predictable from the current state and the action. <b>Strategic</b> = deterministic except for the actions of other agents. Tic-Tac-Toe is deterministic; a robot on Mars is stochastic.</li>
<li><b>Episodic vs Sequential</b> — episodic if experience divides into atomic episodes and the choice in each depends only on that episode. Mail sorting is episodic; chess is sequential. Most environments are sequential.</li>
<li><b>Static vs Dynamic</b> — dynamic if the environment can change over time. <b>Other agents make an environment dynamic.</b> Mowing a lawn is static; playing football is dynamic.</li>
<li><b>Discrete vs Continuous</b> — discrete if time moves in fixed steps (chess); continuous if signals arrive constantly and actions change continually (driving).</li>
<li><b>Single vs Multi-agent</b> — multi-agent when other agents are present; may be competitive or co-operative. Human users count as another agent.</li>
</ol>
<div class="scroll"><table class="t"><thead><tr><th>Task environment</th><th>Fully obs.?</th><th>Determ.?</th><th>Episodic?</th><th>Static?</th><th>Discrete?</th><th>Single agent?</th></tr></thead><tbody>
<tr><td>Solitaire</td><td>No</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Backgammon</td><td>Yes</td><td>No</td><td>No</td><td>Yes</td><td>Yes</td><td>No</td></tr>
<tr><td>Taxi driving</td><td>No</td><td>No</td><td>No</td><td>No</td><td>No</td><td>No</td></tr>
<tr><td>Internet shopping</td><td>No</td><td>No</td><td>No</td><td>No</td><td>Yes</td><td>No</td></tr>
<tr><td>Medical diagnosis</td><td>No</td><td>No</td><td>No</td><td>No</td><td>No</td><td>Yes</td></tr>
<tr><td>Crossword puzzle</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
<tr><td>English tutor</td><td>No</td><td>No</td><td>No</td><td>No</td><td>Yes</td><td>No</td></tr>
<tr><td>Image analysis</td><td>Yes</td><td>Yes</td><td>Yes</td><td>No</td><td>No</td><td>Yes</td></tr>
</tbody></table></div>`,
 understand:"The properties are not independent. Other agents make an environment dynamic AND multi-agent, and usually stochastic and partially observable too — which is why taxi driving is No on every single column, and crossword puzzle is Yes on every column. Learn those two rows as anchors and you can reason out the rest.",
 examAnswer:"All six pairs with a one-line definition and one example each, then the classification table for 3–4 task environments. If the question names specific systems (chess, Google Maps, self-driving car, robot vacuum, smart traffic), build the table for those instead.",
 mistakes:"Calling an environment partially observable just because it is large — it is about whether sensors capture what is RELEVANT TO THE ACTION CHOICE. Marking taxi driving as discrete (both time and the steering values are continuous). Classifying medical diagnosis as multi-agent — the slide table lists it as single agent."},

{id:"m1t7", lo:"LO 1.1", marks:5, priority:"high", src:"Chpt 1 slides 46–52; Notebook A p.2",
 q:"Apply the categorization of intelligent systems: explain the four approaches to AI and say which one modern AI follows.",
 a:`<div class="scroll"><table class="t"><thead><tr><th></th><th>Humanly</th><th>Rationally</th></tr></thead><tbody>
<tr><td><b>Thinking</b></td><td>Systems that <b>think like humans</b> — cognitive modelling</td><td>Systems that <b>think rationally</b> — laws of thought</td></tr>
<tr><td><b>Acting</b></td><td>Systems that <b>act like humans</b> — the Turing Test approach</td><td>Systems that <b>act rationally</b> — the rational agent</td></tr>
</tbody></table></div>
<p><b>1. Acting humanly — the Turing Test.</b> A human interrogator cannot tell whether the responses come from a human or an AI, via teletype. To pass it needs <b>natural language processing, knowledge representation, automated reasoning and machine learning</b>; the total test adds <b>computer vision</b> (to perceive objects) and <b>robotics</b> (to move objects).</p>
<p><b>2. Thinking humanly — cognitive modelling.</b> Humans as observed from the inside. How do we know how humans think? Introspection vs psychological experiments. This is Cognitive Science.</p>
<p><b>3. Thinking rationally — laws of thought.</b> Rationality defined through logic. Two problems: humans are not always rational, and logic cannot express everything (e.g. uncertainty). The logical approach is often computationally infeasible and needs guidance.</p>
<p><b>4. Acting rationally — the rational agent.</b> Doing the right thing: that which is expected to <b>maximise goal achievement given the available information</b>. Giving answers to questions is itself acting. Logic is only part of a rational agent, not all of rationality.</p>
<p><b>Modern AI, and this whole course, adopts approach 4.</b> Everything in Module 2 (search, heuristics, optimisation) and Module 3 (knowledge, reasoning) is machinery for an agent that acts rationally.</p>`,
 understand:"Memory hook: T-C-L-R — Turing, Cognitive, Laws of thought, Rational agent. Two axes, thinking vs acting and humanly vs rationally, giving a 2×2 grid.",
 examAnswer:"Draw the 2×2 table first, then one short paragraph per approach, then the closing line that modern AI adopts 'acting rationally'. That closing line is the 'distinguish' half of the learning outcome.",
 mistakes:"Describing only the Turing Test and stopping — the question asks for all four. Saying the Turing Test needs consciousness (it only needs indistinguishable behaviour). Confusing 'thinking rationally' (logic) with 'acting rationally' (maximising performance)."},

{id:"m1t8", lo:"LO 1.5", marks:5, priority:"high", src:"Chpt 1 slides 96–102; CIA-01 Section F",
 q:"Compare Traditional AI and Agentic AI on autonomy, memory, tool usage and goal orientation.",

<tr><td><b>Autonomy</b></td><td>Reactive · requires continuous user input</td><td>Proactive · acts autonomously within permissions</td></tr>
<tr><td><b>Memory</b></td><td>Limited memory</td><td>Maintains context</td></tr>
<tr><td><b>Tool usage</b></td><td>Limited tool usage · no planning</td><td>Uses APIs, browsers, databases · plans tasks</td></tr>
</tbody></table></div>
<p><b>The worked contrast from the lecture.</b> Prompt: <i>"Plan my Goa trip."</i><br>
<b>Traditional (ChatGPT):</b> returns an itinerary.<br>
<b>Agentic AI:</b> finds flights → compares hotels → checks weather → books the hotel (with approval) → adds the itinerary to the calendar → sends a confirmation email.</p>
<p>In the lecture's phrase: <b>Agentic AI doesn't just answer — it acts.</b></p>`,
 understand:"Test any system with one question: does it finish the job, or does it hand you instructions? A system that only produces text is traditional; one that calls tools and changes the world is agentic. Note the qualifier 'within permissions' — the slides do not claim agents act without any approval.",
 examAnswer:"The four axes named in the learning outcome ARE your answer skeleton — autonomy, memory, tool usage, goal orientation. Build the table on exactly those rows, then close with the Goa-trip contrast.",
 mistakes:"Saying agentic AI is 'just a bigger model'. The distinguishing feature is autonomous multi-step action with tools, not model size or speed. Writing the comparison as prose instead of a table wastes time."},

{id:"m1t9", lo:"LO 1.3", marks:5, priority:"high", src:"Chpt 1 slide 113 class activity",
 q:"Identify the agent type for each and justify: Google Maps, Uber, ChatGPT, Tesla FSD, a chess AI, a robot vacuum.",
 a:`<div class="scroll"><table class="t"><thead><tr><th>System</th><th>Agent type</th><th>Justification</th></tr></thead><tbody>
<tr><td>Robot vacuum (Roomba)</td><td><b>Model-based</b></td><td>Maintains an internal state — remembers cleaned area, obstacles, battery level — so it works in a partially observable room.</td></tr>
<tr><td>Google Maps</td><td><b>Goal-based</b></td><td>Given the goal 'reach the airport' it searches and plans a sequence of actions to achieve it.</td></tr>
<tr><td>Uber</td><td><b>Utility-based</b></td><td>Multiple routes and drivers all reach the goal; it uses a utility measure to choose fastest / cheapest / safest / least traffic.</td></tr>
<tr><td>Chess AI</td><td><b>Goal-based / utility-based</b></td><td>Goal is checkmate; it uses an evaluation (utility) function over states to choose between many legal moves.</td></tr>
<tr><td>ChatGPT</td><td><b>Learning</b></td><td>Improves continuously from data; the lecture lists it under learning agents.</td></tr>
<tr><td>Tesla FSD</td><td><b>Learning</b></td><td>Also listed under learning agents — continuously improves driving behaviour from fleet data.</td></tr>
</tbody></table></div>`,
 understand:"The justification is worth more than the label. Always name the capability that forces the classification: memory forces model-based, an explicit goal forces goal-based, a choice between several goal-reaching options forces utility-based, improvement over time forces learning.",
 examAnswer:"A three-column table: System | Agent type | Justification. One line of justification each. Never give the label without the reason.",

{id:"m1t11", lo:"LO 1.2", marks:5, priority:"medium", src:"Chpt 1 slides 67–70",
 q:"Describe the vacuum-cleaner world and tabulate its agent function.",
 a:`<p>Two locations, squares <b>A</b> and <b>B</b>. The agent perceives which square it is in and whether there is dirt there. It can move left, move right, suck dirt, or do nothing.</p>
<ul class="list">
<li><b>Percepts:</b> location and status, e.g. <code>[A, Dirty]</code></li>
<li><b>Actions:</b> Left, Right, Suck, NoOp</li>
<li><b>Performance measure:</b> all the rooms are well cleaned</li>
<li><b>Agent function:</b> mapping of percept sequence to an action</li>
</ul>
<p>Simplest agent function: <i>if the current square is dirty then suck; otherwise move to the other square.</i></p>
<div class="scroll"><table class="t"><thead><tr><th>Percept sequence</th><th>Action</th></tr></thead><tbody>
<tr><td>[A, Clean]</td><td>Right</td></tr><tr><td>[A, Dirty]</td><td>Suck</td></tr>
<tr><td>[B, Clean]</td><td>Left</td></tr><tr><td>[B, Dirty]</td><td>Suck</td></tr>
<tr><td>[A, Dirty], [A, Clean]</td><td>Right</td></tr><tr><td>[A, Clean], [B, Dirty]</td><td>Suck</td></tr>
<tr><td>[B, Dirty], [B, Clean]</td><td>Left</td></tr><tr><td>[B, Clean], [A, Dirty]</td><td>Suck</td></tr>
<tr><td>[A, Clean], [B, Clean]</td><td>NoOp</td></tr><tr><td>[B, Clean], [A, Clean]</td><td>NoOp</td></tr>
</tbody></table></div>`,
 understand:"Look at the last two rows. Only once the agent has seen that BOTH squares are clean can it justify doing nothing. A pure reflex agent seeing only [A, Clean] cannot output NoOp — it has no way to know about B. That single observation is the whole argument for why memory (a model-based agent) is needed.",
 examAnswer:"Environment description, then percepts / actions / performance measure, then the rule, then 6–10 rows of the table. Add the NoOp observation as your closing insight.",
 mistakes:"Writing the percept as just the location — it is the pair [location, status]. Forgetting NoOp as a legal action. Tabulating single percepts when the question says percept SEQUENCES."},

<p><b>The test to state in your answer:</b> AI systems <b>perceive → reason → decide → act</b>. Something that follows a fixed procedure with no perception and no choice is automation, not AI.</p>`,

{id:"m2t1", lo:"LO 2.1", marks:5, priority:"high", src:"Chpt 2 slides; Notebook A p.4",
 q:"Explain problem formulation. What are the components of a well-defined problem?",
 a:`<p><b>Problem solving</b> is the way in which an agent finds a sequence of actions that achieves its goals, when no single action will do.</p>
<div class="formula">Formulate  →  Search  →  Execute</div>
<h4>Structure of a problem-solving agent (Notebook A, p.4)</h4>
<ol class="list"><li>Goal state</li><li>Action</li><li>Goal formulation</li><li>Problem formulation</li></ol>
<div class="note-note"><b>Why formulate?</b> The class notes answer this in three words: <b>for searching</b>. A search algorithm cannot run until the problem has been reduced to states, actions, an initial state and a goal test.</div>
<h4>Components of a well-defined problem</h4>
<ul class="list">
<li><b>Initial state</b> — where the agent starts.</li>
<li><b>Actions / operators</b> — what can be done in each state.</li>
<li><b>Transition model</b> — the state resulting from doing an action.</li>
<li><b>Goal test</b> — whether a state is a goal. <b>There can be multiple goal states.</b></li>
<li><b>Path cost</b> — a numeric cost for each path.</li>
</ul>
<p><b>State-space representation</b> = the initial state plus every state reachable from it by any sequence of actions.</p>`,
 understand:"All of Module 2 is: turn a messy real problem into a graph, then run a graph algorithm on it. Problem formulation is the 'turn it into a graph' step — and it is where marks are lost, because students jump straight to drawing the search tree.",
 examAnswer:"Definition → the three phases → the five components as a labelled list → instantiate all five for one concrete example (water jug or 8-puzzle). Even if the rest of the question goes wrong, the formulation earns marks on its own.",
 mistakes:"Giving a goal STATE but no goal TEST — with multiple goal states you must state the test. Skipping path cost, which is what makes 'optimal' meaningful later. Confusing goal formulation (choosing the goal) with problem formulation (choosing states and actions)."},

{id:"m2t2", lo:"LO 2.2", marks:10, priority:"high", src:"Chpt 2 uninformed slides 20, 52–54; Notebook A p.5–6",
 q:"Compare the uninformed search strategies BFS, DFS and IDS on completeness, optimality, time and space complexity.",
 a:`<div class="note-note"><b>Uninformed (blind) search</b> has no information except the problem statement itself. <b>Informed search</b> knows where to look for the solution.</div>
<h4>The four evaluation criteria (Notebook A, p.5)</h4>
<ol class="list"><li>Completeness</li><li>Time complexity</li><li>Space complexity</li><li>Optimality</li></ol>
<p><b>b</b> = maximum branching factor of the search tree · <b>d</b> = depth of the goal node (least-cost solution) · <b>m</b> = maximum depth of the tree state space (may be ∞)</p>
<div class="scroll"><table class="t"><thead><tr><th>Criterion</th><th>BFS</th><th>DFS</th><th>DLS</th><th>IDS</th></tr></thead><tbody>
<tr><td><b>Data structure</b></td><td>Queue (FIFO)</td><td>Stack (LIFO)</td><td>Stack + limit ℓ</td><td>Repeated DLS</td></tr>
<tr><td><b>Complete?</b></td><td>Yes (b finite)</td><td>No</td><td>No (if ℓ &lt; d)</td><td><b>Yes</b></td></tr>
<tr><td><b>Optimal?</b></td><td>Yes, if step costs equal</td><td>No</td><td>No</td><td><b>Yes, if step costs equal</b></td></tr>
<tr><td><b>Time</b></td><td>O(b<sup>d</sup>)</td><td>O(b<sup>m</sup>)</td><td>O(b<sup>ℓ</sup>)</td><td>O(b<sup>d</sup>)</td></tr>
<tr><td><b>Space</b></td><td>O(b<sup>d</sup>)</td><td><b>O(bm)</b></td><td>O(bℓ)</td><td><b>O(bd)</b></td></tr>
</tbody></table></div>
<h4>Notes from class</h4>
<ul class="list">
<li><b>BFS</b> — enqueues nodes in FIFO order. The <b>shallowest solution is found first</b>. Will take a long time on solutions with many steps because it must examine all shorter possibilities first.</li>
<li><b>DFS</b> — worst case when m ≫ d. Its advantage is that it <b>occupies less space</b>.</li>
<li><b>Depth-limited search</b> — depth-first search with a depth limit ℓ.</li>
<li><b>IDS</b> — takes from BFS the quality of ensuring the shallowest solution is found, and the tree is searched in DFS manner. All data at every level is discarded after that level is visited. Time expands as d(b) + (d−1)b² + (d−2)b³ + … + (1)b<sup>d</sup>.</li>
</ul>`,
 understand:"IDS re-does work but wins anyway. Re-expanding the shallow levels costs almost nothing because the number of nodes at depth d dominates the whole tree — so IDS gets BFS's guarantees at DFS's memory cost. That is why it is preferred for large state spaces where the solution depth is unknown.",
 examAnswer:"Define uninformed vs informed, give b/d/m, then the comparison table — the table IS the answer. Add one line per algorithm on the data structure, and close with why IDS is preferred when the solution depth is unknown.",
 mistakes:"Writing BFS space as O(bd). It is O(b^d) — EXPONENTIAL. Only IDS has linear O(bd) space. This one is worth double-checking in the exam. Also: BFS is optimal only when step costs are equal."},

{id:"m2t3", lo:"LO 2.3", marks:5, priority:"high", src:"Chpt 2 informed slides 2, 12–15; Notebook B p.1",
 q:"What is a heuristic function? When is it admissible? Illustrate with the 8-puzzle.",
 a:`<p>A <b>heuristic</b> is a rule of thumb or intelligent estimate that guides the search towards the goal quickly. <b>h(n)</b> estimates the remaining cost from node n to the goal.</p>
<ul class="list"><li>Smaller h(n) → the node appears <b>closer</b> to the goal.</li><li>Larger h(n) → the node appears <b>farther</b>.</li></ul>
<div class="formula">Admissible:   h(n) ≤ h*(n)   for every node n

where h*(n) is the TRUE cost to reach the goal from n.</div>
<p>An admissible heuristic <b>never overestimates</b> — it is optimistic. Consequence: f(n) never overestimates the true cost of a solution through n, since g(n) is exact.</p>
<p><b>Example:</b> straight-line distance never overestimates road distance, because the shortest path between two points is a straight line.</p>
<h4>8-puzzle heuristics</h4>
<ul class="list">
<li><b>h₁(n)</b> = number of misplaced tiles → for the standard start state, <b>h₁(S) = 8</b></li>
<li><b>h₂(n)</b> = total Manhattan distance, the sum of the distances of tiles from their goal positions → <b>h₂(S) = 3+1+2+2+2+3+3+2 = 18</b></li>
</ul>
<h4>Relaxed problems</h4>
<p>A problem with fewer restrictions on the actions is a <b>relaxed problem</b>. The cost of an optimal solution to a relaxed problem is an admissible heuristic for the original, because the optimal solution in the original is also a solution in the relaxed problem and must be at least as expensive. Relax so a tile can move anywhere → h₁. Relax so a tile can move to any adjacent square → h₂.</p>`,
 understand:"Admissibility is the safety property that makes A* trustworthy. If h ever OVERestimates, A* can reject the true optimal path because it looks too expensive, and silently returns a worse answer. The relaxed-problem idea is how you INVENT a heuristic instead of guessing: delete a rule, solve what is left, use that cost — since you deleted a constraint the answer can only be smaller, which is exactly admissibility.",
 examAnswer:"Definition of h(n) → the admissibility inequality → why it matters (guarantees A* optimality) → straight-line-distance example → the two 8-puzzle heuristics with their numeric values → relaxed-problem justification for the last mark.",
 mistakes:"Writing h(n) ≥ h*(n) — admissible means never OVERestimates, so h(n) ≤ h*(n). Saying an admissible heuristic makes A* faster: it makes A* OPTIMAL; a more informed (larger but still admissible) heuristic makes it faster. Computing Manhattan distance diagonally — it is |Δrow| + |Δcol|."},

{id:"m2t4", lo:"LO 2.3", marks:5, priority:"high", src:"Chpt 2 informed slides 3–11; Notebook B p.1",
 q:"Explain best-first and greedy best-first search. Why is greedy neither complete nor optimal?",
 a:`<h4>Best-first search</h4>
<p>Use an evaluation function <b>f(n)</b> to select the node for expansion — an estimate of desirability. Expand the most desirable unexpanded node. <b>Implementation:</b> order the nodes in the fringe in decreasing order of desirability.</p>
<h4>Greedy best-first search</h4>
<div class="formula">f(n) = h(n)</div>
<p>Expands the node that <b>appears</b> to be closest to the goal. For the Romania map, h<sub>SLD</sub>(n) is the straight-line distance to Bucharest. Note that h<sub>SLD</sub> <b>cannot be computed from the problem description itself</b> — it takes experience to know it correlates with road distance.</p>
<h4>Properties</h4>
<ul class="list">
<li><b>Complete?</b> No — it can get stuck in loops, e.g. Iasi → Neamt → Iasi → Neamt …</li>
<li><b>Optimal?</b> No — the path through Fagaras is not the shortest.</li>
<li><b>Time:</b> O(b<sup>m</sup>), but a good heuristic gives dramatic improvement.</li>
<li><b>Space:</b> O(b<sup>m</sup>) — keeps all nodes in memory.</li>
</ul>
<div class="note-warn"><b>The one-line reason greedy fails:</b> it ignores g(n) — the cost already paid. A* fixes exactly this.</div>
<h4>The three evaluation functions, side by side</h4>
<div class="formula">Uniform-cost  orders by backward cost:   f(n) = g(n)
Greedy        orders by goal proximity:  f(n) = h(n)
A*            orders by the sum:         f(n) = g(n) + h(n)</div>`,
 understand:"Greedy is 'always walk towards the goal' with no memory of what the journey has cost so far. It is fast and often wrong — exactly like driving towards a destination by always taking the road that points at it, and ending up at a river with no bridge.",
 examAnswer:"Best-first idea → greedy's f(n) = h(n) → the four properties with the Iasi–Neamt loop and Fagaras examples → the closing line that it ignores g(n), which A* corrects. Include the three-way f(n) comparison if there is room.",
 mistakes:"Writing f(n) = g(n) + h(n) for greedy — that is A*. Confusing greedy with uniform-cost search (which orders by g alone)."},

{id:"m2t5", lo:"LO 2.3", marks:5, priority:"high", src:"Chpt 2 informed slide 30; Notebook A p.9",
 q:"Prove that A* returns the optimal solution when the heuristic is admissible.",
 a:`<p><b>Theorem.</b> If the heuristic h(n) is admissible (never overestimates the remaining cost), then A* always finds the optimal path.</p>
<p>Let <b>G</b> = optimal goal with optimal cost <b>C*</b>, and <b>G₂</b> = a suboptimal goal (cost higher than C*).</p>
<div class="formula">Step 1.  G₂ is not optimal, and h = 0 at any goal, so
         f(G₂) = g(G₂) &gt; C*

Step 2.  Let n be a node still in OPEN that lies on the optimal
         path. Because h is admissible,
         f(n) = g(n) + h(n) ≤ C*

Step 3.  Combining,
         f(n) ≤ C* &lt; f(G₂)

Step 4.  A* always expands the node with the smallest f-value.
         Since f(n) &lt; f(G₂), A* expands n BEFORE G₂.</div>
<p><b>Conclusion.</b> By repeatedly expanding such nodes, A* reaches the optimal goal G before it can ever choose the suboptimal goal G₂. Therefore A* always returns the optimal solution if h(n) is admissible. ∎</p>`,
 understand:"Everything hinges on Step 2. If h could overestimate, f(n) might exceed C*, the optimal path's node would be pushed behind G₂ in the queue, and A* would return the worse goal. The lecture's intuition: A* keeps comparing distance already travelled with estimated distance remaining, and as long as some route has a lower estimated total it keeps exploring that route.",
 examAnswer:"State the theorem, define G, C* and G₂, then the three-line inequality chain, then the conclusion. The three lines ARE the proof — do not pad around them.",
 mistakes:"Stating the theorem without the inequality chain. Forgetting to say h(G₂) = 0, which is why f(G₂) = g(G₂)."},

{id:"m2t6", lo:"LO 2.4", marks:10, priority:"high", src:"Chpt 2 informed slides 31–40; Notebook A p.9–10",
 q:"Apply analytical reasoning to hill climbing: draw the landscape, name its problems and explain its four variants.",
 a:`<h4>Local search</h4>
<p>In many optimization problems <b>the path to the goal is irrelevant; the goal state itself is the solution</b>. The state space is a set of complete configurations and we must find one satisfying the constraints — e.g. <b>n-queens</b>. Local search keeps a single current state and tries to improve it.</p>
<h4>Hill climbing</h4>
<p>The lecture's description: <i>"like climbing Everest in thick fog with amnesia."</i> Move continually towards increasing value; stop when no neighbour is better.</p>
<h4>The three problems</h4>
<ol class="list">
<li><b>Local optima</b> — gets stuck where no neighbour is better, even though a higher global optimum exists elsewhere. It may miss the global optimum if it starts near a local one.</li>
<li><b>Plateau</b> — on flat regions where the function has a constant value, all neighbours look the same, so it cannot make progress.</li>
<li><b>Ridges and valleys</b> — sensitive to the initial starting point; starting on a ridge it may follow the ridge without reaching the optimum.</li>
</ol>
<h4>The four variants (Notebook A, p.10)</h4>
<ol class="list">
<li><b>Simple hill climbing</b> — generates <b>one neighbour only</b>, moves as soon as the neighbour's value is uphill, and does not check the rest.</li>
<li><b>Steepest-ascent hill climbing</b> — <b>generates all</b> neighbours, compares their heuristic values, moves to the best.</li>
<li><b>Stochastic hill climbing</b> — generates all, identifies the <b>uphill (better)</b> neighbours and picks one at random; greater improvement means higher probability of selection. It <b>never chooses a worse neighbour</b>.</li>
<li><b>Random-restart hill climbing</b> — runs the algorithm multiple times, each from a <b>different randomly generated initial state</b>; if one run gets stuck it restarts, until the goal is found or the maximum restarts are reached.</li>
</ol>
<h4>8-queens</h4>
<p><b>h = the number of pairs of queens attacking each other</b>, directly or indirectly. The slide state has h = 17; hill climbing reaches a <b>local minimum with h = 1</b> and gets stuck.</p>`,
 understand:"Remember the variants by what each one fixes: simple (fast, weakest) → steepest-ascent (looks at all neighbours) → stochastic (adds randomness to escape) → random-restart (the only one that reliably beats local optima).",
 examAnswer:"The class notes annotate this topic with 'diagram + naming the problems to overcome + the variants' — so that is literally the marking scheme. Draw and LABEL the landscape, name the three problems, then the four variants with one line each, then the 8-queens h example.",
 mistakes:"Saying stochastic hill climbing can accept a worse neighbour — it cannot; only simulated annealing does. Confusing a plateau (flat, neighbours equal) with a local maximum (a peak, neighbours lower). Drawing the landscape without labels — the labels ARE the marks.",
 diagram:"Essential. Draw a wavy curve over a 'state space' x-axis and an 'objective function' y-axis, and label four features: shoulder, local maximum, flat local maximum (plateau) and global maximum. Mark a dot as 'current state'."},

{id:"m2t7", lo:"LO 2.4", marks:10, priority:"high", src:"Chpt 2 informed slides 41–49; Notebook A p.10",
 q:"Explain simulated annealing: the analogy, the acceptance rule, and its stopping criteria.",
 a:`<h4>The physical analogy</h4>
<p>Named after <b>physical annealing in solids</b>. A crystalline solid is heated then allowed to cool <b>very slowly</b> until it reaches its most regular crystal lattice configuration — its minimum lattice energy state — free of defects. If the cooling schedule is slow enough the final configuration has superior structural integrity; fast cooling induces a fragile structure.</p>
<div class="scroll"><table class="t"><thead><tr><th>Thermodynamic simulation</th><th>Optimization</th></tr></thead><tbody>
<tr><td>System states</td><td>Solutions</td></tr><tr><td>Energy</td><td>Cost</td></tr>
<tr><td>Change of state</td><td>Neighbouring solutions</td></tr>
<tr><td>Temperature</td><td>Control parameter T</td></tr>
<tr><td>Frozen state</td><td>Heuristic solution</td></tr>
</tbody></table></div>
<h4>The idea and the acceptance rule</h4>
<p><b>Escape local maxima by allowing some bad moves, but gradually decrease their frequency.</b> At the start bad moves are allowed very frequently; towards the end fewer bad moves are allowed. At every step compute <b>ΔE</b>:</p>
<div class="formula">ΔE &gt; 0  (positive)  →  neighbour is a GOOD move  →  accept unconditionally
ΔE &lt; 0  (negative)  →  neighbour is BAD       →  accept with probability

                        P = e^(ΔE / T)</div>
<p>As T decreases this probability shrinks towards zero, so late in the run the algorithm behaves like plain hill climbing.</p>
<h4>Stopping criteria — the notes call these out separately</h4>
<ol class="list">
<li>A given <b>minimum value of the temperature</b> has been reached.</li>
<li>A certain number of iterations has passed <b>without acceptance of a new solution</b>.</li>
<li>A specified number of <b>total iterations</b> has been executed.</li>
</ol>
<h4>Properties</h4>
<ul class="list">
<li>A <b>global</b> optimization technique; it distinguishes between different local optima.</li>
<li>SA is <b>memoryless</b> — it does not use any information gathered during the search.</li>
<li><b>If T decreases slowly enough, SA finds a global optimum with probability approaching 1.</b></li>
<li>Widely used in VLSI layout, airline scheduling.</li>
</ul>`,
 understand:"In one line: hill climbing never goes downhill so it gets trapped; simulated annealing goes downhill sometimes so it can escape — and it does this less and less as it cools, so it eventually settles.",
 examAnswer:"The MSE list in the class notes says 'simulated annealing (theory — stopping criteria)', so the stopping criteria are all but guaranteed to be asked. Structure: analogy → correspondence table → the ΔE acceptance rule with the formula → the THREE stopping criteria → properties (global, memoryless, probability-1 condition) → applications.",
 mistakes:"Omitting the stopping criteria — the notes flag them specifically. Saying SA always accepts bad moves (it accepts them WITH PROBABILITY e^(ΔE/T)). Calling SA memory-based — the slides say memoryless. Forgetting that T must decrease SLOWLY for the probability-1 guarantee."},

{id:"m2t8", lo:"LO 2.4", marks:10, priority:"high", src:"Chpt 2 informed slides 50–57; Notebook A p.11",
 q:"Explain the genetic algorithm: terminology, operators, roulette-wheel selection and convergence criteria.",
 a:`<p>Developed by <b>John Holland</b>, University of Michigan, in the 1970s. The idea comes from genetics and natural selection — <i>select the best, leave the rest</i>; <i>survival of the fittest</i>. Used to generate high-quality solutions for optimization problems, and is <b>better for large state spaces</b>.</p>
<h4>Terminology</h4>
<ul class="list">
<li><b>Population</b> — the state space.</li>
<li><b>Individual</b> — a possible solution, represented as a string over a finite alphabet (often binary).</li>
<li><b>Fitness function</b> — the evaluation function; higher values for better states. It plays the role of the heuristic function.</li>
<li><b>Selection</b> — choosing individuals for reproduction.</li>
<li><b>Crossover</b> — generating new states by combining two parents.</li>
<li><b>Mutation</b> — generating a new state by mutating a gene.</li>
</ul>
<p>Crossovers and mutations bring <b>diversity</b> into the population.</p>
<h4>The algorithm</h4>
<div class="formula">initialize population;
evaluate population;
while (Termination Criteria Not Satisfied) {
    select parents for reproduction;
    perform crossovers and mutation;
    evaluate population;
}</div>
<h4>Roulette-wheel selection</h4>
<p>Individuals get a probability of being selected <b>directly proportional to their fitness</b> — more area on the wheel means more chance. Two individuals are then chosen randomly on these probabilities and produce offspring.</p>
<div class="formula">Fitness  ∝  Area  ∝  Selection probability</div>
<p><b>8-queens example:</b> fitness = number of <b>non-attacking</b> pairs of queens. With individuals scoring 24, 23, 20 and 11, the selection probabilities are 24/(24+23+20+11) = 31%, 23/78 = 29%, and so on.</p>
<h4>Convergence (stopping) criteria</h4>
<ul class="list"><li>Manual checking</li><li>The solution found does not satisfy the objective function</li><li>Reached the set number of iterations</li><li>Budget limit reached (time or space)</li></ul>`,
 understand:"The three operators do three different jobs and confusing them costs marks. Selection decides WHO reproduces — it applies the pressure towards fitness. Crossover combines two parents — it EXPLOITS good building blocks already found. Mutation changes one gene at random — it EXPLORES, preventing premature convergence. GAs are local search with a population instead of a single current state, which is why they cope with large state spaces.",
 examAnswer:"Origin → terminology → pseudocode → the three operators and what each contributes → roulette wheel with the 8-queens percentages worked out → the four convergence criteria.",
 mistakes:"Saying the fitness function is minimised — higher fitness is better here. Swapping crossover (two parents) and mutation (one gene). Describing roulette selection as 'pick the two best' — it is probabilistic, so a weak individual can still be selected, which is what preserves diversity."},

{id:"m2t9", lo:"LO 2.5", marks:10, priority:"high", src:"Chpt 2 informed slides 58–64; Notebook A p.11 (marked '10 marks')",
 q:"Explain adversarial search and the minimax algorithm.",
 a:`<div class="note-note"><b>The class notes write “★ 10 marks” directly beside adversarial search.</b> Treat this as a full-length answer.</div>
<h4>Adversarial search</h4>
<p>Competitive environments in which agents' goals are in conflict give rise to adversarial search problems, often known as <b>games</b>. There exists an opponent who always has an optimal move and according to that we decide how to move. It is <b>multi-agent</b>.</p>
<p><b>Zero-sum games of perfect information</b> — deterministic, fully observable environments in which two agents act alternately and the utility values at the end are always <b>equal and opposite</b>. If one player wins, the other necessarily loses.</p>
<p><b>Why games interest AI researchers:</b> the state of a game is easy to represent, and agents are restricted to a small number of actions whose outcomes are defined by precise rules. Physical games are complex by comparison.</p>
<p>Chess has an average branching factor of about <b>35</b> and games often run 50 moves per player, giving a tree of roughly <b>35¹⁰⁰ ≈ 10¹⁵⁴ nodes</b>. Pruning lets us ignore portions that make no difference to the final choice, and heuristic evaluation functions let us approximate the true utility without a complete search.</p>
<h4>Game playing as a search problem</h4>
<div class="scroll"><table class="t"><tbody>
<tr><td><code>S₀</code></td><td>Initial state / starting configuration</td></tr>
<tr><td><code>PLAYER(s)</code></td><td>Player whose turn it is in state s</td></tr>
<tr><td><code>ACTIONS(s)</code></td><td>Legal moves available in state s</td></tr>
<tr><td><code>RESULT(s,a)</code></td><td>State obtained after performing action a</td></tr>
<tr><td><code>TERMINAL-TEST(s)</code></td><td>Checks whether the game has ended</td></tr>
<tr><td><code>UTILITY(s,p)</code></td><td>Numerical payoff of terminal state s for player p</td></tr>
</tbody></table></div>
<h4>Minimax</h4>
<ul class="list">
<li>A <b>ply</b> is one move by one player.</li>
<li><b>MAX nodes</b> (△) choose the <b>highest</b> value; <b>MIN nodes</b> (▽) choose the <b>lowest</b>. Terminal nodes (□) hold utilities <b>from MAX's perspective</b>.</li>
<li>Values are propagated <b>bottom-up</b>. Minimax uses <b>DFS</b> and starts from the bottom.</li>
</ul>
<div class="note-note"><b>Minimax principle:</b> MAX chooses its best move assuming that MIN will always make the best possible counter-move.</div>
<p><b>Tic-Tac-Toe:</b> empty 3×3 board, MAX (X) moves first with 9 options, players alternate, terminal when three-in-a-row or the board is full. Utilities from MAX's perspective: <b>+1</b> MAX wins, <b>0</b> draw, <b>−1</b> MIN wins.</p>
<p><b>Properties:</b> complete (finite tree) · optimal against an optimal opponent · time O(b<sup>m</sup>) · space O(bm), since it is a depth-first search.</p>`,
 understand:"Work strictly bottom-up and write the value ABOVE each node as you compute it. At a △ take the max of its children, at a ▽ take the min. The root value is what MAX can guarantee against perfect play, and the child that produced it is the move MAX should play. Sanity check: the root value must equal one of the leaf values.",
 examAnswer:"Definition of adversarial search and zero-sum perfect information → the six-element game formulation table → the minimax principle → a worked two-ply tree with every node annotated → properties → close with the chess branching-factor figures to motivate pruning.",
 mistakes:"Applying max at a MIN node — track the triangle direction. Computing top-down instead of bottom-up. Assigning utilities from MIN's perspective — they are always from MAX's. Reporting a leaf value instead of the root value."},

{id:"m2t10", lo:"LO 2.5", marks:5, priority:"high", src:"Chpt 2 informed slide 65; Notebook A p.11, Notebook B p.6",
 q:"Explain alpha–beta pruning. State the pruning condition and what α and β mean.",
 a:`<p><b>The problem with minimax:</b> it may examine an exponential number of game states as search depth increases. The class notes put it as: <i>minimax searches the entire tree, hence we use α–β pruning.</i></p>
<p>Alpha–beta pruning eliminates branches that <b>cannot affect the final decision</b>. It produces the <b>same optimal move</b> as minimax but searches fewer nodes. Since minimax uses depth-first search, α and β are maintained along the current search path.</p>
<div class="scroll"><table class="t"><thead><tr><th></th><th>α (alpha)</th><th>β (beta)</th></tr></thead><tbody>
<tr><td><b>Belongs to</b></td><td>MAX</td><td>MIN</td></tr>
<tr><td><b>Meaning</b></td><td>Best (highest) value MAX has found so far</td><td>Best (lowest) value MIN has found so far</td></tr>
<tr><td><b>Wants to</b></td><td>Increase</td><td>Decrease</td></tr>
<tr><td><b>Initial value</b></td><td>−∞</td><td>+∞</td></tr>
</tbody></table></div>
<div class="formula">Pruning condition:   α ≥ β   ⇒   PRUNE</div>
<p>Once α ≥ β, the remaining branches at that point cannot influence the final minimax decision, so there is no need to explore them.</p>
<div class="note-note"><b>Symbols:</b> △ = MAX · ▽ = MIN · □ = utilities. <b>For MAX, update alpha. For MIN, update beta.</b> (Notebook B, p.7)</div>
<div class="formula">Minimax   = correct decision
Alpha-Beta = same correct decision + fewer nodes explored</div>`,
 understand:"Why pruning is safe: at a MIN node, once MIN has found an option worth LESS than something MAX can already guarantee elsewhere (β ≤ α), MAX will never choose to enter this MIN node at all. So whatever is in the remaining branches is irrelevant — MIN can only make it worse, and it is already too bad to be chosen.",
 examAnswer:"State the problem with minimax → define α and β with the four-row table → the α ≥ β condition → the 'update α at MAX, β at MIN' rule → close with the minimax-equivalence line. If a tree is given, annotate every node.",
 mistakes:"Updating β at a MAX node or α at a MIN node. Pruning on α > β only — the condition is α ≥ β, and equality DOES prune. Claiming alpha–beta gives a different answer from minimax — it gives the identical decision."}
];
