<div class="note"><span class="note-t">Diagram</span>Draw the components diagram: Environment at the top, Agents in the middle, Communication and Collaboration below, with bidirectional labelled arrows.</div>`,
 mistakes:[`Using 'decentralised' and 'distributed' as synonyms. Decentralised agents plan alone; distributed agents plan alone but coordinate their plans by communicating.`]},

{id:"m4t14", title:"Prolog and Rule-Based Expert Systems", type:"theory",
 priority:"medium", core:false, marks:[5], src:"Chpt 4 Uncertainty slides 24–30",
 tags:["prolog","rule-based","expert","systems"],
 learn:`<div class="note"><span class="note-t">Exam question</span>What is Prolog? Explain facts, rules and queries, and show how Prolog can implement a rule-based expert system.</div>
<p><b>Prolog</b> (Programming in Logic) is a logic programming language used for AI, expert systems and natural language processing. Unlike Python, which is <b>imperative</b>, Prolog is <b>declarative</b>: we define facts and rules and let the system infer answers.</p>
<h4>A Prolog program consists of</h4>
<ul class="list"><li><b>Facts</b> — base truths about objects and their relationships: <code>parent(john, mary).</code></li>
<li><b>Rules</b> — logical conditions that define new relationships:<br><code>grandparent(X, Y) :- parent(X, Z), parent(Z, Y).</code> — "X is a grandparent of Y if X is a parent of Z and Z is a parent of Y". Read <code>:-</code> as "if".</li>
<li><b>Queries</b> — questions to check logical conclusions: <code>?- parent(X, mary).</code> gives <code>X = john</code>; <code>?- parent(mary, bob).</code> gives <code>true</code>.</li></ul>
<p><b>Logical operators:</b> <code>,</code> AND · <code>;</code> OR · <code>\\+</code> NOT.</p>
<h4>A rule-based expert system — animal identification</h4>
<div class="formula">animal(tiger)    :- has_trait(fur), has_trait(claws), has_trait(carnivore).
animal(elephant) :- has_trait(large), has_trait(trunk), has_trait(herbivore).
animal(eagle)    :- has_trait(feathers), has_trait(flies), has_trait(carnivore).
animal(shark)    :- has_trait(fins), has_trait(swims), has_trait(carnivore).
animal(kangaroo) :- has_trait(tail), has_trait(jumps), has_trait(pouch).

has_trait(Trait) :- write('Does the animal have '), write(Trait),
                    write('? (yes/no): '), read(Response), Response == yes.

identify_animal :- animal(Animal), write('The animal you are thinking of is: '),
                   write(Animal), nl, !.
identify_animal :- write('Sorry, I could not identify the animal.'), nl.</div>
<h4>How it runs (the deck's sample session)</h4>
<ol class="list"><li>Prolog tries <code>animal(tiger)</code> first and asks fur? (yes), claws? (yes), carnivore? (yes) → prints "tiger". The <b>cut</b> <code>!</code> stops it looking for other answers.</li>
<li>In a second run: fur? yes, claws? <b>no</b> → the tiger rule fails, so Prolog <b>backtracks</b> to the next clause and asks large? (no), then feathers? (no), fins? (no), tail? (no). Every <code>animal</code> rule has failed, so the second <code>identify_animal</code> clause prints "Sorry…".</li></ol>
<p>This is <b>backward chaining</b> from Module 3: Prolog starts from the goal <code>animal(X)</code>, tries each rule whose head matches, and works backward through the body's subgoals depth-first, left to right, backtracking on failure. The disease-diagnosis example on slide 29 has exactly the same structure, with <code>has_symptom</code> in place of <code>has_trait</code>.</p>`,
 understand:`<p>An expert system is a knowledge base of if-then rules plus an inference engine. In Prolog you write only the knowledge base; the inference engine — backward chaining with backtracking — is built into the language.</p>`,
 examples:[],
 examAnswer:`<p>Define Prolog as declarative, give one fact, one rule and one query with output, the three operators, then a 4–5 line expert-system program and one sentence on how backtracking finds the answer.</p>`,
 mistakes:[`Writing rules with the condition first, as in Python. In Prolog the conclusion (head) comes first: head :- body. Also note a quirk of the sample program: it re-asks a trait it was already told about (e.g. carnivore) when a later rule needs it — a real expert system would remember answers.`]},

{id:"m4t16", title:"Applying STRIPS Actions and Validating a Plan", type:"numerical",
 priority:"high", core:true, marks:[5], src:"Chpt 4 Planning slides 16–24 (Fly, move operator, spare tire, blocks world); R&N Fig 10.3, §10.2.2",
 tags:["applying","strips","actions","validating","plan"],
 concept:`To execute a plan on paper, keep a running state. For each action: check every precondition is in the state, delete the negative effects, add the positive ones, and copy everything else unchanged. The plan is valid if the final state contains every goal literal.`,
 formula:`<div class="fx-pre">Applicable(a, s)  ⟺  PRECOND(a) ⊆ s
Result(s, a)       =  ( s − DEL(a) ) ∪ ADD(a)
Valid plan         ⟺  each action applicable in turn, and GOAL ⊆ final state

Regression (backward):  g′ = ( g − ADD(a) ) ∪ PRECOND(a)</div>`,
 variables:[{v:"s", m:`the current state — a set of ground literals (closed-world)`},
  {v:"ADD(a)", m:`positive literals in a's effect`},
  {v:"DEL(a)", m:`literals negated in a's effect`},
  {v:"g′", m:`the goal regressed one step back through action a`}],
 worked:{
  problem:`<strong>Blocks world — build the tower A on B on C (R&N Fig 10.3; deck slide 24 names the actions).</strong><div class="fx-pre">Init: On(A,Table) ∧ On(B,Table) ∧ On(C,A) ∧ Clear(B) ∧ Clear(C)       (+ Block(A), Block(B), Block(C))
Goal: On(A,B) ∧ On(B,C)
Move(b,x,y):       PRE On(b,x) ∧ Clear(b) ∧ Clear(y)    EFF On(b,y) ∧ Clear(x) ∧ ¬On(b,x) ∧ ¬Clear(y)
MoveToTable(b,x):  PRE On(b,x) ∧ Clear(b)               EFF On(b,Table) ∧ Clear(x) ∧ ¬On(b,x)
Plan: [MoveToTable(C,A), Move(B,Table,C), Move(A,Table,B)]</div>`,
  steps:[`<b>MoveToTable(C, A).</b> PRE On(C,A) ✓ Clear(C) ✓. Delete On(C,A); add On(C,Table), Clear(A).<br>
    State: On(A,Table), On(B,Table), On(C,Table), Clear(A), Clear(B), Clear(C)`,
   `<b>Move(B, Table, C).</b> PRE On(B,Table) ✓ Clear(B) ✓ Clear(C) ✓. Delete On(B,Table), Clear(C); add On(B,C), Clear(Table).<br>
    State: On(A,Table), On(B,C), On(C,Table), Clear(A), Clear(B), Clear(Table)`,
   `<b>Move(A, Table, B).</b> PRE On(A,Table) ✓ Clear(A) ✓ Clear(B) ✓. Delete On(A,Table), Clear(B); add On(A,B).<br>
    State: On(A,B), On(B,C), On(C,Table), Clear(A), Clear(Table)`,
   `<b>Goal test:</b> On(A,B) ✓ On(B,C) ✓ — the plan is valid.`],
  answer:`The three-step plan is valid; the final state contains On(A,B) ∧ On(B,C).`,
  check:`Clear(Table) appearing is harmless — the textbook reads Clear(Table) as 'there is space on the table', which is always true. Every literal not mentioned by an action must be copied forward unchanged; count literals before and after each step.`},
 learn:"",
 mistakes:[`Changing a literal the action does not mention — Planning slide 19 does this, moving P2 to DEL when only P1 flew.`,
  `Applying an action whose precondition is not in the state, e.g. Move(B,Table,C) before C is clear.`,
  `Trying to achieve On(B,C) first by moving A — this classic case (the Sussman anomaly) shows why goals cannot always be achieved one at a time.`],
 practice:[
  {d:"Easy", q:`Apply Fly(P1, MUM, DEL) to the state At(P1,MUM) ∧ At(P2,SFO) ∧ Plane(P1) ∧ Plane(P2) ∧ Airport(MUM) ∧ Airport(DEL). Give θ and the new state.`,
   s:`θ = {p/P1, from/MUM, to/DEL}. Precondition At(P1,MUM) ∧ Plane(P1) ∧ Airport(MUM) ∧ Airport(DEL) — all present ✓.<br>
   Delete At(P1,MUM); add At(P1,DEL).<br><br>
   <b>New state:</b> At(P1,DEL) ∧ <b>At(P2,SFO)</b> ∧ Plane(P1) ∧ Plane(P2) ∧ Airport(MUM) ∧ Airport(DEL)<br><br>
   <div class="note warn"><b>Slide error (slide 19):</b> the slide writes At(P2,DEL). P2 was never mentioned by the action, so it stays at SFO.</div>`},
  {d:"Moderate", q:`Spare tire (slides 22–23): Init At(Flat,Axle) ∧ At(Spare,Trunk); Goal At(Spare,Axle). Trace the plan [Remove(Spare,Trunk), Remove(Flat,Axle), PutOn(Spare,Axle)] and show it is valid.`,
   s:`Remove(Spare,Trunk): PRE At(Spare,Trunk) ✓ → delete At(Spare,Trunk), add At(Spare,Ground).<br>
   State: At(Flat,Axle), At(Spare,Ground)<br><br>
   Remove(Flat,Axle): PRE At(Flat,Axle) ✓ → delete At(Flat,Axle), add At(Flat,Ground).<br>
   State: At(Spare,Ground), At(Flat,Ground)<br><br>
   PutOn(Spare,Axle): PRE At(Spare,Ground) ✓ ∧ ¬At(Flat,Axle) ✓ (At(Flat,Axle) is not in the state; closed world) → delete At(Spare,Ground), add At(Spare,Axle).<br>
   State: At(Flat,Ground), At(Spare,Axle)<br><br>
   <b>Goal At(Spare,Axle) ✓ — valid.</b><br>
   <i>Note: PutOn has a <b>negative</b> precondition (¬At(Flat,Axle)), which pure STRIPS does not allow — it is one of the restrictions ADL relaxes.</i>`},
  {d:"Moderate", q:`Why would LeaveOvernight be a bad first action in the spare-tire problem? Use its effect list.`,
   s:`LeaveOvernight has no preconditions and its effect is ¬At(Spare,Ground) ∧ ¬At(Spare,Axle) ∧ ¬At(Spare,Trunk) ∧ ¬At(Flat,Ground) ∧ ¬At(Flat,Axle) — overnight, both tyres are stolen.<br><br>
   Applied first, it deletes At(Spare,Trunk), so Remove(Spare,Trunk) is no longer applicable and the goal At(Spare,Axle) becomes unreachable. It does achieve ¬At(Flat,Axle), which is why a planner might be tempted to use it — the POP example shows exactly that dead end.`},
  {d:"Exam-level", q:`Regress the goal g = At(P1,DEL) ∧ At(P2,SFO) through the action Fly(P1, MUM, DEL). Is the action relevant?`,
   s:`ADD(a) = {At(P1,DEL)} · DEL(a) = {At(P1,MUM)} · PRECOND(a) = {At(P1,MUM), Plane(P1), Airport(MUM), Airport(DEL)}<br><br>
   <b>Relevant?</b> Yes — it adds a goal literal (At(P1,DEL)) and deletes none of the goal's literals.<br><br>
   g′ = (g − ADD(a)) ∪ PRECOND(a) = {At(P2,SFO)} ∪ {At(P1,MUM), Plane(P1), Airport(MUM), Airport(DEL)}<br>
   <div class="answer">g′ = At(P2,SFO) ∧ At(P1,MUM) ∧ Plane(P1) ∧ Airport(MUM) ∧ Airport(DEL)</div>
   The initial state of the Fly example satisfies g′, so backward search has found a one-step plan.`}]},

{id:"m4t17", title:"Building a Partial-Order Plan", type:"numerical",
 priority:"high", core:true, marks:[10], src:"Chpt 4 Planning slides 25–35 (shoes and socks; spare tire POP, R&N Figs 11.6, 11.8–11.10)",
 tags:["building","partial-order","plan"],
 concept:`Start with a plan containing only Start and Finish. Repeatedly pick an open precondition, choose an action that achieves it (an existing step or a new one), add a causal link and an ordering, then check every causal link for threats. Stop when no open preconditions remain.`,
 formula:`<div class="fx-pre">Plan = ⟨ Actions, Orderings (A ≺ B), Causal links (A —p→ B), Open preconditions ⟩

Initial plan:  Actions {Start, Finish}, Start ≺ Finish,
               open preconditions = Finish's preconditions = the goal
Threat:        C threatens A —p→ B if C has effect ¬p and could fall between A and B
Resolve by:    ordering C before A,  or  C after B</div>`,
 variables:[{v:"A ≺ B", m:`A before B — not necessarily immediately before`},
  {v:"A —p→ B", m:`causal link: A achieves p for B; p must stay true between them`},
  {v:"open precondition", m:`a precondition not yet achieved by any causal link`},
  {v:"linearization", m:`a total order consistent with all the ≺ constraints`}],
 algorithm:`<div class="fx-pre">1. Plan ← {Start, Finish}, Start ≺ Finish; open ← goal literals
2. while open is not empty:
     pick an open precondition p of step B
     choose step A (existing or new) with effect p
     add A —p→ B and A ≺ B; if A is new, add its preconditions to open
     for every step C that threatens a causal link: order C before or after it
     if no consistent choice exists → backtrack
3. return the plan (any linearization is a valid total-order plan)</div>`,
 worked:{
  problem:`<strong>Shoes and socks (slides 28–31).</strong><div class="fx-pre">Goal(RightShoeOn ∧ LeftShoeOn)   Init()
RightShoe: PRE RightSockOn → RightShoeOn       RightSock: → RightSockOn
LeftShoe:  PRE LeftSockOn  → LeftShoeOn        LeftSock:  → LeftSockOn</div>`,
  steps:[`<b>Initial plan:</b> {Start, Finish}. Open preconditions: RightShoeOn, LeftShoeOn (Finish's).`,
   `<b>Pick RightShoeOn.</b> Only RightShoe achieves it. Add RightShoe, link <code>RightShoe —RightShoeOn→ Finish</code>. New open precondition: RightSockOn.`,
   `<b>Pick RightSockOn.</b> Add RightSock, link <code>RightSock —RightSockOn→ RightShoe</code>. RightSock has no preconditions.`,
   `<b>Pick LeftShoeOn, then LeftSockOn</b> — the same two steps on the left: add LeftShoe, LeftSock and their causal links.`,
   `<b>Threat check.</b> No action deletes anything, so there are no threats. Open preconditions = ∅ — the plan is complete.<div class="dia"><svg viewBox="0 0 540 300" role="img" aria-label="Partial-order plan for shoes and socks"><defs><marker id="arw_pop_shoes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M238.5 48 L161.5 92" class="de " marker-end="url(#arw_pop_shoes)"/><path d="M301.5 48 L378.5 92" class="de " marker-end="url(#arw_pop_shoes)"/><path d="M130 128 L130 177" class="de acc" marker-end="url(#arw_pop_shoes)"/><path d="M410 128 L410 177" class="de acc" marker-end="url(#arw_pop_shoes)"/><path d="M163.6 213 L236.4 252" class="de acc" marker-end="url(#arw_pop_shoes)"/><path d="M376.4 213 L303.6 252" class="de acc" marker-end="url(#arw_pop_shoes)"/><rect x="225" y="12" width="90" height="36" rx="7" class="dn acc"/><text x="270" y="30" class="dnt">Start</text><rect x="70" y="92" width="120" height="36" rx="7" class="dn "/><text x="130" y="110" class="dnt">LeftSock</text><rect x="350" y="92" width="120" height="36" rx="7" class="dn "/><text x="410" y="110" class="dnt">RightSock</text><rect x="70" y="177" width="120" height="36" rx="7" class="dn "/><text x="130" y="195" class="dnt">LeftShoe</text><rect x="350" y="177" width="120" height="36" rx="7" class="dn "/><text x="410" y="195" class="dnt">RightShoe</text><rect x="225" y="252" width="90" height="36" rx="7" class="dn good"/><text x="270" y="270" class="dnt">Finish</text><rect x="94" y="143.5" width="72" height="18" rx="4" class="delb"/><text x="130" y="152.5" class="del">LeftSockOn</text><rect x="370.9" y="143.5" width="78.2" height="18" rx="4" class="delb"/><text x="410" y="152.5" class="del">RightSockOn</text><rect x="164" y="223.5" width="72" height="18" rx="4" class="delb"/><text x="200" y="232.5" class="del">LeftShoeOn</text><rect x="300.9" y="223.5" width="78.2" height="18" rx="4" class="delb"/><text x="340" y="232.5" class="del">RightShoeOn</text></svg><div class="dia-cap">Complete partial-order plan · slide 31</div></div>`,
   `<b>Linearizations:</b> each sock must precede its own shoe; the two chains can interleave in 4! / (2!·2!) = <b>6</b> ways.`],
  answer:`Four actions, four causal links, ordering only LeftSock ≺ LeftShoe and RightSock ≺ RightShoe. One partial-order plan, six valid total-order plans.`,
  check:`Every precondition of every step (including Finish) must have exactly one incoming causal link. Count: Finish has 2, each shoe has 1 → 4 links.`},
 learn:"",
 mistakes:[`Ordering the left chain before the right chain. Nothing requires it — that loses the least-commitment advantage.`,
  `Forgetting to add the new action's own preconditions to the open set.`,
  `Resolving a threat by deleting the causal link. A threat is resolved by ordering the threatening step outside the link's interval.`],
 practice:[
  {d:"Easy", q:`Painting the ceiling: Get brush and Get ladder must both precede Paint ceiling. How many total-order plans does the partial-order plan represent?`,
   s:`Get brush and Get ladder are unordered; Paint ceiling must come after both. Orders: (brush, ladder, paint) and (ladder, brush, paint) → <b>2</b> linearizations.`},
  {d:"Exam-level", q:`Spare tire POP (slides 33–35): starting from Start (effects At(Spare,Trunk), At(Flat,Axle)) and Finish (precondition At(Spare,Axle)), build the partial-order plan. Show the LeaveOvernight conflict and how it is resolved.`,
   s:`<b>1.</b> Open: At(Spare,Axle). Choose <b>PutOn(Spare,Axle)</b>; link PutOn —At(Spare,Axle)→ Finish. New open: At(Spare,Ground), ¬At(Flat,Axle).<br>
   <b>2.</b> Open At(Spare,Ground): choose <b>Remove(Spare,Trunk)</b>; link Remove(Spare,Trunk) —At(Spare,Ground)→ PutOn. New open: At(Spare,Trunk).<br>
   <b>3.</b> Open ¬At(Flat,Axle): first try <b>LeaveOvernight</b>. Its effect ¬At(Spare,Ground) <b>threatens</b> the link Remove(Spare,Trunk) —At(Spare,Ground)→ PutOn. Resolve by ordering LeaveOvernight ≺ Remove(Spare,Trunk) (R&N Fig 11.9).<br>
   <b>4.</b> Now open At(Spare,Trunk) for Remove(Spare,Trunk). Start provides it — but LeaveOvernight, now ordered before Remove, deletes At(Spare,Trunk). There is no consistent ordering. <b>Dead end — backtrack.</b><br>
   <b>5.</b> Remove LeaveOvernight; achieve ¬At(Flat,Axle) with <b>Remove(Flat,Axle)</b>; link Remove(Flat,Axle) —¬At(Flat,Axle)→ PutOn. New open: At(Flat,Axle), achieved by Start.<br>
   <b>6.</b> At(Spare,Trunk) for Remove(Spare,Trunk), achieved by Start. No open preconditions, no threats.<br>
   <div class="dia"><svg viewBox="0 0 800 270" role="img" aria-label="Final partial-order plan for the spare-tire problem"><defs><marker id="arw_pop_tire" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M95 117.85714285714286 L223 63" class="de acc" marker-end="url(#arw_pop_tire)"/><path d="M95 152.14285714285714 L223 207" class="de acc" marker-end="url(#arw_pop_tire)"/><path d="M310 63 L445 117" class="de acc" marker-end="url(#arw_pop_tire)"/><path d="M310 207 L445 153" class="de acc" marker-end="url(#arw_pop_tire)"/><path d="M570 135 L695 135" class="de acc" marker-end="url(#arw_pop_tire)"/><rect x="15" y="117" width="80" height="36" rx="7" class="dn acc"/><text x="55" y="135" class="dnt">Start</text><rect x="185" y="27" width="160" height="36" rx="7" class="dn "/><text x="265" y="45" class="dnt">Remove(Spare,Trunk)</text><rect x="185" y="207" width="160" height="36" rx="7" class="dn "/><text x="265" y="225" class="dnt">Remove(Flat,Axle)</text><rect x="410" y="117" width="160" height="36" rx="7" class="dn "/><text x="490" y="135" class="dnt">PutOn(Spare,Axle)</text><rect x="695" y="117" width="80" height="36" rx="7" class="dn good"/><text x="735" y="135" class="dnt">Finish</text><rect x="107.5" y="81.42857142857143" width="103" height="18" rx="4" class="delb"/><text x="159" y="90.42857142857143" class="del">At(Spare,Trunk)</text><rect x="113.69999999999999" y="170.57142857142856" width="90.60000000000001" height="18" rx="4" class="delb"/><text x="159" y="179.57142857142856" class="del">At(Flat,Axle)</text><rect x="322.9" y="81" width="109.2" height="18" rx="4" class="delb"/><text x="377.5" y="90" class="del">At(Spare,Ground)</text><rect x="329.1" y="171" width="96.8" height="18" rx="4" class="delb"/><text x="377.5" y="180" class="del">¬At(Flat,Axle)</text><rect x="584.1" y="126" width="96.8" height="18" rx="4" class="delb"/><text x="632.5" y="135" class="del">At(Spare,Axle)</text></svg><div class="dia-cap">Final plan: the two Removes are unordered with respect to each other · slide 35 (R&amp;N Fig 11.10)</div></div>
   <div class="answer">Remove(Spare,Trunk) and Remove(Flat,Axle) can be done in either order, as long as both precede PutOn(Spare,Axle) — 2 linearizations.</div>`},
  {d:"Moderate", q:`Define 'complete plan' and 'achieved precondition' for a partially ordered plan.`,
   s:`A precondition is <b>achieved</b> iff it is the effect of an earlier step and no <b>possibly intervening</b> step undoes it.<br>
   A plan is <b>complete</b> iff every precondition (of every step, including Finish) is achieved.<br>
   Equivalently, the set of <b>open preconditions</b> is empty and no causal link is threatened.`}]},

{id:"m4t18", title:"HTN, Task Network and Multi-Agent Plan Design", type:"numerical",
 priority:"high", core:true, marks:[10], src:"Chpt 4 Planning slides 74–86 (placement drive A–D; food-delivery robot)",
 tags:["htn","task","network","multi-agent","plan","design"],
 concept:`The deck's two scenario questions both ask you to design a plan, not run an algorithm: decompose the top task into subtasks down to primitives, write the task network with ≺ and one truth constraint, add a branch for a failure, and split the work among agents. Draw everything.`,
 formula:`<div class="fx-pre">HTN:            high-level task → subtasks → … → primitive tasks
Task network:   ( (n₁, α₁), …, (nₘ, αₘ), ϕ )
Temporal:       nᵢ ≺ nⱼ          (nᵢ precedes nⱼ)
Truth:          (nᵢ, p, nⱼ)      (p true after nᵢ and before nⱼ)
Conditional:    if &lt;test> then planA else planB
MAS type:       centralised · decentralised · distributed</div>`,
 variables:[{v:"primitive task", m:`a task that can be executed directly — a leaf of the HTN`},
  {v:"independent tasks", m:`tasks with no ≺ between them — can run in parallel`},
  {v:"truth constraint", m:`the condition a later task relies on, protected across the interval`}],
 worked:{
  problem:`<strong>Autonomous food-delivery robot (slides 84–86).</strong><div class="fx-pre">An autonomous food-delivery robot must collect an order from a restaurant and deliver it to a customer.
Construct a hierarchical task network, showing task decomposition, primitive tasks,
temporal constraints and one truth constraint.</div>`,
  steps:[`<b>High-level task:</b> DeliverOrder(Order, Customer). Decompose into <b>Preparation</b>, <b>Pickup</b>, <b>Delivery</b>.<div class="dia"><svg viewBox="0 0 780 290" role="img" aria-label="HTN for the food-delivery robot"><defs><marker id="arw_htn_delivery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M330.3614457831325 50 L174.63855421686748 97" class="de " marker-end="url(#arw_htn_delivery)"/><path d="M379.1566265060241 50 L350.8433734939759 97" class="de " marker-end="url(#arw_htn_delivery)"/><path d="M437.71084337349396 50 L562.289156626506 97" class="de " marker-end="url(#arw_htn_delivery)"/><path d="M106 133 L70.5 204" class="de " marker-end="url(#arw_htn_delivery)"/><path d="M124 133 L159.5 204" class="de " marker-end="url(#arw_htn_delivery)"/><path d="M331 133 L295.5 204" class="de " marker-end="url(#arw_htn_delivery)"/><path d="M349 133 L384.5 204" class="de " marker-end="url(#arw_htn_delivery)"/><path d="M592.8181818181819 133 L525.0454545454545 204" class="de " marker-end="url(#arw_htn_delivery)"/><path d="M610.8181818181819 133 L614.0454545454545 204" class="de " marker-end="url(#arw_htn_delivery)"/><path d="M628.3272727272728 133 L700.6181818181818 204" class="de " marker-end="url(#arw_htn_delivery)"/><rect x="315" y="14" width="150" height="36" rx="7" class="dn acc"/><text x="390" y="32" class="dnt">DeliverOrder</text><rect x="50" y="97" width="130" height="36" rx="7" class="dn "/><text x="115" y="115" class="dnt">Preparation</text><rect x="275" y="97" width="130" height="36" rx="7" class="dn "/><text x="340" y="115" class="dnt">Pickup</text><rect x="545" y="97" width="130" height="36" rx="7" class="dn "/><text x="610" y="115" class="dnt">Delivery</text><rect x="10" y="204" width="100" height="42" rx="7" class="dn good"/><text x="60" y="217.5" class="dnt">n1 Check</text><text x="60" y="232.5" class="dnt sub">Battery</text><rect x="120" y="204" width="100" height="42" rx="7" class="dn good"/><text x="170" y="217.5" class="dnt">n2 Verify</text><text x="170" y="232.5" class="dnt sub">OrderReady</text><rect x="235" y="204" width="100" height="42" rx="7" class="dn good"/><text x="285" y="217.5" class="dnt">n3 Navigate to</text><text x="285" y="232.5" class="dnt sub">Restaurant</text><rect x="345" y="204" width="100" height="42" rx="7" class="dn good"/><text x="395" y="217.5" class="dnt">n4 PickUp</text><text x="395" y="232.5" class="dnt sub">Order</text><rect x="455" y="204" width="100" height="42" rx="7" class="dn good"/><text x="505" y="217.5" class="dnt">n5 Navigate to</text><text x="505" y="232.5" class="dnt sub">Customer</text><rect x="565" y="204" width="100" height="42" rx="7" class="dn good"/><text x="615" y="217.5" class="dnt">n6 Deliver</text><text x="615" y="232.5" class="dnt sub">Order</text><rect x="672" y="204" width="100" height="42" rx="7" class="dn good"/><text x="722" y="217.5" class="dnt">n7 Update</text><text x="722" y="232.5" class="dnt sub">Status</text></svg><div class="dia-cap">HTN — the bottom row are primitive tasks · slide 85</div></div>`,
   `<b>Primitive tasks:</b> n₁ CheckBattery · n₂ VerifyOrderReady · n₃ NavigateToRestaurant · n₄ PickUpOrder · n₅ NavigateToCustomer · n₆ DeliverOrder · n₇ UpdateDeliveryStatus.`,
   `<b>Temporal constraints:</b> n₁ ≺ n₃ · n₂ ≺ n₄ · n₃ ≺ n₄ ≺ n₅ ≺ n₆ ≺ n₇. CheckBattery and VerifyOrderReady can occur independently.`,
   `<b>Truth constraint:</b> (n₄, OrderOnRobot, n₆) — OrderOnRobot must remain true after PickUpOrder and until DeliverOrder.<div class="dia"><svg viewBox="0 0 800 215" role="img" aria-label="Task network for the food-delivery robot"><defs><marker id="arw_tn_delivery" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M108 55 L152 55" class="de " marker-end="url(#arw_tn_delivery)"/><path d="M248 72.14285714285714 L292 87.85714285714286" class="de " marker-end="url(#arw_tn_delivery)"/><path d="M108 150.57142857142858 L292 114.42857142857143" class="de " marker-end="url(#arw_tn_delivery)"/><path d="M385.2307692307692 126 L434.7692307692308 149" class="de " marker-end="url(#arw_tn_delivery)"/><path d="M525.2307692307693 149 L574.7692307692307 126" class="de " marker-end="url(#arw_tn_delivery)"/><path d="M668 105 L697 105" class="de " marker-end="url(#arw_tn_delivery)"/><path d="M388 105 L572 105" class="de dash acc" marker-end="url(#arw_tn_delivery)"/><rect x="12" y="34" width="96" height="42" rx="7" class="dn "/><text x="60" y="47.5" class="dnt">n1 Check</text><text x="60" y="62.5" class="dnt sub">Battery</text><rect x="12" y="139" width="96" height="42" rx="7" class="dn "/><text x="60" y="152.5" class="dnt">n2 Verify</text><text x="60" y="167.5" class="dnt sub">OrderReady</text><rect x="152" y="34" width="96" height="42" rx="7" class="dn "/><text x="200" y="47.5" class="dnt">n3 Navigate to</text><text x="200" y="62.5" class="dnt sub">Restaurant</text><rect x="292" y="84" width="96" height="42" rx="7" class="dn acc"/><text x="340" y="97.5" class="dnt">n4 PickUp</text><text x="340" y="112.5" class="dnt sub">Order</text><rect x="432" y="149" width="96" height="42" rx="7" class="dn "/><text x="480" y="162.5" class="dnt">n5 Navigate to</text><text x="480" y="177.5" class="dnt sub">Customer</text><rect x="572" y="84" width="96" height="42" rx="7" class="dn acc"/><text x="620" y="97.5" class="dnt">n6 Deliver</text><text x="620" y="112.5" class="dnt sub">Order</text><rect x="697" y="84" width="96" height="42" rx="7" class="dn "/><text x="745" y="97.5" class="dnt">n7 Update</text><text x="745" y="112.5" class="dnt sub">Status</text><rect x="437.8" y="96" width="84.4" height="18" rx="4" class="delb"/><text x="480" y="105" class="del">OrderOnRobot</text></svg><div class="dia-cap">Task network — the dashed link is the truth constraint · slide 86</div></div>`],
  answer:`Seven primitives under three subtasks; n₁ and n₂ are independent; the truth constraint protects OrderOnRobot across navigation to the customer.`,
  check:`Every primitive must be reachable from the root, every ≺ chain must be acyclic, and the truth constraint's condition must be produced by its first task and needed by its second. This network has 3 linearizations — n₂ can go before n₁, between n₁ and n₃, or after n₃.`},
 learn:"",
 mistakes:[`Stopping the decomposition at abstract tasks like 'Delivery' — the question asks for primitive tasks.`,
  `Putting every task in one long ≺ chain. Show which tasks are independent; that is half the point of a task network.`,
  `Choosing a MAS type without justifying it against the scenario.`],
 practice:[
  {d:"Exam-level", q:`FCRIT placement drive (slide 74), parts A and B: 600 students, eligibility checks, aptitude test, technical and HR interviews, room allocation and communication. (A) Identify the major tasks and decompose 'Schedule Interview'. (B) Draw its task network, showing ordered and parallel tasks.`,
   s:`<b>(A) Major tasks</b> under Conduct Placement Drive: Verify Students' Eligibility · Conduct Test · Schedule Interviews · Conduct Interviews · Record Results.<br>
   <b>Schedule Interview</b> decomposes into: T1 Check Student Availability · T2 Check Panel Availability · T3 Check Room Availability · T4 Assign Interview Slot · T5 Notify Student.<br><br>
   <b>(B) Ordering:</b> T1 ≺ T4, T2 ≺ T4, T3 ≺ T4, T4 ≺ T5. T1, T2 and T3 are independent and can run in parallel (6 possible orders among them).
   <div class="dia"><svg viewBox="0 0 640 220" role="img" aria-label="Task network for Schedule Interview"><defs><marker id="arw_tn_interview" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M145 58.2 L265 91.8" class="de " marker-end="url(#arw_tn_interview)"/><path d="M145 110 L265 110" class="de " marker-end="url(#arw_tn_interview)"/><path d="M145 161.8 L265 128.2" class="de " marker-end="url(#arw_tn_interview)"/><path d="M395 110 L480 110" class="de " marker-end="url(#arw_tn_interview)"/><rect x="15" y="19" width="130" height="42" rx="7" class="dn "/><text x="80" y="32.5" class="dnt">T1 Check student</text><text x="80" y="47.5" class="dnt sub">availability</text><rect x="15" y="89" width="130" height="42" rx="7" class="dn "/><text x="80" y="102.5" class="dnt">T2 Check panel</text><text x="80" y="117.5" class="dnt sub">availability</text><rect x="15" y="159" width="130" height="42" rx="7" class="dn "/><text x="80" y="172.5" class="dnt">T3 Check room</text><text x="80" y="187.5" class="dnt sub">availability</text><rect x="265" y="89" width="130" height="42" rx="7" class="dn acc"/><text x="330" y="102.5" class="dnt">T4 Assign</text><text x="330" y="117.5" class="dnt sub">interview slot</text><rect x="480" y="89" width="130" height="42" rx="7" class="dn good"/><text x="545" y="102.5" class="dnt">T5 Notify</text><text x="545" y="117.5" class="dnt sub">student</text></svg><div class="dia-cap">Task network for Schedule Interview · slides 78–79</div></div>
   <i>The deck also gives a second model answer (slide 75): n₁ VerifyStudentEligibility, n₂ CheckInterviewerAvailability, n₃ CheckRoomAvailability, n₄ AllocateInterviewSlot, n₅ NotifyStudentAndInterviewer, n₆ ConductTechnicalInterview, n₇ ScheduleHRRound; with n₁, n₂, n₃ ≺ n₄ ≺ n₅ ≺ n₆ ≺ n₇ and truth constraint (n₄, SlotAllocated, n₆). Either is acceptable — it shows the same structure.</i>`},
  {d:"Exam-level", q:`Placement drive, parts C and D: (C) the allocated room becomes unavailable — give an IF–THEN–ELSE plan. (D) Design a multi-agent system with at least four agents (responsibility, information, one interaction each) and say whether it is centralised, decentralised or distributed.`,
   s:`<b>(C) Conditional plan</b> (slide 80):
   <div class="dia"><svg viewBox="0 0 700 470" role="img" aria-label="Conditional plan when the interview room is unavailable"><defs><marker id="arw_cond_room" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M281 56 L162 107" class="de " marker-end="url(#arw_cond_room)"/><path d="M374.3333333333333 56 L482 107" class="de " marker-end="url(#arw_cond_room)"/><path d="M520 143 L520 189" class="de " marker-end="url(#arw_cond_room)"/><path d="M489.6666666666667 231 L416 282" class="de " marker-end="url(#arw_cond_room)"/><path d="M543.3333333333334 231 L596.6666666666666 279" class="de " marker-end="url(#arw_cond_room)"/><path d="M135.12 143 L314.88 357" class="de " marker-end="url(#arw_cond_room)"/><path d="M375.6 318 L344.4 357" class="de " marker-end="url(#arw_cond_room)"/><path d="M545 319.3965517241379 L399.6 357" class="de " marker-end="url(#arw_cond_room)"/><path d="M330 393 L330 422" class="de " marker-end="url(#arw_cond_room)"/><rect x="255" y="14" width="150" height="42" rx="7" class="dn warn"/><text x="330" y="27.5" class="dnt">Room AX112</text><text x="330" y="42.5" class="dnt sub">available?</text><rect x="45" y="107" width="150" height="36" rx="7" class="dn good"/><text x="120" y="125" class="dnt">Assign AX112</text><rect x="445" y="107" width="150" height="36" rx="7" class="dn "/><text x="520" y="125" class="dnt">Search other room</text><rect x="445" y="189" width="150" height="42" rx="7" class="dn warn"/><text x="520" y="202.5" class="dnt">Other room</text><text x="520" y="217.5" class="dnt sub">available?</text><rect x="315" y="282" width="150" height="36" rx="7" class="dn good"/><text x="390" y="300" class="dnt">Assign that room</text><rect x="545" y="279" width="150" height="42" rx="7" class="dn bad"/><text x="620" y="292.5" class="dnt">Reschedule /</text><text x="620" y="307.5" class="dnt sub">online option</text><rect x="255" y="357" width="150" height="36" rx="7" class="dn "/><text x="330" y="375" class="dnt">Update schedule</text><rect x="255" y="422" width="150" height="36" rx="7" class="dn acc"/><text x="330" y="440" class="dnt">Notify everyone</text><rect x="207.2" y="72.5" width="28.6" height="18" rx="4" class="delb"/><text x="221.5" y="81.5" class="del">YES</text><rect x="416.96666666666664" y="72.5" width="22.4" height="18" rx="4" class="delb"/><text x="428.16666666666663" y="81.5" class="del">NO</text><rect x="438.53333333333336" y="247.5" width="28.6" height="18" rx="4" class="delb"/><text x="452.83333333333337" y="256.5" class="del">YES</text><rect x="558.8" y="246" width="22.4" height="18" rx="4" class="delb"/><text x="570" y="255" class="del">NO</text></svg><div class="dia-cap">Branching plan for an unavailable room</div></div>
   <b>(D) Agents</b> (slide 81):
   <div class="scroll"><table class="t"><thead><tr><th>Agent</th><th>Responsibility</th><th>Information needed / shared</th></tr></thead><tbody>
   <tr><td>Student Agent</td><td>Eligibility and student status</td><td>Student records, round cleared</td></tr>
   <tr><td>Scheduling Agent</td><td>Creates the interview schedule</td><td>Student, panel and room availability</td></tr>
   <tr><td>Room Agent</td><td>Manages rooms</td><td>Available / occupied rooms</td></tr>
   <tr><td>Company / Panel Agent</td><td>Tracks interview panels</td><td>Panel availability / delay</td></tr>
   <tr><td>Notification Agent</td><td>Communicates changes</td><td>Schedule, room, time, result</td></tr></tbody></table></div>
   <b>Interaction</b> (interviewer delayed 45 min): Company Agent "panel delayed" → Scheduling Agent recalculates affected slots → Room Agent checks rooms for the revised time → Scheduling Agent generates the revised schedule → Notification Agent sends the new times.<br><br>
   <b>Type: distributed planning</b> — specialised agents make and adjust their own parts of the plan while exchanging information and coordinating. Not centralised (no single planner holding everything), not purely decentralised (they do coordinate).`},
