{id:"m6t3", title:"Retrieval as a Tool", type:"theory",
 priority:"high", core:true, marks:[5], src:"Tool Calling p.5; part 2 slide 28",
 tags:["retrieval","tool"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Explain retrieval as a tool. Describe the indexing and answering pipelines, and what the system should do when nothing relevant is found.</div>
<p><b>Search your own documents first, then let the model answer only from what came back.</b></p>
<div class="dia"><svg viewBox="0 0 800 290" role="img" aria-label="Retrieval as a tool: indexing once, answering every time"><defs><marker id="arw_rag_full" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M256 40 L294 40" class="de " marker-end="url(#arw_rag_full)"/><path d="M406 40 L430 40" class="de " marker-end="url(#arw_rag_full)"/><path d="M441.77272727272725 61 L251 129.80327868852459" class="de dash" marker-end="url(#arw_rag_full)"/><path d="M121 150 L139 150" class="de " marker-end="url(#arw_rag_full)"/><path d="M251 150 L269 150" class="de " marker-end="url(#arw_rag_full)"/><path d="M381 150 L399 150" class="de " marker-end="url(#arw_rag_full)"/><path d="M511 150 L534 150" class="de " marker-end="url(#arw_rag_full)"/><path d="M646 150 L669 150" class="de " marker-end="url(#arw_rag_full)"/><path d="M325 171 L325 234" class="de dash" marker-end="url(#arw_rag_full)"/><rect x="144" y="19" width="112" height="42" rx="7" class="dn "/><text x="200" y="32.5" class="dnt">Documents</text><text x="200" y="47.5" class="dnt sub">notes, PDFs</text><rect x="294" y="19" width="112" height="42" rx="7" class="dn "/><text x="350" y="32.5" class="dnt">Split into</text><text x="350" y="47.5" class="dnt sub">chunks</text><rect x="430" y="19" width="140" height="42" rx="7" class="dn acc"/><text x="500" y="32.5" class="dnt">Index</text><text x="500" y="47.5" class="dnt sub">keywords/embeddings</text><rect x="9" y="132" width="112" height="36" rx="7" class="dn "/><text x="65" y="150" class="dnt">Question</text><rect x="139" y="129" width="112" height="42" rx="7" class="dn "/><text x="195" y="142.5" class="dnt">Search</text><text x="195" y="157.5" class="dnt sub">the index</text><rect x="269" y="129" width="112" height="42" rx="7" class="dn "/><text x="325" y="142.5" class="dnt">Top results</text><text x="325" y="157.5" class="dnt sub">best chunks</text><rect x="399" y="129" width="112" height="42" rx="7" class="dn "/><text x="455" y="142.5" class="dnt">Build prompt</text><text x="455" y="157.5" class="dnt sub">question+chunks</text><rect x="534" y="129" width="112" height="42" rx="7" class="dn "/><text x="590" y="142.5" class="dnt">Model answers</text><text x="590" y="157.5" class="dnt sub">from them</text><rect x="669" y="129" width="112" height="42" rx="7" class="dn good"/><text x="725" y="142.5" class="dnt">Answer</text><text x="725" y="157.5" class="dnt sub">with sources</text><rect x="240" y="234" width="170" height="42" rx="7" class="dn bad"/><text x="325" y="247.5" class="dnt">Nothing relevant?</text><text x="325" y="262.5" class="dnt sub">Say so — don&#39;t guess</text><rect x="322.7863636363636" y="86.40163934426229" width="47.2" height="18" rx="4" class="delb"/><text x="346.3863636363636" y="95.40163934426229" class="del">lookup</text></svg><div class="dia-cap">Indexing is done once, ahead of time; answering runs on every question · Tool Calling p.5</div></div>
<h4>Indexing (done once, ahead of time)</h4>
<ol class="list"><li><b>Documents</b> — notes, PDFs, manuals.</li><li><b>Split into chunks</b> — small passages.</li><li><b>Index</b> — by keywords or embeddings.</li></ol>
<h4>Answering (every question)</h4>
<ol class="list"><li><b>Question</b> → <b>Search</b> (match the index) → <b>Top results</b> (best few chunks).</li>
<li><b>Build prompt</b> — question + chunks.</li><li><b>Model</b> answers from them → <b>Answer with sources</b>.</li></ol>
<p><b>If nothing relevant is found: say so instead of guessing.</b> That one rule is what makes retrieval reduce hallucination rather than disguise it.</p>
<p>This is the same RAG idea as in Module 5, built here as a tool an agent can call (e.g. <code>search_docs</code>).</p>`,
 understand:`<p>Chunking matters because the prompt has limited room: you want the three paragraphs that answer the question, not the whole manual.</p>`,
 examples:[],
 examAnswer:`<p>Draw the two-row pipeline, number the steps, and state the 'nothing relevant → say so' rule.</p>`,
 mistakes:[`Putting retrieval after the model. Retrieval happens first; the model only sees the retrieved chunks.`]},

{id:"m6t4", title:"Tool Calling Across APIs and Frameworks (OpenAI, Anthropic, LangChain, MCP)", type:"theory",
 priority:"medium", core:false, marks:[5], src:"Tool Calling pp.8–9",
 tags:["tool","calling","across","apis","frameworks","openai"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Compare how OpenAI and Anthropic APIs express tool calling, and explain how LangChain, LangGraph and MCP standardise tool use.</div>
<div class="scroll"><table class="t"><thead><tr><th>Step</th><th>OpenAI</th><th>Anthropic</th></tr></thead><tbody>
<tr><td>1 · Describe the tool</td><td><code>{"type":"function", "function":{"name":…, "parameters":{…}}}</code> — extra wrapper; key is <b>parameters</b></td><td><code>{"name":…, "input_schema":{…}}</code> — flat; key is <b>input_schema</b></td></tr>
<tr><td>2 · Did the model ask for a tool?</td><td><code>if msg.tool_calls:</code> — is there a list of tool calls?</td><td><code>if resp.stop_reason == "tool_use":</code></td></tr>
<tr><td>3 · Read the inputs</td><td><code>json.loads(call.function.arguments)</code> — arrives as text, so parse it</td><td><code>block.input</code> — already a dict</td></tr>
<tr><td>4 · Send the result back</td><td><code>{"role":"tool", "tool_call_id":…, "content":result}</code> — its own message type</td><td><code>{"role":"user", "content":[{"type":"tool_result", "tool_use_id":…, "content":result}]}</code> — an ordinary user message</td></tr></tbody></table></div>
<p>Same idea, different formats — so integration code is provider-specific. Standardisation solutions:</p>
<div class="scroll"><table class="t"><thead><tr><th>Solution</th><th>Main purpose</th><th>Analogy</th></tr></thead><tbody>
<tr><td><b>LangChain</b></td><td>Common interface for models and tools across LLM providers</td><td>Universal adapter in application code</td></tr>
<tr><td><b>LangGraph</b></td><td>Controls the agent's workflow: multi-step, stateful flows, which tool next, retries, human approval</td><td>Flowchart / control system</td></tr>
<tr><td><b>MCP</b> (Model Context Protocol)</td><td>A common protocol for AI applications to discover and use tools from external servers</td><td>USB-C for AI applications</td></tr></tbody></table></div>
<p>Result: less provider-specific integration work, and more reusable tools and workflows.</p>`,
 understand:`<p>LangChain standardises the code you write, LangGraph standardises the flow between steps, and MCP standardises the connection to tools that live elsewhere.</p>`,
 examples:[],
 examAnswer:`<p>The three-row standardisation table is the core. Add one row of the provider comparison to show you understand why standardisation was needed.</p>`,
 mistakes:[`Calling MCP a framework like LangChain. It is a protocol — it defines how a client and a tool server talk.`]},

{id:"m6t5", title:"Single Agent vs Multi-Agent Design", type:"theory",
 priority:"high", core:true, marks:[10], src:"BE1 slides 9–10, 20 (speaker notes)",
 tags:["single","agent","multi-agent","design"],
 learn:`<div class="note"><span class="note-t">Exam question</span>When should a single agent be split into multiple agents? Explain where one agent breaks, and the gains and costs of a multi-agent design.</div>
<h4>Where one agent breaks</h4>
<ul class="list"><li><b>Context pollution</b> — raw data dumps and old tool outputs crowd the context window, so focus degrades. (A desk piled with every document you ever touched.)</li>
<li><b>Tool confusion</b> — with many look-alike tools (around 25), the model picks the wrong one or mixes up arguments.</li>
<li><b>Mixed responsibilities</b> — one prompt playing planner, analyst and fact-checker is mediocre at all three and hard to debug.</li></ul>
<div class="scroll"><table class="t"><thead><tr><th>What you gain</th><th>What it costs</th></tr></thead><tbody>
<tr><td>Short prompts and a clean context per agent</td><td>More LLM calls: slower and pricier</td></tr>
<tr><td>Test and swap one agent at a time</td><td>Errors can pass from agent to agent</td></tr>
<tr><td>Different models for different roles</td><td>Coordination: handoffs and shared state</td></tr>
<tr><td>Independent verification built in</td><td>Harder to trace end to end</td></tr></tbody></table></div>
<h4>The decision rule</h4>
<p><b>Split an agent when its tools, context or responsibilities start to conflict — not before.</b> Multi-agent is not automatically better; start with one agent.</p>
<p><b>Takeaway:</b> multi-agent is a trade-off, not an upgrade. Reliability comes from architecture — specialisation, independent verification and bounded loops.</p>`,
 understand:`<p>Splitting agents is the same instinct as splitting a long function: do it when one unit is doing three jobs badly, not because more units looks sophisticated.</p>`,
 examples:[],
 examAnswer:`<p>The three failure modes, the gains/costs table, then the decision rule verbatim. For 10 marks, apply the rule to an example (BE1 crossed the line because its sub-tasks need different tools and independent judgement).</p>`,
 mistakes:[`Arguing only for multi-agent. The question expects both sides — the deck's speaker notes say 'present both sides honestly'.`]},

{id:"m6t6", title:"Wiring Agents and Workflow Orchestration", type:"theory",
 priority:"high", core:true, marks:[10], src:"BE1 slides 11–16; Tool Calling p.6",
 tags:["wiring","agents","workflow","orchestration"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Describe the three ways to wire agents (sequential, network, supervisor). Explain workflow orchestration using the BE1 financial-assistant case: its agents, its hybrid pattern and the verifier loop.</div>
<div class="scroll"><table class="t"><thead><tr><th>Pattern</th><th>Picture</th><th>+</th><th>−</th></tr></thead><tbody>
<tr><td><b>Sequential</b></td><td>Assembly line: A → B → C</td><td>Predictable, easy to debug</td><td>Rigid: can't adapt</td></tr>
<tr><td><b>Network</b></td><td>Group chat of experts: any agent hands off to any other</td><td>Flexible, emergent behaviour</td><td>Can wander or loop; hard to audit</td></tr>
<tr><td><b>Supervisor</b></td><td>Manager plus specialists: the manager decides who works next and when to stop</td><td>Adaptive yet controlled</td><td>Extra LLM call; single point of failure</td></tr></tbody></table></div>
<p>The same building blocks — nodes, edges, shared state — express all three. Choose by how much autonomy the task needs; real systems mix them.</p>
<h4>BE1 — fan-out, fan-in</h4>
<div class="dia"><svg viewBox="0 0 830 310" role="img" aria-label="BE1 fan-out / fan-in — dashed arrow: rejected claims re-run only the flagged agent (max 2 retries)"><defs><marker id="arw_be1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M119 155 L131 155" class="de " marker-end="url(#arw_be1)"/><path d="M218.30434782608697 134 L320.7391304347826 58" class="de " marker-end="url(#arw_be1)"/><path d="M246.1206896551724 134 L296.8965517241379 115" class="de " marker-end="url(#arw_be1)"/><path d="M249 155 L286 155" class="de " marker-end="url(#arw_be1)"/><path d="M247.10526315789474 176 L296.0526315789474 194" class="de " marker-end="url(#arw_be1)"/><path d="M218.30434782608697 176 L320.7391304347826 252" class="de " marker-end="url(#arw_be1)"/><path d="M370.82608695652175 58 L479.8695652173913 134" class="de " marker-end="url(#arw_be1)"/><path d="M396.2068965517241 115 L451 134.26060606060605" class="de " marker-end="url(#arw_be1)"/><path d="M404 155 L451 155" class="de " marker-end="url(#arw_be1)"/><path d="M397.10526315789474 194 L451 175.38181818181818" class="de " marker-end="url(#arw_be1)"/><path d="M370.82608695652175 252 L479.8695652173913 176" class="de " marker-end="url(#arw_be1)"/><path d="M569 155 L586 155" class="de " marker-end="url(#arw_be1)"/><path d="M704 155 L725 155" class="de " marker-end="url(#arw_be1)"/><path d="M505.0370599968911 176 Q478.9613395519355 286.3358350092988 404 277.1947195270839" class="de dash" marker-end="url(#arw_be1)"/><rect x="1" y="137" width="118" height="36" rx="7" class="dn "/><text x="60" y="155" class="dnt">Question</text><rect x="131" y="134" width="118" height="42" rx="7" class="dn acc"/><text x="190" y="147.5" class="dnt">Planner</text><text x="190" y="162.5" class="dnt sub">routes work</text><rect x="286" y="22" width="118" height="36" rx="7" class="dn "/><text x="345" y="40" class="dnt">Macro</text><rect x="286" y="79" width="118" height="36" rx="7" class="dn "/><text x="345" y="97" class="dnt">Market breadth</text><rect x="286" y="137" width="118" height="36" rx="7" class="dn "/><text x="345" y="155" class="dnt">Market cycle</text><rect x="286" y="194" width="118" height="36" rx="7" class="dn "/><text x="345" y="212" class="dnt">Microfish</text><rect x="286" y="252" width="118" height="36" rx="7" class="dn "/><text x="345" y="270" class="dnt">Microcap forensic</text><rect x="451" y="134" width="118" height="42" rx="7" class="dn warn"/><text x="510" y="147.5" class="dnt">Verifier</text><text x="510" y="162.5" class="dnt sub">checks claims</text><rect x="586" y="137" width="118" height="36" rx="7" class="dn "/><text x="645" y="155" class="dnt">Report</text><rect x="725" y="137" width="90" height="36" rx="7" class="dn good"/><text x="770" y="155" class="dnt">Output</text></svg><div class="dia-cap">The Planner fans out to five analysts in parallel; results fan in to the Verifier. Dashed: a rejected claim re-runs only the flagged agent (max 2 retries) · BE1 slide 12</div></div>
<div class="scroll"><table class="t"><thead><tr><th>Agent team</th><th>Job</th><th>Tools</th><th>Why</th></tr></thead><tbody>
<tr><td><b>Planner</b></td><td>Splits a question into tasks and picks the analysts</td><td>None — pure reasoning</td><td>Planning needs no data; tool-free so it cannot act prematurely</td></tr>
<tr><td><b>Regime team</b> (macro, breadth, cycle)</td><td>Read the market's "weather"</td><td>Market data, indicators</td><td>One lens each, in parallel</td></tr>
<tr><td><b>Small-stock team</b> (Microfish, Forensic)</td><td>Spot early signals; audit for red flags</td><td>Filings, price–volume data</td><td>Different data, different mindset</td></tr>
<tr><td><b>Verifier + Report</b></td><td>Check every claim, then write the report</td><td>Read-only tool log, report template</td><td>No grading your own homework</td></tr></tbody></table></div>
<h4>A hybrid of three patterns</h4>
<ul class="list"><li><b>Hierarchical supervisor</b> — the Planner decides who works on what.</li>
<li><b>Parallel fan-out / fan-in</b> — analysts run at once; results merge.</li>
<li><b>Sequential + reflection</b> — verify, then report; retry if rejected (max 2 retries, re-running only the flagged agent).</li></ul>
<p>A free-form network is avoided because open-ended handoffs are hard to audit.</p>
<h4>Why the verifier exists — a traced example</h4>
<p>"Does Company X show red-flag indicators?" → Planner splits it → Regime team: stormy (high volatility) → Forensic: revenue grew but cash collected shrank, <i>needs review</i> → <b>Verifier: the draft says cash fell 40%, the tool log says 31% — rejected</b> → Forensic fixes the number, Verifier approves, Report writes the note.</p>
<p>The generic version (Tool Calling p.6) is the same shape: an <b>orchestrator</b> (plans, routes, retries, self-checks) over a retriever, an API agent, an analyst (maths done in code) and a writer, with a <b>critic</b> that checks each claim (revise up to 2 rounds) and <b>human approval</b> before saving.</p>`,
 understand:`<p>Orchestration is deciding who acts, in what order and with what information. The verifier works only because it checks claims against the recorded tool log rather than its own memory — otherwise it would hallucinate too.</p>`,
 examples:[],
 examAnswer:`<p>The three-pattern table, then a drawn architecture with the agents labelled, then one sentence each on the hybrid's three parts. The 40% vs 31% trace is the best single illustration of verification.</p>
<div class="note"><span class="note-t">Diagram</span>Draw Question → Planner → five parallel analyst boxes → Verifier → Report, with a dashed arrow from Verifier back to one analyst labelled 'rejected: re-run (≤ 2)'.</div>`,
 mistakes:[`Saying 'the verifier is another LLM so it can also hallucinate' and stopping there. State what makes it reliable: it compares against the logged tool outputs.`]},

{id:"m6t7", title:"Shared State, Guardrails and Checkpoints", type:"theory",
 priority:"medium", core:false, marks:[5], src:"BE1 slides 15, 17–18, 21",
 tags:["shared","state","guardrails","checkpoints"],
 learn:`<div class="note"><span class="note-t">Exam question</span>How do agentic workflows stay safe and recoverable? Explain shared state, the four guardrail layers, and checkpoints with an audit trail.</div>
<h4>Shared state — the clipboard</h4>
<p>One typed, structured object is the <b>single source of truth</b>: question, plan, regime view, small-cap findings, verdict, audit log and memory. <b>Agents read only what they need and write only their own field</b>, so parallel runs never collide — and context pollution is solved (Forensic never sees Regime's raw data, only its summary). Every agent appends to an <b>append-only audit log</b>.</p>
<h4>Guardrails — four layers</h4>
<div class="scroll"><table class="t"><thead><tr><th>Layer</th><th>What it does</th><th>Where it lives</th></tr></thead><tbody>
<tr><td><b>Input validation</b></td><td>Typed schemas reject malformed tool arguments before any code runs</td><td>Middleware</td></tr>
<tr><td><b>Capability limits</b></td><td>Each agent has an allow-list of tools; Planner and Verifier can't fetch new data</td><td>Agent definitions</td></tr>
<tr><td><b>Grounding check</b></td><td>Every number traces to a logged tool output; forecasts show uncertainty</td><td>The Verifier</td></tr>
<tr><td><b>Loop and cost limits</b></td><td>Max 2 retries, tool-call caps, timeouts; if exhausted, the answer is labelled <i>unverified</i></td><td>The router</td></tr></tbody></table></div>
<p>Plus scope limits: a research prototype — no investment advice, no live trading; forensic output says "needs review", never "fraud". Human-in-the-loop approval is the natural next step for high-stakes outputs.</p>
<h4>Checkpoints and audit trail</h4>
<p>State is saved after every step, so a crash <b>resumes from the last save, not from scratch</b>, and any run can be <b>replayed step by step</b>. Memory keeps run history, assumptions and past mistakes.</p>
<p><b>What failure worries the BE1 team most?</b> Bad data entering at the first tool and every agent trusting it — so they validate at the tool layer.</p>`,
 understand:`<p>Guardrails are layered so that each one catches what the previous one misses: bad arguments, wrong tools, unsupported claims, and runaway loops.</p>`,
 examples:[],
 examAnswer:`<p>The four-layer table, then two sentences on shared state and checkpointing.</p>`,
 mistakes:[`Listing 'prompt instructions' as the guardrail. A rule in a prompt can be ignored; these layers are enforced by code.`]},

{id:"m6t8", title:"Human-in-the-Loop, Human-on-the-Loop and Fully Autonomous", type:"theory",
 priority:"high", core:true, marks:[10], src:"Human-in-the-Loop deck pp.2–8, 12–13",
 tags:["human-in-the-loop","human-on-the-loop","fully","autonomous"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Compare human-in-the-loop, human-on-the-loop and fully autonomous decision-making. Which suits a suspicious device on the college network, and why?</div>
<p><b>Would you let an AI do this alone?</b> Drive you home at night · assess your medical scan · sort your spam folder · reject your job application. Your answers differ, and that difference is the topic.</p>
<div class="dia"><svg viewBox="0 0 800 110" role="img" aria-label="Three levels of human involvement — less human involvement from left to right"><defs><marker id="arw_autonomy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M235 55 L285 55" class="de " marker-end="url(#arw_autonomy)"/><path d="M515 55 L565 55" class="de " marker-end="url(#arw_autonomy)"/><rect x="5" y="34" width="230" height="42" rx="7" class="dn good"/><text x="120" y="47.5" class="dnt">Human-in-the-loop</text><text x="120" y="62.5" class="dnt sub">AI recommends, human approves</text><rect x="285" y="34" width="230" height="42" rx="7" class="dn warn"/><text x="400" y="47.5" class="dnt">Human-on-the-loop</text><text x="400" y="62.5" class="dnt sub">system acts, human supervises</text><rect x="565" y="34" width="230" height="42" rx="7" class="dn bad"/><text x="680" y="47.5" class="dnt">Fully autonomous</text><text x="680" y="62.5" class="dnt sub">acts within designed scope</text></svg><div class="dia-cap">Three levels of human involvement, from most to least human control · HITL deck p.3</div></div>
<ul class="list"><li><b>Human-in-the-loop</b> — AI recommends; a human approves, rejects or corrects <b>before</b> the action proceeds.</li>
<li><b>Human-on-the-loop</b> — the system acts on its own; a human supervises and can step in.</li>
<li><b>Fully autonomous (human-out-of-the-loop)</b> — the system selects and executes actions within its designed scope and constraints. "Fully autonomous" still means <b>limited by design, permissions, environment and safety constraints</b>.</li></ul>
<div class="scroll"><table class="t"><thead><tr><th></th><th>Human-in-the-loop</th><th>Fully autonomous</th></tr></thead><tbody>
<tr><td>Decision</td><td>AI assists; human approves</td><td>System selects and executes</td></tr>
<tr><td>Speed</td><td>Slower because of review</td><td>Fast, continuous</td></tr>
<tr><td>Main advantage</td><td>Judgement and context</td><td>Speed and scalability</td></tr>
<tr><td>Main risk</td><td>Slow review; over-trusting the AI</td><td>Errors spread before intervention</td></tr>
<tr><td>Best suited for</td><td>High-impact, expert decisions</td><td>Well-defined, validated tasks</td></tr></tbody></table></div>
<h4>Healthcare</h4>
<p>The AI analyses a scan and flags a possible abnormality; the clinician reviews it, weighs the patient's context, and decides. If it goes wrong — a missed finding or a false alarm — the human check is the safety net. <b>Risk to watch: the reviewer trusting the AI too much.</b></p>
<h4>Scenario — suspicious device on the college network (cybersecurity)</h4>
<ul class="list"><li><b>HITL:</b> AI flags the threat and recommends blocking; an analyst checks the evidence and approves.</li>
<li><b>Autonomous:</b> the system blocks the device under a predefined policy and logs the action.</li>
<li><b>Hybrid (the strongest answer):</b> block <b>high-confidence</b> threats automatically for a <b>limited time</b>; escalate uncertain or high-impact cases to an expert reviewer.</li></ul>
<p>Why hybrid: an attack spreads in seconds, so waiting for a human is costly; but blocking a professor's laptop before an exam is also costly. A time-limited block is <b>reversible</b>, and escalation keeps a human on the hard cases.</p>
<h4>Limits, safety and accountability</h4>
<p>Unfamiliar situations and bad inputs can cause unexpected behaviour · some decisions are hard to explain or audit · <b>who is responsible</b> when the system gets it wrong? · <b>can the action be undone</b>, and is there a clear escalation to a human?</p>
<p><b>The goal is the right level of autonomy for the task, the risk and the cost of a wrong decision.</b></p>`,
 understand:`<p>Pick the level by asking two questions: how bad is a wrong decision, and can it be undone? Bad and irreversible → human in the loop. Minor and reversible → autonomy is fine.</p>`,
 examples:[],
 examAnswer:`<p>Define the three levels, give the comparison table, then answer the scenario with the hybrid option and justify using risk and reversibility.</p>
<div class="note"><span class="note-t">Diagram</span>A three-box spectrum from human-in-the-loop to fully autonomous, with 'less human involvement' on the arrow.</div>`,
 mistakes:[`Treating 'fully autonomous' as 'unconstrained'. The deck stresses it still operates within designed scope, permissions and safety limits.`]},

{id:"m6t9", title:"Autonomous Decision-Making Systems", type:"theory",
 priority:"high", core:true, marks:[5], src:"HITL deck pp.9, 11",
 tags:["autonomous","decision-making","systems"],
 learn:`<div class="note"><span class="note-t">Exam question</span>How does an autonomous decision-making system decide? Explain the five-step cycle and apply it to an autonomous vehicle such as Tesla FSD.</div>
<div class="dia"><svg viewBox="0 0 700 200" role="img" aria-label="How an autonomous system decides"><defs><marker id="arw_auto_loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M140 50 L195 50" class="de " marker-end="url(#arw_auto_loop)"/><path d="M315 50 L370 50" class="de " marker-end="url(#arw_auto_loop)"/><path d="M490 50 L550 50" class="de " marker-end="url(#arw_auto_loop)"/><path d="M559.4090909090909 71 L395.5909090909091 139" class="de " marker-end="url(#arw_auto_loop)"/><path d="M294.4090909090909 139 L130.5909090909091 71" class="de " marker-end="url(#arw_auto_loop)"/><rect x="20" y="29" width="120" height="42" rx="7" class="dn "/><text x="80" y="42.5" class="dnt">1 Perceive</text><text x="80" y="57.5" class="dnt sub">sensors, logs</text><rect x="195" y="29" width="120" height="42" rx="7" class="dn "/><text x="255" y="42.5" class="dnt">2 Analyse</text><text x="255" y="57.5" class="dnt sub">estimate outcomes</text><rect x="370" y="29" width="120" height="42" rx="7" class="dn acc"/><text x="430" y="42.5" class="dnt">3 Select</text><text x="430" y="57.5" class="dnt sub">rules/policy/plan</text><rect x="550" y="29" width="120" height="42" rx="7" class="dn "/><text x="610" y="42.5" class="dnt">4 Execute</text><text x="610" y="57.5" class="dnt sub">brake, isolate</text><rect x="285" y="139" width="120" height="42" rx="7" class="dn good"/><text x="345" y="152.5" class="dnt">5 Observe</text><text x="345" y="167.5" class="dnt sub">feedback</text><rect x="188.9" y="96" width="47.2" height="18" rx="4" class="delb"/><text x="212.5" y="105" class="del">repeat</text></svg><div class="dia-cap">A prediction model stops at step 2; a decision-making system links its assessment to an action · HITL deck p.9</div></div>
<ol class="list"><li><b>Perceive</b> — collect data from sensors, cameras, logs.</li>
<li><b>Analyse</b> — interpret data, estimate possible outcomes.</li>
<li><b>Select</b> — choose via rules, a learned policy or planning.</li>
<li><b>Execute</b> — brake, adjust a machine, isolate a device.</li>
<li><b>Observe</b> — use feedback, then repeat the cycle.</li></ol>
<p><b>A prediction model stops at step 2. A decision-making system links its assessment to an action.</b></p>
<h4>Case study — Tesla FSD and Robotaxi</h4>
<div class="scroll"><table class="t"><tbody>
<tr><td><b>Problem</b></td><td>Drive safely among other road users</td></tr>
<tr><td><b>System</b></td><td>Camera-based vision detects road users and predicts their movements</td></tr>
<tr><td><b>Decision</b></td><td>Selects actions such as braking or changing speed</td></tr>
<tr><td><b>Autonomy level</b></td><td>FSD (Supervised) is <b>Level 2</b>: the driver stays responsible. Robotaxi is Tesla's driverless step.</td></tr>
<tr><td><b>Evaluation</b></td><td>Tesla's safety claims vs regulator scrutiny (NHTSA probe)</td></tr></tbody></table></div>
<p>This cycle is the Module 1 agent loop (perceive → act) with planning (Module 4) inside step 3.</p>`,
 understand:`<p>The five steps are the agent function from Module 1 written out in engineering terms. What makes it 'autonomous' is that step 4 happens without waiting for a human.</p>`,
 examples:[],
 examAnswer:`<p>Draw the cycle, define each step in one line, then fill the five-row case table for the given system.</p>`,
 mistakes:[`Calling Tesla FSD 'fully autonomous'. The deck states FSD (Supervised) is Level 2 — the driver is responsible.`]},

{id:"m6t10", title:"AI in Smart Manufacturing: Industry 4.0 and 5.0", type:"theory",
 priority:"medium", core:true, marks:[5], src:"HITL deck pp.10, 13",
 tags:["smart","manufacturing","industry"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Assess the role of AI in smart manufacturing. How should autonomy be matched to risk on a factory floor, and how does Industry 5.0 differ from Industry 4.0?</div>
<h4>Smart manufacturing — autonomy in steps</h4>
<div class="scroll"><table class="t"><thead><tr><th>The AI detects</th><th>It could</th><th>Autonomy</th></tr></thead><tbody>
<tr><td>A defective product</td><td>Alert an operator</td><td><b>Human decides</b></td></tr>
<tr><td>Early signs of machine failure</td><td>Recommend maintenance</td><td><b>Human approves</b></td></tr>
<tr><td>A small process drift</td><td>Adjust settings automatically</td><td><b>System acts, human monitors</b></td></tr></tbody></table></div>
<p><b>Same factory, different levels of autonomy, matched to risk.</b> The small drift is low-impact and reversible, so the system acts; scrapping product or stopping a line is costlier, so a human stays in the decision.</p>
<h4>Industry 4.0 vs Industry 5.0</h4>
<p><b>Industry 4.0 stresses automation; Industry 5.0 adds human-centricity, sustainability and resilience.</b> Safety, accountability, bias and reliability decide when a human must stay involved.</p>
<p>Related Module 4 material: the warehouse-robot multi-agent planning case (task allocation, path coordination, collision avoidance, a shared database) is a smart-factory logistics system.</p>
<div class="note warn"><b>Limited source material.</b> LO 6.2 also names <i>IoT integration</i> and <i>human–AI collaboration</i>, and the self-learning list names <i>cobots in manufacturing</i>. The uploaded decks cover only the autonomy table and the one-line Industry 4.0/5.0 contrast above. The Coverage tab flags this.</div>`,
 understand:`<p>The table is the whole argument: autonomy is not a property of the factory but of each decision in it.</p>`,
 examples:[],
 examAnswer:`<p>The three-row autonomy table, the 'matched to risk' sentence, and the 4.0 vs 5.0 line. Add the warehouse-robot MAS as a concrete smart-factory example.</p>`,
 mistakes:[`Describing Industry 5.0 as 'more automation than 4.0'. It is the opposite emphasis: bringing the human back to the centre.`]},

{id:"m6t11", title:"ClarifAI: An End-to-End Responsible AI System", type:"theory",
 priority:"high", core:true, marks:[10], src:"ClarifAI slides 1–8",
 tags:["clarifai","end-to-end","responsible","system"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Describe ClarifAI as an end-to-end responsible AI system for student loan and scholarship decisions: its pipeline, consensus scoring, explanations, recourse, fairness monitoring and human oversight.</div>
<p><b>Problem.</b> Black-box AI shows "Rejected" without a clear reason; applicants cannot see which factors mattered or what they could improve. ClarifAI combines rules, learned probability, SHAP, LIME, CARE and human review into one traceable decision.</p>
<div class="dia"><svg viewBox="0 0 820 95" role="img" aria-label="ClarifAI decision flow"><defs><marker id="arw_clarifai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M124 47 L141 47" class="de " marker-end="url(#arw_clarifai)"/><path d="M259 47 L281 47" class="de " marker-end="url(#arw_clarifai)"/><path d="M399 47 L421 47" class="de " marker-end="url(#arw_clarifai)"/><path d="M539 47 L561 47" class="de " marker-end="url(#arw_clarifai)"/><path d="M679 47 L698 47" class="de " marker-end="url(#arw_clarifai)"/><rect x="6" y="29" width="118" height="36" rx="7" class="dn "/><text x="65" y="47" class="dnt">Application</text><rect x="141" y="26" width="118" height="42" rx="7" class="dn "/><text x="200" y="39.5" class="dnt">Preprocess</text><text x="200" y="54.5" class="dnt sub">11 features</text><rect x="281" y="26" width="118" height="42" rx="7" class="dn acc"/><text x="340" y="39.5" class="dnt">Rules + MLP</text><text x="340" y="54.5" class="dnt sub">in parallel</text><rect x="421" y="26" width="118" height="42" rx="7" class="dn "/><text x="480" y="39.5" class="dnt">Consensus</text><text x="480" y="54.5" class="dnt sub">50 : 50</text><rect x="561" y="26" width="118" height="42" rx="7" class="dn warn"/><text x="620" y="39.5" class="dnt">Explain</text><text x="620" y="54.5" class="dnt sub">SHAP + LIME</text><rect x="698" y="26" width="118" height="42" rx="7" class="dn good"/><text x="757" y="39.5" class="dnt">Review</text><text x="757" y="54.5" class="dnt sub">CARE · humans</text></svg><div class="dia-cap">One decision flow, two engines, one accountable review · ClarifAI slide 3</div></div>
<h4>Inputs and model</h4>
<p><b>11 features</b>: academic score; annual income, requested loan amount, loan-to-income ratio, existing debt ratio; credit score, credit history, previous default; employment years, missing documents, eligibility criteria. <b>Preprocessing:</b> remove duplicates, cap extremes with IQR, fill missing values with the median, normalise to 0–1. <b>MLP:</b> 11 inputs → 32 ReLU → 16 ReLU → 1 sigmoid output (approval probability); Adam, learning rate 0.008, binary cross-entropy, 60 epochs.</p>
<h4>Consensus scoring</h4>
<div class="formula">Consensus = ( Rule Score + Neural Network Probability ) / 2</div>
<p>The <b>rule engine</b> flags hard failures: credit score below 580, previous default, or DTI above 40%.</p>
<div class="scroll"><table class="t"><thead><tr><th>Outcome</th><th>Threshold</th><th>Condition</th><th>Action</th></tr></thead><tbody>
<tr><td>Approve</td><td>≥ 60%</td><td>No hard-rule failure</td><td>Proceed</td></tr>
<tr><td>Needs review</td><td>55–59%</td><td>Or missing verification documents</td><td>Human review</td></tr>
<tr><td>Reject</td><td>Any score</td><td>Hard rule fails</td><td>Explain decision</td></tr></tbody></table></div>
<p><b>Reported metrics:</b> accuracy 78.13%, precision 67.57%, recall 57.79%, F1 0.6230, ROC-AUC 0.8373 — reported project evidence, not proof of production readiness.</p>
<h4>Explain → recourse → fairness → oversight</h4>
<ul class="list"><li><b>SHAP + LIME</b> — SHAP for feature contributions (individual and dataset-wide), LIME for intuitive local conditions (R² = 0.942 reported fidelity).</li>
<li><b>CARE engine</b> (Counterfactual Actionable Recourse &amp; Equity) — possible next steps: improve credit score, reduce the requested amount, submit missing documents, consider an eligible co-borrower.</li>
<li><b>Fairness monitoring</b> — Disparate Impact Ratio 0.92 vs the 0.80 benchmark; low income plus missing documentation triggers extra human review.</li>
<li><b>Human approval</b> — authorised humans review adverse and borderline cases. A local LLM (Ollama) can write short summaries.</li></ul>
<p><b>Principle:</b> a decision should be understandable enough to review, challenge and improve. The system supports decision-making rather than replacing oversight.</p>`,
 understand:`<p>ClarifAI is Modules 5 and 6 in one system: XAI (SHAP, LIME), Responsible AI (fairness, recourse) and human-in-the-loop autonomy, applied to a real high-stakes domain — finance and education.</p>`,
 examples:[],
 examAnswer:`<p>Draw the six-stage flow, give the consensus formula and decision table, then one line each for SHAP/LIME, CARE, fairness and human review.</p>
<div class="note"><span class="note-t">Diagram</span>The six-box flow: Application → Preprocess → Rules + MLP → Consensus → Explain → Review.</div>`,
 mistakes:[`Quoting the metrics as proof the system is fair or ready. The deck explicitly labels them reported project figures, not proof of production readiness.`]},

{id:"m6t12", title:"Multi-Agent Systems as an Emerging Paradigm", type:"theory",
 priority:"medium", core:false, marks:[5], src:"Planning slides 55–71; BE1 slides 9–14; Module 1 m1t8",
 tags:["multi-agent","systems","emerging","paradigm"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Identify multi-agent systems as an emerging AI paradigm. How do multi-agent systems appear in smart ecosystems, and how does agentic AI extend the agent concept from Module 1?</div>
<p><b>From Module 1:</b> Agentic AI differs from traditional AI on four axes — <b>autonomy</b>, <b>memory</b>, <b>tool usage</b> and <b>goal orientation</b>. Module 6 shows those four axes in deployed systems:</p>
<div class="scroll"><table class="t"><thead><tr><th>Axis</th><th>Where it appears in Module 6</th></tr></thead><tbody>
<tr><td>Autonomy</td><td>Human-in-the-loop vs autonomous decision-making; autonomy matched to risk</td></tr>
<tr><td>Memory</td><td>Shared state, audit log, checkpoints (BE1)</td></tr>
<tr><td>Tool usage</td><td>API calling, retrieval and code tools; schemas, middleware, MCP</td></tr>
<tr><td>Goal orientation</td><td>Planner/orchestrator decomposes a user goal and routes sub-tasks</td></tr></tbody></table></div>
<h4>Multi-agent systems in smart ecosystems</h4>
<p>From the Planning deck: coordinating multiple robots (warehouses), traffic-flow optimisation, supply-chain logistics, strategy agents in multiplayer games, and smart grids. From the Chpt 6 decks: specialist LLM agents (planner, analysts, verifier, critic) collaborating on one task. Benefits are efficiency, robustness, scalability and flexibility; costs are communication overhead, coordination complexity, and privacy and security.</p>
<div class="note warn"><b>Limited source material.</b> LO 6.3 also names <b>Edge AI</b>, <b>quantum AI</b> and <b>AI for the SDGs</b>, and the Module 4 self-learning topic is <b>Google Maps as a multi-agent planning system</b>. None of these appear in the uploaded decks, so no notes have been written for them. See the Coverage tab.</div>`,
 understand:`<p>A multi-agent system of LLM agents and a multi-agent system of warehouse robots are the same idea: autonomous units, a shared environment, communication, and a collaboration strategy.</p>`,
 examples:[],
 examAnswer:`<p>The four-axis table linking Module 1 to Module 6, then three smart-ecosystem examples with one benefit and one challenge.</p>`,
 mistakes:[`Equating 'agentic' with 'multi-agent'. A single agent can be agentic (autonomous, with memory and tools); multi-agent is about several of them working together.`]},

{id:"m6t14", title:"Tool Schema and Tool-Call Trace", type:"numerical",
 priority:"high", core:true, marks:[5], src:"Tool Calling pp.3–4, 7–8; BE1 slides 6–7, 17",
 tags:["tool","schema","tool-call","trace"],
 concept:`Two skills: write the JSON schema the model is shown (name, description, typed parameters, required list), and trace the message sequence for a question. Validation happens in your code, between the model's request and the real call.`,
 formula:`<div class="fx-pre">Tool definition:  { "name", "description", "parameters": { "type": "object",
                    "properties": { arg: {"type": …} }, "required": [ … ] } }

Loop:  question + tools → model → tool-call request → validate → run code
       → tool result → model → final answer</div>`,
 variables:[{v:"name", m:`how the model refers to the tool`},
  {v:"description", m:`when to use it — the model reads this to choose`},
  {v:"parameters", m:`typed inputs; 'required' marks the mandatory ones`}],
 worked:{
  problem:`<strong>"What will the weather be in Thane for the next 3 days?".</strong>`,
  steps:[`<b>Schema the model sees:</b><br><code>{"name":"get_weather","description":"Get the forecast for a city","parameters":{"type":"object","properties":{"city":{"type":"string"},"days":{"type":"integer"}},"required":["city"]}}</code>`,
   `<b>1–2.</b> User asks; your app sends the messages and the tool list to the model.`,
   `<b>3.</b> The model replies with a request, not an answer: <code>{"name":"get_weather","arguments":{"city":"Thane","days":3}}</code>`,
   `<b>Validate:</b> city is a string ✓, days is an integer ✓, required city present ✓.`,
   `<b>4–5.</b> Your code sends the HTTP request to the weather API and gets the data back (e.g. 30 °C, 10% rain).`,
   `<b>6–8.</b> Your code returns a tool-result message; the model writes the final answer grounded in that data; the app shows it to the user.`],
  answer:`Eight messages, and the model writes only two of them: the tool-call request and the final text. Everything else is your code.`,
  check:`Draw the sequence diagram. Every arrow to or from the Weather API must touch 'Your code', never 'Model'.`},
 learn:"",
 mistakes:[`Writing a description like "weather tool". The model chooses tools by reading the description — say when to use it.`,
  `Leaving 'required' out, so the model may call the tool with no city.`,
  `Skipping validation — malformed arguments must be rejected before any code runs (guardrail layer 1).`],
 practice:[
  {d:"Easy", q:`Write a tool definition for get_attendance that returns a student's attendance for a month. student_id and month are required; subject is optional.`,
   s:`<code>{"name":"get_attendance","description":"Get a student's attendance percentage for a given month, optionally for one subject","parameters":{"type":"object","properties":{"student_id":{"type":"string"},"month":{"type":"string"},"subject":{"type":"string"}},"required":["student_id","month"]}}</code><br><br>
   Marks go to the three parts (name, description that says <i>when</i>, typed parameters) and the correct required list.`},
  {d:"Moderate", q:`The model returns these calls for get_weather. Which should your middleware reject, and why? (a) {"city":"Pune"} (b) {"days":3} (c) {"city":"Pune","days":"three"} (d) {"city":"Pune","days":2}`,
   s:`(a) <b>Accept</b> — city present; days is optional.<br>
   (b) <b>Reject</b> — the required field city is missing.<br>
   (c) <b>Reject</b> — days must be an integer, not the string "three".<br>
   (d) <b>Accept</b>.<br><br>
   This is guardrail layer 1, input validation: typed schemas reject malformed tool arguments before any code runs.`},
  {d:"Exam-level", q:`A user asks: 'What is 48,371 × 9,206, and what does our college handbook say about re-exams?' Which tools should the agent use, in what order, and why can't the model answer alone?`,
   s:`<b>Why not alone:</b> exact maths is a built-in weakness (it predicts text, not sums), and the handbook is private data the model never saw.<br><br>
   <b>Tools:</b> (1) a <b>code/calculator</b> tool for 48,371 × 9,206 = 445,303,426, computed exactly by Python; (2) <b>retrieval</b> (search_docs) over the handbook, returning the top chunks about re-exams. The two calls are independent, so they can run in either order or in parallel.<br><br>
   <b>Answer:</b> the model writes the reply from the two tool results. If retrieval finds nothing relevant, it says so instead of guessing.`}]},

{id:"m6t15", title:"Choosing the Level of Autonomy", type:"numerical",
 priority:"high", core:true, marks:[5], src:"HITL deck pp.2–13",
 tags:["choosing","level","autonomy"],
 concept:`For each decision, ask how bad a wrong answer is, whether it can be undone, how well-defined and validated the task is, and how fast it must happen. Those four answers place it at human-in-the-loop, human-on-the-loop or fully autonomous — or a hybrid.`,
 formula:`<div class="fx-pre">High impact  OR  irreversible  OR  needs expert judgement       →  Human-in-the-loop
Moderate impact, reversible, speed matters, human can intervene  →  Human-on-the-loop
Low impact, reversible, well-defined and validated task          →  Fully autonomous (within designed scope)
Mixed confidence                                                  →  Hybrid: act on high-confidence, escalate the rest</div>`,
 variables:[{v:"Impact", m:`the cost of a wrong decision`},
  {v:"Reversibility", m:`can the action be undone?`},
  {v:"Validation", m:`has the task been tested in these conditions?`},
  {v:"Escalation", m:`is there a clear path to a human?`}],
 worked:{
  problem:`<strong>"Would you let an AI do this alone?" (HITL deck p.2).</strong>`,
  steps:[`<b>Sort your spam folder</b> → low impact, reversible (you can check the spam folder), well-defined → <b>fully autonomous</b>.`,
   `<b>Assess your medical scan</b> → high impact, a missed finding can be irreversible, needs expert judgement → <b>human-in-the-loop</b>: AI flags, clinician decides. Watch for the reviewer over-trusting the AI.`,
   `<b>Reject your job application</b> → high impact on a person, contestable, bias risk → <b>human-in-the-loop</b>; AI may shortlist, a human decides rejections.`,
   `<b>Drive you home at night</b> → safety-critical and real-time, so a human cannot approve each action → <b>human-on-the-loop</b> today (Tesla FSD Supervised is Level 2: the driver stays responsible); fully driverless only where validated.`],
  answer:`Spam: autonomous · Scan: HITL · Job rejection: HITL · Driving: human-on-the-loop (supervised).`,
  check:`Every answer should cite at least two of: impact, reversibility, validation, speed.`},
 learn:"",
 mistakes:[`Choosing HITL for everything 'to be safe'. Review is slow and costly, and reviewers over-trust the AI anyway — the right level depends on the task.`,
  `Treating autonomy as all-or-nothing for a system. The same factory uses different levels for different decisions.`],
 practice:[
  {d:"Moderate", q:`Smart factory: assign an autonomy level to (a) a defective product on the line, (b) early signs of machine failure, (c) a small process drift.`,
   s:`(a) Alert an operator → <b>human decides</b>.<br>
   (b) Recommend maintenance → <b>human approves</b>.<br>
   (c) Adjust settings automatically → <b>system acts, human monitors</b>.<br>
   Same factory, different levels of autonomy, matched to risk (HITL deck p.10).`},
  {d:"Exam-level", q:`A suspicious device appears on the college network. Compare HITL and autonomous responses, then propose and justify a hybrid.`,
   s:`<b>HITL:</b> AI flags the threat and recommends blocking; an analyst checks the evidence and approves. Accurate but slow — an attack can spread while waiting.<br>
   <b>Autonomous:</b> the system blocks under a predefined policy and logs it. Fast, but a false positive blocks a legitimate device, and errors spread before anyone intervenes.<br>
   <b>Hybrid:</b> block <b>high-confidence</b> threats automatically for a <b>limited time</b>; escalate uncertain or high-impact cases to an expert.<br>
   <b>Why:</b> the time-limited block is <i>reversible</i>, speed is kept where confidence is high, and human judgement is kept where it matters. Accountability is clear because every automatic block is logged.`},
  {d:"Moderate", q:`An AI for student scholarships rejects applications automatically when its score is low. Using the 'limits, safety and accountability' checklist, critique it.`,
   s:`<b>Unfamiliar situations</b> — unusual applicants (e.g. a non-traditional income record) may be scored unpredictably.<br>
   <b>Explainability</b> — a bare rejection cannot be understood or challenged.<br>
   <b>Accountability</b> — no human answers for a wrong rejection.<br>
   <b>Reversibility</b> — a missed scholarship deadline cannot be undone; there is no escalation path.<br><br>
   Fix: ClarifAI's design — explanations (SHAP/LIME), recourse suggestions (CARE), fairness monitoring and human review of adverse and borderline cases.`}]},

{id:"m6t16", title:"Multi-Agent Workflow Design Drill", type:"numerical",
 priority:"high", core:true, marks:[10], src:"BE1 slides 9–18; Tool Calling p.6",
 tags:["multi-agent","workflow","design","drill"],
 concept:`Design questions follow a fixed path: decide whether to split at all, name the agents and give each one job and a small tool allow-list, choose the wiring pattern, define shared state, and add the verification step and guardrails. Then draw it.`,
 formula:`<div class="fx-pre">1. Split?      only if tools, context or responsibilities conflict
2. Agents      one job each · minimal tool allow-list · short prompt
3. Wiring      sequential · network · supervisor (or a justified hybrid)
4. State       typed shared state; each agent writes only its own field; append-only audit log
5. Verify      independent checker against the tool log; bounded retries (e.g. ≤ 2)
6. Guardrails  input validation · capability limits · grounding check · loop/cost limits
7. Human       approval for high-stakes outputs</div>`,
 variables:[{v:"Fan-out / fan-in", m:`parallel specialists whose results are merged`},
  {v:"Verifier / critic", m:`checks claims against recorded tool outputs, never its own memory`}],
 worked:{
  problem:`<strong>A research assistant that answers questions about a GitHub project from its docs and live repository data (Tool Calling p.6).</strong>`,
  steps:[`<b>Split?</b> Yes — the work needs different tools (document search, a live API, computation) and an independent check.`,
   `<b>Agents:</b> Orchestrator (plans, routes, retries — no data tools) · Retriever (<code>search_docs</code>) · API agent (<code>github_repo</code>) · Analyst (maths done in code) · Writer (writes only from the facts) · Critic (checks each claim).`,
   `<b>Wiring:</b> supervisor (orchestrator) with fan-out to the specialists, then a sequential writer → critic loop (revise up to 2 rounds).<div class="dia"><svg viewBox="0 0 820 345" role="img" aria-label="Orchestrated tool-using agents with a critic and human approval"><defs><marker id="arw_orchestrator" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M147.5 40 L260 40" class="de " marker-end="url(#arw_orchestrator)"/><path d="M305 61 L140 124" class="de " marker-end="url(#arw_orchestrator)"/><path d="M337 61 L268 124" class="de " marker-end="url(#arw_orchestrator)"/><path d="M369 61 L396 124" class="de " marker-end="url(#arw_orchestrator)"/><path d="M399 61 L516 124" class="de " marker-end="url(#arw_orchestrator)"/><path d="M622.5 145 L677.5 145" class="de " marker-end="url(#arw_orchestrator)"/><path d="M715.6617647058823 166 Q650 213 584.3382352941177 166" class="de dash" marker-end="url(#arw_orchestrator)"/><path d="M135.4 166 L281.8 227" class="de dash both" marker-end="url(#arw_orchestrator)" marker-start="url(#arw_orchestrator)"/><path d="M261.8 166 L310.6 227" class="de dash both" marker-end="url(#arw_orchestrator)" marker-start="url(#arw_orchestrator)"/><path d="M388.2 166 L339.4 227" class="de dash both" marker-end="url(#arw_orchestrator)" marker-start="url(#arw_orchestrator)"/><path d="M506.7 166 L366.4 227" class="de dash both" marker-end="url(#arw_orchestrator)" marker-start="url(#arw_orchestrator)"/><path d="M745 166 L745 227" class="de " marker-end="url(#arw_orchestrator)"/><path d="M745 263 L745 302" class="de " marker-end="url(#arw_orchestrator)"/><rect x="12.5" y="22" width="135" height="36" rx="7" class="dn "/><text x="80" y="40" class="dnt">User goal</text><rect x="260" y="19" width="200" height="42" rx="7" class="dn acc"/><text x="360" y="32.5" class="dnt">Orchestrator</text><text x="360" y="47.5" class="dnt sub">plans · routes · retries</text><rect x="17.5" y="124" width="135" height="42" rx="7" class="dn "/><text x="85" y="137.5" class="dnt">Retriever</text><text x="85" y="152.5" class="dnt sub">search_docs</text><rect x="177.5" y="124" width="135" height="42" rx="7" class="dn "/><text x="245" y="137.5" class="dnt">API agent</text><text x="245" y="152.5" class="dnt sub">github_repo</text><rect x="337.5" y="124" width="135" height="42" rx="7" class="dn "/><text x="405" y="137.5" class="dnt">Analyst</text><text x="405" y="152.5" class="dnt sub">math in code</text><rect x="487.5" y="124" width="135" height="42" rx="7" class="dn "/><text x="555" y="137.5" class="dnt">Writer</text><text x="555" y="152.5" class="dnt sub">from the facts</text><rect x="677.5" y="124" width="135" height="42" rx="7" class="dn warn"/><text x="745" y="137.5" class="dnt">Critic</text><text x="745" y="152.5" class="dnt sub">checks each claim</text><rect x="65" y="227" width="520" height="36" rx="7" class="dn "/><text x="325" y="245" class="dnt">Shared memory: each step&#39;s result</text><rect x="677.5" y="227" width="135" height="36" rx="7" class="dn warn"/><text x="745" y="245" class="dnt">Human approval</text><rect x="677.5" y="302" width="135" height="36" rx="7" class="dn good"/><text x="745" y="320" class="dnt">Saved result</text><rect x="614" y="180.5" width="72" height="18" rx="4" class="delb"/><text x="650" y="189.5" class="del">revise ≤ 2</text></svg><div class="dia-cap">Orchestrated workflow · Tool Calling p.6</div></div>`,
   `<b>State:</b> shared memory holds each step's result; agents read only what they need.`,
   `<b>Guardrails:</b> schema validation on every tool call; each agent's tool allow-list; the critic grounds every claim in the memory; retry cap and timeouts — if exhausted, label the answer unverified.`,
   `<b>Human:</b> approve or edit before the result is saved.`],
  answer:`Supervisor + fan-out + critic loop + human approval, with typed shared memory and four guardrail layers.`,
  check:`Can you name, for every agent, its one job and its tools? Is every loop bounded? Does the checker compare against recorded outputs?`},
 learn:"",
 mistakes:[`Giving every agent every tool — that recreates the tool confusion that justified splitting.`,
  `A verifier that re-asks the LLM 'is this right?' instead of comparing against the tool log.`,
  `Unbounded retry loops.`],
 practice:[
  {d:"Easy", q:`Name the wiring pattern: (a) A → B → C fixed order; (b) any agent may hand off to any other; (c) a manager decides who works next and when to stop. Give one strength and one weakness each.`,
   s:`(a) <b>Sequential</b> — predictable and easy to debug; rigid.<br>
   (b) <b>Network</b> — flexible, emergent behaviour; can wander or loop, hard to audit.<br>
   (c) <b>Supervisor</b> — adaptive yet controlled; extra LLM call and a single point of failure.`},
  {d:"Moderate", q:`In BE1, the draft report says cash fell 40%, but the tool log says 31%. Trace what happens and explain why the Verifier can be trusted.`,
   s:`The Verifier compares each claim in the draft with the logged tool outputs: "revenue grew" matches; "cash fell 40%" does not (log: 31%). It <b>rejects</b> and sends the work back to the Forensic agent only (max 2 retries). Forensic fixes the number, the Verifier approves, and the Report agent writes the note.<br><br>
   <b>Why trust it:</b> it checks against the recorded tool log, not its own memory; it has read-only access and cannot fetch new data; and it is a different agent from the writer — "no grading your own homework". If retries run out, the answer is labelled unverified rather than shipped.`},
  {d:"Exam-level", q:`Design a multi-agent AI for remote healthcare monitoring: wearables stream vitals, the system should detect deterioration, explain alerts, and book a doctor's slot. Give the agents, wiring, guardrails and autonomy level.`,
   s:`<b>Agents:</b> Monitor agent (reads the vitals stream; tool: sensor API) · Risk analyst (scores deterioration; maths in code) · Explainer (produces the reasons behind an alert, e.g. SHAP on the risk model) · Scheduler (tool: hospital booking API) · Verifier (checks the alert's numbers against the logged readings).<br><br>
   <b>Wiring:</b> sequential pipeline Monitor → Analyst → Explainer → Verifier, with a supervisor deciding when to involve the Scheduler. Monitoring is continuous; booking is conditional.<br><br>
   <b>Guardrails:</b> schema validation on the booking API; the Scheduler is the only agent with write access; every alert value traces to a logged reading; retry and timeout limits.<br><br>
   <b>Autonomy:</b> <b>human-in-the-loop</b> for clinical decisions — the clinician reviews the alert and decides. Booking a <i>tentative</i> slot can be autonomous because it is reversible. Watch for the clinician over-trusting the AI (HITL deck, healthcare).<br><br>
   <i>This design question combines the BE1 pattern, the tool-calling guardrails and the HITL healthcare example. No single deck slide answers it.</i>`}]}
]}
]};

{id:"q_m1", module:"m1", title:"Module 1 — Fundamentals of AI and Agents", questions:[
 {type:"mcq", t:"m1t1", q:"Who coined the term “Artificial Intelligence”, and in which year?",
  o:["Alan Turing, 1950","John McCarthy, 1956","Arthur Samuel, 1959","Marvin Minsky, 1965"], a:1,
  e:"John McCarthy coined the phrase in 1956 at the Dartmouth workshop. Alan Turing published “Computing Machinery and Intelligence” in 1950, which gave us the Turing Test — a different contribution."},

  o:["Agent = Sensors + Actuators","Agent = Percept + Action","Agent = Architecture + Agent Program","Agent = Knowledge Base + Inference"], a:2,
  e:"Agent = Architecture + Agent Program. The architecture is the machinery the agent runs on; the agent program is the concrete implementation of the agent function."},
 {type:"mcq", t:"m1t5", q:"The agent function maps:",
  o:["The current percept to an action","Percept sequences to actions, F : P* → A","States to real numbers","Actions to performance measures"], a:1,
  e:"The agent function maps percept <em>sequences</em> to actions: F : P* → A. The star denotes sequences, which is what allows the agent to have memory. Mapping only the current percept describes a simple reflex agent, not the general agent function."},

  o:["True","False"], a:1,
  e:"False. A rational agent selects the action <em>expected</em> to maximise its performance measure given the evidence available. Rationality is about the decision process, not the outcome — an unforeseeable event can produce a bad outcome from a perfectly rational decision."},
