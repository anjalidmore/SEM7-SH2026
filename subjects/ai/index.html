  e:"The First AI Winter ran 1974–1980 (toy problems, slow expensive computers, funding cuts after the Lighthill report) and the Second 1987–1993 (expert systems too costly, no learning capability, specialised AI hardware obsolete)."},
 {type:"mcq", t:"m1t4", q:"Which of the four approaches to AI does modern AI, and this course, primarily adopt?",
  o:["Thinking humanly — cognitive modelling","Acting humanly — the Turing Test","Thinking rationally — laws of thought","Acting rationally — the rational agent"], a:3,
  e:"Acting rationally. Everything from Module 2 onward — search, heuristics, planning, belief networks — is machinery for an agent that acts to maximise its expected performance measure."}
]},

{id:"q_m2", module:"m2", title:"Module 2 — Problem Solving, Search and Optimization", questions:[
 {type:"mcq", t:"m2t6", q:"In A* search, the evaluation function is:",
  o:["f(n) = h(n)","f(n) = g(n)","f(n) = g(n) + h(n)","f(n) = g(n) − h(n)"], a:2,
  e:"f(n) = g(n) + h(n), where g(n) is the actual cost so far to reach n and h(n) is the estimated cost from n to the goal. f(n) = h(n) alone is greedy best-first search; f(n) = g(n) alone is uniform-cost search."},
 {type:"mcq", t:"m2t4", q:"A heuristic h(n) is admissible if:",
  o:["h(n) ≥ h*(n) for every node n","h(n) ≤ h*(n) for every node n","h(n) = h*(n) for every node n","h(n) &gt; 0 for every node n"], a:1,
  e:"h(n) ≤ h*(n) — an admissible heuristic never <em>over</em>estimates the true remaining cost h*(n). It is optimistic. This is exactly the condition that guarantees A* returns the optimal solution."},
 {type:"num", t:"m2t6", q:"In the CIA-02 graph, what is the total cost of the optimal path from a to z?",
  ans:17, tol:0,
  e:"The optimal path is a → c → d → e → z with cost 3 + 7 + 2 + 5 = 17. Compare: a–c–e–z = 18, a–b–e–z = 21, a–b–f–z = 25."},
 {type:"mcq", t:"m2t6", q:"When should A* terminate?",
  o:["As soon as the goal node is generated and placed in OPEN","When the goal node is selected for expansion (popped as minimum f)","When OPEN becomes larger than CLOSED","After a fixed number of iterations"], a:1,
  e:"A* terminates when the goal is <em>selected for expansion</em> — i.e. it is the minimum-f node in OPEN. Stopping as soon as the goal is generated is the classic error that produces a suboptimal answer (19 instead of 18 in the class example)."},
 {type:"mcq", t:"m2t12", q:"The alpha–beta pruning condition is:",
  o:["α ≤ β","α &gt; β only","α ≥ β","β ≥ 0"], a:2,
  e:"Prune when α ≥ β. Note that <em>equality</em> also prunes — in the class example, α = −4 and β = −4 at node B₂ pruned the entire right-most MAX node."},
 {type:"mcq", t:"m2t12", q:"In alpha–beta pruning, which player updates which value?",
  o:["MAX updates β, MIN updates α","MAX updates α, MIN updates β","Both update α","Both update β"], a:1,
  e:"MAX updates α (the best/highest value MAX has found so far); MIN updates β (the best/lowest value MIN has found so far). MAX wants α to increase, MIN wants β to decrease."},
 {type:"tf", t:"m2t12", q:"Alpha–beta pruning can return a different (worse) move than plain minimax.",
  o:["True","False"], a:1,
  e:"False. Alpha–beta produces the <em>same</em> optimal decision as minimax, but explores fewer nodes. It only discards branches that provably cannot affect the final choice. What <em>does</em> vary is <em>how many</em> nodes get pruned, which depends on the order children are visited."},
 {type:"mcq", t:"m2t3", q:"Which uninformed search strategy has LINEAR space complexity O(bd) while remaining complete and optimal for equal step costs?",
  o:["Breadth-first search","Depth-first search","Iterative deepening search","Depth-limited search"], a:2,
  e:"Iterative deepening search. It takes completeness and optimality from BFS but searches in a DFS manner, so space is only O(bd) rather than BFS's exponential O(b^d). DFS has linear space but is neither complete nor optimal."},
 {type:"mcq", t:"m2t3", q:"BFS uses which data structure, and DFS which?",
  o:["Stack (LIFO) and Queue (FIFO)","Queue (FIFO) and Stack (LIFO)","Both use a priority queue","Both use a stack"], a:1,
  e:"BFS enqueues nodes in FIFO (first-in, first-out) order using a queue; DFS uses a LIFO stack. This single difference produces all the other differences in completeness, optimality and space."},
 {type:"mcq", t:"m2t8", q:"Which hill-climbing variant reliably escapes local optima?",
  o:["Simple hill climbing","Steepest-ascent hill climbing","Stochastic hill climbing","Random-restart hill climbing"], a:3,
  e:"Random-restart hill climbing runs the algorithm multiple times from different randomly generated initial states, so a run trapped in a local optimum is simply abandoned and restarted. Stochastic hill climbing adds randomness in <em>which</em> uphill neighbour is chosen, but it never accepts a worse neighbour, so it can still be trapped."},
 {type:"tf", t:"m2t8", q:"Stochastic hill climbing may accept a neighbour that is worse than the current state.",
  o:["True","False"], a:1,
  e:"False. Stochastic hill climbing randomly selects among the <em>uphill</em> (better) neighbours, with greater improvement giving a higher probability of selection. It never chooses a worse neighbour. Accepting worse moves — with probability e^(ΔE/T) — is what simulated annealing does."},
 {type:"multi", t:"m2t9", q:"Select ALL three stopping criteria for simulated annealing given in the lecture.",
  o:["A given minimum value of the temperature has been reached",
     "The population has fully converged",
     "A certain number of iterations has passed without acceptance of a new solution",
     "A specified number of total iterations has been executed",
     "The heuristic value reaches zero"], a:[0,2,3],
  e:"The three criteria are: a minimum temperature reached; a number of iterations passing with no new solution accepted; a specified total number of iterations executed. Population convergence is a genetic-algorithm criterion, not an SA one."},
 {type:"mcq", t:"m2t9", q:"In simulated annealing, a bad move (ΔE &lt; 0) is accepted with probability:",
  o:["1/T","e^(ΔE/T)","ΔE × T","0 — bad moves are never accepted"], a:1,
  e:"Bad moves are accepted with probability e^(ΔE/T). As the temperature T decreases, this probability falls towards zero, so late in the run the algorithm behaves like ordinary hill climbing. Good moves (ΔE &gt; 0) are accepted unconditionally."},
 {type:"mcq", t:"m2t10", q:"In roulette-wheel selection for a genetic algorithm, an individual's chance of being selected is:",
  o:["Equal for all individuals","Directly proportional to its fitness","Inversely proportional to its fitness","Determined by its position in the population"], a:1,
  e:"Selection probability is directly proportional to fitness — more area on the wheel means more chance. Fitness ∝ area ∝ selection. Crucially it is probabilistic, so a low-fitness individual can still be selected, which preserves diversity."},
 {type:"mcq", t:"m2t11", q:"In a minimax game tree, terminal utility values are always given from whose perspective?",
  o:["MIN's perspective","MAX's perspective","Whichever player moves last","Both, alternately"], a:1,
  e:"All utility values are from MAX's perspective. In chess: Win = +1, Draw = 0, Loss = −1 for MAX. MIN then works to minimise that same number."},
 {type:"num", t:"m2t11", q:"A game tree has leaves −4, −9, 9, 6, −17, −4, −11, 7 (root MAX, level 2 MIN, level 3 MAX). What is the minimax value at the root?",
  ans:-4, tol:0,
  e:"Level 3 (MAX): max(−4,−9) = −4, max(9,6) = 9, max(−17,−4) = −4, max(−11,7) = 7. Level 2 (MIN): min(−4,9) = −4, min(−4,7) = −4. Root (MAX): max(−4,−4) = −4."},
 {type:"mcq", t:"m2t5", q:"Greedy best-first search is:",
  o:["Complete and optimal","Complete but not optimal","Neither complete nor optimal","Optimal but not complete"], a:2,
  e:"Neither. It can get stuck in loops (Iasi → Neamt → Iasi → Neamt), so it is not complete, and it ignores the cost already incurred, so it is not optimal — the Fagaras route in the Romania example is not the shortest."}
]},

{id:"q_m3", module:"m3", title:"Module 3 — Knowledge Representation and Reasoning", questions:[
 {type:"mcq", t:"m3t4", q:"Which is the correct FOL translation of “All students study mathematics”?",
  o:["∀x (Student(x) ∧ Studies(x, Maths))","∀x (Student(x) → Studies(x, Maths))","∃x (Student(x) → Studies(x, Maths))","∃x (Student(x) ∧ Studies(x, Maths))"], a:1,
  e:"∀ pairs with → . Option A claims everything in the universe is a student who studies maths — including chairs and planets. Remember the rule: “all/every” uses →, “some” uses ∧."},
 {type:"mcq", t:"m3t4", q:"Which is the correct FOL translation of “Some students play football”?",
  o:["∀x (Student(x) → Plays(x, Football))","∃x (Student(x) → Plays(x, Football))","∃x (Student(x) ∧ Plays(x, Football))","∀x (Student(x) ∧ Plays(x, Football))"], a:2,
  e:"∃ pairs with ∧. Option B is trivially satisfied by anything that is not a student, so it says almost nothing."},
 {type:"mcq", t:"m3t4", q:"Which is the correct FOL translation of “No student is lazy”?",
  o:["¬∀x (Student(x) → Lazy(x))","∀x (Student(x) → ¬Lazy(x))","∃x (Student(x) ∧ ¬Lazy(x))","¬∃x Student(x)"], a:1,
  e:"“No A are B” becomes ∀x (A(x) → ¬B(x)). Option A says “not all students are lazy”, which is much weaker — it allows some lazy students."},
 {type:"mcq", t:"m3t8", q:"In a resolution proof, deriving the empty clause □ means:",
  o:["The knowledge base is inconsistent and unusable","The negated goal contradicts the KB, so the goal is PROVED","No further inference is possible, so the goal is disproved","The goal is false"], a:1,
  e:"The empty clause signals a contradiction. Since we deliberately added ¬α, the contradiction must come from ¬α — therefore α is entailed by the KB. This is proof by refutation."},
 {type:"tf", t:"m3t8", q:"If a resolution proof cannot derive the empty clause, the goal has been proved false.",
  o:["True","False"], a:1,
  e:"False. Failing to derive □ means only that the KB does not <em>entail</em> the goal — “not provable” is not the same as “false”. This is listed in the slides as a common student mistake."},
 {type:"mcq", t:"m3t8", q:"What is the correct order of the four steps in a resolution proof?",
  o:["Negate the goal → convert to FOL → convert to CNF → resolve",
     "Convert to FOL → convert to CNF → negate the goal → draw the resolution graph",
     "Convert to CNF → convert to FOL → negate the goal → resolve",
     "Convert to FOL → negate the goal → resolve → convert to CNF"], a:1,
  e:"Step 1: conversion of facts into first-order logic. Step 2: convert FOL statements into CNF. Step 3: negate the statement to be proved (proof by contradiction). Step 4: draw the resolution graph with unification."},
 {type:"mcq", t:"m3t11", q:"Forward chaining is best described as:",
  o:["Goal-driven, top-to-bottom","Data-driven, bottom-to-top","Goal-driven, bottom-to-top","Data-driven, top-to-bottom"], a:1,
  e:"Forward chaining is data-driven and uses a down-up (bottom to top) approach: start with known facts, fire matching rules, add new facts. Its guiding question is “What can I conclude?” Backward chaining is goal-driven and up-down."},
 {type:"mcq", t:"m3t11", q:"Which inference rule forms the basis of the backward chaining process?",
  o:["Resolution","And-elimination","Modus ponens","Biconditional elimination"], a:2,
  e:"The slides state that the modus ponens inference rule is the basis for backward chaining: if both the conditional (p → q) and the antecedent (p) are true, we can infer the consequent (q) — run in reverse to reduce goals to subgoals."},
 {type:"mcq", t:"m3t10", q:"A Horn clause is a clause containing:",
  o:["Exactly one positive literal","At most one positive literal","At most one negative literal","Only negative literals"], a:1,
  e:"At most one positive literal. That is why ¬A ∨ ¬B ∨ C is a Horn clause (C is the only positive literal) and rewrites as the rule A ∧ B → C. A clause of all negative literals is also Horn."},
 {type:"mcq", t:"m3t9", q:"What does unification actually do?",
  o:["It proves the conclusion of a rule","It finds substitutions that make a rule match a fact or goal","It converts a sentence into CNF","It removes existential quantifiers"], a:1,
  e:"Unification finds the substitutions (e.g. {x/M1}) that make two expressions identical, so the appropriate rule can be applied. It does not itself prove the conclusion. Removing existential quantifiers is Skolemization."},
 {type:"mcq", t:"m3t2", q:"In the Wumpus world, perceiving a BREEZE in a square means:",
  o:["The Wumpus is in an adjacent square","There is a pit in a directly adjacent square","The gold is in this square","The agent has walked into a wall"], a:1,
  e:"Breeze indicates a pit in a directly (not diagonally) adjacent square. Stench indicates the Wumpus is adjacent, glitter means gold is in this square, and bump means the agent walked into a wall."},
 {type:"multi", t:"m3t2", q:"Select ALL properties that correctly describe the Wumpus world task environment.",
  o:["Partially observable","Fully observable","Deterministic","Stochastic","Static","Single agent"], a:[0,2,4,5],
  e:"The Wumpus world is partially observable (the agent perceives only its immediate surroundings), deterministic (outcomes are known), sequential, static (the Wumpus and pits do not move), discrete, and single agent (the Wumpus is not counted as an agent)."},
 {type:"mcq", t:"m3t14", q:"Which best captures the difference between an ontology and a knowledge graph?",
  o:["They are two names for the same thing",
     "The ontology is the grammar/schema; the knowledge graph holds the actual facts",
     "The knowledge graph defines the classes; the ontology stores instances",
     "An ontology is visual; a knowledge graph is textual"], a:1,
  e:"The ontology defines domain meaning — classes, properties, constraints — and answers “what kinds of things and links are valid?”. The knowledge graph stores connected facts about actual entities. The slide analogy: ontology = grammar/blueprint, knowledge graph = sentences/populated map."},
 {type:"mcq", t:"m3t15", q:"In an RDF triple (Riya, hasSkill, Python), what is “hasSkill”?",
  o:["A node in the graph","The labelled directed edge (the predicate)","The subject","A data property value"], a:1,
  e:"In an RDF graph the subject and object are nodes; the predicate labels the directed edge between them. So Riya and Python are nodes, and hasSkill is the edge."},
 {type:"mcq", t:"m3t15", q:"Which Semantic Web layer is used to QUERY graph data?",
  o:["RDF","RDFS","OWL","SPARQL"], a:3,
  e:"Memory aid from the slides: URI/IRI = Identify, RDF = Represent, RDFS/OWL = Describe meaning, SPARQL = Query. SPARQL retrieves RDF data by matching graph patterns."},
 {type:"mcq", t:"m3t12", q:"In a semantic network, why must “Penguin cannot fly” be stated explicitly?",
  o:["Because Penguin is not really a bird",
     "Because it is an exception to an inherited default property",
     "Because IS-A links do not support inheritance",
     "Because semantic networks cannot represent negation"], a:1,
  e:"Bird has the default property “can fly”, which Penguin would otherwise inherit through its IS-A link. Inheritance avoids repeating general properties, but exceptions must be represented explicitly — this is the standard exam point on semantic networks."},
 {type:"mcq", t:"m3t3", q:"Which of the following is NOT a proposition?",
  o:["It is raining","Rohan is intelligent","Where is Rohini?","The light is on"], a:2,
  e:"Questions, commands and opinions are not propositions, because they cannot be assigned a truth value. The slides give exactly these examples: “Where is Rohini”, “How are you”, “What is your name”."},
 {type:"mcq", t:"m3t1", q:"A knowledge-based agent uses TELL and ASK. What does TELL do?",
  o:["Queries the KB for the next action","Adds what the agent perceives to the knowledge base","Removes outdated sentences","Converts sentences to CNF"], a:1,
  e:"TELL adds a percept into the knowledge base; ASK queries the KB for what action to perform. The agent then performs the chosen action."}
]},

{id:"q_m4", module:"m4", title:"Module 4 — Planning and Uncertainty", questions:[
 {type:"mcq", t:"m4t1", q:"Which is NOT one of the three reasons the lecture gives for why logic fails in medical diagnosis?",
  o:["Laziness","Theoretical ignorance","Practical ignorance","Computational complexity"], a:3,
  e:"The three reasons are laziness (too much work to list every antecedent and consequent), theoretical ignorance (medical science has no complete theory), and practical ignorance (not all tests have been run for this patient)."},
 {type:"mcq", t:"m4t2", q:"P(cavity) = 0.2 is an example of:",
  o:["A posterior probability","A prior (unconditional) probability","A conditional probability","A joint probability"], a:1,
  e:"It is a prior or unconditional probability — belief before any evidence. P(cavity | toothache) = 0.6 would be the posterior or conditional probability."},
 {type:"mcq", t:"m4t2", q:"Bayes' rule is used to compute:",
  o:["P(effect | cause) from P(cause | effect)","P(cause | effect) from P(effect | cause)","The full joint distribution","The utility of an action"], a:1,
  e:"Bayes' rule computes the diagnostic direction P(cause | effect) from the causal direction P(effect | cause), which is the direction that is actually measurable and stable."},
 {type:"mcq", t:"m4t4", q:"A Bayesian network must be:",
  o:["An undirected graph","A directed graph that may contain cycles","A directed acyclic graph (DAG)","A tree with exactly one root"], a:2,
  e:"It is a directed graph with no directed cycles — a DAG. It may have several root nodes, so it need not be a tree."},
 {type:"num", t:"m4t4", q:"In a Bayesian network of Boolean variables, how many independent values are needed in the CPT of a node with 2 Boolean parents?",
  ans:4, tol:0,
  e:"2^k where k is the number of parents, so 2² = 4. You need one value per combination of parent values; the complementary probability is implied by 1 − P."},
 {type:"num", t:"m4t4", q:"For the network Parents-Smoke → {Second-Hand-Smoke, Smokes} → Cancer → Reduced-Life-Expectancy, how many independent values are needed in total?",
  ans:11, tol:0,
  e:"PS has 0 parents → 1; SHS has 1 → 2; S has 1 → 2; Cancer has 2 → 4; RLE has 1 → 2. Total = 1 + 2 + 2 + 4 + 2 = 11. Compare with 2⁵ − 1 = 31 for the full joint distribution."},
 {type:"mcq", t:"m4t3", q:"Why is a full joint probability distribution impractical for large domains?",
  o:["It cannot answer conditional queries","It grows exponentially — 2ⁿ entries for n Boolean variables","It requires the variables to be independent","It only works for Boolean variables"], a:1,
  e:"It can answer any query, but needs one entry per possible world: 2ⁿ for n Boolean variables. 30 variables would need over a billion numbers, each elicited from an expert. Bayesian networks exploit conditional independence to store far fewer."},
 {type:"tf", t:"m4t3", q:"If a and b are independent, then P(a ∧ b) = P(a) · P(b).",
  o:["True","False"], a:0,
  e:"True. Independence is defined by P(a | b) = P(a), P(b | a) = P(b), and equivalently P(a ∧ b) = P(a) · P(b). This is what lets a large joint distribution be factored into smaller ones."},
 {type:"mcq", t:"m4t1", q:"Decision theory is the combination of:",
  o:["Logic + search","Probability theory + utility theory","Bayes' rule + chain rule","Planning + learning"], a:1,
  e:"Decision Theory = Probability Theory + Utility Theory. Probability handles what the agent believes; utility handles what it prefers."},
 {type:"mcq", t:"m4t2", q:"P(s | m) = 0.7, P(m) = 1/50,000, P(s) = 0.01. What is P(m | s)?",
  o:["0.7","0.0014","0.014","0.00002"], a:1,
  e:"Bayes' rule: 0.7 × (1/50,000) / 0.01 = 0.0014. Answering 0.7 confuses the causal and diagnostic directions."},
 {type:"mcq", t:"m4t2", q:"In the toothache table, the sum 0.108 + 0.012 + 0.072 + 0.008 + 0.016 + 0.064 = 0.28 equals:",
  o:["P(cavity ∧ toothache)","P(cavity ∨ toothache)","P(cavity | toothache)","P(toothache)"], a:1,
  e:"Those six cells are every world where cavity OR toothache holds. The deck labels it ∧, which is a slip — P(cavity ∧ toothache) is only 0.108 + 0.012 = 0.12."},
 {type:"mcq", t:"m4t4", q:"Which is part of the definition of a Bayesian network?",
  o:["It may contain directed cycles","Each node has a conditional distribution given its parents","Every node is connected to every other node","Arrows point from effects to causes"], a:1,
  e:"The three-part specification: nodes are random variables, directed links form a DAG (no cycles), and each node has P(Xi | Parents(Xi))."},
 {type:"mcq", t:"m4t4", q:"The smart-home network (P, B, I roots; C has parent P; A has parents P, B; N has parents A, I) needs how many independent CPT values?",
  o:["11","13","15","63"], a:1,
  e:"1 + 1 + 1 + 2 + 4 + 4 = 13. 63 would be the full joint over six Boolean variables (2^6 − 1)."},
 {type:"mcq", t:"m4t15", q:"P(Alarm) in the burglary network is computed as:",
  o:["P(A | b, e)","The sum of the four CPT entries for Alarm","Σ over B, E of P(A | B, E) · P(B) · P(E)","P(J) · P(M)"], a:2,
  e:"Marginalise over the parents, weighting each CPT row by the probability of that parent combination. The result is 0.0025164."},
 {type:"mcq", t:"m4t5", q:"Which is NOT a typical assumption of classical planning?",
  o:["Deterministic actions","Closed-world assumption","Actions may have uncertain outcomes","The agent is the sole cause of change"], a:2,
  e:"Classical planning assumes deterministic actions. Uncertain outcomes are handled by conditional planning."},
 {type:"mcq", t:"m4t7", q:"Which literal is allowed in a STRIPS state description?",
  o:["At(x, y)","At(Father(Fred), Sydney)","At(Plane1, Mumbai)","¬At(Plane1, Delhi)"], a:2,
  e:"States are conjunctions of positive, ground, function-free literals. At(x,y) is not ground, Father(Fred) is a function, and negative literals are not stored (closed world)."},
 {type:"mcq", t:"m4t16", q:"After applying Fly(P1, MUM, DEL) to At(P1,MUM) ∧ At(P2,SFO) ∧ …, where is P2?",
  o:["DEL","MUM","SFO","Unknown"], a:2,
  e:"Fly(P1,…) changes only P1's location. Every literal not in the effect list carries over unchanged, so At(P2,SFO) stays. The deck's slide 19 wrongly shows At(P2,DEL)."},
 {type:"mcq", t:"m4t8", q:"Regressing goal g through action a gives:",
  o:["(g − DEL(a)) ∪ ADD(a)","(g − ADD(a)) ∪ PRECOND(a)","g ∪ EFFECT(a)","PRECOND(a) only"], a:1,
  e:"g′ = (g − ADD(a)) ∪ PRECOND(a). The added effects need not have held before; the preconditions must have."},
 {type:"mcq", t:"m4t9", q:"In partial-order planning, a causal link A —p→ B means:",
  o:["A must be executed immediately before B","A achieves p for B, and p must stay true between them","B undoes p","A and B can run in parallel"], a:1,
  e:"A causal link is a protection interval. Any step that could fall between A and B and deletes p is a threat."},
 {type:"mcq", t:"m4t17", q:"The shoes-and-socks partial-order plan corresponds to how many total-order plans?",
  o:["2","4","6","24"], a:2,
  e:"Each sock must precede its own shoe; the two chains interleave in 4!/(2!·2!) = 6 ways."},
 {type:"mcq", t:"m4t10", q:"The general property of hierarchical planning is:",
  o:["Solve all details first, then combine them","Postpone attempts to solve mere details until the major steps are in place","Plan only at the most detailed level","Never revise a higher-level plan"], a:1,
  e:"Major steps first, details later — and patch higher levels if a lower level runs into difficulty."},
 {type:"mcq", t:"m4t11", q:"In a task network, the truth constraint (n4, TeaSteeped, n5) means:",
  o:["n4 and n5 can run in parallel","TeaSteeped must be true after n4 and before n5","n5 makes TeaSteeped false","n4 ≺ n5 only"], a:1,
  e:"A truth constraint (n, p, n′) protects p between n and n′. The ordering n ≺ n′ alone does not say which condition must hold."},
 {type:"mcq", t:"m4t13", q:"Autonomous vehicles that each decide their own speed and route from their own observations are an example of:",
  o:["Centralised planning","Decentralised planning","Distributed planning","Hierarchical planning"], a:1,
  e:"Each agent plans independently with local information and no central controller — decentralised. Distributed planning would add coordinating and adjusting plans through communication."},
 {type:"mcq", t:"m4t14", q:"In Prolog, what does grandparent(X, Y) :- parent(X, Z), parent(Z, Y). mean?",
  o:["X is a grandparent of Y if X is a parent of Z and Z is a parent of Y","Z is a grandparent of Y","grandparent implies parent","X or Z is a parent of Y"], a:0,
  e:"Read ':-' as 'if' and ',' as 'and'. The head (conclusion) comes first."}
]},
{id:"q_m5", module:"m5", title:"Module 5 — Generative, Explainable and Responsible AI", questions:[
 {type:"mcq", t:"m5t1", q:"Which best defines Generative AI?",
  o:["AI that classifies inputs into categories","AI models that learn patterns from training data and use them to generate new content","Any AI that uses a neural network","AI that searches the internet"], a:1,
  e:"Generated content is new, statistically consistent with learned patterns, and conditioned by the user's input."},
 {type:"mcq", t:"m5t4", q:"Which of these is generative?",
  o:["Face recognition","House-price predictor","AI generating synthetic patient records","Fraud detector"], a:2,
  e:"Synthetic records are new data consistent with the training distribution. The others output a label or a number."},
 {type:"mcq", t:"m5t5", q:"Which model family uses a Generator and a Discriminator that compete?",
  o:["VAE","GAN","Diffusion model","Autoregressive model"], a:1,
  e:"GAN — Generative Adversarial Network. The generator creates, the discriminator evaluates."},
 {type:"mcq", t:"m5t5", q:"Diffusion models generate images by:",
  o:["Predicting the next pixel left to right","Progressively removing noise","Compressing images into a code","Retrieving similar images"], a:1,
  e:"They learn to transform random noise into an image, step by step."},
 {type:"mcq", t:"m5t6", q:"Which was NOT a difficulty of RNN/LSTM sequence modelling cited in the deck?",
  o:["Sequential computation","Difficulty parallelising","Learning long-range dependencies","Inability to use embeddings"], a:3,
  e:"The three cited challenges are sequential computation, difficulty parallelising across positions and learning long-range dependencies."},
 {type:"mcq", t:"m5t6", q:"Attention allows a model to:",

const DECKS = [
{id:"fc_defs", title:"Core Definitions", desc:"The verbatim definitions most likely to open an exam answer.", cards:[
 {q:"Define an intelligent agent.", t:"m1t5",
  a:"An <strong>agent</strong> is anything that can be viewed as <em>perceiving its environment through sensors</em> and <em>acting upon that environment through actuators</em>."},
 {q:"Define a rational agent.", t:"m1t7",
  a:"For each possible percept sequence, a rational agent should select an action that is <strong>expected to maximise its performance measure</strong>, given the evidence provided by the percept sequence and whatever built-in knowledge the agent has."},
 {q:"What are the four things rationality depends on?", t:"m1t7",
  a:"<ol><li>The performance measure that defines the criterion of success</li><li>The agent's prior knowledge of the environment</li><li>The actions the agent can perform</li><li>The agent's percept sequence to date</li></ol>"},
 {q:"Define problem solving.", t:"m2t1",
  a:"The way in which an agent finds a <strong>sequence of actions that achieves its goals</strong>, when no single action will do."},
 {q:"Define a heuristic function h(n).", t:"m2t4",
  a:"An intelligent estimate or rule of thumb that <strong>guides the search towards the goal quickly</strong>. h(n) estimates the remaining cost from node n to the goal. Smaller h(n) → closer to the goal."},
 {q:"When is a heuristic admissible?", t:"m2t4",
  a:"When <strong>h(n) ≤ h*(n)</strong> for every node n, where h*(n) is the true cost to reach the goal from n. It <em>never overestimates</em> — it is optimistic. This guarantees A* finds the optimal path."},
 {q:"Define a knowledge-based agent.", t:"m3t1",
  a:"An agent that includes a <strong>knowledge base</strong> (a set of representations of facts of the world, each called a <em>sentence</em>, expressed in a knowledge representation language) and an <strong>inference system</strong> (which derives new sentences from old). It TELLs the KB what it perceives, ASKs what action to perform, then performs it."},
 {q:"Define a Horn clause.", t:"m3t10",
  a:"A clause containing <strong>at most one positive literal</strong>. e.g. ¬A ∨ ¬B ∨ C, which rewrites as the IF–THEN rule <strong>A ∧ B → C</strong>. Horn clauses allow efficient inference and form the basis of forward and backward chaining."},
 {q:"Define a semantic network.", t:"m3t12",
  a:"A graph in which <strong>nodes represent concepts, objects or classes</strong> and <strong>labelled links represent their semantic relationships</strong> (IS-A, INSTANCE-OF, HAS-A, PART-OF). It supports inheritance, but exceptions must be stated explicitly."},
 {q:"Define an ontology.", t:"m3t13",
  a:"A <strong>formal, shared specification of concepts and relationships in a domain</strong> — the schema of meaning. It defines classes, properties, relationships and constraints, provides a common vocabulary with explicit meaning, and supports consistency and reasoning."},
 {q:"Define a Bayesian network.", t:"m4t4",
  a:"A <strong>directed acyclic graph</strong> in which each node is a random variable annotated with quantitative probability information. An arrow X → Y makes X a parent of Y, and each node X<sub>i</sub> carries a conditional probability distribution <strong>P(X<sub>i</sub> | Parents(X<sub>i</sub>))</strong>."},
 {q:"Define the empty clause □ in resolution.", t:"m3t8",
  a:"A disjunction of <strong>no disjuncts</strong>. It is equivalent to <em>false</em>, because a disjunction is only true if one of its disjuncts is true. It arises from resolving two complementary literals, and signals that the negated goal contradicts the KB — so the goal is proved."}
]},
{id:"fc_formulas", title:"Formulas & Notation", desc:"Every formula you must be able to write from memory.", cards:[
 {q:"Agent function — both forms", t:"m1t5",
  a:"<div class='fx'>a = F(p),&nbsp;&nbsp;F : P → A</div>and for percept <em>sequences</em>:<div class='fx'>a<sub>k</sub> = F(p₀ p₁ p₂ … p<sub>k</sub>),&nbsp;&nbsp;F : P* → A</div>The star means “sequences of percepts” — it is what allows memory."},
 {q:"Structure of an agent", t:"m1t5", a:"<div class='fx'>Agent = Architecture + Agent Program</div><strong>Architecture</strong> = the machinery the agent executes on. <strong>Agent program</strong> = the concrete implementation of the agent function."},
 {q:"A* evaluation function — and what each term is", t:"m2t6",
  a:"<div class='fx'>f(n) = g(n) + h(n)</div><strong>g(n)</strong> = cost so far to reach n (actual).<br><strong>h(n)</strong> = estimated cost from n to the goal.<br><strong>f(n)</strong> = estimated total cost of the path through n."},
 {q:"Greedy best-first vs uniform-cost vs A* — the three evaluation functions", t:"m2t5",
  a:"<strong>Uniform-cost</strong> orders by backward cost: f(n) = g(n)<br><strong>Greedy</strong> orders by forward cost: f(n) = h(n)<br><strong>A*</strong> orders by the sum: f(n) = g(n) + h(n)"},
 {q:"Alpha–beta pruning condition", t:"m2t12",
  a:"<div class='fx'>α ≥ β ⇒ Prune</div><strong>α</strong> — for MAX, the best/highest value found so far; MAX wants it to increase.<br><strong>β</strong> — for MIN, the best/lowest value found so far; MIN wants it to decrease.<br>At the root: α = −∞, β = +∞."},
 {q:"Simulated annealing — acceptance probability", t:"m2t9",
  a:"<div class='fx'>P(accept a bad move) = e<sup>ΔE / T</sup></div>ΔE &gt; 0 → good move, accepted unconditionally.<br>ΔE &lt; 0 → bad move, accepted with the probability above.<br>As T decreases, bad moves become rarer."},
 {q:"BFS, DFS and IDS complexity", t:"m2t3",
  a:"<strong>BFS</strong>: time O(b<sup>d</sup>), space O(b<sup>d</sup>)<br><strong>DFS</strong>: time O(b<sup>m</sup>), space <strong>O(bm)</strong> — linear<br><strong>IDS</strong>: time O(b<sup>d</sup>), space <strong>O(bd)</strong> — linear<br><em>b</em> = branching factor, <em>d</em> = depth of the shallowest goal, <em>m</em> = max depth of the space."},
 {q:"Bayes' rule", t:"m4t2",
  a:"<div class='fx'>P(A | B) = P(B | A) · P(A) / P(B)</div>Derived from the product rule P(A ∧ B) = P(A|B)·P(B) = P(B|A)·P(A). Computes the <strong>diagnostic</strong> direction from the <strong>causal</strong> direction."},
 {q:"Product rule", t:"m4t2", a:"<div class='fx'>P(A ∧ B) = P(A | B) · P(B) = P(B | A) · P(A)</div>"},
 {q:"Independence — the three equivalent statements", t:"m4t3",
  a:"<div class='fx'>P(a | b) = P(a)&nbsp;&nbsp;·&nbsp;&nbsp;P(b | a) = P(b)&nbsp;&nbsp;·&nbsp;&nbsp;P(a ∧ b) = P(a) · P(b)</div>"},
 {q:"Independent CPT values for a Bayesian network node", t:"m4t4",
  a:"A Boolean node with <strong>k Boolean parents</strong> needs <strong>2<sup>k</sup></strong> independent values.<br>0 parents → 1 · 1 parent → 2 · 2 parents → 4 · 3 parents → 8<br>Total for the network = the sum over all nodes.<br><em>Do not double for the complementary row — it is implied by 1 − P.</em>"},
 {q:"Decision theory", t:"m4t1", a:"<div class='fx'>Decision Theory = Probability Theory + Utility Theory</div>Probability tells you what is likely; utility tells you what you want. Decisions need both."},
 {q:"RDF triple", t:"m3t15", a:"<div class='fx'>Triple = ( Subject , Predicate , Object )</div>e.g. (Riya, hasSkill, Python). Subject and object are <strong>nodes</strong>; the predicate is the <strong>labelled directed edge</strong>."}
]},
{id:"fc_fol", title:"FOL Conversion Patterns", desc:"The sentence patterns that appear again and again in conversion questions.", cards:[
 {q:"The O-P-Q-C mnemonic — what does it stand for?", t:"m3t4",
  a:"<strong>O</strong> = Object · <strong>P</strong> = Predicate · <strong>Q</strong> = Quantifier · <strong>C</strong> = Connective.<br>The four building blocks of any first-order logic sentence."},
 {q:"All A are B", t:"m3t4", a:"<div class='fx'>∀x [ A(x) → B(x) ]</div><strong>'every' / 'all' uses →</strong>. Using ∧ here would claim every object in the universe is an A that is B."},
 {q:"Some A are B", t:"m3t4", a:"<div class='fx'>∃x [ A(x) ∧ B(x) ]</div><strong>'some' uses ∧</strong>. Using → here would be trivially satisfied by anything that is not an A."},
 {q:"No A are B", t:"m3t4", a:"<div class='fx'>∀x [ A(x) → ¬B(x) ]</div>Not ¬∀x(A(x) → B(x)) — that only says “not all”, which is much weaker. <em>Be careful with 'No'.</em>"},
 {q:"Every A relates to some B", t:"m3t4", a:"<div class='fx'>∀x [ A(x) → ∃y ( B(y) ∧ R(x,y) ) ]</div>Note the ∃ nested <em>inside</em> the ∀ — and the ∧ that goes with it."},
 {q:"When do you need two variables?", t:"m3t4",
  a:"When the sentence mentions <strong>different people or objects</strong>.<br>“Every father loves his child” → ∀x ∀y ( Father(x,y) → Loves(x,y) )<br>Also for comparatives: “Every person who exercises is healthier than a person who does not” needs ∀x∀y."},
 {q:"Unary vs binary predicate — when to use which?", t:"m3t4",
  a:"<strong>One object → unary predicate</strong>, which expresses a <em>property</em>: Intelligent(Rhea).<br><strong>Two objects → binary predicate</strong>, which expresses a <em>relationship</em>: Likes(Rhea, AI)."},
 {q:"“A unless B”", t:"m3t4", a:"<div class='fx'>¬B → A</div>e.g. “Everyone likes McDonalds unless they are allergic to it” → ∀x ( ¬Allergic(x, McDonalds) → Likes(x, McDonalds) )"},
 {q:"“You can fool SOME of the people ALL of the time” vs “ALL of the people SOME of the time”", t:"m3t4",
  a:"<strong>Some people, all the time:</strong><br>∃x ∀t, (person(x) ∧ time(t)) ∧ can-fool(x, t)<br><br><strong>All people, some of the time:</strong><br>∀x ∃t, (person(x) ∧ time(t)) ⇒ can-fool(x, t)<br><br><em>Swapping ∃ and ∀ changes the meaning entirely — quantifier order matters.</em>"}
]},
{id:"fc_compare", title:"Key Comparisons", desc:"Every 'differentiate between' question the syllabus can ask.", cards:[
 {q:"Forward chaining vs Backward chaining", t:"m3t11",
  a:"<strong>Forward:</strong> starts from known facts · facts → conclusions · <em>data-driven</em> · down-up · “What can I conclude?” · good when many conclusions are needed.<br><br><strong>Backward:</strong> starts from the goal · goal → subgoals → facts · <em>goal-driven</em> · up-down · “What must I prove?” · good for a specific query.<br><br><em>Same knowledge base, opposite direction.</em>"},
 {q:"Propositional logic vs First-order predicate logic", t:"m3t5",
  a:"<strong>PL:</strong> small worlds · weak KR language · symbols for propositions · cannot express specialization/generalization · foundational · world contains <strong>facts</strong>.<br><br><strong>FOL:</strong> complex worlds · strong KR language · predicates with constants, variables, functions, relations · can express specialization/generalization · higher level · world contains <strong>objects, relations, functions</strong>."},
 {q:"Ontology vs Knowledge graph", t:"m3t14",
  a:"<strong>Ontology</strong> — defines domain meaning/schema · classes, properties, constraints · “Student hasSkill Skill” · answers “what kinds of things and links are valid?” · analogy: <em>grammar / blueprint</em>.<br><br><strong>Knowledge graph</strong> — stores connected facts · entities, relations, attributes · “Riya hasSkill Python” · answers “what facts are known?” · analogy: <em>sentences / populated map</em>."},
 {q:"Agent function vs Agent program", t:"m1t5",
  a:"<strong>Agent function</strong> — the abstract <em>mathematical description</em>: the mapping F : P* → A from percept sequences to actions.<br><br><strong>Agent program</strong> — the <em>concrete implementation</em> running on the agent architecture."},
 {q:"Traditional AI vs Agentic AI", t:"m1t11",
  a:"Answers questions ↔ Completes goals · Reactive ↔ Proactive · Single response ↔ Multi-step workflow · Limited memory ↔ Maintains context · No planning ↔ Plans tasks · Limited tool usage ↔ Uses APIs, browsers, databases · Requires continuous user input ↔ Acts autonomously within permissions.<br><br><em>The four LO axes: autonomy, memory, tool use, goal orientation.</em>"},
 {q:"Goal-based vs Utility-based agent", t:"m1t9",
  a:"<strong>Goal-based</strong> — knows a goal describing desirable situations, and chooses actions that <em>achieve</em> it. May need to consider long action sequences (searching and planning). e.g. Google Maps.<br><br><strong>Utility-based</strong> — adds a <strong>utility function mapping each state to a real number</strong>, so it chooses the <em>best way</em> among several alternatives that all reach the goal. e.g. Uber choosing fastest/cheapest/safest."},
 {q:"Hill climbing vs Simulated annealing", t:"m2t9",
  a:"<strong>Hill climbing</strong> never accepts a worse neighbour, so it gets trapped in local optima, plateaux and ridges.<br><br><strong>Simulated annealing</strong> accepts bad moves with probability e<sup>ΔE/T</sup>, letting it escape local optima; the frequency of bad moves decreases as T falls. If T decreases slowly enough it finds the global optimum with probability approaching 1."},
 {q:"Taxonomy vs Ontology", t:"m3t13",
  a:"<strong>Taxonomy</strong> — mostly “is-a” classification. Job → Technical Job, Management Job.<br><br><strong>Ontology</strong> — hierarchy <em>plus</em> rich relationships, properties and constraints. Student —appliesFor→ Job —requires→ Skill."},
 {q:"Prior vs Posterior probability", t:"m4t2",
  a:"<strong>Prior / unconditional</strong> — belief <em>before</em> evidence. P(cavity) = 0.2.<br><br><strong>Posterior / conditional</strong> — belief <em>after</em> evidence. P(cavity | toothache) = 0.6."},
 {q:"Uninformed vs Informed search", t:"m2t3",
  a:"<strong>Uninformed (blind)</strong> — has no information except the problem definition. BFS, DFS, DLS, IDS.<br><br><strong>Informed (heuristic)</strong> — knows where to look for the solution, using a heuristic h(n). Best-first, Greedy, A*."},
 {q:"The four types of hill climbing", t:"m2t8",
  a:"<strong>Simple</strong> — examines one neighbour at a time; moves on the first better one.<br><strong>Steepest-ascent</strong> — generates all neighbours, moves to the best.<br><strong>Stochastic</strong> — randomly picks among the <em>uphill</em> neighbours; never a worse one.<br><strong>Random-restart</strong> — repeats from different random initial states; the only one that reliably escapes local optima."}
]},
{id:"fc_traps", title:"Exam Traps", desc:"The specific errors the class notes and slides flag as most common.", cards:[
 {q:"A* trap: when exactly does the algorithm stop?", t:"m2t6",
  a:"When the goal is <strong>selected for expansion</strong> (popped as the minimum-f node) — <em>not</em> when it is first generated.<br><br>In the class example, stopping at generation gives cost <strong>19</strong>; continuing correctly gives <strong>18</strong> via S→B→E→F→G, because B and D were still in OPEN with f = 18 &lt; 19."},
 {q:"A* trap: how do you recover the final path?", t:"m2t6",
  a:"By <strong>following parent pointers backwards from the goal</strong>. The class note reads: <em>“A* makes the final path with respect to the parent node and starting from G, going in reverse.”</em><br><br>The CLOSED list is the <em>order of expansion</em>, not the path. Reading the path off CLOSED is a classic error."},
 {q:"Alpha–beta trap: does α ≥ β include equality?", t:"m2t12",
  a:"<strong>Yes.</strong> The condition is α ≥ β, so equality prunes too.<br><br>In the class example, α = −4 and β = −4 at node B₂ pruned the entire right-most MAX node and both its leaves (−11 and 7)."},
 {q:"FOL trap: what happens if you write ∀x (Student(x) ∧ Studies(x, Maths))?", t:"m3t4",
  a:"You have claimed that <strong>everything in the universe</strong> is a student who studies mathematics — including chairs and planets.<br><br>∀ needs a <em>guard</em> (→) to restrict the claim; ∃ needs a <em>witness</em> (∧) to assert both properties at once."},
 {q:"Resolution trap: what does failing to derive □ prove?", t:"m3t8",
  a:"<strong>Nothing about the truth of the goal.</strong> It shows only that the KB cannot <em>prove</em> the goal. “Not provable” ≠ “false”.<br><br>The slides list “treating a failed proof as proof that the query is false” among the common student mistakes."},
 {q:"Chaining trap: which is data-driven and which is goal-driven?", t:"m3t11",
  a:"<strong>Forward = data-driven. Backward = goal-driven.</strong><br><br>The slides explicitly list “calling backward chaining data-driven or forward chaining goal-driven” as a common mistake. Memory line: Forward asks “What can I conclude?”, backward asks “What must I prove?”"},
 {q:"Complexity trap: which search has O(bd) space?", t:"m2t3",
  a:"<strong>Iterative deepening search</strong> — O(bd), linear.<br><br>BFS has O(b<sup>d</sup>) — <em>exponential</em>. The two are easy to confuse when written quickly; the difference is whether d is a multiplier or an exponent."},
 {q:"Bayes trap: is P(A|B) the same as P(B|A)?", t:"m4t2",
  a:"<strong>No — they can differ by orders of magnitude.</strong><br><br>Meningitis causes a stiff neck 70% of the time: P(stiff neck | meningitis) = 0.7. But P(meningitis | stiff neck) ≈ 0.0014, because meningitis is so rare. Always check which direction the question asks for."},
 {q:"CPT trap: how do you count independent values?", t:"m4t4",
  a:"<strong>2<sup>k</sup> where k is the number of PARENTS</strong> — not children, and <em>not doubled</em> for the negative case.<br><br>P(¬X | parents) = 1 − P(X | parents), so it is not independent. A root node with no parents still needs 1 value."},
 {q:"Environment trap: is medical diagnosis single- or multi-agent?", t:"m1t8",
  a:"<strong>Single agent</strong>, according to the lecture's classification table — even though it is partially observable, stochastic, sequential, dynamic and continuous.<br><br>Learn that table row by row; it is the most likely source of a classification question."},
 {q:"Simulated annealing trap: is SA memory-based?", t:"m2t9",
  a:"<strong>No — SA is memoryless.</strong> The slides state it does not use any information gathered during the search.<br><br>Contrast with genetic algorithms, which carry a whole population forward between generations."}
]}

/* --------------------------- STORAGE / STATE ------------------------- */
const STORAGE_KEY = "cepcc712_ai_study_progress_v1";
const THEME_KEY   = "sem7.theme";
const SCHEMA      = 1;

/* A fresh user ALWAYS starts here. No progress is ever hard-coded. */
function defaultProgress(){
  return {
    schema: SCHEMA,
    topics:     {},   // topicId -> "prog" | "done"
    practice:   {},   // topicId -> true (practice attempted/completed)
    revision:   {},   // revisionId -> true
    flashcards: {},   // deckId -> true (deck reviewed)
    quizzes:    {},   // quizId  -> {score,total,pct,at}
    topicStats: {},   // topicId -> {correct,total}  (drives weak topics)
    lastStudied: null,
    lastVisit:  null,
    streak:     0,
    firstVisit: null
  };
}

let P = defaultProgress();

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ P = defaultProgress(); P.firstVisit = todayStr(); P.isNew = true; return; }
    const parsed = JSON.parse(raw);
    const v = validateProgress(parsed);
    if(!v.ok){ P = defaultProgress(); P.firstVisit = todayStr(); P.isNew = true; return; }
    P = v.data;
  }catch(e){
    P = defaultProgress(); P.firstVisit = todayStr(); P.isNew = true;
  }
}

/* Validates and NORMALISES any imported/stored object so malformed JSON
   can never break the app. Unknown ids are silently dropped.            */
function validateProgress(obj){
  if(!obj || typeof obj !== "object" || Array.isArray(obj)) return {ok:false};
  const d = defaultProgress();
  const topicIds = new Set(allTopics().map(t=>t.id));
  const quizIds  = new Set(QUIZZES.map(q=>q.id));
  const deckIds  = new Set(DECKS.map(x=>x.id));
  const revIds   = new Set(REVISION.map(r=>r.id));

  const pickMap = (src, allowed, fn) => {
    const out = {};
    if(src && typeof src === "object" && !Array.isArray(src)){
      for(const k of Object.keys(src)){
        if(!allowed.has(k)) continue;
        const val = fn(src[k]);
        if(val !== undefined) out[k] = val;
      }
    }
    return out;
  };

  d.topics = pickMap(obj.topics, topicIds, v => (v==="done"||v==="prog") ? v : undefined);
  d.practice = pickMap(obj.practice, topicIds, v => v === true ? true : undefined);
  d.revision = pickMap(obj.revision, revIds, v => v === true ? true : undefined);
  d.flashcards = pickMap(obj.flashcards, deckIds, v => v === true ? true : undefined);
  d.quizzes = pickMap(obj.quizzes, quizIds, v => {
    if(!v || typeof v !== "object") return undefined;
    const score = num(v.score), total = num(v.total);
    if(score === undefined || total === undefined || total <= 0) return undefined;
    return {score:clamp(score,0,total), total, pct:Math.round(clamp(score,0,total)/total*100),
            at: typeof v.at === "string" ? v.at : todayStr()};
  });
  d.topicStats = pickMap(obj.topicStats, topicIds, v => {
    if(!v || typeof v !== "object") return undefined;
    const c = num(v.correct), t = num(v.total);
    if(c === undefined || t === undefined || t <= 0) return undefined;
    return {correct:clamp(c,0,t), total:t};
  });

  d.lastStudied = topicIds.has(obj.lastStudied) ? obj.lastStudied : null;
  d.lastVisit   = typeof obj.lastVisit === "string" ? obj.lastVisit : null;
  d.firstVisit  = typeof obj.firstVisit === "string" ? obj.firstVisit : todayStr();
  d.streak      = clamp(num(obj.streak) ?? 0, 0, 3650);
  return {ok:true, data:d};
}
const num = v => (typeof v === "number" && isFinite(v)) ? v : undefined;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(P)); }
  catch(e){ toast("Could not save — browser storage may be full or blocked."); }
}

function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
const pad = n => String(n).padStart(2,"0");
function daysBetween(a,b){
  const d1=new Date(a+"T00:00:00"), d2=new Date(b+"T00:00:00");
  return Math.round((d2-d1)/86400000);
}
/* Streak = consecutive calendar days the site was opened. */
function touchVisit(){
  const t = todayStr();
  if(P.lastVisit === t) return;
  if(!P.lastVisit) P.streak = 1;
  else {
    const gap = daysBetween(P.lastVisit, t);
    P.streak = gap === 1 ? (P.streak||0)+1 : 1;
  }
  P.lastVisit = t;
  saveProgress();
}

let _topicCache = null;
function allTopics(){
  if(_topicCache) return _topicCache;
  _topicCache = [];
  COURSE.modules.forEach(m => m.topics.forEach(t => {
    _topicCache.push(Object.assign({}, t, {moduleId:m.id, moduleNum:m.num, moduleTitle:m.title}));
  }));
  return _topicCache;
}
const topicById  = id => allTopics().find(t => t.id === id);
const loById     = id => LOS.find(l => l.id === id);
const losForTopic = tid => LOS.filter(l => l.topics.includes(tid));
const losForModule = mid => LOS.filter(l => l.m === mid);
const impqForLO  = lid => IMPQ.filter(q => q.lo === lid);
/* An LO is 'answerable' when at least one of its topics has real notes. */
function loStatus(lo){
  const ts = lo.topics.map(topicById).filter(Boolean);
  const real = ts.filter(t => !t.notCovered);
  const done = real.filter(t => statusOf(t.id) === "done").length;
  return {topics:ts, real:real.length, done, pct:pct(done, real.length),
          covered: real.length > 0};
}
const moduleById = id => COURSE.modules.find(m => m.id === id);
const quizByModule = mid => QUIZZES.find(q => q.module === mid);

/* Core only (SEM7.coreOnly): Extra topics leave the module lists, the dashboard
   and the scoped counts. Quizzes count as Extra, as in the hub's Core figure.
   The hub reads the unscoped counts, so its figures don't move with the switch. */
const inScope = t => !SEM7.coreOnly() || (SEM7.isCore(t) && !t.notCovered);

/* Countable study items. A topic counts ONLY when explicitly marked done. */
function moduleItems(m, scoped){
  const items = [];
  m.topics.forEach(t => {
    if(scoped && !inScope(t)) return;
    items.push({kind:"topic", id:t.id, type:t.type, done: P.topics[t.id] === "done"});
    if(t.type === "numerical" && t.practice && t.practice.length)
      items.push({kind:"practice", id:t.id, type:"practice", done: P.practice[t.id] === true});
  });
  const q = quizByModule(m.id);
  if(q && !(scoped && SEM7.coreOnly())) items.push({kind:"quiz", id:q.id, type:"quiz", done: !!P.quizzes[q.id]});
  return items;
}
function pct(done,total){ return total ? Math.round(done/total*100) : 0; }

function moduleProgress(m, scoped){
  const items = moduleItems(m, scoped);
  const done = items.filter(i=>i.done).length;
  return {done, total:items.length, pct:pct(done,items.length)};
}
/* Overall progress = completed study items / total study items × 100 */
function overallProgress(scoped){
  let done=0, total=0;
  COURSE.modules.forEach(m=>{ const p=moduleProgress(m, scoped); done+=p.done; total+=p.total; });
  return {done, total, pct:pct(done,total)};
}
function breakdown(scoped){
  const b = {theory:{d:0,t:0}, numerical:{d:0,t:0}, practice:{d:0,t:0}, quiz:{d:0,t:0}};
  COURSE.modules.forEach(m => moduleItems(m, scoped).forEach(i=>{
    const k = i.kind==="topic" ? i.type : i.kind;
    if(!b[k]) return;
    b[k].t++; if(i.done) b[k].d++;
  }));
  return b;
}
function quizPerformance(){
  const done = Object.values(P.quizzes);
  if(!done.length) return null;
  const score = done.reduce((s,q)=>s+q.score,0);
  const total = done.reduce((s,q)=>s+q.total,0);
  return {taken:done.length, of:QUIZZES.length, score, total, pct:pct(score,total)};
}

/* Weak topics: quiz accuracy < 60% over at least 2 attempted questions.
   Purely rule-based — no pretence of AI.                                */
const WEAK_THRESHOLD = 60, WEAK_MIN_Q = 2;
function weakTopics(){
  const out = [];
  for(const id of Object.keys(P.topicStats)){
    const s = P.topicStats[id];
    if(!s || s.total < WEAK_MIN_Q) continue;
    const acc = Math.round(s.correct/s.total*100);
    if(acc < WEAK_THRESHOLD){
      const t = topicById(id);
      if(t) out.push({topic:t, acc, correct:s.correct, total:s.total});
    }
  }
  return out.sort((a,b)=>a.acc-b.acc);
}
function isWeak(id){
  const s = P.topicStats[id];
  return !!(s && s.total >= WEAK_MIN_Q && (s.correct/s.total*100) < WEAK_THRESHOLD);
}
function statusOf(id){ return P.topics[id] || "none"; }

/* ------------------- "WHAT SHOULD I STUDY NEXT?" --------------------- */
/* Simple, transparent rule ladder — evaluated strictly in order.        */
function studyNext(){
  const ts = allTopics().filter(t => !t.notCovered && inScope(t));

  // 1. A weak topic from quiz results that has not been re-marked complete
  const weak = weakTopics().filter(w => inScope(w.topic));
  for(const w of weak){
    if(statusOf(w.topic.id) !== "done" || true){
      return {topic:w.topic, reason:`Weak topic — quiz accuracy ${w.acc}%`,
              plan:"Review the theory, work through the example, then retake the module quiz.", kind:"weak"};
    }
  }
  // 2. A topic already in progress — finish what you started
  const inProg = ts.find(t => statusOf(t.id) === "prog");
  if(inProg) return {topic:inProg, reason:"You marked this in progress", plan:"Finish this topic and mark it complete.", kind:"prog"};

  // 3. An incomplete HIGH-priority topic, earliest module first
  const hi = ts.find(t => t.priority === "high" && statusOf(t.id) !== "done");
  if(hi) return {topic:hi, reason:"High priority + incomplete", plan:"Work through Learn → Understand → Example → Exam answer, then mark complete.", kind:"high"};

  // 4. A numerical whose practice set is not yet done
  const prac = ts.find(t => t.type === "numerical" && t.practice && t.practice.length && !P.practice[t.id]);
  if(prac) return {topic:prac, reason:"Numerical practice still pending", plan:"Attempt each practice problem before revealing the solution.", kind:"practice"};

  // 5. Any remaining incomplete topic
  const rest = ts.find(t => statusOf(t.id) !== "done");
  if(rest) return {topic:rest, reason:`Remaining ${rest.priority} priority topic`, plan:"Study and mark complete.", kind:"low"};

  // 6. An untaken quiz
  const q = QUIZZES.find(x => !P.quizzes[x.id]);
  if(q) return {quiz:q, reason:"All topics complete — test yourself", plan:"Take this quiz to confirm your recall.", kind:"quiz"};

  // 7. Everything done — revise
  return {revise:true, reason:"Everything is marked complete", plan:"Move to Quick Revision and retake quizzes to keep it fresh.", kind:"revise"};
}

function viewModule(id){

  html += SEM7.ui.subtabs([tab("numerical","Numericals",nums.length), tab("theory","Theory",theory.length), tab("review","Quick Review")]

}

let studyStep = "learn";
function viewTopic(id){
  const t = topicById(id);
  if(!t) return notFound();
  const m = moduleById(t.moduleId), isNum = t.type === "numerical", st = statusOf(t.id);
  const modLink = `data-act="go" data-h="#/module/${m.id}"`;

  /* 1 · Concept: the lecture explanation, the formula and its symbols */
  let concept = t.learn || "";
  if(t.algorithm) concept += `<h4>Algorithm</h4>${t.algorithm}`;
  if(t.props) concept += `<h4>Properties</h4><p>${t.props}</p>`;
  if(t.limitations && t.limitations.length) concept += `<h4>Limitations</h4><ul>${t.limitations.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  if(isNum && t.formula){
    concept += `<h4>Formula</h4><div class="fx">${t.formula}</div>` + (t.formulaNote ? `<p class="small muted">${t.formulaNote}</p>` : "");
    if(t.variables && t.variables.length) concept += `<div class="tw"><table><thead><tr><th>Symbol</th><th>Meaning</th></tr></thead><tbody>` +
      t.variables.map(v=>`<tr><td><code>${v.v}</code></td><td>${v.m}</td></tr>`).join("") + `</tbody></table></div>`;
  }
  let extra = "";
  if(isNum && t.understand) extra += `<div class="box neutral"><h5>In simpler words</h5>${t.understand}</div>`;
  if(!isNum && t.examples && t.examples.length){
    extra += `<h4 class="s7-sub-h">${SEM7.icon("book")}Examples from the teacher's material</h4>` +
      t.examples.map(e=>`<div class="card"><h4 style="margin-top:0">${esc(e.t)}</h4>${SEM7.ui.visualize(e.b)}</div>`).join("");
  }
  const tlos = losForTopic(t.id);
  if(tlos.length) extra += `<div class="lo-strip"><div class="lo-strip-h">Answers ${tlos.length===1?"this learning outcome":"these learning outcomes"}</div>
      ${tlos.map(l=>`<div class="lo-item"><span class="badge b-theory">${l.id}</span><span><strong>${esc(l.verb)}</strong> — ${esc(l.text)}</span></div>`).join("")}</div>`;

  const marks = t.marks && t.marks.length ? t.marks : null;
  const worked = isNum && t.worked ? [{id:t.id+"w", title:"Worked example", q:t.worked.problem,
    body:t.diagram2 ? diaBlock(t.diagram2) : "", steps:t.worked.steps, answer:t.worked.answer, why:t.worked.check}] : [];
  const iq = IMPQ.filter(q=>q.t===t.id);

  const order = COURSE.modules.flatMap(x => ["numerical","theory"].flatMap(ty =>
    x.topics.filter(y => y.type===ty).map(y => ({id:y.id, m:x.id, title:y.title}))));
  const nb = SEM7.ui.neighbours(order, t.id, mid => `Module ${moduleById(mid).num}`);

  let foot = `<div class="card s7-markcard"><div><h3 style="font-size:.95rem;margin:0 0 .2rem">Mark this topic</h3>

  if(isNum && t.practice && t.practice.length) foot += `<div class="card s7-markcard"><div><h3 style="font-size:.95rem;margin:0 0 .2rem">Practice set</h3>

  return SEM7.ui.topic({

      title:esc(t.title), meta:priBadge(t.priority)+marksBadge(t.marks),

    key:!isNum && t.understand ? {t:"In simpler words", b:t.understand} : (isNum && t.concept ? {t:"The idea", b:t.concept} : null),
    diagram:t.diagram || TOPIC_DIA[t.id] ? diaBlock(t.diagram || TOPIC_DIA[t.id]) : "",
    concept, extra,
    answer:t.examAnswer ? [{label:marks ? marks.join(" / ")+" marks" : "Model answer", marks:marks ? Math.max.apply(null, marks) : null, body:t.examAnswer}] : [],
    mistakes:t.mistakes,
    examples:worked,
    practice:(t.practice||[]).map((p,i)=>({id:t.id+"p"+i, d:p.d, q:p.q, a:p.s})),
    questions:iq.map(q=>({q:q.q, marks:q.marks})),
    foot,
    pager:{prev:side(nb.prev), next:side(nb.next), up:{label:`Back to Module ${m.num}`, attrs:modLink}}
  });
}

${(()=>{const L=[-4,-9,9,6,-17,-4,-11,7], lx=i=>34+i*52, C=[-4,9,-4,7], cx=i=>(lx(2*i)+lx(2*i+1))/2, B=[-4,-4], bx=i=>(cx(2*i)+cx(2*i+1))/2, rx=(bx(0)+bx(1))/2;
 const hot=new Set(["r-b0","r-b1","b0-c0","b1-c2","c0-l0","c2-l5"]);
 const ln=(k,x1,y1,x2,y2)=>`<path d="M${x1} ${y1} L${x2} ${y2}" class="${hot.has(k)?"d-line-a":"d-line"}"/>`;
 const up=(x,y,v)=>`<path d="M${x} ${y-16} L${x+20} ${y+12} L${x-20} ${y+12} z" class="d-node-a"/><text x="${x}" y="${y+3}" class="d-txt">${v}</text>`;
 const dn=(x,y,v)=>`<path d="M${x-20} ${y-12} L${x+20} ${y-12} L${x} ${y+16} z" class="d-node-w"/><text x="${x}" y="${y-3}" class="d-txt">${v}</text>`;
 let s="";
 B.forEach((_,i)=>{s+=ln("r-b"+i,rx,40,bx(i),88);});
 C.forEach((_,i)=>{s+=ln("b"+(i>>1)+"-c"+i,bx(i>>1),100,cx(i),150);});
 L.forEach((_,i)=>{s+=ln("c"+(i>>1)+"-l"+i,cx(i>>1),162,lx(i),198);});
 s+=up(rx,30,"−4")+B.map((v,i)=>dn(bx(i),98,"−4")).join("")+C.map((v,i)=>up(cx(i),152,String(v).replace("-","−"))).join("");
 s+=L.map((v,i)=>`<rect x="${lx(i)-18}" y="198" width="36" height="24" rx="5" class="${i===0||i===5?"d-node-a":"d-node"}"/><text x="${lx(i)}" y="210" class="d-txt">${String(v).replace("-","−")}</text>`).join("");
 return s+`<text x="12" y="30" class="d-txt-s" style="text-anchor:start">MAX</text><text x="12" y="92" class="d-txt-s" style="text-anchor:start">MIN</text><text x="12" y="152" class="d-txt-s" style="text-anchor:start">MAX</text>`;})()}
</svg>`},

/* topic id → diagram key, for Core topics whose data names no diagram */
const TOPIC_DIA = {m1t8:"envProps", m1t11:"agenticLoop", m2t1:"problemForm", m2t3:"bfsDfs", m2t9:"annealing",
  m2t10:"gaCycle", m2t11:"minimaxTree", m4t6:"bayesNet", m4t7:"stripsFly", m4t10:"htnGoa", m4t15:"bayesNet",
  m4t17:"popShoes", m5t2:"shapLime", m6t5:"singleMulti"};

function diaBlock(key){
  const d = DIA[key]; if(!d) return "";
  return `<div class="dia">${d.svg}<div class="dia-cap">✏️ ${esc(d.cap)}</div></div>`;
}

function renderStep(t, step){
  const isNum = t.type === "numerical";
  switch(step){

  case "learn": {
    let h = "";
    if(isNum && t.concept) h += `<div class="note"><span class="note-t">The idea</span>${t.concept}</div>`;
    h += t.learn || "";
    if(t.diagram) h += diaBlock(t.diagram);
    if(t.algorithm) h += `<h4>Algorithm</h4>${t.algorithm}`;
    if(t.props) h += `<h4>Properties</h4><p>${t.props}</p>`;
    if(t.limitations && t.limitations.length)
      h += `<h4>Limitations</h4><ul>${t.limitations.map(x=>`<li>${x}</li>`).join("")}</ul>`;
    return h;
  }

  case "understand":
    return `<div class="note tip"><span class="note-t">In simpler words — same academic meaning</span></div>${t.understand||""}`;

  case "formula": {
    let h = `<h4>Formula</h4><div class="fx">${t.formula||""}</div>`;
    if(t.formulaNote) h += `<p style="font-size:.85rem;color:var(--muted)">${t.formulaNote}</p>`;
    if(t.variables && t.variables.length){
      h += `<h4>What every symbol means</h4><div class="tw"><table><thead><tr><th>Symbol</th><th>Meaning</th></tr></thead><tbody>`;
      t.variables.forEach(v=>{ h += `<tr><td><code>${v.v}</code></td><td>${v.m}</td></tr>`; });
      h += `</tbody></table></div>`;
    }
    if(t.whenToUse) h += `<h4>When to use it</h4><p>${t.whenToUse}</p>`;
    if(t.algorithm) h += `<h4>Algorithm</h4>${t.algorithm}`;
    if(t.props) h += `<h4>Properties</h4><p>${t.props}</p>`;
    return h;
  }

  case "example": {
    if(isNum && t.worked){
      let h = `<h4>Worked example</h4><div class="note"><span class="note-t">Problem</span>${t.worked.problem}</div>`;
      if(t.diagram) h += diaBlock(t.diagram);
      h += `<h4>Step-by-step solution</h4><ol class="wsteps">${t.worked.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`;
      h += `<div class="ans">Final answer: ${t.worked.answer}</div>`;
      if(t.worked.check) h += `<div class="note tip"><span class="note-t">Check your work</span>${t.worked.check}</div>`;
      if(t.diagram2) h += diaBlock(t.diagram2);
      return h;
    }
    if(t.examples && t.examples.length){
      return `<h4>Examples from the teacher's material</h4>` + t.examples.map(e=>
        `<details open><summary>${esc(e.t)}</summary><div class="det-body">${e.b}</div></details>`).join("");
    }
    return `<div class="empty">No separate examples for this topic — see the Learn step.</div>`;
  }

  case "exam": {
    const el = losForTopic(t.id);
    let h = `<div class="note tip"><span class="note-t">Write this in the exam</span>Sized to the marks — a 2-mark answer is a definition plus a key point, a 5-mark answer adds explanation and an example or diagram.
      ${el.length?`<br><br><strong>This answers ${el.map(l=>l.id).join(", ")}</strong> — “${esc(el[0].text)}” So lead with the outcome's own verb (<em>${esc(el[0].verb)}</em>) and make sure every element it names appears somewhere in your answer.`:""}</div>`;
    h += t.examAnswer || "";
    if(t.diagram) h += diaBlock(t.diagram);
    return h;
  }

  case "mistakes":
    return `<div class="note trap"><span class="note-t">Lose marks here</span>These are the errors flagged in the lecture slides and class notes, plus the ones that follow from the algorithm itself.</div>
      <ul>${(t.mistakes||[]).map(x=>`<li>${x}</li>`).join("")}</ul>`;

  case "practice": {
    let h = `<div class="note"><span class="note-t">Attempt before revealing</span>Each solution is hidden. Work the problem on paper first — revealing early is the fastest way to feel prepared while learning nothing.</div>`;
    (t.practice||[]).forEach((p,i)=>{
      h += `<details><summary><span class="badge b-${p.d==="Exam-level"||p.d==="Difficult"?"high":p.d==="Moderate"?"med":"low"}">${esc(p.d)}</span>&nbsp; Problem ${i+1}</summary>
        <div class="det-body"><p>${p.q}</p>
        <details><summary>Reveal solution</summary><div class="det-body">${p.s}</div></details>
        </div></details>`;
    });
    return h;
  }
  }
  return "";
}

/* ------------------------------ QUIZ RUN ----------------------------- */
let QS = null;   // {quiz, i, answers[], checked[], sel}
function startQuiz(id){
  const quiz = QUIZZES.find(q=>q.id===id);
  if(!quiz) return;
  QS = {quiz, i:0, answers:new Array(quiz.questions.length).fill(null),
        checked:new Array(quiz.questions.length).fill(false), sel:null, finished:false};
}
function viewQuiz(id){
  if(!QS || QS.quiz.id !== id) startQuiz(id);
  if(!QS) return notFound();
  if(QS.finished) return viewQuizResult();

  const {quiz, i} = QS, q = quiz.questions[i];
  const checked = QS.checked[i];
  let html = `<div class="study-nav">
    <div><div class="crumb">${esc(quiz.title)}</div><h1 style="margin-top:.3rem;font-size:1.25rem">Question ${i+1} of ${quiz.questions.length}</h1></div>
    <button class="btn btn-sm" data-act="go" data-h="#/quizzes">Exit quiz</button></div>`;

  html += `<div class="qbar">${bar(Math.round(i/quiz.questions.length*100))}
    <span>${QS.checked.filter(Boolean).length} answered</span></div>`;

  html += `<div class="card"><div class="q"><div class="q-stem">${q.q}</div>`;

  if(q.type === "num"){
    const val = QS.answers[i];
    html += `<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem">
      <label for="numIn">Your answer</label>
      <input type="number" id="numIn" step="any" value="${val!==null&&val!==undefined?val:""}" ${checked?"disabled":""}
        style="width:140px" aria-label="Numerical answer">
    </div>`;
    if(checked){
      const ok = isCorrect(q, QS.answers[i]);
      html += `<div class="${ok?"ans":"note trap"}">${ok?"Correct":`Not quite — the correct answer is <strong>${q.ans}</strong>`}</div>`;
    }
  } else {
    const multi = q.type === "multi";
    q.o.forEach((opt,oi)=>{
      let cls = "opt";
      const chosen = multi ? (Array.isArray(QS.answers[i]) && QS.answers[i].includes(oi)) : QS.answers[i] === oi;
      if(!checked && chosen) cls += " sel";
      if(checked){
        const isAns = multi ? q.a.includes(oi) : q.a === oi;
        if(isAns) cls += " right";
        else if(chosen) cls += " wrong";
      }
      html += `<button class="${cls}" data-act="opt" data-i="${oi}" ${checked?"disabled":""} aria-pressed="${chosen}">
        <span class="mk">${multi?(chosen?"☑":"☐"):String.fromCharCode(65+oi)}</span>${opt}</button>`;
    });
    if(multi && !checked) html += `<div style="font-size:.76rem;color:var(--muted);margin:.3rem 0 .6rem">Select all that apply, then check your answer.</div>`;
  }

  if(checked){
    const ok = isCorrect(q, QS.answers[i]);
    html += `<div class="note ${ok?"tip":"warn"}" style="margin-top:.8rem">
      <span class="note-t">${ok?"Correct":"Explanation"}</span>${q.e}</div>`;
    const t = topicById(q.t);
    if(t) html += `<div style="font-size:.79rem;color:var(--muted);margin-top:.5rem">Tests: <button class="trow-t" style="display:inline;font-size:.79rem;font-weight:600" data-act="go" data-h="#/topic/${t.id}">Module ${t.moduleNum} → ${esc(t.title)}</button></div>`;
  }
  html += `</div>`;

  html += `<div class="btn-row" style="margin-top:1rem;justify-content:space-between">
    <button class="btn" data-act="qprev" ${i===0?"disabled":""}>← Previous</button>
    <div class="btn-row">
      ${!checked?`<button class="btn btn-primary" data-act="qcheck">Check answer</button>`:""}
      ${checked && i < quiz.questions.length-1?`<button class="btn btn-primary" data-act="qnext">Next question →</button>`:""}
      ${checked && i === quiz.questions.length-1?`<button class="btn btn-primary" data-act="qfinish">Finish &amp; see score</button>`:""}
    </div></div></div>`;
  return html;
}
function isCorrect(q, ans){
  if(ans === null || ans === undefined) return false;
  if(q.type === "num") return Math.abs(Number(ans) - q.ans) <= (q.tol||0);
  if(q.type === "multi"){
    if(!Array.isArray(ans)) return false;
    const a = [...ans].sort((x,y)=>x-y), b = [...q.a].sort((x,y)=>x-y);
    return a.length === b.length && a.every((v,k)=>v===b[k]);
  }
  return ans === q.a;
}
function finishQuiz(){
  const {quiz} = QS;
  let score = 0;
  quiz.questions.forEach((q,i)=>{
    const ok = QS.checked[i] && isCorrect(q, QS.answers[i]);
    if(ok) score++;
    /* Feed weak-topic tracking — only questions actually checked count. */
    if(QS.checked[i]){
      const s = P.topicStats[q.t] || {correct:0,total:0};
      s.total++; if(ok) s.correct++;
      P.topicStats[q.t] = s;
    }
  });
  const total = quiz.questions.length;
  P.quizzes[quiz.id] = {score, total, pct:pct(score,total), at:todayStr()};
  saveProgress();
  QS.finished = true; QS.score = score;
  render();
}
function viewQuizResult(){
  const {quiz, score} = QS, total = quiz.questions.length, p = pct(score,total);
  const wrong = quiz.questions.map((q,i)=>({q,i,ok:QS.checked[i]&&isCorrect(q,QS.answers[i])})).filter(x=>!x.ok);
  const revise = [...new Set(wrong.map(w=>w.q.t))].map(topicById).filter(Boolean);

  let html = `<div class="page-h"><div class="eyebrow">Result</div><h1>${esc(quiz.title)}</h1></div>`;
  html += `<div class="card" style="text-align:center;padding:1.6rem 1.1rem">
    ${ring(p, 110)}
    <div class="big-score" style="margin-top:.6rem;color:${p>=60?"var(--ok)":"var(--danger)"}">${p}%</div>
    <p style="margin:.4rem 0 0;color:var(--text-2)"><strong>${score}</strong> correct · <strong>${total-score}</strong> incorrect · out of ${total}</p>
  </div>`;

  if(revise.length){
    html += `<div class="sec-h"><h2>Topics requiring revision</h2><span class="hint">These now count towards weak-topic detection.</span></div><div class="card">`;
    revise.forEach(t=>{
      const s = P.topicStats[t.id];
      const acc = s ? Math.round(s.correct/s.total*100) : 0;
      html += `<div class="weak-row"><span class="badge b-warn" aria-hidden="true">⚠</span>
        <div style="flex:1;min-width:0">
          <button class="trow-t" data-act="go" data-h="#/topic/${t.id}">${esc(t.title)}</button>
          <div style="font-size:.76rem;color:var(--muted)">Module ${t.moduleNum} · lifetime accuracy ${acc}% (${s.correct}/${s.total})</div>
        </div>
        <button class="btn btn-sm" data-act="go" data-h="#/topic/${t.id}">Review</button></div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="note tip" style="margin-top:1rem"><span class="note-t">Clean sweep</span>Every question correct — nothing from this quiz needs revision.</div>`;
  }

  html += `<div class="sec-h"><h2>Review your answers</h2></div>`;
  quiz.questions.forEach((q,i)=>{
    const ok = QS.checked[i] && isCorrect(q, QS.answers[i]);
    const yourAns = QS.checked[i]
      ? (q.type==="num" ? esc(String(QS.answers[i]))
         : q.type==="multi" ? (Array.isArray(QS.answers[i])&&QS.answers[i].length? QS.answers[i].map(x=>q.o[x]).join(", ") : "nothing selected")
         : (QS.answers[i]!==null ? q.o[QS.answers[i]] : "nothing selected"))
      : "not answered";
    const correctAns = q.type==="num" ? String(q.ans)
      : q.type==="multi" ? q.a.map(x=>q.o[x]).join(", ") : q.o[q.a];
    html += `<details><summary><span class="badge ${ok?"b-ok":"b-high"}">${ok?"✓":"✗"}</span>&nbsp; Q${i+1}. ${esc(stripTags(q.q).slice(0,72))}${stripTags(q.q).length>72?"…":""}</summary>
      <div class="det-body"><p>${q.q}</p>
      <dl class="kv"><dt>Your answer</dt><dd>${yourAns}</dd><dt>Correct</dt><dd>${correctAns}</dd></dl>
      <div class="note"><span class="note-t">Why</span>${q.e}</div></div></details>`;
  });

  html += `<div class="btn-row" style="margin-top:1.2rem">
    <button class="btn btn-primary" data-act="qretake" data-id="${quiz.id}">Retake this quiz</button>
    <button class="btn" data-act="go" data-h="#/quizzes">All quizzes</button>
    <button class="btn" data-act="go" data-h="#/module/${quiz.module}">Back to module</button>
    <button class="btn" data-act="go" data-h="#/">Dashboard</button></div>`;
  return html;
}

let iqFilter = {m:"all", pri:"all", type:"all", marks:"all", lo:"all"};
function viewImportant(){
  let list = IMPQ.slice();
  if(iqFilter.m !== "all") list = list.filter(q=>q.m===iqFilter.m);
  if(iqFilter.pri !== "all") list = list.filter(q=>q.pri===iqFilter.pri);
  if(iqFilter.type !== "all") list = list.filter(q=>q.type===iqFilter.type);
  if(iqFilter.marks !== "all") list = list.filter(q=>String(q.marks)===iqFilter.marks);
  if(iqFilter.lo !== "all") list = list.filter(q=>q.lo===iqFilter.lo);

  let html = `<div class="page-h"><div class="eyebrow">Exam preparation</div><h1>Important questions</h1>
    <p>Extracted from the uploaded material — the MSE topic list in the class notes, the CIA papers, the extra-problems handout, and marks written by the teacher. Every entry says <em>why</em> it is rated as it is.</p></div>`;

  html += `<div class="note warn"><span class="note-t">Read this</span>Priority reflects the <strong>evidence available in the uploaded material</strong>, not a guarantee. Nothing here is claimed to be certain to appear in the paper — where the teacher's notes state something explicitly (for example "★ 10 marks" beside adversarial search), that is quoted in the reason.</div>`;

  html += `<div class="filters">
    <div class="fg"><label for="iqM">Module</label><select id="iqM" data-act="iqfilter" data-k="m">
      <option value="all"${iqFilter.m==="all"?" selected":""}>All</option>
      ${COURSE.modules.filter(m=>IMPQ.some(q=>q.m===m.id)).map(m=>`<option value="${m.id}"${iqFilter.m===m.id?" selected":""}>Module ${m.num}</option>`).join("")}
    </select></div>
    <div class="fg"><label for="iqP">Priority</label><select id="iqP" data-act="iqfilter" data-k="pri">
      <option value="all"${iqFilter.pri==="all"?" selected":""}>All</option>
      <option value="high"${iqFilter.pri==="high"?" selected":""}>High</option>
      <option value="medium"${iqFilter.pri==="medium"?" selected":""}>Medium</option>
      <option value="low"${iqFilter.pri==="low"?" selected":""}>Low</option>
    </select></div>
    <div class="fg"><label for="iqT">Type</label><select id="iqT" data-act="iqfilter" data-k="type">
      <option value="all"${iqFilter.type==="all"?" selected":""}>All</option>
      <option value="theory"${iqFilter.type==="theory"?" selected":""}>Theory</option>
      <option value="numerical"${iqFilter.type==="numerical"?" selected":""}>Numerical</option>
    </select></div>
    <div class="fg"><label for="iqL">Outcome</label><select id="iqL" data-act="iqfilter" data-k="lo">
      <option value="all"${iqFilter.lo==="all"?" selected":""}>All outcomes</option>
      ${LOS.filter(l=>IMPQ.some(q=>q.lo===l.id)).map(l=>`<option value="${l.id}"${iqFilter.lo===l.id?" selected":""}>${l.id}</option>`).join("")}
    </select></div>
    <div class="fg"><label for="iqK">Marks</label><select id="iqK" data-act="iqfilter" data-k="marks">
      <option value="all"${iqFilter.marks==="all"?" selected":""}>All</option>
      <option value="2"${iqFilter.marks==="2"?" selected":""}>2</option>
      <option value="5"${iqFilter.marks==="5"?" selected":""}>5</option>
      <option value="10"${iqFilter.marks==="10"?" selected":""}>10</option>
    </select></div>
    <span class="count">${list.length} of ${IMPQ.length}</span>
  </div>`;

  if(!list.length) return html + `<div class="empty"><span class="big">∅</span>No questions match these filters.</div>`;

  const order = {high:0, medium:1, low:2};
  list.sort((a,b)=> order[a.pri]-order[b.pri] || b.marks-a.marks);

  list.forEach(q=>{
    const t = topicById(q.t), st = t?statusOf(t.id):"none";
    html += `<div class="card" style="margin-bottom:.6rem">
      <div class="card-h" style="margin-bottom:.4rem">
        <p style="font-weight:570;font-size:.92rem;margin:0;flex:1;min-width:0;line-height:1.5">${esc(q.q)}</p>
        <span class="badge b-${q.pri==="high"?"high":q.pri==="medium"?"med":"low"}">${q.pri==="high"?"High":q.pri==="medium"?"Medium":"Low"}</span>
      </div>
      <div class="badges" style="margin-bottom:.5rem">
        <span class="badge">Module ${moduleById(q.m).num}</span>
        <span class="badge">${q.marks} marks</span>
        ${q.lo&&q.lo!=="—"?`<span class="badge b-theory" title="${esc((loById(q.lo)||{}).text||"")}">${q.lo}</span>`:""}
        ${q.nomat?`<span class="badge b-warn">No material uploaded</span>`:""}
        ${q.type==="numerical"?`<span class="badge b-num">Numerical</span>`:`<span class="badge b-theory">Theory</span>`}
        ${st==="done"?`<span class="badge b-ok">✓ Studied</span>`:""}
        ${t&&isWeak(t.id)?`<span class="badge b-high">⚠ Weak</span>`:""}
      </div>
      <details><summary>Why this is rated ${q.pri}</summary><div class="det-body"><p style="font-size:.87rem;margin:0">${esc(q.why)}</p></div></details>
      ${t?`<div class="btn-row" style="margin-top:.5rem">
        <button class="btn btn-sm btn-primary" data-act="gostep" data-h="#/topic/${t.id}" data-step="${q.type==="numerical"?"example":"exam"}">${q.type==="numerical"?"Worked example":"Model exam answer"} →</button>
        <button class="btn btn-sm" data-act="go" data-h="#/topic/${t.id}">Full topic</button></div>`:""}
    </div>`;
  });
  return html;
}

let loFilter = "all";
function viewOutcomes(){
  let list = LOS.slice();
  if(loFilter !== "all") list = list.filter(l=>l.m===loFilter);

  const real = LOS.filter(l=>loStatus(l).covered);
  const doneL = real.filter(l=>loStatus(l).pct===100).length;

  let html = `<div class="page-h"><div class="eyebrow">What you are actually assessed on</div><h1>Learning outcomes</h1>
    <p>The syllabus does not examine topics — it examines <strong>learning outcomes</strong>. Each one below is reproduced verbatim,

  html += `<div class="grid g3" style="margin-bottom:1.1rem">

    “<strong>Compare</strong> uninformed search strategies” needs a table; “<strong>Construct</strong> knowledge models” needs you to draw one;
    “<strong>Perform</strong> simple inference” needs a calculation. Answers that recite the topic without doing the verb lose marks.</div>`;

  html += `<div class="filters"><div class="fg"><label for="loM">Module</label>
    <select id="loM" data-act="lofilter">
      <option value="all"${loFilter==="all"?" selected":""}>All modules</option>
