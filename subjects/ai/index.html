/* --------------------------- STORAGE / STATE ------------------------- */
const STORAGE_KEY = "cepcc712_ai_study_progress_v1";
const THEME_KEY   = "cepcc712_ai_theme";
const SCHEMA      = 1;

/* A fresh user ALWAYS starts here. No progress is ever hard-coded. */
function defaultProgress(){
  return {
    schema: SCHEMA,
    topics:     {},   // topicId -> "prog" | "done"
    practice:   {},   // topicId -> true (practice attempted/completed)
    revision:   {},   // revisionId -> true
    flashcards: {},   // deckId -> true (deck reviewed)
    quizzes:    {},   // quizId  -> {score,total,pct,at}
    topicStats: {},   // topicId -> {correct,total}  (drives weak topics)
    lastStudied: null,
    lastVisit:  null,
    streak:     0,
    firstVisit: null
  };
}

let P = defaultProgress();

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ P = defaultProgress(); P.firstVisit = todayStr(); P.isNew = true; return; }
    const parsed = JSON.parse(raw);
    const v = validateProgress(parsed);
    if(!v.ok){ P = defaultProgress(); P.firstVisit = todayStr(); P.isNew = true; return; }
    P = v.data;
  }catch(e){
    P = defaultProgress(); P.firstVisit = todayStr(); P.isNew = true;
  }
}

/* Validates and NORMALISES any imported/stored object so malformed JSON
   can never break the app. Unknown ids are silently dropped.            */
function validateProgress(obj){
  if(!obj || typeof obj !== "object" || Array.isArray(obj)) return {ok:false};
  const d = defaultProgress();
  const topicIds = new Set(allTopics().map(t=>t.id));
  const quizIds  = new Set(QUIZZES.map(q=>q.id));
  const deckIds  = new Set(DECKS.map(x=>x.id));
  const revIds   = new Set(REVISION.map(r=>r.id));

  const pickMap = (src, allowed, fn) => {
    const out = {};
    if(src && typeof src === "object" && !Array.isArray(src)){
      for(const k of Object.keys(src)){
        if(!allowed.has(k)) continue;
        const val = fn(src[k]);
        if(val !== undefined) out[k] = val;
      }
    }
    return out;
  };

  d.topics = pickMap(obj.topics, topicIds, v => (v==="done"||v==="prog") ? v : undefined);
  d.practice = pickMap(obj.practice, topicIds, v => v === true ? true : undefined);
  d.revision = pickMap(obj.revision, revIds, v => v === true ? true : undefined);
  d.flashcards = pickMap(obj.flashcards, deckIds, v => v === true ? true : undefined);
  d.quizzes = pickMap(obj.quizzes, quizIds, v => {
    if(!v || typeof v !== "object") return undefined;
    const score = num(v.score), total = num(v.total);
    if(score === undefined || total === undefined || total <= 0) return undefined;
    return {score:clamp(score,0,total), total, pct:Math.round(clamp(score,0,total)/total*100),
            at: typeof v.at === "string" ? v.at : todayStr()};
  });
  d.topicStats = pickMap(obj.topicStats, topicIds, v => {
    if(!v || typeof v !== "object") return undefined;
    const c = num(v.correct), t = num(v.total);
    if(c === undefined || t === undefined || t <= 0) return undefined;
    return {correct:clamp(c,0,t), total:t};
  });

  d.lastStudied = topicIds.has(obj.lastStudied) ? obj.lastStudied : null;
  d.lastVisit   = typeof obj.lastVisit === "string" ? obj.lastVisit : null;
  d.firstVisit  = typeof obj.firstVisit === "string" ? obj.firstVisit : todayStr();
  d.streak      = clamp(num(obj.streak) ?? 0, 0, 3650);
  return {ok:true, data:d};
}
const num = v => (typeof v === "number" && isFinite(v)) ? v : undefined;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(P)); }
  catch(e){ toast("Could not save — browser storage may be full or blocked."); }
}

function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
const pad = n => String(n).padStart(2,"0");
function daysBetween(a,b){
  const d1=new Date(a+"T00:00:00"), d2=new Date(b+"T00:00:00");
  return Math.round((d2-d1)/86400000);
}
/* Streak = consecutive calendar days the site was opened. */
function touchVisit(){
  const t = todayStr();
  if(P.lastVisit === t) return;
  if(!P.lastVisit) P.streak = 1;
  else {
    const gap = daysBetween(P.lastVisit, t);
    P.streak = gap === 1 ? (P.streak||0)+1 : 1;
  }
  P.lastVisit = t;
  saveProgress();
}

/* ------------------------- DERIVED / SELECTORS ----------------------- */
let _topicCache = null;
function allTopics(){
  if(_topicCache) return _topicCache;
  _topicCache = [];
  COURSE.modules.forEach(m => m.topics.forEach(t => {
    _topicCache.push(Object.assign({}, t, {moduleId:m.id, moduleNum:m.num, moduleTitle:m.title}));
  }));
  return _topicCache;
}
const topicById  = id => allTopics().find(t => t.id === id);
const loById     = id => LOS.find(l => l.id === id);
const losForTopic = tid => LOS.filter(l => l.topics.includes(tid));
const losForModule = mid => LOS.filter(l => l.m === mid);
const impqForLO  = lid => IMPQ.filter(q => q.lo === lid);
/* An LO is 'answerable' when at least one of its topics has real notes. */
function loStatus(lo){
  const ts = lo.topics.map(topicById).filter(Boolean);
  const real = ts.filter(t => !t.notCovered);
  const done = real.filter(t => statusOf(t.id) === "done").length;
  return {topics:ts, real:real.length, done, pct:pct(done, real.length),
          covered: real.length > 0};
}
const moduleById = id => COURSE.modules.find(m => m.id === id);
const quizByModule = mid => QUIZZES.find(q => q.module === mid);

/* Countable study items. A topic counts ONLY when explicitly marked done. */
function moduleItems(m){
  const items = [];
  m.topics.forEach(t => {
    items.push({kind:"topic", id:t.id, type:t.type, done: P.topics[t.id] === "done"});
    if(t.type === "numerical" && t.practice && t.practice.length)
      items.push({kind:"practice", id:t.id, type:"practice", done: P.practice[t.id] === true});
  });
  const q = quizByModule(m.id);
  if(q) items.push({kind:"quiz", id:q.id, type:"quiz", done: !!P.quizzes[q.id]});
  return items;
}
function pct(done,total){ return total ? Math.round(done/total*100) : 0; }

function moduleProgress(m){
  const items = moduleItems(m);
  const done = items.filter(i=>i.done).length;
  return {done, total:items.length, pct:pct(done,items.length)};
}
/* Overall progress = completed study items / total study items × 100 */
function overallProgress(){
  let done=0, total=0;
  COURSE.modules.forEach(m=>{ const p=moduleProgress(m); done+=p.done; total+=p.total; });
  return {done, total, pct:pct(done,total)};
}
function breakdown(){
  const b = {theory:{d:0,t:0}, numerical:{d:0,t:0}, practice:{d:0,t:0}, quiz:{d:0,t:0}};
  COURSE.modules.forEach(m => moduleItems(m).forEach(i=>{
    const k = i.kind==="topic" ? i.type : i.kind;
    if(!b[k]) return;
    b[k].t++; if(i.done) b[k].d++;
  }));
  return b;
}
function quizPerformance(){
  const done = Object.values(P.quizzes);
  if(!done.length) return null;
  const score = done.reduce((s,q)=>s+q.score,0);
  const total = done.reduce((s,q)=>s+q.total,0);
  return {taken:done.length, of:QUIZZES.length, score, total, pct:pct(score,total)};
}

/* Weak topics: quiz accuracy < 60% over at least 2 attempted questions.
   Purely rule-based — no pretence of AI.                                */
const WEAK_THRESHOLD = 60, WEAK_MIN_Q = 2;
function weakTopics(){
  const out = [];
  for(const id of Object.keys(P.topicStats)){
    const s = P.topicStats[id];
    if(!s || s.total < WEAK_MIN_Q) continue;
    const acc = Math.round(s.correct/s.total*100);
    if(acc < WEAK_THRESHOLD){
      const t = topicById(id);
      if(t) out.push({topic:t, acc, correct:s.correct, total:s.total});
    }
  }
  return out.sort((a,b)=>a.acc-b.acc);
}
function isWeak(id){
  const s = P.topicStats[id];
  return !!(s && s.total >= WEAK_MIN_Q && (s.correct/s.total*100) < WEAK_THRESHOLD);
}
function statusOf(id){ return P.topics[id] || "none"; }

/* ------------------- "WHAT SHOULD I STUDY NEXT?" --------------------- */
/* Simple, transparent rule ladder — evaluated strictly in order.        */
function studyNext(){
  const ts = allTopics().filter(t => !t.notCovered);

  // 1. A weak topic from quiz results that has not been re-marked complete
  const weak = weakTopics();
  for(const w of weak){
    if(statusOf(w.topic.id) !== "done" || true){
      return {topic:w.topic, reason:`Weak topic — quiz accuracy ${w.acc}%`,
              plan:"Review the theory, work through the example, then retake the module quiz.", kind:"weak"};
    }
  }
  // 2. A topic already in progress — finish what you started
  const inProg = ts.find(t => statusOf(t.id) === "prog");
  if(inProg) return {topic:inProg, reason:"You marked this in progress", plan:"Finish this topic and mark it complete.", kind:"prog"};

  // 3. An incomplete HIGH-priority topic, earliest module first
  const hi = ts.find(t => t.priority === "high" && statusOf(t.id) !== "done");
  if(hi) return {topic:hi, reason:"High priority + incomplete", plan:"Work through Learn → Understand → Example → Exam answer, then mark complete.", kind:"high"};

  // 4. A numerical whose practice set is not yet done
  const prac = ts.find(t => t.type === "numerical" && t.practice && t.practice.length && !P.practice[t.id]);
  if(prac) return {topic:prac, reason:"Numerical practice still pending", plan:"Attempt each practice problem before revealing the solution.", kind:"practice"};

  // 5. Any remaining incomplete topic
  const rest = ts.find(t => statusOf(t.id) !== "done");
  if(rest) return {topic:rest, reason:`Remaining ${rest.priority} priority topic`, plan:"Study and mark complete.", kind:"low"};

  // 6. An untaken quiz
  const q = QUIZZES.find(x => !P.quizzes[x.id]);
  if(q) return {quiz:q, reason:"All topics complete — test yourself", plan:"Take this quiz to confirm your recall.", kind:"quiz"};

  // 7. Everything done — revise
  return {revise:true, reason:"Everything is marked complete", plan:"Move to Quick Revision and retake quizzes to keep it fresh.", kind:"revise"};
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function stripTags(html){ const d=document.createElement("div"); d.innerHTML=html; return d.textContent||""; }
let toastTimer=null;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("show"), 2600);
}
const priBadge = p => `<span class="badge b-${p==="high"?"high":p==="medium"?"med":"low"}">${p==="high"?"High":p==="medium"?"Medium":"Low"} priority</span>`;

function ring(p, size=76){
  const r=(size-9)/2, c=2*Math.PI*r, off=c*(1-p/100);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle class="trk" cx="${size/2}" cy="${size/2}" r="${r}"/>
    <circle class="val" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}
function bar(p, cls=""){ return `<div class="bar ${cls}" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`; }

/* -------------------------- STATUS CONTROL --------------------------- */
function statusControl(id, label){
  const s = statusOf(id);
  return `<div class="status" role="group" aria-label="Completion status for ${esc(label)}">
    <button data-act="status" data-id="${id}" data-s="none" aria-pressed="${s==="none"}" title="Not started">☐<span class="sr"> Not started</span></button>
    <button data-act="status" data-id="${id}" data-s="prog" aria-pressed="${s==="prog"}" title="In progress">◐<span class="sr"> In progress</span></button>
    <button data-act="status" data-id="${id}" data-s="done" aria-pressed="${s==="done"}" title="Completed">✓<span class="sr"> Completed</span></button>
  </div>`;
}
function setStatus(id, s){
  if(s === "none") delete P.topics[id]; else P.topics[id] = s;
  if(s !== "none") P.lastStudied = id;
  saveProgress(); render();
  const t = topicById(id);
  toast(s==="done" ? `Marked complete: ${t?t.title:""}` : s==="prog" ? "Marked in progress" : "Marked not started");
}

        <span class="badge b-num">${m.topics.filter(t=>t.type==="numerical").length} numerical</span>
        ${cov}
      </div>
    </div>`;
  });

  html += `<p style="font-size:.78rem;color:var(--muted);margin-top:1.4rem;text-align:center">
    Progress is stored locally in your browser. <a href="#/settings">Export, import or reset it in Settings</a>.</p>`;

  return `<div class="page-h"><div class="eyebrow">Dashboard</div><h1>${COURSE.code} · ${COURSE.title}</h1>
    <p>Where you are, and what to do next. ${COURSE.credits} credits · ${COURSE.totalHours} hours · CA ${COURSE.scheme.ca} + MSE ${COURSE.scheme.mse} + ESE ${COURSE.scheme.ese} = ${COURSE.scheme.total} marks.</p></div>` + html;
}

/* ------------------------------ MODULE ------------------------------- */
function viewModule(id){
  const m = moduleById(id);
  if(!m) return notFound();
  const p = moduleProgress(m);
  const theory = m.topics.filter(t=>t.type==="theory");
  const nums   = m.topics.filter(t=>t.type==="numerical");
  const q = quizByModule(m.id);

  let html = `<div class="page-h">
    <div class="eyebrow">Module ${m.num} · ${m.hours} hours</div>
    <h1>${esc(m.title)}</h1>
    <p><strong>Learning objective.</strong> ${esc(m.objective)}</p></div>`;

  html += `<div class="card" style="margin-bottom:1.1rem">
    <div class="card-h" style="margin-bottom:.5rem">
      <h3 style="font-size:.9rem">Module progress</h3>
      <span style="font:700 1.1rem/1 var(--sans);font-variant-numeric:tabular-nums">${p.pct}%</span>
    </div>${bar(p.pct, p.pct===100?"ok":"")}
    <div style="font-size:.78rem;color:var(--muted);margin-top:.45rem">${p.done} of ${p.total} study items complete
      (${m.topics.length} topics${nums.length?` · ${nums.filter(t=>t.practice&&t.practice.length).length} practice sets`:""}${q?" · 1 quiz":""})</div>
  </div>`;

  if(m.coverageNote) html += `<div class="gap-banner">${m.coverageNote}</div>`;
  if(m.examNote) html += `<div class="note warn"><span class="note-t">Exam guidance from the uploaded material</span>${m.examNote}</div>`;

  html += `<details><summary>Official syllabus contents &amp; learning outcomes</summary><div class="det-body">
    <h4 style="font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 .35rem">Contents</h4>
    <p style="font-size:.87rem">${esc(m.contents)}</p>
    ${m.selfLearning?`<h4 style="font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:.9rem 0 .35rem">Self-learning topics</h4><p style="font-size:.87rem">${esc(m.selfLearning)}</p>`:""}
    <h4 style="font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:.9rem 0 .35rem">Learning outcomes</h4>
    <ul style="font-size:.87rem;margin-bottom:0">${m.los.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>
  </div></details>`;

  /* Learning-outcome coverage for this module */
  const mlos = losForModule(m.id);
  if(mlos.length){
    html += `<div class="sec-h"><h2>Learning outcomes</h2><span class="hint">What the examiner is required to test. Each links to the topics that answer it.</span></div><div class="card">`;
    mlos.forEach(l=>{
      const s = loStatus(l);
      html += `<div class="lo-row">
        <div class="lo-row-h">
          <span class="badge b-theory">${l.id}</span>
          <span class="badge">${esc(l.verb)}</span>
          ${s.covered?`<span class="badge ${s.pct===100?"b-ok":""}">${s.done}/${s.real} topics done</span>`
                     :`<span class="badge b-warn">No material uploaded</span>`}
        </div>
        <p class="lo-text">${esc(l.text)}</p>
        <div class="lo-links">
          ${s.topics.map(t=>`<button class="chip" data-act="go" data-h="#/topic/${t.id}">${statusOf(t.id)==="done"?"✓ ":""}${esc(t.title.length>34?t.title.slice(0,34)+"…":t.title)}</button>`).join("")}
        </div></div>`;
    });
    html += `</div>`;
  }

  const rowsFor = list => list.map(t=>{
    const st = statusOf(t.id);
    return `<div class="trow${st==="done"?" done":""}">
      <div class="trow-main">
        <button class="trow-t" data-act="go" data-h="#/topic/${t.id}">${esc(t.title)}</button>
        <div class="badges">${typeBadge(t.type)}${priBadge(t.priority)}${marksBadge(t.marks)}
          ${t.notCovered?`<span class="badge b-warn">No material uploaded</span>`:""}
          ${isWeak(t.id)?`<span class="badge b-high">⚠ Weak</span>`:""}
          ${t.type==="numerical"&&t.practice&&t.practice.length?`<span class="badge ${P.practice[t.id]?"b-ok":""}">${P.practice[t.id]?"✓ ":""}${t.practice.length} practice</span>`:""}
        </div>
      </div>
      ${statusControl(t.id, t.title)}
    </div>`;
  }).join("");

  if(theory.length){
    html += `<div class="sec-h"><h2>A. Theory</h2><span class="hint">${theory.filter(t=>statusOf(t.id)==="done").length} of ${theory.length} complete</span></div>
      <div class="card">${rowsFor(theory)}</div>`;
  }
  if(nums.length){
    html += `<div class="sec-h"><h2>B. Numericals &amp; Problem Solving</h2><span class="hint">Formula → worked example → practice, kept separate from theory.</span></div>
      <div class="card">${rowsFor(nums)}</div>`;
  }
  if(q){
    const res = P.quizzes[q.id];
    html += `<div class="sec-h"><h2>C. Test yourself</h2></div>
      <div class="card"><div class="card-h" style="margin-bottom:.5rem">
        <div><h3 style="font-size:.92rem">${esc(q.title)}</h3>
        <div style="font-size:.78rem;color:var(--muted);margin-top:.2rem">${q.questions.length} questions · MCQ, true/false, multi-select and numerical</div></div>
        ${res?`<span class="badge ${res.pct>=60?"b-ok":"b-high"}">Last score ${res.pct}%</span>`:""}
      </div>
      <button class="btn btn-primary" data-act="go" data-h="#/quiz/${q.id}">${res?"Retake quiz":"Start quiz"} →</button></div>`;
  }

  const idx = COURSE.modules.findIndex(x=>x.id===m.id);
  html += `<div class="btn-row" style="margin-top:1.6rem;justify-content:space-between">
    ${idx>0?`<button class="btn" data-act="go" data-h="#/module/${COURSE.modules[idx-1].id}">← Module ${COURSE.modules[idx-1].num}</button>`:"<span></span>"}
    ${idx<COURSE.modules.length-1?`<button class="btn" data-act="go" data-h="#/module/${COURSE.modules[idx+1].id}">Module ${COURSE.modules[idx+1].num} →</button>`:"<span></span>"}
  </div>`;
  return html;
}

/* --------------------------- STUDY MODE ------------------------------ */
let studyStep = "learn";
function viewTopic(id){
  const t = topicById(id);
  if(!t) return notFound();
  const m = moduleById(t.moduleId);
  const isNum = t.type === "numerical";

  /* Build the step list dynamically from what this topic actually has */
  const steps = [];
  steps.push({k:"learn", label:"Learn"});
  if(t.understand) steps.push({k:"understand", label:"Understand"});
  if(isNum){
    if(t.formula) steps.push({k:"formula", label:"Formula"});
    if(t.worked) steps.push({k:"example", label:"Worked example"});
  } else if(t.examples && t.examples.length){
    steps.push({k:"example", label:"Examples"});
  }
  if(t.examAnswer) steps.push({k:"exam", label:"Exam answer"});
  if(t.mistakes && t.mistakes.length) steps.push({k:"mistakes", label:"Common mistakes"});
  if(isNum && t.practice && t.practice.length) steps.push({k:"practice", label:"Practice"});
  if(!steps.some(s=>s.k===studyStep)) studyStep = "learn";

  let html = `<div class="study-nav">
    <div>
      <div class="crumb">Module ${m.num} → ${esc(m.title)} → ${isNum?"Numericals":"Theory"}</div>
      <h1 style="margin-top:.3rem">${esc(t.title)}</h1>
    </div>
    <button class="btn btn-sm" data-act="go" data-h="#/module/${m.id}">← Module ${m.num}</button>
  </div>`;

  html += `<div class="badges" style="margin-bottom:.9rem">${typeBadge(t.type)}${priBadge(t.priority)}${marksBadge(t.marks)}
    ${isWeak(t.id)?`<span class="badge b-high">⚠ Weak topic</span>`:""}
    ${t.src?`<span class="badge b-src" title="Source in the uploaded material">Source: ${esc(t.src)}</span>`:""}</div>`;

  /* Which learning outcomes this topic answers */
  const tlos = losForTopic(t.id);
  if(tlos.length){
    html += `<div class="lo-strip">
      <div class="lo-strip-h">Answers ${tlos.length===1?"this learning outcome":"these learning outcomes"}</div>
      ${tlos.map(l=>`<div class="lo-item">
        <span class="badge b-theory">${l.id}</span>
        <span><strong>${esc(l.verb)}</strong> — ${esc(l.text)}</span>
      </div>`).join("")}
      <div class="lo-strip-f">Exam questions are framed to match these verbs.
        <button class="trow-t" style="display:inline;font-size:inherit;font-weight:600" data-act="go" data-h="#/outcomes">See all outcomes →</button></div>
    </div>`;
  } else if(!t.notCovered){
    html += `<div class="note warn"><span class="note-t">No learning outcome targets this topic</span>
      This is a <strong>syllabus content item</strong> — it is listed under the module's Contents, but none of the module's
      learning outcomes name it. Cover it, but weight it below the topics that answer an outcome directly.
      <button class="trow-t" style="display:inline;font-size:inherit;font-weight:600" data-act="go" data-h="#/outcomes">See the outcomes →</button></div>`;
  }

  /* Step tabs */
  html += `<div class="steps" role="tablist" aria-label="Study steps">`;
  steps.forEach(s=>{
    html += `<button role="tab" aria-selected="${studyStep===s.k}" data-act="step" data-s="${s.k}">${s.label}</button>`;
  });
  html += `</div><div class="prose" id="stepBody">${renderStep(t, studyStep)}</div>`;

  /* Footer: mark complete + navigation */
  html += `<hr>
  <div class="card" style="display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;justify-content:space-between">
    <div><h3 style="font-size:.9rem;margin-bottom:.2rem">Mark this topic</h3>
      <div style="font-size:.78rem;color:var(--muted)">Progress only counts topics you explicitly mark complete.</div></div>
    ${statusControl(t.id, t.title)}
  </div>`;

  if(isNum && t.practice && t.practice.length){
    html += `<div class="card" style="display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;justify-content:space-between">
      <div><h3 style="font-size:.9rem;margin-bottom:.2rem">Practice set</h3>
        <div style="font-size:.78rem;color:var(--muted)">${t.practice.length} problems, easy → exam level. Tracked separately from theory.</div></div>
      <button class="btn ${P.practice[t.id]?"":"btn-primary"}" data-act="practice" data-id="${t.id}">
        ${P.practice[t.id]?"✓ Practice completed — undo":"Mark practice complete"}</button>
    </div>`;
  }

  /* Prev / next topic within the whole course */
  const flat = allTopics();
  const i = flat.findIndex(x=>x.id===t.id);
  html += `<div class="btn-row" style="margin-top:1.2rem;justify-content:space-between">
    ${i>0?`<button class="btn" data-act="go" data-h="#/topic/${flat[i-1].id}">← ${esc(flat[i-1].title.slice(0,32))}${flat[i-1].title.length>32?"…":""}</button>`:"<span></span>"}
    ${i<flat.length-1?`<button class="btn" data-act="go" data-h="#/topic/${flat[i+1].id}">${esc(flat[i+1].title.slice(0,32))}${flat[i+1].title.length>32?"…":""} →</button>`:"<span></span>"}
  </div>`;
  return html;
}

function diaBlock(key){
  const d = DIA[key]; if(!d) return "";
  return `<div class="dia">${d.svg}<div class="dia-cap">✏️ ${esc(d.cap)}</div></div>`;
}

function renderStep(t, step){
  const isNum = t.type === "numerical";
  switch(step){

  case "learn": {
    let h = "";
    if(isNum && t.concept) h += `<div class="note"><span class="note-t">The idea</span>${t.concept}</div>`;
    h += t.learn || "";
    if(t.diagram) h += diaBlock(t.diagram);
    if(t.algorithm) h += `<h4>Algorithm</h4>${t.algorithm}`;
    if(t.props) h += `<h4>Properties</h4><p>${t.props}</p>`;
    if(t.limitations && t.limitations.length)
      h += `<h4>Limitations</h4><ul>${t.limitations.map(x=>`<li>${x}</li>`).join("")}</ul>`;
    return h;
  }

  case "understand":
    return `<div class="note tip"><span class="note-t">In simpler words — same academic meaning</span></div>${t.understand||""}`;

  case "formula": {
    let h = `<h4>Formula</h4><div class="fx">${t.formula||""}</div>`;
    if(t.formulaNote) h += `<p style="font-size:.85rem;color:var(--muted)">${t.formulaNote}</p>`;
    if(t.variables && t.variables.length){
      h += `<h4>What every symbol means</h4><div class="tw"><table><thead><tr><th>Symbol</th><th>Meaning</th></tr></thead><tbody>`;
      t.variables.forEach(v=>{ h += `<tr><td><code>${v.v}</code></td><td>${v.m}</td></tr>`; });
      h += `</tbody></table></div>`;
    }
    if(t.whenToUse) h += `<h4>When to use it</h4><p>${t.whenToUse}</p>`;
    if(t.algorithm) h += `<h4>Algorithm</h4>${t.algorithm}`;
    if(t.props) h += `<h4>Properties</h4><p>${t.props}</p>`;
    return h;
  }

  case "example": {
    if(isNum && t.worked){
      let h = `<h4>Worked example</h4><div class="note"><span class="note-t">Problem</span>${t.worked.problem}</div>`;
      if(t.diagram) h += diaBlock(t.diagram);
      h += `<h4>Step-by-step solution</h4><ol class="wsteps">${t.worked.steps.map(s=>`<li>${s}</li>`).join("")}</ol>`;
      h += `<div class="ans">Final answer: ${t.worked.answer}</div>`;
      if(t.worked.check) h += `<div class="note tip"><span class="note-t">Check your work</span>${t.worked.check}</div>`;
      if(t.diagram2) h += diaBlock(t.diagram2);
      return h;
    }
    if(t.examples && t.examples.length){
      return `<h4>Examples from the teacher's material</h4>` + t.examples.map(e=>
        `<details open><summary>${esc(e.t)}</summary><div class="det-body">${e.b}</div></details>`).join("");
    }
    return `<div class="empty">No separate examples for this topic — see the Learn step.</div>`;
  }

  case "exam": {
    const el = losForTopic(t.id);
    let h = `<div class="note tip"><span class="note-t">Write this in the exam</span>Sized to the marks — a 2-mark answer is a definition plus a key point, a 5-mark answer adds explanation and an example or diagram.
      ${el.length?`<br><br><strong>This answers ${el.map(l=>l.id).join(", ")}</strong> — “${esc(el[0].text)}” So lead with the outcome's own verb (<em>${esc(el[0].verb)}</em>) and make sure every element it names appears somewhere in your answer.`:""}</div>`;
    h += t.examAnswer || "";
    if(t.diagram) h += diaBlock(t.diagram);
    return h;
  }

  case "mistakes":
    return `<div class="note trap"><span class="note-t">Lose marks here</span>These are the errors flagged in the lecture slides and class notes, plus the ones that follow from the algorithm itself.</div>
      <ul>${(t.mistakes||[]).map(x=>`<li>${x}</li>`).join("")}</ul>`;

  case "practice": {
    let h = `<div class="note"><span class="note-t">Attempt before revealing</span>Each solution is hidden. Work the problem on paper first — revealing early is the fastest way to feel prepared while learning nothing.</div>`;
    (t.practice||[]).forEach((p,i)=>{
      h += `<details><summary><span class="badge b-${p.d==="Exam-level"||p.d==="Difficult"?"high":p.d==="Moderate"?"med":"low"}">${esc(p.d)}</span>&nbsp; Problem ${i+1}</summary>
        <div class="det-body"><p>${p.q}</p>
        <details><summary>Reveal solution</summary><div class="det-body">${p.s}</div></details>
        </div></details>`;
    });
    return h;
  }
  }
  return "";
}

/* --------------------------- NUMERICALS HUB -------------------------- */
let numFilter = {m:"all", diff:"all", state:"all"};
function viewNumericals(){
  const all = allTopics().filter(t=>t.type==="numerical");
  let list = all.slice();
  if(numFilter.m !== "all") list = list.filter(t=>t.moduleId===numFilter.m);
  if(numFilter.state === "done") list = list.filter(t=>statusOf(t.id)==="done");
  if(numFilter.state === "todo") list = list.filter(t=>statusOf(t.id)!=="done");
  if(numFilter.state === "weak") list = list.filter(t=>isWeak(t.id));
  if(numFilter.state === "nopractice") list = list.filter(t=>t.practice&&t.practice.length&&!P.practice[t.id]);

  const b = breakdown();
  let html = `<div class="page-h"><div class="eyebrow">Numericals</div><h1>Problem solving &amp; numericals</h1>
    <p>Every problem-solving topic in the syllabus, kept separate from theory. Each has a formula, the meaning of every variable, a fully worked example and a graded practice set.</p></div>`;

  html += `<div class="grid g3" style="margin-bottom:1rem">
    <div class="stat"><div class="k">Numerical topics</div><div class="v">${pct(b.numerical.d,b.numerical.t)}<small>%</small></div>
      <div class="sub">${b.numerical.d} / ${b.numerical.t} complete</div>${bar(pct(b.numerical.d,b.numerical.t))}</div>
    <div class="stat"><div class="k">Practice sets</div><div class="v">${pct(b.practice.d,b.practice.t)}<small>%</small></div>
      <div class="sub">${b.practice.d} / ${b.practice.t} complete</div>${bar(pct(b.practice.d,b.practice.t))}</div>
    <div class="stat"><div class="k">Total problems</div><div class="v">${all.reduce((s,t)=>s+(t.practice?t.practice.length:0),0)}</div>
      <div class="sub">across ${all.length} topics</div></div>
  </div>`;

  html += `<div class="filters">
    <div class="fg"><label for="nfM">Module</label><select id="nfM" data-act="numfilter" data-k="m">
      <option value="all"${numFilter.m==="all"?" selected":""}>All</option>
      ${COURSE.modules.filter(m=>m.topics.some(t=>t.type==="numerical")).map(m=>`<option value="${m.id}"${numFilter.m===m.id?" selected":""}>Module ${m.num}</option>`).join("")}
    </select></div>
    <div class="fg"><label for="nfS">Show</label><select id="nfS" data-act="numfilter" data-k="state">
      <option value="all"${numFilter.state==="all"?" selected":""}>Everything</option>
      <option value="todo"${numFilter.state==="todo"?" selected":""}>Incomplete</option>
      <option value="done"${numFilter.state==="done"?" selected":""}>Completed</option>
      <option value="nopractice"${numFilter.state==="nopractice"?" selected":""}>Practice pending</option>
      <option value="weak"${numFilter.state==="weak"?" selected":""}>Weak topics</option>
    </select></div>
    <span class="count">${list.length} of ${all.length} topics</span>
  </div>`;

  if(!list.length) return html + `<div class="empty"><span class="big">∅</span>No numerical topics match these filters.</div>`;

  list.forEach(t=>{
    const st = statusOf(t.id);
    html += `<div class="card" style="margin-bottom:.6rem">
      <div class="card-h">
        <div style="flex:1;min-width:0">
          <div style="font:700 .68rem/1 var(--mono);letter-spacing:.07em;color:var(--muted);margin-bottom:.3rem">MODULE ${t.moduleNum}</div>
          <button class="trow-t" style="font-size:.96rem;font-weight:640" data-act="go" data-h="#/topic/${t.id}">${esc(t.title)}</button>
        </div>
        ${statusControl(t.id, t.title)}
      </div>
      ${t.formula?`<div class="fx" style="margin:.5rem 0">${t.formula}</div>`:""}
      <div class="badges">${priBadge(t.priority)}${marksBadge(t.marks)}
        ${t.practice&&t.practice.length?`<span class="badge ${P.practice[t.id]?"b-ok":""}">${P.practice[t.id]?"✓ ":""}${t.practice.length} practice problems</span>`:""}
        ${isWeak(t.id)?`<span class="badge b-high">⚠ Weak</span>`:""}
        ${st==="done"?`<span class="badge b-ok">✓ Complete</span>`:""}</div>
      <div class="btn-row" style="margin-top:.6rem">
        <button class="btn btn-sm btn-primary" data-act="gostep" data-h="#/topic/${t.id}" data-step="formula">Formula &amp; variables</button>
        <button class="btn btn-sm" data-act="gostep" data-h="#/topic/${t.id}" data-step="example">Worked example</button>
        ${t.practice&&t.practice.length?`<button class="btn btn-sm" data-act="gostep" data-h="#/topic/${t.id}" data-step="practice">Practice →</button>`:""}
      </div>
    </div>`;
  });
  return html;
}

/* ---------------------------- QUIZ LIST ------------------------------ */

  QUIZZES.forEach(q=>{
    const r = P.quizzes[q.id], m = moduleById(q.module);
    html += `<div class="card" style="margin-bottom:.6rem"><div class="card-h">
      <div style="flex:1;min-width:0">
        <h3 style="font-size:.95rem;margin-bottom:.25rem">${esc(q.title)}</h3>
        <div class="badges"><span class="badge">${q.questions.length} questions</span>
          <span class="badge">${q.questions.filter(x=>x.type==="mcq").length} MCQ</span>
          ${q.questions.some(x=>x.type==="tf")?`<span class="badge">True/False</span>`:""}
          ${q.questions.some(x=>x.type==="multi")?`<span class="badge">Multi-select</span>`:""}
          ${q.questions.some(x=>x.type==="num")?`<span class="badge b-num">Numerical</span>`:""}
        </div>
      </div>

/* ------------------------------ QUIZ RUN ----------------------------- */
let QS = null;   // {quiz, i, answers[], checked[], sel}
function startQuiz(id){
  const quiz = QUIZZES.find(q=>q.id===id);
  if(!quiz) return;
  QS = {quiz, i:0, answers:new Array(quiz.questions.length).fill(null),
        checked:new Array(quiz.questions.length).fill(false), sel:null, finished:false};
}
function viewQuiz(id){
  if(!QS || QS.quiz.id !== id) startQuiz(id);
  if(!QS) return notFound();
  if(QS.finished) return viewQuizResult();

  const {quiz, i} = QS, q = quiz.questions[i];
  const checked = QS.checked[i];
  let html = `<div class="study-nav">
    <div><div class="crumb">${esc(quiz.title)}</div><h1 style="margin-top:.3rem;font-size:1.25rem">Question ${i+1} of ${quiz.questions.length}</h1></div>
    <button class="btn btn-sm" data-act="go" data-h="#/quizzes">Exit quiz</button></div>`;

  html += `<div class="qbar">${bar(Math.round(i/quiz.questions.length*100))}
    <span>${QS.checked.filter(Boolean).length} answered</span></div>`;

  html += `<div class="card"><div class="q"><div class="q-stem">${q.q}</div>`;

  if(q.type === "num"){
    const val = QS.answers[i];
    html += `<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem">
      <label for="numIn">Your answer</label>
      <input type="number" id="numIn" step="any" value="${val!==null&&val!==undefined?val:""}" ${checked?"disabled":""}
        style="width:140px" aria-label="Numerical answer">
    </div>`;
    if(checked){
      const ok = isCorrect(q, QS.answers[i]);
      html += `<div class="${ok?"ans":"note trap"}">${ok?"Correct":`Not quite — the correct answer is <strong>${q.ans}</strong>`}</div>`;
    }
  } else {
    const multi = q.type === "multi";
    q.o.forEach((opt,oi)=>{
      let cls = "opt";
      const chosen = multi ? (Array.isArray(QS.answers[i]) && QS.answers[i].includes(oi)) : QS.answers[i] === oi;
      if(!checked && chosen) cls += " sel";
      if(checked){
        const isAns = multi ? q.a.includes(oi) : q.a === oi;
        if(isAns) cls += " right";
        else if(chosen) cls += " wrong";
      }
      html += `<button class="${cls}" data-act="opt" data-i="${oi}" ${checked?"disabled":""} aria-pressed="${chosen}">
        <span class="mk">${multi?(chosen?"☑":"☐"):String.fromCharCode(65+oi)}</span>${opt}</button>`;
    });
    if(multi && !checked) html += `<div style="font-size:.76rem;color:var(--muted);margin:.3rem 0 .6rem">Select all that apply, then check your answer.</div>`;
  }

  if(checked){
    const ok = isCorrect(q, QS.answers[i]);
    html += `<div class="note ${ok?"tip":"warn"}" style="margin-top:.8rem">
      <span class="note-t">${ok?"Correct":"Explanation"}</span>${q.e}</div>`;
    const t = topicById(q.t);
    if(t) html += `<div style="font-size:.79rem;color:var(--muted);margin-top:.5rem">Tests: <button class="trow-t" style="display:inline;font-size:.79rem;font-weight:600" data-act="go" data-h="#/topic/${t.id}">Module ${t.moduleNum} → ${esc(t.title)}</button></div>`;
  }
  html += `</div>`;

  html += `<div class="btn-row" style="margin-top:1rem;justify-content:space-between">
    <button class="btn" data-act="qprev" ${i===0?"disabled":""}>← Previous</button>
    <div class="btn-row">
      ${!checked?`<button class="btn btn-primary" data-act="qcheck">Check answer</button>`:""}
      ${checked && i < quiz.questions.length-1?`<button class="btn btn-primary" data-act="qnext">Next question →</button>`:""}
      ${checked && i === quiz.questions.length-1?`<button class="btn btn-primary" data-act="qfinish">Finish &amp; see score</button>`:""}
    </div></div></div>`;
  return html;
}
function isCorrect(q, ans){
  if(ans === null || ans === undefined) return false;
  if(q.type === "num") return Math.abs(Number(ans) - q.ans) <= (q.tol||0);
  if(q.type === "multi"){
    if(!Array.isArray(ans)) return false;
    const a = [...ans].sort((x,y)=>x-y), b = [...q.a].sort((x,y)=>x-y);
    return a.length === b.length && a.every((v,k)=>v===b[k]);
  }
  return ans === q.a;
}
function finishQuiz(){
  const {quiz} = QS;
  let score = 0;
  quiz.questions.forEach((q,i)=>{
    const ok = QS.checked[i] && isCorrect(q, QS.answers[i]);
    if(ok) score++;
    /* Feed weak-topic tracking — only questions actually checked count. */
    if(QS.checked[i]){
      const s = P.topicStats[q.t] || {correct:0,total:0};
      s.total++; if(ok) s.correct++;
      P.topicStats[q.t] = s;
    }
  });
  const total = quiz.questions.length;
  P.quizzes[quiz.id] = {score, total, pct:pct(score,total), at:todayStr()};
  saveProgress();
  QS.finished = true; QS.score = score;
  render();
}
function viewQuizResult(){
  const {quiz, score} = QS, total = quiz.questions.length, p = pct(score,total);
  const wrong = quiz.questions.map((q,i)=>({q,i,ok:QS.checked[i]&&isCorrect(q,QS.answers[i])})).filter(x=>!x.ok);
  const revise = [...new Set(wrong.map(w=>w.q.t))].map(topicById).filter(Boolean);

  let html = `<div class="page-h"><div class="eyebrow">Result</div><h1>${esc(quiz.title)}</h1></div>`;
  html += `<div class="card" style="text-align:center;padding:1.6rem 1.1rem">
    ${ring(p, 110)}
    <div class="big-score" style="margin-top:.6rem;color:${p>=60?"var(--ok)":"var(--danger)"}">${p}%</div>
    <p style="margin:.4rem 0 0;color:var(--text-2)"><strong>${score}</strong> correct · <strong>${total-score}</strong> incorrect · out of ${total}</p>
  </div>`;

  if(revise.length){
    html += `<div class="sec-h"><h2>Topics requiring revision</h2><span class="hint">These now count towards weak-topic detection.</span></div><div class="card">`;
    revise.forEach(t=>{
      const s = P.topicStats[t.id];
      const acc = s ? Math.round(s.correct/s.total*100) : 0;
      html += `<div class="weak-row"><span class="badge b-warn" aria-hidden="true">⚠</span>
        <div style="flex:1;min-width:0">
          <button class="trow-t" data-act="go" data-h="#/topic/${t.id}">${esc(t.title)}</button>
          <div style="font-size:.76rem;color:var(--muted)">Module ${t.moduleNum} · lifetime accuracy ${acc}% (${s.correct}/${s.total})</div>
        </div>
        <button class="btn btn-sm" data-act="go" data-h="#/topic/${t.id}">Review</button></div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="note tip" style="margin-top:1rem"><span class="note-t">Clean sweep</span>Every question correct — nothing from this quiz needs revision.</div>`;
  }

  html += `<div class="sec-h"><h2>Review your answers</h2></div>`;
  quiz.questions.forEach((q,i)=>{
    const ok = QS.checked[i] && isCorrect(q, QS.answers[i]);
    const yourAns = QS.checked[i]
      ? (q.type==="num" ? esc(String(QS.answers[i]))
         : q.type==="multi" ? (Array.isArray(QS.answers[i])&&QS.answers[i].length? QS.answers[i].map(x=>q.o[x]).join(", ") : "nothing selected")
         : (QS.answers[i]!==null ? q.o[QS.answers[i]] : "nothing selected"))
      : "not answered";
    const correctAns = q.type==="num" ? String(q.ans)
      : q.type==="multi" ? q.a.map(x=>q.o[x]).join(", ") : q.o[q.a];
    html += `<details><summary><span class="badge ${ok?"b-ok":"b-high"}">${ok?"✓":"✗"}</span>&nbsp; Q${i+1}. ${esc(stripTags(q.q).slice(0,72))}${stripTags(q.q).length>72?"…":""}</summary>
      <div class="det-body"><p>${q.q}</p>
      <dl class="kv"><dt>Your answer</dt><dd>${yourAns}</dd><dt>Correct</dt><dd>${correctAns}</dd></dl>
      <div class="note"><span class="note-t">Why</span>${q.e}</div></div></details>`;
  });

  html += `<div class="btn-row" style="margin-top:1.2rem">
    <button class="btn btn-primary" data-act="qretake" data-id="${quiz.id}">Retake this quiz</button>
    <button class="btn" data-act="go" data-h="#/quizzes">All quizzes</button>
    <button class="btn" data-act="go" data-h="#/module/${quiz.module}">Back to module</button>
    <button class="btn" data-act="go" data-h="#/">Dashboard</button></div>`;
  return html;
}

function doExport(){
  try{
    const data = JSON.stringify(Object.assign({}, P, {exportedAt:new Date().toISOString(), course:COURSE.code}), null, 2);
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `ai-study-progress-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast("Progress exported.");
  }catch(e){ toast("Export failed in this browser."); }
}
function doImport(file){
  const r = new FileReader();
  r.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(r.result); }
    catch(e){ toast("That file is not valid JSON — nothing was changed."); return; }
    const v = validateProgress(parsed);
    if(!v.ok){ toast("That file is not a recognised progress file — nothing was changed."); return; }
    P = v.data; P.isNew = false; saveProgress(); render();
    toast(`Progress imported — you're at ${overallProgress().pct}%.`);
  };
  r.onerror = () => toast("Could not read that file.");
  r.readAsText(file);
}

/* -------------------------------- SEARCH ----------------------------- */
let INDEX = null;
function buildIndex(){
  if(INDEX) return INDEX;
  INDEX = [];
  allTopics().forEach(t=>{
    const body = [t.learn, t.understand, t.examAnswer,
      (t.examples||[]).map(e=>e.t+" "+e.b).join(" "),
      (t.mistakes||[]).join(" "), t.concept, t.formula, t.whenToUse,
      (t.variables||[]).map(v=>v.v+" "+v.m).join(" "),
      t.worked ? t.worked.problem + " " + t.worked.answer : "",
      (t.practice||[]).map(p=>p.q).join(" "),
      (t.tags||[]).join(" ")].filter(Boolean).join(" ");
    INDEX.push({kind:"Topic", title:t.title, path:`Module ${t.moduleNum} → ${t.moduleTitle} → ${t.type==="numerical"?"Numericals":"Theory"}`,
      href:`#/topic/${t.id}`, hay:(t.title+" "+stripTags(body)).toLowerCase(),
      snip:stripTags(t.learn||t.concept||"").slice(0,150)});
  });
  FORMULAS.forEach(f=>{
    const m = moduleById(f.m);
    INDEX.push({kind:"Formula", title:f.name, path:`Formula sheet → Module ${m?m.num:""}`,
      href:`#/formulas`, hay:(f.name+" "+stripTags(f.fx)+" "+stripTags(f.use)+" "+f.vars.map(v=>v[0]+" "+stripTags(v[1])).join(" ")).toLowerCase(),
      snip:stripTags(f.fx)});
  });
  IMPQ.forEach(q=>{
    const m = moduleById(q.m);
    INDEX.push({kind:"Question", title:q.q, path:`Important questions → Module ${m.num} → ${q.marks} marks · ${q.pri} priority`,
      href:`#/important`, hay:(q.q+" "+q.why).toLowerCase(), snip:q.why.slice(0,140)});
  });
  DECKS.forEach(d=>d.cards.forEach(c=>{
    INDEX.push({kind:"Flashcard", title:stripTags(c.q), path:`Flashcards → ${d.title}`,
      href:`#/deck/${d.id}`, hay:(stripTags(c.q)+" "+stripTags(c.a)).toLowerCase(), snip:stripTags(c.a).slice(0,140)});
  }));
  QUIZZES.forEach(q=>q.questions.forEach(x=>{
    INDEX.push({kind:"Quiz question", title:stripTags(x.q), path:`Quizzes → ${q.title}`,
      href:`#/quiz/${q.id}`, hay:(stripTags(x.q)+" "+stripTags(x.e)).toLowerCase(), snip:stripTags(x.e).slice(0,140)});
  }));
  REVISION.forEach(r=>{
    const m = r.m==="all"?null:moduleById(r.m);
    INDEX.push({kind:"Revision", title:r.title, path:`Quick revision${m?` → Module ${m.num}`:""}`,
      href:`#/revision`, hay:(r.title+" "+stripTags(r.items.join(" "))).toLowerCase(),
      snip:stripTags(r.items[0]||"").slice(0,140)});
  });
  LOS.forEach(l=>{
    const m = moduleById(l.m);
    INDEX.push({kind:"Learning outcome", title:`${l.id} — ${l.text}`,
      path:`Learning outcomes → Module ${m.num} → ${l.co}`, href:`#/outcomes`,
      hay:(l.id+" "+l.text+" "+l.verb+" "+l.pi.join(" ")+" "+(COS[l.co]||"")).toLowerCase(),
      snip:`Verb: ${l.verb} · PI ${l.pi.join(", ")}`});
  });
  COURSE.modules.forEach(m=>{
    INDEX.push({kind:"Module", title:`Module ${m.num}: ${m.title}`, path:`Syllabus → Module ${m.num}`,
      href:`#/module/${m.id}`, hay:(m.title+" "+m.contents+" "+m.objective+" "+m.los.join(" ")).toLowerCase(),
      snip:m.contents.slice(0,150)});
  });
  return INDEX;
}
function runSearch(qs){
  const box = $("#results");
  const q = qs.trim().toLowerCase();
  if(q.length < 2){ box.innerHTML = ""; $("#q").setAttribute("aria-expanded","false"); return; }
  const terms = q.split(/\s+/).filter(Boolean);
  const hits = buildIndex().map(e=>{
    let score = 0;
    for(const t of terms){
      if(!e.hay.includes(t)) return null;
      score += e.title.toLowerCase().includes(t) ? 12 : 1;
    }
    if(e.kind === "Topic") score += 4;
    if(e.kind === "Formula") score += 2;
    return {e, score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,12);

  $("#q").setAttribute("aria-expanded","true");
  if(!hits.length){ box.innerHTML = `<div class="res-none">No results for “${esc(qs)}”.</div>`; return; }
  box.innerHTML = hits.map(h=>`<button class="res" role="option" data-act="res" data-h="${h.e.href}">
    <div class="res-t">${esc(h.e.title.length>78?h.e.title.slice(0,78)+"…":h.e.title)}</div>
    <div class="res-p">${esc(h.e.kind)} · ${esc(h.e.path)}</div>
    ${h.e.snip?`<div class="res-s">${esc(h.e.snip)}</div>`:""}</button>`).join("");
}
function closeSearch(){ $("#results").innerHTML = ""; $("#q").setAttribute("aria-expanded","false"); }

  return `<div class="empty"><span class="big">?</span>That page doesn't exist.
    <div class="btn-row" style="justify-content:center;margin-top:1rem">
      <button class="btn btn-primary" data-act="go" data-h="#/">Go to dashboard</button></div></div>`;
}

/* ------------------------------- ROUTER ------------------------------ */
const NAV = [
  {h:"#/",           label:"Dashboard",           ic:"◧", group:"Study"},
  {h:"#/numericals", label:"Numericals",          ic:"∑",  group:"Study"},
  {h:"#/outcomes",   label:"Learning outcomes",   ic:"◈",  group:"Exam"},
  {h:"#/important",  label:"Important questions", ic:"★",  group:"Exam"},
  {h:"#/quizzes",    label:"Quizzes",             ic:"◎",  group:"Exam"},
  {h:"#/flashcards", label:"Flashcards",          ic:"▤",  group:"Exam"},
  {h:"#/revision",   label:"Quick revision",      ic:"⚡", group:"Exam"},
  {h:"#/formulas",   label:"Formula sheet",       ic:"ƒ",  group:"Reference"},
  {h:"#/weak",       label:"Weak topics",         ic:"⚠",  group:"Reference"},
  {h:"#/syllabus",   label:"Syllabus coverage",   ic:"☰",  group:"Reference"},
  {h:"#/settings",   label:"Settings",            ic:"⚙",  group:"Reference"}
];
function renderNav(cur){
  let html = "", lastGroup = null;
  html += `<div class="nav-label">Modules</div>`;
  html += `<a href="#/" ${cur==="#/"?'aria-current="page"':""}><span class="ic">◧</span><span class="lbl">Dashboard</span></a>`;
  COURSE.modules.forEach(m=>{
    const p = moduleProgress(m);
    const on = cur === `#/module/${m.id}`;
    html += `<a href="#/module/${m.id}" ${on?'aria-current="page"':""} title="${esc(m.title)}">
      <span class="ic">${m.num}</span><span class="lbl">${esc(m.title)}</span>
      <span class="pct">${p.pct}%</span></a>`;
  });
  NAV.filter(n=>n.h!=="#/").forEach(n=>{
    if(n.group !== lastGroup){ html += `<div class="nav-label">${n.group}</div>`; lastGroup = n.group; }
    const on = cur === n.h || (n.h==="#/quizzes" && cur.startsWith("#/quiz/")) ||
               (n.h==="#/flashcards" && cur.startsWith("#/deck/"));
    html += `<a href="${n.h}" ${on?'aria-current="page"':""}><span class="ic">${n.ic}</span><span class="lbl">${n.label}</span></a>`;
  });
  $("#nav").innerHTML = html;
}

function render(){
  const hash = location.hash || "#/";
  const [, seg, arg] = hash.split("/");
  let html;
  switch(seg){
    case "":            html = viewDashboard(); break;
    case "module":      html = viewModule(arg); break;
    case "topic":       html = viewTopic(arg); break;
    case "numericals":  html = viewNumericals(); break;
    case "quizzes":     html = viewQuizzes(); break;
    case "quiz":        html = viewQuiz(arg); break;
    case "flashcards":  html = viewDecks(); break;
    case "deck":        html = viewDeck(arg); break;
    case "formulas":    html = viewFormulas(); break;
    case "important":   html = viewImportant(); break;
    case "revision":    html = viewRevision(); break;
    case "weak":        html = viewWeak(); break;
    case "outcomes":    html = viewOutcomes(); break;
    case "syllabus":    html = viewSyllabus(); break;
    case "settings":    html = viewSettings(); break;
    default:            html = notFound();
  }
  const wide = ["numericals","important","syllabus","revision","outcomes"].includes(seg);
  $("#main").innerHTML = `<div class="wrap${wide?" wide":""}">${html}</div>`;
  renderNav(hash.split("/").slice(0,seg==="module"||seg==="topic"?3:2).join("/") || "#/");
  $("#mPct").textContent = overallProgress().pct + "%";
  document.body.classList.remove("nav-open");
  $("#navToggle").setAttribute("aria-expanded","false");
}

/* ------------------------------- EVENTS ------------------------------ */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");

  /* Close the search dropdown when clicking elsewhere */
  if(!e.target.closest(".searchbox")) closeSearch();

  if(!el) return;
  const act = el.dataset.act;

  switch(act){
    case "go":
      e.preventDefault(); studyStep = "learn"; location.hash = el.dataset.h;
      window.scrollTo({top:0, behavior:"instant"}); break;

    case "gostep":
      e.preventDefault(); studyStep = el.dataset.step; location.hash = el.dataset.h;
      window.scrollTo({top:0, behavior:"instant"}); render(); break;

    case "res":
      e.preventDefault(); closeSearch(); $("#q").value = ""; studyStep = "learn";
      location.hash = el.dataset.h; window.scrollTo({top:0, behavior:"instant"}); break;

    case "status": setStatus(el.dataset.id, el.dataset.s); break;

    case "step":
      studyStep = el.dataset.s;
      $$(".steps button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.s===studyStep)));
      $("#stepBody").innerHTML = renderStep(topicById(location.hash.split("/")[2]), studyStep);
      break;

    case "practice": {
      const id = el.dataset.id;
      if(P.practice[id]) delete P.practice[id]; else { P.practice[id] = true; P.lastStudied = id; }
      saveProgress(); render(); toast(P.practice[id]?"Practice marked complete.":"Practice unmarked."); break;
    }

    case "rev": {
      const id = el.dataset.id;
      if(P.revision[id]) delete P.revision[id]; else P.revision[id] = true;
      saveProgress(); render(); break;
    }

    case "deckdone": {
      const id = el.dataset.id;
      if(P.flashcards[id]) delete P.flashcards[id]; else P.flashcards[id] = true;
      saveProgress(); render(); break;
    }

    /* ---- quiz ---- */
    case "opt": {
      const i = QS.i, q = QS.quiz.questions[i], oi = Number(el.dataset.i);
      if(QS.checked[i]) break;
      if(q.type === "multi"){
        const cur = Array.isArray(QS.answers[i]) ? QS.answers[i] : [];
        QS.answers[i] = cur.includes(oi) ? cur.filter(x=>x!==oi) : cur.concat(oi);
      } else QS.answers[i] = oi;
      render(); break;
    }
    case "qcheck": {
      const i = QS.i, q = QS.quiz.questions[i];
      if(q.type === "num"){
        const v = $("#numIn").value;
        if(v === ""){ toast("Enter an answer first."); break; }
        QS.answers[i] = Number(v);
      } else if(QS.answers[i] === null || (Array.isArray(QS.answers[i]) && !QS.answers[i].length)){
        toast("Select an answer first."); break;
      }
      QS.checked[i] = true; render(); break;
    }
    case "qnext": QS.i++; render(); window.scrollTo({top:0,behavior:"instant"}); break;
    case "qprev": QS.i--; render(); window.scrollTo({top:0,behavior:"instant"}); break;
    case "qfinish": finishQuiz(); window.scrollTo({top:0,behavior:"instant"}); break;
    case "qretake": startQuiz(el.dataset.id); render(); window.scrollTo({top:0,behavior:"instant"}); break;

    /* ---- flashcards ---- */
    case "flip": FC.flipped = !FC.flipped; render(); break;
    case "fcnext": FC.i++; FC.flipped = false; render(); break;
    case "fcprev": FC.i--; FC.flipped = false; render(); break;
    case "fcshuffle": {
      for(let i=FC.order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [FC.order[i],FC.order[j]]=[FC.order[j],FC.order[i]]; }
      FC.i = 0; FC.flipped = false; render(); toast("Shuffled."); break;
    }

    /* ---- settings ---- */
    case "export": doExport(); break;
    case "importClick": $("#importFile").click(); break;
    case "resetAsk": askReset(); break;
    case "resetDo": doReset(); break;
    case "modalClose": closeModal(); break;
    case "theme": setTheme(el.dataset.t); break;
  }
});

/* Filter dropdowns */
document.addEventListener("change", e=>{
  const el = e.target.closest("[data-act]");
  if(el && el.dataset.act === "numfilter"){ numFilter[el.dataset.k] = el.value; render(); }
  if(el && el.dataset.act === "iqfilter"){ iqFilter[el.dataset.k] = el.value; render(); }
  if(el && el.dataset.act === "fxfilter"){ fxFilter = el.value; render(); }
  if(el && el.dataset.act === "lofilter"){ loFilter = el.value; render(); }
  if(e.target.id === "importFile" && e.target.files && e.target.files[0]){
    doImport(e.target.files[0]); e.target.value = "";
  }
});

/* Keyboard: flashcard flip/navigation, search shortcuts */
document.addEventListener("keydown", e=>{
  if(e.target.matches("input, textarea, select")){
    if(e.key === "Escape"){ e.target.blur(); closeSearch(); }
    return;
  }
  const onCard = e.target.closest('[data-act="flip"]');
  if(onCard && (e.key === " " || e.key === "Enter")){ e.preventDefault(); FC.flipped = !FC.flipped; render(); return; }
  if(location.hash.startsWith("#/deck/")){
    if(e.key === "ArrowRight" && FC.i < DECKS.find(d=>d.id===FC.deck).cards.length-1){ FC.i++; FC.flipped=false; render(); }
    if(e.key === "ArrowLeft" && FC.i > 0){ FC.i--; FC.flipped=false; render(); }
    if(e.key === " "){ e.preventDefault(); FC.flipped = !FC.flipped; render(); }
  }
  if(e.key === "/" ){ e.preventDefault(); $("#q").focus(); }
  if(e.key === "Escape") closeModal();
});

$("#q").addEventListener("input", e => runSearch(e.target.value));
$("#q").addEventListener("focus", e => { if(e.target.value.trim().length>1) runSearch(e.target.value); });

/* Mobile nav */
$("#navToggle").addEventListener("click", ()=>{
  const open = document.body.classList.toggle("nav-open");
  $("#navToggle").setAttribute("aria-expanded", String(open));
});
$("#scrim").addEventListener("click", ()=>{
  document.body.classList.remove("nav-open");
  $("#navToggle").setAttribute("aria-expanded","false");
});
$("#nav").addEventListener("click", e=>{
  if(e.target.closest("a")){ studyStep = "learn"; window.scrollTo({top:0,behavior:"instant"}); }
});

/* ------------------------------- THEME ------------------------------- */
function setTheme(t){
  try{
    if(t === "system"){ localStorage.removeItem(THEME_KEY); document.documentElement.removeAttribute("data-theme"); }
    else { localStorage.setItem(THEME_KEY, t); document.documentElement.setAttribute("data-theme", t); }
  }catch(e){
    if(t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }
  toast(t === "system" ? "Following your system theme." : `${t[0].toUpperCase()+t.slice(1)} theme.`);
}
function initTheme(){
  let t = null;
  try{ t = localStorage.getItem(THEME_KEY); }catch(e){}
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
}
$("#themeBtn").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(isDark ? "light" : "dark");
});

/* -------------------------------- BOOT ------------------------------- */
window.addEventListener("hashchange", ()=>{ closeSearch(); render(); });
initTheme();
loadProgress();
touchVisit();
if(!location.hash) location.hash = "#/";
render();
</script>
