{id:"m2t1", title:"Problem Solving Agent and Problem Formulation", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 2 slides; class notes 27/7",
 tags:["problem formulation","goal formulation","state space","problem solving agent"],
 learn:`<p>A <strong>problem-solving agent</strong> decides what to do by finding a <em>sequence of actions</em> that leads to a desirable state, used when no single action will do.</p>
<div class="note"><span class="note-t">Definition</span><strong>Problem solving</strong> is the way in which an agent finds a sequence of actions that achieves its goals, when no single action will do.</div>
<h4>The three phases</h4>
<div class="fx">Formulate → Search → Execute</div>
<h4>Structure of a problem-solving agent</h4>
<ol>
<li><strong>Goal state</strong> — what counts as success.</li>
<li><strong>Action</strong> — what the agent can do.</li>
<li><strong>Goal formulation</strong> — deciding which goal to pursue, based on the current situation and the performance measure.</li>
<li><strong>Problem formulation</strong> — deciding what actions and states to consider, given a goal.</li>
</ol>
<div class="note tip"><span class="note-t">Why problem formulation matters</span>The class notes underline this: <strong>we formulate the problem <em>in order to search</em>.</strong> A search algorithm cannot run until the problem has been reduced to states, actions, an initial state and a goal test.</div>
<h4>Components of a well-defined problem</h4>
<ul>
<li><strong>Initial state</strong> — where the agent starts.</li>
<li><strong>Actions / operators</strong> — what can be done in each state.</li>
<li><strong>Transition model</strong> — the state resulting from doing an action.</li>
<li><strong>Goal test</strong> — whether a state is a goal. <em>There can be multiple goal states.</em></li>
<li><strong>Path cost</strong> — a numeric cost for each path.</li>
</ul>
<p><strong>State-space representation</strong> = initial state + all states reachable from it by any sequence of actions.</p>`,
 understand:`<p>The whole of Module 2 is: turn a messy real problem into a graph, then run a graph algorithm on it. Problem formulation is the "turn it into a graph" step, and it is where marks are lost, because students jump straight to drawing the search tree.</p>
<p>Write the five components as a labelled list every single time. Even if the numerical goes wrong afterwards, the formulation earns marks on its own.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Explain problem formulation with an example.</strong> Define problem solving (finding a sequence of actions to achieve a goal when no single action suffices). State the three phases: formulate, search, execute. List the five components of a well-defined problem — initial state, actions, transition model, goal test, path cost — then instantiate all five for one example (water jug or 8-puzzle). Note that there can be multiple goal states.</p>`,
 mistakes:["Giving the goal state but no goal <em>test</em>. With multiple goal states you must state the test, not one state.",
 "Skipping path cost. It is what makes 'optimal' meaningful later.",
 "Confusing goal formulation (choosing the goal) with problem formulation (choosing states and actions)."]},

{id:"m2t2", title:"State-Space Representation — Water Jug and Missionaries–Cannibals", type:"numerical",
 priority:"high", core:true, marks:[5,10], src:"class notes 27/7",
 tags:["water jug","missionaries","cannibals","state space","numerical","formulation"],
 concept:"Represent a puzzle as a state vector, define legal operators on it, then list a sequence of states from the initial state to a goal state.",
 formula:"State = (x, y)  where x, y are the current contents of each jug",
 formulaNote:"There is no algebraic formula here — the 'formula' is the state representation. Choosing a good state vector is the whole skill.",
 variables:[
  {v:"x", m:"Amount of water currently in the 4-gallon jug (0 ≤ x ≤ 4)"},
  {v:"y", m:"Amount of water currently in the 3-gallon jug (0 ≤ y ≤ 3)"},
  {v:"(0,0)", m:"Initial state — both jugs empty"},
  {v:"Goal test", m:"x = 2 (any y). Goal states include (2,0), (2,1), (2,2), (2,3)"}],
 whenToUse:"Whenever a question says 'formulate the following problem as a state-space search' or 'give the state space representation'. Also the standard warm-up before BFS/DFS questions.",
 worked:{
  problem:"<strong>Water Jug problem.</strong> You have a 4-gallon jug and a 3-gallon jug, neither with any measuring marks, and an unlimited water supply. Get exactly <strong>2 gallons</strong> into the 4-gallon jug. Give the state-space representation and one solution path.",
  steps:[
   "<strong>State representation.</strong> (x, y) where x = litres in the 4-gallon jug, y = litres in the 3-gallon jug. So 0 ≤ x ≤ 4 and 0 ≤ y ≤ 3.",
   "<strong>Initial state:</strong> (0, 0) — both jugs empty.",
   "<strong>Goal state:</strong> x = 2, i.e. (2, 0), (2, 1), (2, 2) or (2, 3). Multiple goal states exist.",
   "<strong>Operators:</strong> fill the 4-jug; fill the 3-jug; empty the 4-jug; empty the 3-jug; pour 4→3 until 3 is full or 4 is empty; pour 3→4 until 4 is full or 3 is empty.",
   "<strong>Solution path 1 (via the 3-gallon jug):</strong><br>(0,0) —fill 3-jug→ (0,3) —pour into 4-jug→ (3,0) —fill 3-jug→ (3,3) —pour into 4-jug till full→ (4,2) —empty 4-jug→ (0,2) —pour 3-jug's water into 4-jug→ <strong>(2,0)</strong>",
   "<strong>Solution path 2 (via the 4-gallon jug):</strong><br>(0,0) —fill 4-jug→ (4,0) —pour into 3-jug→ (1,3) —empty 3-jug→ (1,0) —pour water into 3-jug→ (0,1) —fill 4-jug→ (4,1) —pour just 2 gal into 3-jug→ <strong>(2,3)</strong>"],
  answer:"Both paths reach a goal state. Path 1 gives (2,0) in 6 moves; Path 2 gives (2,3) in 6 moves. Either is a correct answer — state which goal state you reached."},
 learn:`<p>A <strong>state-space representation</strong> turns a real problem into something a search algorithm can run on. You choose a <em>state vector</em> that captures exactly what matters, define the legal <em>operators</em> on it, and then the problem becomes a graph.</p>
<h4>What you must write down every time</h4>
<ul><li><strong>State representation</strong> — the variables and their legal ranges.</li>
<li><strong>Initial state</strong></li><li><strong>Goal test</strong> — remember there may be <em>multiple</em> goal states.</li>
<li><strong>Operators</strong> — named, with their effect on the state vector.</li>
<li><strong>Constraints</strong> — any state the operators must never produce.</li></ul>
<p>The state space is then the initial state plus every state reachable from it by any sequence of operators.</p>`,
 understand:`<p>The skill being tested is <em>compression</em>. A real water-jug problem involves water, glass, gravity and a tap; the state vector throws all of that away and keeps two numbers. Choose too much and the space explodes; choose too little and legal moves become unrepresentable.</p>
<p>Rule of thumb: the state must contain <strong>exactly what the operators read and write, and nothing else</strong>. For the jugs the operators only ever read and change the two volumes — so (x, y) is complete. For missionaries and cannibals the operators also move the boat, so the boat's side has to be in the state too.</p>`,
 examAnswer:`<p><strong>5 marks — Give the state-space representation of the water jug problem.</strong> Define the state as (x, y) with x = contents of the 4-gallon jug (0 ≤ x ≤ 4) and y = contents of the 3-gallon jug (0 ≤ y ≤ 3). Initial state (0, 0). Goal test: x = 2, so (2,0), (2,1), (2,2) and (2,3) are all goal states. List the six operators — fill 4, fill 3, empty 4, empty 3, pour 4→3, pour 3→4 — with their effect on (x, y). Then give one solution path with the operator named on every arrow, ending at a goal state you name explicitly.</p>
<p><strong>10 marks — add</strong> a second distinct solution path, the state-space diagram, and one line on why multiple goal states exist.</p>`,
 mistakes:["Writing the goal as only (2,0). The goal test is x = 2, so (2,1), (2,2) and (2,3) are also goals — say so.",
 "Forgetting to name the operators before listing states. The operator label on each arrow is what earns marks.",
 "Allowing an illegal state such as (5,0) or (2,4). Always state the bounds 0 ≤ x ≤ 4, 0 ≤ y ≤ 3."],
 practice:[
  {d:"Easy", q:"State the initial state, goal test and full operator set for the water jug problem (4-gallon and 3-gallon jugs, target 2 gallons).",
   s:"<p><strong>Initial state:</strong> (0,0). <strong>Goal test:</strong> x = 2.</p><p><strong>Operators:</strong> (1) Fill 4-jug: (x,y)→(4,y). (2) Fill 3-jug: (x,y)→(x,3). (3) Empty 4-jug: (x,y)→(0,y). (4) Empty 3-jug: (x,y)→(x,0). (5) Pour 4→3: (x,y)→(x−d, y+d) where d = min(x, 3−y). (6) Pour 3→4: (x,y)→(x+d, y−d) where d = min(y, 4−x).</p>"},
  {d:"Moderate", q:"<strong>Missionaries and Cannibals.</strong> 3 missionaries and 3 cannibals must cross a river. The boat holds at most 2 people. On either bank the number of cannibals must never exceed the number of missionaries. Give the state representation, the initial and goal states, and the constraint.",
   s:"<p><strong>State:</strong> (M, C, B) = number of missionaries and cannibals on the <em>left</em> bank, plus the boat's side. The class notes write it as (x, y) with x = on the left and y = on the right, tagged with the boat position: <code>[3M, 3C, L]</code>.</p><p><strong>Initial state:</strong> (3, 3, Left) — written (x,y) = (0,6) crossed, i.e. all six people still on the starting bank.</p><p><strong>Goal state:</strong> (0, 0, Right) — all missionaries and cannibals have crossed; the notes write (x,y) = (6,0) = <code>[3M, 3C, R]</code>.</p><p><strong>Constraint:</strong> on <em>each</em> bank, either the number of missionaries is 0, or missionaries ≥ cannibals. Maximum number of people in the boat = 2, and the boat cannot cross empty.</p><p><strong>Operators:</strong> move 1M, 2M, 1C, 2C or 1M+1C across, flipping the boat's side, provided the resulting state satisfies the constraint.</p>"},
  {d:"Exam-level", q:"Formulate the <strong>8-puzzle</strong> as a state-space search problem: state representation, initial state, actions, transition model, goal test and path cost.",
   s:"<p><strong>State:</strong> a 3×3 arrangement — the location of each of the eight tiles and the blank.</p><p><strong>Initial state:</strong> any given configuration.</p><p><strong>Actions:</strong> movements of the <em>blank</em> — Left, Right, Up, Down (fewer than 4 at the edges and corners).</p><p><strong>Transition model:</strong> returns the state with the blank swapped with the adjacent tile in the chosen direction.</p><p><strong>Goal test:</strong> does the state match the goal configuration?</p><p><strong>Path cost:</strong> 1 per move, so path cost = number of moves.</p><p><em>Modelling the actions as moves of the blank rather than of the tiles is the standard simplification — mention it.</em></p>"}]},

{id:"m2t3", title:"Uninformed Search — BFS, DFS, DLS and IDS", type:"theory",
 priority:"high", core:true, marks:[5,10], src:"Chpt 2 uninformed slides 20, 52–54; class notes",
 tags:["bfs","dfs","ids","iterative deepening","complexity","comparison","uninformed"],
 learn:`<div class="note"><span class="note-t">Definition</span><strong>Uninformed (blind) search</strong> has no information except the problem definition itself. <strong>Informed (heuristic) search</strong> "knows where to look" for the solution.</div>
<h4>The four criteria for evaluating any strategy</h4>
<ol><li><strong>Completeness</strong> — is it guaranteed to find a solution if one exists?</li>
<li><strong>Time complexity</strong></li><li><strong>Space complexity</strong></li>
<li><strong>Optimality</strong> — does it find the least-cost solution?</li></ol>
<p>with <strong>b</strong> = maximum branching factor of the search tree, <strong>d</strong> = depth of the shallowest (least-cost) goal node, <strong>m</strong> = maximum depth of the state space (may be ∞).</p>
<h4>Breadth-First Search (BFS)</h4>
<p>Enqueues nodes in <strong>FIFO</strong> (first-in, first-out) order. Complete if b is finite. Optimal if all operators have the same cost — otherwise not optimal, but it finds the solution with the <em>shortest path length</em>. Exponential time and space O(b<sup>d</sup>). Will take a long time to find solutions with many steps, because it must examine all shorter possibilities first. The shallowest solution is found first.</p>
<h4>Depth-First Search (DFS)</h4>
<p>Uses a <strong>LIFO</strong> stack. Time O(b<sup>m</sup>) in the worst case (bad when m ≫ d); space only <strong>O(bm)</strong> — linear, its one big advantage. Not complete in infinite-depth spaces and not optimal.</p>
<h4>Depth-Limited Search (DLS)</h4>
<p>Depth-first search with a depth limit <strong>ℓ</strong>. Fixes DFS's infinite-loop problem, but is incomplete if ℓ &lt; d.</p>
<h4>Iterative Deepening Search (IDS)</h4>
<p>Runs depth-limited search with limit L = 0, 1, 2, 3 … until a goal is found. It takes <em>completeness</em> from BFS (guaranteed to find the shallowest solution) and <em>the tree is searched in DFS manner</em>, so space stays linear. All data at every level is discarded after that level is visited.</p>
<ul><li>Complete: <strong>Yes</strong></li><li>Optimal: <strong>Yes, if step costs are equal</strong></li>
<li>Time: O(b<sup>d</sup>) = d(b) + (d−1)b² + (d−2)b³ + … + (1)b<sup>d</sup></li>
<li>Space: <strong>O(bd)</strong> — linear</li></ul>
<p><em>Generally preferred for large state spaces where the solution depth is unknown.</em></p>`,
 understand:`<div class="tw"><table><thead><tr><th>Criterion</th><th>BFS</th><th>DFS</th><th>DLS</th><th>IDS</th></tr></thead><tbody>
<tr><td><strong>Data structure</strong></td><td>Queue (FIFO)</td><td>Stack (LIFO)</td><td>Stack + limit ℓ</td><td>Stack, repeated</td></tr>
<tr><td><strong>Complete?</strong></td><td>Yes (b finite)</td><td>No</td><td>No (if ℓ &lt; d)</td><td>Yes</td></tr>
<tr><td><strong>Optimal?</strong></td><td>Yes, if equal step costs</td><td>No</td><td>No</td><td>Yes, if equal step costs</td></tr>
<tr><td><strong>Time</strong></td><td>O(b<sup>d</sup>)</td><td>O(b<sup>m</sup>)</td><td>O(b<sup>ℓ</sup>)</td><td>O(b<sup>d</sup>)</td></tr>
<tr><td><strong>Space</strong></td><td>O(b<sup>d</sup>)</td><td>O(bm)</td><td>O(bℓ)</td><td><strong>O(bd)</strong></td></tr>
</tbody></table></div>
<p>The single insight: <strong>IDS re-does work but wins anyway.</strong> Re-expanding the shallow levels costs almost nothing because the number of nodes at depth d dominates the whole tree, so IDS gets BFS's guarantees at DFS's memory cost.</p>`,
 examples:[],
 examAnswer:`<p><strong>10 marks — Compare uninformed search strategies.</strong> Define uninformed search, then give the four evaluation criteria and define b, d, m. Explain BFS (FIFO queue, complete, optimal for equal step costs, O(b<sup>d</sup>) time and space, finds shallowest solution), DFS (LIFO stack, not complete, not optimal, O(b<sup>m</sup>) time but linear O(bm) space), DLS (DFS with limit ℓ, incomplete if ℓ &lt; d), IDS (repeated DLS with increasing limit; complete, optimal for equal step costs, O(b<sup>d</sup>) time, O(bd) space). <strong>Finish with the comparison table</strong> — it carries the structure marks — and one line on why IDS is preferred when the solution depth is unknown.</p>
<p><strong>5 marks:</strong> the table plus one line of definition for each of BFS, DFS and IDS.</p>`,
 mistakes:["Writing BFS space as O(bd). It is O(b<sup>d</sup>) — exponential. Only <em>IDS</em> has linear O(bd) space.",
 "Saying BFS is always optimal. It is optimal only when all step costs are equal.",
 "Claiming IDS is slower than BFS. Both are O(b<sup>d</sup>); IDS just uses far less memory.",
 "Confusing m (maximum depth of the space) with d (depth of the shallowest goal)."]},

{id:"m2t4", title:"Heuristic Functions and Admissibility", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 2 informed slides 2, 12–15; class notes",
 tags:["heuristic","admissible","h(n)","8 puzzle","manhattan","relaxed problem"],
 learn:`<div class="note"><span class="note-t">Definition</span>A <strong>heuristic</strong> is a rule of thumb or intelligent estimate that guides the search towards the goal quickly. A <strong>heuristic function h(n)</strong> estimates the remaining cost from the current node n to the goal.</div>
<ul><li>Smaller h(n) → the node appears <strong>closer</strong> to the goal.</li>
<li>Larger h(n) → the node appears <strong>farther</strong> from the goal.</li></ul>
<p>It does not guarantee the exact answer, but usually finds a good or optimal solution much faster.</p>
<h4>Admissible heuristics</h4>
<div class="fx">h(n) ≤ h*(n)&nbsp;&nbsp;for every node n</div>
<p>where <strong>h*(n)</strong> is the <em>true</em> cost to reach the goal from n. An admissible heuristic <strong>never overestimates</strong> the cost to reach the goal — it is <em>optimistic</em>, thinking the problem is cheaper than it really is.</p>
<p><strong>Consequence:</strong> f(n) never overestimates the true cost of a solution through n, since g(n) is the exact cost to reach n.</p>
<p><strong>Example:</strong> h<sub>SLD</sub>(n), the straight-line distance, never overestimates actual road distance, because the shortest path between two points is a straight line.</p>
<h4>Admissible heuristics for the 8-puzzle</h4>
<ul><li><strong>h₁(n)</strong> = number of misplaced tiles</li>
<li><strong>h₂(n)</strong> = total Manhattan distance — the sum of the distances of the tiles from their goal positions</li></ul>
<p>For the standard start state in the slides: <strong>h₁(S) = 8</strong>, and <strong>h₂(S) = 3+1+2+2+2+3+3+2 = 18</strong>.</p>
<h4>Relaxed problems</h4>
<p>A problem with fewer restrictions on the actions is a <strong>relaxed problem</strong>. The cost of an optimal solution to a relaxed problem is an <em>admissible heuristic</em> for the original problem, because the optimal solution in the original is also a solution in the relaxed problem and must be at least as expensive.</p>
<ul><li>Relax so that a tile can move <strong>anywhere</strong> → h₁ gives the shortest solution.</li>
<li>Relax so that a tile can move to any <strong>adjacent</strong> square → h₂ gives the shortest solution.</li></ul>`,
 understand:`<p>Admissibility is the safety property that makes A* trustworthy. If your heuristic ever <em>overestimates</em>, A* may reject the true optimal path because it looks too expensive, and it silently returns a worse answer.</p>
<p>The relaxed-problem idea is how you <em>invent</em> a heuristic instead of guessing one: delete a rule from the problem, solve what is left, and use that cost. Because you deleted a constraint, the answer can only be smaller — which is exactly admissibility.</p>
<p>Note h₂ ≥ h₁ always: Manhattan distance <em>dominates</em> misplaced tiles, so it is the better heuristic — closer to h* while still never exceeding it.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — What is an admissible heuristic? Give an example.</strong> A heuristic h(n) estimates the remaining cost from n to the goal. It is <em>admissible</em> if h(n) ≤ h*(n) for every node n, where h*(n) is the true remaining cost — i.e. it never overestimates and is therefore optimistic. Admissibility guarantees that A* returns the optimal solution. Examples: straight-line distance for road navigation (a straight line is never longer than the road); for the 8-puzzle, h₁ = number of misplaced tiles and h₂ = total Manhattan distance, with h₁(S) = 8 and h₂(S) = 18 for the standard start state. Add the relaxed-problem justification for one mark.</p>`,
 mistakes:["Writing h(n) ≥ h*(n). Admissible means <em>never over</em>estimates, so h(n) ≤ h*(n).",
 "Saying an admissible heuristic makes A* faster. It makes A* <em>optimal</em>; a more <em>informed</em> (larger but still admissible) heuristic makes it faster.",
 "Computing Manhattan distance diagonally. It is |Δrow| + |Δcolumn|, no diagonal moves."]},

{id:"m2t5", title:"Best-First Search and Greedy Best-First Search", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 2 informed slides 3–11; class notes",
 tags:["greedy","best first","evaluation function","romania","dead end"],
 learn:`<h4>Best-first search</h4>
<p><strong>Idea:</strong> use an evaluation function <strong>f(n)</strong> to select the node for expansion — an estimate of "desirability". Expand the most desirable unexpanded node. <strong>Implementation:</strong> order the nodes in the fringe in decreasing order of desirability. A key component is the heuristic function h(n), the estimated cost of the cheapest path from n to a goal node.</p>
<h4>Greedy best-first search</h4>
<p>Expands the node that <em>appears</em> to be closest to the goal.</p>
<div class="fx">f(n) = h(n)</div>
<p>For the Romania map example, h<sub>SLD</sub>(n) is the straight-line distance from n to Bucharest. Note that h<sub>SLD</sub> <strong>cannot be computed from the problem description itself</strong> — it takes experience to know it correlates with road distance and is therefore useful.</p>
<h4>Properties of greedy best-first search</h4>
<ul>
<li><strong>Complete?</strong> No — it can get stuck in loops, e.g. Iasi → Neamt → Iasi → Neamt …</li>
<li><strong>Time?</strong> O(b<sup>m</sup>), but a good heuristic gives dramatic improvement.</li>
<li><strong>Space?</strong> O(b<sup>m</sup>) — keeps all nodes in memory.</li>
<li><strong>Optimal?</strong> No.</li>
</ul>
<p><strong>Problems shown in the slides:</strong> the path through Fagaras is not optimal; and in getting from Iasi to Fagaras it expands Neamt first, which is a dead end.</p>`,
 understand:`<p>Greedy search is "always walk towards the goal" with no memory of what the journey has already cost. It is fast and often wrong, exactly like driving towards a destination by always taking the road that points at it — you can end up at a river with no bridge.</p>
<p>The one-line reason it fails: <strong>it ignores g(n).</strong> A* fixes precisely this by adding g(n) back in.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Explain greedy best-first search and its limitations.</strong> Greedy best-first search is an informed strategy that expands the node appearing closest to the goal, using f(n) = h(n) alone. Implementation: keep the fringe ordered by h. Properties: not complete (can loop, e.g. Iasi → Neamt → Iasi), not optimal (the Fagaras route in the Romania example is not the shortest), time and space O(b<sup>m</sup>). Its weakness is that it ignores the cost already incurred, g(n); A* corrects this with f(n) = g(n) + h(n).</p>`,
 mistakes:["Writing f(n) = g(n) + h(n) for greedy. That is A*. Greedy uses f(n) = h(n) only.",
 "Claiming greedy is complete because it uses a heuristic. It is not — it can loop.",
 "Confusing greedy best-first with uniform-cost search (which orders by g(n) only)."]},

{id:"m2t6", title:"A* Search Algorithm", type:"numerical",
 priority:"high", core:true, marks:[5,10], src:"Chpt 2 informed slides 16–26; CIA-02 Q1; class notes 3/8, 6/8",
 tags:["a star","astar","f=g+h","open list","closed list","numerical","optimal","cia"],
 diagram:"astarGraph",
 concept:"A* combines the cost already paid with the estimated cost remaining, so it avoids expanding paths that are already expensive while still guaranteeing the optimal solution when h is admissible. It is the single most likely numerical in this paper.",
 formula:"f(n) = g(n) + h(n)",
 variables:[
  {v:"g(n)", m:"Cost so far to reach n — the <em>actual</em> cost from the start node along the current best path."},
  {v:"h(n)", m:"Estimated cost from n to the goal — the heuristic. Given to you in the question, written next to each node."},
  {v:"f(n)", m:"Estimated total cost of the path through n to the goal. A* always expands the node with the smallest f."},
  {v:"OPEN", m:"The fringe — generated but not yet expanded nodes, each tagged with its f value."},
  {v:"CLOSED", m:"Nodes already expanded. The node with the least f value gets moved from OPEN to CLOSED."}],
 whenToUse:"When the question gives you a weighted graph with a heuristic value at each node and asks for the shortest path, the search tree, or the contents of OPEN/CLOSED at each step. If no heuristic is given, it is a uniform-cost or BFS/DFS question instead.",
 algorithm:`<ol class="wsteps">
<li><strong>Initialise:</strong> OPEN = {s}, CLOSED = { }, g(s) = 0, f(s) = h(s).</li>
<li><strong>Fail:</strong> if OPEN = { }, terminate and fail.</li>
<li><strong>Select:</strong> select the minimum-cost state n from OPEN, and save it in CLOSED.</li>
<li><strong>Terminate:</strong> if n belongs to the goal set G, terminate with success and return f(n). The solution is found by backtracking the path.</li>
<li><strong>Expand:</strong> otherwise generate the successors of n, add them to OPEN, and repeat until the goal node is reached.</li>
</ol>
<div class="note tip"><span class="note-t">Tie-breaking rule from class</span>When two nodes have the <strong>same f value</strong>, look at h(n) and close the one with the <strong>least h(n)</strong> — a smaller h means it is closer to the goal.</div>`,
 props:"<strong>Complete:</strong> Yes &nbsp;·&nbsp; <strong>Optimal:</strong> Yes (if h is admissible) &nbsp;·&nbsp; <strong>Time:</strong> O(b<sup>d</sup>) &nbsp;·&nbsp; <strong>Space:</strong> O(b<sup>d</sup>)",
 limitations:["High memory usage — keeps every generated node.","Time consuming on large graphs.",
  "Heavily dependent on the heuristic: a good heuristic → faster search; a poor heuristic → behaves more like uniform-cost search.",
  "Poor scalability.","Explores many unnecessary nodes."],
 worked:{
  problem:"<strong>CIA-02 Q1 (5 marks).</strong> Perform A* on the graph shown above. What is the shortest path from <strong>a</strong> to <strong>z</strong>?<br><em>Heuristics:</em> h(a)=14, h(b)=12, h(c)=11, h(d)=6, h(e)=4, h(f)=11, h(z)=0.<br><em>Edges:</em> a–b = 4, a–c = 3, b–f = 5, b–e = 12, f–z = 16, c–e = 10, c–d = 7, d–e = 2, e–z = 5.",
  steps:[
   "<strong>Initialise.</strong> OPEN = { a<sup>(0+14)=14</sup> }, CLOSED = { }.",
   "<strong>Expand a</strong> (f = 14, the minimum). Successors: b with g = 4, f = 4+12 = <strong>16</strong>; c with g = 3, f = 3+11 = <strong>14</strong>.<br>OPEN = { c¹⁴, b¹⁶ } · CLOSED = { a¹⁴ }",
   "<strong>Expand c</strong> (f = 14). Successors: e with g = 3+10 = 13, f = 13+4 = <strong>17</strong>; d with g = 3+7 = 10, f = 10+6 = <strong>16</strong>.<br>OPEN = { b¹⁶, d¹⁶, e¹⁷ } · CLOSED = { a, c }",
   "<strong>Tie at f = 16</strong> between b and d. Apply the tie-break rule: h(d) = 6 &lt; h(b) = 12, so <strong>expand d</strong>. Successor: e via d has g = 10+2 = 12, f = 12+4 = <strong>16</strong> — better than the previous g(e) = 13, so update e to g = 12 with parent d.<br>OPEN = { b¹⁶, e¹⁶ } · CLOSED = { a, c, d }",
   "<strong>Expand e</strong> (f = 16, and h(e) = 4 &lt; h(b) = 12). Successor: z with g = 12+5 = 17, f = 17+0 = <strong>17</strong>.<br>OPEN = { b¹⁶, z¹⁷ } · CLOSED = { a, c, d, e }",
   "<strong>Expand b</strong> (f = 16). Successors: f with g = 4+5 = 9, f = 9+11 = <strong>20</strong>; e via b has g = 4+12 = 16, which is worse than g(e) = 12 — discard.<br>OPEN = { z¹⁷, f²⁰ }",
   "<strong>Expand z</strong> (f = 17) — it is the goal and nothing in OPEN has f &lt; 17, so terminate with success.",
   "<strong>Recover the path by following parent pointers backwards from z:</strong> z ← e ← d ← c ← a."],
  answer:"Shortest path: a → c → d → e → z,  cost = 3 + 7 + 2 + 5 = 17.  CLOSED list order: a, c, d, e, z.",
  check:"<strong>Verify against the alternatives:</strong> a–c–e–z = 3+10+5 = 18; a–b–e–z = 4+12+5 = 21; a–b–f–z = 4+5+16 = 25. So 17 is genuinely optimal. ✓"},
 diagram2:"astarSolved",
 learn:`<p>A* is the standard informed search of this syllabus. Its idea, in the lecture's words, is to <strong>avoid expanding paths that are already expensive</strong>.</p>
<p>Greedy search looks only forward and takes wrong turns; uniform-cost search looks only backward and wanders. A* adds the two together, so a node is attractive only if it is both cheap to reach <em>and</em> looks close to the goal.</p>
<div class="fx">f(n) = g(n) + h(n)</div>
<p>It maintains two lists. <strong>OPEN</strong> holds generated-but-not-expanded nodes with their f values; <strong>CLOSED</strong> holds nodes already expanded. At each step the minimum-f node moves from OPEN to CLOSED and its successors are generated.</p>`,
 understand:`<p>Think of g as the <em>receipt</em> for what you have already spent and h as the <em>quote</em> for what remains. A* always works on whichever route has the lowest total bill so far. Because an admissible h never quotes too high, a route can never be dismissed as too expensive when it is in fact the cheapest — which is exactly why A* is optimal.</p>
<p>Two mechanical points decide whether you get the marks. First, a node can be reached again more cheaply, in which case you must <strong>lower its g and repoint its parent</strong>. Second, the answer is the <strong>parent chain read backwards from the goal</strong>, not the CLOSED list.</p>`,
 examAnswer:`<p><strong>10 marks — Perform A* search on the given graph.</strong> Structure the answer in five parts. (1) State f(n) = g(n) + h(n) and define g, h and f in one line each. (2) State the algorithm: initialise OPEN = {s} with f(s) = h(s); repeatedly move the minimum-f node from OPEN to CLOSED; on ties take the smaller h; terminate when the goal is <em>selected for expansion</em>. (3) <strong>Draw the OPEN/CLOSED table with one row per iteration</strong>, showing each node as g+h = f — this is where most of the marks are. (4) Recover the path by following parent pointers backwards from the goal and state the total cost. (5) Note that A* is complete, and optimal because h is admissible. <em>For the CIA-02 graph: path a → c → d → e → z, cost 17, CLOSED order a, c, d, e, z.</em></p>
<p><strong>5 marks:</strong> the OPEN/CLOSED table and the final path with its cost.</p>`,
 mistakes:[
  "<strong>Stopping as soon as the goal is <em>generated</em>.</strong> A* terminates when the goal is <em>selected for expansion</em> (i.e. popped as the minimum f). Stopping early gives a suboptimal answer — see the worked trap below.",
  "<strong>Reading the path off the CLOSED list.</strong> The CLOSED list is the <em>order of expansion</em>, not the path. The class notes state it directly: <em>A* makes the final path with respect to the parent node, starting from G and going in reverse.</em>",
  "Not updating g(n) when a cheaper route to an already-generated node is found. In the worked example, e must be re-costed from 13 down to 12 via d.",
  "Forgetting to add h to g. Writing only g turns A* into uniform-cost search.",
  "Adding the heuristic of the goal. h(goal) = 0 always."],
 practice:[
  {d:"Basic", q:"For the CIA-02 graph above, what are f(b) and f(c) immediately after expanding the start node a?",
   s:"<p>g(b) = 4 and h(b) = 12, so <strong>f(b) = 16</strong>.<br>g(c) = 3 and h(c) = 11, so <strong>f(c) = 14</strong>.</p><p>c has the smaller f, so c is expanded next.</p>"},
  {d:"Moderate", q:"In the worked example, node <strong>e</strong> was first generated from c with g = 13, then later reached from d with g = 12. What must A* do, and why does it matter?",
   s:"<p>A* must <strong>update</strong> e: set g(e) = 12, recompute f(e) = 12 + 4 = 16, and change e's parent pointer from c to d.</p><p>It matters for two reasons. (1) <em>Cost</em>: without the update the final answer would be 3+10+5 = 18 instead of 17. (2) <em>Path</em>: the parent pointer is what the path is recovered from, so without the update you would report a → c → e → z rather than a → c → d → e → z.</p><p>This is the step students most often skip.</p>"},
  {d:"Exam-level", q:"<strong>The suboptimality trap (from class, 6/8/26).</strong> A graph has h(S)=17, h(A)=10, h(B)=13, h(C)=4, h(D)=2, h(E)=4, h(F)=1, h(G)=0 and edges S–A = 6, S–B = 5, S–C = 10, A–E = 6, B–E = 6, B–D = 7, B–C = 4, C–D = 6, D–E = 2, D–F = 6, E–F = 4, F–G = 3.<br>A student stops the moment G appears in OPEN and reports cost 19. What is the correct answer, and what did they do wrong?",
   s:`<p><strong>What the student did.</strong> Expanding S gives A(f=16), B(f=18), C(f=14). Expand C → D(f=18). Expand A → E(g=12, f=16). Expand E → F(g=16, f=17). Expand F → G(g=19, f=19). At this point OPEN = { B¹⁸, D¹⁸, G¹⁹ }. The student stopped here and read the answer as 19 via S→A→E→F→G.</p>
<p><strong>Why that is wrong.</strong> G has f = 19, but B and D are still in OPEN with f = 18 &lt; 19. A* must expand the <em>minimum-f</em> node, so B and D come first — and they lead to a cheaper route to G.</p>
<p><strong>Continuing correctly.</strong> Expand D (f=18): no improvement to F (g would be 22 &gt; 16). Expand B (f=18): E is improved to g = 5+6 = 11 (f = 15) and D is improved to g = 12 (f = 14). Expand D (f=14) → no gain. Expand E (f=15) → F improves to g = 15, f = 16. Expand F (f=16) → G improves to g = 18, f = 18. Now expand G.</p>
<div class='ans'>Correct answer: path <strong>S → B → E → F → G</strong>, cost = 5 + 6 + 4 + 3 = <strong>18</strong>, not 19.</div>
<p><strong>The two errors to avoid:</strong> (1) terminating when the goal is first <em>generated</em> rather than when it is <em>selected for expansion</em>; (2) reporting the CLOSED list (S, C, A, E, F, G) as if it were the path — the path must be recovered backwards through parent pointers.</p>`}]},

{id:"m2t7", title:"Optimality of A* — the proof", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 2 informed slide 30; class notes",
 tags:["a star","optimality","proof","admissible","theorem"],
 learn:`<div class="note"><span class="note-t">Theorem</span>If the heuristic h(n) is <strong>admissible</strong> (never overestimates the remaining cost), then A* always finds the <strong>optimal</strong> path.</div>
<h4>Proof</h4>
<p>Let <strong>G</strong> be the optimal goal with optimal cost <strong>C*</strong>, and let <strong>G₂</strong> be a suboptimal goal (cost higher than C*).</p>
<p><strong>Step 1.</strong> Since G₂ is not optimal, and h(G₂) = 0 at any goal,</p>
<div class="fx">f(G₂) = g(G₂) &gt; C*</div>
<p><strong>Step 2.</strong> Consider a node <strong>n</strong> that is still in the OPEN list and lies on the optimal path. Because the heuristic is admissible,</p>
<div class="fx">f(n) = g(n) + h(n) ≤ C*</div>
<p><strong>Step 3.</strong> Combining the two,</p>
<div class="fx">f(n) ≤ C* &lt; f(G₂)</div>
<p><strong>Step 4.</strong> A* always expands the node with the smallest f-value. Since f(n) &lt; f(G₂), A* will expand <strong>n before G₂</strong>.</p>
<p><strong>Conclusion.</strong> By repeatedly expanding such nodes, A* reaches the optimal goal G before it can ever choose the suboptimal goal G₂. Therefore A* always returns the optimal solution when h(n) is admissible. ∎</p>`,
 understand:`<p>The intuition given in the lecture: A* keeps comparing the distance already travelled with the estimated distance remaining. As long as there is another route with a lower estimated total, it keeps exploring that route. So it always reaches the shortest route before accepting any longer one.</p>
<p>Everything hinges on Step 2. If h could overestimate, f(n) might exceed C*, the optimal path's node could be pushed behind G₂ in the queue, and A* would return the worse goal.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Prove that A* is optimal.</strong> State the theorem: if h(n) is admissible, A* returns the optimal path. Let G be the optimal goal with cost C* and G₂ a suboptimal goal. Then f(G₂) = g(G₂) &gt; C* since h = 0 at a goal. Let n be a node on the optimal path still in OPEN; admissibility gives f(n) = g(n) + h(n) ≤ C*. Hence f(n) ≤ C* &lt; f(G₂). Since A* always expands the smallest f first, it expands n before G₂, and by repeating this it reaches G before ever selecting G₂. Therefore A* is optimal. Add one line: admissibility is essential — an overestimating h breaks the inequality in step 2.</p>`,
 mistakes:["Stating the theorem without the inequality chain. The three lines f(G₂) &gt; C*, f(n) ≤ C*, therefore f(n) &lt; f(G₂) <em>are</em> the proof.",
 "Forgetting to say h(G₂) = 0, which is why f(G₂) = g(G₂).",
 "Proving it for consistency instead of admissibility — the syllabus asks for the admissible version."]},

{id:"m2t8", title:"Local Search and Hill Climbing", type:"theory",
 priority:"high", core:true, marks:[5,10], src:"Chpt 2 informed slides 31–40; class notes 10/8",
 tags:["hill climbing","local search","local maxima","plateau","ridge","n-queens","optimization"],
 diagram:"hillClimb",
 learn:`<h4>Local search algorithms</h4>
<p>In many optimization problems <strong>the path to the goal is irrelevant; the goal state itself is the solution</strong>. The state space is a set of "complete" configurations, and we must find one satisfying the constraints — e.g. <strong>n-queens</strong>. Local search keeps a single "current" state and tries to improve it.</p>
<h4>Hill-climbing search</h4>
<p>The lecture's description: <em>"like climbing Everest in thick fog with amnesia."</em> Move continually in the direction of increasing value; stop when no neighbour is better.</p>
<h4>The three problems with hill climbing</h4>
<ol>
<li><strong>Local optima.</strong> Hill climbing gets stuck at points where no neighbour is better, even though a higher global optimum exists elsewhere. It may miss the global optimum if it starts near a local one.</li>
<li><strong>Plateau.</strong> On flat regions where the function has a constant value, hill climbing struggles to make progress, since all neighbouring points have the same value.</li>
<li><strong>Ridges and valleys.</strong> Hill climbing is sensitive to the initial starting point. Starting on a ridge or valley, it may follow it without reaching the optimum.</li>
</ol>
<h4>The four types of hill climbing</h4>
<ol>
<li><strong>Simple hill climbing</strong> — examines <em>one</em> neighbouring state at a time; as soon as it finds a better neighbour it moves there and does not check the remaining neighbours.</li>
<li><strong>Steepest-ascent hill climbing</strong> — generates <em>all</em> neighbouring states, compares their heuristic values, and moves to the best neighbour.</li>
<li><strong>Stochastic hill climbing</strong> — identifies the uphill (better) neighbours and <em>randomly selects one of them</em>. Neighbours with greater improvement have a higher probability of being selected. It does not always choose the best neighbour, but it <strong>never chooses a worse one</strong>.</li>
<li><strong>Random-restart hill climbing</strong> — runs hill climbing multiple times, each from a different randomly generated initial state. If one run gets stuck in a local optimum it restarts, continuing until the goal is found or the maximum number of restarts is reached.</li>
</ol>
<h4>8-queens with hill climbing</h4>
<p><strong>h = the number of pairs of queens attacking each other</strong>, either directly or indirectly. The slide's example state has h = 17; hill climbing reaches a <em>local minimum with h = 1</em> and gets stuck there.</p>`,
 understand:`<p>Read the landscape diagram above carefully — the class notes flag "<strong>diagram + naming the problems to overcome</strong>" as the examinable form of this question, so the diagram with <em>shoulder, local maximum, flat local maximum (plateau), global maximum</em> labelled is the answer.</p>
<p>The four variants are best remembered by what each one fixes: simple (fast, weakest) → steepest-ascent (looks at all neighbours) → stochastic (adds randomness to escape) → random-restart (restarts entirely, the only one that beats local optima reliably).</p>`,
 examples:[{t:"n-queens",b:"Place n queens on an n × n board with no two queens on the same row, column, or diagonal. The path is irrelevant — only the final arrangement matters, which is why it is a local-search problem."}],
 examAnswer:`<p><strong>10 marks — Explain hill climbing, its problems and its variants.</strong> (a) Define local search: the path is irrelevant, the goal state itself is the solution; keeps one current state and improves it. (b) <strong>Draw the state-space landscape</strong> labelling shoulder, local maximum, flat local maximum/plateau and global maximum. (c) The three problems: local optima (stuck where no neighbour is better), plateau (flat region, all neighbours equal, no progress), ridges/valleys (sensitivity to the starting point). (d) The four types: simple (moves on the first better neighbour), steepest-ascent (generates all, takes the best), stochastic (randomly picks among the better neighbours, never a worse one), random-restart (repeats from random initial states). (e) Example: 8-queens with h = number of attacking pairs; h = 17 initially, gets stuck at a local minimum with h = 1.</p>`,
 mistakes:["Saying stochastic hill climbing can accept a worse neighbour. It cannot — only <em>simulated annealing</em> does that.",
 "Confusing a plateau with a local maximum. A plateau is flat (neighbours equal); a local maximum is a peak (neighbours lower).",
 "Naming only two variants. There are four, and random-restart is the one that actually solves the local-optimum problem.",
 "Drawing the landscape without labels. The labels are the marks."]},

{id:"m2t9", title:"Simulated Annealing", type:"theory",
 priority:"high", core:true, marks:[5,10], src:"Chpt 2 informed slides 41–49; class notes 10/8",
 tags:["simulated annealing","annealing","temperature","stopping criteria","optimization","global"],
 learn:`<h4>The physical analogy</h4>
<p>Simulated annealing is named after <strong>physical annealing in solids</strong>. A crystalline solid is heated and then allowed to cool <em>very slowly</em> until it reaches its most regular crystal lattice configuration — its minimum lattice energy state — free of crystal defects. If the cooling schedule is slow enough, the final configuration has superior structural integrity. Fast cooling induces a fragile structure.</p>
<div class="tw"><table><thead><tr><th>Thermodynamic simulation</th><th>Optimization</th></tr></thead><tbody>
<tr><td>System states</td><td>Solutions</td></tr><tr><td>Energy</td><td>Cost</td></tr>
<tr><td>Change of state</td><td>Neighbouring solutions</td></tr>
<tr><td>Temperature</td><td>Control parameter T</td></tr>
<tr><td>Frozen state</td><td>Heuristic solution</td></tr>
</tbody></table></div>
<h4>The algorithm's idea</h4>
<p><strong>Escape local maxima by allowing some "bad" moves, but gradually decrease their frequency.</strong> At the start, bad moves are allowed very frequently; towards the end, fewer bad moves are allowed.</p>
<p>At every step compute <strong>ΔE</strong>:</p>
<ul><li><strong>ΔE &gt; 0</strong> (positive) — the neighbour is a <em>good</em> move; accept it unconditionally.</li>
<li><strong>ΔE &lt; 0</strong> (negative) — the neighbour is <em>bad</em>; accept it with probability</li></ul>
<div class="fx">P(accept) = e<sup>ΔE / T</sup></div>
<p>where T is the current temperature. As T decreases, this probability shrinks towards zero, so late in the run the algorithm behaves like plain hill climbing.</p>
<h4>Properties</h4>
<ul><li>SA is a <strong>global optimization</strong> technique and distinguishes between different local optima.</li>
<li>SA is <strong>memoryless</strong> — the algorithm does not use any information gathered during the search.</li>
<li>It is an iterative improvement algorithm.</li>
<li><strong>If T decreases slowly enough, simulated annealing will find a global optimum with probability approaching 1.</strong></li>
<li>Widely used in VLSI layout, airline scheduling, etc.</li></ul>
<h4>Stopping criteria — asked explicitly in the MSE notes</h4>
<ol>
<li>A given <strong>minimum value of the temperature</strong> has been reached.</li>
<li>A certain number of iterations (or temperatures) has passed <strong>without acceptance of a new solution</strong>.</li>
<li>A specified number of <strong>total iterations</strong> has been executed.</li>
</ol>`,
 understand:`<p>The whole point in one line: <strong>hill climbing never goes downhill, so it gets trapped; simulated annealing goes downhill sometimes, so it can escape — and it does this less and less as it cools, so it eventually settles.</strong></p>
<p>Compared with a greedy algorithm on a bumpy landscape: greedy gets stuck at the first local optimum; SA chooses the escaping move with a small probability, explores further, and over a large number of iterations converges to the global optimum.</p>`,
 examples:[],
 examAnswer:`<p><strong>10 marks — Explain simulated annealing.</strong> (a) State the analogy to physical annealing: heat a solid, cool it very slowly so it reaches its minimum-energy defect-free lattice; fast cooling gives a fragile structure. (b) Give the correspondence table (states↔solutions, energy↔cost, temperature↔control parameter T, frozen state↔heuristic solution). (c) The idea: escape local maxima by allowing bad moves, gradually decreasing their frequency. (d) At each step compute ΔE; if ΔE &gt; 0 accept; if ΔE &lt; 0 accept with probability e<sup>ΔE/T</sup>. (e) Properties: global optimization technique, memoryless, and if T decreases slowly enough it finds the global optimum with probability approaching 1. (f) <strong>The three stopping criteria.</strong> (g) Applications: VLSI layout, airline scheduling.</p>
<p><strong>5 marks:</strong> the idea, the acceptance rule with the probability formula, and the three stopping criteria.</p>`,
 mistakes:["Omitting the stopping criteria. The class notes flag them as specifically examinable.",
 "Saying SA always accepts bad moves. It accepts them <em>with probability</em> e<sup>ΔE/T</sup>, which falls as T falls.",
 "Calling SA a memory-based algorithm. The slides state it is <em>memoryless</em>.",
 "Forgetting that T must decrease <em>slowly</em> — that condition is what gives the probability-1 guarantee."]},

{id:"m2t10", title:"Genetic Algorithms", type:"theory",
 priority:"high", core:true, marks:[5,10], src:"Chpt 2 informed slides 50–57; class notes 13/8",
 tags:["genetic algorithm","crossover","mutation","fitness","selection","roulette","population"],
 learn:`<p>Developed by <strong>John Holland</strong>, University of Michigan, in the 1970s. The idea comes from <strong>genetics and natural selection</strong> — <em>"select the best, leave the rest"</em>, <em>"survival of the fittest"</em>. Used to generate high-quality solutions for optimization problems, and <strong>better for large state spaces</strong>.</p>
<h4>Terminology</h4>
<ul>
<li><strong>Population</strong> — the state space.</li>
<li><strong>Individual</strong> — a possible solution. A state is represented as a <em>string over a finite alphabet</em>, often a string of 0s and 1s (binary encoding).</li>
<li><strong>Fitness function</strong> — the evaluation function; higher values for better states. (It plays the role of the heuristic function.)</li>
<li><strong>Selection</strong> — choosing individuals for reproduction.</li>
<li><strong>Crossover</strong> — generating new states by combining two parents.</li>
<li><strong>Mutation</strong> — generating a new state by mutating a gene.</li>
<li><strong>Convergence</strong> — the stopping criteria.</li>
</ul>
<p>Crossovers and mutations bring <strong>diversity</strong> into the population.</p>
<h4>Convergence / stopping criteria</h4>
<ul><li>Manual checking</li><li>The solution found does not satisfy the objective function</li>
<li>Reached the set number of iterations</li><li>Budget limit reached (in time or space)</li></ul>
<h4>The algorithm</h4>
<pre style="background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:.7rem;overflow-x:auto;font-size:.83rem;font-family:var(--mono);line-height:1.6">initialize population;
evaluate population;
while (Termination Criteria Not Satisfied) {
    select parents for reproduction;
    perform crossovers and mutation;
    evaluate population;
}</pre>
<p>Start with k randomly generated states (the population). Produce the next generation by <strong>selection, crossover and mutation</strong>.</p>
<h4>Roulette wheel selection</h4>
<p>Individuals are given a probability of being selected <strong>directly proportional to their fitness</strong>. More area on the roulette wheel means more chance of being selected. Two individuals are then chosen randomly based on these probabilities and produce offspring.</p>
<div class="fx">Fitness ∝ Area ∝ Selection probability</div>
<p><strong>8-queens example:</strong> the fitness function is the <em>number of non-attacking pairs of queens</em>. With four individuals scoring 24, 23, 20 and 11, the selection probabilities are 24/(24+23+20+11) = 31%, 23/78 = 29%, and so on.</p>`,
 understand:`<p>The three operators do three different jobs, and confusing them costs marks:</p>
<ul><li><strong>Selection</strong> decides <em>who</em> reproduces — it applies the pressure towards fitness.</li>
<li><strong>Crossover</strong> combines two parents — it <em>exploits</em> good building blocks already found.</li>
<li><strong>Mutation</strong> changes a single gene at random — it <em>explores</em>, preventing the population converging too early on a local optimum.</li></ul>
<p>Genetic algorithms are local search with a <em>population</em> instead of a single current state, which is why they cope with large state spaces where hill climbing gets trapped.</p>`,
 examples:[],
 examAnswer:`<p><strong>10 marks — Explain the Genetic Algorithm.</strong> (a) Origin: John Holland, 1970s, based on genetics and natural selection — survival of the fittest; used for optimization over large state spaces. (b) Terminology: population = state space, individual = possible solution encoded as a string (often binary), fitness function = evaluation function with higher values for better states. (c) The pseudocode loop: initialize → evaluate → while not converged { select parents, crossover, mutate, evaluate }. (d) The three operators — selection, crossover, mutation — and what each contributes; crossover and mutation bring diversity. (e) Roulette-wheel selection with fitness ∝ area ∝ selection probability, worked with the 8-queens numbers (24/78 = 31%, 23/78 = 29%). (f) The four convergence criteria. Use the 8-queens fitness = number of non-attacking pairs as the running example.</p>`,
 mistakes:["Saying the fitness function is minimised. In the slides higher fitness = better state.",
 "Swapping crossover and mutation. Crossover combines <em>two</em> parents; mutation alters <em>one</em> gene.",
 "Giving roulette selection as 'pick the two best'. It is <em>probabilistic</em> and proportional to fitness — a weak individual can still be selected.",
 "Forgetting the convergence criteria."]},

{id:"m2t11", title:"Adversarial Search and the Minimax Algorithm", type:"numerical",
 priority:"high", core:true, marks:[10], src:"Chpt 2 informed slides 58–64; class notes 13/8 (marked 10 marks)",
 tags:["minimax","adversarial","game playing","zero sum","utility","tic tac toe","numerical"],
 concept:"In a competitive multi-agent environment there is an opponent who always plays optimally. Minimax computes, for every node, the value that results if both players play their best — MAX maximising the utility and MIN minimising it.",
 formula:"MINIMAX(s) = UTILITY(s) if TERMINAL(s);  max over actions if PLAYER(s) = MAX;  min over actions if PLAYER(s) = MIN",
 variables:[
  {v:"MAX", m:"The player we are computing for. MAX moves first and tries to <em>maximise</em> the utility. Drawn as an upward triangle △."},
  {v:"MIN", m:"The opponent. Tries to <em>minimise</em> the utility. Drawn as a downward triangle ▽."},
  {v:"Utility", m:"The numerical payoff of a terminal state, always from MAX's perspective. Chess: Win = +1, Draw = 0, Loss = −1. Drawn as a square □."},
  {v:"ply", m:"One move by one player. Two plies = one full round."}],
 whenToUse:"Whenever a game tree is given with utility values at the leaves and you are asked for the value at the root, the best move, or 'perform minimax'.",
 learn:`<h4>Adversarial search</h4>
<p>Competitive environments in which agents' goals are in conflict give rise to adversarial search problems, often known as <strong>games</strong>. There exists an opponent who always has an optimal move, and according to that we decide how to move. It is <strong>multi-agent</strong>.</p>
<p><strong>Zero-sum games of perfect information</strong> — deterministic, fully observable environments in which two agents act alternately and the utility values at the end are always <em>equal and opposite</em>. If one player wins, the other necessarily loses.</p>
<p><strong>Why games interest AI researchers:</strong> the state of a game is easy to represent, and agents are restricted to a small number of actions whose outcomes are defined by precise rules. Physical games, by contrast, are complex.</p>
<p>Chess has an average branching factor of about 35 and games often run 50 moves per player, giving a search tree of roughly 35<sup>100</sup> ≈ 10<sup>154</sup> nodes. <strong>Pruning</strong> lets us ignore portions that make no difference to the final choice, and heuristic evaluation functions let us approximate the true utility of a state without a complete search.</p>
<h4>Game playing as a search problem</h4>
<div class="tw"><table><tbody>
<tr><td><code>S₀</code></td><td>Initial state / starting configuration</td></tr>
<tr><td><code>PLAYER(s)</code></td><td>Player whose turn it is in state s</td></tr>
<tr><td><code>ACTIONS(s)</code></td><td>Legal moves available in state s</td></tr>
<tr><td><code>RESULT(s,a)</code></td><td>State obtained after performing action a</td></tr>
<tr><td><code>TERMINAL-TEST(s)</code></td><td>Checks whether the game has ended</td></tr>
<tr><td><code>UTILITY(s,p)</code></td><td>Numerical payoff of terminal state s for player p</td></tr>
</tbody></table></div>
<h4>The minimax algorithm</h4>
<ul><li>A <strong>ply</strong> represents one move by one player.</li>
<li><strong>MAX nodes</strong>: MAX's turn → chooses the <em>highest</em> value.</li>
<li><strong>MIN nodes</strong>: MIN's turn → chooses the <em>lowest</em> value.</li>
<li>Terminal nodes contain utility values from <strong>MAX's perspective</strong>.</li>
<li>These utility values are propagated <strong>bottom-up</strong> to obtain the minimax values.</li>
<li>Minimax uses <strong>DFS</strong> and starts from the bottom.</li></ul>
<div class="note"><span class="note-t">Minimax principle</span>MAX chooses its best move <strong>assuming that MIN will always make the best possible counter-move.</strong></div>
<h4>Tic-Tac-Toe as a game tree</h4>
<p>The initial state is an empty 3×3 board. MAX (X) moves first → 9 possible moves. Players alternate (MAX → X, MIN → O). Play continues until a terminal state: three in a row, or all squares filled → draw. Each terminal state is assigned a utility from MAX's perspective: <strong>+1</strong> MAX wins, <strong>0</strong> draw, <strong>−1</strong> MIN wins.</p>`,
 understand:`<p>Work strictly bottom-up. Write the value <em>above</em> each node as you compute it. At a △ take the max of its children, at a ▽ take the min. The value at the root is what MAX can guarantee against perfect play — and the child that produced it is the move MAX should play.</p>
<p>A useful sanity check: the root value must equal one of the leaf values, and it must be achievable by a path that alternates max-choice and min-choice.</p>`,
 worked:{
  problem:"Compute the minimax value of the tree with leaves (left to right) <strong>−4, −9, 9, 6, −17, −4, −11, 7</strong>, where the root is MAX, level 2 is MIN and level 3 is MAX. Which move should MAX make?",
  steps:[
   "<strong>Level 3 (MAX nodes)</strong> — take the maximum of each leaf pair:<br>C₁ = max(−4, −9) = <strong>−4</strong> · C₂ = max(9, 6) = <strong>9</strong> · C₃ = max(−17, −4) = <strong>−4</strong> · C₄ = max(−11, 7) = <strong>7</strong>",
   "<strong>Level 2 (MIN nodes)</strong> — take the minimum of each pair of level-3 values:<br>B₁ = min(−4, 9) = <strong>−4</strong> · B₂ = min(−4, 7) = <strong>−4</strong>",
   "<strong>Root (MAX node)</strong> — take the maximum:<br>Root = max(−4, −4) = <strong>−4</strong>",
   "<strong>Best move:</strong> both branches return −4, so either is optimal. MAX can guarantee a value of −4 and no more, because MIN will always steer towards its lowest option."],
  answer:"Minimax value at the root = −4. MAX cannot do better than −4 against optimal play."},
 props:"<strong>Complete:</strong> Yes (finite tree) &nbsp;·&nbsp; <strong>Optimal:</strong> Yes (against an optimal opponent) &nbsp;·&nbsp; <strong>Time:</strong> O(b<sup>m</sup>) &nbsp;·&nbsp; <strong>Space:</strong> O(bm) — it is a depth-first search",
 examAnswer:`<p><strong>10 marks — Explain adversarial search and the minimax algorithm.</strong> (1) Define adversarial search: competitive multi-agent environments where agents' goals conflict, giving rise to games; an opponent always has an optimal move and we decide ours accordingly. (2) Define a zero-sum game of perfect information: deterministic, fully observable, two agents acting alternately, with utilities at the end always equal and opposite. (3) Give the game-as-search formulation — S₀, PLAYER(s), ACTIONS(s), RESULT(s,a), TERMINAL-TEST(s), UTILITY(s,p) — with chess utilities Win = +1, Draw = 0, Loss = −1. (4) State the minimax principle: MAX chooses its best move assuming MIN will always make the best possible counter-move; MAX nodes take the highest value, MIN nodes the lowest, and terminal utilities propagate <strong>bottom-up</strong>. (5) <strong>Draw a two-ply game tree and annotate every node with its computed value</strong>, then state the root value and MAX's best move. (6) Give properties — complete, optimal against an optimal opponent, O(b<sup>m</sup>) time, O(bm) space — and close with why pruning is needed: chess has b ≈ 35 over 100 plies, about 10<sup>154</sup> nodes.</p>`,
 mistakes:["Applying max at a MIN node. Track the triangle direction carefully: △ = MAX = take the largest, ▽ = MIN = take the smallest.",
 "Computing top-down. Minimax propagates values <strong>bottom-up</strong> from the terminal nodes.",
 "Assigning utilities from MIN's perspective. All utilities are from MAX's perspective.",
 "Reporting the leaf value as the answer instead of the root value."],
 practice:[
  {d:"Basic", q:"A MIN node has three children with minimax values 12, 5 and 8. What value does it return, and why?",
   s:"<p>It returns <strong>5</strong>. A MIN node models the opponent, who chooses the option that is <em>worst for MAX</em> — the minimum of its children's values.</p>"},
  {d:"Moderate", q:"For the tree with leaves −2, 15, 3, 6, −13, −3, 7, 6 (root MAX, level 2 MIN, level 3 MAX), find the minimax value and MAX's best move.",
   s:"<p><strong>Level 3 (MAX):</strong> max(−2,15) = 15 · max(3,6) = 6 · max(−13,−3) = −3 · max(7,6) = 7</p><p><strong>Level 2 (MIN):</strong> B₁ = min(15, 6) = 6 · B₂ = min(−3, 7) = −3</p><p><strong>Root (MAX):</strong> max(6, −3) = <strong>6</strong></p><div class='ans'>Minimax value = 6. MAX should play the <strong>left</strong> branch, since 6 &gt; −3.</div>"},
  {d:"Exam-level", q:"Explain, with the chess figures from the lecture, why minimax alone is impractical for real games, and what two techniques make game-playing feasible.",
   s:"<p><strong>The problem.</strong> Minimax must examine the whole game tree. Chess has an average branching factor b ≈ 35, and games often run to 50 moves per player, so the tree has about 35<sup>100</sup> ≈ 10<sup>154</sup> nodes. Time complexity O(b<sup>m</sup>) makes exhaustive search impossible.</p><p><strong>Technique 1 — pruning.</strong> Alpha–beta pruning lets us ignore portions of the search tree that make no difference to the final choice. It returns the <em>same</em> move as minimax while examining far fewer nodes.</p><p><strong>Technique 2 — heuristic evaluation functions.</strong> These approximate the true utility of a state without doing a complete search, letting us cut the tree off at a fixed depth and evaluate non-terminal positions.</p>"}]},

{id:"m2t12", title:"Alpha–Beta Pruning", type:"numerical",
 priority:"high", core:true, marks:[5,10], src:"Chpt 2 informed slides 65–68; CIA-02 Q2; class notes 17/8",
 tags:["alpha beta","pruning","minimax","numerical","cia","alpha","beta"],
 diagram:"abTree",
 concept:"Alpha–beta pruning improves minimax by eliminating branches that cannot affect the final decision. It produces the same optimal move as minimax but searches fewer nodes.",
 formula:"Prune when α ≥ β",
 variables:[
  {v:"α (alpha)", m:"For <strong>MAX</strong>. The best (highest) value MAX has found so far along the current path. MAX wants α to increase. Initialised to −∞."},
  {v:"β (beta)", m:"For <strong>MIN</strong>. The best (lowest) value MIN has found so far along the current path. MIN wants β to decrease. Initialised to +∞."},
  {v:"α ≥ β", m:"The pruning condition. Once it holds, the remaining branches at that point cannot influence the final minimax decision, so there is no need to explore them."}],
 whenToUse:"Any question that says 'perform alpha–beta pruning on the following tree', or asks which nodes/leaves are pruned. Note that CIA-02 asked exactly this for 5 marks.",
 learn:`<p><strong>The problem with minimax:</strong> it may examine an exponential number of game states as search depth increases.</p>
<p>Alpha–beta pruning eliminates branches that cannot affect the final decision. It produces the <strong>same optimal move</strong> as minimax but searches fewer nodes. Since minimax uses depth-first search, α and β are maintained along the current search path.</p>
<div class="note"><span class="note-t">The rule to memorise</span><strong>For a MAX node, update α. For a MIN node, update β. Prune as soon as α ≥ β.</strong></div>
<h4>Symbols</h4>
<ul><li>△ — MAX node</li><li>▽ — MIN node</li><li>□ — utilities (terminal values)</li></ul>
<div class="fx">Minimax = correct decision &nbsp;·&nbsp; Alpha–Beta = same correct decision + fewer nodes explored</div>`,
 understand:`<p>The intuition for why pruning is safe: at a MIN node, once MIN has found an option worth <em>less</em> than something MAX can already guarantee elsewhere (β ≤ α), MAX will never choose to enter this MIN node at all. So whatever is in the remaining branches is irrelevant — MIN can only make it worse, and it is already too bad to be chosen.</p>
<p><strong>Procedure for the exam:</strong> traverse strictly left-to-right, depth-first. Carry α and β <em>down</em> into children; carry values <em>up</em> to parents. After each child returns, update α (at MAX) or β (at MIN), then test α ≥ β before visiting the next child.</p>`,
 worked:{
  problem:"<strong>Class example, 17/8.</strong> Perform alpha–beta pruning on the tree with leaves (left to right) <strong>−4, −9, 9, 6, −17, −4, −11, 7</strong>. Root = MAX, level 2 = MIN, level 3 = MAX. State the root value and which nodes are pruned.",
  steps:[
   "<strong>Root A (MAX):</strong> α = −∞, β = +∞. Descend to B₁.",
   "<strong>B₁ (MIN):</strong> α = −∞, β = +∞. Descend to C₁.",
   "<strong>C₁ (MAX):</strong> α = −∞, β = +∞. Leaf −4 → α = −4. Leaf −9 → no change. <strong>C₁ returns −4.</strong>",
   "<strong>Back at B₁:</strong> β = min(+∞, −4) = <strong>−4</strong>. Check α ≥ β? −∞ ≥ −4 is false, so continue to C₂.",
   "<strong>C₂ (MAX):</strong> inherits α = −∞, β = −4. Leaf 9 → α = 9. Now test: <strong>α = 9 ≥ β = −4 → PRUNE.</strong> The next leaf (<strong>6</strong>) is never examined. C₂ returns 9.",
   "<strong>Back at B₁:</strong> β = min(−4, 9) = −4. <strong>B₁ returns −4.</strong>",
   "<strong>Back at root A:</strong> α = max(−∞, −4) = <strong>−4</strong>. Descend to B₂ with α = −4, β = +∞.",
   "<strong>C₃ (MAX):</strong> α = −4, β = +∞. Leaf −17 → value −17, α stays −4. Leaf −4 → value −4. <strong>C₃ returns −4.</strong>",
   "<strong>Back at B₂:</strong> β = min(+∞, −4) = −4. Test: <strong>α = −4 ≥ β = −4 → PRUNE.</strong> The entire node C₄ and both its leaves (<strong>−11 and 7</strong>) are never examined. B₂ returns −4.",
   "<strong>Root A:</strong> α = max(−4, −4) = <strong>−4</strong>."],
  answer:"Root value = −4, with α = −4 and β = +∞ at the root. Pruned: the leaf 6 (under C₂), and the whole right-most MAX node C₄ together with its leaves −11 and 7 — 3 leaves saved out of 8.",
  check:"<strong>Cross-check with plain minimax:</strong> C₁=−4, C₂=max(9,6)=9, C₃=−4, C₄=max(−11,7)=7; B₁=min(−4,9)=−4, B₂=min(−4,7)=−4; root = max(−4,−4) = −4. ✓ Same answer, fewer nodes — exactly as the theory promises."},
 examAnswer:`<p><strong>10 marks — Perform alpha–beta pruning on the given tree.</strong> (1) State the problem it solves: minimax may examine an exponential number of states, so alpha–beta eliminates branches that cannot affect the final decision, giving the <em>same</em> optimal move with fewer nodes explored. (2) Define α (for MAX — the best/highest value found so far, wants to increase, starts at −∞) and β (for MIN — the best/lowest, wants to decrease, starts at +∞), and state the pruning condition <strong>α ≥ β</strong>. (3) <strong>Redraw the tree, annotating every internal node with its α and β as you go</strong>, traversing strictly left-to-right depth-first. (4) Mark each pruned branch with a cross and say which node's condition caused it. (5) State the root value and the best move. (6) Conclude that the result is identical to minimax, and that the number of nodes pruned depends on the order children are visited. <em>For the class tree with leaves −4, −9, 9, 6, −17, −4, −11, 7: root = −4, pruning leaf 6 and the whole right-most MAX node.</em></p>
<p><strong>5 marks:</strong> the annotated tree, the root value, and the pruned nodes named.</p>`,
 mistakes:["Updating β at a MAX node or α at a MIN node. <strong>MAX updates α; MIN updates β.</strong>",
 "Testing the pruning condition <em>before</em> evaluating any child. You can only prune after at least one child has returned a value.",
 "Pruning on α &gt; β only. The condition is <strong>α ≥ β</strong> — equality prunes too, as node C₄ in the worked example shows.",
 "Traversing right-to-left. Alpha–beta is order-dependent; unless told otherwise, always go strictly left-to-right.",
 "Claiming alpha–beta gives a different (worse) answer than minimax. It gives the <em>identical</em> decision."],
 practice:[
  {d:"Easy", q:"State the pruning condition and say which value each player updates.",
   s:"<p><strong>Pruning condition:</strong> α ≥ β ⇒ prune the remaining branches at that node.</p><p><strong>α</strong> is for <strong>MAX</strong> — the best (highest) value MAX has found so far; MAX wants α to increase.<br><strong>β</strong> is for <strong>MIN</strong> — the best (lowest) value MIN has found so far; MIN wants β to decrease.</p><p>Initial values at the root: α = −∞, β = +∞.</p>"},
  {d:"Moderate", q:"<strong>CIA-02 Q2 (5 marks).</strong> Perform alpha–beta pruning on the tree with leaves <strong>−16, 8, 0, 12, 13, −6, −15, −2</strong> (root MAX, level 2 MIN, level 3 MAX). Give the root value and list any pruned nodes.",
   s:"<p><strong>C₁ (MAX):</strong> −16 → α = −16; 8 → α = 8. Returns <strong>8</strong>.<br><strong>B₁ (MIN):</strong> β = 8. α = −∞ &lt; 8, continue.<br><strong>C₂ (MAX):</strong> α = −∞, β = 8. Leaf 0 → α = 0 (0 &lt; 8, continue). Leaf 12 → α = 12; now α = 12 ≥ β = 8, but 12 was the <em>last</em> child, so nothing remains to prune. Returns <strong>12</strong>.<br><strong>B₁:</strong> β = min(8, 12) = <strong>8</strong>.</p><p><strong>Root:</strong> α = 8. Descend to B₂ with α = 8, β = +∞.<br><strong>C₃ (MAX):</strong> 13 → α = 13; −6 → no change. Returns <strong>13</strong>.<br><strong>B₂:</strong> β = 13. α = 8 &lt; 13, continue.<br><strong>C₄ (MAX):</strong> α = 8, β = 13. Leaf −15 → value −15; leaf −2 → value −2. Returns <strong>−2</strong>.<br><strong>B₂:</strong> β = min(13, −2) = −2. Now α = 8 ≥ β = −2 → prune — but C₄ was B₂'s last child, so again nothing remains. B₂ returns <strong>−2</strong>.</p><div class='ans'>Root value = max(8, −2) = <strong>8</strong>. MAX plays the left branch. With strict left-to-right ordering <strong>no leaves are actually pruned</strong> in this tree — every cut-off condition is reached at a last child.</div><p><em>This is a legitimate and important answer: state clearly that the cut-off condition arises at C₂ (α = 12 ≥ β = 8) and at B₂ (α = 8 ≥ β = −2), but that in both cases no unexplored siblings remain, so no saving is made. Examiners award marks for the correct α/β trace, not for pruning something that was not there.</em></p>"},
  {d:"Exam-level", q:"Two students perform alpha–beta on the same tree but visit children in opposite orders and prune different numbers of nodes. One concludes alpha–beta is unreliable. Is the student right? Justify.",
   s:"<p><strong>No — the student is wrong about reliability, but right that the number pruned changes.</strong></p><p><strong>What does change:</strong> alpha–beta is order-dependent. How many nodes get pruned depends entirely on the order children are visited. In the best case, examining the best move first, far more of the tree is cut; in the worst case, nothing is pruned at all and it degenerates to plain minimax.</p><p><strong>What does not change:</strong> the <em>decision</em>. Alpha–beta only ever discards branches that provably cannot affect the final minimax value — that is exactly what the α ≥ β test establishes. So both students must arrive at the same root value and the same optimal move.</p><div class='ans'>Alpha–beta = the same correct decision as minimax, with a variable (order-dependent) saving in nodes explored.</div>"}]}
]},

{id:"m3t1", title:"Knowledge-Based Agent", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 3 Knowledge slides 2–3; class notes 24/8",
 tags:["knowledge based agent","tell","ask","inference","sentence","knowledge base"],
 diagram:"kbAgent",
 learn:`<p>A knowledge-based agent includes a <strong>knowledge base</strong> and an <strong>inference system</strong>.</p>
<ul>
<li>A <strong>knowledge base</strong> is a set of representations of facts of the world.</li>
<li>Each individual representation is called a <strong>sentence</strong>.</li>
<li>The sentences are expressed in a <strong>knowledge representation language</strong>.</li>
<li><strong>Inference</strong> is deriving new sentences from old.</li>
</ul>
<h4>How the agent operates</h4>
<ol>
<li>It <strong>TELLs</strong> the knowledge base what it perceives.</li>
<li>It <strong>ASKs</strong> the knowledge base what action it should perform.</li>
<li>It <strong>performs</strong> the chosen action.</li>
</ol>
<div class="note"><span class="note-t">Fundamental property of logical reasoning</span>In each case for which the agent draws a conclusion based on the available information, <strong>that conclusion is guaranteed to be correct if the available information is correct.</strong></div>
<h4>What is a logic?</h4>
<ul><li>A language with <strong>concrete rules</strong> and <strong>no ambiguity</strong> in representation.</li>
<li>Allows unambiguous communication and processing — very unlike natural languages such as English.</li>
<li>There are many ways to translate between languages; a statement can be represented in different logics, and perhaps differently within the same logic.</li>
<li><strong>Expressiveness</strong> of a logic = how much can we say in this language?</li></ul>`,
 understand:`<p>TELL and ASK are the only two operations. Everything in this module — propositional logic, FOL, resolution, chaining — is machinery for implementing <strong>ASK</strong>, i.e. answering "does my knowledge base entail this?"</p>
<p>The guarantee in the highlighted box is what makes logic worth the trouble: unlike a neural network, if your facts are right, your conclusions are <em>provably</em> right.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Explain a knowledge-based agent with a diagram.</strong> A knowledge-based agent consists of a knowledge base (a set of sentences representing facts about the world, written in a knowledge representation language) and an inference engine (which derives new sentences from old). It operates in three steps: TELL the KB what it perceives, ASK the KB what action to perform, then perform that action. Draw the block diagram showing percepts in, KB ↔ inference engine via TELL/ASK, action out. State the fundamental property: conclusions drawn are guaranteed correct if the available information is correct.</p>`,
 mistakes:["Confusing TELL with ASK. TELL adds a percept <em>into</em> the KB; ASK queries it.",
 "Calling each fact a 'rule'. In this terminology each individual representation is a <strong>sentence</strong>.",
 "Omitting the inference engine — a knowledge base alone is just a database."]},

{id:"m3t2", title:"The Wumpus World", type:"theory",
 priority:"high", core:true, marks:[5,10], src:"Chpt 3 Knowledge slides 4–13; class notes 24/8",
 tags:["wumpus","peas","breeze","stench","glitter","environment","propositional"],
 diagram:"wumpus",
 learn:`<p>The agent explores a cave of rooms connected by passageways. Somewhere lurks the <strong>Wumpus</strong>, a beast that eats any agent entering its room. Some rooms contain <strong>bottomless pits</strong>. Occasionally there is a heap of <strong>gold</strong>. The goal is to collect the gold and exit without being eaten. The agent always starts at <strong>[1,1]</strong> and must return there and climb out.</p>
<h4>PEAS specification</h4>
<p><strong>Performance measure:</strong> +1000 for picking up the gold; −1000 for falling into a pit or being eaten by the Wumpus; −1 for each action taken; −10 for using up the arrow. The game ends if the agent dies or comes out of the cave.</p>
<p><strong>Environment:</strong> a 4 × 4 grid of rooms. The agent always starts at [1,1], facing right. The locations of the gold and the Wumpus are chosen randomly with a uniform distribution from the squares other than the start square. Each square other than the start can be a pit, with <strong>probability 0.2</strong>.</p>
<p><strong>Actuators:</strong> Left turn, Right turn, Move forward, Grab, Shoot.</p>
<p><strong>Sensors — five, each giving a single bit:</strong></p>
<ul>
<li><strong>Stench</strong> — in the square containing the Wumpus and in the directly (not diagonally) adjacent squares.</li>
<li><strong>Breeze</strong> — in the squares directly adjacent to a pit.</li>
<li><strong>Glitter</strong> — in the square where the gold is.</li>
<li><strong>Bump</strong> — when the agent walks into a wall.</li>
<li><strong>Scream</strong> — when the Wumpus is killed it emits a woeful scream, perceivable anywhere in the cave.</li>
</ul>
<p>Percepts are given as a list of five symbols, e.g. [Stench, Breeze, None, None, None].</p>
<h4>Properties of the task environment</h4>
<div class="tw"><table><tbody>
<tr><td><strong>Partially observable</strong></td><td>The agent can only perceive the close environment, such as an adjacent room.</td></tr>
<tr><td><strong>Deterministic</strong></td><td>The result and outcome of the world are already known.</td></tr>
<tr><td><strong>Sequential</strong></td><td>The order is important.</td></tr>
<tr><td><strong>Static</strong></td><td>The Wumpus and pits do not move.</td></tr>
<tr><td><strong>Discrete</strong></td><td>The environment is discrete.</td></tr>
<tr><td><strong>Single agent</strong></td><td>There is one agent; the Wumpus is not considered an agent.</td></tr>
</tbody></table></div>
<h4>Atomic proposition variables</h4>
<ul>
<li><strong>P<sub>i,j</sub></strong> — true if there is a Pit in room [i, j]</li>
<li><strong>B<sub>i,j</sub></strong> — true if the agent perceives a Breeze in [i, j]</li>
<li><strong>W<sub>i,j</sub></strong> — true if there is a Wumpus in square [i, j]</li>
<li><strong>S<sub>i,j</sub></strong> — true if the agent perceives a Stench in [i, j]</li>
<li><strong>V<sub>i,j</sub></strong> — true if square [i, j] is Visited</li>
<li><strong>G<sub>i,j</sub></strong> — true if there is Gold (and glitter) in [i, j]</li>
<li><strong>OK<sub>i,j</sub></strong> — true if the room is safe</li>
</ul>`,
 understand:`<p>The Wumpus world exists to demonstrate one thing: <strong>logical inference lets an agent know things it never directly perceived.</strong> The agent never sees a pit — it perceives a breeze in [1,2] and [2,1], and <em>deduces</em> that [2,2] is safe and a pit lies in [1,3] or [3,1].</p>
<p>The key sentence to remember for a resolution question is the breeze rule:</p>
<div class="fx">B<sub>1,1</sub> ⇔ (P<sub>1,2</sub> ∨ P<sub>2,1</sub>)</div>
<p>"There is a breeze in [1,1] <em>if and only if</em> there is a pit in an adjacent square." This is the exact sentence converted to CNF in the CNF topic.</p>`,
 examples:[],
 examAnswer:`<p><strong>10 marks — Describe the Wumpus World environment.</strong> (a) The scenario: cave of rooms, a Wumpus that eats the agent, bottomless pits, gold; the agent starts at [1,1] and must grab the gold and climb out. (b) Full PEAS: performance (+1000 gold, −1000 death, −1 per action, −10 for the arrow), environment (4×4 grid, random gold and Wumpus placement, pit probability 0.2), actuators (turn left, turn right, move forward, grab, shoot), sensors (stench, breeze, glitter, bump, scream — five bits). (c) Environment properties with justification: partially observable, deterministic, sequential, static, discrete, single agent. (d) The atomic propositions P<sub>i,j</sub>, B<sub>i,j</sub>, W<sub>i,j</sub>, S<sub>i,j</sub>, OK<sub>i,j</sub>. (e) <strong>Draw the 4×4 grid</strong> showing the agent at [1,1], pits with adjacent breezes, the Wumpus with adjacent stenches, and the gold with glitter. (f) One worked inference: breezes at [1,2] and [2,1] imply a pit at [1,3] or [3,1] and that [2,2] is OK.</p>`,
 mistakes:["Saying the environment is fully observable. It is <strong>partially</strong> observable — that is the whole point.",
 "Calling the Wumpus a second agent. The slides state explicitly that the Wumpus is not considered an agent, so the environment is single-agent.",
 "Perceiving a stench diagonally. Stench and breeze appear only in <em>directly</em> adjacent squares.",
 "Forgetting the −10 penalty for the arrow or the −1 per action in the performance measure."]},

{id:"m3t3", title:"Propositional Logic", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 3 Knowledge slides 20–21, 23",
 tags:["propositional","boolean","connectives","tautology","contradiction","implication"],
 learn:`<p>Propositional logic is also called <strong>Boolean logic</strong> as it works on 0 and 1. Symbolic variables represent propositions — A, B, C, P, Q, R, etc.</p>
<ul>
<li>Propositions can be either <strong>true or false, but not both</strong>.</li>
<li>Propositional logic consists of <strong>logical connectives</strong>, also called logical operators, which connect two sentences.</li>
<li>A proposition formula which is <strong>always true is a tautology</strong> (also called a valid sentence).</li>
<li>A proposition formula which is <strong>always false is a contradiction</strong>.</li>
<li>Questions, commands and opinions are <strong>not</strong> propositions — "Where is Rohini", "How are you", "What is your name" are not propositions.</li>
</ul>
<h4>The five logical connectives</h4>
<div class="tw"><table><thead><tr><th>Connective</th><th>Symbol</th><th>Name</th><th>Example</th></tr></thead><tbody>
<tr><td>Negation</td><td>¬P</td><td>NOT</td><td>A literal can be positive or negative</td></tr>
<tr><td>Conjunction</td><td>P ∧ Q</td><td>AND</td><td>"Rohan is intelligent and hardworking" → P ∧ Q</td></tr>
