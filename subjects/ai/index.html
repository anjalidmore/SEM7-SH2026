    }
    const s = loStatus(l);
    const qs = impqForLO(l.id);
    html += `<div class="card" style="margin-bottom:.7rem">
      <div class="lo-row-h">
        <span class="badge b-theory" style="font-size:.74rem">${l.id}</span>
        <span class="badge">Verb: ${esc(l.verb)}</span>
        ${l.co!=="—"?`<span class="badge" title="${esc(COS[l.co]||"")}">${l.co}</span>`:""}
        ${s.covered?`<span class="badge ${s.pct===100?"b-ok":""}">${s.done}/${s.real} topics studied</span>`
                   :`<span class="badge b-warn">No material uploaded</span>`}
      </div>
      <p style="font-size:.92rem;font-weight:520;margin:.5rem 0 .6rem;line-height:1.55">${esc(l.text)}</p>
      ${s.covered?bar(s.pct, s.pct===100?"ok":""):""}

      <h4 style="font-size:.72rem;color:var(--muted);margin:.9rem 0 .4rem">Topics that answer it</h4>
      <div class="lo-links">${s.topics.map(t=>`<button class="chip" data-act="go" data-h="#/topic/${t.id}">${statusOf(t.id)==="done"?"✓ ":statusOf(t.id)==="prog"?"◐ ":""}${esc(t.title)}</button>`).join("")}</div>

      ${qs.length?`<h4 style="font-size:.72rem;color:var(--muted);margin:.9rem 0 .4rem">Questions framed to this outcome</h4>
      ${qs.map(q=>`<div class="lo-q">${esc(q.q)}
        <span class="m">${q.marks} marks · ${q.pri} priority · ${q.type}${q.nomat?" · no material uploaded":""}</span></div>`).join("")}
      <button class="btn btn-sm" style="margin-top:.5rem" data-act="go" data-h="#/important">Open in Important Questions →</button>`:""}

      <details style="margin-top:.8rem"><summary>Performance indicators mapped to this outcome</summary><div class="det-body">

        ${l.co!=="—"?`<p style="font-size:.85rem;margin-bottom:0"><code>${l.co}</code> — ${esc(COS[l.co]||"")}</p>`:""}

    html += `<div class="sec-h"><h2>Syllabus content with no outcome</h2>
      <span class="hint">Listed in the module contents, but not named by any learning outcome.</span></div>
      <div class="card"><p style="font-size:.87rem;color:var(--text-2)">These topics are examinable as syllabus content,

      <div class="lo-links">${orphans.map(t=>`<button class="chip" data-act="go" data-h="#/topic/${t.id}">Module ${t.moduleNum} · ${esc(t.title)}</button>`).join("")}</div></div>`;
  }

  html += `<div class="sec-h"><h2>Course outcomes</h2><span class="hint">What the learning outcomes roll up into.</span></div>`;
  Object.keys(COS).forEach(co=>{
    const mapped = LOS.filter(l=>l.co===co);
    html += `<div class="card co-card" style="margin-bottom:.6rem">
      <div class="lo-row-h"><span class="badge b-theory">${co}</span>
        <span class="badge">${mapped.length} outcomes</span></div>
      <p style="font-size:.88rem;margin:.4rem 0 .5rem">${esc(COS[co])}</p>
      <div class="lo-links">${mapped.map(l=>`<span class="chip">${l.id}</span>`).join("")}</div></div>`;
  });
  html += `<p style="font-size:.78rem;color:var(--muted);margin-top:1rem">
    Note: the syllabus maps LO 4.3 into CO3 and LO 4.1–4.2 into CO4. That is reproduced as printed rather than corrected.</p>`;
  return html;
}

      <button class="btn" data-act="importClick">↑ Import progress</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size:.95rem;margin-bottom:.4rem">Appearance</h3>
    <p style="font-size:.87rem;color:var(--text-2)">The site follows your system light/dark setting by default. You can override it here or from the ◐ button in the top bar.</p>
    <div class="btn-row">
      <button class="btn" data-act="theme" data-t="light">Light</button>
      <button class="btn" data-act="theme" data-t="dark">Dark</button>
      <button class="btn" data-act="theme" data-t="system">Follow system</button>
    </div>
  </div>

  <div class="card" style="border-color:var(--danger-border)">
    <h3 style="font-size:.95rem;margin-bottom:.4rem;color:var(--danger)">Reset my progress</h3>
    <p style="font-size:.87rem;color:var(--text-2)">Clears everything you have marked, all quiz scores and all weak-topic data
      <em>in this browser only</em>. Your study material is not affected, and nobody else's progress is affected.</p>
    <button class="btn btn-danger" data-act="resetAsk">Reset my progress…</button>
  </div>

  <div class="card">
    <h3 style="font-size:.95rem;margin-bottom:.4rem">About this site</h3>
    <p style="font-size:.87rem;color:var(--text-2);margin-bottom:.5rem">
      A self-contained study site for <strong>${COURSE.code} ${COURSE.title}</strong>, B.Tech Computer Engineering, Curriculum N-2024.
      All academic content is derived from the official syllabus, the Chapter 1–3 lecture decks, the handwritten class notes,
      and the CIA-01, CIA-02 and extra-problems documents. The End Sem content for Modules 4–6 comes from the Chapter 4 and 5
      lecture decks and the four Chapter 6 student presentations; Russell &amp; Norvig is used only where a slide is blank or a
      topic is only named, and each such answer says so.</p>
    <p style="font-size:.87rem;color:var(--text-2);margin-bottom:0">
      Where the syllabus lists a topic for which no material was provided — Edge AI, quantum AI, AI for the SDGs and cobots —
      the site says so plainly rather than filling the gap with generic textbook content. Those topics are marked
      <span class="badge b-warn">No material uploaded</span> and are listed on the
      <button class="trow-t" style="display:inline;font-size:.87rem;font-weight:600" data-act="go" data-h="#/syllabus">syllabus coverage page</button>.</p>
  </div>`;
}

function doExport(){
  try{
    const data = JSON.stringify(Object.assign({}, P, {exportedAt:new Date().toISOString(), course:COURSE.code}), null, 2);
    const blob = new Blob([data], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `ai-study-progress-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast("Progress exported.");
  }catch(e){ toast("Export failed in this browser."); }
}
function doImport(file){
  const r = new FileReader();
  r.onload = () => {
    let parsed;
    try{ parsed = JSON.parse(r.result); }
    catch(e){ toast("That file is not valid JSON — nothing was changed."); return; }
    const v = validateProgress(parsed);
    if(!v.ok){ toast("That file is not a recognised progress file — nothing was changed."); return; }
    P = v.data; P.isNew = false; saveProgress(); render();
    toast(`Progress imported — you're at ${overallProgress().pct}%.`);
  };
  r.onerror = () => toast("Could not read that file.");
  r.readAsText(file);
}
function askReset(){
  $("#modalHost").innerHTML = `<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mT">
    <div class="modal-box">
      <h3 id="mT">Reset all your study progress?</h3>
      <p>This will clear your locally saved progress on this browser — topics marked, practice, quiz scores,
         weak topics, flashcard and revision tracking. <strong>Your study material will not be deleted</strong>,
         and nobody else's progress is affected. This cannot be undone.</p>
      <div class="btn-row" style="justify-content:flex-end;margin-top:1rem">
        <button class="btn" data-act="modalClose">Cancel</button>
        <button class="btn btn-danger" data-act="resetDo">Yes, reset my progress</button>
      </div></div></div>`;
  const b = $("#modal .btn-danger"); if(b) b.focus();
}
function closeModal(){ $("#modalHost").innerHTML = ""; }
function doReset(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  P = defaultProgress(); P.firstVisit = todayStr(); P.isNew = true;
  saveProgress(); closeModal(); location.hash = "#/"; render();
  toast("Progress reset. You're back at 0%.");
}

/* -------------------------------- SEARCH ----------------------------- */
let INDEX = null;
function buildIndex(){
  if(INDEX) return INDEX;
  INDEX = [];
  allTopics().forEach(t=>{
    const body = [t.learn, t.understand, t.examAnswer,
      (t.examples||[]).map(e=>e.t+" "+e.b).join(" "),
      (t.mistakes||[]).join(" "), t.concept, t.formula, t.whenToUse,
      (t.variables||[]).map(v=>v.v+" "+v.m).join(" "),
      t.worked ? t.worked.problem + " " + t.worked.answer : "",
      (t.practice||[]).map(p=>p.q).join(" "),
      (t.tags||[]).join(" ")].filter(Boolean).join(" ");
    INDEX.push({kind:"Topic", title:t.title, path:`Module ${t.moduleNum} → ${t.moduleTitle} → ${t.type==="numerical"?"Numericals":"Theory"}`,
      href:`#/topic/${t.id}`, hay:(t.title+" "+stripTags(body)).toLowerCase(),
      snip:stripTags(t.learn||t.concept||"").slice(0,150)});
  });
  FORMULAS.forEach(f=>{
    const m = moduleById(f.m);
    INDEX.push({kind:"Formula", title:f.name, path:`Formula sheet → Module ${m?m.num:""}`,
      href:`#/formulas`, hay:(f.name+" "+stripTags(f.fx)+" "+stripTags(f.use)+" "+f.vars.map(v=>v[0]+" "+stripTags(v[1])).join(" ")).toLowerCase(),
      snip:stripTags(f.fx)});
  });
  IMPQ.forEach(q=>{
    const m = moduleById(q.m);
    INDEX.push({kind:"Question", title:q.q, path:`Important questions → Module ${m.num} → ${q.marks} marks · ${q.pri} priority`,
      href:`#/important`, hay:(q.q+" "+q.why).toLowerCase(), snip:q.why.slice(0,140)});
  });
  DECKS.forEach(d=>d.cards.forEach(c=>{
    INDEX.push({kind:"Flashcard", title:stripTags(c.q), path:`Flashcards → ${d.title}`,
      href:`#/deck/${d.id}`, hay:(stripTags(c.q)+" "+stripTags(c.a)).toLowerCase(), snip:stripTags(c.a).slice(0,140)});
  }));
  QUIZZES.forEach(q=>q.questions.forEach(x=>{
    INDEX.push({kind:"Quiz question", title:stripTags(x.q), path:`Quizzes → ${q.title}`,
      href:`#/quiz/${q.id}`, hay:(stripTags(x.q)+" "+stripTags(x.e)).toLowerCase(), snip:stripTags(x.e).slice(0,140)});
  }));
  REVISION.forEach(r=>{
    const m = r.m==="all"?null:moduleById(r.m);
    INDEX.push({kind:"Revision", title:r.title, path:`Quick revision${m?` → Module ${m.num}`:""}`,
      href:`#/revision`, hay:(r.title+" "+stripTags(r.items.join(" "))).toLowerCase(),
      snip:stripTags(r.items[0]||"").slice(0,140)});
  });
  LOS.forEach(l=>{
    const m = moduleById(l.m);
    INDEX.push({kind:"Learning outcome", title:`${l.id} — ${l.text}`,
      path:`Learning outcomes → Module ${m.num} → ${l.co}`, href:`#/outcomes`,
      hay:(l.id+" "+l.text+" "+l.verb+" "+l.pi.join(" ")+" "+(COS[l.co]||"")).toLowerCase(),
      snip:`Verb: ${l.verb} · PI ${l.pi.join(", ")}`});
  });
  COURSE.modules.forEach(m=>{
    INDEX.push({kind:"Module", title:`Module ${m.num}: ${m.title}`, path:`Syllabus → Module ${m.num}`,
      href:`#/module/${m.id}`, hay:(m.title+" "+m.contents+" "+m.objective+" "+m.los.join(" ")).toLowerCase(),
      snip:m.contents.slice(0,150)});
  });
  return INDEX;
}
function runSearch(qs){
  const box = $("#results");
  const q = qs.trim().toLowerCase();
  if(q.length < 2){ box.innerHTML = ""; $("#q").setAttribute("aria-expanded","false"); return; }
  const terms = q.split(/\s+/).filter(Boolean);
  const hits = buildIndex().map(e=>{
    let score = 0;
    for(const t of terms){
      if(!e.hay.includes(t)) return null;
      score += e.title.toLowerCase().includes(t) ? 12 : 1;
    }
    if(e.kind === "Topic") score += 4;
    if(e.kind === "Formula") score += 2;
    return {e, score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,12);

  $("#q").setAttribute("aria-expanded","true");
  if(!hits.length){ box.innerHTML = `<div class="res-none">No results for “${esc(qs)}”.</div>`; return; }
  box.innerHTML = hits.map(h=>`<button class="res" role="option" data-act="res" data-h="${h.e.href}">
    <div class="res-t">${esc(h.e.title.length>78?h.e.title.slice(0,78)+"…":h.e.title)}</div>
    <div class="res-p">${esc(h.e.kind)} · ${esc(h.e.path)}</div>
    ${h.e.snip?`<div class="res-s">${esc(h.e.snip)}</div>`:""}</button>`).join("");
}
function closeSearch(){ $("#results").innerHTML = ""; $("#q").setAttribute("aria-expanded","false"); }

function notFound(){
  return `<div class="empty"><span class="big">?</span>That page doesn't exist.
    <div class="btn-row" style="justify-content:center;margin-top:1rem">
      <button class="btn btn-primary" data-act="go" data-h="#/">Go to dashboard</button></div></div>`;
}

/* ------------------------------- ROUTER ------------------------------ */
const NAV = [
  {h:"#/",           label:"Dashboard",           ic:"◧", group:"Study"},
  {h:"#/numericals", label:"Numericals",          ic:"∑",  group:"Study"},
  {h:"#/outcomes",   label:"Learning outcomes",   ic:"◈",  group:"Exam"},
  {h:"#/important",  label:"Important questions", ic:"★",  group:"Exam"},
  {h:"#/quizzes",    label:"Quizzes",             ic:"◎",  group:"Exam"},
  {h:"#/flashcards", label:"Flashcards",          ic:"▤",  group:"Exam"},
  {h:"#/revision",   label:"Quick revision",      ic:"⚡", group:"Exam"},
  {h:"#/formulas",   label:"Formula sheet",       ic:"ƒ",  group:"Reference"},
  {h:"#/weak",       label:"Weak topics",         ic:"⚠",  group:"Reference"},
  {h:"#/syllabus",   label:"Syllabus coverage",   ic:"☰",  group:"Reference"},
  {h:"#/settings",   label:"Settings",            ic:"⚙",  group:"Reference"}
];
const TAB_LABEL = {"#/outcomes":"Outcomes", "#/important":"Important questions", "#/revision":"Revision",
  "#/formulas":"Formulas", "#/syllabus":"Syllabus", "#/weak":"Weak topics"};
const TAB_ORDER = ["#/numericals","#/quizzes","#/flashcards","#/formulas","#/revision","#/important","#/outcomes","#/weak","#/syllabus"];
function renderNav(cur){
  const tab = (h, label, on) => `<a href="${h}"${on?' aria-current="page"':""}>${label}</a>`;
  let html = tab("#/", "Dashboard", cur==="#/");
  COURSE.modules.forEach(m=>{ html += tab(`#/module/${m.id}`, `Module ${m.num}`, cur===`#/module/${m.id}`); });
  TAB_ORDER.forEach(h=>{
    const n = NAV.find(x=>x.h===h); if(!n) return;
    const on = cur === h || (h==="#/quizzes" && cur.startsWith("#/quiz/")) || (h==="#/flashcards" && cur.startsWith("#/deck/"));
    html += tab(h, TAB_LABEL[h] || n.label, on);
  });
  $("#nav").innerHTML = html;
  $("#settingsBtn").classList.toggle("on", cur==="#/settings");
}

function render(){
  const hash = location.hash || "#/";
  const [, seg, arg] = hash.split("/");
  let html;
  switch(seg){
    case "":            html = viewDashboard(); break;
    case "module":      html = viewModule(arg); break;
    case "topic":       html = viewTopic(arg); break;
    case "numericals":  html = viewNumericals(); break;
    case "quizzes":     html = viewQuizzes(); break;
    case "quiz":        html = viewQuiz(arg); break;
    case "flashcards":  html = viewDecks(); break;
    case "deck":        html = viewDeck(arg); break;
    case "formulas":    html = viewFormulas(); break;
    case "important":   html = viewImportant(); break;
    case "revision":    html = viewRevision(); break;
    case "weak":        html = viewWeak(); break;
    case "outcomes":    html = viewOutcomes(); break;
    case "syllabus":    html = viewSyllabus(); break;
    case "settings":    html = viewSettings(); break;
    default:            html = notFound();
  }
  $("#main").innerHTML = html;
  const tp = seg==="topic" && topicById(arg);
  renderNav(tp ? `#/module/${tp.moduleId}` : hash.split("/").slice(0,seg==="module"?3:2).join("/") || "#/");
}

/* ------------------------------- EVENTS ------------------------------ */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");

  /* Close the search dropdown when clicking elsewhere */
  if(!e.target.closest(".searchbox")) closeSearch();

  if(!el) return;
  const act = el.dataset.act;

  switch(act){
    case "go":
      e.preventDefault(); studyStep = "learn"; location.hash = el.dataset.h;
      window.scrollTo({top:0, behavior:"instant"}); break;

    case "gostep":
      e.preventDefault(); studyStep = el.dataset.step; location.hash = el.dataset.h;
      window.scrollTo({top:0, behavior:"instant"}); render(); break;

    case "res":
      e.preventDefault(); hideSearch(); $("#q").value = ""; studyStep = "learn";
      location.hash = el.dataset.h; window.scrollTo({top:0, behavior:"instant"}); break;

    case "status": setStatus(el.dataset.id, el.dataset.s); break;

    case "sub":
      modSub[el.dataset.m] = el.dataset.s;
      if(el.dataset.goMod){ location.hash = `#/module/${el.dataset.m}`; window.scrollTo({top:0, behavior:"instant"}); }
      else render();
      break;

    case "step":
      studyStep = el.dataset.s;
      $$(".steps button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.s===studyStep)));
      $("#stepBody").innerHTML = renderStep(topicById(location.hash.split("/")[2]), studyStep);
      break;

    case "practice": {
      const id = el.dataset.id;
      if(P.practice[id]) delete P.practice[id]; else { P.practice[id] = true; P.lastStudied = id; }
      saveProgress(); render(); toast(P.practice[id]?"Practice marked complete.":"Practice unmarked."); break;
    }

    case "rev": {
      const id = el.dataset.id;
      if(P.revision[id]) delete P.revision[id]; else P.revision[id] = true;
      saveProgress(); render(); break;
    }

    case "deckdone": {
      const id = el.dataset.id;
      if(P.flashcards[id]) delete P.flashcards[id]; else P.flashcards[id] = true;
      saveProgress(); render(); break;
    }

    /* ---- quiz ---- */
    case "opt": {
      const i = QS.i, q = QS.quiz.questions[i], oi = Number(el.dataset.i);
      if(QS.checked[i]) break;
      if(q.type === "multi"){
        const cur = Array.isArray(QS.answers[i]) ? QS.answers[i] : [];
        QS.answers[i] = cur.includes(oi) ? cur.filter(x=>x!==oi) : cur.concat(oi);
      } else QS.answers[i] = oi;
      render(); break;
    }
    case "qcheck": {
      const i = QS.i, q = QS.quiz.questions[i];
      if(q.type === "num"){
        const v = $("#numIn").value;
        if(v === ""){ toast("Enter an answer first."); break; }
        QS.answers[i] = Number(v);
      } else if(QS.answers[i] === null || (Array.isArray(QS.answers[i]) && !QS.answers[i].length)){
        toast("Select an answer first."); break;
      }
      QS.checked[i] = true; render(); break;
    }
    case "qnext": QS.i++; render(); window.scrollTo({top:0,behavior:"instant"}); break;
    case "qprev": QS.i--; render(); window.scrollTo({top:0,behavior:"instant"}); break;
    case "qfinish": finishQuiz(); window.scrollTo({top:0,behavior:"instant"}); break;
    case "qretake": startQuiz(el.dataset.id); render(); window.scrollTo({top:0,behavior:"instant"}); break;

    /* ---- flashcards ---- */
    case "flip": FC.flipped = !FC.flipped; render(); break;
    case "fcnext": FC.i++; FC.flipped = false; render(); break;
    case "fcprev": FC.i--; FC.flipped = false; render(); break;
    case "fcshuffle": {
      for(let i=FC.order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [FC.order[i],FC.order[j]]=[FC.order[j],FC.order[i]]; }
      FC.i = 0; FC.flipped = false; render(); toast("Shuffled."); break;
    }

    /* ---- settings ---- */
    case "export": doExport(); break;
    case "importClick": $("#importFile").click(); break;
    case "resetAsk": askReset(); break;
    case "resetDo": doReset(); break;
    case "modalClose": closeModal(); break;
    case "theme": setTheme(el.dataset.t); break;
  }
});

/* Filter dropdowns */
document.addEventListener("change", e=>{
  const el = e.target.closest("[data-act]");
  if(el && el.dataset.act === "numfilter"){ numFilter[el.dataset.k] = el.value; render(); }
  if(el && el.dataset.act === "iqfilter"){ iqFilter[el.dataset.k] = el.value; render(); }
  if(el && el.dataset.act === "fxfilter"){ fxFilter = el.value; render(); }
  if(el && el.dataset.act === "lofilter"){ loFilter = el.value; render(); }
  if(e.target.id === "importFile" && e.target.files && e.target.files[0]){
    doImport(e.target.files[0]); e.target.value = "";
  }
});

/* Keyboard: flashcard flip/navigation, search shortcuts */
document.addEventListener("keydown", e=>{
  if(e.target.matches("input, textarea, select")){
    if(e.key === "Escape"){ e.target.blur(); closeSearch(); }
    return;
  }
  const onCard = e.target.closest('[data-act="flip"]');
  if(onCard && (e.key === " " || e.key === "Enter")){ e.preventDefault(); FC.flipped = !FC.flipped; render(); return; }
  if(location.hash.startsWith("#/deck/")){
    if(e.key === "ArrowRight" && FC.i < DECKS.find(d=>d.id===FC.deck).cards.length-1){ FC.i++; FC.flipped=false; render(); }
    if(e.key === "ArrowLeft" && FC.i > 0){ FC.i--; FC.flipped=false; render(); }
    if(e.key === " "){ e.preventDefault(); FC.flipped = !FC.flipped; render(); }
  }
  if(e.key === "/" ){ e.preventDefault(); openSearch(); }
  if(e.key === "Escape") closeModal();
});

$("#q").addEventListener("input", e => runSearch(e.target.value));
$("#q").addEventListener("focus", e => { if(e.target.value.trim().length>1) runSearch(e.target.value); });

/* Search row under the bar */
function openSearch(){ $("#searchRow").hidden = false; $("#searchBtn").setAttribute("aria-expanded","true"); $("#searchBtn").classList.add("on"); $("#q").focus(); }
function hideSearch(){ closeSearch(); $("#searchRow").hidden = true; $("#searchBtn").setAttribute("aria-expanded","false"); $("#searchBtn").classList.remove("on"); }
$("#searchBtn").addEventListener("click", e=>{ e.stopPropagation(); if($("#searchRow").hidden) openSearch(); else hideSearch(); });
$("#nav").addEventListener("click", e=>{
  if(e.target.closest("a")){ studyStep = "learn"; window.scrollTo({top:0,behavior:"instant"}); }
});

/* ------------------------------- THEME ------------------------------- */
function setTheme(t){
  try{
    if(t === "system"){ localStorage.removeItem(THEME_KEY); document.documentElement.removeAttribute("data-theme"); }
    else { localStorage.setItem(THEME_KEY, t); document.documentElement.setAttribute("data-theme", t); }
  }catch(e){
    if(t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }
  toast(t === "system" ? "Following your system theme." : `${t[0].toUpperCase()+t.slice(1)} theme.`);
}
function initTheme(){
  let t = null;
  try{ t = localStorage.getItem(THEME_KEY); }catch(e){}
  if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
}
$("#themeBtn").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  setTheme(isDark ? "light" : "dark");
});

/* -------------------------------- BOOT ------------------------------- */
window.addEventListener("hashchange", ()=>{ closeSearch(); render(); });
initTheme();
loadProgress();
touchVisit();
if(!location.hash) location.hash = "#/";
render();
