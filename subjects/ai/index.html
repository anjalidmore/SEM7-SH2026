{id:"m5t1", title:"What is Generative AI?", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chapter5 slides 1–8; part 2 slides 3–9, 11–13",
 tags:["generative"],
 learn:`<div class="note"><span class="note-t">Exam question</span>What is Generative AI? Place it in the progression from AI to ML, deep learning and Transformers, and list what it can generate.</div>
<div class="dia"><svg viewBox="0 0 800 90" role="img" aria-label="From AI to Generative AI"><defs><marker id="arw_ai_ladder" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M133 45 L172 45" class="de " marker-end="url(#arw_ai_ladder)"/><path d="M298 45 L337 45" class="de " marker-end="url(#arw_ai_ladder)"/><path d="M463 45 L502 45" class="de " marker-end="url(#arw_ai_ladder)"/><path d="M628 45 L667 45" class="de " marker-end="url(#arw_ai_ladder)"/><rect x="7" y="27" width="126" height="36" rx="7" class="dn "/><text x="70" y="45" class="dnt">AI</text><rect x="172" y="24" width="126" height="42" rx="7" class="dn "/><text x="235" y="37.5" class="dnt">Machine</text><text x="235" y="52.5" class="dnt sub">Learning</text><rect x="337" y="24" width="126" height="42" rx="7" class="dn "/><text x="400" y="37.5" class="dnt">Deep</text><text x="400" y="52.5" class="dnt sub">Learning</text><rect x="502" y="27" width="126" height="36" rx="7" class="dn "/><text x="565" y="45" class="dnt">Transformers</text><rect x="667" y="27" width="126" height="36" rx="7" class="dn acc"/><text x="730" y="45" class="dnt">Generative AI</text></svg><div class="dia-cap">A learning progression, not a strict Venn diagram — GANs, VAEs and diffusion models are generative too · Chapter5 slide 2</div></div>
<div class="scroll"><table class="t"><thead><tr><th>Level</th><th>What it does</th><th>Example</th></tr></thead><tbody>
<tr><td><b>AI</b></td><td>Machines perform intelligent tasks — the broad field. Intelligent agents <b>reason</b>, <b>learn</b> and <b>act autonomously</b>.</td><td>Chess system</td></tr>
<tr><td><b>ML</b></td><td>A subfield of AI: learn patterns from data without explicit programming</td><td>Spam detection</td></tr>
<tr><td><b>Deep learning</b></td><td>A family of ML methods using neural networks with many hidden layers to learn complex representations</td><td>Image recognition</td></tr>
<tr><td><b>Transformers</b></td><td>Learn contextual relationships using attention</td><td>GPT</td></tr>
<tr><td><b>Generative AI</b></td><td>Generate new content from learned patterns</td><td>ChatGPT, image generation</td></tr></tbody></table></div>
<p><b>Remember:</b> ML sits inside AI — all ML is AI, but not all AI is ML. And: <i>traditional AI often decides; generative AI creates.</i></p>
<h4>Definition</h4>
<p><b>Generative AI refers to AI models that learn patterns and structure from training data and use them to generate new content.</b> It can respond to a text prompt, image, audio, code or other conditions, and generate content that is:</p>
<ul class="list"><li><b>new</b></li><li><b>statistically consistent with learned patterns</b></li><li><b>conditioned by the user's input/context</b></li></ul>
<p>The process of learning from existing content is called <b>training</b> and results in a <b>statistical model</b>. Given a prompt, GenAI uses this model to predict what an expected response might be — and this generates new content.</p>
<h4>What it can generate — "GenAI is not just ChatGPT"</h4>
<div class="scroll"><table class="t"><tbody>
<tr><td><b>Text</b></td><td>Stories, emails, summaries, reports, Q&amp;A</td></tr>
<tr><td><b>Images</b></td><td>Art, designs, product images, illustrations</td></tr>
<tr><td><b>Code</b></td><td>Functions, SQL, HTML, tests, documentation</td></tr>
<tr><td><b>Audio</b></td><td>Speech, music, sound effects</td></tr>
<tr><td><b>Video</b></td><td>Animations, scenes, synthetic video</td></tr>
<tr><td><b>3D / design</b></td><td>Objects, scenes, molecules/structures</td></tr>
<tr><td><b>Synthetic data</b></td><td>Images, tabular records, training examples, simulations</td></tr></tbody></table></div>
<p>What determines the output: <b>model architecture + training data + objective + modality.</b></p>`,
 understand:`<p>The three bullets in the definition are the test for 'is this GenAI?': is the output new, is it statistically like the training data, and is it shaped by the user's input? A classifier fails the first bullet — its output is a label from a fixed set.</p>`,
 examples:[],
 examAnswer:`<p>The progression table (or the ladder drawn), the definition with its three bullets verbatim, then the modality list. 'Traditional AI often decides; generative AI creates' is a good closing line.</p>`,
 mistakes:[`Treating AI, ML, generative AI and LLM as synonyms — the deck's speaker notes single this out. An LLM is one kind of generative model; generative AI is one use of deep learning.`]},

{id:"m5t4", title:"Discriminative vs Generative Models", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chapter5 slides 4–6; part 2 slides 8–9, 11",
 tags:["discriminative","generative","models"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Compare discriminative (predictive) and generative models. Classify the following as generative or not: spam classifier, ChatGPT writing a story, AI summarising an article, fraud detector, synthetic patient records, Google Maps suggesting a new route.</div>
<div class="scroll"><table class="t"><thead><tr><th></th><th>Discriminative / predictive</th><th>Generative</th></tr></thead><tbody>
<tr><td>Learns</td><td>The relationship between data and labels — to distinguish classes or predict a target</td><td>The patterns (distribution) in unstructured content</td></tr>
<tr><td>Flow</td><td>input → classify / predict → output</td><td>prompt → generate new content</td></tr>
<tr><td>Output</td><td>A number, a discrete class or a probability</td><td>Natural language, image, audio, code, video</td></tr>
<tr><td>Question it answers</td><td>"Which category does this belong to?"</td><td>"Can I create new content?"</td></tr>
<tr><td>Example</td><td>Email → Spam / Not spam</td><td>"Invite students to an AI workshop" → a new email</td></tr></tbody></table></div>
<p>Before GenAI, ML systems mostly <b>predicted, classified or estimated</b> from existing data: email → spam, X-ray → disease, transaction → fraud, student data → placed, photo → cat/dog.</p>
<h4>Classification</h4>
<div class="scroll"><table class="t"><thead><tr><th>System</th><th>Generative?</th><th>Why</th></tr></thead><tbody>
<tr><td>Spam classifier</td><td>❌</td><td>Outputs one of two labels</td></tr>
<tr><td>ChatGPT writes a story</td><td>✅</td><td>New text, conditioned on the prompt</td></tr>
<tr><td>AI summarises an article</td><td>✅</td><td>Writes new sentences — the summary is generated text, not a label</td></tr>
<tr><td>Fraud detector</td><td>❌</td><td>Outputs fraud / genuine</td></tr>
<tr><td>Synthetic patient records</td><td>✅</td><td>New data statistically consistent with real records</td></tr>
<tr><td>Google Maps new route</td><td>❌ (discussion)</td><td>See below</td></tr></tbody></table></div>
<p><b>Google Maps.</b> The slide asks this as an open question and does not answer it. A defensible answer: route-finding is <b>search and optimisation</b> (Module 2) over a road graph. The route is <i>selected</i> from paths that already exist in the graph by minimising a cost, not <i>generated</i> as new content statistically consistent with training data. So it is not generative AI — even though the route is "new" to you.</p>`,
 understand:`<p>Ask what the output space is. If the answer is 'one of a fixed set of labels or a number', it is discriminative. If it is 'any sentence / any image', it is generative.</p>`,
 examples:[],
 examAnswer:`<p>The comparison table first (five rows), then the classification table with a one-phrase reason for each item. A reason earns the mark, a tick alone does not.</p>`,
 mistakes:[`Marking summarisation as not generative because 'it only uses the article'. It still writes new text conditioned on an input — that is exactly the generative definition.`]},

{id:"m5t5", title:"Families of Generative Models", type:"theory",
 priority:"medium", core:false, marks:[5], src:"Chapter5 slides 9–12; part 2 slides 14–16",
 tags:["families","generative","models"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Describe the major families of generative models and explain, at a high level, how generative language models and generative image models produce content.</div>
<div class="scroll"><table class="t"><thead><tr><th>Model family</th><th>How it works</th><th>Applications</th></tr></thead><tbody>
<tr><td><b>Autoregressive models</b></td><td>Generate content step by step, predicting the next token or element</td><td>Text, code, speech</td></tr>
<tr><td><b>GANs</b> (Generative Adversarial Networks)</td><td>Two networks compete: a <b>Generator</b> creates, a <b>Discriminator</b> evaluates</td><td>Image generation, synthetic data</td></tr>
<tr><td><b>VAEs</b> (Variational Autoencoders)</td><td>Learn a compressed, probabilistic representation and generate new samples from it</td><td>Image generation, data synthesis</td></tr>
<tr><td><b>Diffusion models</b></td><td>Learn to generate content by progressively removing noise</td><td>Images, video</td></tr>
<tr><td><b>Transformers</b></td><td>Use attention to learn relationships between tokens</td><td>ChatGPT, LLMs, multimodal AI</td></tr></tbody></table></div>
<h4>Generative language models</h4>
<p>They learn patterns in language through training data; then, given some text, they <b>predict what comes next</b> — one token at a time:</p>
<div class="flow">previous tokens → next-token probabilities → select / sample → append token → repeat</div>
<p>Prompt: "Artificial Intelligence is transforming…" — the model scores every possible next token, picks one, appends it, and repeats.</p>
<h4>Generative image models</h4>
<p>They produce new images using techniques like <b>diffusion</b>: given a prompt or related imagery, they <b>transform random noise into images</b> or generate images from prompts.</p>
<div class="flow">text prompt → text representation → generation process → new image</div>
<p>"A futuristic smart city in Mumbai during monsoon" → a new image. Modern text-to-image systems commonly use diffusion-based approaches.</p>`,
 understand:`<p>Every family solves the same problem — sample something new that looks like the training data — with a different trick: predict one piece at a time (autoregressive), fool a critic (GAN), decode from a compressed code (VAE), or denoise (diffusion).</p>`,
 examples:[],
 examAnswer:`<p>The five-row table is the answer for 5 marks. If asked only about text vs image, give the two flows.</p>`,
 mistakes:[`Describing a GAN as one network. Name both networks and their roles: Generator creates, Discriminator evaluates.`]},

{id:"m5t6", title:"Attention and the Transformer", type:"theory",
 priority:"high", core:true, marks:[10], src:"Chapter5 slides 13–22; part 2 slides 18, 20–22, 26",
 tags:["attention","transformer"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Explain the attention mechanism and the Transformer. Why was sequence modelling difficult before Transformers, and how does a Transformer generate the next token?</div>
<h4>The language problem</h4>
<p>"I deposited money in the <b>bank</b>." · "We sat on the <b>bank</b> of the river." Same word, different meaning because of context. How can a model determine which other words matter for understanding each word? Sentence 1: <i>deposited → money → bank</i> (transaction context). Sentence 2: <i>sat → river → bank</i> (nature context).</p>
<h4>Before Transformers</h4>
<p>Sequence modelling relied heavily on <b>RNN → LSTM / GRU</b>, with three challenges:</p>
<ul class="list"><li><b>Sequential computation</b> — word by word.</li><li><b>Difficulty parallelising</b> across sequence positions.</li><li><b>Difficulty learning long-range dependencies.</b></li></ul>
<h4>The breakthrough — "Attention Is All You Need" (Vaswani et al., 2017)</h4>
<p>The paper introduced the <b>Transformer</b>, built around attention mechanisms, dispensing with recurrence and convolutions in the core architecture, while allowing substantially more parallelisation.</p>
<h4>Attention</h4>
<p><b>Attention allows a model to assign different importance to different tokens when constructing a contextual representation.</b> In "The animal didn't cross the road because <b>it</b> was tired", processing <i>it</i> should attend strongly to <i>animal</i>.</p>
<p><b>Self-attention</b> asks: which tokens are relevant, and by how much? For "sat" in "The cat sat on the mat", self-attention collects information from "The" and "cat". <b>Same word + different context → different representation.</b></p>
<h4>From words to the next token</h4>
<div class="dia"><svg viewBox="0 0 700 215" role="img" aria-label="How a Transformer generates the next token"><defs><marker id="arw_tf_pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M160 45 L185 45" class="de " marker-end="url(#arw_tf_pipeline)"/><path d="M335 45 L360 45" class="de " marker-end="url(#arw_tf_pipeline)"/><path d="M510 45 L535 45" class="de " marker-end="url(#arw_tf_pipeline)"/><path d="M610 66 L610 144" class="de " marker-end="url(#arw_tf_pipeline)"/><path d="M535 165 L510 165" class="de " marker-end="url(#arw_tf_pipeline)"/><path d="M360 165 L335 165" class="de " marker-end="url(#arw_tf_pipeline)"/><path d="M185 168.37777195109942 Q127.2577315558778 170.9783081476782 91.0378582566305 63" class="de dash" marker-end="url(#arw_tf_pipeline)"/><rect x="10" y="27" width="150" height="36" rx="7" class="dn "/><text x="85" y="45" class="dnt">Input text</text><rect x="185" y="27" width="150" height="36" rx="7" class="dn "/><text x="260" y="45" class="dnt">Tokenization</text><rect x="360" y="24" width="150" height="42" rx="7" class="dn "/><text x="435" y="37.5" class="dnt">Embeddings +</text><text x="435" y="52.5" class="dnt sub">position</text><rect x="535" y="24" width="150" height="42" rx="7" class="dn acc"/><text x="610" y="37.5" class="dnt">Transformer blocks</text><text x="610" y="52.5" class="dnt sub">self-attention + MLP</text><rect x="535" y="144" width="150" height="42" rx="7" class="dn "/><text x="610" y="157.5" class="dnt">Output</text><text x="610" y="172.5" class="dnt sub">representation</text><rect x="360" y="144" width="150" height="42" rx="7" class="dn "/><text x="435" y="157.5" class="dnt">Next-token</text><text x="435" y="172.5" class="dnt sub">probabilities</text><rect x="185" y="147" width="150" height="36" rx="7" class="dn good"/><text x="260" y="165" class="dnt">Generated token</text><rect x="81.13833034209654" y="134.33359706161394" width="103" height="18" rx="4" class="delb"/><text x="132.63833034209654" y="143.33359706161394" class="del">append · repeat</text></svg><div class="dia-cap">Prompt → tokens → embeddings → attention → blocks → probabilities → next token · Chapter5 slides 18, 20</div></div>
<ol class="list"><li><b>Tokenization</b> — text is split into tokens (words, subwords or pieces) mapped to numbers.</li>
<li><b>Embeddings + position information</b> — vectors that capture meaning; similar meanings tend to occupy related regions in representation space.</li>
<li><b>Transformer blocks</b> — self-attention (each token uses information from relevant tokens) followed by an MLP, repeated N times.</li>
<li><b>Output representation → next-token probabilities</b>.</li>
<li><b>Generated token</b> — appended to the input, and the whole loop repeats. <b>Temperature</b> controls how adventurous the sampling is.</li></ol>
<h4>Encoder–decoder vs decoder-only</h4>
<p>The original Transformer has an <b>encoder</b> (multi-head attention, feed-forward, add &amp; norm) and a <b>decoder</b> (masked multi-head attention, encoder–decoder attention, feed-forward), followed by linear and softmax layers that give output probabilities. GPT-style models use the <b>decoder only</b>: each position attends only to previous positions (<b>causal masking</b>), and the model generates autoregressively.</p>
<div class="note warn"><b>Two slide inconsistencies.</b> (1) In the Transformer architecture figure (Chapter5 slide 21), the encoder's bottom box is labelled "Output Embedding". In the original paper it is the <b>Input</b> Embedding; only the decoder takes the (shifted-right) outputs. (2) Part-2 slides 21–22 draw a "Generative Pre-Trained Transformer" with an encoding <i>and</i> a decoding component. The same deck's slide 23 and its "Decoder-only: GPT, Llama, Claude" figure state that GPT is <b>decoder-based</b>. The encoder–decoder picture describes the original Transformer; GPT itself is decoder-only.</div>`,
 understand:`<p>Attention is a weighted average. For each token the model computes how relevant every other token is, then mixes their representations in those proportions. 'bank' near 'river' ends up with a riverbank-flavoured vector.</p>`,
 examples:[],
 examAnswer:`<p>The bank example to motivate, three RNN limitations, the 2017 paper in one line, a definition of attention and self-attention, then the pipeline drawn as boxes. For 10 marks add encoder–decoder vs decoder-only.</p>
<div class="note"><span class="note-t">Diagram</span>Draw the pipeline vertically: Input text → Tokens → Embeddings + position → [Self-attention + MLP] × N → Probabilities → Next token, with an arrow looping back labelled 'append, repeat'.</div>`,
 mistakes:[`Saying Transformers 'read word by word like an RNN'. All positions are processed in parallel; only generation is one token at a time.`]},

{id:"m5t7", title:"Large Language Models: BERT, GPT and ChatGPT", type:"theory",
 priority:"high", core:true, marks:[10], src:"part 2 slides 18–26 (with speaker notes)",
 tags:["large","language","models","bert","gpt","chatgpt"],
 learn:`<div class="note"><span class="note-t">Exam question</span>What is a Large Language Model? Trace the evolution to ChatGPT, and compare BERT, GPT and ChatGPT. Which would you use to classify the sentiment of 1,000 workshop feedback comments, and which to summarise them?</div>
<h4>What an LLM is</h4>
<p>An LLM learns <b>statistical patterns in language</b>:</p>
<ol class="list"><li><b>Text</b> — huge collections of text are used in training.</li><li><b>Tokens</b> — text is split into words, subwords or pieces.</li>
<li><b>Context</b> — the model uses surrounding tokens to predict what comes next.</li><li><b>Generate</b> — it repeatedly predicts tokens to produce a response.</li></ol>
<p>Simple mental model: <i>given the context so far, which token is most appropriate next?</i> ("The capital of France is ___.") This is a simplification — the model has learned complex representations; it is not a lookup table.</p>
<p>Transformers powering GenAI are <b>pre-trained</b> on large amounts of data with billions of parameters, giving a <b>Generative Pre-trained Transformer (GPT)</b> model.</p>
<h4>How we reached ChatGPT</h4>
<div class="flow">Rules → Statistical NLP → RNN / LSTM → Attention → Transformer → BERT / GPT → ChatGPT
(grammar)  (probabilities)  (sequences)  (relevant words)  (parallel + scale)  (pretrained)  (instruction-following dialogue)</div>
<p>The breakthrough was not "just bigger data": the Transformer made large-scale language modelling practical.</p>
<h4>BERT vs GPT vs ChatGPT</h4>
<div class="scroll"><table class="t"><thead><tr><th></th><th>BERT</th><th>GPT</th><th>ChatGPT</th></tr></thead><tbody>
<tr><td>What it is</td><td>Encoder-based Transformer</td><td>Decoder-based, autoregressive Transformer</td><td>A conversational <b>product</b>, not a new architecture</td></tr>
<tr><td>How it reads</td><td>Bidirectional contextual representation</td><td>Predicts the next token from previous tokens</td><td>GPT-family models + instruction tuning, alignment and product systems</td></tr>
<tr><td>Strong for</td><td>Understanding and classification — sentiment, NER, extractive QA</td><td>Generation; scales effectively with data and model size</td><td>Interactive assistance</td></tr>
<tr><td>Memory trick</td><td>understand context</td><td>generate continuation</td><td>interact with a user</td></tr></tbody></table></div>
<p>BERT and GPT share the Transformer family but use different parts and objectives.</p>
<h4>The feedback case</h4>
<ul class="list"><li><b>BERT</b> — classify the sentiment of each comment ("The speaker explained everything clearly" → positive). Bidirectional reading of a short text with a fixed label set is exactly its strength.</li>
<li><b>ChatGPT</b> — summarise all 1,000 comments, identify common complaints, suggest improvements. That needs generation.</li></ul>
<p>Mixed comments ("The lab was confusing, but the lecture was excellent") are why the class poll offered a <i>Mixed</i> option: a bidirectional model sees both clauses before deciding.</p>`,
 understand:`<p>Encoder = reads the whole sentence at once, both directions — good for understanding. Decoder = writes left to right — good for generating. ChatGPT is a decoder model wrapped in instruction tuning and a chat product.</p>`,
 examples:[],
 examAnswer:`<p>Four-step LLM definition, the evolution flow, the BERT/GPT/ChatGPT table, then the use-case answer with one reason each. Saying 'ChatGPT is a product, not an architecture' earns a mark by itself.</p>`,
 mistakes:[`Calling ChatGPT an architecture, or calling BERT generative. BERT is typically used for understanding tasks; for this course, focus on its encoder use.`]},

{id:"m5t8", title:"AI Hallucinations and Retrieval-Augmented Generation", type:"theory",
 priority:"high", core:true, marks:[5], src:"part 2 slides 27–28 (speaker notes cite NIST)",
 tags:["hallucinations","retrieval-augmented","generation"],
 learn:`<div class="note"><span class="note-t">Exam question</span>What are AI hallucinations? Why do they happen, and how can they be reduced? Explain RAG.</div>
<p><b>Hallucinations</b> (also called <b>confabulations</b>) are words or phrases generated by the model that are nonsensical, unsupported or factually wrong — often with great confidence. <i>A fluent answer can still be false.</i></p>
<div class="scroll"><table class="t"><thead><tr><th>What it looks like</th><th>Why it happens</th></tr></thead><tbody>
<tr><td>Invented facts · fake references and citations · wrong dates · made-up quotations · plausible but incorrect explanations</td>
<td>Not enough training data · noisy or dirty training data · not enough context in the prompt · not enough constraints on the output · <b>optimised for likely text, not truth</b></td></tr></tbody></table></div>
<p>The model is not deliberately lying; it generates unsupported content with high fluency. <b>Fluency is not truth:</b> the more important the claim, the stronger the verification should be.</p>
<h4>Reducing hallucinations — trust must be engineered, not assumed</h4>
<ul class="list"><li><b>Ground</b> — give the model trusted source material or retrieval context.</li>
<li><b>Verify</b> — check facts, citations, calculations and dates.</li>
<li><b>Constrain</b> — structured prompts, schemas and allowed sources.</li>
<li><b>Human-in-the-loop</b> — require human review for high-impact decisions.</li></ul>
<h4>RAG — Retrieval-Augmented Generation</h4>
<div class="dia"><svg viewBox="0 0 720 90" role="img" aria-label="Retrieval-Augmented Generation"><defs><marker id="arw_rag_simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M150 45 L195 45" class="de " marker-end="url(#arw_rag_simple)"/><path d="M335 45 L385 45" class="de " marker-end="url(#arw_rag_simple)"/><path d="M525 45 L570 45" class="de " marker-end="url(#arw_rag_simple)"/><rect x="10" y="27" width="140" height="36" rx="7" class="dn "/><text x="80" y="45" class="dnt">Question</text><rect x="195" y="24" width="140" height="42" rx="7" class="dn "/><text x="265" y="37.5" class="dnt">Retrieve trusted</text><text x="265" y="52.5" class="dnt sub">documents</text><rect x="385" y="24" width="140" height="42" rx="7" class="dn acc"/><text x="455" y="37.5" class="dnt">LLM + retrieved</text><text x="455" y="52.5" class="dnt sub">context</text><rect x="570" y="27" width="140" height="36" rx="7" class="dn good"/><text x="640" y="45" class="dnt">Grounded answer</text></svg><div class="dia-cap">RAG grounds the answer in retrieved documents · part 2 slide 28</div></div>
<p>RAG can improve grounding, but it does <b>not</b> make a system automatically correct: retrieval quality, source quality and model behaviour still matter. (Module 6 develops retrieval as a tool in detail.)</p>`,
 understand:`<p>An LLM is trained to produce the most plausible continuation. A plausible-sounding citation and a real citation look identical to that objective, which is the whole reason hallucination happens.</p>`,
 examples:[],
 examAnswer:`<p>Definition with 'confabulation', the two-column table, the four mitigations, then RAG as a four-box flow with its limitation.</p>`,
 mistakes:[`Writing 'RAG eliminates hallucination'. The slide says it improves grounding but does not make the system automatically correct.`]},

{id:"m5t9", title:"Prompt Engineering", type:"theory",
 priority:"high", core:true, marks:[10], src:"part 2 slides 29–37 (incl. the four prompt-engineering infographics)",
 tags:["prompt","engineering"],
 learn:`<div class="note"><span class="note-t">Exam question</span>What is prompt engineering? Explain the five elements of a strong prompt with an example, and describe zero-shot, one-shot, few-shot, structured and refine prompting.</div>
<p>A <b>prompt</b> is the input we give a large language model. <b>Prompt design</b> is crafting that input so the output is useful — the quality of the input determines the quality of the output. Prompting serves tasks such as summarising, writing and keyword extraction.</p>
<p><b>Prompt engineering is not magic words; it is structured communication with a model.</b></p>
<h4>Weak → better → strong</h4>
<div class="scroll"><table class="t"><thead><tr><th>Level</th><th>Prompt</th><th>Result</th></tr></thead><tbody>
<tr><td>1 · Weak</td><td>"Explain AI."</td><td>Too broad — audience, depth, format and purpose unclear</td></tr>
<tr><td>2 · Better</td><td>"Explain AI to a first-year engineering student in 100 words."</td><td>Focused, concise — audience and length defined</td></tr>
<tr><td>3 · Strong</td><td>"Act as a teacher. Explain AI to first-year students using one real-life example. Use 5 bullets and avoid jargon."</td><td>High-quality, relevant, actionable — context, structure and constraints met</td></tr></tbody></table></div>
<h4>The five essential elements</h4>
<div class="formula">ROLE + TASK + CONTEXT + CONSTRAINTS + OUTPUT FORMAT</div>
<div class="scroll"><table class="t"><thead><tr><th>Element</th><th>Question it answers</th><th>Example (Java inheritance)</th></tr></thead><tbody>
<tr><td><b>Role</b></td><td>Who should the AI act as?</td><td>"Act as an experienced Java programming teacher."</td></tr>
<tr><td><b>Task</b></td><td>What should it do?</td><td>"Explain inheritance in Java."</td></tr>
<tr><td><b>Context</b></td><td>What background does it need?</td><td>"The students know classes and objects but have not studied inheritance."</td></tr>
<tr><td><b>Constraints</b></td><td>What rules should it follow?</td><td>"Use simple language, include one real-life example and keep the explanation under 200 words."</td></tr>
<tr><td><b>Output format</b></td><td>How should the answer be presented?</td><td>"Use a table followed by a short Java program."</td></tr></tbody></table></div>
<p>Role defines perspective and action; context tailors the explanation; constraints define boundaries; output format specifies presentation.</p>
<h4>Prompting techniques</h4>
<ul class="list"><li><b>Zero-shot</b> — give the task without examples: "Classify this review as positive or negative."</li>
<li><b>One-shot</b> — give one example before the task.</li>
<li><b>Few-shot</b> — give several examples to establish the pattern.</li>
<li><b>Structured</b> — specify the schema: bullets, table, JSON or steps.</li>
<li><b>Refine</b> — critique, verify and revise the output.</li></ul>
<p><b>Advanced practice:</b> separate instructions from data · define what "good" means · ask for uncertainty or verification.</p>
<div class="note"><b>Limit.</b> Prompting controls <b>task framing and output format</b>; factual verification is still needed. Prompting does not guarantee correctness.</div>
<p>Tools mentioned in the deck: <b>GenAI Studio</b> (explore and customise models: pre-trained models, fine-tuning, deployment) and <b>GenAI App Builder</b> (code-free app creation with a visual drag-and-drop editor).</p>`,
 understand:`<p>Each element closes one gap the model would otherwise fill by guessing: who it is talking as, what to do, what the reader already knows, what not to do, and what shape the answer takes. Fewer guesses, fewer surprises.</p>`,
 examples:[],
 examAnswer:`<p>Definition, the five-element formula, a single prompt rewritten weak → strong with each element labelled, then the five techniques. A worked rewrite earns more than a description.</p>`,
 mistakes:[`Listing only role/task/format. Context and constraints are the two that most change the answer — and they are the two students forget.`]},

{id:"m5t10", title:"Explainable AI: Interpretability vs Explainability", type:"theory",
 priority:"high", core:true, marks:[5], src:"part 2 slides 40–41",
 tags:["explainable","interpretability","explainability"],
 learn:`<div class="note"><span class="note-t">Exam question</span>What is Explainable AI (XAI)? Distinguish interpretability from explainability and explain why XAI is needed.</div>
<p><b>Prediction alone is often not enough: why did the model decide this?</b></p>
<div class="flow">Black box:  features → AI model → prediction      ("Loan rejected.")
Explain:    which features influenced THIS prediction?   (income? credit history? existing debt?)
Act:        verify, challenge, improve or communicate the decision</div>
<div class="scroll"><table class="t"><thead><tr><th>Interpretability</th><th>Explainability</th></tr></thead><tbody>
<tr><td>How understandable the <b>model itself</b> is (a small decision tree is interpretable)</td><td>How we can explain a model's <b>behaviour</b> or <b>one particular prediction</b> — even for a black-box model</td></tr></tbody></table></div>
<h4>Why it is needed</h4>
<ul class="list"><li><b>Debugging</b> — find the model relying on the wrong feature.</li>
<li><b>Trust</b> — users accept decisions they can understand.</li>
<li><b>Auditing</b> — show a regulator or reviewer how decisions are made.</li>
<li><b>Oversight</b> — let a human challenge or override a decision.</li></ul>
<p>Typical high-stakes settings: loan approval and medical diagnosis. For an applicant, "Rejected" with no reason gives nothing to act on; "rejected because of previous default and high existing debt ratio" does (ClarifAI, Module 6).</p>`,
 understand:`<p>Interpretability is a property of the model; explainability is a service you provide about it. You can explain a black box without making it interpretable — that is exactly what SHAP and LIME do.</p>`,
 examples:[],
 examAnswer:`<p>The black box → explain → act flow, the two-column distinction, four uses. Use a loan or diagnosis example throughout.</p>`,
 mistakes:[`Treating 'explainable' as 'accurate'. An explanation can be clear and the model still wrong or biased.`]},

{id:"m5t2", title:"SHAP and LIME", type:"theory",
 priority:"high", core:true, marks:[10], src:"part 2 slides 42–43, 57 (activity); ClarifAI slides 2, 6",
 tags:["shap","lime"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Explain SHAP and LIME. How does each produce an explanation, how do they differ, and what are their limitations? Illustrate with a loan or scholarship decision.</div>
<h4>SHAP — what pushed the prediction?</h4>
<p>SHAP builds on <b>Shapley values from cooperative game theory</b>: fairly allocating a prediction difference among the features.</p>
<ul class="list"><li>Start from a <b>baseline prediction</b> (the average output).</li>
<li>Each feature receives a <b>contribution</b> that pushes the prediction <b>up or down</b>.</li>
<li>The baseline plus the contributions gives this applicant's prediction.</li></ul>
<p>Loan risk (illustrative): <i>income</i> and <i>credit history</i> push towards lower risk; <i>existing debt</i> and <i>late payments</i> push towards higher risk. Uses: <b>local explanations and feature importance</b>, model debugging, auditing and communication.</p>
<h4>LIME — explaining one prediction locally</h4>
<ol class="list"><li><b>Choose a case</b> — one patient or one loan decision.</li>
<li><b>Perturb around it</b> — create nearby variations and observe the complex model's outputs.</li>
<li><b>Fit a simple model</b> — use its local behaviour as an easy-to-read explanation.</li></ol>
<p>Analogy from the speaker notes: a complicated landscape can be approximated by a simple map around the point where you are standing.</p>
<h4>Comparison</h4>
<div class="scroll"><table class="t"><thead><tr><th></th><th>SHAP</th><th>LIME</th></tr></thead><tbody>
<tr><td>Idea</td><td>Shapley-value feature attribution</td><td>Local surrogate explanation</td></tr>
<tr><td>Scope</td><td>Local explanations <b>and</b> aggregate (dataset-level) summaries</td><td>One prediction at a time</td></tr>
<tr><td>Method</td><td>Distributes the prediction among features</td><td>Perturbs inputs and fits a simple local model</td></tr>
<tr><td>Strength</td><td>Strong theory; common for tree models and tabular data</td><td>Flexible — works with any model</td></tr>
<tr><td>Weakness</td><td>Computationally heavier</td><td>Results can depend on sampling and settings</td></tr>
<tr><td>Emphasises</td><td>Feature contribution</td><td>Intuitive local conditions</td></tr></tbody></table></div>
<h4>Applied — ClarifAI (student loans and scholarships)</h4>
<p>ClarifAI uses both: SHAP shows positive and negative contributions for individual applicants and across the dataset; LIME explains one prediction with understandable feature conditions. Illustrative output: <i>"Approval probability is lower because: previous default and high existing debt ratio. Higher because: strong academic score and complete documents."</i> It reports a LIME local-surrogate fidelity of R² = 0.942, and 96.4% agreement between SHAP, LIME and the rule engine on the top decision drivers — reported project figures, not proof of reliability.</p>
<h4>Limitations</h4>
<p><b>Explanations are themselves approximations.</b> "Explainable" does not mean "perfectly faithful". Treat explanations as evidence, not absolute proof of causality. And explainability does <b>not</b> guarantee that a model is accurate or unbiased — the closing question of the SHAP/LIME activity.</p>`,
 understand:`<p>SHAP answers 'how much did each feature contribute, compared with an average applicant?' LIME answers 'if I wiggle this applicant's inputs a little, which ones change the decision?' Same goal, different route.</p>`,
 examples:[],
 examAnswer:`<p>SHAP in three bullets with 'Shapley values from cooperative game theory', LIME in three numbered steps, the comparison table, and one limitation sentence. A small waterfall-style sketch (baseline → +/− bars → prediction) is a bonus.</p>
<div class="note"><span class="note-t">Diagram</span>Optional: a SHAP waterfall — baseline on the left, bars for each feature pushing right (higher risk) or left (lower risk), ending at the prediction.</div>`,
 mistakes:[`Saying SHAP or LIME prove that a feature causes the outcome. They attribute a model's output; they say nothing about real-world causation.`]},

{id:"m5t3", title:"Responsible AI: Five Principles Across the Lifecycle", type:"theory",
 priority:"high", core:true, marks:[5], src:"part 2 slides 44–45",
 tags:["responsible","five","principles","across","lifecycle"],
 learn:`<div class="note"><span class="note-t">Exam question</span>What is Responsible AI? State its five principles and explain why it must be considered across the whole AI lifecycle.</div>
<p><b>Responsible AI</b> means building AI that people can use safely and fairly.</p>
<div class="scroll"><table class="t"><thead><tr><th>Principle</th><th>Meaning</th></tr></thead><tbody>
<tr><td><b>Fair</b></td><td>Avoid unjustified disparities and harmful bias</td></tr>
<tr><td><b>Safe</b></td><td>Reduce harmful, unsafe or unreliable behaviour</td></tr>
<tr><td><b>Private</b></td><td>Protect personal and sensitive information</td></tr>
<tr><td><b>Transparent</b></td><td>Communicate capabilities and limitations</td></tr>
<tr><td><b>Accountable</b></td><td>People and organisations remain responsible</td></tr></tbody></table></div>
<p><b>Not a checklist at the end.</b> Risk must be considered across the whole lifecycle:</p>
<div class="flow">Data  →  Model development  →  Deployment  →  Monitoring  ↺</div>
<p>The question from the speaker notes: <i>if an AI system is accurate but unfair, is it responsible?</i> No — performance and trustworthiness are separate properties. A hiring model can be 95% accurate on past decisions and still reproduce past discrimination.</p>`,
 understand:`<p>The five principles map onto questions any stakeholder can ask: is it fair to me, can it hurt me, what does it know about me, can I see how it works, and who answers for it?</p>`,
 examples:[],
 examAnswer:`<p>The five-row table plus the lifecycle line, closed with the 'accurate but unfair' point. That is a full 5 marks.</p>`,
 mistakes:[`Listing 'accuracy' as a Responsible AI principle. Accuracy is a performance measure; the principles are about trust.`]},

{id:"m5t11", title:"Bias and Fairness", type:"theory",
 priority:"high", core:true, marks:[5], src:"part 2 slides 46, 48; ClarifAI slide 7",
 tags:["bias","fairness"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Where can bias enter an AI system? Explain the common types of bias with examples, and how fairness can be monitored.</div>
<p><b>Bias is not only an algorithm problem.</b> It can enter at every stage:</p>
<div class="scroll"><table class="t"><thead><tr><th>Stage</th><th>The question to ask</th></tr></thead><tbody>
<tr><td>Data</td><td>Who is represented?</td></tr><tr><td>Labels</td><td>Who decided the "correct" answer?</td></tr>
<tr><td>Model</td><td>What objective is optimised?</td></tr><tr><td>Deployment</td><td>Where and how is it used?</td></tr>
<tr><td>Human use</td><td>How do people interpret and act on outputs?</td></tr></tbody></table></div>
<h4>Common types</h4>
<ul class="list"><li><b>Historical</b> — past data reflects past discrimination.</li>
<li><b>Representation</b> — some groups are under-represented.</li>
<li><b>Measurement</b> — labels or features poorly capture what matters.</li>
<li><b>Automation</b> — people over-trust automated outputs.</li></ul>
<p>A model can reproduce patterns from data without "intending" to discriminate. Example: a <b>hiring model trained on biased past decisions</b> learns that pattern.</p>
<h4>Monitoring fairness</h4>
<p>ClarifAI monitors a <b>Disparate Impact Ratio</b> and reports <b>0.92</b> against the <b>0.80</b> benchmark: the favourable-outcome rate of one group divided by that of the comparison group, where values below 0.80 are a warning sign. It also routes risky combinations — <i>low income and missing documentation together</i> — to additional human review.</p>`,
 understand:`<p>Each type of bias has a different fix. Representation bias needs more data from the missing group; historical bias needs you to question the labels themselves; automation bias needs a human who is trained to disagree with the machine.</p>`,
 examples:[],
 examAnswer:`<p>The five-stage table, the four types with one-line definitions, the hiring example, and one monitoring control.</p>`,
 mistakes:[`Thinking bias is fixed by deleting the sensitive attribute (gender, caste). Other features can act as proxies, so the bias survives.`]},

{id:"m5t12", title:"Privacy Risks of Generative AI", type:"theory",
 priority:"medium", core:true, marks:[5], src:"part 2 slide 47",
 tags:["privacy","risks","generative"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Discuss privacy risks of generative AI. What questions should be asked before pasting data into an AI tool, and what is safer practice?</div>
<p><b>"Can I paste this into an AI tool?"</b></p>
<div class="scroll"><table class="t"><thead><tr><th>Sensitive inputs</th><th>Questions to ask</th><th>Safer practice</th></tr></thead><tbody>
<tr><td>Personal data · student records · medical information · passwords and secrets · confidential documents</td>
<td>What data is collected? · Who can access it? · How is it stored or used? · What policy applies?</td>
<td>Minimise data · anonymise where appropriate · use approved systems · follow institutional policy</td></tr></tbody></table></div>
<p><b>Classroom rule:</b> never treat a public AI interface as a place to casually paste confidential or sensitive information. Assignments, resumes, IDs, medical reports, internal college documents and passwords should not be pasted into AI tools without authorisation and appropriate safeguards.</p>
<p>In India, personal data handling falls under the <b>Digital Personal Data Protection</b> framework (see the regulation answer).</p>`,
 understand:`<p>Anything you paste leaves your control: it may be logged, reviewed or used under that service's policy. Privacy questions are about where the data goes after you press Enter.</p>`,
 examples:[],
 examAnswer:`<p>The three-column table, the classroom rule, and one concrete example of data that must not be pasted.</p>`,
 mistakes:[`Answering only 'use strong passwords'. The question is about data you give to the model, not account security.`]},

{id:"m5t13", title:"Case Study: Automated Internship Shortlisting", type:"theory",
 priority:"high", core:true, marks:[10], src:"part 2 slides 48, 52, 55 (case study, activities, golden rule)",
 tags:["case","study","automated","internship","shortlisting"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Case study: a college wants to automate internship shortlisting — read resumes, score candidates, rank applicants and recommend an interview list. Identify the risks, propose safeguards and justify whether to deploy it.</div>
<h4>The system</h4><p>Reads resumes → scores candidates → ranks applicants → recommends an interview list.</p>
<div class="scroll"><table class="t"><thead><tr><th>Risk</th><th>Why it arises</th><th>Safeguard</th></tr></thead><tbody>
<tr><td>Gender / demographic bias</td><td>Model learns from features correlated with group membership</td><td><b>Monitor fairness</b> — compare shortlist rates across groups</td></tr>
<tr><td>Historical bias</td><td>Trained on past shortlists that reflected past preferences</td><td><b>Audit</b> the training labels and outcomes</td></tr>
<tr><td>Privacy of resumes</td><td>Resumes contain personal data</td><td><b>Protect data</b> — minimise, anonymise, restrict access</td></tr>
<tr><td>Opaque decisions</td><td>Candidates cannot see why they were rejected</td><td><b>Explain</b> — SHAP/LIME per candidate; allow contesting</td></tr>
<tr><td>False negatives</td><td>A strong but unusual resume is ranked low</td><td><b>Human review</b> of rejections, not only of the shortlist</td></tr></tbody></table></div>
<h4>Ethics check (from the speaker notes)</h4>
<p>Is it fair, safe, private, contestable? Who is accountable? Who benefits — and who may be harmed? Should it be deployed at all?</p>
<h4>A justified decision</h4>
<p>Deploy <b>only as a decision-support tool</b>, under conditions: a fairness audit before launch, explanations for every score, anonymised resumes, a human who reviews borderline and rejected cases, and periodic re-audit. Do <b>not</b> let it reject candidates automatically. That is human-in-the-loop for a high-impact decision. Students should distinguish technical fixes (audit, explain) from policy and governance controls (accountability, contestability).</p>
<h4>The golden rule of AI</h4>
<p><b>Use AI to amplify human capability — not to outsource human responsibility.</b> Ask: is the task appropriate for AI? Verify: can the output be trusted? Take responsibility: who is accountable?</p>`,
 understand:`<p>An ethics answer earns marks by being specific: each risk paired with the control that addresses it. A list of risks with no controls, or controls with no risks, is half an answer.</p>`,
 examples:[],
 examAnswer:`<p>A three-column risk / cause / safeguard table with at least five rows, then a one-paragraph deployment decision stating its conditions. Close with the golden rule.</p>`,
 mistakes:[`Answering 'do not deploy because AI is biased'. The question wants a justified decision, and a conditional yes with safeguards is usually the stronger answer.`]},

{id:"m5t14", title:"AI Regulation: EU AI Act, India and NIST AI RMF", type:"theory",
 priority:"high", core:true, marks:[10], src:"part 2 slides 49–51, 56",
 tags:["regulation","act","india","nist","rmf"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Why does AI need regulation? Explain the risk-based approach of the EU AI Act, the Indian context, and the NIST AI Risk Management Framework.</div>
<h4>Why regulate?</h4>
<p>To protect rights, reduce harmful uses, set transparency duties, create accountability and manage high-risk systems. <b>Not every AI application carries the same risk</b>: a recommendation engine ≠ a medical diagnosis system.</p>
<h4>EU AI Act — a risk-based view</h4>
<div class="scroll"><table class="t"><thead><tr><th>Tier</th><th>Treatment</th></tr></thead><tbody>
<tr><td><b>Unacceptable risk</b></td><td>Certain AI practices are prohibited</td></tr>
<tr><td><b>High risk</b></td><td>Strict requirements for specified high-risk systems</td></tr>
<tr><td><b>Transparency</b></td><td>Duties for certain AI interactions and content</td></tr>
<tr><td><b>General-purpose AI</b></td><td>Extra obligations depending on provider and system</td></tr></tbody></table></div>
<p>Applicability is phased; use the official European Commission sources for the current timeline.</p>
<h4>India</h4>
<ul class="list"><li><b>Data and privacy</b> — understand the <b>Digital Personal Data Protection</b> framework and how personal data is handled.</li>
<li><b>AI governance</b> — India is developing a broader ecosystem of AI governance, standards and responsible-AI initiatives.</li>
<li><b>Practical rule</b> — do not assume one "AI law" answers every situation. Identify the <b>sector, data, use case and applicable rules</b>. Before using any AI system, know its context, data, impact and applicable rules. For current compliance, use official Government of India / MeitY / IndiaAI sources.</li></ul>
<h4>NIST AI Risk Management Framework</h4>
<div class="scroll"><table class="t"><thead><tr><th>Function</th><th>What it covers</th></tr></thead><tbody>
<tr><td><b>GOVERN</b></td><td>Policies, roles, accountability, culture</td></tr>
<tr><td><b>MAP</b></td><td>Understand context, stakeholders and risks</td></tr>
<tr><td><b>MEASURE</b></td><td>Evaluate performance, fairness, security and other risks</td></tr>
<tr><td><b>MANAGE</b></td><td>Prioritise, respond, monitor and improve</td></tr></tbody></table></div>
<p><b>Characteristics of trustworthy AI</b> (NIST): valid and reliable · safe · secure and resilient · accountable and transparent · explainable and interpretable · privacy-enhanced · fair, with harmful bias managed.</p>
<p>Where do SHAP and LIME fit? Mostly in <b>MEASURE</b> and in "explainable and interpretable" — but governance and risk management extend well beyond technical explanations.</p>`,
 understand:`<p>Risk-based regulation is proportionality: the stricter the possible harm, the stricter the rules. That is why the same law can ban one use of AI and barely touch another.</p>`,
 examples:[],
 examAnswer:`<p>Five reasons to regulate, the EU tiers table, three India points, the NIST four functions table. For 10 marks add the trustworthy-AI characteristics and where XAI fits.</p>`,
 mistakes:[`Writing specific dates or penalty figures from memory. The deck deliberately avoids them because they change — cite the framework, not a date.`]},

{id:"m5t15", title:"Prompt Makeover Drill", type:"numerical",
 priority:"high", core:true, marks:[5], src:"part 2 slides 31–37 (prompt recipe, infographics, classroom activity)",
 tags:["prompt","makeover","drill"],
 concept:`Take a vague prompt and rebuild it element by element. Name each element in the margin as you add it — the labels are what show the examiner you are applying the framework rather than just writing a longer prompt.`,
 formula:`<div class="fx-pre">Strong prompt = ROLE + TASK + CONTEXT + CONSTRAINTS + OUTPUT FORMAT

Classroom version (6 parts): Role · Audience · Task · Context · Constraints · Output format</div>`,
 variables:[{v:"Role", m:`who the AI should act as`},
  {v:"Task", m:`what it should do`},
  {v:"Context", m:`what background it needs — including the audience`},
  {v:"Constraints", m:`rules: length, language level, what to avoid, examples to include`},
  {v:"Output format", m:`bullets, table, JSON, steps, code`}],
 worked:{
  problem:`<strong>"Tell me about climate change." (slide 37 classroom activity).</strong>`,
  steps:[`<b>Diagnose the weak prompt.</b> No role, no audience, no purpose, no length, no format. The model must guess all five, so the answer will be generic.`,
   `<b>Role:</b> "Act as an environmental science teacher."`,
   `<b>Task + audience:</b> "Explain the causes and effects of climate change to second-year engineering students."`,
   `<b>Context:</b> "They know basic chemistry but have not studied environmental science. The explanation is for a 10-minute class discussion."`,
   `<b>Constraints:</b> "Use simple language, include one example from India, and keep it under 200 words."`,
   `<b>Output format:</b> "Give three bullet points for causes, three for effects, then one discussion question."`],
  answer:`Act as an environmental science teacher. Explain the causes and effects of climate change to second-year engineering students who know basic chemistry but have not studied environmental science; this is for a 10-minute class discussion. Use simple language, include one example from India, and keep it under 200 words. Give three bullet points for causes, three for effects, then one discussion question.`,
  check:`Tick off all five elements (six with audience). Then ask the slide's discussion question: which prompt produced a more useful answer — and why? The learning outcome is that prompt quality is about clarity, context and constraints.`},
 learn:"",
 mistakes:[`Adding length without adding information ("Please explain climate change in great detail").`,
  `Mixing the data with the instructions. Put any text to be processed in a clearly separated block.`,
  `Believing a strong prompt makes the answer correct. It controls framing and format; facts still need checking.`],
 practice:[
  {d:"Easy", q:`Rewrite "Explain blockchain." (the slide-31 live activity) into a strong prompt. Label each element.`,
   s:`<b>[Role]</b> Act as a computer-networks lecturer. <b>[Task]</b> Explain how a blockchain records transactions <b>[Context]</b> to first-year engineering students who know what a database is but not what a hash function is. <b>[Constraints]</b> Use one everyday analogy, avoid cryptography jargon, under 150 words. <b>[Output format]</b> Five numbered steps followed by a one-line summary.<br><br>
   Many good answers exist — marks come from having all five elements, each doing a job.`},
  {d:"Moderate", q:`Write zero-shot, one-shot and few-shot prompts to classify workshop feedback (slide 24) as Positive, Negative, Neutral or Mixed.`,
   s:`<b>Zero-shot:</b> "Classify this feedback as Positive, Negative, Neutral or Mixed: 'The session was boring, but the examples were useful.'"<br><br>
   <b>One-shot:</b> "Classify feedback as Positive, Negative, Neutral or Mixed.<br>Example: 'The speaker explained everything clearly.' → Positive<br>Now classify: 'I couldn't understand the last part.'"<br><br>
   <b>Few-shot:</b> give several labelled examples covering every class — 'The workshop was excellent!' → Positive · 'The session was a complete waste of time.' → Negative · 'The workshop covered Python, AI and cloud computing.' → Neutral · 'The lab was confusing, but the lecture was excellent.' → Mixed — then the new comment.<br><br>
   Few-shot helps most with the <b>Mixed</b> class, which is the hardest to infer from the label name alone.`},
  {d:"Moderate", q:`"Act as an experienced Java teacher. Explain inheritance in Java." Which of the five elements are missing? Complete it.`,
   s:`Present: <b>Role</b>, <b>Task</b>. Missing: <b>Context</b>, <b>Constraints</b>, <b>Output format</b>.<br><br>
   Completed (the deck's own example): "Act as an experienced Java programming teacher. Explain inheritance in Java. The students know classes and objects but have not studied inheritance. Use simple language, include one real-life example and keep the explanation under 200 words. Use a table followed by a short Java program."`},
  {d:"Exam-level", q:`A student asks an LLM for 5 research papers with DOIs on XAI in healthcare, and gets them. Using prompt engineering and Module 5's hallucination material, explain what could go wrong and give a better workflow.`,
   s:`<b>What could go wrong:</b> fake references and citations are a named hallucination pattern. The model is optimised for likely text, not truth, so it can produce plausible titles, authors and DOIs that do not exist.<br><br>
   <b>Better workflow:</b><br>
   1. <b>Ground</b> — use a retrieval tool or academic database, and tell the model to answer only from the retrieved results.<br>
   2. <b>Constrain</b> — "List only papers present in the provided search results; if fewer than five are found, say so."<br>
   3. <b>Ask for uncertainty</b> — "Mark any item you are not certain exists."<br>
   4. <b>Verify</b> — check every DOI on Google Scholar or the publisher site (the deck's hallucination-hunt activity).<br><br>
   Prompting improves framing; only grounding and verification make the list trustworthy.`}]},

{id:"m5t16", title:"Reading SHAP Explanations and Consensus Scores", type:"numerical",
 priority:"high", core:true, marks:[5], src:"part 2 slides 42–43; ClarifAI slides 5–7",
 tags:["reading","shap","explanations","consensus","scores"],
 concept:`SHAP is additive: start at the baseline, add each feature's signed contribution, and you land on this case's prediction. Reading an explanation means doing that sum and naming which features pushed which way. ClarifAI adds a second calculation: average a rule score and a model probability, then apply decision thresholds.`,
 formula:`<div class="fx-pre">SHAP:        prediction = baseline + Σ (feature contributions)
             positive contribution → pushes the prediction up; negative → down

ClarifAI:    Consensus = (Rule Score + Neural Network Probability) / 2
             Approve ≥ 60% · Needs review 55–59% · Reject if any hard rule fails
             Hard rules: credit score &lt; 580 · previous default · DTI > 40%</div>`,
 variables:[{v:"baseline", m:`the average model output over the data — the starting point`},
  {v:"contribution", m:`how far this feature moves this prediction from the baseline`},
  {v:"DTI", m:`debt-to-income ratio`}],
 worked:{
  problem:`<strong>Loan risk explanation (illustrative values, as on slide 42).</strong><div class="fx-pre">Baseline predicted default risk = 0.30
Contributions for one applicant:
  income            −0.08
  credit history    −0.05
  existing debt     +0.12
  late payments     +0.10</div>`,
  steps:[`<b>Add the contributions:</b> −0.08 − 0.05 + 0.12 + 0.10 = +0.09`,
   `<b>Prediction:</b> 0.30 + 0.09 = <b>0.39</b>`,
   `<b>Read it:</b> income and credit history push towards lower risk; existing debt and late payments push towards higher risk, and they win. Existing debt is the largest single driver.`,
   `<b>Actionable explanation:</b> "Your predicted risk is higher than average mainly because of existing debt and late payments."`],
  answer:`Predicted risk 0.39 — 0.09 above the baseline, driven mainly by existing debt (+0.12).`,
  check:`The contributions must sum exactly to prediction − baseline. If they do not, a feature is missing or a sign is wrong. The slide labels its values as illustrative, and so are these.`},
 learn:"",
 mistakes:[`Reading a large contribution as 'this feature causes default'. SHAP attributes the model's output; it says nothing about real-world causation.`,
  `Ignoring the sign. A large negative contribution is just as important as a large positive one.`,
  `In ClarifAI, applying the score threshold before checking hard rules. A hard-rule failure rejects at any score.`],
 practice:[
  {d:"Easy", q:`ClarifAI: an applicant has rule score 70% and neural-network probability 52%, with no hard-rule failure. What is the outcome?`,
   s:`Consensus = (70 + 52) / 2 = <b>61%</b>. No hard-rule failure and ≥ 60% → <b>Approve</b>.`},
  {d:"Moderate", q:`ClarifAI: (a) rule score 60%, NN 52%, documents complete; (b) rule score 80%, NN 75%, credit score 560; (c) rule score 70%, NN 60%, verification documents missing. Decide each.`,
   s:`<b>(a)</b> (60 + 52)/2 = 56% → falls in 55–59% → <b>Needs review</b> (human).<br>
   <b>(b)</b> Credit score 560 &lt; 580 is a <b>hard-rule failure</b> → <b>Reject</b> at any score (here 77.5%), and explain the decision.<br>
   <b>(c)</b> (70 + 60)/2 = 65%, but missing verification documents → <b>Needs review</b>, which the table allows "or missing verification documents".<br><br>
   <div class="note"><b>Gap in the slide's table:</b> it does not say what happens to a consensus below 55% with no hard-rule failure. Say so if asked, rather than inventing a rule.</div>`},
  {d:"Moderate", q:`ClarifAI reports precision 67.57% and recall 57.79%. Verify the reported F1-score of 0.6230, and explain in one line what low recall means for applicants.`,
   s:`F1 = 2PR / (P + R) = 2 × 0.6757 × 0.5779 / (0.6757 + 0.5779) = 0.78098 / 1.2536 = <b>0.6230</b> ✓<br><br>
   Recall 57.79% means the model identifies only about 58% of the applicants who should be approved — about 42% of deserving applicants are missed by the model alone. That is one reason adverse and borderline cases go to human review.`},
  {d:"Exam-level", q:`For one loan applicant, SHAP says 'existing debt' is the top driver, while LIME's local explanation highlights 'missing documents'. Explain how both can be right, and what to do.`,
   s:`They answer different questions with different methods. <b>SHAP</b> distributes the prediction's difference from the baseline across all features, using Shapley values. <b>LIME</b> fits a simple local surrogate to <i>perturbed</i> neighbours of this applicant, and its result depends on sampling and settings. A feature can dominate the global-style attribution while another dominates the local linear fit.<br><br>
   <b>What to do:</b> treat both as evidence, not proof (explanations are approximations); check agreement on the top drivers (ClarifAI reports 96.4% agreement among SHAP, LIME and the rule engine); and send disagreements to human review. Explainability does not guarantee accuracy or fairness — the closing question of the SHAP/LIME activity.`}]},

{id:"m5t17", title:"Responsible-AI Case Analysis Drill", type:"numerical",
 priority:"high", core:true, marks:[10], src:"part 2 slides 45–51 (principles, bias, privacy, case study, regulation, NIST)",
 tags:["responsible-ai","case","analysis","drill"],
 concept:`Every responsible-AI scenario can be answered with the same five-step template. Working through the steps in order guarantees you cover risks, controls, regulation and a decision, rather than writing a general essay on ethics.`,
 formula:`<div class="fx-pre">1. SYSTEM      what it does, what data, who is affected
2. RISKS       fair · safe · private · transparent · accountable (+ hallucination for GenAI)
3. CONTROLS    one safeguard per risk  (audit · explain · protect data · monitor fairness · human review)
4. GOVERNANCE  risk tier (EU AI Act) · data law (India: DPDP) · NIST: govern / map / measure / manage
5. DECISION    deploy? under what conditions? who is accountable?</div>`,
 variables:[{v:"Risk tier", m:`unacceptable (prohibited) · high (strict requirements) · transparency duties · general-purpose AI`},
  {v:"Human review", m:`the control for high-impact or contestable decisions`}],
 worked:{
  problem:`<strong>An AI chatbot answers students' fee and scholarship queries for the college.</strong>`,
  steps:[`<b>System.</b> A GenAI chatbot on the college website answers questions about fees, deadlines and scholarship eligibility, using college documents. Affected: students and parents.`,
   `<b>Risks.</b> <i>Hallucination</i> — inventing a deadline or an eligibility rule. <i>Privacy</i> — students pasting roll numbers, income documents. <i>Transparency</i> — users may not realise they are talking to an AI. <i>Fairness</i> — answers may be poorer for queries in regional languages. <i>Accountability</i> — who answers for a wrong deadline?`,
   `<b>Controls.</b> Ground answers with retrieval from official documents and say "I don't know" when nothing is found · tell users not to share personal data, and minimise what is logged · disclose that it is an AI · test answer quality across languages · route scholarship-eligibility decisions to the office, with a named owner.`,
   `<b>Governance.</b> A chatbot interacting with people falls under <b>transparency</b> duties in the EU AI Act's risk-based view; personal data falls under India's <b>DPDP</b> framework. NIST: MAP the stakeholders, MEASURE answer accuracy, MANAGE with monitoring.`,
   `<b>Decision.</b> Deploy for information only, with retrieval grounding, AI disclosure and a human escalation path; it must not make eligibility decisions.`],
  answer:`Deploy as a grounded, clearly labelled information assistant with human escalation — not as a decision-maker.`,
  check:`Every risk in step 2 must have a matching control in step 3. If a risk has no control, the decision in step 5 is not justified.`},
 learn:"",
 mistakes:[`Listing principles without applying them to the system in the question.`,
  `Quoting EU AI Act dates or fines from memory — the deck deliberately avoids them because they change.`,
  `A one-word decision ('No'). Give conditions.`],
 practice:[
  {d:"Easy", q:`Map each to a bias type: (a) a hiring model trained on ten years of past hiring decisions; (b) a face-recognition model trained mostly on light-skinned faces; (c) a recruiter who always accepts the AI's ranking without reading resumes.`,
   s:`(a) <b>Historical bias</b> — past data reflects past discrimination.<br>
   (b) <b>Representation bias</b> — some groups are under-represented.<br>
   (c) <b>Automation bias</b> — over-trusting automated outputs.`},
  {d:"Moderate", q:`Place each in an EU AI Act risk tier and justify briefly: (a) a spam filter; (b) a chatbot on a shopping site; (c) an AI that ranks job applicants; (d) a government system that scores citizens' social behaviour to grant services.`,
   s:`(a) <b>Minimal risk</b> — low impact, so no specific obligations (outside the four tiers on the slide).<br>
   (b) <b>Transparency</b> — users must know they are interacting with AI.<br>
   (c) <b>High risk</b> — employment decisions affect people's livelihoods, so strict requirements apply.<br>
   (d) <b>Unacceptable risk</b> — social scoring is a prohibited practice.<br><br>
   <i>The deck gives the tiers but no examples. These placements follow the Act's widely cited examples — confirm against the official European Commission page, as the deck advises.</i>`},
  {d:"Exam-level", q:`Internship shortlisting (slide 48): give at least five risks and five safeguards, and justify a deployment decision.`,
   s:`See Theory Q&amp;A → the internship shortlisting case study for the full table. Minimum answer:<br>
   <b>Risks:</b> gender/demographic bias · historical bias · privacy of resumes · opaque decisions · false negatives.<br>
   <b>Safeguards:</b> fairness audit and monitoring · audit of training labels · data minimisation and anonymisation · per-candidate explanations · human review of rejections.<br>
   <b>Decision:</b> deploy only as decision support with those conditions. No automatic rejections, and a named person is accountable.`}]}
]},

{id:"m6t1", title:"Why Language Models Need Tools", type:"theory",
 priority:"high", core:true, marks:[5], src:"BE1 slides 3–5, 8; Tool Calling p.2",
 tags:["language","models","need","tools"],
 learn:`<div class="note"><span class="note-t">Exam question</span>An LLM 'can talk, but it can't check, compute or look things up'. Explain the built-in limitations of a language model on its own, and how tools address each one.</div>
<p><b>LLMs are autocomplete at scale.</b> The model reads everything so far, scores every possible next word-piece (token), appends the most suitable one and predicts again. <i>It continues text. It doesn't look anything up, and it doesn't run anything.</i></p>
<div class="scroll"><table class="t"><thead><tr><th>Limitation</th><th>Analogy (BE1)</th><th>Fix with a tool</th></tr></thead><tbody>
<tr><td><b>Weak at exact maths</b> (try 48,371 × 9,206)</td><td>A student who memorised many worked answers but never learned to calculate — it looks right; nothing was computed</td><td><b>Code</b> — Python computes the answer exactly</td></tr>
<tr><td><b>Hallucination</b></td><td>It optimises for fluent, not true; a confident wrong answer feels the same as a confident right one</td><td>Answers must be <b>grounded in a tool result</b></td></tr>
<tr><td><b>Frozen knowledge</b> (no live data)</td><td>A textbook printed on a fixed date</td><td><b>API</b> — a data-fetching tool brings in today's facts</td></tr>
<tr><td><b>No private data</b> (your files, databases)</td><td>—</td><td><b>Retrieval</b> over private documents</td></tr></tbody></table></div>
<p><b>We can't fix this by making the model bigger.</b> We give it <b>tools</b> it can call, and a system that runs them — "give the model hands".</p>
<div class="dia"><svg viewBox="0 0 640 330" role="img" aria-label="Language model with tools"><defs><marker id="arw_tool_layer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M300 53 L300 99" class="de " marker-end="url(#arw_tool_layer)"/><path d="M400 120 L470 120" class="de " marker-end="url(#arw_tool_layer)"/><path d="M324.26666666666665 141 Q352 165 324.26666666666665 189" class="de " marker-end="url(#arw_tool_layer)"/><path d="M275.73333333333335 189 Q248 165 275.73333333333335 141" class="de " marker-end="url(#arw_tool_layer)"/><path d="M255.52941176470588 231 L164.47058823529412 274" class="de " marker-end="url(#arw_tool_layer)"/><path d="M300 231 L300 274" class="de " marker-end="url(#arw_tool_layer)"/><path d="M344.47058823529414 231 L435.52941176470586 274" class="de " marker-end="url(#arw_tool_layer)"/><rect x="225" y="17" width="150" height="36" rx="7" class="dn "/><text x="300" y="35" class="dnt">User question</text><rect x="200" y="99" width="200" height="42" rx="7" class="dn acc"/><text x="300" y="112.5" class="dnt">Language model</text><text x="300" y="127.5" class="dnt sub">decides if a tool is needed</text><rect x="470" y="99" width="140" height="42" rx="7" class="dn good"/><text x="540" y="112.5" class="dnt">Answer grounded</text><text x="540" y="127.5" class="dnt sub">in results</text><rect x="205" y="189" width="190" height="42" rx="7" class="dn warn"/><text x="300" y="202.5" class="dnt">Tool layer</text><text x="300" y="217.5" class="dnt sub">your code runs the call</text><rect x="45" y="274" width="150" height="42" rx="7" class="dn "/><text x="120" y="287.5" class="dnt">API</text><text x="120" y="302.5" class="dnt sub">live data</text><rect x="225" y="274" width="150" height="42" rx="7" class="dn "/><text x="300" y="287.5" class="dnt">Retrieval</text><text x="300" y="302.5" class="dnt sub">private docs</text><rect x="405" y="274" width="150" height="42" rx="7" class="dn "/><text x="480" y="287.5" class="dnt">Code</text><text x="480" y="302.5" class="dnt sub">exact math</text><rect x="305.23333333333335" y="156" width="65.80000000000001" height="18" rx="4" class="delb"/><text x="338.1333333333333" y="165" class="del">tool call</text><rect x="238.26666666666668" y="156" width="47.2" height="18" rx="4" class="delb"/><text x="261.8666666666667" y="165" class="del">result</text></svg><div class="dia-cap">(a) alone, the model answers from a frozen snapshot; (b) with tools, it decides when a tool is needed and answers from the result · Tool Calling p.2</div></div>
<p>Still missing: <i>who picks the tool, in what order, and who double-checks?</i> That is the job of <b>agents</b>.</p>`,
 understand:`<p>The model stays exactly the same; what changes is the system around it. That is why this is a Module 6 'real-world deployment' topic, not a Module 5 'how LLMs work' topic.</p>`,
 examples:[],
 examAnswer:`<p>The limitation → fix table is the answer. Add the one-line thesis ('an LLM can talk, but it can't check, compute or look things up') and the diagram for full marks.</p>`,
 mistakes:[`Saying the model 'executes' the tool. It never runs anything — your code does (see the next question).`]},

{id:"m6t2", title:"Tool Calling: The Four-Step Loop, Schema and Middleware", type:"theory",
 priority:"high", core:true, marks:[10], src:"BE1 slides 6–7; Tool Calling pp.3–4, 7",
 tags:["tool","calling","four-step","loop","schema","middleware"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Explain how tool calling (function calling / API calling) works. Describe the four-step loop, the role of the tool schema and middleware, and trace a weather query end to end.</div>
<h4>The model never runs anything</h4>
<div class="scroll"><table class="t"><thead><tr><th>Part</th><th>Role</th><th>Restaurant analogy</th></tr></thead><tbody>
<tr><td><b>The LLM</b></td><td>Reads and writes text only</td><td>The customer ordering</td></tr>
<tr><td><b>Tool schema</b></td><td>Name, purpose and typed inputs for each tool</td><td><b>Menu card</b> — it can order from it, it can't invent dishes</td></tr>
<tr><td><b>Middleware</b> (LangChain / LangGraph, or your app code)</td><td>Checks the request, runs the code, returns the result</td><td><b>Waiter</b> — carries the order, checks it makes sense, brings the result</td></tr>
<tr><td><b>Python tool</b></td><td>Plain code: exact maths, real data</td><td><b>Kitchen</b> — the model never goes in here</td></tr></tbody></table></div>
<h4>The four-step loop</h4>
<ol class="wsteps"><li>The question <b>and a menu of tools</b> go to the LLM.</li>
<li>The LLM replies with a <b>small structured request</b>, not an answer — e.g. <code>tool: get_price_history · stock: XYZ · days: 30</code>.</li>
<li><b>Middleware checks the request</b>, then runs the real code.</li>
<li>The exact result goes back as a tool message; the LLM writes a <b>grounded answer</b> (or asks for another tool).</li></ol>
<p><b>Think → act → observe: this loop is the atom of every agent.</b> The interception point in step 3 is where guardrails live.</p>
<h4>The tool definition the model is shown</h4>
<div class="formula">{
  "name": "get_weather",                          ← how the model refers to the tool
  "description": "Get the forecast for a city",   ← when to use it; the model reads this to choose
  "parameters": {                                 ← typed inputs, required ones marked
    "type": "object",
    "properties": { "city": {"type": "string"}, "days": {"type": "integer"} },
    "required": ["city"]
  }
}

Model's tool call: {"name": "get_weather", "arguments": {"city": "Thane", "days": 3}}
— must fit the schema; your code validates it before running</div>
<h4>End-to-end trace</h4>
<div class="dia"><svg viewBox="0 0 660 422" role="img" aria-label="Tool-calling sequence for a weather question"><defs><marker id="arw_seq_weather" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><line x1="60" y1="56" x2="60" y2="416" class="de dash" style="opacity:.55"/><rect x="2" y="22" width="116" height="34" rx="7" class="dn"/><text x="60" y="39" class="dnt">User</text><line x1="240" y1="56" x2="240" y2="416" class="de dash" style="opacity:.55"/><rect x="182" y="22" width="116" height="34" rx="7" class="dn"/><text x="240" y="39" class="dnt">Your code (app)</text><line x1="420" y1="56" x2="420" y2="416" class="de dash" style="opacity:.55"/><rect x="362" y="22" width="116" height="34" rx="7" class="dn acc"/><text x="420" y="39" class="dnt">Model (LLM)</text><line x1="600" y1="56" x2="600" y2="416" class="de dash" style="opacity:.55"/><rect x="542" y="22" width="116" height="34" rx="7" class="dn good"/><text x="600" y="39" class="dnt">Weather API</text><line x1="63" y1="92" x2="237" y2="92" class="de " marker-end="url(#arw_seq_weather)"/><rect x="107.8" y="70" width="84.4" height="17" rx="4" class="delb"/><text x="150" y="79" class="del">1. question</text><line x1="243" y1="132" x2="417" y2="132" class="de " marker-end="url(#arw_seq_weather)"/><rect x="250.6" y="110" width="158.8" height="17" rx="4" class="delb"/><text x="330" y="119" class="del">2. messages + tool list</text><line x1="417" y1="172" x2="243" y2="172" class="de dash acc" marker-end="url(#arw_seq_weather)"/><rect x="201" y="150" width="258" height="17" rx="4" class="delb"/><text x="330" y="159" class="del">3. tool call: get_weather(city=&quot;Thane&quot;)</text><line x1="243" y1="212" x2="597" y2="212" class="de " marker-end="url(#arw_seq_weather)"/><rect x="365.4" y="190" width="109.2" height="17" rx="4" class="delb"/><text x="420" y="199" class="del">4. HTTP request</text><line x1="597" y1="
