{id:"m4t1", title:"Uncertainty and Why We Need Probability", type:"theory",
 priority:"high", marks:[5], src:"Chpt 3 Knowledge slides 67–69",
 tags:["uncertainty","laziness","ignorance","decision theory","utility","probability"],
 learn:`<p>Uncertainty arises due to <strong>partial observability, nondeterminism, or a combination of the two</strong>. An agent may not know where it will end up after a sequence of actions.</p>
<h4>Why logic fails for medical diagnosis — the three reasons</h4>
<ol>
<li><strong>Laziness.</strong> It is too much work to list the complete set of antecedents and consequents needed to ensure an exceptionless rule, and too hard to use such a rule.</li>
<li><strong>Theoretical ignorance.</strong> Medical science has no complete theory for the domain.</li>
<li><strong>Practical ignorance.</strong> Even if we knew all the rules, we might be uncertain about a particular patient because not all the necessary tests have been or can be run.</li>
</ol>
<h4>The use of probability theory</h4>
<ul>
<li>Probability provides a way of <strong>summarizing the uncertainty that comes from our laziness and ignorance</strong>.</li>
<li>An agent's knowledge can at best provide only a <strong>degree of belief</strong> in the relevant sentences.</li>
<li>To make choices, an agent must have <strong>preferences</strong> between the different possible outcomes of the various plans.</li>
<li>So we use <strong>utility theory</strong> to represent and reason with preferences.</li>
</ul>
<div class="fx">Decision Theory = Probability Theory + Utility Theory</div>`,
 understand:`<p>The three reasons are not interchangeable, and examiners look for the distinction: <strong>laziness</strong> is a problem with <em>us</em> (we cannot be bothered to write every exception), <strong>theoretical ignorance</strong> is a problem with the <em>science</em> (nobody knows the full theory), and <strong>practical ignorance</strong> is a problem with <em>this particular case</em> (the tests were not run).</p>
<p>The final equation is the punchline of the whole topic: probability tells you what is likely, utility tells you what you want, and decisions need both.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Why is probability needed in AI?</strong> Uncertainty arises from partial observability, nondeterminism, or both, so an agent may not know the outcome of its actions. Using logic in domains such as medical diagnosis fails for three reasons: <em>laziness</em> (too much work to list every antecedent and consequent for an exceptionless rule), <em>theoretical ignorance</em> (medical science has no complete theory of the domain), and <em>practical ignorance</em> (not all necessary tests have been run for this patient). Probability summarises the uncertainty arising from laziness and ignorance, giving a degree of belief rather than certainty. Since an agent must also have preferences between outcomes, we add utility theory: <strong>Decision Theory = Probability Theory + Utility Theory</strong>.</p>`,
 mistakes:["Giving only two of the three reasons — laziness, theoretical ignorance and practical ignorance are all examinable.",
 "Confusing theoretical with practical ignorance.",
 "Omitting the decision-theory equation, which is usually the final mark."]},

{id:"m4t2", title:"Prior and Posterior Probability, Bayes' Rule", type:"numerical",
 priority:"high", marks:[5], src:"Chpt 3 Knowledge slides 70–72",
 tags:["bayes","prior","posterior","conditional","product rule","diagnostic","numerical"],
 concept:"Bayes' rule inverts a conditional probability. It lets us compute the diagnostic direction P(cause | effect), which is what we actually want, from the causal direction P(effect | cause), which is what is actually measurable.",
 formula:"P(A | B) = P(B | A) · P(A) / P(B)",
 variables:[
  {v:"P(A)", m:"<strong>Prior / unconditional probability</strong> — the degree of belief before any evidence. e.g. P(cavity) = 0.2."},
  {v:"P(A | B)", m:"<strong>Posterior / conditional probability</strong> — the degree of belief after observing B. e.g. P(cavity | toothache) = 0.6."},
  {v:"P(B | A)", m:"The likelihood — the causal direction, usually easier to measure or estimate."},
  {v:"P(B)", m:"The normalising constant, the total probability of the evidence."},
  {v:"Random variable", m:"A variable in probability theory. By convention their names begin with a capital letter. They may be Boolean, discrete or continuous."}],
 whenToUse:"When the question gives you P(effect | cause) and asks for P(cause | effect) — the diagnostic direction. Recognisable by phrases like 'given that the test is positive, what is the probability the patient has the disease'.",
 learn:`<h4>Two kinds of probability</h4>
<ul>
<li><strong>Unconditional / Prior probability</strong> — e.g. P(cavity) = 0.2. Belief before any evidence arrives.</li>
<li><strong>Conditional / Posterior probability</strong> — e.g. P(cavity | toothache) = 0.6. Belief after evidence.</li>
</ul>
<h4>The product rule</h4>
<div class="fx">P(A ∧ B) = P(A | B) · P(B) = P(B | A) · P(A)</div>
<h4>Bayes' rule / Bayes' theorem / Bayes' law</h4>
<p>Equating the two forms of the product rule and rearranging:</p>
<div class="fx">P(A | B) = <span style="display:inline-block;text-align:center;vertical-align:middle"><span style="border-bottom:1px solid currentColor;display:block;padding:0 .3em">P(B | A) · P(A)</span><span style="display:block">P(B)</span></span></div>
<div class="note"><span class="note-t">Applying Bayes' rule</span><strong>P(cause | effect)</strong> describes the <strong>diagnostic direction</strong>, computed from <strong>P(effect | cause)</strong>, the causal direction.</div>`,
 understand:`<p>Why this matters practically: causal knowledge is <em>stable</em> and easy to gather — "of patients who have meningitis, 70% have a stiff neck" is a fact about the disease that a study can measure once. Diagnostic knowledge — "of patients with a stiff neck, how many have meningitis?" — depends on how common meningitis currently is, so it changes with every epidemic. Bayes' rule lets you store the stable direction and compute the volatile one on demand.</p>`,
 worked:{
  problem:"A doctor knows that meningitis causes a stiff neck 70% of the time. The prior probability that a patient has meningitis is 1/50 000, and the prior probability that any patient has a stiff neck is 1%. A patient walks in with a stiff neck. What is the probability they have meningitis?",
  steps:[
   "<strong>Identify the variables.</strong> Let M = the patient has meningitis, S = the patient has a stiff neck.",
   "<strong>Write down what is given.</strong> P(S | M) = 0.7 (the causal direction), P(M) = 1/50 000 = 0.00002 (prior), P(S) = 0.01 (prior).",
   "<strong>Identify what is asked.</strong> P(M | S) — the diagnostic direction. This is exactly the situation Bayes' rule is for.",
   "<strong>Apply Bayes' rule.</strong> P(M | S) = P(S | M) · P(M) / P(S)",
   "<strong>Substitute.</strong> P(M | S) = (0.7 × 0.00002) / 0.01 = 0.000014 / 0.01"],
  answer:"P(M | S) = 0.0014, i.e. about 0.14% — roughly 1 patient in 700.",
  check:"<strong>Sanity check the direction.</strong> P(S | M) = 70% but P(M | S) = 0.14%. These are wildly different, and that is correct: meningitis almost always causes a stiff neck, but a stiff neck almost never means meningitis, because meningitis is so rare. Swapping the two is the single most common error in the whole topic."},
 examAnswer:`<p><strong>5 marks — State and apply Bayes' rule.</strong> (1) Distinguish prior/unconditional probability, e.g. P(cavity) = 0.2, from posterior/conditional probability, e.g. P(cavity | toothache) = 0.6. (2) Give the product rule in both its forms and derive Bayes' rule from it by equating them and dividing by P(B). (3) State the rule: P(A|B) = P(B|A)·P(A)/P(B). (4) Explain that P(cause | effect) is the <strong>diagnostic direction</strong>, computed from P(effect | cause), the <strong>causal direction</strong> — because causal knowledge is stable and measurable while diagnostic knowledge shifts with prevalence. (5) Substitute the numbers given and state the answer with its interpretation.</p>`,
 mistakes:["Confusing P(A | B) with P(B | A). They are different numbers, often by orders of magnitude — see the sanity check above.",
 "Ignoring the prior. A small prior can overwhelm a strong likelihood.",
 "Using the prior of the wrong variable in the denominator. The denominator is the probability of the <em>evidence</em>.",
 "Mixing up prior (before evidence) and posterior (after evidence)."],
 practice:[
  {d:"Easy", q:"State whether each is a prior or a posterior probability: (a) P(cavity) = 0.2  (b) P(cavity | toothache) = 0.6.",
   s:"<p>(a) <strong>Prior / unconditional</strong> — no evidence has been observed.</p><p>(b) <strong>Posterior / conditional</strong> — the belief in a cavity <em>after</em> observing a toothache. Note that the posterior is higher, as you would expect: the evidence supports the hypothesis.</p>"},
  {d:"Moderate", q:"Derive Bayes' rule from the product rule.",
   s:"<p>The product rule can be written two ways, because conjunction is symmetric:</p><p><code>P(A ∧ B) = P(A | B) · P(B)</code> &nbsp;and&nbsp; <code>P(A ∧ B) = P(B | A) · P(A)</code></p><p>Since both equal P(A ∧ B), set them equal:</p><p><code>P(A | B) · P(B) = P(B | A) · P(A)</code></p><p>Divide both sides by P(B), assuming P(B) ≠ 0:</p><div class='ans'>P(A | B) = P(B | A) · P(A) / P(B)</div>"}]},

{id:"m4t3", title:"Joint Probability Distribution and Independence", type:"numerical",
 priority:"high", marks:[5], src:"Chpt 3 Knowledge slides 73–76",
 tags:["joint distribution","full joint","independence","inference","marginalisation","numerical"],
 concept:"The full joint probability distribution assigns a probability to every possible world. It can answer any question about the domain — you just add up the cells that match — but it grows exponentially, which is what motivates Bayesian networks.",
 formula:"P(query) = Σ (all matching cells of the full joint distribution)",
 variables:[
  {v:"Joint distribution", m:"The distribution of probability over multiple variables, e.g. Cavity and Weather together."},
  {v:"Full joint distribution", m:"The joint distribution for <em>all</em> the random variables in the domain."},
  {v:"Table size", m:"For variables Cavity, Toothache and Weather, the table has 2 × 2 × 4 = <strong>16</strong> entries. In general, the product of each variable's number of values."},
  {v:"Independence", m:"P(a | b) = P(a), P(b | a) = P(b), and P(a ∧ b) = P(a) · P(b)."}],
 whenToUse:"When the question gives a probability table and asks you to compute a marginal or a conjunction, or asks why a full joint distribution is impractical.",
 learn:`<h4>Joint and full joint distributions</h4>
<p>A <strong>joint probability distribution</strong> is a distribution of probability over multiple variables — for example the joint distribution of <em>Cavity</em> and <em>Weather</em>. The <strong>full joint probability distribution</strong> is the joint distribution for <em>all</em> the random variables. If the variables are Cavity, Toothache and Weather, the table has 2 × 2 × 4 = <strong>16 entries</strong>.</p>
<h4>The toothache / cavity / catch world</h4>
<div class="tw"><table><thead><tr><th rowspan="2"></th><th colspan="2">toothache</th><th colspan="2">¬toothache</th></tr>
<tr><th>catch</th><th>¬catch</th><th>catch</th><th>¬catch</th></tr></thead><tbody>
<tr><th>cavity</th><td>0.108</td><td>0.012</td><td>0.072</td><td>0.008</td></tr>
<tr><th>¬cavity</th><td>0.016</td><td>0.064</td><td>0.144</td><td>0.576</td></tr>
</tbody></table></div>
<p><strong>Inference using the full joint distribution table</strong> — simply sum the cells that satisfy the query:</p>
<div class="fx left">P(cavity) = 0.108 + 0.012 + 0.072 + 0.008 = <strong>0.2</strong><br>
P(cavity ∨ toothache) = 0.108 + 0.012 + 0.072 + 0.008 + 0.016 + 0.064 = <strong>0.28</strong></div>
<div class="note warn"><span class="note-t">Note on the slide</span>The lecture slide labels the second line with ∧, but the six cells being summed are the four cavity cells plus the two remaining toothache cells — that is the <strong>disjunction</strong> P(cavity ∨ toothache) = 0.28. The conjunction P(cavity ∧ toothache) would be just 0.108 + 0.012 = 0.12. Use the arithmetic, and if this comes up in the exam show your working so the summed cells are visible.</div>
<h4>Independence</h4>
<p>Factoring a large joint distribution into smaller ones using <strong>absolute independence</strong> — here, the weather is independent of one's dental problems. Independence between two propositions a and b:</p>
<div class="fx">P(a | b) = P(a)&nbsp;&nbsp;·&nbsp;&nbsp;P(b | a) = P(b)&nbsp;&nbsp;·&nbsp;&nbsp;P(a ∧ b) = P(a) · P(b)</div>
<h4>Why we need something better</h4>
<ul>
<li>The full joint distribution can answer any question about the domain, but becomes <strong>intractably large</strong> as the number of variables grows.</li>
<li>Specifying probabilities for possible worlds one by one is <strong>unnatural and tedious</strong>.</li>
<li><strong>Independence and conditional independence</strong> relationships among variables can greatly reduce the number of probabilities that need to be specified.</li>
<li>This motivates the <strong>Bayesian network</strong> — a data structure representing the dependencies among variables, which can represent essentially any full joint distribution, often very concisely.</li>
</ul>`,
 understand:`<p>The exponential blow-up is the entire argument for the next topic. With n Boolean variables the full joint table has 2<sup>n</sup> entries: 10 variables → 1 024 numbers, 30 variables → over a billion. Nobody can elicit a billion numbers from a doctor.</p>
<p>Independence is the escape hatch. If Weather is independent of dental problems, you do not need the 16-cell table — you need a 4-cell dental table and a 4-value weather table, 8 numbers instead of 16. Bayesian networks generalise exactly this trick.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Explain the full joint probability distribution and its limitation.</strong> A joint distribution gives probabilities over multiple variables; the full joint distribution covers all the random variables in the domain, with one entry per possible world (for Cavity, Toothache and Weather: 2 × 2 × 4 = 16 entries). Any query can be answered by summing the matching entries — e.g. from the dental table, P(cavity) = 0.108 + 0.012 + 0.072 + 0.008 = 0.2. <em>Limitations:</em> the table becomes intractably large as the number of variables grows, and specifying possible worlds one by one is unnatural and tedious. <em>Solution:</em> exploit independence — P(a ∧ b) = P(a)·P(b) when a and b are independent — and use a Bayesian network, which represents dependencies among variables and can encode the same full joint distribution far more concisely.</p>`,
 worked:{
  problem:"From the toothache / cavity / catch full joint distribution given above, compute (a) P(cavity), (b) P(toothache), (c) P(cavity ∧ toothache), and (d) P(cavity ∨ toothache).",
  steps:[
   "<strong>Understand the table.</strong> It has 2 × 2 × 2 = 8 cells, one per possible world over the Boolean variables Cavity, Toothache and Catch. Every cell is a complete description of the world, and all eight sum to 1.",
   "<strong>(a) P(cavity)</strong> — sum every cell in the <em>cavity</em> row, regardless of toothache and catch:<br>0.108 + 0.012 + 0.072 + 0.008 = <strong>0.2</strong>",
   "<strong>(b) P(toothache)</strong> — sum the four cells in the two <em>toothache</em> columns, regardless of cavity and catch:<br>0.108 + 0.012 + 0.016 + 0.064 = <strong>0.2</strong>",
   "<strong>(c) P(cavity ∧ toothache)</strong> — only cells that are <em>both</em> cavity and toothache, i.e. the two cells in the top-left block:<br>0.108 + 0.012 = <strong>0.12</strong>",
   "<strong>(d) P(cavity ∨ toothache)</strong> — every cell that is cavity <em>or</em> toothache, counting the overlap once. Take the four cavity cells, then add only the toothache cells not already counted:<br>0.108 + 0.012 + 0.072 + 0.008 + 0.016 + 0.064 = <strong>0.28</strong>"],
  answer:"P(cavity) = 0.2 · P(toothache) = 0.2 · P(cavity ∧ toothache) = 0.12 · P(cavity ∨ toothache) = 0.28",
  check:"<strong>Verify with the inclusion–exclusion rule:</strong> P(a ∨ b) = P(a) + P(b) − P(a ∧ b) = 0.2 + 0.2 − 0.12 = 0.28 ✓. This is also the fastest way to catch the ∧ / ∨ mix-up — if your disjunction is smaller than either individual probability, you have summed the wrong cells."},
 mistakes:["Forgetting that a non-Boolean variable multiplies the table size by its number of values, not by 2. Weather has four values.",
 "Summing the wrong cells. Write out which cells you are adding.",
 "Confusing P(a ∧ b) with P(a ∨ b) — the difference between 0.12 and 0.28 in the worked table."],
 practice:[
  {d:"Basic", q:"From the dental table above, compute P(¬cavity) and P(toothache).",
   s:"<p><strong>P(¬cavity)</strong> = 0.016 + 0.064 + 0.144 + 0.576 = <strong>0.8</strong><br><em>Check: P(cavity) + P(¬cavity) = 0.2 + 0.8 = 1 ✓</em></p><p><strong>P(toothache)</strong> = 0.108 + 0.012 + 0.016 + 0.064 = <strong>0.2</strong> — sum the four cells in the two 'toothache' columns.</p>"},
  {d:"Moderate", q:"How many entries does a full joint distribution need for 5 Boolean variables? For 10? What does this show?",
   s:"<p>5 Boolean variables → 2⁵ = <strong>32</strong> entries.<br>10 Boolean variables → 2¹⁰ = <strong>1024</strong> entries.</p><p>In general, n Boolean variables need <strong>2ⁿ</strong> entries, so the requirement grows <em>exponentially</em>. 30 variables would need over a billion numbers, each of which would have to be elicited from a domain expert.</p><p>This shows why the full joint distribution is theoretically complete but practically unusable, and motivates Bayesian networks, which exploit conditional independence to store far fewer numbers.</p>"}]},

{id:"m4t4", title:"Bayesian Networks (Belief Networks)", type:"numerical",
 priority:"high", marks:[10], src:"Chpt 3 Knowledge slides 77–83 (the CPT question is marked [10])",
 tags:["bayesian network","belief network","dag","cpt","alarm","inference","chain rule","numerical"],
 diagram:"bayesNet",
 concept:"A Bayesian network is a compact graphical representation of a full joint distribution. The graph structure encodes which variables directly influence which, and each node carries only the probabilities conditioned on its own parents.",
 formula:"Each node Xi has a conditional probability distribution  P(Xi | Parents(Xi))",
 variables:[
  {v:"Node", m:"A random variable, which may be discrete or continuous."},
  {v:"Directed link X → Y", m:"X is a <strong>parent</strong> of Y. The graph has <strong>no directed cycles</strong> — it is a directed acyclic graph (DAG)."},
  {v:"CPT", m:"Conditional Probability Table. Quantifies the effect of the parents on the node."},
  {v:"Independent values", m:"A Boolean node with k Boolean parents needs <strong>2<sup>k</sup></strong> independent values in its CPT (the complementary row is implied, so you do not double it)."}],
 whenToUse:"When the question gives a scenario with causes and effects and asks you to draw the network, count the CPT values, or compute a probability. The 'how many independent values' question is a lecture favourite and was marked 10 in the slides.",
 learn:`<div class="note"><span class="note-t">Definition — the three-part specification</span>A Bayesian network is a <strong>directed graph in which each node is annotated with quantitative probability information</strong>. The full specification is:
<ol><li>Each <strong>node</strong> corresponds to a random variable, which may be discrete or continuous.</li>
<li>A set of <strong>directed links or arrows</strong> connects pairs of nodes. If there is an arrow from X to Y, X is said to be a <strong>parent</strong> of Y. The graph has <strong>no directed cycles</strong>, and hence is a <em>directed acyclic graph (DAG)</em>.</li>
<li>Each node X<sub>i</sub> has a <strong>conditional probability distribution P(X<sub>i</sub> | Parents(X<sub>i</sub>))</strong> that quantifies the effect of the parents on the node.</li></ol></div>
<p>Also called a <strong>belief network</strong> or a <strong>probabilistic network</strong>.</p>
<h4>Counting independent CPT values</h4>
<p>For a Boolean node with <strong>k Boolean parents</strong>, the CPT needs <strong>2<sup>k</sup></strong> independent values — one per combination of parent values. (You do not need the complementary probability, since P(¬X | parents) = 1 − P(X | parents).)</p>
<div class="tw"><table><thead><tr><th>Number of parents</th><th>Independent values needed</th></tr></thead><tbody>
<tr><td>0 (a root node)</td><td>2⁰ = <strong>1</strong></td></tr>
<tr><td>1</td><td>2¹ = <strong>2</strong></td></tr>
<tr><td>2</td><td>2² = <strong>4</strong></td></tr>
<tr><td>3</td><td>2³ = <strong>8</strong></td></tr>
</tbody></table></div>`,
 understand:`<p>The compactness claim in one line: the full joint distribution over n Boolean variables needs 2<sup>n</sup> − 1 numbers, but a Bayesian network needs only the sum of 2<sup>kᵢ</sup> over the nodes. If every node has at most 2 parents, that is at most 4n numbers — <em>linear</em> instead of exponential.</p>
<p><strong>How to answer a "draw the network" question:</strong> read the scenario one sentence at a time and draw an arrow for every phrase of the form "X influences / causes / affects Y". Arrows point from cause to effect. Then check there are no cycles.</p>`,
 worked:{
  problem:"<strong>Lecture question, marked [10].</strong> Consider a situation in which we want to reason about the relationship between smoking and lung cancer. Intuitively, whether or not a person has cancer is directly influenced by whether she is exposed to second-hand smoke and whether she smokes. Both of these are affected by whether her parents smoke. Cancer reduces a person's life expectancy.<br>(i) Draw the Bayesian network. (ii) How many independent values are required to specify all the conditional probability tables (CPTs) for your network?",
  steps:[
   "<strong>(i) Identify the variables.</strong> PS = Parents Smoke, SHS = exposed to Second-Hand Smoke, S = she Smokes, C = has Cancer, RLE = Reduced Life Expectancy. Five Boolean nodes.",
   "<strong>Read off the arrows, sentence by sentence.</strong> 'Cancer is directly influenced by second-hand smoke and by whether she smokes' → SHS → C and S → C. 'Both of these are affected by whether her parents smoke' → PS → SHS and PS → S. 'Cancer reduces life expectancy' → C → RLE.",
   "<strong>The network:</strong> PS → SHS, PS → S, SHS → C, S → C, C → RLE. Check for cycles: none — it is a valid DAG. ✓",
   "<strong>(ii) Count the parents of each node.</strong> PS has 0 parents; SHS has 1 (PS); S has 1 (PS); C has 2 (SHS and S); RLE has 1 (C).",
   "<strong>Apply 2<sup>k</sup> to each node.</strong> PS: 2⁰ = 1 · SHS: 2¹ = 2 · S: 2¹ = 2 · C: 2² = 4 · RLE: 2¹ = 2",
   "<strong>Sum:</strong> 1 + 2 + 2 + 4 + 2"],
  answer:"(i) The DAG is PS → {SHS, S} → C → RLE.  (ii) 1(PS) + 2(SHS) + 2(S) + 4(C) + 2(RLE) = 11 independent values.",
  check:"<strong>Compare with the full joint distribution:</strong> five Boolean variables would need 2⁵ − 1 = 31 independent numbers. The network needs 11. That saving is exactly the point of Bayesian networks. ✓"},
 examAnswer:`<p><strong>10 marks — Draw the Bayesian network for the given scenario and count the independent CPT values.</strong> (1) Define a Bayesian network with the <strong>three-part specification</strong>: each node is a random variable; directed links connect pairs of nodes with no directed cycles, making it a DAG; each node X<sub>i</sub> has a conditional probability distribution P(X<sub>i</sub> | Parents(X<sub>i</sub>)). (2) Identify the variables from the scenario and name them. (3) <strong>Draw the DAG</strong>, taking one arrow from each phrase of the form "X influences/causes/affects Y", arrows running cause → effect. Check and state that there are no cycles. (4) For the count, <strong>tabulate node against number of parents against 2<sup>k</sup></strong>, then sum. State the rule explicitly: a Boolean node with k Boolean parents needs 2<sup>k</sup> independent values, because the complementary probability is implied by 1 − P. (5) Close by comparing with the full joint distribution — 2<sup>n</sup> − 1 values — to show the saving. <em>For the smoking/cancer network: 1 + 2 + 2 + 4 + 2 = 11, against 31 for the full joint.</em></p>`,
 mistakes:[
  "<strong>Doubling the count</strong> by including both P(X | parents) and P(¬X | parents). Only the first is independent — the other is 1 minus it.",
  "Counting 2<sup>k</sup> using the number of <em>children</em> instead of parents. It is always the parents.",
  "Drawing an arrow from effect to cause. Arrows go <em>cause → effect</em>.",
  "Creating a cycle. A Bayesian network must be a DAG.",
  "Forgetting the root node entirely — a node with no parents still needs 1 value."],
 practice:[
  {d:"Moderate", q:"<strong>The Burglary–Alarm network (lecture slides).</strong> Burglary and Earthquake both cause an Alarm; the Alarm causes JohnCalls and MaryCalls. Given P(B) = 0.001, P(E) = 0.002, and P(A | B,E) = 0.95, P(A | B,¬E) = 0.94, P(A | ¬B,E) = 0.29, P(A | ¬B,¬E) = 0.001, compute <strong>P(A = true)</strong> given no information about burglary or earthquake.",
   s:"<p>The alarm is affected only by its parents, so apply the chain rule and sum over all combinations of B and E:</p><div class='fx left'>P(A=T) = Σ<sub>B,E</sub> P(A=T | B,E) · P(B) · P(E)</div><p>Expanding the four terms:</p><p>= P(A=T | B=T,E=T)·P(B=T)·P(E=T)<br>+ P(A=T | B=T,E=F)·P(B=T)·P(E=F)<br>+ P(A=T | B=F,E=T)·P(B=F)·P(E=T)<br>+ P(A=T | B=F,E=F)·P(B=F)·P(E=F)</p><p><strong>Substituting</strong> (note P(B=F) = 0.999 and P(E=F) = 0.998):</p><p>= (0.95)(0.001)(0.002) = 0.0000019<br>+ (0.94)(0.001)(0.998) = 0.0009381<br>+ (0.29)(0.999)(0.002) = 0.0005794<br>+ (0.001)(0.999)(0.998) = 0.0009970</p><div class='ans'>P(A = true) = 0.0025164</div><p><em>Interpretation: the alarm goes off about 0.25% of the time. Note that the largest single contribution comes from the fourth term — false alarms with neither cause — simply because that combination is overwhelmingly the most likely.</em></p>"},
  {d:"Exam-level", q:"How many independent values are needed for the Burglary–Alarm network (Burglary, Earthquake → Alarm → JohnCalls, MaryCalls)? Compare with the full joint distribution.",
   s:"<p><strong>Count the parents:</strong> Burglary 0, Earthquake 0, Alarm 2 (B and E), JohnCalls 1 (A), MaryCalls 1 (A).</p><p><strong>Apply 2<sup>k</sup>:</strong><br>Burglary: 2⁰ = 1<br>Earthquake: 2⁰ = 1<br>Alarm: 2² = 4<br>JohnCalls: 2¹ = 2<br>MaryCalls: 2¹ = 2</p><div class='ans'>Total = 1 + 1 + 4 + 2 + 2 = <strong>10 independent values</strong></div><p><strong>Comparison:</strong> the full joint distribution over 5 Boolean variables needs 2⁵ − 1 = <strong>31</strong> independent values. The network needs 10 — under a third — and the saving grows dramatically with the number of variables. This is the concreteness behind the claim that Bayesian networks 'can represent essentially any full joint probability distribution, and in many cases can do so very concisely'.</p>"}]},

{id:"q_m1", module:"m1", title:"Module 1 — Fundamentals of AI and Agents", questions:[
 {type:"mcq", t:"m1t1", q:"Who coined the term “Artificial Intelligence”, and in which year?",
  o:["Alan Turing, 1950","John McCarthy, 1956","Arthur Samuel, 1959","Marvin Minsky, 1965"], a:1,
  e:"John McCarthy coined the phrase in 1956 at the Dartmouth workshop. Alan Turing published “Computing Machinery and Intelligence” in 1950, which gave us the Turing Test — a different contribution."},
 {type:"mcq", t:"m1t5", q:"Which formula correctly expresses the structure of an agent?",
  o:["Agent = Sensors + Actuators","Agent = Percept + Action","Agent = Architecture + Agent Program","Agent = Knowledge Base + Inference"], a:2,
  e:"Agent = Architecture + Agent Program. The architecture is the machinery the agent runs on; the agent program is the concrete implementation of the agent function."},
 {type:"mcq", t:"m1t5", q:"The agent function maps:",
  o:["The current percept to an action","Percept sequences to actions, F : P* → A","States to real numbers","Actions to performance measures"], a:1,
  e:"The agent function maps percept <em>sequences</em> to actions: F : P* → A. The star denotes sequences, which is what allows the agent to have memory. Mapping only the current percept describes a simple reflex agent, not the general agent function."},
 {type:"tf", t:"m1t7", q:"A rational agent always produces the correct outcome.",
  o:["True","False"], a:1,
  e:"False. A rational agent selects the action <em>expected</em> to maximise its performance measure given the evidence available. Rationality is about the decision process, not the outcome — an unforeseeable event can produce a bad outcome from a perfectly rational decision."},
 {type:"mcq", t:"m1t9", q:"Which agent type is the FIRST in the ladder that can operate in a partially observable environment?",
  o:["Simple reflex agent","Model-based agent","Goal-based agent","Utility-based agent"], a:1,
  e:"The model-based agent. It maintains an internal state from percept history plus a model of how the world evolves, which lets it track aspects of the world it cannot currently see. A simple reflex agent works only in a fully observable environment."},

{id:"q_m2", module:"m2", title:"Module 2 — Problem Solving, Search and Optimization", questions:[
 {type:"mcq", t:"m2t6", q:"In A* search, the evaluation function is:",
  o:["f(n) = h(n)","f(n) = g(n)","f(n) = g(n) + h(n)","f(n) = g(n) − h(n)"], a:2,
  e:"f(n) = g(n) + h(n), where g(n) is the actual cost so far to reach n and h(n) is the estimated cost from n to the goal. f(n) = h(n) alone is greedy best-first search; f(n) = g(n) alone is uniform-cost search."},
 {type:"mcq", t:"m2t4", q:"A heuristic h(n) is admissible if:",
  o:["h(n) ≥ h*(n) for every node n","h(n) ≤ h*(n) for every node n","h(n) = h*(n) for every node n","h(n) &gt; 0 for every node n"], a:1,
  e:"h(n) ≤ h*(n) — an admissible heuristic never <em>over</em>estimates the true remaining cost h*(n). It is optimistic. This is exactly the condition that guarantees A* returns the optimal solution."},
 {type:"num", t:"m2t6", q:"In the CIA-02 graph, what is the total cost of the optimal path from a to z?",
  ans:17, tol:0,
  e:"The optimal path is a → c → d → e → z with cost 3 + 7 + 2 + 5 = 17. Compare: a–c–e–z = 18, a–b–e–z = 21, a–b–f–z = 25."},
 {type:"mcq", t:"m2t6", q:"When should A* terminate?",
  o:["As soon as the goal node is generated and placed in OPEN","When the goal node is selected for expansion (popped as minimum f)","When OPEN becomes larger than CLOSED","After a fixed number of iterations"], a:1,
  e:"A* terminates when the goal is <em>selected for expansion</em> — i.e. it is the minimum-f node in OPEN. Stopping as soon as the goal is generated is the classic error that produces a suboptimal answer (19 instead of 18 in the class example)."},
 {type:"mcq", t:"m2t12", q:"The alpha–beta pruning condition is:",
  o:["α ≤ β","α &gt; β only","α ≥ β","β ≥ 0"], a:2,
  e:"Prune when α ≥ β. Note that <em>equality</em> also prunes — in the class example, α = −4 and β = −4 at node B₂ pruned the entire right-most MAX node."},
 {type:"mcq", t:"m2t12", q:"In alpha–beta pruning, which player updates which value?",
  o:["MAX updates β, MIN updates α","MAX updates α, MIN updates β","Both update α","Both update β"], a:1,
  e:"MAX updates α (the best/highest value MAX has found so far); MIN updates β (the best/lowest value MIN has found so far). MAX wants α to increase, MIN wants β to decrease."},
 {type:"tf", t:"m2t12", q:"Alpha–beta pruning can return a different (worse) move than plain minimax.",
  o:["True","False"], a:1,
  e:"False. Alpha–beta produces the <em>same</em> optimal decision as minimax, but explores fewer nodes. It only discards branches that provably cannot affect the final choice. What <em>does</em> vary is <em>how many</em> nodes get pruned, which depends on the order children are visited."},
 {type:"mcq", t:"m2t3", q:"Which uninformed search strategy has LINEAR space complexity O(bd) while remaining complete and optimal for equal step costs?",
  o:["Breadth-first search","Depth-first search","Iterative deepening search","Depth-limited search"], a:2,
  e:"Iterative deepening search. It takes completeness and optimality from BFS but searches in a DFS manner, so space is only O(bd) rather than BFS's exponential O(b^d). DFS has linear space but is neither complete nor optimal."},
 {type:"mcq", t:"m2t3", q:"BFS uses which data structure, and DFS which?",
  o:["Stack (LIFO) and Queue (FIFO)","Queue (FIFO) and Stack (LIFO)","Both use a priority queue","Both use a stack"], a:1,
  e:"BFS enqueues nodes in FIFO (first-in, first-out) order using a queue; DFS uses a LIFO stack. This single difference produces all the other differences in completeness, optimality and space."},
 {type:"mcq", t:"m2t8", q:"Which hill-climbing variant reliably escapes local optima?",
  o:["Simple hill climbing","Steepest-ascent hill climbing","Stochastic hill climbing","Random-restart hill climbing"], a:3,
  e:"Random-restart hill climbing runs the algorithm multiple times from different randomly generated initial states, so a run trapped in a local optimum is simply abandoned and restarted. Stochastic hill climbing adds randomness in <em>which</em> uphill neighbour is chosen, but it never accepts a worse neighbour, so it can still be trapped."},
 {type:"tf", t:"m2t8", q:"Stochastic hill climbing may accept a neighbour that is worse than the current state.",
  o:["True","False"], a:1,
  e:"False. Stochastic hill climbing randomly selects among the <em>uphill</em> (better) neighbours, with greater improvement giving a higher probability of selection. It never chooses a worse neighbour. Accepting worse moves — with probability e^(ΔE/T) — is what simulated annealing does."},
 {type:"multi", t:"m2t9", q:"Select ALL three stopping criteria for simulated annealing given in the lecture.",
  o:["A given minimum value of the temperature has been reached",
     "The population has fully converged",
     "A certain number of iterations has passed without acceptance of a new solution",
     "A specified number of total iterations has been executed",
     "The heuristic value reaches zero"], a:[0,2,3],
  e:"The three criteria are: a minimum temperature reached; a number of iterations passing with no new solution accepted; a specified total number of iterations executed. Population convergence is a genetic-algorithm criterion, not an SA one."},
 {type:"mcq", t:"m2t9", q:"In simulated annealing, a bad move (ΔE &lt; 0) is accepted with probability:",
  o:["1/T","e^(ΔE/T)","ΔE × T","0 — bad moves are never accepted"], a:1,
  e:"Bad moves are accepted with probability e^(ΔE/T). As the temperature T decreases, this probability falls towards zero, so late in the run the algorithm behaves like ordinary hill climbing. Good moves (ΔE &gt; 0) are accepted unconditionally."},
 {type:"mcq", t:"m2t10", q:"In roulette-wheel selection for a genetic algorithm, an individual's chance of being selected is:",
  o:["Equal for all individuals","Directly proportional to its fitness","Inversely proportional to its fitness","Determined by its position in the population"], a:1,
  e:"Selection probability is directly proportional to fitness — more area on the wheel means more chance. Fitness ∝ area ∝ selection. Crucially it is probabilistic, so a low-fitness individual can still be selected, which preserves diversity."},
 {type:"mcq", t:"m2t11", q:"In a minimax game tree, terminal utility values are always given from whose perspective?",
  o:["MIN's perspective","MAX's perspective","Whichever player moves last","Both, alternately"], a:1,
  e:"All utility values are from MAX's perspective. In chess: Win = +1, Draw = 0, Loss = −1 for MAX. MIN then works to minimise that same number."},
 {type:"num", t:"m2t11", q:"A game tree has leaves −4, −9, 9, 6, −17, −4, −11, 7 (root MAX, level 2 MIN, level 3 MAX). What is the minimax value at the root?",
  ans:-4, tol:0,
  e:"Level 3 (MAX): max(−4,−9) = −4, max(9,6) = 9, max(−17,−4) = −4, max(−11,7) = 7. Level 2 (MIN): min(−4,9) = −4, min(−4,7) = −4. Root (MAX): max(−4,−4) = −4."},
 {type:"mcq", t:"m2t5", q:"Greedy best-first search is:",
  o:["Complete and optimal","Complete but not optimal","Neither complete nor optimal","Optimal but not complete"], a:2,
  e:"Neither. It can get stuck in loops (Iasi → Neamt → Iasi → Neamt), so it is not complete, and it ignores the cost already incurred, so it is not optimal — the Fagaras route in the Romania example is not the shortest."}
]},

{id:"q_m3", module:"m3", title:"Module 3 — Knowledge Representation and Reasoning", questions:[
 {type:"mcq", t:"m3t4", q:"Which is the correct FOL translation of “All students study mathematics”?",
  o:["∀x (Student(x) ∧ Studies(x, Maths))","∀x (Student(x) → Studies(x, Maths))","∃x (Student(x) → Studies(x, Maths))","∃x (Student(x) ∧ Studies(x, Maths))"], a:1,
  e:"∀ pairs with → . Option A claims everything in the universe is a student who studies maths — including chairs and planets. Remember the rule: “all/every” uses →, “some” uses ∧."},
 {type:"mcq", t:"m3t4", q:"Which is the correct FOL translation of “Some students play football”?",
  o:["∀x (Student(x) → Plays(x, Football))","∃x (Student(x) → Plays(x, Football))","∃x (Student(x) ∧ Plays(x, Football))","∀x (Student(x) ∧ Plays(x, Football))"], a:2,
  e:"∃ pairs with ∧. Option B is trivially satisfied by anything that is not a student, so it says almost nothing."},
 {type:"mcq", t:"m3t4", q:"Which is the correct FOL translation of “No student is lazy”?",
  o:["¬∀x (Student(x) → Lazy(x))","∀x (Student(x) → ¬Lazy(x))","∃x (Student(x) ∧ ¬Lazy(x))","¬∃x Student(x)"], a:1,
  e:"“No A are B” becomes ∀x (A(x) → ¬B(x)). Option A says “not all students are lazy”, which is much weaker — it allows some lazy students."},
 {type:"mcq", t:"m3t8", q:"In a resolution proof, deriving the empty clause □ means:",
  o:["The knowledge base is inconsistent and unusable","The negated goal contradicts the KB, so the goal is PROVED","No further inference is possible, so the goal is disproved","The goal is false"], a:1,
  e:"The empty clause signals a contradiction. Since we deliberately added ¬α, the contradiction must come from ¬α — therefore α is entailed by the KB. This is proof by refutation."},
 {type:"tf", t:"m3t8", q:"If a resolution proof cannot derive the empty clause, the goal has been proved false.",
  o:["True","False"], a:1,
  e:"False. Failing to derive □ means only that the KB does not <em>entail</em> the goal — “not provable” is not the same as “false”. This is listed in the slides as a common student mistake."},
 {type:"mcq", t:"m3t8", q:"What is the correct order of the four steps in a resolution proof?",
  o:["Negate the goal → convert to FOL → convert to CNF → resolve",
     "Convert to FOL → convert to CNF → negate the goal → draw the resolution graph",
     "Convert to CNF → convert to FOL → negate the goal → resolve",
     "Convert to FOL → negate the goal → resolve → convert to CNF"], a:1,
  e:"Step 1: conversion of facts into first-order logic. Step 2: convert FOL statements into CNF. Step 3: negate the statement to be proved (proof by contradiction). Step 4: draw the resolution graph with unification."},
 {type:"mcq", t:"m3t11", q:"Forward chaining is best described as:",
  o:["Goal-driven, top-to-bottom","Data-driven, bottom-to-top","Goal-driven, bottom-to-top","Data-driven, top-to-bottom"], a:1,
  e:"Forward chaining is data-driven and uses a down-up (bottom to top) approach: start with known facts, fire matching rules, add new facts. Its guiding question is “What can I conclude?” Backward chaining is goal-driven and up-down."},
 {type:"mcq", t:"m3t11", q:"Which inference rule forms the basis of the backward chaining process?",
  o:["Resolution","And-elimination","Modus ponens","Biconditional elimination"], a:2,
  e:"The slides state that the modus ponens inference rule is the basis for backward chaining: if both the conditional (p → q) and the antecedent (p) are true, we can infer the consequent (q) — run in reverse to reduce goals to subgoals."},
 {type:"mcq", t:"m3t10", q:"A Horn clause is a clause containing:",
  o:["Exactly one positive literal","At most one positive literal","At most one negative literal","Only negative literals"], a:1,
  e:"At most one positive literal. That is why ¬A ∨ ¬B ∨ C is a Horn clause (C is the only positive literal) and rewrites as the rule A ∧ B → C. A clause of all negative literals is also Horn."},
 {type:"mcq", t:"m3t9", q:"What does unification actually do?",
  o:["It proves the conclusion of a rule","It finds substitutions that make a rule match a fact or goal","It converts a sentence into CNF","It removes existential quantifiers"], a:1,
  e:"Unification finds the substitutions (e.g. {x/M1}) that make two expressions identical, so the appropriate rule can be applied. It does not itself prove the conclusion. Removing existential quantifiers is Skolemization."},
 {type:"mcq", t:"m3t2", q:"In the Wumpus world, perceiving a BREEZE in a square means:",
  o:["The Wumpus is in an adjacent square","There is a pit in a directly adjacent square","The gold is in this square","The agent has walked into a wall"], a:1,
  e:"Breeze indicates a pit in a directly (not diagonally) adjacent square. Stench indicates the Wumpus is adjacent, glitter means gold is in this square, and bump means the agent walked into a wall."},
 {type:"multi", t:"m3t2", q:"Select ALL properties that correctly describe the Wumpus world task environment.",
  o:["Partially observable","Fully observable","Deterministic","Stochastic","Static","Single agent"], a:[0,2,4,5],
  e:"The Wumpus world is partially observable (the agent perceives only its immediate surroundings), deterministic (outcomes are known), sequential, static (the Wumpus and pits do not move), discrete, and single agent (the Wumpus is not counted as an agent)."},
 {type:"mcq", t:"m3t14", q:"Which best captures the difference between an ontology and a knowledge graph?",
  o:["They are two names for the same thing",
     "The ontology is the grammar/schema; the knowledge graph holds the actual facts",
     "The knowledge graph defines the classes; the ontology stores instances",
     "An ontology is visual; a knowledge graph is textual"], a:1,
  e:"The ontology defines domain meaning — classes, properties, constraints — and answers “what kinds of things and links are valid?”. The knowledge graph stores connected facts about actual entities. The slide analogy: ontology = grammar/blueprint, knowledge graph = sentences/populated map."},
 {type:"mcq", t:"m3t15", q:"In an RDF triple (Riya, hasSkill, Python), what is “hasSkill”?",
  o:["A node in the graph","The labelled directed edge (the predicate)","The subject","A data property value"], a:1,
  e:"In an RDF graph the subject and object are nodes; the predicate labels the directed edge between them. So Riya and Python are nodes, and hasSkill is the edge."},
 {type:"mcq", t:"m3t15", q:"Which Semantic Web layer is used to QUERY graph data?",
  o:["RDF","RDFS","OWL","SPARQL"], a:3,
  e:"Memory aid from the slides: URI/IRI = Identify, RDF = Represent, RDFS/OWL = Describe meaning, SPARQL = Query. SPARQL retrieves RDF data by matching graph patterns."},
 {type:"mcq", t:"m3t12", q:"In a semantic network, why must “Penguin cannot fly” be stated explicitly?",
  o:["Because Penguin is not really a bird",
     "Because it is an exception to an inherited default property",
     "Because IS-A links do not support inheritance",
     "Because semantic networks cannot represent negation"], a:1,
  e:"Bird has the default property “can fly”, which Penguin would otherwise inherit through its IS-A link. Inheritance avoids repeating general properties, but exceptions must be represented explicitly — this is the standard exam point on semantic networks."},
 {type:"mcq", t:"m3t3", q:"Which of the following is NOT a proposition?",
  o:["It is raining","Rohan is intelligent","Where is Rohini?","The light is on"], a:2,
  e:"Questions, commands and opinions are not propositions, because they cannot be assigned a truth value. The slides give exactly these examples: “Where is Rohini”, “How are you”, “What is your name”."},
 {type:"mcq", t:"m3t1", q:"A knowledge-based agent uses TELL and ASK. What does TELL do?",
  o:["Queries the KB for the next action","Adds what the agent perceives to the knowledge base","Removes outdated sentences","Converts sentences to CNF"], a:1,
  e:"TELL adds a percept into the knowledge base; ASK queries the KB for what action to perform. The agent then performs the chosen action."}
]},

{id:"q_m4", module:"m4", title:"Module 4 — Uncertainty and Bayesian Networks", questions:[
 {type:"mcq", t:"m4t1", q:"Which is NOT one of the three reasons the lecture gives for why logic fails in medical diagnosis?",
  o:["Laziness","Theoretical ignorance","Practical ignorance","Computational complexity"], a:3,
  e:"The three reasons are laziness (too much work to list every antecedent and consequent), theoretical ignorance (medical science has no complete theory), and practical ignorance (not all tests have been run for this patient)."},
 {type:"mcq", t:"m4t2", q:"P(cavity) = 0.2 is an example of:",
  o:["A posterior probability","A prior (unconditional) probability","A conditional probability","A joint probability"], a:1,
  e:"It is a prior or unconditional probability — belief before any evidence. P(cavity | toothache) = 0.6 would be the posterior or conditional probability."},
 {type:"mcq", t:"m4t2", q:"Bayes' rule is used to compute:",
  o:["P(effect | cause) from P(cause | effect)","P(cause | effect) from P(effect | cause)","The full joint distribution","The utility of an action"], a:1,
  e:"Bayes' rule computes the diagnostic direction P(cause | effect) from the causal direction P(effect | cause), which is the direction that is actually measurable and stable."},
 {type:"mcq", t:"m4t4", q:"A Bayesian network must be:",
  o:["An undirected graph","A directed graph that may contain cycles","A directed acyclic graph (DAG)","A tree with exactly one root"], a:2,
  e:"It is a directed graph with no directed cycles — a DAG. It may have several root nodes, so it need not be a tree."},
 {type:"num", t:"m4t4", q:"In a Bayesian network of Boolean variables, how many independent values are needed in the CPT of a node with 2 Boolean parents?",
  ans:4, tol:0,
  e:"2^k where k is the number of parents, so 2² = 4. You need one value per combination of parent values; the complementary probability is implied by 1 − P."},
 {type:"num", t:"m4t4", q:"For the network Parents-Smoke → {Second-Hand-Smoke, Smokes} → Cancer → Reduced-Life-Expectancy, how many independent values are needed in total?",
  ans:11, tol:0,
  e:"PS has 0 parents → 1; SHS has 1 → 2; S has 1 → 2; Cancer has 2 → 4; RLE has 1 → 2. Total = 1 + 2 + 2 + 4 + 2 = 11. Compare with 2⁵ − 1 = 31 for the full joint distribution."},
 {type:"mcq", t:"m4t3", q:"Why is a full joint probability distribution impractical for large domains?",
  o:["It cannot answer conditional queries","It grows exponentially — 2ⁿ entries for n Boolean variables","It requires the variables to be independent","It only works for Boolean variables"], a:1,
  e:"It can answer any query, but needs one entry per possible world: 2ⁿ for n Boolean variables. 30 variables would need over a billion numbers, each elicited from an expert. Bayesian networks exploit conditional independence to store far fewer."},
 {type:"tf", t:"m4t3", q:"If a and b are independent, then P(a ∧ b) = P(a) · P(b).",
  o:["True","False"], a:0,
  e:"True. Independence is defined by P(a | b) = P(a), P(b | a) = P(b), and equivalently P(a ∧ b) = P(a) · P(b). This is what lets a large joint distribution be factored into smaller ones."}
]}
];

const DECKS = [
{id:"fc_defs", title:"Core Definitions", desc:"The verbatim definitions most likely to open an exam answer.", cards:[
 {q:"Define an intelligent agent.", t:"m1t5",
  a:"An <strong>agent</strong> is anything that can be viewed as <em>perceiving its environment through sensors</em> and <em>acting upon that environment through actuators</em>."},
 {q:"Define a rational agent.", t:"m1t7",
  a:"For each possible percept sequence, a rational agent should select an action that is <strong>expected to maximise its performance measure</strong>, given the evidence provided by the percept sequence and whatever built-in knowledge the agent has."},
 {q:"What are the four things rationality depends on?", t:"m1t7",
  a:"<ol><li>The performance measure that defines the criterion of success</li><li>The agent's prior knowledge of the environment</li><li>The actions the agent can perform</li><li>The agent's percept sequence to date</li></ol>"},
 {q:"Define problem solving.", t:"m2t1",
  a:"The way in which an agent finds a <strong>sequence of actions that achieves its goals</strong>, when no single action will do."},
 {q:"Define a heuristic function h(n).", t:"m2t4",
  a:"An intelligent estimate or rule of thumb that <strong>guides the search towards the goal quickly</strong>. h(n) estimates the remaining cost from node n to the goal. Smaller h(n) → closer to the goal."},
 {q:"When is a heuristic admissible?", t:"m2t4",
  a:"When <strong>h(n) ≤ h*(n)</strong> for every node n, where h*(n) is the true cost to reach the goal from n. It <em>never overestimates</em> — it is optimistic. This guarantees A* finds the optimal path."},
 {q:"Define a knowledge-based agent.", t:"m3t1",
  a:"An agent that includes a <strong>knowledge base</strong> (a set of representations of facts of the world, each called a <em>sentence</em>, expressed in a knowledge representation language) and an <strong>inference system</strong> (which derives new sentences from old). It TELLs the KB what it perceives, ASKs what action to perform, then performs it."},
 {q:"Define a Horn clause.", t:"m3t10",
  a:"A clause containing <strong>at most one positive literal</strong>. e.g. ¬A ∨ ¬B ∨ C, which rewrites as the IF–THEN rule <strong>A ∧ B → C</strong>. Horn clauses allow efficient inference and form the basis of forward and backward chaining."},
 {q:"Define a semantic network.", t:"m3t12",
  a:"A graph in which <strong>nodes represent concepts, objects or classes</strong> and <strong>labelled links represent their semantic relationships</strong> (IS-A, INSTANCE-OF, HAS-A, PART-OF). It supports inheritance, but exceptions must be stated explicitly."},
 {q:"Define an ontology.", t:"m3t13",
  a:"A <strong>formal, shared specification of concepts and relationships in a domain</strong> — the schema of meaning. It defines classes, properties, relationships and constraints, provides a common vocabulary with explicit meaning, and supports consistency and reasoning."},
 {q:"Define a Bayesian network.", t:"m4t4",
  a:"A <strong>directed acyclic graph</strong> in which each node is a random variable annotated with quantitative probability information. An arrow X → Y makes X a parent of Y, and each node X<sub>i</sub> carries a conditional probability distribution <strong>P(X<sub>i</sub> | Parents(X<sub>i</sub>))</strong>."},
 {q:"Define the empty clause □ in resolution.", t:"m3t8",
  a:"A disjunction of <strong>no disjuncts</strong>. It is equivalent to <em>false</em>, because a disjunction is only true if one of its disjuncts is true. It arises from resolving two complementary literals, and signals that the negated goal contradicts the KB — so the goal is proved."}
]},
{id:"fc_formulas", title:"Formulas & Notation", desc:"Every formula you must be able to write from memory.", cards:[
 {q:"Agent function — both forms", t:"m1t5",
  a:"<div class='fx'>a = F(p),&nbsp;&nbsp;F : P → A</div>and for percept <em>sequences</em>:<div class='fx'>a<sub>k</sub> = F(p₀ p₁ p₂ … p<sub>k</sub>),&nbsp;&nbsp;F : P* → A</div>The star means “sequences of percepts” — it is what allows memory."},
 {q:"Structure of an agent", t:"m1t5", a:"<div class='fx'>Agent = Architecture + Agent Program</div><strong>Architecture</strong> = the machinery the agent executes on. <strong>Agent program</strong> = the concrete implementation of the agent function."},
 {q:"A* evaluation function — and what each term is", t:"m2t6",
  a:"<div class='fx'>f(n) = g(n) + h(n)</div><strong>g(n)</strong> = cost so far to reach n (actual).<br><strong>h(n)</strong> = estimated cost from n to the goal.<br><strong>f(n)</strong> = estimated total cost of the path through n."},
 {q:"Greedy best-first vs uniform-cost vs A* — the three evaluation functions", t:"m2t5",
  a:"<strong>Uniform-cost</strong> orders by backward cost: f(n) = g(n)<br><strong>Greedy</strong> orders by forward cost: f(n) = h(n)<br><strong>A*</strong> orders by the sum: f(n) = g(n) + h(n)"},
 {q:"Alpha–beta pruning condition", t:"m2t12",
  a:"<div class='fx'>α ≥ β ⇒ Prune</div><strong>α</strong> — for MAX, the best/highest value found so far; MAX wants it to increase.<br><strong>β</strong> — for MIN, the best/lowest value found so far; MIN wants it to decrease.<br>At the root: α = −∞, β = +∞."},
 {q:"Simulated annealing — acceptance probability", t:"m2t9",
  a:"<div class='fx'>P(accept a bad move) = e<sup>ΔE / T</sup></div>ΔE &gt; 0 → good move, accepted unconditionally.<br>ΔE &lt; 0 → bad move, accepted with the probability above.<br>As T decreases, bad moves become rarer."},
 {q:"BFS, DFS and IDS complexity", t:"m2t3",
  a:"<strong>BFS</strong>: time O(b<sup>d</sup>), space O(b<sup>d</sup>)<br><strong>DFS</strong>: time O(b<sup>m</sup>), space <strong>O(bm)</strong> — linear<br><strong>IDS</strong>: time O(b<sup>d</sup>), space <strong>O(bd)</strong> — linear<br><em>b</em> = branching factor, <em>d</em> = depth of the shallowest goal, <em>m</em> = max depth of the space."},
 {q:"Bayes' rule", t:"m4t2",
  a:"<div class='fx'>P(A | B) = P(B | A) · P(A) / P(B)</div>Derived from the product rule P(A ∧ B) = P(A|B)·P(B) = P(B|A)·P(A). Computes the <strong>diagnostic</strong> direction from the <strong>causal</strong> direction."},
 {q:"Product rule", t:"m4t2", a:"<div class='fx'>P(A ∧ B) = P(A | B) · P(B) = P(B | A) · P(A)</div>"},
 {q:"Independence — the three equivalent statements", t:"m4t3",
  a:"<div class='fx'>P(a | b) = P(a)&nbsp;&nbsp;·&nbsp;&nbsp;P(b | a) = P(b)&nbsp;&nbsp;·&nbsp;&nbsp;P(a ∧ b) = P(a) · P(b)</div>"},
 {q:"Independent CPT values for a Bayesian network node", t:"m4t4",
  a:"A Boolean node with <strong>k Boolean parents</strong> needs <strong>2<sup>k</sup></strong> independent values.<br>0 parents → 1 · 1 parent → 2 · 2 parents → 4 · 3 parents → 8<br>Total for the network = the sum over all nodes.<br><em>Do not double for the complementary row — it is implied by 1 − P.</em>"},
 {q:"Decision theory", t:"m4t1", a:"<div class='fx'>Decision Theory = Probability Theory + Utility Theory</div>Probability tells you what is likely; utility tells you what you want. Decisions need both."},
 {q:"RDF triple", t:"m3t15", a:"<div class='fx'>Triple = ( Subject , Predicate , Object )</div>e.g. (Riya, hasSkill, Python). Subject and object are <strong>nodes</strong>; the predicate is the <strong>labelled directed edge</strong>."}
]},
{id:"fc_fol", title:"FOL Conversion Patterns", desc:"The sentence patterns that appear again and again in conversion questions.", cards:[
 {q:"The O-P-Q-C mnemonic — what does it stand for?", t:"m3t4",
  a:"<strong>O</strong> = Object · <strong>P</strong> = Predicate · <strong>Q</strong> = Quantifier · <strong>C</strong> = Connective.<br>The four building blocks of any first-order logic sentence."},
 {q:"All A are B", t:"m3t4", a:"<div class='fx'>∀x [ A(x) → B(x) ]</div><strong>'every' / 'all' uses →</strong>. Using ∧ here would claim every object in the universe is an A that is B."},
 {q:"Some A are B", t:"m3t4", a:"<div class='fx'>∃x [ A(x) ∧ B(x) ]</div><strong>'some' uses ∧</strong>. Using → here would be trivially satisfied by anything that is not an A."},
 {q:"No A are B", t:"m3t4", a:"<div class='fx'>∀x [ A(x) → ¬B(x) ]</div>Not ¬∀x(A(x) → B(x)) — that only says “not all”, which is much weaker. <em>Be careful with 'No'.</em>"},
 {q:"Every A relates to some B", t:"m3t4", a:"<div class='fx'>∀x [ A(x) → ∃y ( B(y) ∧ R(x,y) ) ]</div>Note the ∃ nested <em>inside</em> the ∀ — and the ∧ that goes with it."},
 {q:"When do you need two variables?", t:"m3t4",
  a:"When the sentence mentions <strong>different people or objects</strong>.<br>“Every father loves his child” → ∀x ∀y ( Father(x,y) → Loves(x,y) )<br>Also for comparatives: “Every person who exercises is healthier than a person who does not” needs ∀x∀y."},
 {q:"Unary vs binary predicate — when to use which?", t:"m3t4",
  a:"<strong>One object → unary predicate</strong>, which expresses a <em>property</em>: Intelligent(Rhea).<br><strong>Two objects → binary predicate</strong>, which expresses a <em>relationship</em>: Likes(Rhea, AI)."},
 {q:"“A unless B”", t:"m3t4", a:"<div class='fx'>¬B → A</div>e.g. “Everyone likes McDonalds unless they are allergic to it” → ∀x ( ¬Allergic(x, McDonalds) → Likes(x, McDonalds) )"},
 {q:"“You can fool SOME of the people ALL of the time” vs “ALL of the people SOME of the time”", t:"m3t4",
  a:"<strong>Some people, all the time:</strong><br>∃x ∀t, (person(x) ∧ time(t)) ∧ can-fool(x, t)<br><br><strong>All people, some of the time:</strong><br>∀x ∃t, (person(x) ∧ time(t)) ⇒ can-fool(x, t)<br><br><em>Swapping ∃ and ∀ changes the meaning entirely — quantifier order matters.</em>"}
]},
{id:"fc_compare", title:"Key Comparisons", desc:"Every 'differentiate between' question the syllabus can ask.", cards:[
 {q:"Forward chaining vs Backward chaining", t:"m3t11",
  a:"<strong>Forward:</strong> starts from known facts · facts → conclusions · <em>data-driven</em> · down-up · “What can I conclude?” · good when many conclusions are needed.<br><br><strong>Backward:</strong> starts from the goal · goal → subgoals → facts · <em>goal-driven</em> · up-down · “What must I prove?” · good for a specific query.<br><br><em>Same knowledge base, opposite direction.</em>"},
 {q:"Propositional logic vs First-order predicate logic", t:"m3t5",
  a:"<strong>PL:</strong> small worlds · weak KR language · symbols for propositions · cannot express specialization/generalization · foundational · world contains <strong>facts</strong>.<br><br><strong>FOL:</strong> complex worlds · strong KR language · predicates with constants, variables, functions, relations · can express specialization/generalization · higher level · world contains <strong>objects, relations, functions</strong>."},
 {q:"Ontology vs Knowledge graph", t:"m3t14",
  a:"<strong>Ontology</strong> — defines domain meaning/schema · classes, properties, constraints · “Student hasSkill Skill” · answers “what kinds of things and links are valid?” · analogy: <em>grammar / blueprint</em>.<br><br><strong>Knowledge graph</strong> — stores connected facts · entities, relations, attributes · “Riya hasSkill Python” · answers “what facts are known?” · analogy: <em>sentences / populated map</em>."},
 {q:"Agent function vs Agent program", t:"m1t5",
  a:"<strong>Agent function</strong> — the abstract <em>mathematical description</em>: the mapping F : P* → A from percept sequences to actions.<br><br><strong>Agent program</strong> — the <em>concrete implementation</em> running on the agent architecture."},
 {q:"Traditional AI vs Agentic AI", t:"m1t11",
  a:"Answers questions ↔ Completes goals · Reactive ↔ Proactive · Single response ↔ Multi-step workflow · Limited memory ↔ Maintains context · No planning ↔ Plans tasks · Limited tool usage ↔ Uses APIs, browsers, databases · Requires continuous user input ↔ Acts autonomously within permissions.<br><br><em>The four LO axes: autonomy, memory, tool use, goal orientation.</em>"},
 {q:"Goal-based vs Utility-based agent", t:"m1t9",
  a:"<strong>Goal-based</strong> — knows a goal describing desirable situations, and chooses actions that <em>achieve</em> it. May need to consider long action sequences (searching and planning). e.g. Google Maps.<br><br><strong>Utility-based</strong> — adds a <strong>utility function mapping each state to a real number</strong>, so it chooses the <em>best way</em> among several alternatives that all reach the goal. e.g. Uber choosing fastest/cheapest/safest."},
 {q:"Hill climbing vs Simulated annealing", t:"m2t9",
  a:"<strong>Hill climbing</strong> never accepts a worse neighbour, so it gets trapped in local optima, plateaux and ridges.<br><br><strong>Simulated annealing</strong> accepts bad moves with probability e<sup>ΔE/T</sup>, letting it escape local optima; the frequency of bad moves decreases as T falls. If T decreases slowly enough it finds the global optimum with probability approaching 1."},
 {q:"Taxonomy vs Ontology", t:"m3t13",
  a:"<strong>Taxonomy</strong> — mostly “is-a” classification. Job → Technical Job, Management Job.<br><br><strong>Ontology</strong> — hierarchy <em>plus</em> rich relationships, properties and constraints. Student —appliesFor→ Job —requires→ Skill."},
 {q:"Prior vs Posterior probability", t:"m4t2",
  a:"<strong>Prior / unconditional</strong> — belief <em>before</em> evidence. P(cavity) = 0.2.<br><br><strong>Posterior / conditional</strong> — belief <em>after</em> evidence. P(cavity | toothache) = 0.6."},
 {q:"Uninformed vs Informed search", t:"m2t3",
  a:"<strong>Uninformed (blind)</strong> — has no information except the problem definition. BFS, DFS, DLS, IDS.<br><br><strong>Informed (heuristic)</strong> — knows where to look for the solution, using a heuristic h(n). Best-first, Greedy, A*."},
 {q:"The four types of hill climbing", t:"m2t8",
  a:"<strong>Simple</strong> — examines one neighbour at a time; moves on the first better one.<br><strong>Steepest-ascent</strong> — generates all neighbours, moves to the best.<br><strong>Stochastic</strong> — randomly picks among the <em>uphill</em> neighbours; never a worse one.<br><strong>Random-restart</strong> — repeats from different random initial states; the only one that reliably escapes local optima."}
]},
{id:"fc_traps", title:"Exam Traps", desc:"The specific errors the class notes and slides flag as most common.", cards:[
 {q:"A* trap: when exactly does the algorithm stop?", t:"m2t6",
  a:"When the goal is <strong>selected for expansion</strong> (popped as the minimum-f node) — <em>not</em> when it is first generated.<br><br>In the class example, stopping at generation gives cost <strong>19</strong>; continuing correctly gives <strong>18</strong> via S→B→E→F→G, because B and D were still in OPEN with f = 18 &lt; 19."},
 {q:"A* trap: how do you recover the final path?", t:"m2t6",
  a:"By <strong>following parent pointers backwards from the goal</strong>. The class note reads: <em>“A* makes the final path with respect to the parent node and starting from G, going in reverse.”</em><br><br>The CLOSED list is the <em>order of expansion</em>, not the path. Reading the path off CLOSED is a classic error."},
 {q:"Alpha–beta trap: does α ≥ β include equality?", t:"m2t12",
  a:"<strong>Yes.</strong> The condition is α ≥ β, so equality prunes too.<br><br>In the class example, α = −4 and β = −4 at node B₂ pruned the entire right-most MAX node and both its leaves (−11 and 7)."},
 {q:"FOL trap: what happens if you write ∀x (Student(x) ∧ Studies(x, Maths))?", t:"m3t4",
  a:"You have claimed that <strong>everything in the universe</strong> is a student who studies mathematics — including chairs and planets.<br><br>∀ needs a <em>guard</em> (→) to restrict the claim; ∃ needs a <em>witness</em> (∧) to assert both properties at once."},
 {q:"Resolution trap: what does failing to derive □ prove?", t:"m3t8",
  a:"<strong>Nothing about the truth of the goal.</strong> It shows only that the KB cannot <em>prove</em> the goal. “Not provable” ≠ “false”.<br><br>The slides list “treating a failed proof as proof that the query is false” among the common student mistakes."},
 {q:"Chaining trap: which is data-driven and which is goal-driven?", t:"m3t11",
  a:"<strong>Forward = data-driven. Backward = goal-driven.</strong><br><br>The slides explicitly list “calling backward chaining data-driven or forward chaining goal-driven” as a common mistake. Memory line: Forward asks “What can I conclude?”, backward asks “What must I prove?”"},
 {q:"Complexity trap: which search has O(bd) space?", t:"m2t3",
  a:"<strong>Iterative deepening search</strong> — O(bd), linear.<br><br>BFS has O(b<sup>d</sup>) — <em>exponential</em>. The two are easy to confuse when written quickly; the difference is whether d is a multiplier or an exponent."},
 {q:"Bayes trap: is P(A|B) the same as P(B|A)?", t:"m4t2",
  a:"<strong>No — they can differ by orders of magnitude.</strong><br><br>Meningitis causes a stiff neck 70% of the time: P(stiff neck | meningitis) = 0.7. But P(meningitis | stiff neck) ≈ 0.0014, because meningitis is so rare. Always check which direction the question asks for."},
 {q:"CPT trap: how do you count independent values?", t:"m4t4",
  a:"<strong>2<sup>k</sup> where k is the number of PARENTS</strong> — not children, and <em>not doubled</em> for the negative case.<br><br>P(¬X | parents) = 1 − P(X | parents), so it is not independent. A root node with no parents still needs 1 value."},
 {q:"Environment trap: is medical diagnosis single- or multi-agent?", t:"m1t8",
  a:"<strong>Single agent</strong>, according to the lecture's classification table — even though it is partially observable, stochastic, sequential, dynamic and continuous.<br><br>Learn that table row by row; it is the most likely source of a classification question."},
 {q:"Simulated annealing trap: is SA memory-based?", t:"m2t9",
  a:"<strong>No — SA is memoryless.</strong> The slides state it does not use any information gathered during the search.<br><br>Contrast with genetic algorithms, which carry a whole population forward between generations."}
]}
];

{id:"r1", m:"m1", title:"Module 1 — must-know definitions", items:[
 "<strong>Agent</strong> = anything that perceives its environment through <em>sensors</em> and acts upon it through <em>actuators</em>.",
 "<strong>Agent = Architecture + Agent Program.</strong> Architecture = machinery; program = implementation of the agent function.",
 "<strong>Agent function</strong> F : P* → A — maps percept <em>sequences</em> to actions. The star is what allows memory.",
 "<strong>Rational agent</strong> — for each percept sequence, selects the action <em>expected</em> to maximise its performance measure, given the evidence and built-in knowledge.",
 "<strong>Rationality depends on 4 things:</strong> performance measure · prior knowledge · possible actions · percept sequence to date.",
 "<strong>PEAS</strong> = Performance measure · Environment · Actuators · Sensors.",
 "<strong>AI term coined by John McCarthy, 1956.</strong> Turing Test proposed by Alan Turing, 1950."]},
{id:"r2", m:"m1", title:"Module 1 — the five agent types (in order)", items:[
 "<strong>Simple reflex</strong> — current percept only, condition–action rules. Needs a fully observable environment. <em>Spam filter.</em>",
 "<strong>Model-based</strong> — adds a <em>model</em> (how the world evolves) + <em>internal state</em>. Works in partially observable environments. <em>Roomba.</em>",
 "<strong>Goal-based</strong> — adds goal information; searching and planning make it proactive. <em>Google Maps.</em>",
 "<strong>Utility-based</strong> — adds a utility function mapping each state to a real number; picks the <em>best</em> way. <em>Uber.</em>",
 "<strong>Learning</strong> — four components: <em>Learning element · Critic · Performance element · Problem generator</em>. <em>ChatGPT, Netflix, Tesla FSD.</em>",
 "Ladder: reflex → <em>+memory</em> → <em>+goal</em> → <em>+preference</em> → <em>+improvement</em>."]},
{id:"r3", m:"m1", title:"Module 1 — the six environment properties", items:[
 "<strong>Fully vs Partially observable</strong> — do sensors detect everything relevant to the action choice? Chess vs driving.",
 "<strong>Deterministic vs Stochastic</strong> — is the next state fully predictable? Tic-Tac-Toe vs Mars robot. <em>Strategic</em> = deterministic except for other agents.",
 "<strong>Episodic vs Sequential</strong> — do current decisions affect the future? Mail sorting vs chess.",
 "<strong>Static vs Dynamic</strong> — does the environment change while the agent deliberates? Lawn mowing vs football. <em>Other agents make it dynamic.</em>",
 "<strong>Discrete vs Continuous</strong> — fixed time steps or constant signals? Chess vs driving.",
 "<strong>Single vs Multi-agent</strong> — competitive or co-operative. Crossword vs taxi driving.",
 "<strong>Taxi driving is 'No' on every column.</strong> Crossword puzzle is 'Yes' on every column. Medical diagnosis is <em>single</em> agent."]},
{id:"r4", m:"m2", title:"Module 2 — search algorithm cheat sheet", items:[
 "<strong>b</strong> = branching factor · <strong>d</strong> = depth of shallowest goal · <strong>m</strong> = max depth of the space.",
 "<strong>BFS</strong> — FIFO queue · complete · optimal if equal step costs · O(b<sup>d</sup>) time <em>and</em> space.",
 "<strong>DFS</strong> — LIFO stack · not complete · not optimal · O(b<sup>m</sup>) time, <strong>O(bm) space</strong>.",
 "<strong>DLS</strong> — DFS with a depth limit ℓ · incomplete if ℓ &lt; d.",
 "<strong>IDS</strong> — repeated DLS · complete · optimal if equal step costs · O(b<sup>d</sup>) time, <strong>O(bd) space</strong>. Preferred when solution depth is unknown.",
 "<strong>Greedy</strong> f(n) = h(n) — not complete (loops), not optimal, O(b<sup>m</sup>).",
 "<strong>A*</strong> f(n) = g(n) + h(n) — complete, optimal if h admissible, O(b<sup>d</sup>).",
 "<strong>Uniform-cost</strong> f(n) = g(n) — backward cost only."]},
{id:"r5", m:"m2", title:"Module 2 — A* exam procedure (do it in this order)", items:[
 "OPEN = {start} with f = 0 + h(start). CLOSED = { }.",
 "Pop the <strong>minimum f</strong> from OPEN. <strong>Tie? Take the smaller h.</strong>",
 "If it is the goal → stop. <em>Only when popped, never when merely generated.</em>",
 "Otherwise generate successors: g(child) = g(parent) + edge cost, f = g + h.",
 "If a child is already in OPEN with a larger g, <strong>update g, f and its parent pointer</strong>.",
 "Recover the path by <strong>following parent pointers backwards from the goal</strong> — not by reading the CLOSED list.",
 "<span class='badge b-high'>Trap</span> Stopping at goal generation gave 19 instead of 18 in the class example.",
 "<span class='badge b-high'>Trap</span> The CLOSED list is the order of expansion, not the path."]},
{id:"r6", m:"m2", title:"Module 2 — alpha–beta in one box", items:[
 "△ = MAX (updates <strong>α</strong>, wants it to increase, starts −∞) · ▽ = MIN (updates <strong>β</strong>, wants it to decrease, starts +∞) · □ = utilities.",
 "Traverse strictly <strong>left to right, depth-first</strong>. Carry α and β <em>down</em>; carry values <em>up</em>.",
 "After each child returns, update α or β, <em>then</em> test.",
 "<strong>Prune when α ≥ β</strong> — equality prunes too.",
 "Alpha–beta returns the <strong>same decision</strong> as minimax; only the number of nodes explored changes, and that depends on child ordering.",
 "Class answer: leaves −4, −9, 9, 6, −17, −4, −11, 7 → root <strong>−4</strong>, pruning leaf 6 and the whole last MAX node."]},
{id:"r7", m:"m2", title:"Module 2 — local search & optimization", items:[
 "<strong>Local search</strong> — the path is irrelevant; the goal state itself is the solution. e.g. n-queens.",
 "<strong>Hill climbing problems:</strong> local optima · plateau (flat, no progress) · ridges and valleys (sensitive to starting point).",
 "<strong>Four variants:</strong> simple (first better neighbour) · steepest-ascent (all neighbours, take best) · stochastic (random among <em>better</em> ones, never worse) · <strong>random-restart</strong> (the one that escapes local optima).",
 "<strong>Simulated annealing</strong> — accepts bad moves with probability <strong>e<sup>ΔE/T</sup></strong>, decreasing as T falls. <em>Memoryless</em>. Global optimum with probability → 1 if T decreases slowly enough.",
 "<strong>SA stopping criteria (3):</strong> minimum temperature reached · N iterations with no new solution accepted · specified total iterations executed.",
 "<strong>Genetic algorithm</strong> — Holland, 1970s. Population = state space · individual = solution (binary string) · fitness = evaluation function (higher is better).",
 "<strong>GA operators:</strong> selection (who reproduces) · crossover (combines two parents — exploit) · mutation (alters one gene — explore).",
 "<strong>Roulette wheel:</strong> Fitness ∝ Area ∝ Selection probability."]},
{id:"r8", m:"m3", title:"Module 3 — FOL conversion in 30 seconds", items:[
 "<strong>O-P-Q-C</strong> = Object · Predicate · Quantifier · Connective.",
 "<strong>All A are B</strong> → ∀x [ A(x) <strong>→</strong> B(x) ]",
 "<strong>Some A are B</strong> → ∃x [ A(x) <strong>∧</strong> B(x) ]",
 "<strong>No A are B</strong> → ∀x [ A(x) → <strong>¬</strong>B(x) ]",
 "<strong>Every A relates to some B</strong> → ∀x [ A(x) → ∃y ( B(y) ∧ R(x,y) ) ]",
 "<strong>'A unless B'</strong> → ¬B → A",
 "One object = unary predicate (property) · two objects = binary predicate (relationship).",
 "Different people mentioned ⇒ use two variables.",
 "<span class='badge b-high'>Trap</span> ∀ with ∧ claims it of the whole universe. ∃ with → is trivially true."]},
{id:"r9", m:"m3", title:"Module 3 — resolution in four steps", items:[
 "<strong>1.</strong> Convert the facts into first-order / propositional logic.",
 "<strong>2.</strong> Convert to CNF: eliminate ⇔ → eliminate → → move ¬ inwards (De Morgan) → rename variables → skolemize → drop ∀ → distribute.",
 "<strong>3.</strong> <strong>Negate the statement to be proved</strong> (proof by contradiction).",
 "<strong>4.</strong> Draw the resolution graph, writing the substitution {value/variable} at every step.",
 "Find complementary literals · remove them · <strong>OR</strong> the rest together · add the resolvent · repeat.",
 "<strong>☐ empty clause ⇒ PROVED.</strong> No new clauses and no ☐ ⇒ NOT PROVED.",
 "<span class='badge b-high'>Trap</span> 'Not provable' is not the same as 'false'.",
 "It is fine if some given premises are never used."]},
{id:"r10", m:"m3", title:"Module 3 — chaining & knowledge structures", items:[
 "<strong>Forward = data-driven</strong> · facts → conclusions · down-up · “What can I conclude?” · many conclusions, monitoring, alerts.",
 "<strong>Backward = goal-driven</strong> · goal → subgoals → facts · up-down · “What must I prove?” · specific query, diagnosis. Based on <strong>modus ponens</strong>.",
 "<strong>Horn clause</strong> = at most one positive literal ⇒ rewrites as A₁ ∧ … ∧ Aₙ → B ⇒ basis of both chaining methods.",
 "<strong>Unification</strong> finds substitutions so a rule matches a fact. It does <em>not</em> prove the conclusion.",
 "<strong>Semantic network</strong> — nodes = concepts, labelled links = relationships (IS-A, HAS-A). Supports inheritance; <strong>exceptions must be explicit</strong> (Penguin cannot fly).",
 "<strong>Ontology</strong> = schema of meaning: classes, individuals, object properties, data properties, constraints. <em>Grammar.</em>",
 "<strong>Knowledge graph</strong> = connected facts as triples. <em>Sentences.</em>",
 "<strong>Semantic Web stack:</strong> URI/IRI = Identify · RDF = Represent · RDFS/OWL = Describe meaning · SPARQL = Query."]},
{id:"r11", m:"m4", title:"Module 4 — uncertainty & Bayesian networks", items:[
 "<strong>Why logic fails (3 reasons):</strong> laziness · theoretical ignorance · practical ignorance.",
 "<strong>Decision Theory = Probability Theory + Utility Theory.</strong>",
 "<strong>Prior</strong> P(cavity) = 0.2 — before evidence. <strong>Posterior</strong> P(cavity | toothache) = 0.6 — after evidence.",
 "<strong>Product rule:</strong> P(A ∧ B) = P(A|B)·P(B) = P(B|A)·P(A).",
 "<strong>Bayes' rule:</strong> P(A|B) = P(B|A)·P(A) / P(B). Computes the <em>diagnostic</em> direction from the <em>causal</em> one.",
 "<strong>Full joint distribution</strong> answers any query by summing cells, but needs 2ⁿ entries — intractable.",
