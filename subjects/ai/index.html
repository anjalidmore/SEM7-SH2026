  {v:"P(A)", m:"<strong>Prior / unconditional probability</strong> — the degree of belief before any evidence. e.g. P(cavity) = 0.2."},
  {v:"P(A | B)", m:"<strong>Posterior / conditional probability</strong> — the degree of belief after observing B. e.g. P(cavity | toothache) = 0.6."},
  {v:"P(B | A)", m:"The likelihood — the causal direction, usually easier to measure or estimate."},
  {v:"P(B)", m:"The normalising constant, the total probability of the evidence."},
  {v:"Random variable", m:"A variable in probability theory. By convention their names begin with a capital letter. They may be Boolean, discrete or continuous."}],
 whenToUse:"When the question gives you P(effect | cause) and asks for P(cause | effect) — the diagnostic direction. Recognisable by phrases like 'given that the test is positive, what is the probability the patient has the disease'.",
 learn:`<h4>Two kinds of probability</h4>
<ul>
<li><strong>Unconditional / Prior probability</strong> — e.g. P(cavity) = 0.2. Belief before any evidence arrives.</li>
<li><strong>Conditional / Posterior probability</strong> — e.g. P(cavity | toothache) = 0.6. Belief after evidence.</li>
</ul>
<h4>The product rule</h4>
<div class="fx">P(A ∧ B) = P(A | B) · P(B) = P(B | A) · P(A)</div>
<h4>Bayes' rule / Bayes' theorem / Bayes' law</h4>
<p>Equating the two forms of the product rule and rearranging:</p>
<div class="fx">P(A | B) = <span style="display:inline-block;text-align:center;vertical-align:middle"><span style="border-bottom:1px solid currentColor;display:block;padding:0 .3em">P(B | A) · P(A)</span><span style="display:block">P(B)</span></span></div>
<div class="note"><span class="note-t">Applying Bayes' rule</span><strong>P(cause | effect)</strong> describes the <strong>diagnostic direction</strong>, computed from <strong>P(effect | cause)</strong>, the causal direction.</div>`,
 understand:`<p>Why this matters practically: causal knowledge is <em>stable</em> and easy to gather — "of patients who have meningitis, 70% have a stiff neck" is a fact about the disease that a study can measure once. Diagnostic knowledge — "of patients with a stiff neck, how many have meningitis?" — depends on how common meningitis currently is, so it changes with every epidemic. Bayes' rule lets you store the stable direction and compute the volatile one on demand.</p>`,
 worked:{
  problem:"A doctor knows that meningitis causes a stiff neck 70% of the time. The prior probability that a patient has meningitis is 1/50 000, and the prior probability that any patient has a stiff neck is 1%. A patient walks in with a stiff neck. What is the probability they have meningitis?",
  steps:[
   "<strong>Identify the variables.</strong> Let M = the patient has meningitis, S = the patient has a stiff neck.",
   "<strong>Write down what is given.</strong> P(S | M) = 0.7 (the causal direction), P(M) = 1/50 000 = 0.00002 (prior), P(S) = 0.01 (prior).",
   "<strong>Identify what is asked.</strong> P(M | S) — the diagnostic direction. This is exactly the situation Bayes' rule is for.",
   "<strong>Apply Bayes' rule.</strong> P(M | S) = P(S | M) · P(M) / P(S)",
   "<strong>Substitute.</strong> P(M | S) = (0.7 × 0.00002) / 0.01 = 0.000014 / 0.01"],
  answer:"P(M | S) = 0.0014, i.e. about 0.14% — roughly 1 patient in 700.",
  check:"<strong>Sanity check the direction.</strong> P(S | M) = 70% but P(M | S) = 0.14%. These are wildly different, and that is correct: meningitis almost always causes a stiff neck, but a stiff neck almost never means meningitis, because meningitis is so rare. Swapping the two is the single most common error in the whole topic."},
 examAnswer:`<p><strong>5 marks — State and apply Bayes' rule.</strong> (1) Distinguish prior/unconditional probability, e.g. P(cavity) = 0.2, from posterior/conditional probability, e.g. P(cavity | toothache) = 0.6. (2) Give the product rule in both its forms and derive Bayes' rule from it by equating them and dividing by P(B). (3) State the rule: P(A|B) = P(B|A)·P(A)/P(B). (4) Explain that P(cause | effect) is the <strong>diagnostic direction</strong>, computed from P(effect | cause), the <strong>causal direction</strong> — because causal knowledge is stable and measurable while diagnostic knowledge shifts with prevalence. (5) Substitute the numbers given and state the answer with its interpretation.</p>`,
 mistakes:["Confusing P(A | B) with P(B | A). They are different numbers, often by orders of magnitude — see the sanity check above.",
 "Ignoring the prior. A small prior can overwhelm a strong likelihood.",
 "Using the prior of the wrong variable in the denominator. The denominator is the probability of the <em>evidence</em>.",
 "Mixing up prior (before evidence) and posterior (after evidence)."],
 practice:[
  {d:"Easy", q:"State whether each is a prior or a posterior probability: (a) P(cavity) = 0.2  (b) P(cavity | toothache) = 0.6.",
   s:"<p>(a) <strong>Prior / unconditional</strong> — no evidence has been observed.</p><p>(b) <strong>Posterior / conditional</strong> — the belief in a cavity <em>after</em> observing a toothache. Note that the posterior is higher, as you would expect: the evidence supports the hypothesis.</p>"},
  {d:"Moderate", q:"Derive Bayes' rule from the product rule.",
   s:"<p>The product rule can be written two ways, because conjunction is symmetric:</p><p><code>P(A ∧ B) = P(A | B) · P(B)</code> &nbsp;and&nbsp; <code>P(A ∧ B) = P(B | A) · P(A)</code></p><p>Since both equal P(A ∧ B), set them equal:</p><p><code>P(A | B) · P(B) = P(B | A) · P(A)</code></p><p>Divide both sides by P(B), assuming P(B) ≠ 0:</p><div class='ans'>P(A | B) = P(B | A) · P(A) / P(B)</div>"}]},

{id:"m4t3", title:"Joint Probability Distribution and Independence", type:"numerical",
 priority:"high", core:true, marks:[5], src:"Chpt 3 Knowledge slides 73–76",
 tags:["joint distribution","full joint","independence","inference","marginalisation","numerical"],
 concept:"The full joint probability distribution assigns a probability to every possible world. It can answer any question about the domain — you just add up the cells that match — but it grows exponentially, which is what motivates Bayesian networks.",
 formula:"P(query) = Σ (all matching cells of the full joint distribution)",
 variables:[
  {v:"Joint distribution", m:"The distribution of probability over multiple variables, e.g. Cavity and Weather together."},
  {v:"Full joint distribution", m:"The joint distribution for <em>all</em> the random variables in the domain."},
  {v:"Table size", m:"For variables Cavity, Toothache and Weather, the table has 2 × 2 × 4 = <strong>16</strong> entries. In general, the product of each variable's number of values."},
  {v:"Independence", m:"P(a | b) = P(a), P(b | a) = P(b), and P(a ∧ b) = P(a) · P(b)."}],
 whenToUse:"When the question gives a probability table and asks you to compute a marginal or a conjunction, or asks why a full joint distribution is impractical.",
 learn:`<h4>Joint and full joint distributions</h4>
<p>A <strong>joint probability distribution</strong> is a distribution of probability over multiple variables — for example the joint distribution of <em>Cavity</em> and <em>Weather</em>. The <strong>full joint probability distribution</strong> is the joint distribution for <em>all</em> the random variables. If the variables are Cavity, Toothache and Weather, the table has 2 × 2 × 4 = <strong>16 entries</strong>.</p>
<h4>The toothache / cavity / catch world</h4>
<div class="tw"><table><thead><tr><th rowspan="2"></th><th colspan="2">toothache</th><th colspan="2">¬toothache</th></tr>
<tr><th>catch</th><th>¬catch</th><th>catch</th><th>¬catch</th></tr></thead><tbody>
<tr><th>cavity</th><td>0.108</td><td>0.012</td><td>0.072</td><td>0.008</td></tr>
<tr><th>¬cavity</th><td>0.016</td><td>0.064</td><td>0.144</td><td>0.576</td></tr>
</tbody></table></div>
<p><strong>Inference using the full joint distribution table</strong> — simply sum the cells that satisfy the query:</p>
<div class="fx left">P(cavity) = 0.108 + 0.012 + 0.072 + 0.008 = <strong>0.2</strong><br>
P(cavity ∨ toothache) = 0.108 + 0.012 + 0.072 + 0.008 + 0.016 + 0.064 = <strong>0.28</strong></div>
<div class="note warn"><span class="note-t">Note on the slide</span>The lecture slide labels the second line with ∧, but the six cells being summed are the four cavity cells plus the two remaining toothache cells — that is the <strong>disjunction</strong> P(cavity ∨ toothache) = 0.28. The conjunction P(cavity ∧ toothache) would be just 0.108 + 0.012 = 0.12. Use the arithmetic, and if this comes up in the exam show your working so the summed cells are visible.</div>
<h4>Independence</h4>
<p>Factoring a large joint distribution into smaller ones using <strong>absolute independence</strong> — here, the weather is independent of one's dental problems. Independence between two propositions a and b:</p>
<div class="fx">P(a | b) = P(a)&nbsp;&nbsp;·&nbsp;&nbsp;P(b | a) = P(b)&nbsp;&nbsp;·&nbsp;&nbsp;P(a ∧ b) = P(a) · P(b)</div>
<h4>Why we need something better</h4>
<ul>
<li>The full joint distribution can answer any question about the domain, but becomes <strong>intractably large</strong> as the number of variables grows.</li>
<li>Specifying probabilities for possible worlds one by one is <strong>unnatural and tedious</strong>.</li>
<li><strong>Independence and conditional independence</strong> relationships among variables can greatly reduce the number of probabilities that need to be specified.</li>
<li>This motivates the <strong>Bayesian network</strong> — a data structure representing the dependencies among variables, which can represent essentially any full joint distribution, often very concisely.</li>
</ul>`,
 understand:`<p>The exponential blow-up is the entire argument for the next topic. With n Boolean variables the full joint table has 2<sup>n</sup> entries: 10 variables → 1 024 numbers, 30 variables → over a billion. Nobody can elicit a billion numbers from a doctor.</p>
<p>Independence is the escape hatch. If Weather is independent of dental problems, you do not need the 16-cell table — you need a 4-cell dental table and a 4-value weather table, 8 numbers instead of 16. Bayesian networks generalise exactly this trick.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Explain the full joint probability distribution and its limitation.</strong> A joint distribution gives probabilities over multiple variables; the full joint distribution covers all the random variables in the domain, with one entry per possible world (for Cavity, Toothache and Weather: 2 × 2 × 4 = 16 entries). Any query can be answered by summing the matching entries — e.g. from the dental table, P(cavity) = 0.108 + 0.012 + 0.072 + 0.008 = 0.2. <em>Limitations:</em> the table becomes intractably large as the number of variables grows, and specifying possible worlds one by one is unnatural and tedious. <em>Solution:</em> exploit independence — P(a ∧ b) = P(a)·P(b) when a and b are independent — and use a Bayesian network, which represents dependencies among variables and can encode the same full joint distribution far more concisely.</p>`,
 worked:{
  problem:"From the toothache / cavity / catch full joint distribution given above, compute (a) P(cavity), (b) P(toothache), (c) P(cavity ∧ toothache), and (d) P(cavity ∨ toothache).",
  steps:[
   "<strong>Understand the table.</strong> It has 2 × 2 × 2 = 8 cells, one per possible world over the Boolean variables Cavity, Toothache and Catch. Every cell is a complete description of the world, and all eight sum to 1.",
   "<strong>(a) P(cavity)</strong> — sum every cell in the <em>cavity</em> row, regardless of toothache and catch:<br>0.108 + 0.012 + 0.072 + 0.008 = <strong>0.2</strong>",
   "<strong>(b) P(toothache)</strong> — sum the four cells in the two <em>toothache</em> columns, regardless of cavity and catch:<br>0.108 + 0.012 + 0.016 + 0.064 = <strong>0.2</strong>",
   "<strong>(c) P(cavity ∧ toothache)</strong> — only cells that are <em>both</em> cavity and toothache, i.e. the two cells in the top-left block:<br>0.108 + 0.012 = <strong>0.12</strong>",
   "<strong>(d) P(cavity ∨ toothache)</strong> — every cell that is cavity <em>or</em> toothache, counting the overlap once. Take the four cavity cells, then add only the toothache cells not already counted:<br>0.108 + 0.012 + 0.072 + 0.008 + 0.016 + 0.064 = <strong>0.28</strong>"],
  answer:"P(cavity) = 0.2 · P(toothache) = 0.2 · P(cavity ∧ toothache) = 0.12 · P(cavity ∨ toothache) = 0.28",
  check:"<strong>Verify with the inclusion–exclusion rule:</strong> P(a ∨ b) = P(a) + P(b) − P(a ∧ b) = 0.2 + 0.2 − 0.12 = 0.28 ✓. This is also the fastest way to catch the ∧ / ∨ mix-up — if your disjunction is smaller than either individual probability, you have summed the wrong cells."},
 mistakes:["Forgetting that a non-Boolean variable multiplies the table size by its number of values, not by 2. Weather has four values.",
 "Summing the wrong cells. Write out which cells you are adding.",
 "Confusing P(a ∧ b) with P(a ∨ b) — the difference between 0.12 and 0.28 in the worked table."],
 practice:[
  {d:"Basic", q:"From the dental table above, compute P(¬cavity) and P(toothache).",
   s:"<p><strong>P(¬cavity)</strong> = 0.016 + 0.064 + 0.144 + 0.576 = <strong>0.8</strong><br><em>Check: P(cavity) + P(¬cavity) = 0.2 + 0.8 = 1 ✓</em></p><p><strong>P(toothache)</strong> = 0.108 + 0.012 + 0.016 + 0.064 = <strong>0.2</strong> — sum the four cells in the two 'toothache' columns.</p>"},
  {d:"Moderate", q:"How many entries does a full joint distribution need for 5 Boolean variables? For 10? What does this show?",
   s:"<p>5 Boolean variables → 2⁵ = <strong>32</strong> entries.<br>10 Boolean variables → 2¹⁰ = <strong>1024</strong> entries.</p><p>In general, n Boolean variables need <strong>2ⁿ</strong> entries, so the requirement grows <em>exponentially</em>. 30 variables would need over a billion numbers, each of which would have to be elicited from a domain expert.</p><p>This shows why the full joint distribution is theoretically complete but practically unusable, and motivates Bayesian networks, which exploit conditional independence to store far fewer numbers.</p>"},
  {d:"Moderate", q:`The deck (slide 9) computes P(cavity ∧ toothache) = 0.108 + 0.012 + 0.072 + 0.008 + 0.016 + 0.064 = 0.28. Is this right? Compute both P(cavity ∧ toothache) and P(cavity ∨ toothache).`,
   s:`<div class="note warn"><b>Slide error.</b> The six cells summed are every cell where cavity <b>or</b> toothache is true. So 0.28 is <b>P(cavity ∨ toothache)</b>, not the conjunction.</div>
   <b>P(cavity ∧ toothache)</b> = only the cells with both = 0.108 + 0.012 = <b>0.12</b><br>
   <b>P(cavity ∨ toothache)</b> = 0.108 + 0.012 + 0.072 + 0.008 + 0.016 + 0.064 = <b>0.28</b><br><br>
   Cross-check with axiom 3: P(cavity ∨ toothache) = P(cavity) + P(toothache) − P(cavity ∧ toothache) = 0.2 + 0.2 − 0.12 = <b>0.28</b> ✓`},
  {d:"Exam-level", q:`Using the same table, compute P(cavity | toothache ∧ catch). Does adding the catch evidence raise or lower the belief in cavity compared with toothache alone?`,
   s:`Cells where toothache ∧ catch: cavity 0.108, ¬cavity 0.016.<br>
   P(toothache ∧ catch) = 0.108 + 0.016 = 0.124<br>
   <b>P(cavity | toothache ∧ catch)</b> = 0.108 / 0.124 = <b>0.871</b> (to 3 d.p.)<br><br>
   It <b>raises</b> the belief from 0.6 (toothache alone) to 0.871. The dentist's probe catching is extra evidence pointing to a cavity — exactly the incremental reasoning that conditional probability is for.`}]},

{id:"m4t4", title:"Bayesian Networks (Belief Networks)", type:"numerical",
 priority:"high", core:true, marks:[10], src:"Chpt 3 Knowledge slides 77–83 (the CPT question is marked [10])",
 tags:["bayesian network","belief network","dag","cpt","alarm","inference","chain rule","numerical"],
 diagram:"bayesNet",
 concept:"A Bayesian network is a compact graphical representation of a full joint distribution. The graph structure encodes which variables directly influence which, and each node carries only the probabilities conditioned on its own parents.",
 formula:"Each node Xi has a conditional probability distribution  P(Xi | Parents(Xi))",
 variables:[
  {v:"Node", m:"A random variable, which may be discrete or continuous."},
  {v:"Directed link X → Y", m:"X is a <strong>parent</strong> of Y. The graph has <strong>no directed cycles</strong> — it is a directed acyclic graph (DAG)."},
  {v:"CPT", m:"Conditional Probability Table. Quantifies the effect of the parents on the node."},
  {v:"Independent values", m:"A Boolean node with k Boolean parents needs <strong>2<sup>k</sup></strong> independent values in its CPT (the complementary row is implied, so you do not double it)."}],
 whenToUse:"When the question gives a scenario with causes and effects and asks you to draw the network, count the CPT values, or compute a probability. The 'how many independent values' question is a lecture favourite and was marked 10 in the slides.",
 learn:`<div class="note"><span class="note-t">Definition — the three-part specification</span>A Bayesian network is a <strong>directed graph in which each node is annotated with quantitative probability information</strong>. The full specification is:
<ol><li>Each <strong>node</strong> corresponds to a random variable, which may be discrete or continuous.</li>
<li>A set of <strong>directed links or arrows</strong> connects pairs of nodes. If there is an arrow from X to Y, X is said to be a <strong>parent</strong> of Y. The graph has <strong>no directed cycles</strong>, and hence is a <em>directed acyclic graph (DAG)</em>.</li>
<li>Each node X<sub>i</sub> has a <strong>conditional probability distribution P(X<sub>i</sub> | Parents(X<sub>i</sub>))</strong> that quantifies the effect of the parents on the node.</li></ol></div>
<p>Also called a <strong>belief network</strong> or a <strong>probabilistic network</strong>.</p>
<h4>Counting independent CPT values</h4>
<p>For a Boolean node with <strong>k Boolean parents</strong>, the CPT needs <strong>2<sup>k</sup></strong> independent values — one per combination of parent values. (You do not need the complementary probability, since P(¬X | parents) = 1 − P(X | parents).)</p>
<div class="tw"><table><thead><tr><th>Number of parents</th><th>Independent values needed</th></tr></thead><tbody>
<tr><td>0 (a root node)</td><td>2⁰ = <strong>1</strong></td></tr>
<tr><td>1</td><td>2¹ = <strong>2</strong></td></tr>
<tr><td>2</td><td>2² = <strong>4</strong></td></tr>
<tr><td>3</td><td>2³ = <strong>8</strong></td></tr>
</tbody></table></div>`,
 understand:`<p>The compactness claim in one line: the full joint distribution over n Boolean variables needs 2<sup>n</sup> − 1 numbers, but a Bayesian network needs only the sum of 2<sup>kᵢ</sup> over the nodes. If every node has at most 2 parents, that is at most 4n numbers — <em>linear</em> instead of exponential.</p>
<p><strong>How to answer a "draw the network" question:</strong> read the scenario one sentence at a time and draw an arrow for every phrase of the form "X influences / causes / affects Y". Arrows point from cause to effect. Then check there are no cycles.</p>`,
 worked:{
  problem:"<strong>Lecture question, marked [10].</strong> Consider a situation in which we want to reason about the relationship between smoking and lung cancer. Intuitively, whether or not a person has cancer is directly influenced by whether she is exposed to second-hand smoke and whether she smokes. Both of these are affected by whether her parents smoke. Cancer reduces a person's life expectancy.<br>(i) Draw the Bayesian network. (ii) How many independent values are required to specify all the conditional probability tables (CPTs) for your network?",
  steps:[
   "<strong>(i) Identify the variables.</strong> PS = Parents Smoke, SHS = exposed to Second-Hand Smoke, S = she Smokes, C = has Cancer, RLE = Reduced Life Expectancy. Five Boolean nodes.",
   "<strong>Read off the arrows, sentence by sentence.</strong> 'Cancer is directly influenced by second-hand smoke and by whether she smokes' → SHS → C and S → C. 'Both of these are affected by whether her parents smoke' → PS → SHS and PS → S. 'Cancer reduces life expectancy' → C → RLE.",
   "<strong>The network:</strong> PS → SHS, PS → S, SHS → C, S → C, C → RLE. Check for cycles: none — it is a valid DAG. ✓",
   "<strong>(ii) Count the parents of each node.</strong> PS has 0 parents; SHS has 1 (PS); S has 1 (PS); C has 2 (SHS and S); RLE has 1 (C).",
   "<strong>Apply 2<sup>k</sup> to each node.</strong> PS: 2⁰ = 1 · SHS: 2¹ = 2 · S: 2¹ = 2 · C: 2² = 4 · RLE: 2¹ = 2",
   "<strong>Sum:</strong> 1 + 2 + 2 + 4 + 2"],
  answer:"(i) The DAG is PS → {SHS, S} → C → RLE.  (ii) 1(PS) + 2(SHS) + 2(S) + 4(C) + 2(RLE) = 11 independent values.",
  check:"<strong>Compare with the full joint distribution:</strong> five Boolean variables would need 2⁵ − 1 = 31 independent numbers. The network needs 11. That saving is exactly the point of Bayesian networks. ✓"},
 examAnswer:`<p><strong>10 marks — Draw the Bayesian network for the given scenario and count the independent CPT values.</strong> (1) Define a Bayesian network with the <strong>three-part specification</strong>: each node is a random variable; directed links connect pairs of nodes with no directed cycles, making it a DAG; each node X<sub>i</sub> has a conditional probability distribution P(X<sub>i</sub> | Parents(X<sub>i</sub>)). (2) Identify the variables from the scenario and name them. (3) <strong>Draw the DAG</strong>, taking one arrow from each phrase of the form "X influences/causes/affects Y", arrows running cause → effect. Check and state that there are no cycles. (4) For the count, <strong>tabulate node against number of parents against 2<sup>k</sup></strong>, then sum. State the rule explicitly: a Boolean node with k Boolean parents needs 2<sup>k</sup> independent values, because the complementary probability is implied by 1 − P. (5) Close by comparing with the full joint distribution — 2<sup>n</sup> − 1 values — to show the saving. <em>For the smoking/cancer network: 1 + 2 + 2 + 4 + 2 = 11, against 31 for the full joint.</em></p>`,
 mistakes:[
  "<strong>Doubling the count</strong> by including both P(X | parents) and P(¬X | parents). Only the first is independent — the other is 1 minus it.",
  "Counting 2<sup>k</sup> using the number of <em>children</em> instead of parents. It is always the parents.",
  "Drawing an arrow from effect to cause. Arrows go <em>cause → effect</em>.",
  "Creating a cycle. A Bayesian network must be a DAG.",
  "Forgetting the root node entirely — a node with no parents still needs 1 value."],
 practice:[
  {d:"Moderate", q:"<strong>The Burglary–Alarm network (lecture slides).</strong> Burglary and Earthquake both cause an Alarm; the Alarm causes JohnCalls and MaryCalls. Given P(B) = 0.001, P(E) = 0.002, and P(A | B,E) = 0.95, P(A | B,¬E) = 0.94, P(A | ¬B,E) = 0.29, P(A | ¬B,¬E) = 0.001, compute <strong>P(A = true)</strong> given no information about burglary or earthquake.",
   s:"<p>The alarm is affected only by its parents, so apply the chain rule and sum over all combinations of B and E:</p><div class='fx left'>P(A=T) = Σ<sub>B,E</sub> P(A=T | B,E) · P(B) · P(E)</div><p>Expanding the four terms:</p><p>= P(A=T | B=T,E=T)·P(B=T)·P(E=T)<br>+ P(A=T | B=T,E=F)·P(B=T)·P(E=F)<br>+ P(A=T | B=F,E=T)·P(B=F)·P(E=T)<br>+ P(A=T | B=F,E=F)·P(B=F)·P(E=F)</p><p><strong>Substituting</strong> (note P(B=F) = 0.999 and P(E=F) = 0.998):</p><p>= (0.95)(0.001)(0.002) = 0.0000019<br>+ (0.94)(0.001)(0.998) = 0.0009381<br>+ (0.29)(0.999)(0.002) = 0.0005794<br>+ (0.001)(0.999)(0.998) = 0.0009970</p><div class='ans'>P(A = true) = 0.0025164</div><p><em>Interpretation: the alarm goes off about 0.25% of the time. Note that the largest single contribution comes from the fourth term — false alarms with neither cause — simply because that combination is overwhelmingly the most likely.</em></p>"},
  {d:"Exam-level", q:"How many independent values are needed for the Burglary–Alarm network (Burglary, Earthquake → Alarm → JohnCalls, MaryCalls)? Compare with the full joint distribution.",
   s:"<p><strong>Count the parents:</strong> Burglary 0, Earthquake 0, Alarm 2 (B and E), JohnCalls 1 (A), MaryCalls 1 (A).</p><p><strong>Apply 2<sup>k</sup>:</strong><br>Burglary: 2⁰ = 1<br>Earthquake: 2⁰ = 1<br>Alarm: 2² = 4<br>JohnCalls: 2¹ = 2<br>MaryCalls: 2¹ = 2</p><div class='ans'>Total = 1 + 1 + 4 + 2 + 2 = <strong>10 independent values</strong></div><p><strong>Comparison:</strong> the full joint distribution over 5 Boolean variables needs 2⁵ − 1 = <strong>31</strong> independent values. The network needs 10 — under a third — and the saving grows dramatically with the number of variables. This is the concreteness behind the claim that Bayesian networks 'can represent essentially any full joint probability distribution, and in many cases can do so very concisely'.</p>"},
  {d:"Moderate", q:`Industrial machine monitoring (slide 19): whether a machine overheats is directly influenced by whether it is overloaded and whether its cooling system has failed. Both are influenced by whether the machine receives regular maintenance. Overheating may cause the machine to shut down. All variables are Boolean. (i) Draw the network [5]. (ii) Count the independent CPT values [5].`,
   s:`<div class="dia"><svg viewBox="0 0 540 310" role="img" aria-label="Industrial machine monitoring Bayesian network"><defs><marker id="arw_bn_machine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M235.125 53 L149.875 97" class="de " marker-end="url(#arw_bn_machine)"/><path d="M304.875 53 L390.125 97" class="de " marker-end="url(#arw_bn_machine)"/><path d="M149.875 133 L235.125 177" class="de " marker-end="url(#arw_bn_machine)"/><path d="M390.125 133 L304.875 177" class="de " marker-end="url(#arw_bn_machine)"/><path d="M270 213 L270 257" class="de " marker-end="url(#arw_bn_machine)"/><rect x="181" y="17" width="178" height="36" rx="7" class="dn acc"/><text x="270" y="35" class="dnt">Maintenance (M)</text><rect x="26" y="97" width="178" height="36" rx="7" class="dn "/><text x="115" y="115" class="dnt">Overload (O)</text><rect x="336" y="97" width="178" height="36" rx="7" class="dn "/><text x="425" y="115" class="dnt">Cooling failure (C)</text><rect x="181" y="177" width="178" height="36" rx="7" class="dn "/><text x="270" y="195" class="dnt">Overheating (H)</text><rect x="181" y="257" width="178" height="36" rx="7" class="dn good"/><text x="270" y="275" class="dnt">Shutdown (S)</text></svg><div class="dia-cap">Machine monitoring · slide 19</div></div>
   <div class="scroll"><table class="t"><thead><tr><th>Variable</th><th>Parents</th><th>Independent values</th></tr></thead><tbody>
   <tr><td>Maintenance (M)</td><td>0</td><td>1</td></tr><tr><td>Overload (O)</td><td>1 (M)</td><td>2</td></tr>
   <tr><td>Cooling failure (C)</td><td>1 (M)</td><td>2</td></tr><tr><td>Overheating (H)</td><td>2 (O, C)</td><td>4</td></tr>
   <tr><td>Shutdown (S)</td><td>1 (H)</td><td>2</td></tr><tr><td><b>Total</b></td><td></td><td><b>11</b></td></tr></tbody></table></div>
   Same shape as the smoking network, so the same count — 11, against 31 for the full joint.`},
  {d:"Moderate", q:`Smart-home security (slide 22): a power failure may cause the camera to stop working and may also disable the alarm. A break-in may trigger the alarm. The homeowner receives a mobile notification depending on whether the alarm is activated and whether the internet is available. All Boolean. Draw the network and count the CPT values.`,
   s:`<div class="dia"><svg viewBox="0 0 600 290" role="img" aria-label="Smart-home security Bayesian network"><defs><marker id="arw_bn_home" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M138.85714285714286 58 L96.14285714285714 127" class="de " marker-end="url(#arw_bn_home)"/><path d="M174 58 L266 127" class="de " marker-end="url(#arw_bn_home)"/><path d="M389.42857142857144 58 L310.57142857142856 127" class="de " marker-end="url(#arw_bn_home)"/><path d="M308.85714285714283 163 L381.14285714285717 232" class="de " marker-end="url(#arw_bn_home)"/><path d="M491.14285714285717 163 L418.85714285714283 232" class="de " marker-end="url(#arw_bn_home)"/><rect x="76" y="22" width="148" height="36" rx="7" class="dn acc"/><text x="150" y="40" class="dnt">Power failure (P)</text><rect x="336" y="22" width="148" height="36" rx="7" class="dn acc"/><text x="410" y="40" class="dnt">Break-in (B)</text><rect x="11" y="127" width="148" height="36" rx="7" class="dn "/><text x="85" y="145" class="dnt">Camera failure (C)</text><rect x="216" y="127" width="148" height="36" rx="7" class="dn "/><text x="290" y="145" class="dnt">Alarm (A)</text><rect x="436" y="127" width="148" height="36" rx="7" class="dn acc"/><text x="510" y="145" class="dnt">Internet (I)</text><rect x="326" y="232" width="148" height="36" rx="7" class="dn good"/><text x="400" y="250" class="dnt">Notification (N)</text></svg><div class="dia-cap">Smart-home security · slide 23</div></div>
   <div class="scroll"><table class="t"><thead><tr><th>Variable</th><th>Parents</th><th>Independent values</th></tr></thead><tbody>
   <tr><td>Power failure (P)</td><td>—</td><td>1</td></tr><tr><td>Break-in (B)</td><td>—</td><td>1</td></tr>
   <tr><td>Internet (I)</td><td>—</td><td>1</td></tr><tr><td>Camera failure (C)</td><td>P</td><td>2</td></tr>
   <tr><td>Alarm (A)</td><td>P, B</td><td>4</td></tr><tr><td>Notification (N)</td><td>A, I</td><td>4</td></tr>
   <tr><td><b>Total</b></td><td></td><td><b>13</b></td></tr></tbody></table></div>
   Full joint over 6 Boolean variables: 2<sup>6</sup> − 1 = 63. Note Internet is a <b>root</b> — nothing in the story influences it — and still costs 1.`},
  {d:"Exam-level", q:`Extension: in the dental domain, Weather has 4 values (sunny, rainy, cloudy, snow) and no parents. How many independent values does its table need? Why does the full joint over Cavity, Toothache and Weather have 16 entries but only 15 independent values?`,
   s:`A node with |X| values and no parents needs <b>|X| − 1 = 3</b> independent values — the fourth is 1 minus the other three.<br><br>
   The full joint has 2 × 2 × 4 = <b>16</b> cells (Uncertainty slide 8). They must sum to 1, so <b>15</b> are independent.<br><br>
   If Weather is independent of the dental variables, the joint factors into a dental table (2×2 = 4 cells, 3 independent) and a weather table (4 cells, 3 independent): <b>6</b> independent values instead of 15.<br>
   <i>This extends the deck's Boolean-only formula to a multi-valued variable — the deck itself only counts Boolean networks.</i>`}]},

{id:"m4t6", title:"Constructing a Bayesian Network and Counting CPT Values", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 4 Uncertainty slides 18–23 (three exam-style questions)",
 tags:["constructing","bayesian","network","counting","cpt","values"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Describe a procedure for constructing a Bayesian network from a verbal description, and state how to count the independent values needed for all CPTs.</div>
<p>All three exam-style questions in the deck (smoking/cancer, machine monitoring, smart-home security) follow the same pattern, worth 5 + 5 marks: <b>(i) draw the network, (ii) count the independent CPT values</b>.</p>
<h4>Construction procedure</h4>
<ol class="wsteps">
<li><b>List the variables.</b> Underline every noun phrase that can be true or false: "overloaded", "cooling failed", "overheats", "shuts down"…</li>
<li><b>Find root causes.</b> Variables that nothing in the story influences become nodes with no parents (Maintenance, Parents smoke, Power failure, Break-in, Internet).</li>
<li><b>Add an arrow for every "directly influenced by", "affects", "may cause", "triggers", "depending on".</b> The arrow points from the influence to the thing influenced.</li>
<li><b>Check it is a DAG</b> — no directed cycles.</li>
<li><b>Attach a CPT to every node</b>, one row per combination of parent values.</li></ol>
<h4>Counting independent values</h4>
<div class="formula">A Boolean node with k Boolean parents needs 2^k independent values
(one P(true) per row; P(false) = 1 − P(true) is not independent)

Total = Σ over nodes of 2^(number of parents)</div>
<div class="scroll"><table class="t"><thead><tr><th>Parents k</th><th>0</th><th>1</th><th>2</th><th>3</th></tr></thead><tbody>
<tr><td>Independent values 2<sup>k</sup></td><td>1</td><td>2</td><td>4</td><td>8</td></tr></tbody></table></div>
<p>Compare with the full joint over n Boolean variables, which needs 2<sup>n</sup> − 1 independent values. For the 5-node burglary network that is 1+1+4+2+2 = <b>10</b> instead of 2<sup>5</sup> − 1 = <b>31</b>.</p>`,
 understand:`<p>The count is the whole point of Bayesian networks: you pay 2^k per node, where k is small, instead of 2^n for the world. Saying that sentence turns a counting answer into an explanation.</p>`,
 examples:[],
 examAnswer:`<p>Draw the network first, then a table with columns Variable · Parents · Independent values, and a Total row. The deck's own model answer (slide 21) uses exactly this table.</p>
<div class="note"><span class="note-t">Diagram</span>Draw the DAG from the story with every node labelled with its full name and a short letter, e.g. Overheating (H).</div>`,
 mistakes:[`Counting 2^(k+1) — i.e. counting both P(true) and P(false). Only one is independent per row. Also: forgetting to count a root node at all; it still needs 1 value.`]},

{id:"m4t15", title:"Inference in the Burglary–Alarm Network", type:"numerical",
 priority:"high", core:true, marks:[10], src:"Chpt 4 Uncertainty slides 16–17; R&N §14.2, §14.4.1 for the diagnostic query",
 tags:["inference","burglary","alarm","network"],
 concept:`Any full-joint entry is a product of one CPT row per node. A marginal (like P(Alarm)) sums those products over the variables you were not told. A diagnostic query (P(Burglary | calls)) sums over the hidden variables for each value of the query, then normalises.`,
 formula:`<div class="fx-pre">Joint entry:    P(x₁,…,xₙ) = Π P(xᵢ | parents(Xᵢ))

Marginal:       P(A=T) = Σ_{B,E} P(A=T | B,E) · P(B) · P(E)

Diagnostic:     P(B | j, m) = α Σ_e Σ_a P(B) P(e) P(a | B, e) P(j | a) P(m | a)
                α = 1 / (value for b + value for ¬b)</div>`,
 variables:[{v:"P(B), P(E)", m:`0.001, 0.002 (priors)`},
  {v:"P(A | B,E)", m:`0.95 (b,e) · 0.94 (b,¬e) · 0.29 (¬b,e) · 0.001 (¬b,¬e)`},
  {v:"P(J | A)", m:`0.90 if alarm · 0.05 if no alarm`},
  {v:"P(M | A)", m:`0.70 if alarm · 0.01 if no alarm`},
  {v:"α", m:`normalisation constant — makes the two answers sum to 1`}],
 worked:{
  problem:`<strong>Two classic queries from the deck.</strong>`,
  steps:[`<b>Query 1 — a single joint entry (slide 16).</b> The alarm has sounded, there is neither a burglary nor an earthquake, and both John and Mary call:<br>
    P(j ∧ m ∧ a ∧ ¬b ∧ ¬e) = P(j | a) · P(m | a) · P(a | ¬b, ¬e) · P(¬b) · P(¬e)`,
   `= 0.90 × 0.70 × 0.001 × 0.999 × 0.998 = <b>0.000628</b>`,
   `<b>Query 2 — the marginal P(Alarm) (slide 17).</b> Apply the chain rule and sum over all four parent combinations:<br>
    P(A=T) = P(A|b,e)P(b)P(e) + P(A|b,¬e)P(b)P(¬e) + P(A|¬b,e)P(¬b)P(e) + P(A|¬b,¬e)P(¬b)P(¬e)`,
   `= (0.95)(0.001)(0.002) + (0.94)(0.001)(0.998) + (0.29)(0.999)(0.002) + (0.001)(0.999)(0.998)<br>
    = 0.0000019 + 0.0009381 + 0.0005794 + 0.0009970`,
   `= <b>0.0025164</b>`],
  answer:`P(j ∧ m ∧ a ∧ ¬b ∧ ¬e) = 0.000628 · P(Alarm) = 0.0025164 (about 1 in 400).`,
  check:`Each term in the marginal is a product of three numbers between 0 and 1, so each term is smaller than its smallest factor. The answer must lie between 0.001 (the alarm's false-alarm rate) and 0.95, and the prior P(¬b,¬e) ≈ 0.997 means it sits just above 0.001.`},
 learn:"",
 mistakes:[`The deck's slide 16 reports 0.00062 by truncating. Carry the product correctly: 0.9 × 0.7 × 0.001 × 0.999 × 0.998 = 0.000628.`,
  `Forgetting the P(B)·P(E) weights in the marginal — summing the four CPT entries alone gives 2.18, which is not a probability.`,
  `In a diagnostic query, dividing by the wrong thing. Compute the unnormalised value for b AND for ¬b, then divide each by their sum.`],
 practice:[
  {d:"Easy", q:`Compute P(JohnCalls = true), using P(A) = 0.0025164.`,
   s:`Sum over the alarm's two states:<br>
   P(J) = P(J | a) P(a) + P(J | ¬a) P(¬a) = 0.90 × 0.0025164 + 0.05 × 0.9974836<br>
   = 0.0022648 + 0.0498742 = <b>0.0521</b><br><br>
   John calls about 5% of the time — almost all of it from the phone-confusion false positives, not from real alarms.`},
  {d:"Moderate", q:`A burglary is happening. What is the probability that the alarm goes off, P(A | b)? And P(J | b)?`,
   s:`Earthquake is still unknown, so sum over it:<br>
   P(A | b) = P(A | b, e) P(e) + P(A | b, ¬e) P(¬e) = 0.95 × 0.002 + 0.94 × 0.998 = 0.0019 + 0.93812 = <b>0.94002</b><br><br>
   P(J | b) = P(J | a) P(a | b) + P(J | ¬a) P(¬a | b) = 0.90 × 0.94002 + 0.05 × 0.05998 = 0.846018 + 0.002999 = <b>0.849</b>`},
  {d:"Moderate", q:`The alarm is ringing. What is P(Burglary | Alarm)? Use Bayes' rule with P(A | b) = 0.94002 and P(A) = 0.0025164.`,
   s:`P(b | a) = P(a | b) P(b) / P(a) = 0.94002 × 0.001 / 0.0025164 = <b>0.374</b><br><br>
   Even with the alarm ringing, a burglary is only about 37% likely — false alarms from the large ¬burglary population (P(a | ¬b, ¬e) = 0.001 over 99.9% of houses) are comparable in number to true alarms.`},
  {d:"Exam-level", q:`Both John and Mary call. Compute P(Burglary | JohnCalls, MaryCalls) by enumeration. Show all eight terms.`,
   s:`Hidden variables: E and A. For each value of B, sum P(B) P(e) P(a | B, e) P(j | a) P(m | a) over e and a.<br><br>
   <b>B = true</b> (P(b) = 0.001):<br>
   e, a: 0.001 × 0.002 × 0.95 × 0.90 × 0.70 = 0.000001197<br>
   e, ¬a: 0.001 × 0.002 × 0.05 × 0.05 × 0.01 = 0.00000000005<br>
   ¬e, a: 0.001 × 0.998 × 0.94 × 0.90 × 0.70 = 0.000591016<br>
   ¬e, ¬a: 0.001 × 0.998 × 0.06 × 0.05 × 0.01 = 0.00000002994<br>
   Sum = <b>0.00059224</b><br><br>
   <b>B = false</b> (P(¬b) = 0.999):<br>
   e, a: 0.999 × 0.002 × 0.29 × 0.63 = 0.000365035<br>
   e, ¬a: 0.999 × 0.002 × 0.71 × 0.0005 = 0.000000709<br>
   ¬e, a: 0.999 × 0.998 × 0.001 × 0.63 = 0.000628111<br>
   ¬e, ¬a: 0.999 × 0.998 × 0.999 × 0.0005 = 0.000498002<br>
   Sum = <b>0.00149186</b><br><br>
   <b>Normalise:</b> α = 1 / (0.00059224 + 0.00149186) = 1 / 0.0020841<br>
   P(b | j, m) = 0.00059224 / 0.0020841 = <div class="answer">P(Burglary | JohnCalls, MaryCalls) ≈ 0.284</div>
   This matches Russell &amp; Norvig §14.4.1 (⟨0.284, 0.716⟩). The deck stops at the marginal P(A); this query is the textbook's next step and a natural 10-mark extension.`}]},

{id:"m4t5", title:"What is Planning? Inputs, Outputs and Classical Assumptions", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 4 Planning slides 2–11",
 tags:["planning","inputs","outputs","classical","assumptions"],
 learn:`<div class="note"><span class="note-t">Exam question</span>What is planning? State what is given to a planner, what it must output, and the typical assumptions of classical planning. Give real-world applications.</div>
<p><b>Planning</b> is a search problem that requires finding an efficient sequence of actions that transforms a system from a given starting state to the goal state. It is an activity where an agent has to come up with a sequence of actions to accomplish a target.</p>
<div class="scroll"><table class="t"><thead><tr><th>What's given</th><th>What's output</th></tr></thead><tbody>
<tr><td>• Initial state of the problem<br>• Goal state of the problem<br>• A finite set of actions, each with <b>pre-conditions</b> (conditions needed for the action to be performed) and <b>post-conditions</b> (conditions changed after it is performed)</td>
<td>A sequence of actions such that:<br>• every action matches the current system state<br>• it transforms the system from the initial state to the goal state<br>• the total cost of the actions is below a specified value</td></tr></tbody></table></div>
<h4>Typical assumptions (classical planning)</h4>
<ul class="list">
<li><b>Atomic time</b> — each action is indivisible.</li>
<li><b>No concurrent actions</b> — but actions need not be ordered with respect to each other in the plan.</li>
<li><b>Deterministic actions</b> — results are completely determined; no uncertainty in their effects.</li>
<li>The <b>agent is the sole cause of change</b> in the world.</li>
<li>The agent is <b>omniscient</b> — complete knowledge of the state of the world.</li>
<li><b>Closed-world assumption</b> — everything known to be true is in the state description; anything not listed is false.</li></ul>
<p>In environment terms: <b>fully observable, deterministic, finite, static, discrete</b>.</p>
<p>Goals are usually specified as a <b>conjunction</b> of goals to be achieved.</p>
<h4>Applications</h4>
<p>Planning in daily life (planning a trip: preparation → airline, hotel and rental car reservations → confirm), the game world (Towers of Hanoi, sliding-tile puzzle), and workflow management (assembling a computer: examine order, gather components, install motherboard, disk, network card, video card, test).</p>`,
 understand:`<p>Planning is search with a richer state description. Module 2 search treats a state as a black box; planning opens the box into logical facts, which lets the planner reason about which actions are even relevant.</p>`,
 examples:[],
 examAnswer:`<p>One-line definition, the given/output table, then the assumption list ending with 'fully observable, deterministic, finite, static, discrete' — that phrase links back to the Module 1 environment properties and examiners like seeing it.</p>`,
 mistakes:[`Saying classical planning allows uncertain action outcomes. It does not — that is what conditional planning (later in this module) adds.`]},

{id:"m4t7", title:"Representing Planning Problems: STRIPS States, Goals and Actions", type:"theory",
 priority:"high", core:true, marks:[10], src:"Chpt 4 Planning slides 12–24; R&N §10.1 and its bibliographic notes",
 tags:["representing","planning","problems","strips","states","goals"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Explain how states, goals and actions are represented in a planning language such as STRIPS. Show how an action is applied, with the Fly example, and compare STRIPS with ADL.</div>
<p>A planning language must represent <b>states, goals and actions</b>, and it must be <b>expressive</b> (easy to represent problems) yet <b>flexible</b> (easy for algorithms to manipulate).</p>
<h4>States</h4>
<p>A state is a <b>conjunction of positive literals</b>, either propositional (<code>Poor ∧ Unknown</code>) or first-order (<code>At(Plane1, Mumbai) ∧ At(Plane2, Delhi)</code>).</p>
<ul class="list"><li>First-order literals must be <b>ground and function-free</b>. Not allowed: <code>At(x, y)</code> (not ground) or <code>At(Father(Fred), Sydney)</code> (contains a function).</li>
<li><b>Closed-world assumption</b> — what is not stated is assumed false.</li></ul>
<h4>Goals</h4>
<p>A goal is a <b>partially specified state</b>. A state satisfies a goal if it contains all the atoms of the goal, and possibly others: <code>Rich ∧ Famous ∧ Miserable</code> satisfies the goal <code>Rich ∧ Famous</code>.</p>
<h4>Actions — the action schema</h4>
<ul class="list"><li><b>Action name and parameter list</b></li>
<li><b>Precondition</b> — a conjunction of function-free positive literals that must hold before the action can be executed</li>
<li><b>Effect</b> — a conjunction of function-free literals describing how the state changes. Positive literals form the <b>add list</b>, negated ones the <b>delete list</b>.</li></ul>
<div class="formula">Action( Fly(p, from, to),
  PRECOND: At(p, from) ∧ Plane(p) ∧ Airport(from) ∧ Airport(to)
  EFFECT:  ¬At(p, from) ∧ At(p, to) )</div>
<h4>Applying an action</h4>
<ol class="wsteps">
<li>Find a substitution θ for the variables of all the precondition literals with (a subset of) the literals in the current state.</li>
<li>Apply θ to the effect list.</li>
<li>Add the positive effects and remove the negated ones to generate the new state.</li></ol>
<p><b>Example.</b> Current state: <code>At(P1,MUM) ∧ At(P2,SFO) ∧ Plane(P1) ∧ Plane(P2) ∧ Airport(MUM) ∧ Airport(DEL)</code>. It satisfies the precondition with θ = {p/P1, from/MUM, to/DEL}, so <code>Fly(P1, MUM, DEL)</code> is applicable. New state:</p>
<div class="formula">At(P1,DEL) ∧ At(P2,SFO) ∧ Plane(P1) ∧ Plane(P2) ∧ Airport(MUM) ∧ Airport(DEL)</div>
<div class="note warn"><b>Slide error (Planning slide 19).</b> The slide's new state reads <code>At(P2,DEL)</code>. Fly(P1,…) moves only P1, so P2 stays at SFO — every literal not in the effect list is carried over unchanged. The corrected state is shown above.</div>
<h4>Another view — the move operator (blocks world)</h4>
<p>Applying <code>move(B, A, Fl)</code> (B is on A; move it to the floor): precondition <code>On(B,A) ∧ Clear(B) ∧ Clear(Fl)</code>. The <b>delete list</b> removes <code>On(B,A)</code>; the <b>add list</b> adds <code>On(B,Fl) ∧ Clear(A)</code>; <code>On(A,C), On(C,Fl), Clear(B)</code> are carried over <b>unchanged</b>.</p>
<h4>STRIPS vs ADL</h4>
<p><b>STRIPS</b> (Stanford Research Institute Problem Solver) is the historically important language with the restrictions above. <b>ADL</b> (Action Description Language) relaxed some of the STRIPS restrictions so that more realistic problems could be encoded.</p>
<div class="scroll"><table class="t"><thead><tr><th>STRIPS</th><th>ADL</th></tr></thead><tbody>
<tr><td>Only positive literals in states</td><td>Positive and negative literals in states</td></tr>
<tr><td>Closed-world assumption</td><td>Open-world assumption — unmentioned literals are unknown</td></tr>
<tr><td>Goals are conjunctions of ground literals</td><td>Goals may contain quantified variables and disjunctions</td></tr>
<tr><td>Effects are simple conjunctions (add/delete)</td><td>Conditional effects allowed: <code>when P: E</code></td></tr>
<tr><td>No equality, no types</td><td>Equality predicate (x = y) and typed variables</td></tr></tbody></table></div>
<div class="note"><b>Source note.</b> Slide 21 of the Planning deck, which follows the STRIPS/ADL heading, is blank in the uploaded file. The textbook confirms only that ADL relaxed STRIPS's restrictions. The comparison table is the standard one from Russell &amp; Norvig's 2nd edition, which is not among the uploads. The conditional effect <code>when AtL: CleanL</code> on Planning slide 54 is an ADL-style feature. Treat the table as background, and check with your teacher if STRIPS vs ADL is examined.</div>`,
 understand:`<p>An action schema is a rule with variables; applying it is unification (Module 3) followed by bookkeeping — delete some facts, add some, leave the rest. That last part is the frame problem solved by the closed-world assumption.</p>`,
 examples:[],
 examAnswer:`<p>State, goal, action — three short sections with one example each — then the three-step 'applying an action' procedure and a worked Fly example. For 10 marks add the STRIPS vs ADL table.</p>
<div class="note"><span class="note-t">Diagram</span>The move-operator picture is worth drawing: before state, action arrow, after state, with the delete list and add list labelled.</div>`,
 mistakes:[`Changing a literal the action never mentions (the slide-19 trap). And putting a function or an unbound variable into a state.`]},

{id:"m4t8", title:"State-Space Planning: Forward (Progression) and Backward (Regression) Search", type:"theory",
 priority:"medium", core:false, marks:[5], src:"R&N §10.2.1–10.2.2 (Fig 10.5) — the Planning deck names state-space planning but has no slides on forward/backward search",
 tags:["state-space","planning","forward","progression","backward","regression"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Explain state-space planning: forward (progression) and backward (regression) search. How is a goal regressed through an action?</div>
<div class="note warn"><b>Limited source material.</b> "State Space Planning" is a named syllabus topic. The Planning deck represents problems as states and actions (slides 14–24) and contrasts state-space search with POP (slide 28), but it has no slide on the two search directions. This answer is taken from Russell &amp; Norvig §10.2, the syllabus's first textbook.</div>
<p>Because a planning problem defines states, actions and a goal, it <b>is</b> a search problem. The declarative action schemas let us search in either direction.</p>
<h4>Forward (progression) search</h4>
<p>Start in the <b>initial state</b>; apply every applicable action to generate successors; stop when a state satisfies the goal. Any Module 2 algorithm (BFS, A*, hill climbing…) can be used.</p>
<ul class="list"><li><b>Problem 1 — irrelevant actions.</b> Buying a book with <code>Buy(isbn)</code> has ~10 billion ground actions; uninformed forward search would enumerate them.</li>
<li><b>Problem 2 — huge state spaces.</b> Air cargo with 10 airports, 5 planes and 20 pieces of cargo each has on average ~2000 actions per state.</li>
<li>So forward search needs a good heuristic to be practical.</li></ul>
<h4>Backward (regression / relevant-states) search</h4>
<p>Start at the <b>goal</b> and apply actions backward until reaching a description satisfied by the initial state. Only <b>relevant</b> actions are considered — those that achieve one of the goal's literals and undo none of them.</p>
<div class="formula">Regressing goal g through action a:

g′ = ( g − ADD(a) ) ∪ PRECOND(a)</div>
<p>The effects added by a need not have been true before; the preconditions must have been. DEL(a) does not appear, because we do not know whether those literals were true before.</p>
<div class="scroll"><table class="t"><thead><tr><th></th><th>Forward (progression)</th><th>Backward (regression)</th></tr></thead><tbody>
<tr><td>Starts from</td><td>Initial state</td><td>Goal</td></tr>
<tr><td>Searches over</td><td>Complete states</td><td>Sets of states (partial descriptions)</td></tr>
<tr><td>Actions considered</td><td>All applicable — including irrelevant ones</td><td>Only relevant ones</td></tr>
<tr><td>Main weakness</td><td>Branching factor from irrelevant actions</td><td>Harder to design heuristics for state sets</td></tr></tbody></table></div>
<p>Both produce a <b>totally ordered</b> (linear) plan — which is exactly the contrast POP draws next.</p>`,
 understand:`<p>Forward and backward planning mirror forward and backward chaining from Module 3: data-driven vs goal-driven. Regression only ever looks at actions that matter to the goal, just as backward chaining only looks at rules whose conclusion matches.</p>`,
 examples:[],
 examAnswer:`<p>A comparison table plus the regression formula with one worked line (e.g. regressing At(P1,DEL) through Fly(P1,MUM,DEL)).</p>`,
 mistakes:[`Including DEL(a) in the regression formula. Only ADD(a) is removed and PRECOND(a) added.`]},

{id:"m4t9", title:"Partial-Order Planning (POP)", type:"theory",
 priority:"high", core:true, marks:[10], src:"Chpt 4 Planning slides 25–35; R&N Figs 11.6, 11.8–11.10 (reproduced on the slides)",
 tags:["partial-order","planning","pop"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Explain partial-order planning (POP). Compare partial-order and total-order plans, list the components of a plan, and illustrate with the shoes-and-socks example.</div>
<h4>Total vs partial order</h4>
<div class="scroll"><table class="t"><thead><tr><th>Total-order plan</th><th>Partial-order plan</th></tr></thead><tbody>
<tr><td>A <b>totally ordered</b> sequence of actions (a linear plan)</td><td>A <b>partially ordered</b> set of actions — order constraints exist only where needed</td></tr>
<tr><td>Produced by state-space search</td><td>Produced by POP</td></tr>
<tr><td>Commits to an order early, even when the order does not matter</td><td><b>Least commitment</b> — works on subproblems independently, then combines subplans</td></tr></tbody></table></div>
<p>Painting a ceiling: <i>Get brush</i> and <i>Get ladder</i> must both precede <i>Paint ceiling</i>, but neither has to come first. A partial-order plan leaves them unordered; a total-order plan must pick one of the two orderings.</p>
<h4>Components of a plan</h4>
<ol class="list">
<li><b>A set of actions</b> — the steps. Two dummy actions: <i>Start</i> has the initial state as its effect; <i>Finish</i> has the goal as its precondition.</li>
<li><b>A set of ordering constraints</b> — <code>A ≺ B</code> reads "A before B", but not necessarily <i>immediately</i> before. Beware cycles: A ≺ B together with B ≺ A is a contradiction.</li>
<li><b>A set of causal links</b> (protection intervals) — <code>A —p→ B</code> reads "A achieves p for B", and p must remain true from the time A is applied to the time B is applied. Example: <code>RightSock —RightSockOn→ RightShoe</code>.</li>
<li><b>A set of open preconditions</b> — preconditions not yet achieved by any action. Planners work to reduce this set to empty without introducing contradictions.</li></ol>
<p>A precondition is <b>achieved</b> iff it is the effect of an earlier step and no possibly intervening step undoes it. A plan is <b>complete</b> iff every precondition is achieved.</p>
<div class="note"><b>Notation.</b> The slide shows "A α B" for an ordering constraint. That is a font substitution for the precedence symbol <b>≺</b>; write A ≺ B.</div>
<h4>Shoes and socks</h4>
<div class="formula">Goal(RightShoeOn ∧ LeftShoeOn)        Init()
Action(RightShoe, PRECOND: RightSockOn, EFFECT: RightShoeOn)
Action(RightSock,                       EFFECT: RightSockOn)
Action(LeftShoe,  PRECOND: LeftSockOn,  EFFECT: LeftShoeOn)
Action(LeftSock,                        EFFECT: LeftSockOn)</div>
<div class="dia"><svg viewBox="0 0 540 300" role="img" aria-label="Partial-order plan for shoes and socks"><defs><marker id="arw_pop_shoes" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M238.5 48 L161.5 92" class="de " marker-end="url(#arw_pop_shoes)"/><path d="M301.5 48 L378.5 92" class="de " marker-end="url(#arw_pop_shoes)"/><path d="M130 128 L130 177" class="de acc" marker-end="url(#arw_pop_shoes)"/><path d="M410 128 L410 177" class="de acc" marker-end="url(#arw_pop_shoes)"/><path d="M163.6 213 L236.4 252" class="de acc" marker-end="url(#arw_pop_shoes)"/><path d="M376.4 213 L303.6 252" class="de acc" marker-end="url(#arw_pop_shoes)"/><rect x="225" y="12" width="90" height="36" rx="7" class="dn acc"/><text x="270" y="30" class="dnt">Start</text><rect x="70" y="92" width="120" height="36" rx="7" class="dn "/><text x="130" y="110" class="dnt">LeftSock</text><rect x="350" y="92" width="120" height="36" rx="7" class="dn "/><text x="410" y="110" class="dnt">RightSock</text><rect x="70" y="177" width="120" height="36" rx="7" class="dn "/><text x="130" y="195" class="dnt">LeftShoe</text><rect x="350" y="177" width="120" height="36" rx="7" class="dn "/><text x="410" y="195" class="dnt">RightShoe</text><rect x="225" y="252" width="90" height="36" rx="7" class="dn good"/><text x="270" y="270" class="dnt">Finish</text><rect x="94" y="143.5" width="72" height="18" rx="4" class="delb"/><text x="130" y="152.5" class="del">LeftSockOn</text><rect x="370.9" y="143.5" width="78.2" height="18" rx="4" class="delb"/><text x="410" y="152.5" class="del">RightSockOn</text><rect x="164" y="223.5" width="72" height="18" rx="4" class="delb"/><text x="200" y="232.5" class="del">LeftShoeOn</text><rect x="300.9" y="223.5" width="78.2" height="18" rx="4" class="delb"/><text x="340" y="232.5" class="del">RightShoeOn</text></svg><div class="dia-cap">Partial-order plan: each sock is ordered before its own shoe, nothing else is ordered · Planning slide 31 (R&amp;N Fig 11.6)</div></div>
<p>The partial-order plan has <b>six linearizations</b> (total-order plans): the left pair and the right pair can interleave in 4!/(2!·2!) = 6 ways. One partial-order plan stands for all six.</p>
<h4>Resolving a conflict — the spare tire</h4>
<p>A causal link <code>A —p→ B</code> is <b>threatened</b> by any action C that could fall between A and B and has ¬p as an effect. In the spare-tire plan, choosing <i>LeaveOvernight</i> to achieve ¬At(Flat,Axle) threatens the link <code>Remove(Spare,Trunk) —At(Spare,Ground)→ PutOn(Spare,Axle)</code>, because LeaveOvernight has effect ¬At(Spare,Ground). The threat is resolved by ordering LeaveOvernight <b>before</b> Remove(Spare,Trunk). Because that leads to a dead end, the planner backtracks and chooses <i>Remove(Flat,Axle)</i> instead (worked through in the Numericals tab).</p>`,
 understand:`<p>Least commitment: never decide something you do not have to decide yet. POP orders two steps only when a causal link or a threat forces it, which is why one partial plan covers many linear ones.</p>`,
 examples:[],
 examAnswer:`<p>Comparison table, the four numbered components with the notation, then the shoes-and-socks plan drawn with causal links labelled. State 'six linearizations' for a free mark.</p>
<div class="note"><span class="note-t">Diagram</span>Mandatory. Start at top, Finish at bottom, LeftSock→LeftShoe and RightSock→RightShoe in two columns, causal-link arrows labelled with the condition they protect.</div>`,
 mistakes:[`Drawing an arrow between the left and right chains — that imposes an order the problem does not need. And calling a causal link an ordering constraint: every causal link implies an ordering, but not the other way round.`]},

{id:"m4t10", title:"Hierarchical Planning", type:"theory",
 priority:"high", core:true, marks:[10], src:"Chpt 4 Planning slides 36–49",
 tags:["hierarchical","planning"],
 learn:`<div class="note"><span class="note-t">Exam question</span>What is hierarchical planning? Explain its motivation, its general property and the planner's steps, with the 'Travelling to Goa' and 'Build House' examples.</div>
<h4>Why one level is not enough</h4>
<p>A one-level planner for "Going to Goa this Christmas" would plan at the keystroke level: switch on computer, start web browser, open the railways website, select date, select class, select train… Practical problems are too complex to be solved at one level.</p>
<p><b>How complex?</b> A cricket captain plans the order of 5 bowlers over 2 days of a Test match (180 overs). If any bowler can bowl any over, there are <b>5<sup>180</sup> ≈ 6.5 × 10<sup>125</sup></b> possibilities — far more than the ~10<sup>87</sup> particles in the universe.</p>
<div class="note warn"><b>Slide error (Planning slide 38).</b> The slide gives 5<sup>180</sup> = 2<sup>590</sup>. In fact 5<sup>180</sup> = 2<sup>180·log₂5</sup> ≈ <b>2<sup>418</sup></b> ≈ 6.5 × 10<sup>125</sup>. The conclusion (vastly more than 10<sup>87</sup>) still holds.</div>
<h4>Hierarchy of actions</h4>
<p>Actions are organised into <b>major</b> and <b>minor</b> actions. Lower-level activities detail more precise steps for accomplishing the higher-level tasks.</p>
<ul class="list"><li><b>Major steps for Goa:</b> hotel booking, ticket booking, reaching Goa, staying and enjoying there, coming back.</li>
<li><b>Minor steps:</b> take a taxi to the station/airport, have dinner on the beach, take photos.</li></ul>
<h4>Motivation</h4>
<ul class="list"><li><b>Reduces the size of the search space.</b> Instead of trying out a large number of possible orderings, plan hierarchies limit the ways an agent can select and order its primitive operators. Cricket again: plan 15 spells of 12 overs for 3 bowler categories — only 3<sup>15</sup> ≈ 1.4 × 10<sup>7</sup> top-level possibilities.</li>
<li>If the entire plan had to be synthesised at the level of the most detailed actions, it would be impossibly long.</li></ul>
<h4>General property</h4>
<p><b>Postpone attempts to solve mere details until the major steps are in place.</b> A higher-level plan may run into difficulties at a lower level, causing the need to return to the higher level to produce an appropriately ordered sequence.</p>
<h4>The planner</h4>
<ol class="list"><li>Identify a <b>hierarchy of conditions</b>.</li>
<li>Construct a plan <b>in levels</b>, postponing details to the next level.</li>
<li><b>Patch</b> higher levels as details become visible.</li></ol>
<h4>Worked example — levels of criticality</h4>
<p>Each action for "Travelling to Goa" carries a criticality level (3 = most important):</p>
<div class="scroll"><table class="t"><thead><tr><th>Level</th><th>Plan</th></tr></thead><tbody>
<tr><td>1st level (only level-3 actions)</td><td>Buy Ticket (3), Reach airport (3), Reach Goa (3)</td></tr>
<tr><td>2nd level (add level-2)</td><td>Finding flight (2), Buy Ticket (3), Get taxi (2), Reach airport (3), Boarding plane (2), Reach Goa (3)</td></tr>
<tr><td>3rd level — final (add level-1)</td><td>Opening makemytrip.com (1), Finding flight (2), Buy Ticket (3), Get taxi (2), Reach airport (3), Pay-driver (1), Check in (1), Boarding plane (2), Reach Goa (3)</td></tr></tbody></table></div>
<h4>Hierarchical decomposition and task reduction</h4>
<p><b>Build House</b> decomposes to <i>Obtain Permit</i> and <i>Hire Builder</i> → <i>Construction</i> → <i>Pay Builder</i>; <i>Construction</i> decomposes further to <i>Build Foundation</i> → <i>Build Frame</i> → (<i>Build Roof</i>, <i>Build Walls</i>) → <i>Build Interior</i>. In <b>task reduction</b>, the decomposed sub-plan must still deliver what the abstract action promised: <i>Buy Land</i> provides <i>Own Land</i> to <i>Obtain Permit</i>, <i>Get Loan</i> provides <i>Have Money</i> to <i>Pay Builder</i>, and the sub-plan as a whole provides <i>Have(House)</i> to <i>Move In</i>.</p>`,
 understand:`<p>Hierarchical planning is how people plan. You commit to 'fly to Goa' long before deciding which taxi, and you only revisit 'fly' if no taxi can get you to the airport in time — that revisit is the 'patch higher levels' step.</p>`,
 examples:[],
 examAnswer:`<p>Motivation with the cricket numbers, the general property sentence verbatim, the three planner steps, then one worked example (the Goa levels table is the cleanest). For 10 marks also draw Build House.</p>
<div class="note"><span class="note-t">Diagram</span>Draw Build House as a three-layer tree: Build House → (Obtain Permit, Hire Builder, Construction, Pay Builder) → (Foundation, Frame, Roof, Walls, Interior), with ordering arrows inside each layer.</div>`,
 mistakes:[`Quoting the slide's 2^590. Use 5^180 ≈ 10^125. And treating hierarchical planning as just a shorter plan — it is the same detailed plan reached by refining an abstract one.`]},

{id:"m4t11", title:"Task Networks: Truth and Temporal Ordering Constraints", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 4 Planning slides 50–51",
 tags:["task","networks","truth","temporal","ordering","constraints"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Define a task network. Explain truth constraints and temporal ordering constraints with the 'making a cup of tea' example.</div>
<p>A <b>task network</b> is a collection of tasks and constraints on those tasks:</p>
<div class="formula">( (n₁, α₁), …, (nₘ, αₘ), ϕ )

nᵢ  — the name of task i
αᵢ  — its label: extra information such as parameters, preconditions, effects
ϕ   — a Boolean formula expressing the constraints on the tasks</div>
<p>For a task <code>move(p1, p2)</code>, the label α could be the tuple (p1, p2).</p>
<h4>Two kinds of constraint</h4>
<ul class="list"><li><b>Temporal ordering constraint</b> — <code>n ≺ n′</code> means task n precedes n′.</li>
<li><b>Truth constraint</b> — <code>(n, p, n′)</code> means p will be true immediately after n and immediately before n′ — p must be protected between them.</li></ul>
<h4>Example — making a cup of tea</h4>
<div class="scroll"><table class="t"><thead><tr><th>Task</th><th>Description</th></tr></thead><tbody>
<tr><td>n₁</td><td>Boil water</td></tr><tr><td>n₂</td><td>Put tea bag in cup</td></tr><tr><td>n₃</td><td>Pour hot water</td></tr>
<tr><td>n₄</td><td>Steep tea</td></tr><tr><td>n₅</td><td>Add milk</td></tr><tr><td>n₆</td><td>Serve tea</td></tr></tbody></table></div>
<p><b>Temporal ordering:</b> n₁ ≺ n₃ (water must be boiled before pouring) · n₂ ≺ n₃ (tea bag placed before pouring) · n₃ ≺ n₄ ≺ n₅ ≺ n₆.</p>
<p><b>Truth constraint:</b> (n₄, TeaSteeped, n₅) — TeaSteeped must be true after Steep Tea and before Add Milk.</p>
<div class="dia"><svg viewBox="0 0 780 200" role="img" aria-label="Task network for making a cup of tea"><defs><marker id="arw_tn_tea" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M117 66.25 L173 83.75" class="de " marker-end="url(#arw_tn_tea)"/><path d="M117 133.75 L173 116.25" class="de " marker-end="url(#arw_tn_tea)"/><path d="M277 100 L323 100" class="de " marker-end="url(#arw_tn_tea)"/><path d="M427 100 L493 100" class="de acc" marker-end="url(#arw_tn_tea)"/><path d="M597 100 L653 100" class="de " marker-end="url(#arw_tn_tea)"/><rect x="13" y="29" width="104" height="42" rx="7" class="dn "/><text x="65" y="42.5" class="dnt">n1 Boil</text><text x="65" y="57.5" class="dnt sub">water</text><rect x="13" y="129" width="104" height="42" rx="7" class="dn "/><text x="65" y="142.5" class="dnt">n2 Put tea</text><text x="65" y="157.5" class="dnt sub">bag in cup</text><rect x="173" y="79" width="104" height="42" rx="7" class="dn "/><text x="225" y="92.5" class="dnt">n3 Pour</text><text x="225" y="107.5" class="dnt sub">hot water</text><rect x="323" y="79" width="104" height="42" rx="7" class="dn acc"/><text x="375" y="92.5" class="dnt">n4 Steep</text><text x="375" y="107.5" class="dnt sub">tea</text><rect x="493" y="79" width="104" height="42" rx="7" class="dn acc"/><text x="545" y="92.5" class="dnt">n5 Add</text><text x="545" y="107.5" class="dnt sub">milk</text><rect x="653" y="79" width="104" height="42" rx="7" class="dn good"/><text x="705" y="92.5" class="dnt">n6 Serve</text><text x="705" y="107.5" class="dnt sub">tea</text><rect x="424" y="91" width="72" height="18" rx="4" class="delb"/><text x="460" y="100" class="del">TeaSteeped</text></svg><div class="dia-cap">n1 and n2 are unordered with respect to each other; the labelled link is the truth constraint · Planning slide 51</div></div>
<p>A task network specifies not only <b>what</b> tasks must be performed, but also the <b>ordering</b> and <b>conditions</b> that must be maintained among them.</p>`,
 understand:`<p>A task network is a partial-order plan expressed at the task level. Temporal constraints are POP's ordering constraints; truth constraints are POP's causal links.</p>`,
 examples:[],
 examAnswer:`<p>The tuple definition with the three symbols explained, both constraint types in notation, then the tea example as a table plus the network drawing. Name one pair of tasks that can run in parallel (n₁ and n₂).</p>
<div class="note"><span class="note-t">Diagram</span>Draw the network left to right with n₁ and n₂ stacked on the left, both arrowing into n₃, then a chain to n₆; label the n₄ → n₅ arrow 'TeaSteeped'.</div>`,
 mistakes:[`Ordering n₁ before n₂ when nothing requires it — that throws away the parallelism the network is meant to show.`]},

{id:"m4t12", title:"Conditional Planning", type:"theory",
 priority:"medium", core:true, marks:[5], src:"Chpt 4 Planning slides 52–54, 74 (part C), 80",
 tags:["conditional","planning"],
 learn:`<div class="note"><span class="note-t">Exam question</span>What is conditional planning? How are action failures and conditional effects modelled? Give an example of a branching plan.</div>
<p>Classical planning assumes a known initial state and deterministic actions. Under <b>uncertainty</b>:</p>
<ul class="list"><li>The agent might not know what the initial state is.</li>
<li>The agent might not know the outcome of its actions.</li></ul>
<p>So plans have <b>branches</b> rather than being straight-line plans — they include conditional steps:</p>
<div class="formula">if &lt;test&gt; then planA else planB</div>
<p>With <b>full observability</b>, the agent knows which state it is in at execution time and does not need an explicit observation action — it simply gets plans ready for all possible contingencies.</p>
<h4>Modelling uncertainty (vacuum world)</h4>
<ul class="list"><li><b>Disjunctive effects</b> — actions sometimes fail. Moving left sometimes fails:<br><code>Action(Left, PRECOND: AtR, EFFECT: AtL ∨ AtR)</code></li>
<li><b>Conditional effects</b> — effects conditioned on secondary preconditions:<br><code>Action(Suck, PRECOND: —, EFFECT: (when AtL: CleanL) ∧ (when AtR: CleanR))</code></li>
<li><b>Both</b> — moving sometimes dumps dirt on the destination square, but only when that square is clean:<br><code>Action(Left, PRECOND: AtR, EFFECT: AtL ∨ (AtL ∧ when CleanL: ¬CleanL))</code></li></ul>
<h4>Example — interview room unavailable</h4>
<div class="dia"><svg viewBox="0 0 700 470" role="img" aria-label="Conditional plan when the interview room is unavailable"><defs><marker id="arw_cond_room" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M281 56 L162 107" class="de " marker-end="url(#arw_cond_room)"/><path d="M374.3333333333333 56 L482 107" class="de " marker-end="url(#arw_cond_room)"/><path d="M520 143 L520 189" class="de " marker-end="url(#arw_cond_room)"/><path d="M489.6666666666667 231 L416 282" class="de " marker-end="url(#arw_cond_room)"/><path d="M543.3333333333334 231 L596.6666666666666 279" class="de " marker-end="url(#arw_cond_room)"/><path d="M135.12 143 L314.88 357" class="de " marker-end="url(#arw_cond_room)"/><path d="M375.6 318 L344.4 357" class="de " marker-end="url(#arw_cond_room)"/><path d="M545 319.3965517241379 L399.6 357" class="de " marker-end="url(#arw_cond_room)"/><path d="M330 393 L330 422" class="de " marker-end="url(#arw_cond_room)"/><rect x="255" y="14" width="150" height="42" rx="7" class="dn warn"/><text x="330" y="27.5" class="dnt">Room AX112</text><text x="330" y="42.5" class="dnt sub">available?</text><rect x="45" y="107" width="150" height="36" rx="7" class="dn good"/><text x="120" y="125" class="dnt">Assign AX112</text><rect x="445" y="107" width="150" height="36" rx="7" class="dn "/><text x="520" y="125" class="dnt">Search other room</text><rect x="445" y="189" width="150" height="42" rx="7" class="dn warn"/><text x="520" y="202.5" class="dnt">Other room</text><text x="520" y="217.5" class="dnt sub">available?</text><rect x="315" y="282" width="150" height="36" rx="7" class="dn good"/><text x="390" y="300" class="dnt">Assign that room</text><rect x="545" y="279" width="150" height="42" rx="7" class="dn bad"/><text x="620" y="292.5" class="dnt">Reschedule /</text><text x="620" y="307.5" class="dnt sub">online option</text><rect x="255" y="357" width="150" height="36" rx="7" class="dn "/><text x="330" y="375" class="dnt">Update schedule</text><rect x="255" y="422" width="150" height="36" rx="7" class="dn acc"/><text x="330" y="440" class="dnt">Notify everyone</text><rect x="207.2" y="72.5" width="28.6" height="18" rx="4" class="delb"/><text x="221.5" y="81.5" class="del">YES</text><rect x="416.96666666666664" y="72.5" width="22.4" height="18" rx="4" class="delb"/><text x="428.16666666666663" y="81.5" class="del">NO</text><rect x="438.53333333333336" y="247.5" width="28.6" height="18" rx="4" class="delb"/><text x="452.83333333333337" y="256.5" class="del">YES</text><rect x="558.8" y="246" width="22.4" height="18" rx="4" class="delb"/><text x="570" y="255" class="del">NO</text></svg><div class="dia-cap">Branching plan for the placement drive when Room AX112 is unavailable · Planning slide 80</div></div>
<p>The deck's alternative model answer (slide 76) states the same idea as rules: <i>if room unavailable → find alternate room → reallocate slot → notify participants; if interviewer delayed → reschedule affected interviews → notify; if technical round cleared → schedule HR round immediately.</i></p>`,
 understand:`<p>A conditional plan is a decision tree you build before you start, so that execution never has to stop and think. Every branch must end in a state from which the goal is still reachable.</p>`,
 examples:[],
 examAnswer:`<p>Two causes of uncertainty, the if-then-else form, then the three effect types with one schema each. If the question gives a scenario, draw the branching plan — the drawing is the answer.</p>`,
 mistakes:[`Writing a straight-line plan with a note 'if it fails, retry'. The question wants an explicit branch with a test on each fork.`]},

{id:"m4t13", title:"Multi-Agent Systems and Multi-Agent Planning", type:"theory",
 priority:"high", core:true, marks:[10], src:"Chpt 4 Planning slides 55–73",
 tags:["multi-agent","systems","planning"],
 learn:`<div class="note"><span class="note-t">Exam question</span>Explain multi-agent systems and multi-agent planning: characteristics, components, architecture, types of planning (centralised, decentralised, distributed), advantages, applications and challenges.</div>
<p>A <b>Multi-Agent System (MAS)</b> consists of multiple autonomous agents that interact within a shared environment to achieve individual or common goals.</p>
<h4>Key characteristics</h4>
<ul class="list"><li><b>Multiple agents</b> — two or more agents operate in the same environment.</li>
<li><b>Autonomy</b> — each agent can observe, decide and act independently.</li>
<li><b>Interaction</b> — agents communicate or influence one another: <i>cooperative</i> (common goal), <i>competitive</i> (conflicting goals) or <i>neutral/mixed</i> (independent, limited interaction).</li></ul>
<p><b>Why MAS?</b> When a problem is too complex, large, distributed or specialised for a single agent.</p>
<h4>Components</h4>
<div class="dia"><svg viewBox="0 0 600 260" role="img" aria-label="Multi-agent planning components"><defs><marker id="arw_mas_parts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="da"/></marker></defs><path d="M300 53 L300 112" class="de both" marker-end="url(#arw_mas_parts)" marker-start="url(#arw_mas_parts)"/><path d="M264 148 L146 207" class="de both" marker-end="url(#arw_mas_parts)" marker-start="url(#arw_mas_parts)"/><path d="M336 148 L454 207" class="de both" marker-end="url(#arw_mas_parts)" marker-start="url(#arw_mas_parts)"/><rect x="225" y="17" width="150" height="36" rx="7" class="dn "/><text x="300" y="35" class="dnt">Environment</text><rect x="225" y="112" width="150" height="36" rx="7" class="dn acc"/><text x="300" y="130" class="dnt">Agents</text><rect x="35" y="207" width="150" height="36" rx="7" class="dn "/><text x="110" y="225" class="dnt">Communication</text><rect x="415" y="207" width="150" height="36" rx="7" class="dn "/><text x="490" y="225" class="dnt">Collaboration</text><rect x="236.1" y="73.5" width="127.8" height="18" rx="4" class="delb"/><text x="300" y="82.5" class="del">perception / action</text><rect x="138" y="168.5" width="134" height="18" rx="4" class="delb"/><text x="205" y="177.5" class="del">exchange information</text><rect x="321.8" y="168.5" width="146.4" height="18" rx="4" class="delb"/><text x="395" y="177.5" class="del">cooperate · coordinate</text></svg><div class="dia-cap">Agents perceive and act on a shared environment, exchange information, and collaborate · Planning slide 56</div></div>
<ol class="list"><li><b>Agents</b> — autonomous entities that perceive (sensors), decide and act (actuators/tools); may contain reasoning, planning or learning.</li>
<li><b>Environment</b> — the shared world; may be dynamic and unpredictable; one agent's actions change it for the others.</li>
<li><b>Communication</b> — message passing or shared memory/state; supports synchronisation and conflict resolution.</li>
<li><b>Collaboration</b> — task allocation, information sharing, coordination, conflict management.</li></ol>
<h4>Architecture</h4>
<p>Agents 1, 2, 3 interact with the <b>physical environment</b> (perception and action) and a <b>knowledge base</b> (query and update), exchange messages over <b>communication channels</b>, and follow a <b>collaboration strategy</b> of task allocation (by capability and requirement) and information sharing.</p>
<h4>Types of multi-agent planning</h4>
<div class="scroll"><table class="t"><thead><tr><th></th><th>Centralised</th><th>Decentralised</th><th>Distributed</th></tr></thead><tbody>
<tr><td>Who plans</td><td>One central planner for all agents, with access to the whole system state</td><td>Each agent independently, on local information; no central controller</td><td>Shared among agents, who exchange information and adjust their plans</td></tr>
<tr><td>Advantage</td><td>Easier global coordination</td><td>Robust and scalable</td><td>Balances autonomy with global coordination</td></tr>
<tr><td>Limitation</td><td>Bottleneck; single point of failure</td><td>Global coordination is difficult</td><td>Needs effective communication and conflict resolution</td></tr>
<tr><td>Example</td><td>Warehouse controller assigns routes and tasks to all robots</td><td>Autonomous vehicles each decide speed and route</td><td>Delivery agents plan their own routes but share traffic information</td></tr></tbody></table></div>
<h4>Worked case — warehouse robots</h4>
<p>Robots (id, currentLocation, task; pickItem, placeItem, avoidCollision, updatePlan) pursue a <b>primary goal</b> (fill customer orders fast) and <b>sub-goals</b> (reduce travel time, avoid collisions). <b>Action coordination</b> distributes tasks, calculates paths and synchronises actions so two robots never collide or pick the same item. <b>Knowledge sharing</b> goes through a <b>centralised database</b> of robot locations, item locations and order status. <b>Adaptation</b> updates plans in real time for new orders or moved items.</p>
<h4>Concurrency — the doubles tennis problem</h4>
<p>Two actors A and B play together; each action takes the actor as an argument, e.g. <code>Hit(actor, Ball)</code>, <code>Go(actor, to)</code>. One valid joint plan: <b>A: [Go(A, RightBaseline), Hit(A, Ball)] · B: [NoOp(B), NoOp(B)]</b>. A <b>concurrency constraint</b> prevents both hitting at once: <code>Hit(a, Ball)</code> has <code>CONCURRENT: b ≠ a ⇒ ¬Hit(b, Ball)</code>.</p>
<h4>Advantages · applications · challenges</h4>
<ul class="list"><li><b>Advantages:</b> efficiency (tasks divided), robustness (works despite some agent faults), scalability (easy to add agents), flexibility (fast reaction to change).</li>
<li><b>Applications:</b> coordinating multiple robots, traffic-flow optimisation, supply-chain logistics, strategy agents in multiplayer games, smart grids.</li>
<li><b>Challenges:</b> communication overhead, scalability concerns, coordination complexity, privacy and security.</li></ul>`,
 understand:`<p>The three planning types are a dial for where the plan lives: in one head (centralised), in every head separately (decentralised), or in every head with shared notes (distributed). Choose by asking what breaks if one agent fails.</p>`,
 examples:[],
 examAnswer:`<p>Definition, characteristics, the components diagram, then the three-column comparison table — that table alone is worth 4–5 marks. Close with one application and one challenge.</p>
