<tr><td>Disjunction</td><td>P ∨ Q</td><td>OR</td><td>"Richa is a doctor or engineer" → P ∨ Q</td></tr>
<tr><td>Implication</td><td>P → Q</td><td>if–then</td><td>"If it is raining, then the street is wet"</td></tr>
<tr><td>Biconditional</td><td>P ⇔ Q</td><td>if and only if</td><td>"If I am breathing, then I am alive"</td></tr>
</tbody></table></div>
<h4>Worked conversions from the lecture</h4>
<div class="tw"><table><thead><tr><th>English</th><th>Propositional logic</th><th>Type</th></tr></thead><tbody>
<tr><td>It is raining.</td><td>P</td><td>Simple statement</td></tr>
<tr><td>It is not raining.</td><td>¬P</td><td>Negation</td></tr>
<tr><td>It is raining and it is cold.</td><td>P ∧ Q</td><td>Conjunction</td></tr>
<tr><td>It is raining or it is cold.</td><td>P ∨ Q</td><td>Disjunction</td></tr>
<tr><td>If it is raining, then the ground is wet.</td><td>P → Q</td><td>Implication</td></tr>
<tr><td>The light is on if and only if the switch is pressed.</td><td>P ↔ Q</td><td>Biconditional</td></tr>
</tbody></table></div>`,
 understand:`<p>Always <strong>define your propositional symbols before using them</strong> — "Let P = it is raining, Q = the ground is wet". Answers that jump straight to <code>P → Q</code> without the legend lose marks even when the logic is right.</p>
<p>Watch for the word "unless": <em>A unless B</em> becomes <code>¬B → A</code>.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Explain propositional logic with its connectives.</strong> Propositional logic (Boolean logic) uses symbolic variables to represent propositions, each of which is either true or false but not both. Questions, commands and opinions are not propositions. Give the five connectives with symbol and one example each: negation ¬P, conjunction P ∧ Q, disjunction P ∨ Q, implication P → Q, biconditional P ⇔ Q. Define tautology (always true, a valid sentence) and contradiction (always false). Finish with 2–3 English-to-PL conversions.</p>`,
 mistakes:["Using → for 'and'. Implication is if–then only.",
 "Treating a question or command as a proposition.",
 "Forgetting to define what each symbol stands for.",
 "Mixing up tautology (always true) and contradiction (always false)."]},

{id:"m3t4", title:"First-Order Predicate Logic — sentence conversion", type:"numerical",
 priority:"high", core:true, marks:[5,10], src:"Chpt 3 Knowledge slides 22, 24–28; extra problems.docx; class notes 31/8",
 tags:["fol","predicate logic","quantifier","universal","existential","conversion","numerical"],
 concept:"Translate English sentences into first-order predicate logic. This is the highest-frequency numerical in Module 3 — the class notes list 'convert sentence' as an MSE item, and the extra-problems handout is almost entirely conversion practice.",
 formula:"∀x  P(x) → Q(x)     (for 'all')          ∃x  P(x) ∧ Q(x)     (for 'some')",
 variables:[
  {v:"Constants", m:"Objects — john, apples, Peanuts. Nouns and noun phrases."},
  {v:"Predicates", m:"Properties and relations among objects — likes(john, apples). Verbs and verb phrases."},
  {v:"Functions", m:"Transform objects, with only one value for a given input — fruit_of(apple_tree), fatherof(John)."},
  {v:"∀ (universal)", m:"True for <em>all</em> objects. ∀x likes(x, apples)."},
  {v:"∃ (existential)", m:"Exists <em>at least one</em> object. ∃x likes(x, apples)."}],
 whenToUse:"Whenever the question says 'convert the following sentences into first-order predicate logic' or gives a knowledge base in English before asking for a resolution proof.",
 learn:`<p>FOL is <strong>more expressive</strong> than propositional logic. It has four building blocks — remember them by the class mnemonic <strong>O-P-Q-C</strong>:</p>
<div class="fx left"><strong>O</strong> = Object &nbsp;·&nbsp; <strong>P</strong> = Predicate &nbsp;·&nbsp; <strong>Q</strong> = Quantifier &nbsp;·&nbsp; <strong>C</strong> = Connective</div>
<h4>The five conversion rules from class</h4>
<ol>
<li><strong>'every' / 'all'</strong> → use <strong>→</strong> (implication)</li>
<li><strong>'some'</strong> → use <strong>∧</strong> (AND)</li>
<li>One object → <strong>unary predicate</strong> (a property). Two objects → <strong>binary predicate</strong> (a relationship).</li>
<li>Be careful with <strong>'No'</strong>.</li>
<li>When there are <strong>different people</strong>, use <strong>two variables</strong>.</li>
</ol>
<h4>The four master patterns</h4>
<div class="tw"><table><thead><tr><th>English pattern</th><th>FOL</th></tr></thead><tbody>
<tr><td>All A are B</td><td>∀x [ A(x) → B(x) ]</td></tr>
<tr><td>Some A are B</td><td>∃x [ A(x) ∧ B(x) ]</td></tr>
<tr><td>No A are B</td><td>∀x [ A(x) → ¬B(x) ]</td></tr>
<tr><td>Every A relates to some B</td><td>∀x [ A(x) → ∃y ( B(y) ∧ R(x,y) ) ]</td></tr>
</tbody></table></div>
<div class="note warn"><span class="note-t">The single most common error</span>Using <strong>∧ with ∀</strong>. <code>∀x (Student(x) ∧ Studies(x, Maths))</code> claims <em>everything in the universe is a student who studies maths</em> — including chairs and planets. The correct form is <code>∀x (Student(x) → Studies(x, Maths))</code>.<br>Symmetrically, <strong>∃ with →</strong> is almost always wrong: <code>∃x (Student(x) → Plays(x, Football))</code> is trivially satisfied by any non-student.</div>`,
 understand:`<p>Why the pairing works: <strong>∀ needs a guard, ∃ needs a witness.</strong></p>
<p>With <strong>∀</strong> you are talking about everything in the universe, so you need an implication to <em>restrict</em> the claim to the things you actually mean ("if it is a student, then…"). With <strong>∃</strong> you are asserting that a specific thing exists, so you need a conjunction to say it has <em>both</em> properties at once ("there is something that is a student <em>and</em> plays football").</p>`,
 worked:{
  problem:"Convert the following into first-order predicate logic (class examples, 31/8 and the extra-problems handout).",
  steps:[
   "<strong>All students study mathematics.</strong><br><code>∀x ( Student(x) → Studies(x, Mathematics) )</code> — universal quantification, so implication.",
   "<strong>Some students play football.</strong><br><code>∃x ( Student(x) ∧ Plays(x, Football) )</code> — existential, so conjunction.",
   "<strong>If a person is a teacher, then they teach some subject.</strong><br><code>∀x ( Teacher(x) → ∃y Teaches(x, y) )</code> — note the nested existential.",
   "<strong>No student is lazy.</strong><br><code>∀x ( Student(x) → ¬Lazy(x) )</code> — 'No A are B' is a universal with a negated consequent.",
   "<strong>Every father loves his child.</strong><br><code>∀x ∀y ( Father(x, y) → Loves(x, y) )</code> — two different people, so two variables.",
   "<strong>Every dog barks and has four legs.</strong><br><code>∀x ( Dog(x) → ( Barks(x) ∧ HasFourLegs(x) ) )</code> — multiple predicates in the consequent.",
   "<strong>If a person is rich, then they either have a high-paying job or inherited wealth.</strong><br><code>∀x ( Rich(x) → ( HighPayingJob(x) ∨ InheritedWealth(x) ) )</code>",
   "<strong>Every professor who teaches AI also knows Machine Learning.</strong><br><code>∀x ( Professor(x) ∧ Teaches(x, AI) → Knows(x, ML) )</code>",
   "<strong>There is a student who studies every subject.</strong><br><code>∃x ( Student(x) ∧ ∀y ( Subject(y) → Studies(x, y) ) )</code> — existential outside, universal inside; the order matters.",
   "<strong>All purple mushrooms are poisonous.</strong><br><code>∀x ( Mushroom(x) ∧ Purple(x) → Poisonous(x) )</code>",
   "<strong>No purple mushroom is poisonous.</strong><br><code>∀x ( Mushroom(x) ∧ Purple(x) → ¬Poisonous(x) )</code>, equivalently <code>¬∃x ( Purple(x) ∧ Mushroom(x) ∧ Poisonous(x) )</code>",
   "<strong>Everyone likes McDonalds unless they are allergic to it.</strong><br><code>∀x ( ¬Allergic(x, McDonalds) → Likes(x, McDonalds) )</code> — 'unless B' becomes 'if not B'."],
  answer:"The pattern to carry into the exam: identify the quantifier word first ('all/every' → ∀ with →; 'some/there is' → ∃ with ∧; 'no' → ∀ with ¬ in the consequent), then count how many distinct people or objects the sentence mentions to decide how many variables you need."},
 examAnswer:`<p><strong>5 marks — Convert the given sentences into first-order predicate logic.</strong> Do not just write the answers. For each sentence: (1) name the predicates and constants you are using, (2) give the FOL sentence, (3) name the pattern in the margin — universal quantification, existential quantification, negation, multiple variables, nested quantifiers. That is exactly how the lecture presents its own worked conversions, and it earns method marks even where a translation is imperfect.</p>
<p><strong>State the two rules explicitly</strong> at the top of your answer, because they are worth a mark on their own: <em>'all/every' takes ∀ with →; 'some' takes ∃ with ∧.</em></p>
<p><strong>10 marks — add</strong> the FOL building blocks (constants are objects, predicates are properties and relations, functions transform objects with one value per input, quantifiers qualify variables), and a short comparison with propositional logic showing why FOL is needed for these sentences.</p>`,
 mistakes:[
  "<strong>∀ with ∧</strong> instead of →. This asserts the property of every object in the universe.",
  "<strong>∃ with →</strong> instead of ∧. This is trivially true for anything failing the antecedent.",
  "Using one variable when the sentence mentions two different people. 'Every father loves his child' needs ∀x∀y.",
  "Mis-scoping quantifiers. 'You can fool some of the people all of the time' is <code>∃x ∀t (person(x) ∧ time(t)) ∧ can-fool(x,t)</code>, whereas 'all of the people some of the time' is <code>∀x ∃t (person(x) ∧ time(t)) → can-fool(x,t)</code>. The order of ∃ and ∀ changes the meaning.",
  "Handling 'No' as ¬∀. 'No A are B' is ∀x (A(x) → ¬B(x)), not ¬∀x(A(x) → B(x))."],
 practice:[
  {d:"Easy", q:"Convert: (a) All birds fly. (b) Some boys play cricket. (c) Every man respects his parent.",
   s:"<p>(a) <code>∀x ( bird(x) → fly(x) )</code></p><p>(b) <code>∃x ( boys(x) ∧ play(x, cricket) )</code></p><p>(c) <code>∀x ( man(x) → respects(x, parent) )</code></p><p><em>Note the pattern: 'all' → implication, 'some' → conjunction.</em></p>"},
  {d:"Basic", q:"Convert: (a) All men drink coffee. (b) Some men drink coffee. (c) All girls are intelligent. (d) Some girls are intelligent.",
   s:"<p>(a) <code>∀x ( man(x) → drink(x, coffee) )</code> — for all x, if x is a man then x drinks coffee.</p><p>(b) <code>∃x ( man(x) ∧ drink(x, coffee) )</code> — there is some x that is a man and drinks coffee.</p><p>(c) <code>∀x ( girl(x) → intelligent(x) )</code></p><p>(d) <code>∃x ( girl(x) ∧ intelligent(x) )</code></p>"},
  {d:"Moderate", q:"Convert: (a) Not all students like both Mathematics and Science. (b) Everyone likes McDonalds. (c) Someone likes McDonalds. (d) All children like McDonalds.",
   s:"<p>(a) <code>¬∀x [ student(x) → like(x, Mathematics) ∧ like(x, Science) ]</code></p><p>(b) <code>∀x likes(x, McDonalds)</code> — no guard needed; the claim really is about everyone.</p><p>(c) <code>∃x likes(x, McDonalds)</code></p><p>(d) <code>∀x ( child(x) ⇒ likes(x, McDonalds) )</code> — here a guard <em>is</em> needed, because the claim is restricted to children.</p><p><em>Compare (b) and (d): the guard appears exactly when the English restricts the class.</em></p>"},
  {d:"Difficult", q:"Convert: (a) A person buys an expensive policy. (b) No person buys an expensive policy. (c) Every person who buys a policy is smart. (d) Every person who exercises is healthier than a person who does not exercise.",
   s:"<p>(a) <code>∃x ∃y ( Person(x) ∧ Policy(y) ∧ Expensive(y) ∧ Buys(x, y) )</code></p><p>(b) <code>∀x ∀y ( Person(x) ∧ Policy(y) ∧ Expensive(y) → ¬Buys(x, y) )</code></p><p>(c) <code>∀x ( Person(x) ∧ Buys(x, Policy) → Smart(x) )</code></p><p>(d) <code>∀x ∀y ( ( Person(x) ∧ Exercises(x) ∧ Person(y) ∧ ¬Exercises(y) ) → Healthier(x, y) )</code></p><p><em>(d) is a comparative statement — it needs two variables because it compares two different people.</em></p>"},
  {d:"Exam-level", q:"Convert: (a) If a robot has a key and is activated, it can enter any unlocked room. (b) No one who cheats in an exam is an honest student. (c) If a suspect is guilty, then at least one piece of evidence must exist against them. (d) If a person is a doctor, then they have a degree and help patients.",
   s:"<p>(a) <code>∀x ∀y ( ( Robot(x) ∧ HasKey(x) ∧ Activated(x) ∧ Unlocked(y) ) → Enter(x, y) )</code> — 'any unlocked room' inside a conditional becomes a universal over y.</p><p>(b) <code>∀x ( Cheats(x, Exam) → ¬HonestStudent(x) )</code></p><p>(c) <code>∀x ( Guilty(x) → ∃y Evidence(y, x) )</code> — 'at least one' is an existential <em>nested inside</em> the universal.</p><p>(d) <code>∀x ( Doctor(x) → ( HasDegree(x) ∧ Helps(x, Patients) ) )</code></p><p><em>Pattern check: whenever the English says 'at least one' or 'some' <strong>after</strong> an 'if', you need ∃ nested inside ∀.</em></p>"}]},

{id:"m3t5", title:"Propositional Logic vs First-Order Predicate Logic", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 3 Knowledge slide 29",
 tags:["comparison","pl vs fol","expressiveness","difference"],
 learn:`<div class="tw"><table><thead><tr><th>Propositional Logic</th><th>First-Order Predicate Logic</th></tr></thead><tbody>
<tr><td>Can represent small worlds</td><td>Very well represents complex worlds</td></tr>
<tr><td>Weak knowledge representation language</td><td>Strong knowledge representation language</td></tr>
<tr><td>Uses symbols to represent propositions</td><td>Uses predicates involving constants, variables, functions, relations</td></tr>
<tr><td>Cannot express specialization or generalization</td><td>Can express specialization and generalization using relations</td></tr>
<tr><td>Foundational level logic</td><td>Higher level logic</td></tr>
<tr><td>Not sufficiently expressive to represent complex statements</td><td>Sufficiently expressive to represent complex statements</td></tr>
<tr><td>World contains <strong>facts</strong></td><td>World contains <strong>objects, relations, functions</strong></td></tr>
</tbody></table></div>`,
 understand:`<p>The one-sentence reason FOL wins: <strong>propositional logic has no variables, so it cannot say "all".</strong> "All men are mortal" would need a separate proposition for every man who has ever lived. FOL says it once with ∀x.</p>
<p>This is a classic 5-mark "compare and contrast" question — LO 3.6 explicitly asks you to compare, so practise writing it as a table, not as prose.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Differentiate propositional logic and first-order predicate logic.</strong> Present the seven-row comparison table: representable worlds (small vs complex), strength as a KR language (weak vs strong), building blocks (symbols for propositions vs predicates with constants, variables, functions and relations), specialization/generalization (cannot vs can), level (foundational vs higher), expressiveness (insufficient vs sufficient for complex statements), and what the world contains (facts vs objects, relations and functions). Add one illustrative pair: PL must write a separate symbol for each man being mortal, whereas FOL writes ∀x (Man(x) → Mortal(x)) once.</p>`,
 mistakes:["Writing the comparison as a paragraph. A table is faster to write and easier to mark.",
 "Saying propositional logic 'cannot be used in AI'. It can — the Wumpus world reasoning in this very module is propositional.",
 "Missing the last row: PL's world contains facts; FOL's world contains objects, relations and functions."]},

{id:"m3t6", title:"Inference Rules", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 3 Knowledge slide 31; class notes 31/8",
 tags:["modus ponens","and elimination","biconditional","inference rules","equivalence"],
 learn:`<h4>1. Modus Ponens</h4>
<p>If <strong>P → Q</strong> and <strong>P</strong> is true, then <strong>Q</strong> must be true.</p>
<div class="fx left">Given: (Student(x) → Studies(x, AI)),&nbsp; Student(John) &nbsp;⟹&nbsp; <strong>Studies(John, AI)</strong></div>
<h4>2. And-Elimination</h4>
<p>If we know <strong>P ∧ Q</strong>, we can infer P or Q separately.</p>
<div class="fx left">Given: Student(John) ∧ Studies(John, AI) &nbsp;⟹&nbsp; Student(John) &nbsp;and&nbsp; Studies(John, AI)</div>
<h4>3. Biconditional Elimination</h4>
<p>If <strong>P ↔ Q</strong> is true, we can derive both <strong>P → Q</strong> and <strong>Q → P</strong>.</p>
<div class="fx left">Bachelor(x) ↔ (Unmarried(x) ∧ Male(x))<br>⟹ Bachelor(x) → (Unmarried(x) ∧ Male(x)) &nbsp;and&nbsp; (Unmarried(x) ∧ Male(x)) → Bachelor(x)</div>
<h4>4. Resolution</h4>
<p>Works on the <strong>conjunction of disjunctions of literals</strong> (CNF). Covered as its own topic.</p>
<h4>Logical equivalence</h4>
<p>To manipulate logical sentences we need rewrite rules. Two sentences are <strong>logically equivalent</strong> iff they are true in the same models: α ≡ β iff α ⊨ β and β ⊨ α.</p>`,
 understand:`<p>Modus ponens is the engine of <strong>forward chaining</strong>; it is also the basis of backward chaining (run in reverse). If you can state modus ponens correctly you have the core of three separate exam topics.</p>
<p>The extra-problems handout uses "prove using modus ponens and resolution" as a standard two-part question — the same knowledge base is proved twice, once forward with modus ponens and once by refutation with resolution.</p>`,
 examples:[{t:"Modus ponens chain (from extra problems.docx)",b:"Given mammal(Tom) → drink(Tom, Milk), man(Tom) → mortal(Tom), man(Tom) → mammal(Tom), man(Tom): infer mammal(Tom) by MP(3,4), then drink(Tom, Milk) by MP(1,5)."}],
 examAnswer:`<p><strong>5 marks — State and illustrate the inference rules.</strong> (1) <em>Modus ponens</em>: from P → Q and P, infer Q. (2) <em>And-elimination</em>: from P ∧ Q, infer P and Q separately. (3) <em>Biconditional elimination</em>: from P ↔ Q, infer both P → Q and Q → P. (4) <em>Resolution</em>: applied to clauses in CNF, resolving complementary literals. Give one worked example for each, and define logical equivalence: α ≡ β iff α ⊨ β and β ⊨ α.</p>`,
 mistakes:["Affirming the consequent: from P → Q and Q, concluding P. This is <em>invalid</em> and is not modus ponens.",
 "Applying modus ponens without checking that the antecedent is actually asserted.",
 "Forgetting that biconditional elimination gives <em>two</em> implications, not one."]},

{id:"m3t7", title:"Conversion to CNF (Conjunctive Normal Form)", type:"numerical",
 priority:"high", core:true, marks:[5], src:"Chpt 3 Knowledge slides 34, 40, 43–45; class notes 31/8",
 tags:["cnf","clausal form","de morgan","skolemization","distributivity","numerical"],
 concept:"Resolution only works on clauses — disjunctions of literals. CNF conversion is the mechanical preprocessing step that turns any sentence into that form, and it is examined both on its own and as step 2 of every resolution proof.",
 formula:"CNF = a conjunction of disjunctions of literals,  e.g. (A ∨ ¬B) ∧ (B ∨ ¬C ∨ ¬D)",
 variables:[
  {v:"Literal", m:"An atomic proposition or its negation, e.g. P or ¬P."},
  {v:"Clause", m:"A disjunction (OR) of literals."},
  {v:"CNF", m:"A conjunction (AND) of clauses."},
  {v:"Skolemization", m:"The process of removing existential quantifiers. A constant replacing an ∃-variable is a Skolem constant; a function used to replace one is a Skolem function. A skolemized sentence is satisfiable exactly when the original is."}],
 whenToUse:"Before any resolution proof, and whenever the question says 'convert to clausal form' or 'convert to CNF'.",
 learn:`<h4>The four short rules (propositional logic)</h4>
<ol class="wsteps">
<li><strong>Eliminate ⇔.</strong> Replace α ⇔ β with (α → β) ∧ (β → α).</li>
<li><strong>Eliminate →.</strong> Replace α → β with ¬α ∨ β.</li>
<li><strong>Move ¬ inwards</strong> using De Morgan's rules and double negation: ¬(α ∧ β) ≡ ¬α ∨ ¬β, ¬(α ∨ β) ≡ ¬α ∧ ¬β, ¬¬α ≡ α.</li>
<li><strong>Apply distributivity</strong> of ∨ over ∧ and flatten.</li>
</ol>
<h4>The full procedure for first-order logic</h4>
<ol class="wsteps">
<li>Eliminate implications (and biconditionals).</li>
<li>Move negation inwards.</li>
<li><strong>Rename / standardize variables</strong> so no two quantifiers use the same variable name.</li>
<li><strong>Skolemization</strong> — eliminate existential quantifiers, replacing the variable with a Skolem constant or function.</li>
<li><strong>Drop universal quantifiers.</strong></li>
<li>Distribute ∨ over ∧ to get a conjunction of clauses.</li>
</ol>`,
 worked:{
  problem:"<strong>Convert the Wumpus-world breeze rule to CNF:</strong> &nbsp; B<sub>1,1</sub> ⇔ (P<sub>1,2</sub> ∨ P<sub>2,1</sub>)",
  steps:[
   "<strong>Step 1 — Eliminate ⇔</strong>, replacing α ⇔ β with (α → β) ∧ (β → α):<br><code>(B₁,₁ → (P₁,₂ ∨ P₂,₁)) ∧ ((P₁,₂ ∨ P₂,₁) → B₁,₁)</code>",
   "<strong>Step 2 — Eliminate →</strong>, replacing α → β with ¬α ∨ β:<br><code>(¬B₁,₁ ∨ P₁,₂ ∨ P₂,₁) ∧ (¬(P₁,₂ ∨ P₂,₁) ∨ B₁,₁)</code>",
   "<strong>Step 3 — Move ¬ inwards</strong> using De Morgan's rules and double negation:<br><code>(¬B₁,₁ ∨ P₁,₂ ∨ P₂,₁) ∧ ((¬P₁,₂ ∧ ¬P₂,₁) ∨ B₁,₁)</code>",
   "<strong>Step 4 — Apply distributivity</strong> of ∨ over ∧ and flatten:<br><code>(¬B₁,₁ ∨ P₁,₂ ∨ P₂,₁) ∧ (¬P₁,₂ ∨ B₁,₁) ∧ (¬P₂,₁ ∨ B₁,₁)</code>"],
  answer:"Three clauses: (¬B₁,₁ ∨ P₁,₂ ∨ P₂,₁), (¬P₁,₂ ∨ B₁,₁), (¬P₂,₁ ∨ B₁,₁). Each is a disjunction of literals, and they are joined by ∧ — this is CNF."},
 understand:`<p>CNF conversion feels mechanical because it <em>is</em> mechanical — that is the point. Resolution can only match a literal against its exact negation, so every sentence must first be flattened into a plain list of ORs joined by ANDs, with no arrows and no nested brackets left.</p>
<p>Do the steps strictly in order and the conversion cannot go wrong. Students who skip straight to "distribute" usually still have an implication buried somewhere and produce a clause that is not a clause.</p>
<p>One conceptual point worth knowing: <strong>Skolemization preserves satisfiability, not equivalence</strong>. That is acceptable here only because resolution is a refutation procedure — it asks whether a clause set is unsatisfiable, and nothing more.</p>`,
 examAnswer:`<p><strong>5 marks — Convert the given sentence to CNF.</strong> State the four rules first — eliminate ⇔, eliminate →, move ¬ inwards using De Morgan and double negation, distribute ∨ over ∧ — then <strong>show one line of working per rule</strong>, labelled with the rule used. Finish by listing the resulting clauses separately so it is visible that each is a disjunction of literals. <em>For B₁,₁ ⇔ (P₁,₂ ∨ P₂,₁) the answer is three clauses.</em></p>
<p><strong>For a first-order sentence, add</strong> the two extra steps in the right place: rename/standardize variables, then Skolemize to remove ∃, then drop the universal quantifiers.</p>`,
 mistakes:["Distributing ∧ over ∨ instead of ∨ over ∧. CNF is <em>AND of ORs</em>, so you push the ORs down.",
 "Skipping the rename/standardize step in FOL, then resolving two clauses that accidentally share a variable name.",
 "Dropping universal quantifiers <em>before</em> skolemizing. The order is: rename → skolemize → drop ∀.",
 "Forgetting that ⇔ produces <em>two</em> implications, so the answer must have at least two clauses."],
 practice:[
  {d:"Basic", q:"Convert A → B to clausal form. Then convert ¬A ∨ ¬B ∨ C back into implication form.",
   s:"<p><strong>A → B</strong> becomes <code>¬A ∨ B</code>.</p><p><strong>¬A ∨ ¬B ∨ C</strong>: group the negatives — <code>¬(A ∨ B) ∨ C</code> is wrong; correctly, ¬A ∨ ¬B = ¬(A ∧ B), so the clause is <code>¬(A ∧ B) ∨ C</code> = <strong><code>A ∧ B → C</code></strong>.</p><p><em>This is exactly the Horn-clause rewrite: a clause with at most one positive literal becomes an IF–THEN rule.</em></p>"},
  {d:"Moderate", q:"Convert to CNF: ∀x ( food(x) → likes(John, x) ), and ∀x ∀y ( eats(x,y) ∧ ¬killed(x) → food(y) ).",
   s:"<p><strong>First sentence.</strong> Eliminate →: <code>∀x ( ¬food(x) ∨ likes(John, x) )</code>. No ∃ to skolemize. Drop ∀: <strong><code>¬food(x) ∨ likes(John, x)</code></strong>.</p><p><strong>Second sentence.</strong> Eliminate →: <code>∀x∀y ( ¬[ eats(x,y) ∧ ¬killed(x) ] ∨ food(y) )</code>.<br>Move ¬ inwards by De Morgan: <code>∀x∀y ( ¬eats(x,y) ∨ killed(x) ∨ food(y) )</code>.<br>Rename to y, z and drop ∀: <strong><code>¬eats(y,z) ∨ killed(y) ∨ food(z)</code></strong>.</p>"},
  {d:"Exam-level", q:"Explain Skolemization and why it is valid.",
   s:"<p><strong>What it is.</strong> Skolemization is the process of removing existential quantifiers, named after the logician Skolem. A constant that replaces an existentially quantified variable is a <strong>Skolem constant</strong>; a function used in replacing a variable is a <strong>Skolem function</strong>.</p><p><strong>Which to use.</strong> If the ∃ is not inside any ∀, replace the variable with a fresh <em>constant</em>: ∃x P(x) becomes P(C). If the ∃ falls inside one or more ∀, the witness may depend on those universally quantified variables, so replace it with a <em>function</em> of them: ∀x ∃y Loves(x,y) becomes ∀x Loves(x, f(x)).</p><p><strong>Why it is valid.</strong> A skolemized sentence is <strong>satisfiable exactly when the original sentence is satisfiable</strong>. Resolution is a refutation procedure — it only ever asks whether a set of clauses is unsatisfiable — so preserving satisfiability is all that is required. (Note it does not preserve logical <em>equivalence</em>, only satisfiability, which is why it is legitimate here but not in general rewriting.)</p>"}]},

{id:"m3t8", title:"Resolution", type:"numerical",
 priority:"high", core:true, marks:[10], src:"Chpt 3 Knowledge slides 35–37, 41–46; extra problems.docx; class notes 31/8",
 tags:["resolution","refutation","empty clause","contradiction","proof","numerical","cnf"],
 diagram:"resTree",
 concept:"Resolution is a proof by contradiction. To prove that KB ⊨ α, you assume ¬α, add it to the knowledge base, and derive the empty clause. Reaching the empty clause means the assumption was impossible, so α must be true.",
 formula:"From (A ∨ B) and (¬B ∨ C), infer (A ∨ C)   —   resolve on the complementary pair B / ¬B",
 variables:[
  {v:"CNF", m:"Conjunctive Normal Form — a conjunction of disjunctions of literals, e.g. (A ∨ ¬B) ∧ (B ∨ C ∨ D)."},
  {v:"Complementary literals", m:"A pair like P and ¬P. These are what you resolve on: remove both and OR together everything that is left."},
  {v:"Resolvent", m:"The new clause produced. It is added to the set if not already present."},
  {v:"Empty clause ☐", m:"A disjunction of no disjuncts. Equivalent to <em>false</em>, because a disjunction is only true if one disjunct is true. It arises from resolving two complementary <em>unit</em> literals."}],
 whenToUse:"Whenever the question says 'prove by resolution', 'prove using resolution', or gives a set of English facts and a statement to prove. Almost always 10 marks.",
 learn:`<h4>The resolution inference rule</h4>
<p>Basic intuition: from <code>(A ∨ B)</code> and <code>(¬B ∨ C ∨ D)</code>, resolve on B / ¬B to get <code>(A ∨ C ∨ D)</code>.</p>
<h4>How to resolve</h4>
<ol>
<li>Find two clauses containing <strong>complementary literals</strong>, e.g. P and ¬P.</li>
<li>Remove P and ¬P.</li>
<li>Combine the remaining literals using <strong>OR</strong>. This gives a new clause.</li>
<li>Add the new clause to the set of clauses and repeat.</li>
</ol>
<h4>When do we stop?</h4>
<div class="tw"><table><tbody>
<tr><td><strong>Case 1</strong></td><td>The <strong>empty clause ☐</strong> is obtained ⇒ contradiction. Therefore the assumption ¬α is false, and <strong>KB ⊨ α</strong>. <span class="badge b-ok">PROVED ✓</span></td></tr>
<tr><td><strong>Case 2</strong></td><td><strong>No new clause</strong> can be generated. No contradiction is found, so <strong>KB ⊭ α</strong>. <span class="badge b-high">NOT PROVED ✗</span></td></tr>
</tbody></table></div>
<h4>The four steps for a resolution question</h4>
<ol class="wsteps">
<li><strong>Conversion of facts into first-order logic / propositional logic.</strong></li>
<li><strong>Convert the FOL statements into CNF.</strong></li>
<li><strong>Negate the statement which needs to be proved</strong> (proof by contradiction).</li>
<li><strong>Draw the resolution graph</strong> (with unification).</li>
</ol>`,
 understand:`<p>The logic of refutation: you want to show α follows from KB. Instead of proving it directly, you <em>assume the opposite</em> and show that the assumption cannot coexist with the KB. Deriving ☐ means "these clauses cannot all be true at once" — and since the KB is given as true, the guilty party must be ¬α.</p>
<div class="note trap"><span class="note-t">Important nuance</span>Failing to derive ☐ does <strong>not</strong> prove that α is false. It only means the KB cannot prove α. This is the difference between "not provable" and "false".</div>
<p>Two practical notes from the class notes: <em>a clause is always combined with ∨ (OR)</em>, and <em>it is fine if some given statements are never used</em> in the proof — you do not have to consume every premise.</p>`,
 worked:{
  problem:"<strong>Class example (31/8).</strong> Consider the given facts: (1) Renee is hungry. (2) If Renee is hungry, she barks. (3) If Renee is barking, then Raja is angry.<br>Convert to propositional logic and prove by resolution that <strong>Raja is angry</strong>.",
  steps:[
   "<strong>Step 1 — Conversion to propositional logic.</strong><br>Let <code>p</code> = Renee is hungry, <code>q</code> = Renee is barking, <code>r</code> = Raja is angry.<br>1) <code>p</code> &nbsp; 2) <code>p → q</code> &nbsp; 3) <code>q → r</code>",
   "<strong>Step 2 — Conversion to CNF.</strong> Replace each α → β with ¬α ∨ β:<br>1) <code>p</code> &nbsp; 2) <code>¬p ∨ q</code> &nbsp; 3) <code>¬q ∨ r</code>",
   "<strong>Step 3 — Negate the statement to be proved.</strong> The goal is r, so assume <code>¬r</code> and add it as clause 4.",
   "<strong>Step 4a — Resolve ¬r with (¬q ∨ r).</strong> The complementary pair is r / ¬r. Removing both leaves <code>¬q</code> — call it clause 5.",
   "<strong>Step 4b — Resolve ¬q with (¬p ∨ q).</strong> The complementary pair is q / ¬q. Removing both leaves <code>¬p</code> — call it clause 6.",
   "<strong>Step 4c — Resolve ¬p with p.</strong> Both are unit clauses and complementary, so nothing remains: the <strong>empty clause ☐</strong>."],
  answer:"The empty clause is derived, so the assumption ¬r is false. Therefore r is true — Raja is angry. ∎",
  check:"Sanity check by forward reasoning: p is given; p → q gives q; q → r gives r. Same conclusion, reached directly. ✓"},
 examAnswer:`<p><strong>10 marks — Prove the given statement by resolution.</strong> Use the four numbered steps as your section headings — the examiner is looking for them.</p>
<ol><li><strong>Conversion of facts into FOL/propositional logic.</strong> Number every sentence.</li>
<li><strong>Convert into CNF.</strong> Show the working, and number the resulting clauses.</li>
<li><strong>Negate the statement to be proved</strong> and add it as the last clause. Say the words "proof by contradiction".</li>
<li><strong>Draw the resolution graph</strong>, writing the substitution in braces — {Peanuts/x} — beside every step that involves variables.</li></ol>
<p>Close with the conclusion in full: <em>"Since we obtain the empty clause, the negation is false, and hence the goal is proved."</em> Add a line noting that any unused premises are acceptable. <strong>Do not write only the final clause</strong> — the graph is the answer.</p>`,
 mistakes:[
  "<strong>Forgetting to negate the goal.</strong> Resolution is a refutation method — without ¬α you can never reach ☐.",
  "Resolving two clauses on <em>more than one</em> pair of complementary literals at once. Resolve on exactly one pair per step.",
  "Combining the remaining literals with ∧. They are always combined with <strong>∨</strong>.",
  "Concluding 'α is false' when no contradiction is found. It only means the KB cannot prove α.",
  "Forgetting the substitution when variables are present. Write {Peanuts/x} next to each resolution step in a FOL proof."],
 practice:[
  {d:"Moderate", q:"<strong>From extra problems.docx.</strong> Given: (i) Mammals drink milk. (ii) Man is mortal. (iii) Man is a mammal. (iv) Tom is a man. Prove that <strong>Tom drinks milk</strong>, using (a) modus ponens and (b) resolution.",
   s:`<p><strong>Step 1 — Convert to PL/FOL:</strong><br>P: <code>mammal(Tom) → drink(Tom, Milk)</code><br>Q: <code>man(Tom) → mortal(Tom)</code><br>R: <code>man(Tom) → mammal(Tom)</code><br>S: <code>man(Tom)</code></p>
<p><strong>(a) Proof by modus ponens (forward chaining):</strong></p>
<ol><li>P: mammal(Tom) → drink(Tom, Milk) &nbsp; [Premise]</li><li>Q: man(Tom) → mortal(Tom) &nbsp; [Premise]</li><li>R: man(Tom) → mammal(Tom) &nbsp; [Premise]</li><li>S: man(Tom) &nbsp; [Premise]</li><li>mammal(Tom) &nbsp; [Modus ponens (3,4)]</li><li>drink(Tom, Milk) &nbsp; [Modus ponens (1,5)]</li></ol><p>Hence proved.</p>
<p><strong>(b) Proof by resolution.</strong> Step 2 — convert to clausal form (A → B ⇒ ¬A ∨ B):<br>1) <code>¬mammal(Tom) ∨ drink(Tom, Milk)</code><br>2) <code>¬man(Tom) ∨ mortal(Tom)</code><br>3) <code>¬man(Tom) ∨ mammal(Tom)</code><br>4) <code>man(Tom)</code></p>
<p>Step 3 — negate the goal: <code>¬drink(Tom, Milk)</code>.</p>
<p>Step 4 — resolve:<br>¬drink(Tom, Milk) with (1) → <code>¬mammal(Tom)</code><br>¬mammal(Tom) with (3) → <code>¬man(Tom)</code><br>¬man(Tom) with (4) → <strong>☐ Null clause</strong></p>
<div class='ans'>Hence drink(Tom, Milk) is true by contradiction. Note that clause (2) was never used — that is perfectly acceptable.</div>`},
  {d:"Moderate", q:"For the same knowledge base, prove that <strong>Tom is mortal</strong> by modus ponens and by resolution.",
   s:`<p><strong>Modus ponens:</strong> from Q: man(Tom) → mortal(Tom) and S: man(Tom), infer <code>mortal(Tom)</code> by Modus ponens (2,4). Hence the proof — a single step.</p>
<p><strong>Resolution:</strong> negate the goal to get <code>¬mortal(Tom)</code>.<br>Resolve ¬mortal(Tom) with <code>¬man(Tom) ∨ mortal(Tom)</code> → <code>¬man(Tom)</code>.<br>Resolve ¬man(Tom) with <code>man(Tom)</code> → <strong>☐ Null clause</strong>.</p><div class='ans'>Hence mortal(Tom) is true by contradiction.</div>`},
  {d:"Difficult", q:"<strong>From extra problems.docx.</strong> (i) If a triangle is equilateral then it is isosceles. (ii) If a triangle is isosceles then two sides AB and AC are equal. (iii) If AB and AC are equal then angles B and C are equal. (iv) ABC is an equilateral triangle.<br>Prove that <strong>angle B = angle C</strong> using modus ponens and resolution.",
   s:`<p><strong>Step 1 — Convert into PL/FOL:</strong><br><code>Equilateral(ABC) → Isosceles(ABC)</code><br><code>Isosceles(ABC) → Equal(AB, AC)</code><br><code>Equal(AB, AC) → Equal(B, C)</code><br><code>Equilateral(ABC)</code></p>
<p><strong>Proof by modus ponens (forward chaining).</strong> Goal: prove Equal(B,C).</p>
<ol><li>Equilateral(ABC) → Isosceles(ABC) &nbsp; [Premise]</li><li>Isosceles(ABC) → Equal(AB,AC) &nbsp; [Premise]</li><li>Equal(AB,AC) → Equal(B,C) &nbsp; [Premise]</li><li>Equilateral(ABC) &nbsp; [Premise]</li><li>Isosceles(ABC) &nbsp; [Modus ponens (1,4)]</li><li>Equal(AB,AC) &nbsp; [Modus ponens (2,5)]</li><li>Equal(B,C) &nbsp; [Modus ponens (3,6)]</li></ol><p>Hence the proof.</p>
<p><strong>Proof by resolution.</strong> Step 2 — clausal form (A → B ⇒ ¬A ∨ B):<br>1) <code>¬Equilateral(ABC) ∨ Isosceles(ABC)</code><br>2) <code>¬Isosceles(ABC) ∨ Equal(AB,AC)</code><br>3) <code>¬Equal(AB,AC) ∨ Equal(B,C)</code><br>4) <code>Equilateral(ABC)</code></p>
<p>Step 3 — to prove Equal(B,C), assume the negation: <code>¬Equal(B,C)</code>.</p>
<p>Step 4 — iteratively resolve:<br>¬Equal(B,C) + (3) → <code>¬Equal(AB,AC)</code><br>¬Equal(AB,AC) + (2) → <code>¬Isosceles(ABC)</code><br>¬Isosceles(ABC) + (1) → <code>¬Equilateral(ABC)</code><br>¬Equilateral(ABC) + (4) → <strong>☐ Null clause</strong></p>
<div class='ans'>Hence Equal(B,C) is true by contradiction.</div>`},
  {d:"Exam-level", q:"<strong>The classic (Chpt 3 slides 42–46, class notes).</strong> (1) John likes all kinds of food. (2) Apple and vegetables are food. (3) Anything anyone eats and is not killed by is food. (4) Anil eats peanuts and is still alive. (5) Harry eats everything that Anil eats.<br>Prove by resolution that <strong>John likes peanuts</strong>.",
   s:`<p><strong>Step 1 — Conversion of facts into FOPL:</strong></p>
<p>a) <code>∀x food(x) → likes(John, x)</code><br>b) <code>food(Apple) ∧ food(vegetables)</code><br>c) <code>∀x ∀y eats(x,y) ∧ ¬killed(x) → food(y)</code><br>d) <code>eats(Anil, Peanuts) ∧ alive(Anil)</code><br>e) <code>∀x eats(Anil, x) → eats(Harry, x)</code><br>f) <code>∀x killed(x) → ¬alive(x)</code><br>g) <code>∀x alive(x) → ¬killed(x)</code><br>h) Goal: <code>likes(John, Peanuts)</code></p>
<p><strong>Step 2 — Convert to CNF.</strong> Eliminate implications, move ¬ inwards, standardize variables, then drop the universal quantifiers (there are no existentials, so no Skolemization is needed):</p>
<p>1) <code>¬food(x) ∨ likes(John, x)</code><br>2) <code>food(Apple)</code><br>3) <code>food(vegetables)</code><br>4) <code>¬eats(y,z) ∨ killed(y) ∨ food(z)</code><br>5) <code>eats(Anil, Peanuts)</code><br>6) <code>alive(Anil)</code><br>7) <code>¬eats(Anil, w) ∨ eats(Harry, w)</code><br>8) <code>killed(g) ∨ alive(g)</code><br>9) <code>¬alive(k) ∨ ¬killed(k)</code></p>
<p><strong>Step 3 — Negate the conclusion:</strong> <code>¬likes(John, Peanuts)</code>.</p>
<p><strong>Step 4 — Resolution graph with unification:</strong></p>
<ol class='wsteps'>
<li><code>¬likes(John, Peanuts)</code> + <code>¬food(x) ∨ likes(John, x)</code> &nbsp;{Peanuts/x}&nbsp; → <code>¬food(Peanuts)</code></li>
<li><code>¬food(Peanuts)</code> + <code>¬eats(y,z) ∨ killed(y) ∨ food(z)</code> &nbsp;{Peanuts/z}&nbsp; → <code>¬eats(y, Peanuts) ∨ killed(y)</code></li>
<li>+ <code>eats(Anil, Peanuts)</code> &nbsp;{Anil/y}&nbsp; → <code>killed(Anil)</code></li>
<li>+ <code>¬alive(k) ∨ ¬killed(k)</code> &nbsp;{Anil/k}&nbsp; → <code>¬alive(Anil)</code></li>
<li>+ <code>alive(Anil)</code> → <strong>☐ empty clause</strong></li>
</ol>
<div class='ans'>Since we obtain the empty clause at the end of the resolution graph, ¬likes(John, Peanuts) is false — hence <strong>John likes peanuts</strong>. Hence proved; the assumption was incorrect.</div>
<p><em>Note: clauses 2, 3 and 7 are never used. That is expected and costs no marks.</em></p>`}]},

{id:"m3t9", title:"Unification", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 3 Forward_Backward_Chaining slide 12; class notes",
 tags:["unification","substitution","mgu","variables","matching"],
 learn:`<div class="note"><span class="note-t">Definition</span><strong>Unification enables the appropriate rule to be applied.</strong> Rules usually contain variables; unification finds the substitutions that make a rule match a fact or a goal.</div>
<h4>Worked illustration</h4>
<div class="tw"><table><tbody>
<tr><td><strong>Rule pattern</strong></td><td><code>Missile(x) → Weapon(x)</code></td></tr>
<tr><td><strong>Known fact</strong></td><td><code>Missile(M1)</code></td></tr>
<tr><td><strong>Substitution</strong></td><td><code>{ x / M1 }</code></td></tr>
<tr><td><strong>After substitution</strong></td><td><code>Missile(M1) → Weapon(M1)</code></td></tr>
</tbody></table></div>
<div class="note warn"><span class="note-t">Remember</span>Unification <strong>does not itself prove the conclusion</strong> — it enables the appropriate rule to be applied.</div>`,
 understand:`<p>Unification is the glue that makes FOL resolution and chaining work. Propositional resolution can just look for matching symbols; in FOL the symbols contain variables, so before you can resolve <code>¬food(x)</code> against <code>food(Peanuts)</code> you must first bind x to Peanuts.</p>
<p>In an exam answer, <strong>write the substitution in braces next to every resolution step</strong> — <code>{Peanuts/x}</code>, <code>{Anil/y}</code>. Marks are given for showing them.</p>`,
 examples:[{t:"Substitutions in the West example",b:"Unification gives x = West, y = M1, z = Nono, after which all subgoals of Criminal(West) succeed."}],
 examAnswer:`<p><strong>5 marks — Explain unification with an example.</strong> Unification is the process of finding a substitution that makes two logical expressions identical, so that the appropriate rule can be applied to a fact or goal. Rules contain variables; a substitution binds those variables to constants. Example: the rule Missile(x) → Weapon(x) and the fact Missile(M1) unify under the substitution {x/M1}, giving Missile(M1) → Weapon(M1), from which Weapon(M1) follows. State clearly that unification does not itself prove the conclusion — it only enables the rule to be applied. Mention its role in resolution and in backward chaining, where the substitutions x = West, y = M1, z = Nono let all subgoals of Criminal(West) succeed.</p>`,
 mistakes:["Saying unification proves the conclusion. It only makes the rule applicable.",
 "Writing the substitution backwards. The convention used in class is {value/variable}, e.g. {Peanuts/x}.",
 "Unifying two different constants. Constants only unify with themselves or with a variable."]},

{id:"m3t10", title:"Horn Clauses", type:"theory",
 priority:"medium", core:false, marks:[5], src:"Chpt 3 Knowledge slide 38; class notes 31/8",
 tags:["horn clause","if then","rule","efficient inference","chaining"],
 learn:`<p>General resolution can be <strong>computationally expensive</strong> as the number of clauses increases. Horn clauses restrict the form to make inference efficient.</p>
<div class="note"><span class="note-t">Definition</span>A <strong>Horn clause</strong> is a clause containing <strong>at most one positive literal</strong>.</div>
<h4>Example and rewrite</h4>
<div class="fx left"><code>¬A ∨ ¬B ∨ C</code> &nbsp;— a Horn clause, because C is the only positive literal<br>
<code>¬(A ∨ B) ∨ C</code> ⟶ using De Morgan on the negatives: <code>¬(A ∧ B) ∨ C</code><br>
which is exactly &nbsp;<strong><code>A ∧ B → C</code></strong></div>
<p>General form:</p>
<div class="fx">A₁ ∧ A₂ ∧ … ∧ A<sub>n</sub> → B</div>
<p><em>IF all premises are true, THEN conclude B.</em></p>
<h4>Why they matter</h4>
<ul>
<li>Can naturally represent knowledge as <strong>IF–THEN rules</strong>.</li>
<li>Allow <strong>efficient inference</strong>.</li>
<li>Form the basis for <strong>Forward Chaining and Backward Chaining</strong>.</li>
</ul>
<div class="fx left">Horn Clauses = Simple Rule Representation + Efficient Reasoning<br>Horn Clauses → Forward Chaining → Backward Chaining</div>`,
 understand:`<p>The rewrite is worth doing slowly once, because it explains why rule-based expert systems and Prolog exist at all. A clause with one positive literal is <em>the same thing</em> as an IF–THEN rule — so a knowledge base of Horn clauses is a knowledge base of rules, and chaining algorithms can run over it directly instead of doing general resolution.</p>
<p>The restriction is real, though: you cannot express "A or B is true" (two positive literals) as a Horn clause. That is the price of efficiency.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — What is a Horn clause? Why is it important?</strong> A Horn clause is a clause containing at most one positive literal, e.g. ¬A ∨ ¬B ∨ C. Using De Morgan's law this rewrites as A ∧ B → C, i.e. the general form A₁ ∧ A₂ ∧ … ∧ Aₙ → B: if all premises are true, conclude B. Importance: general resolution becomes computationally expensive as the number of clauses grows; Horn clauses naturally represent knowledge as IF–THEN rules, allow efficient inference, and form the basis for forward and backward chaining (and for Prolog). Limitation: they cannot express a disjunction of two positive literals.</p>`,
 mistakes:["Saying 'exactly one positive literal'. It is <em>at most</em> one — a clause of all negative literals is also Horn.",
 "Failing to show the rewrite to IF–THEN form, which is the point of the question."]},

{id:"m3t11", title:"Forward and Backward Chaining", type:"numerical",
 priority:"high", core:true, marks:[10], src:"Chpt 3 Forward_Backward_Chaining (full deck); Knowledge slides 55–64",
 tags:["forward chaining","backward chaining","data driven","goal driven","inference","comparison","numerical"],
 diagram:"chaining",
 concept:"Two directions of rule-based reasoning over the same knowledge base. Forward chaining starts from known facts and derives everything that follows; backward chaining starts from a goal and works back to the facts.",
 formula:"Forward: FACTS → rules → new FACTS → goal        Backward: GOAL → rules → subgoals → facts",
 variables:[
  {v:"Fact", m:"Something the system knows, e.g. GoodCoding(Riya)."},
  {v:"Rule", m:"How new knowledge can be derived, e.g. GoodCoding(x) ∧ GoodAptitude(x) → TechnicalEligible(x)."},
  {v:"Inference", m:"Using existing facts + rules to derive information that was not explicitly stored as a fact."},
  {v:"Substitution", m:"The variable binding found by unification, written e.g. x = Riya. Show it at every step."}],
 whenToUse:"Whenever a set of facts and IF–THEN rules is given and you are asked to derive a conclusion, or asked which reasoning direction is appropriate for a scenario. LO 3.6 asks explicitly for the comparison.",
 learn:`<h4>Forward chaining — data-driven</h4>
<p>When a decision is taken based on available data, the process is called forward chaining. The inference engine starts by evaluating existing facts, derivations and conditions before deducing new information. The endpoint (goal) is achieved through manipulation of knowledge already in the knowledge base. <em>Example: "It is raining."</em></p>
<p><strong>The algorithm:</strong></p>
<ol class="wsteps">
<li>Start with all known facts.</li>
<li>Find rules whose premises are satisfied.</li>
<li>Fire a rule and add its conclusion as a new fact.</li>
<li>Repeat with the expanded fact set.</li>
<li>Stop when the required goal is derived or no new facts can be generated.</li>
</ol>
<p><strong>Properties:</strong> uses a <em>down-up</em> approach (bottom to top); starts from an initial state and uses facts to make a conclusion; data-driven; employed in expert systems and production rule systems. Used in planning, monitoring, controlling and interpreting applications.</p>
<p><strong>Advantages:</strong> can be used to draw multiple conclusions; provides a good basis for arriving at conclusions; more flexible than backward chaining because it has no limitation on the data derived.<br>
<strong>Disadvantages:</strong> may be time-consuming — it can take a lot of time to eliminate and synchronise available data; the explanation of facts or observations is not very clear.</p>
<h4>Backward chaining — goal-driven</h4>
<p>Backtracking from the endpoint or goal to the steps that led to it. Starts from the goal and moves backward to comprehend the steps taken to attain it. <em>Example: "Where are my keys?"</em> Useful for answering specific questions; used in debugging, diagnostics and prescription applications.</p>
<p><strong>The algorithm:</strong></p>
<ol class="wsteps">
<li>Start with the query/goal to be proved.</li>
<li>Find a rule whose conclusion matches the goal.</li>
<li>Replace the goal by the rule's premises (subgoals).</li>
<li>Recursively prove each subgoal using facts or other rules.</li>
<li>Succeed if all required subgoals are proved; otherwise backtrack/fail.</li>
</ol>
<p><strong>Properties:</strong> uses an <em>up-down</em> approach (top to bottom); goal-driven; the endpoint is subdivided into sub-goals to prove the truth of facts; employed in inference engines and complex database systems. <strong>The modus ponens inference rule is used as the basis</strong> for backward chaining.</p>
<p><strong>Advantages:</strong> the result is already known, making it easy to deduce inferences; quicker than forward chaining because the endpoint is available; correct solutions derived effectively if pre-determined rules are met.<br>
<strong>Disadvantages:</strong> reasoning can only start if the endpoint is known; it does not deduce multiple solutions; it only derives data that is needed, making it less flexible.</p>
<h4>The comparison table (LO 3.6)</h4>
<div class="tw"><table><thead><tr><th>Feature</th><th>Forward Chaining</th><th>Backward Chaining</th></tr></thead><tbody>
<tr><td><strong>Starting point</strong></td><td>Known facts</td><td>Goal / query</td></tr>
<tr><td><strong>Direction</strong></td><td>Facts → conclusions</td><td>Goal → subgoals → facts</td></tr>
<tr><td><strong>Type</strong></td><td>Data-driven</td><td>Goal-driven</td></tr>
<tr><td><strong>Approach</strong></td><td>Down-up (bottom to top)</td><td>Up-down (top to bottom)</td></tr>
<tr><td><strong>Main question</strong></td><td>What follows from what I know?</td><td>What must be true to prove this?</td></tr>
<tr><td><strong>Useful when</strong></td><td>Many conclusions may be needed</td><td>A specific query must be answered</td></tr>
<tr><td><strong>Stopping</strong></td><td>Goal reached / no new facts</td><td>Goal proved / a required subgoal fails</td></tr>
</tbody></table></div>
<div class="fx">Forward chaining is data-driven; backward chaining is goal-driven. Both can use the same knowledge base.</div>`,
 understand:`<p>Memory line from the slides: <strong>Forward asks "What can I conclude?" · Backward asks "What must I prove?"</strong></p>
<p>When to choose which:</p>
<ul>
<li><strong>Forward</strong> — new facts arrive continuously; you want all possible consequences; monitoring or rule-trigger systems; multiple conclusions matter. <em>e.g. applying placement eligibility rules to all students.</em></li>
<li><strong>Backward</strong> — you have a specific question; the search space is large; only relevant rules should be explored; diagnosis or query answering. <em>e.g. "Is Riya eligible for this particular job?"</em></li>
</ul>
<p><em>Caution from the slides: these are typical use cases, not absolute restrictions — a system may combine both strategies.</em></p>`,
 worked:{
  problem:"<strong>Placement eligibility (lecture example).</strong><br><em>Known facts:</em> GoodCoding(Riya), GoodAptitude(Riya), GoodCommunication(Riya).<br><em>Rules:</em> R1: GoodCoding(x) ∧ GoodAptitude(x) → TechnicalEligible(x). R2: TechnicalEligible(x) ∧ GoodCommunication(x) → InterviewReady(x). R3: InterviewReady(x) → PlacementReady(x).<br>Derive PlacementReady(Riya) both ways.",
  steps:[
   "<strong>FORWARD CHAINING — initial KB:</strong> GoodCoding(Riya), GoodAptitude(Riya), GoodCommunication(Riya).",
   "<strong>R1 matches</strong> with the substitution x = Riya, since both GoodCoding(Riya) and GoodAptitude(Riya) are present → derive <strong>TechnicalEligible(Riya)</strong>.",
   "<strong>R2 now matches</strong> (x = Riya): TechnicalEligible(Riya) is now a fact and GoodCommunication(Riya) was given → derive <strong>InterviewReady(Riya)</strong>.",
   "<strong>R3 now matches</strong> (x = Riya) → derive <strong>PlacementReady(Riya)</strong>. Goal reached ✓",
   "<strong>BACKWARD CHAINING — goal:</strong> PlacementReady(Riya)?",
   "R3 concludes PlacementReady, so the goal is replaced by the subgoal <strong>InterviewReady(Riya)</strong>.",
   "R2 concludes InterviewReady, so this splits into two subgoals: <strong>TechnicalEligible(Riya)</strong> and <strong>GoodCommunication(Riya)</strong>. The second is already a known fact ✓",
   "R1 concludes TechnicalEligible, so it splits into <strong>GoodCoding(Riya)</strong> and <strong>GoodAptitude(Riya)</strong> — both are known facts ✓",
   "All subgoals are proved, so PlacementReady(Riya) succeeds."],
  answer:"Both directions prove PlacementReady(Riya). Forward chaining derived TechnicalEligible → InterviewReady → PlacementReady from the facts; backward chaining reduced PlacementReady to subgoals until it reached known facts.",
  check:"<strong>Exam tip from the slides:</strong> write the substitution (e.g. x = Riya) and the new fact generated after each rule fires. That trace is what earns the marks."},
 examAnswer:`<p><strong>10 marks — Explain forward and backward chaining with an example, and compare them.</strong> (1) Define inference: using existing facts plus rules to derive information not explicitly stored. (2) <strong>Forward chaining</strong> — data-driven, down-up: state the five algorithm steps and note it is used in expert systems, production rule systems, planning, monitoring and control. (3) <strong>Backward chaining</strong> — goal-driven, up-down: state the five algorithm steps, that the goal is subdivided into subgoals, and that <em>modus ponens is the basis</em>; used in debugging, diagnostics and prescription. (4) <strong>Work the same knowledge base in both directions</strong>, writing the substitution and the new fact or subgoal at each step — the trace is what carries the marks. (5) Give the comparison table on starting point, direction, type, approach, main question, when useful, and stopping condition. (6) Give one advantage and one disadvantage of each. Close with: <em>same knowledge base, opposite reasoning direction.</em></p>`,
 mistakes:[
  "Starting forward chaining from the goal instead of from the known facts.",
  "Calling backward chaining 'data-driven' or forward chaining 'goal-driven'. Forward = data-driven, backward = goal-driven.",
  "Applying a rule before <em>all</em> its required premises are satisfied.",
  "Forgetting substitutions/unification when variables are present.",
  "Treating a failed proof as proof that the query is false — it may only mean the KB cannot prove it.",
  "Writing only the final conclusion without showing the inference sequence."],
 practice:[
  {d:"Basic", q:"Which direction would you choose for each scenario, and why? (A) Given all students' marks, skills and attendance, determine every student who becomes placement-eligible. (B) A recruiter asks: 'Is Riya eligible for Job J?' (C) A rule-based alert system receives sensor facts continuously and must trigger applicable alerts. (D) A diagnostic system is asked whether a specific fault F explains the observed symptoms.",
   s:"<p><strong>(A) Forward chaining.</strong> You want <em>all</em> possible conclusions from a body of data, not the answer to one question.</p><p><strong>(B) Backward chaining.</strong> A single specific query — only rules relevant to that goal need to be explored.</p><p><strong>(C) Forward chaining.</strong> New facts arrive continuously and every applicable consequence must be triggered; this is the classic monitoring / rule-trigger case.</p><p><strong>(D) Backward chaining.</strong> Diagnosis with a specific hypothesis to confirm — the endpoint is known.</p>"},
  {d:"Exam-level", q:"<strong>The classic 'Is West a criminal?' problem.</strong> The law says it is a crime for an American to sell weapons to hostile nations. The country Nono, an enemy of America, has some missiles, and all of its missiles were sold to it by Colonel West, who is American. Prove Criminal(West) by (a) forward chaining and (b) backward chaining.",
   s:`<p><strong>Facts:</strong> American(West), Missile(M1), Owns(Nono, M1), Enemy(Nono, America).</p>
<p><strong>Rules:</strong><br>R1: Missile(x) → Weapon(x)<br>R2: Missile(x) ∧ Owns(Nono, x) → Sells(West, x, Nono)<br>R3: Enemy(x, America) → Hostile(x)<br>R4: American(x) ∧ Weapon(y) ∧ Sells(x,y,z) ∧ Hostile(z) → Criminal(x)</p>
<p><strong>(a) Forward chaining</strong> — start from facts and derive:</p>
<ol><li>Missile(M1) fires R1 {x/M1} → <strong>Weapon(M1)</strong></li>
<li>Missile(M1) + Owns(Nono, M1) fire R2 {x/M1} → <strong>Sells(West, M1, Nono)</strong></li>
<li>Enemy(Nono, America) fires R3 {x/Nono} → <strong>Hostile(Nono)</strong></li>
<li>American(West) + Weapon(M1) + Sells(West, M1, Nono) + Hostile(Nono) fire R4 → <strong>Criminal(West) ✓</strong></li></ol>
<p><em>Forward view: start from facts → derive Weapon, Sells and Hostile → fire the criminal rule.</em></p>
<p><strong>(b) Backward chaining</strong> — start from the goal and reduce:</p>
<ol><li>Goal: <strong>Criminal(West)?</strong> R4 concludes Criminal, giving four subgoals.</li>
<li>American(West)? — a known fact ✓</li>
<li>Weapon(y)? — R1 reduces it to Missile(y); Missile(M1) is a fact, so y = M1 ✓</li>
<li>Sells(West, y, z)? — R2 reduces it to Missile(M1) ∧ Owns(Nono, M1); both are facts, so z = Nono ✓</li>
<li>Hostile(z)? — R3 reduces it to Enemy(Nono, America), which is a fact ✓</li></ol>
<div class='ans'>Unification gives x = West, y = M1, z = Nono, so all subgoals succeed and Criminal(West) is proved. Backward view: start from Criminal(West) → ask what must be true → reduce the goal until known facts are reached.</div>
<p><em>Same knowledge base, opposite reasoning direction — state that line in your conclusion.</em></p>`}]},

{id:"m3t12", title:"Semantic Networks", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 3 semantic network deck slides 4–6; class notes",
 tags:["semantic network","is-a","inheritance","graph","nodes","links","construct"],
 diagram:"semanticNet",
 learn:`<div class="note"><span class="note-t">Definition</span>A <strong>semantic network</strong> is a graph in which <strong>nodes represent concepts, objects or classes</strong> and <strong>labelled links represent their semantic relationships</strong>.</div>
<ul>
<li>Common links: <strong>IS-A, INSTANCE-OF, HAS-A, PART-OF</strong>.</li>
<li>Knowledge is visually intuitive and supports <strong>inheritance</strong>.</li>
</ul>
<h4>Inheritance</h4>
<p>Store a general property <em>once</em> and inherit it down the hierarchy. Bird has → Wings, has → Feathers, and by default can → Fly. Sparrow inherits all of these.</p>
<div class="note warn"><span class="note-t">Exam point</span><strong>Inheritance avoids repeating general properties, but exceptions must be represented explicitly.</strong> Penguin IS-A Bird, but Penguin cannot → Fly, and this exception must be stated on the Penguin node.</div>`,
 understand:`<p>The exception problem is the entire reason this topic is examinable rather than trivial. Inheritance is what makes the network compact; exceptions are what make it correct. A question asking you to "construct a semantic network" is really asking whether you know to mark the exception.</p>
<p><strong>Constructing one in the exam:</strong> the class activity gives the exact rubric — use at least <strong>6 nodes</strong>, at least <strong>5 labelled relationships</strong>, include at least one <strong>IS-A</strong> link, and identify one <strong>property that could be inherited</strong>.</p>`,
 examples:[{t:"College placement network (class answer)",b:"Student —IS-A→ Rhea · Rhea —HAS-SKILL→ JAVA · Rhea —studies in→ FCRIT · Student —applies for→ JOB · JOB —offered by→ TCS · TCS —gives→ Offer Letter · Student —has→ Referral · Referral —gets→ Offer Letter"}],
 examAnswer:`<p><strong>5 marks — Explain semantic networks and construct one.</strong> Define: a semantic network represents knowledge as a graph where nodes are objects, concepts or classes and labelled links are semantic relationships; common links are IS-A, INSTANCE-OF, HAS-A, PART-OF. Explain inheritance: a general property stored once at a superclass is inherited by all subclasses, which avoids repetition — but exceptions must be represented explicitly (Penguin IS-A Bird, yet cannot fly). <strong>Draw the network</strong>: Animal → Mammal, Bird (IS-A); Mammal → Cat, Dog; Bird → Sparrow, Penguin; attach "can fly" to Bird and "cannot fly" to Penguin. State one strength (intuitive, visual) and one limitation (exceptions and quantification are awkward).</p>`,
 mistakes:["Drawing unlabelled arrows. The <em>labels</em> on the links are what makes it semantic.",
 "Forgetting the exception case, which is the standard follow-up question.",
 "Confusing IS-A (class to superclass) with INSTANCE-OF (individual to class)."]},

{id:"m3t13", title:"Ontologies", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 3 semantic network deck slides 7–9",
 tags:["ontology","classes","properties","constraints","taxonomy","owl","schema"],
 learn:`<div class="note"><span class="note-t">Definition</span>An <strong>ontology</strong> is a <strong>formal, shared specification of concepts and relationships in a domain</strong> — it defines the vocabulary, meaning, relationships and constraints of that domain. Think of it as <em>the schema of meaning</em>.</div>
<ul>
<li>Defines <strong>classes/concepts</strong>.</li>
<li>Defines <strong>properties and relationships</strong>.</li>
<li>Can define <strong>constraints and hierarchies</strong>.</li>
<li>Provides a <strong>common vocabulary</strong> with explicit meaning.</li>
<li>Supports <strong>consistency and reasoning</strong>.</li>
</ul>
<h4>Ontology building blocks</h4>
<div class="tw"><table><thead><tr><th>Building block</th><th>Meaning</th><th>Example</th></tr></thead><tbody>
<tr><td><strong>Classes</strong></td><td>Categories</td><td>Student, Company, Job, Skill</td></tr>
<tr><td><strong>Individuals</strong></td><td>Instances</td><td>Riya, TCS, DeveloperJob</td></tr>
<tr><td><strong>Object properties</strong></td><td>Link entities to entities</td><td>hasSkill, offersJob, appliesFor</td></tr>
<tr><td><strong>Data properties</strong></td><td>Link an entity to a value</td><td>CGPA = 8.4, salary = 8 LPA</td></tr>
<tr><td><strong>Constraints</strong></td><td>Restrictions on validity</td><td>Job requires ≥ 1 Skill</td></tr>
</tbody></table></div>
<h4>Taxonomy vs Ontology</h4>
<div class="tw"><table><thead><tr><th>Taxonomy</th><th>Ontology</th></tr></thead><tbody>
<tr><td>Mostly "is-a" classification<br><em>Job → Technical Job, Management Job</em></td><td>Hierarchy + rich relationships + constraints<br><em>Student —appliesFor→ Job —requires→ Skill ←hasSkill— Student</em></td></tr>
</tbody></table></div>
<p><strong>Exam point:</strong> a taxonomy mainly classifies using IS-A; an ontology adds richer relationships, properties and constraints.</p>`,
 understand:`<p>Remember the shorthand: <strong>Class = category · Individual = instance · Object property links entities · Data property links an entity to a value.</strong></p>
<p>An ontology is the <em>grammar</em> of a domain. It says what kinds of things can exist and which links between them are legal — but it does not, by itself, contain the facts. That is what a knowledge graph is for.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — What is an ontology?</strong> An ontology is a formal, shared specification of the concepts and relationships in a domain — the schema of meaning. It defines classes, properties and relationships, can express constraints and hierarchies, provides a common vocabulary with explicit meaning, and supports consistency and reasoning. Give the five building blocks with examples: classes (Student, Company), individuals (Riya, TCS), object properties (hasSkill, offersJob), data properties (CGPA = 8.4), constraints (a Job requires at least one Skill). Distinguish it from a taxonomy: a taxonomy mainly classifies with IS-A links, while an ontology adds richer relationships, properties and constraints.</p>`,
 mistakes:["Treating an ontology and a taxonomy as the same thing.",
 "Confusing object properties (entity → entity) with data properties (entity → value).",
 "Saying an ontology stores facts about individuals. It defines what is <em>valid</em>; the knowledge graph stores the facts."]},

{id:"m3t14", title:"Knowledge Graphs", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 3 semantic network deck slides 10–13",
 tags:["knowledge graph","triple","rdf","entities","retrieval","subject predicate object"],
 diagram:"kgTriple",
 learn:`<div class="note"><span class="note-t">Definition</span>A <strong>knowledge graph</strong> represents facts as <strong>entities connected by typed relationships</strong>. RDF-based knowledge graphs express statements as <strong>Subject — Predicate → Object</strong>.</div>
<div class="fx">Triple = ( Subject , Predicate , Object )&nbsp;&nbsp;&nbsp;e.g. ( Riya , hasSkill , Python )</div>
<h4>Worked example — placement system</h4>
<div class="tw"><table><thead><tr><th>Subject</th><th>Predicate</th><th>Object</th></tr></thead><tbody>
<tr><td>Riya</td><td>hasSkill</td><td>Python</td></tr>
<tr><td>Riya</td><td>hasSkill</td><td>SQL</td></tr>
<tr><td>Riya</td><td>appliesFor</td><td>Developer Job</td></tr>
<tr><td>Developer Job</td><td>requiresSkill</td><td>Python</td></tr>
<tr><td>Developer Job</td><td>offeredBy</td><td>TCS</td></tr>
<tr><td>Developer Job</td><td>locatedAt</td><td>Mumbai</td></tr>
</tbody></table></div>
<p>Each arrow is a typed relationship; together the triples form a connected knowledge graph.</p>
<h4>Ontology vs Knowledge Graph</h4>
<div class="tw"><table><thead><tr><th>Aspect</th><th>Ontology</th><th>Knowledge Graph</th></tr></thead><tbody>
<tr><td><strong>Purpose</strong></td><td>Defines domain meaning / schema</td><td>Stores connected facts / instances</td></tr>
<tr><td><strong>Contains</strong></td><td>Classes, properties, constraints</td><td>Entities, relations, attributes</td></tr>
<tr><td><strong>Example</strong></td><td>Student hasSkill Skill</td><td>Riya hasSkill Python</td></tr>
<tr><td><strong>Question answered</strong></td><td>What kinds of things and links are valid?</td><td>What facts are known about actual entities?</td></tr>
<tr><td><strong>Analogy</strong></td><td>Grammar / blueprint</td><td>Sentences / populated map</td></tr>
</tbody></table></div>
<h4>Why knowledge graphs enable intelligent retrieval</h4>
<p>Query: <em>"Which students match jobs requiring Python?"</em> Retrieval can traverse multiple relationships — Student —hasSkill→ Python —requiredBy→ Developer Job —offeredBy→ TCS — to discover an answer that <strong>is not stored as one explicit sentence</strong>.</p>
<p><strong>Key idea:</strong> keyword search matches words; semantic retrieval follows relationships to find meaningfully related answers.</p>`,
 understand:`<p>The ontology/knowledge-graph distinction is the most likely 5-mark comparison in this group, and the analogy row is the fastest way to make it stick: <strong>ontology = grammar, knowledge graph = the sentences written in that grammar.</strong></p>
<p>The retrieval point is what makes knowledge graphs matter commercially: the graph can connect Riya's skill to a job requirement even though nobody ever stored the statement "Riya matches this job".</p>`,
 examples:[{t:"Self-learning topic from the syllabus",b:"Knowledge Graphs in Google, LinkedIn and ChatGPT."}],
 examAnswer:`<p><strong>5 marks — Distinguish an ontology from a knowledge graph.</strong> An ontology is a formal specification of a domain's schema — classes, properties and constraints; it answers "what kinds of things and links are valid?" and is analogous to grammar or a blueprint. A knowledge graph stores connected facts about actual entities as typed relationships; it answers "what facts are known about actual entities?" and is analogous to sentences or a populated map. Example: the ontology states <em>Student hasSkill Skill</em>; the knowledge graph states <em>Riya hasSkill Python</em>. Add: RDF knowledge graphs express facts as triples (Subject — Predicate → Object), and traversal over the graph enables retrieval of answers that were never stored explicitly. They are related, not identical.</p>`,
 mistakes:["Saying a knowledge graph is just a database. The typed relationships and traversal are what distinguish it.",
 "Treating ontology and knowledge graph as synonyms — the slides warn explicitly against this.",
 "Drawing a triple with the predicate as a node. The predicate is the <em>labelled edge</em>; subject and object are the nodes."]},

{id:"m3t15", title:"Semantic Web", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 3 semantic network deck slides 14–19",
 tags:["semantic web","rdf","rdfs","owl","sparql","uri","linked data","stack"],
 learn:`<div class="note"><span class="note-t">Definition</span>The <strong>Semantic Web</strong> aims to make Web data <strong>machine-readable and linkable using explicit meaning</strong>, not just hyperlinks between pages.</div>
<ul>
<li>Traditional Web: <strong>documents linked to documents</strong>.</li>
<li>Semantic Web: <strong>data linked to data with explicit meaning</strong>.</li>
<li>Uses shared identifiers and vocabularies.</li>
<li>Enables integration across different sources.</li>
<li>Supports machine-readable discovery and reasoning.</li>
</ul>
<h4>The technology stack (bottom to top)</h4>
<div class="tw"><table><thead><tr><th>Layer</th><th>Role</th></tr></thead><tbody>
<tr><td><strong>URI / IRI</strong></td><td>Global identifiers — <em>Identify</em></td></tr>
<tr><td><strong>RDF</strong></td><td>Triples / graph data model — <em>Represent</em></td></tr>
<tr><td><strong>RDFS</strong></td><td>Classes &amp; property vocabularies — <em>Describe meaning</em></td></tr>
<tr><td><strong>OWL</strong></td><td>Richer ontology semantics — <em>Describe meaning</em></td></tr>
<tr><td><strong>SPARQL</strong></td><td>Query graph data — <em>Query</em></td></tr>
<tr><td><strong>Applications</strong></td><td>Intelligent retrieval</td></tr>
</tbody></table></div>
<div class="note tip"><span class="note-t">Memory aid from the slides</span><strong>URI/IRI = Identify · RDF = Represent · RDFS/OWL = Describe meaning · SPARQL = Query</strong></div>
<h4>RDF: the triple model</h4>
<p>The Resource Description Framework represents statements as triples. In an RDF graph, the <strong>subject and object are nodes</strong>; the <strong>predicate labels the directed edge</strong> between them.</p>
<div class="fx">( Riya , hasSkill , Python )</div>
<h4>SPARQL: querying relationships</h4>
<p>Think in <strong>graph patterns</strong>. Question: <em>"Find students who have a skill required by a job."</em></p>
<pre style="background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:.7rem;overflow-x:auto;font-size:.83rem;font-family:var(--mono);line-height:1.6">SELECT ?student ?job
WHERE {
  ?student  hasSkill       ?skill .
  ?job      requiresSkill  ?skill .
}</pre>
<p>SPARQL retrieves RDF data by matching graph patterns — here, a student's skill against a job requiring the same skill.</p>
<h4>How the four concepts fit together</h4>
<div class="fx left"><strong>Semantic Network</strong> (visual relationships) → <strong>Ontology</strong> (formal meaning) → <strong>Knowledge Graph</strong> (connected facts) → <strong>Semantic Web</strong> (linked data across systems)</div>
<p><em>Important: this is a conceptual progression for learning, not a strict historical pipeline. In real systems these ideas overlap.</em></p>`,
 understand:`<p>For the final comparison question, remember one row per concept:</p>
<div class="tw"><table><thead><tr><th>Aspect</th><th>Semantic Network</th><th>Ontology</th><th>Knowledge Graph</th><th>Semantic Web</th></tr></thead><tbody>
<tr><td><strong>Representation</strong></td><td>Graph of concepts</td><td>Formal domain model</td><td>Graph of facts</td><td>Web of linked data</td></tr>
<tr><td><strong>Main focus</strong></td><td>Relationships</td><td>Meaning + constraints</td><td>Entities + facts</td><td>Interoperability</td></tr>
<tr><td><strong>Typical element</strong></td><td>IS-A link</td><td>Class / property</td><td>Triple</td><td>RDF / OWL / SPARQL</td></tr>
<tr><td><strong>Strength</strong></td><td>Intuitive</td><td>Precise semantics</td><td>Rich retrieval</td><td>Cross-source integration</td></tr>
</tbody></table></div>
<p class="dia-cap" style="border:0;text-align:left"><strong>Exam tip from the slides:</strong> for a comparison answer, write the <em>main focus, representation, typical element and one strength</em> of each concept.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Explain Semantic Web concepts and how they support intelligent information retrieval.</strong> The Semantic Web makes Web data machine-readable and linkable through explicit meaning: the traditional Web links documents to documents, whereas the Semantic Web links <em>data to data</em> using shared identifiers and vocabularies, enabling integration across sources and machine reasoning. Give the stack: URI/IRI (identify), RDF (represent as triples), RDFS and OWL (describe meaning), SPARQL (query). Explain the RDF triple — subject and object are nodes, the predicate is the labelled directed edge, e.g. (Riya, hasSkill, Python). Show a short SPARQL graph pattern. Conclude with retrieval: keyword search matches words, but semantic retrieval traverses relationships, so it can answer "which students match jobs requiring Python?" even though that statement was never explicitly stored.</p>`,
 mistakes:["Saying the Semantic Web replaces the current Web. It adds a machine-readable meaning layer on top of it.",
 "Confusing RDFS with RDF. RDF is the triple data model; RDFS adds class and property vocabularies.",
 "Describing SPARQL as SQL for tables. It matches <em>graph patterns</em>, not rows.",
 "Presenting the four concepts as a strict historical pipeline — the slides explicitly warn that they overlap."]},

{id:"m3t16", title:"The Knowledge Engineering Process", type:"theory",
 priority:"medium", core:false, marks:[5], src:"Chpt 3 Knowledge slides 65–66",
 tags:["knowledge engineering","ontology","debug","axioms","process","vocabulary"],
 learn:`<p>The seven steps of building a knowledge base:</p>
<ol class="wsteps">
<li><strong>Identify the task</strong> — find the range of questions the KB must support and the facts available.</li>
<li><strong>Assemble the relevant knowledge</strong> — knowledge acquisition from domain experts.</li>
<li><strong>Define the vocabulary</strong> — translate domain concepts into logic-level names. An <em>ontology</em> (vocabulary) is created which determines what things exist, but not their relationships.</li>
<li><strong>Encode general knowledge about the domain</strong> — axioms are written for all vocabulary terms, and gaps are identified by domain experts.</li>
<li><strong>Encode the problem</strong> — write simple atomic sentences about instances of concepts already part of the ontology.</li>
<li><strong>Query the knowledge base</strong> — apply the inference procedure to the axioms and problem-specific facts to derive the facts we want to know.</li>
<li><strong>Debug the knowledge base</strong> — check for correctness of inference procedures, missing axioms, incorrect axioms, etc.</li>
</ol>`,
 understand:`<p>Note the division of labour in steps 3–5: the <em>vocabulary/ontology</em> and the <em>general axioms</em> are reusable across many problems in the domain, while step 5 (the problem-specific atomic sentences) changes with every new query. That separation is what makes a knowledge base worth building once and using many times.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Explain the knowledge engineering process.</strong> List all seven steps with one line each: identify the task (which questions must the KB support); assemble relevant knowledge from domain experts; define the vocabulary by translating domain concepts into logic-level names, producing an ontology that says what exists; encode general knowledge about the domain as axioms for every vocabulary term; encode the specific problem as atomic sentences about instances; query the knowledge base by applying the inference procedure; debug the knowledge base by checking for incorrect or missing axioms and faulty inference. Note that steps 3–4 are reusable while step 5 is problem-specific.</p>`,
 mistakes:["Merging steps 4 and 5. General axioms (reusable) and problem-specific facts (per query) are separate steps.",
 "Omitting the debugging step — it is one of the seven and carries a mark."]}
]},

{id:"m4t1", title:"Uncertainty and Why We Need Probability", type:"theory",
 priority:"high", core:true, marks:[5], src:"Chpt 3 Knowledge slides 67–69",
 tags:["uncertainty","laziness","ignorance","decision theory","utility","probability"],
 learn:`<p>Uncertainty arises due to <strong>partial observability, nondeterminism, or a combination of the two</strong>. An agent may not know where it will end up after a sequence of actions.</p>
<h4>Why logic fails for medical diagnosis — the three reasons</h4>
<ol>
<li><strong>Laziness.</strong> It is too much work to list the complete set of antecedents and consequents needed to ensure an exceptionless rule, and too hard to use such a rule.</li>
<li><strong>Theoretical ignorance.</strong> Medical science has no complete theory for the domain.</li>
<li><strong>Practical ignorance.</strong> Even if we knew all the rules, we might be uncertain about a particular patient because not all the necessary tests have been or can be run.</li>
</ol>
<h4>The use of probability theory</h4>
<ul>
<li>Probability provides a way of <strong>summarizing the uncertainty that comes from our laziness and ignorance</strong>.</li>
<li>An agent's knowledge can at best provide only a <strong>degree of belief</strong> in the relevant sentences.</li>
<li>To make choices, an agent must have <strong>preferences</strong> between the different possible outcomes of the various plans.</li>
<li>So we use <strong>utility theory</strong> to represent and reason with preferences.</li>
</ul>
<div class="fx">Decision Theory = Probability Theory + Utility Theory</div>`,
 understand:`<p>The three reasons are not interchangeable, and examiners look for the distinction: <strong>laziness</strong> is a problem with <em>us</em> (we cannot be bothered to write every exception), <strong>theoretical ignorance</strong> is a problem with the <em>science</em> (nobody knows the full theory), and <strong>practical ignorance</strong> is a problem with <em>this particular case</em> (the tests were not run).</p>
<p>The final equation is the punchline of the whole topic: probability tells you what is likely, utility tells you what you want, and decisions need both.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Why is probability needed in AI?</strong> Uncertainty arises from partial observability, nondeterminism, or both, so an agent may not know the outcome of its actions. Using logic in domains such as medical diagnosis fails for three reasons: <em>laziness</em> (too much work to list every antecedent and consequent for an exceptionless rule), <em>theoretical ignorance</em> (medical science has no complete theory of the domain), and <em>practical ignorance</em> (not all necessary tests have been run for this patient). Probability summarises the uncertainty arising from laziness and ignorance, giving a degree of belief rather than certainty. Since an agent must also have preferences between outcomes, we add utility theory: <strong>Decision Theory = Probability Theory + Utility Theory</strong>.</p>`,
 mistakes:["Giving only two of the three reasons — laziness, theoretical ignorance and practical ignorance are all examinable.",
 "Confusing theoretical with practical ignorance.",
 "Omitting the decision-theory equation, which is usually the final mark."]},

{id:"m4t2", title:"Prior and Posterior Probability, Bayes' Rule", type:"numerical",
 priority:"high", core:true, marks:[5], src:"Chpt 3 Knowledge slides 70–72",
 tags:["bayes","prior","posterior","conditional","product rule","diagnostic","numerical"],
 concept:"Bayes' rule inverts a conditional probability. It lets us compute the diagnostic direction P(cause | effect), which is what we actually want, from the causal direction P(effect | cause), which is what is actually measurable.",
 formula:"P(A | B) = P(B | A) · P(A) / P(B)",
 variables:[
