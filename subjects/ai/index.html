<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Study Hub — CEPCC712 Artificial Intelligence</title>
<meta name="description" content="Exam-preparation dashboard for CEPCC712 Artificial Intelligence (B.Tech Computer Engineering, N-2024). Progress is stored locally in your browser.">
<style>
/* ============================= DESIGN TOKENS ============================= */
:root{
  --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f6f6f5; --surface-3:#efeff1;
  --border:#e3e3e6; --border-strong:#cfcfd4;
  --text:#191a1d; --text-2:#4a4c53; --muted:#74767e;
  --accent:#4a48c4; --accent-text:#3a38a8; --accent-soft:#ecebfb; --accent-border:#c9c7f2;
  --ok:#166534; --ok-soft:#e7f4ea; --ok-border:#bcdfc6;
  --warn:#8a5300; --warn-soft:#fdf1de; --warn-border:#f0d7ae;
  --danger:#a91d1d; --danger-soft:#fdeaea; --danger-border:#f2c4c4;
  --radius:10px; --radius-sm:7px; --radius-lg:14px;
  --shadow:0 1px 2px rgba(16,17,20,.05), 0 1px 3px rgba(16,17,20,.04);
  --shadow-lg:0 4px 16px rgba(16,17,20,.08), 0 1px 3px rgba(16,17,20,.05);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#161920; --surface-2:#1c2029; --surface-3:#242934;
  --border:#2a2f3a; --border-strong:#3a4150;
  --text:#e9eaee; --text-2:#c0c4cd; --muted:#8d939f;
  --accent:#8b88f0; --accent-text:#a5a2f7; --accent-soft:#1e1d3a; --accent-border:#3b3878;
  --ok:#6ee7a0; --ok-soft:#10241a; --ok-border:#1f4a32;
  --warn:#f0bf72; --warn-soft:#2a1f0d; --warn-border:#553f18;
  --danger:#f79191; --danger-soft:#2b1414; --danger-border:#5a2626;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --surface:#161920; --surface-2:#1c2029; --surface-3:#242934;
    --border:#2a2f3a; --border-strong:#3a4150;
    --text:#e9eaee; --text-2:#c0c4cd; --muted:#8d939f;
    --accent:#8b88f0; --accent-text:#a5a2f7; --accent-soft:#1e1d3a; --accent-border:#3b3878;
    --ok:#6ee7a0; --ok-soft:#10241a; --ok-border:#1f4a32;
    --warn:#f0bf72; --warn-soft:#2a1f0d; --warn-border:#553f18;
    --danger:#f79191; --danger-soft:#2b1414; --danger-border:#5a2626;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-lg:0 6px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
/* ============================= BASE ============================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg{max-width:100%}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.011em;line-height:1.25}
h1{font-size:1.6rem} h2{font-size:1.22rem} h3{font-size:1.02rem} h4{font-size:.93rem}
p{margin:0 0 .8em}
ul,ol{margin:0 0 .8em;padding-left:1.25em}
li{margin:.28em 0}
a{color:var(--accent-text)}
code,kbd{font-family:var(--mono);font-size:.88em;background:var(--surface-3);
  padding:.1em .36em;border-radius:4px;border:1px solid var(--border)}
hr{border:0;border-top:1px solid var(--border);margin:1.25rem 0}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
::selection{background:var(--accent-soft);color:var(--accent-text)}
/* ============================= LAYOUT ============================= */
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--accent);color:#fff;
  padding:.6rem 1rem;border-radius:0 0 var(--radius) 0;font-weight:600}
.skip:focus{left:0}
.shell{display:flex;min-height:100vh}
/* Sidebar */
.side{width:240px;flex:0 0 240px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:60}
.brand{padding:1.05rem 1.05rem .85rem;border-bottom:1px solid var(--border)}
.brand-code{font:600 .68rem/1 var(--mono);letter-spacing:.09em;color:var(--accent-text);
  text-transform:uppercase;margin-bottom:.4rem}
.brand-name{font-size:1.03rem;font-weight:680;letter-spacing:-.02em}
.brand-sub{font-size:.74rem;color:var(--muted);margin-top:.18rem;line-height:1.35}
.nav{padding:.6rem .55rem;flex:1}
.nav-label{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:.7rem .5rem .3rem}
.nav a{display:flex;align-items:center;gap:.55rem;padding:.47rem .55rem;border-radius:var(--radius-sm);
  color:var(--text-2);text-decoration:none;font-size:.875rem;font-weight:500;position:relative}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:620}
.nav a .ic{width:1.05rem;text-align:center;flex:0 0 auto;font-size:.95rem;opacity:.85}
.nav a .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav a .pct{margin-left:auto;font:600 .69rem/1 var(--mono);color:var(--muted);
  background:var(--surface-3);padding:.2rem .3rem;border-radius:4px;min-width:2.4em;text-align:center}
.nav a[aria-current="page"] .pct{background:var(--surface);color:var(--accent-text)}
.side-foot{padding:.7rem .8rem 1rem;border-top:1px solid var(--border);font-size:.72rem;color:var(--muted)}
/* Mobile nav */
.mtop{display:none;position:sticky;top:0;z-index:70;background:var(--surface);
  border-bottom:1px solid var(--border);padding:.55rem .75rem;align-items:center;gap:.6rem}
.scrim{display:none;position:fixed;inset:0;background:rgba(10,11,14,.45);z-index:55}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:.6rem 1.35rem;display:flex;align-items:center;gap:.7rem}
.wrap{max-width:920px;margin:0 auto;padding:1.5rem 1.35rem 5rem;width:100%}
.wrap.wide{max-width:1100px}
/* ============================= CONTROLS ============================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.44rem .8rem;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
  background:var(--surface);color:var(--text);font:inherit;font-size:.845rem;font-weight:550;
  cursor:pointer;text-decoration:none;line-height:1.4;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:active{transform:translateY(.5px)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-text);border-color:var(--accent-text);color:#fff}
:root[data-theme="dark"] .btn-primary{color:#12131a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#12131a}}
.btn-sm{padding:.28rem .58rem;font-size:.785rem}
.btn-danger{color:var(--danger);border-color:var(--danger-border)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border)}
.btn-row{display:flex;flex-wrap:wrap;gap:.5rem}
.icon-btn{width:34px;height:34px;padding:0;flex:0 0 auto;font-size:1rem}
select,input[type=text],input[type=search],input[type=number],textarea{
  font:inherit;font-size:.855rem;padding:.4rem .55rem;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);max-width:100%}
input[type=search]{-webkit-appearance:none}
label{font-size:.8rem;font-weight:550;color:var(--text-2)}
/* Search box */
.searchbox{position:relative;flex:1;max-width:440px}
.searchbox input{width:100%;padding-left:2rem}
.searchbox .mag{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:.85rem;pointer-events:none}
.results{position:absolute;top:calc(100% + .35rem);left:0;right:0;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  max-height:70vh;overflow-y:auto;z-index:90;padding:.3rem}
.results:empty{display:none}
.res{display:block;width:100%;text-align:left;padding:.5rem .6rem;border:0;background:none;
  border-radius:var(--radius-sm);cursor:pointer;font:inherit;color:var(--text)}
.res:hover,.res:focus{background:var(--accent-soft);outline:none}
.res-t{font-weight:600;font-size:.86rem;margin-bottom:.12rem}
.res-p{font-size:.73rem;color:var(--muted);font-family:var(--mono)}
.res-s{font-size:.78rem;color:var(--text-2);margin-top:.2rem;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res-none{padding:.8rem;color:var(--muted);font-size:.83rem;text-align:center}
/* ============================= CARDS / SURFACES ============================= */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:1rem 1.1rem;box-shadow:var(--shadow)}
.card+.card{margin-top:.8rem}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem;margin-bottom:.7rem}
.grid{display:grid;gap:.8rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}
.page-h{margin-bottom:1.3rem}
.page-h .eyebrow{font:600 .69rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent-text);margin-bottom:.45rem}
.page-h p{color:var(--text-2);margin:.45rem 0 0;font-size:.9rem;max-width:65ch}
.sec-h{display:flex;align-items:baseline;gap:.6rem;margin:1.7rem 0 .75rem;flex-wrap:wrap}
.sec-h h2{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.sec-h .hint{font-size:.78rem;color:var(--muted)}
/* ============================= BADGES ============================= */
.badge{display:inline-flex;align-items:center;gap:.25rem;font-size:.68rem;font-weight:650;
  padding:.16rem .42rem;border-radius:5px;border:1px solid var(--border);
  background:var(--surface-3);color:var(--text-2);white-space:nowrap;letter-spacing:.01em;
  max-width:100%;overflow-wrap:anywhere}
.badge.b-src{white-space:normal;text-align:left;line-height:1.35;display:inline-block}
.b-high{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-border)}
.b-med{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-border)}
.b-low{background:var(--surface-3);color:var(--muted)}
.b-theory{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-border)}
.b-num{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-border)}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-border)}
.b-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-border)}
.badges{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
/* ============================= PROGRESS ============================= */
.bar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden;
  border:1px solid var(--border)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;
  transition:width .35s cubic-bezier(.4,0,.2,1)}
.bar.ok>i{background:var(--ok)}
.bar.sm{height:5px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:.75rem .85rem;box-shadow:var(--shadow)}
.stat .k{font-size:.7rem;font-weight:650;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:.3rem}
.stat .v{font:680 1.5rem/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.85rem;font-weight:550;color:var(--muted);letter-spacing:0}
.stat .sub{font-size:.73rem;color:var(--muted);margin-top:.3rem}
.stat .bar{margin-top:.5rem}
.ring-wrap{display:flex;align-items:center;gap:1rem}
.ring{flex:0 0 auto}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .trk{stroke:var(--surface-3)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1);
  transform:rotate(-90deg);transform-origin:50% 50%}
/* ============================= TOPIC ROWS ============================= */
.trow{display:flex;align-items:flex-start;gap:.7rem;padding:.62rem .1rem;
  border-bottom:1px solid var(--border)}
.trow:last-child{border-bottom:0}
.trow-main{flex:1;min-width:0}
.trow-t{font-weight:570;font-size:.9rem;margin-bottom:.25rem;display:block;text-align:left;
  background:none;border:0;padding:0;color:var(--text);cursor:pointer;font-family:inherit;
  line-height:1.4}
.trow-t:hover{color:var(--accent-text);text-decoration:underline;text-underline-offset:2px}
.trow.done .trow-t{color:var(--muted)}
/* 3-state status control */
.status{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  overflow:hidden;flex:0 0 auto;background:var(--surface)}
.status button{border:0;background:none;padding:.24rem .42rem;cursor:pointer;font-size:.8rem;
  line-height:1.2;color:var(--muted);font-family:inherit;border-right:1px solid var(--border)}
.status button:last-child{border-right:0}
.status button:hover{background:var(--surface-2);color:var(--text)}
.status button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);font-weight:700}
.status button[aria-pressed="true"][data-s="done"]{background:var(--ok-soft);color:var(--ok)}
.status button[aria-pressed="true"][data-s="prog"]{background:var(--warn-soft);color:var(--warn)}
/* ============================= STUDY VIEW ============================= */
.study-nav{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  margin-bottom:1.1rem;flex-wrap:wrap}
.crumb{font-size:.76rem;color:var(--muted);font-family:var(--mono)}
.steps{display:flex;gap:.3rem;flex-wrap:wrap;margin:1rem 0 1.2rem;
  border-bottom:1px solid var(--border);padding-bottom:.55rem}
.steps button{border:1px solid transparent;background:none;padding:.3rem .6rem;border-radius:var(--radius-sm);
  font:inherit;font-size:.82rem;font-weight:550;color:var(--muted);cursor:pointer}
.steps button:hover{background:var(--surface-2);color:var(--text)}
.steps button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-text);
  border-color:var(--accent-border);font-weight:650}
.prose{font-size:.925rem;line-height:1.68;color:var(--text)}
.prose>h4{margin:1.3rem 0 .5rem;font-size:.86rem;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);font-weight:700}
.prose>h4:first-child{margin-top:0}
.prose strong{font-weight:650}
.prose em{font-style:italic;color:var(--text-2)}
/* Callouts */
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:.6rem .8rem;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:.85rem 0;font-size:.87rem}
.note.tip{border-left-color:var(--ok);background:var(--ok-soft)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.note.trap{border-left-color:var(--danger);background:var(--danger-soft)}
.note-t{font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;
  display:block;margin-bottom:.25rem;opacity:.85}
.note p:last-child,.note ul:last-child,.note ol:last-child{margin-bottom:0}
/* Formula display */
.fx{font-family:var(--serif);font-size:1.06rem;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:.6rem .85rem;
  margin:.7rem 0;overflow-x:auto;white-space:nowrap;text-align:center;font-style:italic}
.fx.left{text-align:left;white-space:normal}
/* Tables */
.tw{overflow-x:auto;margin:.85rem 0;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.845rem;min-width:min(100%,420px)}
th,td{padding:.48rem .65rem;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--surface-2);font-weight:650;font-size:.76rem;text-transform:uppercase;
  letter-spacing:.03em;color:var(--text-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td code{white-space:nowrap}
/* Details / progressive disclosure */
details{border:1px solid var(--border);border-radius:var(--radius-sm);margin:.6rem 0;
  background:var(--surface);overflow:hidden}
details>summary{cursor:pointer;padding:.55rem .75rem;font-weight:580;font-size:.865rem;
  list-style:none;display:flex;align-items:center;gap:.45rem;background:var(--surface-2)}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸";font-size:.75rem;color:var(--muted);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details>summary:hover{background:var(--surface-3)}
.det-body{padding:.75rem .85rem;border-top:1px solid var(--border)}
.det-body>*:last-child{margin-bottom:0}
/* Steps list for worked examples */
.wsteps{counter-reset:ws;list-style:none;padding:0;margin:.7rem 0}
.wsteps li{counter-increment:ws;position:relative;padding:.5rem 0 .5rem 2.1rem;
  border-bottom:1px dashed var(--border)}
.wsteps li:last-child{border-bottom:0}
.wsteps li::before{content:counter(ws);position:absolute;left:0;top:.5rem;width:1.5rem;height:1.5rem;
  border-radius:50%;background:var(--accent-soft);color:var(--accent-text);
  font:700 .72rem/1.5rem var(--mono);text-align:center}
.ans{background:var(--ok-soft);border:1px solid var(--ok-border);color:var(--ok);
  border-radius:var(--radius-sm);padding:.55rem .8rem;font-weight:640;margin:.7rem 0;font-size:.9rem}
/* Diagram container */
.dia{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:.9rem;margin:.9rem 0;overflow-x:auto}
.dia svg{display:block;margin:0 auto;max-width:100%;height:auto}
.dia-cap{font-size:.76rem;color:var(--muted);text-align:center;margin-top:.55rem;
  padding-top:.5rem;border-top:1px solid var(--border)}
.d-node{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
.d-node-a{fill:var(--accent-soft);stroke:var(--accent-border);stroke-width:1.5}
.d-node-g{fill:var(--ok-soft);stroke:var(--ok-border);stroke-width:1.5}
.d-node-w{fill:var(--warn-soft);stroke:var(--warn-border);stroke-width:1.5}
.d-txt{fill:var(--text);font:600 12px var(--sans);text-anchor:middle;dominant-baseline:middle}
.d-txt-s{fill:var(--text-2);font:500 10.5px var(--sans);text-anchor:middle;dominant-baseline:middle}
.d-lbl{fill:var(--muted);font:600 10px var(--mono);text-anchor:middle;dominant-baseline:middle}
.d-h{fill:var(--accent-text);font:700 10.5px var(--mono);text-anchor:middle;dominant-baseline:middle}
.d-line{stroke:var(--border-strong);stroke-width:1.6;fill:none}
.d-line-a{stroke:var(--accent);stroke-width:2.2;fill:none}
.d-line-d{stroke:var(--danger);stroke-width:1.8;fill:none;stroke-dasharray:4 3}
/* ============================= LEARNING OUTCOMES ============================= */
.lo-strip{border:1px solid var(--accent-border);background:var(--accent-soft);
  border-radius:var(--radius);padding:.7rem .85rem;margin-bottom:1rem}
.lo-strip-h{font:700 .66rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent-text);margin-bottom:.5rem}
.lo-item{display:flex;gap:.5rem;align-items:baseline;font-size:.84rem;
  line-height:1.5;margin-bottom:.35rem}
.lo-item .badge{flex:0 0 auto}
.lo-strip-f{font-size:.76rem;color:var(--muted);margin-top:.5rem;
  padding-top:.5rem;border-top:1px solid var(--accent-border)}
.lo-row{padding:.75rem 0;border-bottom:1px solid var(--border)}
.lo-row:last-child{border-bottom:0}
.lo-row-h{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin-bottom:.4rem}
.lo-text{font-size:.87rem;margin:0 0 .5rem;color:var(--text);overflow-wrap:anywhere}
.lo-item span{min-width:0;overflow-wrap:anywhere}
.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lo-links{display:flex;flex-wrap:wrap;gap:.35rem}
.lo-q{border-left:3px solid var(--accent);padding:.45rem 0 .45rem .7rem;margin:.4rem 0;
  font-size:.85rem;line-height:1.5}
.lo-q .m{font:600 .7rem var(--mono);color:var(--muted);display:block;margin-top:.2rem}
.co-card{border-left:4px solid var(--accent)}
/* ============================= QUIZ ============================= */
.q{margin-bottom:1rem}
.q-stem{font-weight:570;margin-bottom:.6rem;font-size:.92rem;line-height:1.55}
.opt{display:block;width:100%;text-align:left;padding:.55rem .7rem;margin-bottom:.4rem;
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);
  cursor:pointer;font:inherit;font-size:.87rem;color:var(--text);line-height:1.5}
.opt:hover:not(:disabled){background:var(--surface-2);border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.opt .mk{font-weight:700;margin-right:.45rem;font-family:var(--mono);font-size:.8rem}
.qbar{display:flex;align-items:center;gap:.7rem;margin-bottom:1.1rem;font-size:.8rem;color:var(--muted)}
.qbar .bar{flex:1}
.big-score{font:700 2.6rem/1 var(--sans);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* ============================= FLASHCARDS ============================= */
.fc{perspective:1200px;margin:1rem 0}
.fc-inner{position:relative;width:100%;min-height:240px;transition:transform .5s cubic-bezier(.4,0,.2,1);
  transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  padding:1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;box-shadow:var(--shadow-lg);overflow-y:auto}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent-border)}
.fc-q{font-size:1.08rem;font-weight:620;line-height:1.5;max-width:44ch}
.fc-a{font-size:.92rem;line-height:1.65;text-align:left;max-width:52ch;width:100%}
.fc-a ul{padding-left:1.15em}
.fc-hint{font-size:.72rem;color:var(--muted);margin-top:1rem;text-transform:uppercase;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){
  .fc-inner{transition:none}
  .bar>i,.ring .val{transition:none}
}
/* ============================= FILTERS ============================= */
.filters{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem;
  padding:.7rem .85rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.filters .fg{display:flex;align-items:center;gap:.35rem}
.filters select{font-size:.8rem;padding:.28rem .4rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.26rem .55rem;border-radius:99px;
  border:1px solid var(--border-strong);background:var(--surface);font-size:.79rem;font-weight:550;
  cursor:pointer;color:var(--text-2);font-family:inherit}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);
  border-color:var(--accent-border);font-weight:640}
.count{font-size:.78rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
/* ============================= MISC ============================= */
.empty{text-align:center;padding:2.2rem 1rem;color:var(--muted);font-size:.88rem;
  border:1px dashed var(--border-strong);border-radius:var(--radius);background:var(--surface)}
.empty .big{font-size:1.6rem;display:block;margin-bottom:.5rem;opacity:.55}
.gap-banner{border:1px solid var(--warn-border);background:var(--warn-soft);color:var(--warn);
  border-radius:var(--radius);padding:.8rem .95rem;margin-bottom:1.1rem;font-size:.86rem}
.gap-banner strong{font-weight:700}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(150%);
  background:var(--text);color:var(--bg);padding:.6rem 1.1rem;border-radius:99px;font-size:.85rem;
  font-weight:560;box-shadow:var(--shadow-lg);z-index:300;transition:transform .28s cubic-bezier(.4,0,.2,1);
  max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(10,11,14,.5);z-index:200;display:flex;
  align-items:center;justify-content:center;padding:1.2rem}
.modal-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  padding:1.3rem;max-width:440px;width:100%;box-shadow:var(--shadow-lg)}
.modal-box h3{margin-bottom:.55rem}
.modal-box p{font-size:.88rem;color:var(--text-2)}
.welcome{background:linear-gradient(180deg,var(--accent-soft),var(--surface));
  border:1px solid var(--accent-border)}
.rec{background:var(--surface);border:1px solid var(--accent-border);border-left:4px solid var(--accent);
  border-radius:var(--radius);padding:.95rem 1.1rem;box-shadow:var(--shadow)}
.rec .why{font-size:.79rem;color:var(--muted);margin:.3rem 0 .7rem}
.weak-row{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--border)}
.weak-row:last-child{border-bottom:0}
.acc{font-family:var(--mono);font-weight:700;font-size:.85rem;flex:0 0 auto;min-width:3.2em;text-align:right}
.list-plain{list-style:none;padding:0;margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.35rem .8rem;font-size:.85rem;margin:.6rem 0}
.kv dt{font-weight:640;color:var(--text-2);font-family:var(--mono);font-size:.82rem;white-space:nowrap}
.kv dd{margin:0}
/* ============================= RESPONSIVE ============================= */
@media (max-width:860px){
  .shell{display:block}
  .side{position:fixed;left:0;top:0;height:100dvh;transform:translateX(-100%);
    transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-lg);width:270px}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block}
  .mtop{display:flex}
  .topbar{padding:.55rem .9rem}
  .wrap{padding:1.1rem .9rem 4rem}
  .g4,.g3{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .stat .v{font-size:1.3rem}
  h1{font-size:1.35rem}
}
@media (max-width:520px){
  .filters{flex-direction:column;align-items:stretch}
  .filters .fg{justify-content:space-between}
  .count{margin-left:0}
  .searchbox{max-width:none}
  .trow{flex-wrap:wrap}
  .status{margin-left:auto}
}
@media print{
  .side,.topbar,.mtop,.steps,.status,.btn,.filters{display:none !important}
  body{background:#fff}
  .card,.dia,.tw{break-inside:avoid;box-shadow:none}
}

{id:"m1t1", title:"What is Intelligence? What is Artificial Intelligence?", type:"theory",
 priority:"high", marks:[2,5], src:"Chpt 1 slides 22–31; class notes 14/7",
 tags:["definition","mccarthy","intelligence","cognitive"],
 learn:`<p>There is <strong>no single agreed definition of AI</strong>. The term was coined by <strong>John McCarthy in 1956</strong> (Dartmouth workshop).</p>
<h4>Intelligence</h4>
<p>Intelligence is the <em>computational part of the ability to achieve goals in the world</em>. It is the ability to learn, perceive, plan, problem-solve and make decisions. Varying kinds and degrees of intelligence occur in people, many animals and some machines.</p>
<h4>Artificial Intelligence</h4>
<p>AI describes the ability of computer systems to perform tasks that typically require human intelligence: learning, problem-solving, decision-making, planning, perceiving, understanding and translating language, analysing data and making recommendations.</p>
<p>Engineering view — AI builds systems capable of <strong>Perceiving → Reasoning → Learning → Planning → Acting</strong>.</p>`,
 understand:`<p>Think of AI as a pipeline the machine repeats:</p>
<div class="fx">Perception → Reasoning → Decision → Action</div>
<p>A calculator does arithmetic but never <em>decides</em> anything — no perception, no choice. ChatGPT perceives your text, reasons over it and produces an action (the reply). That is the practical line between "automation" and "AI".</p>
<p><strong>What is easy vs hard is the opposite of what you expect.</strong> Machines found "high-level" tasks easy — symbolic integration, proving theorems, chess, some medical diagnosis. They found things animals do effortlessly very hard — walking without bumping into things, catching prey, interpreting complex sensory input, modelling other minds, working as a team.</p>`,
 examples:[{t:"AI around us (from the lecture)",b:"Phone unlock · Google Maps · Instagram feed · UPI fraud detection · Amazon recommendations · Netflix · Gmail spam filter · ChatGPT"},
 {t:"Where AI fails (lecture list)",b:"Wrong maths · Hallucinations · Wrong image generation / no real creativity · Fake references · Security vulnerabilities · Auto-detecting words in native language"}],
 examAnswer:`<p><strong>2 marks — Define AI.</strong> Artificial Intelligence is the ability of computer systems to perform tasks that normally require human intelligence, such as learning, reasoning, problem-solving, perception, planning and decision-making. The term was coined by John McCarthy in 1956.</p>
<p><strong>5 marks — add:</strong> the perception→reasoning→decision→action cycle, one line on why there is no consensus definition, plus 2–3 real examples (Google Maps, UPI fraud detection, ChatGPT) and one limitation (hallucination).</p>`,
 mistakes:["Writing that AI 'copies the human brain'. The syllabus treats AI as four distinct approaches (think/act × humanly/rationally), only one of which is brain-modelling.",
 "Claiming a fixed universal definition exists — the slides explicitly say there is no clear consensus.",
 "Confusing automation with AI. A washing machine follows a fixed program; it does not perceive and decide."]},

{id:"m1t2", title:"History of AI and the AI Winters", type:"theory",
 priority:"medium", marks:[5], src:"Chpt 1 slides 25–40; class notes",
 tags:["history","ai winter","turing","timeline","expert system"],
 learn:`<h4>Key milestones</h4>
<ul>
<li><strong>400 BCE</strong> — mechanical pigeon by a friend of Plato; <strong>1495</strong> Leonardo da Vinci's mechanical knight (automatons).</li>
<li><strong>1921</strong> — Karel Čapek's play <em>Rossum's Universal Robots</em>: first use of the word "robot".</li>
<li><strong>1950</strong> — Alan Turing, <em>Computing Machinery and Intelligence</em> → the Imitation Game (Turing Test).</li>
<li><strong>1952</strong> — Arthur Samuel's checkers program: first to learn a game independently.</li>
<li><strong>1955/56</strong> — John McCarthy's Dartmouth workshop coins "artificial intelligence".</li>
<li><strong>1958</strong> — McCarthy creates <strong>LISP</strong>, the first AI programming language.</li>
<li><strong>1959</strong> — Samuel coins "machine learning". <strong>1961</strong> — Unimate, first industrial robot.</li>
<li><strong>1965</strong> — Feigenbaum &amp; Lederberg build the first <strong>expert system</strong>.</li>
<li><strong>1966</strong> — Weizenbaum's <strong>ELIZA</strong>, the first chatbot.</li>
<li><strong>1980</strong> — <strong>XCON</strong>, first commercial expert system. <strong>1981</strong> — Japan's Fifth Generation project ($850M).</li>
<li><strong>1997</strong> — IBM <strong>Deep Blue</strong> beats Garry Kasparov.</li>
<li><strong>2011</strong> — IBM Watson wins Jeopardy; Apple releases Siri.</li>
<li><strong>2012</strong> — Google (Dean &amp; Ng) train a neural network to recognise cats from unlabelled images → the deep-learning era.</li>
<li><strong>2022</strong> — ChatGPT. <strong>2023</strong> — GPT-4; the <strong>EU AI Act</strong>, the world's first legal framework for AI.</li>
</ul>
<h4>The two AI Winters</h4>
<p><strong>First AI Winter (1974–1980).</strong> Early systems solved only toy problems; computers were slow and expensive; memory and storage were limited; governments cut funding (the 1973 Lighthill report in the UK).</p>
<p><strong>Second AI Winter (1987–1993).</strong> Expert systems became costly to build and maintain; AI systems could not learn; specialised AI hardware became obsolete; investors lost confidence.</p>`,
 understand:`<p>The one-line reason for both winters, in the words of the slides: <strong>not enough computing, not enough data, not good enough algorithms</strong> — combined with unrealistic promises.</p>
<p>Which is exactly why AI exploded <em>after 2012</em>: powerful GPUs and cloud computing, big data, deep learning and Transformers, fast internet and IoT, and finally large language models.</p>`,
 examples:[{t:"Why AI failed twice — 5 causes table",b:"Limited computing power · Lack of data · Immature algorithms · High development cost · Unrealistic expectations"}],
 examAnswer:`<p><strong>5 marks — Explain the AI Winter.</strong> An AI Winter is a period in which interest, funding and research output in AI sharply decline. Two occurred: 1974–1980 and 1987–1993. Causes: limited computing power, lack of data, immature algorithms, high development cost of expert systems, and expectations that researchers could not deliver. Effects: government and private funding stopped (Lighthill report 1973; the end of the Fifth Generation project), and progress slowed until GPUs, big data and deep learning revived the field after 2012.</p>`,
 mistakes:["Mixing up the two winters' date ranges. First = 1974–1980, second = 1987–1993.",
 "Saying McCarthy invented the Turing Test — Turing (1950) proposed the test; McCarthy (1956) coined the term 'AI'.",
 "Listing milestones with no cause. The examiner wants the reason funding collapsed, not just dates."]},

 priority:"medium", marks:[5], src:"Chpt 1 slides 53–56",
 tags:["knowledge base","inferencing","navigational capability","components"],
 learn:`<p>The syllabus lists <strong>Foundations of AI</strong> (the disciplines AI draws on — philosophy, mathematics, economics, neuroscience, psychology, computer engineering, control theory, linguistics) and <strong>Components of AI</strong>.</p>
<h4>The three components of an AI program</h4>
<ol>
<li><strong>Knowledge Base</strong> — consists of <em>facts and rules</em>. AI programs should be learning in nature and update their knowledge accordingly.</li>
<li><strong>Navigational Capability</strong> — contains various <em>control strategies</em>. Control strategies determine which rule(s) to apply at each step while solving a problem.</li>
<li><strong>Inferencing</strong> — requires search through the knowledge base and derives new knowledge.</li>
</ol>
<h4>Characteristics of knowledge (exam point)</h4>
<ul><li>It is <strong>voluminous</strong> in nature and requires proper structuring.</li>
<li>It may be <strong>incomplete and imprecise</strong>.</li>
<li>It may keep on <strong>changing</strong> (dynamic).</li></ul>`,
 understand:`<p>Map it to a question-answering system: the <em>knowledge base</em> is what it knows, <em>navigational capability</em> is how it chooses which rule to try next, and <em>inferencing</em> is how it produces an answer that was never explicitly stored. Module 3 is really an expansion of exactly these three components.</p>`,
 examples:[{t:"Application areas listed in the lecture",b:"Game playing · Mathematics · Autonomous control · Diagnosis · Logistics planning · Autonomous planning and scheduling · Language understanding · Robotics · NLG · Speech recognition · Virtual agents · Text analytics &amp; NLP · Robotic process automation · Biometrics · Deep-learning platforms · Decision management · AI-optimised hardware · ML platforms"},
 {t:"AI programming languages",b:"Python · R · Java · C++ · PROLOG · LISP"}],
 examAnswer:`<p><strong>5 marks — Components of an AI program.</strong> (1) <em>Knowledge Base</em> — facts and rules; knowledge is voluminous, may be incomplete/imprecise and is dynamic, so it must be properly structured. (2) <em>Navigational capability</em> — control strategies that decide which rule to apply at each step. (3) <em>Inferencing</em> — searching the knowledge base to derive new knowledge. Add one example (a medical expert system) to complete the answer.</p>`,
 mistakes:["Listing programming languages when asked for 'components of AI' — the question means KB / navigational capability / inferencing.",
 "Forgetting the three characteristics of knowledge; they are usually worth a mark each."]},

{id:"m1t4", title:"Categorization of Intelligent Systems — the four approaches", type:"theory",
 priority:"high", marks:[5,10], src:"Chpt 1 slides 46–52; class notes 14/7",
 tags:["turing test","cognitive modelling","laws of thought","rational agent","categorization"],
 diagram:"peas",
 learn:`<p>Intelligent systems are categorised along two axes — <em>thinking vs acting</em> and <em>humanly vs rationally</em> — giving four approaches:</p>
<div class="tw"><table><thead><tr><th></th><th>Humanly</th><th>Rationally</th></tr></thead><tbody>
<tr><th>Thinking</th><td>Systems that <strong>think like humans</strong> — cognitive modelling</td><td>Systems that <strong>think rationally</strong> — "laws of thought"</td></tr>
<tr><th>Acting</th><td>Systems that <strong>act like humans</strong> — the Turing Test approach</td><td>Systems that <strong>act rationally</strong> — the rational agent</td></tr>
</tbody></table></div>
<h4>1. Acting humanly — the Turing Test approach</h4>
<p>A human interrogator cannot tell whether the responses come from a human or an AI, via teletype (remote communication). To pass, the computer needs: <strong>natural language processing, knowledge representation, automated reasoning, machine learning</strong>, and for the total test <strong>computer vision</strong> (to perceive objects) and <strong>robotics</strong> (to move objects).</p>
<h4>2. Thinking humanly — cognitive modelling</h4>
<p>Humans as observed from the <em>inside</em>. How do we know how humans think? Introspection vs psychological experiments. This is the field of <strong>Cognitive Science</strong>.</p>
<h4>3. Thinking rationally — the "laws of thought"</h4>
<p>Rationality defined through logic. Two problems the lecture stresses: <em>humans are not always rational</em>, <em>logic cannot express everything</em> (e.g. uncertainty), and the logical approach is often computationally infeasible — it needs guidance.</p>
<h4>4. Acting rationally — the rational agent</h4>
<p>Rational behaviour = <em>doing the right thing</em>: that which is expected to <strong>maximise goal achievement, given the available information</strong>. Giving answers to questions is itself 'acting'. Logic is only <em>part</em> of a rational agent, not all of rationality.</p>`,
 understand:`<p>Remember it as a 2×2 grid and the fact that <strong>this course is built on the fourth box</strong>. Everything from Module 2 onward (search, heuristics, planning, belief networks) is machinery for an agent that <em>acts rationally</em>, not one that imitates human thought.</p>
<p>Memory hook: <strong>T-C-L-R</strong> — Turing, Cognitive, Laws of thought, Rational agent.</p>`,
 examples:[{t:"Categorization of intelligent systems (lecture list)",b:"Reactive → Limited Memory → Learning → Autonomous → Generative → Agentic"}],
 examAnswer:`<p><strong>5 marks — Four approaches to AI.</strong> Draw the 2×2 table (thinking/acting × humanly/rationally). (1) <em>Acting humanly</em>: Turing Test — needs NLP, knowledge representation, automated reasoning, machine learning, plus vision and robotics for the total test. (2) <em>Thinking humanly</em>: cognitive modelling via introspection and psychological experiments. (3) <em>Thinking rationally</em>: laws of thought / logic — limited because humans are not always rational and logic cannot express uncertainty. (4) <em>Acting rationally</em>: the rational agent, which maximises expected goal achievement given available information. State that modern AI adopts approach 4.</p>`,
 mistakes:["Describing only the Turing Test and stopping. The question asks for all four categories.",
 "Saying the Turing Test requires the computer to be conscious. It only requires indistinguishable behaviour.",
 "Confusing 'thinking rationally' (logic) with 'acting rationally' (agent that maximises performance)."]},

{id:"m1t5", title:"Intelligent Agent, Agent Terminology and Structure", type:"theory",
 priority:"high", marks:[5,10], src:"Chpt 1 slides 64–66, 71, 75–76; class notes 17/7",
 tags:["agent","percept","agent function","architecture","sensors","actuators"],
 diagram:"simpleReflex",
 learn:`<div class="note"><span class="note-t">Definition — learn verbatim</span>An <strong>agent</strong> is anything that can be viewed as <em>perceiving its environment through sensors</em> and <em>acting upon that environment through actuators</em>.</div>
<div class="tw"><table><thead><tr><th>Agent</th><th>Sensors</th><th>Effectors / Actuators</th></tr></thead><tbody>
<tr><td><strong>Human agent</strong></td><td>Ear, nose, eyes, tongue, skin</td><td>Hands, legs, mouth</td></tr>
<tr><td><strong>Robotic agent</strong></td><td>Cameras, infrared range finders</td><td>Various motors and actuators</td></tr>
<tr><td><strong>Software agent</strong></td><td colspan="2">Encodes bit strings as its programs and actions</td></tr>
</tbody></table></div>
<h4>Agent terminology</h4>
<ul>
<li><strong>Performance measure</strong> — the criteria determining the success of an agent.</li>
<li><strong>Behaviour / action</strong> — the action performed by an agent after any specified sequence of percepts.</li>
<li><strong>Percept</strong> — the agent's perceptual inputs at a specified instant.</li>
<li><strong>Percept sequence</strong> — the history of everything the agent has perceived to date.</li>
<li><strong>Agent function</strong> — a map from the percept sequence to an action.</li>
</ul>
<div class="fx">a = F(p)&nbsp;&nbsp;&nbsp;→&nbsp;&nbsp;&nbsp;F : P → A</div>
<p>Generally an action may depend on <em>all</em> percepts observed, not only the current one:</p>
<div class="fx">a<sub>k</sub> = F(p<sub>0</sub> p<sub>1</sub> p<sub>2</sub> … p<sub>k</sub>)&nbsp;&nbsp;&nbsp;→&nbsp;&nbsp;&nbsp;F : P* → A</div>
<h4>Structure of an agent</h4>
<div class="fx">Agent = Architecture + Agent Program</div>
<ul><li><strong>Architecture</strong> — the machinery that the agent executes on.</li>
<li><strong>Agent program</strong> — an implementation of the agent function.</li></ul>
<p>The <strong>agent function is an abstract mathematical description</strong>; the <strong>agent program is the concrete implementation</strong> running on the architecture. On each invocation the agent's memory is updated to mirror the new percept, the best action is selected, and the fact that the action was taken is stored. The memory persists from one invocation to the next.</p>`,
 understand:`<p>The single most-tested distinction here: <strong>function vs program</strong>. The <em>function</em> is the infinite lookup table "for this percept history, do this". The <em>program</em> is the finite code that actually computes it. You could never store the table; you write the program instead.</p>
<p>Note the star in <strong>P*</strong> — it means "sequences of percepts", which is precisely what lets an agent have memory.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Define an intelligent agent and explain its structure.</strong> An agent is anything that perceives its environment through sensors and acts upon that environment through actuators. Terminology: percept (input at an instant), percept sequence (full history), agent function F : P* → A mapping percept sequences to actions, and performance measure (criterion of success). Structurally, <em>Agent = Architecture + Agent Program</em>, where the architecture is the machinery and the program is the concrete implementation of the agent function. Give one example row (human / robotic / software agent) and a labelled diagram.</p>`,
 mistakes:["Writing 'Agent = sensors + actuators'. The examinable formula is Agent = Architecture + Agent Program.",
 "Using 'percept' and 'percept sequence' interchangeably.",
 "Forgetting the star: F : P* → A, not F : P → A, when memory is involved."]},

{id:"m1t6", title:"PEAS Descriptors", type:"theory",
 priority:"high", marks:[5], src:"Chpt 1 slides 72–74; CIA-01 Section D",
 tags:["peas","performance","environment","actuators","sensors","taxi","vacuum"],
 diagram:"peas",
 learn:`<p><strong>PEAS</strong> is the standard way to specify a task environment before designing an agent.</p>
<ul>
<li><strong>P — Performance Measure</strong>: the unit used to define the success of an agent.</li>
<li><strong>E — Environment</strong>: the surrounding of an agent at every instant.</li>
<li><strong>A — Actuators</strong>: the part of the agent that delivers the output of an action to the environment.</li>
<li><strong>S — Sensors</strong>: the receptive parts of an agent which take in the input.</li>
</ul>
<div class="tw"><table><thead><tr><th>PEAS</th><th>Automated Taxi Driver</th><th>Vacuum Cleaner</th></tr></thead><tbody>
<tr><td><strong>Performance</strong></td><td>Safety, time, legal drive, comfort</td><td>Cleanness, efficiency (distance travelled to clean), battery life, security</td></tr>
<tr><td><strong>Environment</strong></td><td>Roads, other cars, pedestrians, road signs</td><td>Room, table, wood floor, carpet, different obstacles</td></tr>
<tr><td><strong>Actuators</strong></td><td>Steering, accelerator, brake, signal, horn</td><td>Wheels, different brushes, vacuum extractor</td></tr>
<tr><td><strong>Sensors</strong></td><td>Camera, sonar, GPS, speedometer, odometer, accelerometer, engine sensors, keyboard</td><td>Camera, dirt detection sensor, cliff sensor, bump sensors, infrared wall sensors</td></tr>
</tbody></table></div>`,
 understand:`<p>Order matters when you write PEAS: the <em>performance measure</em> comes first because it defines what "good" means, and every later design choice is judged against it. If you cannot state the performance measure, you cannot say whether the agent is rational.</p>
<p>Sensors are <strong>in</strong>, actuators are <strong>out</strong>. Students routinely swap them for software agents — for a spam filter, the sensor is the incoming email, the actuator is the move-to-spam action.</p>`,
 examples:[{t:"CIA-01 asked you to fill in PEAS for your assigned AI system",b:"Practise with: Google Maps, Netflix, Tesla FSD, a hospital assistant, a delivery drone, smart farming."}],
 examAnswer:`<p><strong>5 marks — PEAS for an automated taxi driver.</strong> Define PEAS (Performance measure, Environment, Actuators, Sensors) in one line each, then give the four-row table: Performance — safety, time, legal drive, comfort; Environment — roads, other cars, pedestrians, road signs; Actuators — steering, accelerator, brake, signal, horn; Sensors — cameras, sonar, GPS, speedometer, odometer, accelerometer, engine sensors, keyboard. <em>The table alone earns most of the marks — draw it.</em></p>`,
 mistakes:["Swapping actuators and sensors.",
 "Giving a vague performance measure like 'work well'. It must be measurable — safety, time, cleanliness.",
 "Listing the environment as just 'road'. Include the other agents and objects in it."]},

{id:"m1t7", title:"Rationality and the Rational Agent", type:"theory",
 priority:"high", marks:[2,5], src:"Chpt 1 slide 77; class notes",
 tags:["rationality","rational agent","performance measure","definition"],
 learn:`<div class="note"><span class="note-t">Definition — learn verbatim</span><strong>For each possible percept sequence, a rational agent should select an action that is expected to maximise its performance measure, given the evidence provided by the percept sequence and whatever built-in knowledge the agent has.</strong></div>
<h4>What is rational at any given time depends on four things</h4>
<ol>
<li>The <strong>performance measure</strong> that defines the criterion of success.</li>
<li>The agent's <strong>prior knowledge</strong> of the environment.</li>
<li>The <strong>actions</strong> that the agent can perform.</li>
<li>The agent's <strong>percept sequence</strong> to date.</li>
</ol>`,
 understand:`<p>Rational ≠ omniscient, and rational ≠ perfect. A rational agent maximises <em>expected</em> performance on the evidence it has. If a safe driver is hit by a falling engine block from an overpass, the driver was still rational — the outcome was bad, the decision was not.</p>
<p>This is the distinction examiners look for: <strong>rationality is about the decision process, not the outcome.</strong></p>`,
 examples:[],
 examAnswer:`<p><strong>2 marks — Define a rational agent.</strong> For each possible percept sequence, a rational agent selects the action expected to maximise its performance measure, given the evidence from the percept sequence and its built-in knowledge.</p>
<p><strong>5 marks — add</strong> the four things rationality depends on (performance measure, prior knowledge, possible actions, percept sequence) and one line distinguishing rationality from omniscience: a rational agent maximises <em>expected</em> performance, so a bad outcome from an unforeseeable event does not make it irrational.</p>`,
 mistakes:["Saying a rational agent 'always gives the correct answer'. It maximises expected performance, which is not the same as being right.",
 "Omitting 'expected' from the definition — it is the word carrying the mark."]},

{id:"m1t8", title:"Agent Environments and their Properties", type:"theory",
 priority:"high", marks:[5,10], src:"Chpt 1 slides 78–83; CIA-01 Section E",
 tags:["environment","observable","deterministic","episodic","static","discrete","multiagent"],
 learn:`<p>Six properties, always as opposing pairs:</p>
<h4>1. Fully observable vs Partially observable</h4>
<p>Fully observable if the agent's sensors detect <em>all aspects of the environment relevant to the choice of action</em>. It can be partially observable due to noisy, inaccurate or missing sensors, or an inability to measure everything needed. If other agents are involved, their <em>intentions</em> are not observable but their <em>actions</em> are.<br>
<em>Chess</em> — board and opponent's moves are fully observable. <em>Driving</em> — what is around the next bend is not.</p>
<h4>2. Deterministic vs Stochastic</h4>
<p>Deterministic = the next state is completely predictable from the current state and the agent's action. Stochastic = the next state has uncertainty, from randomness, a poor environment model, or incomplete sensor coverage. An environment is <strong>strategic</strong> if it is deterministic except for the actions of other agents.<br>
<em>Deterministic</em>: Tic-Tac-Toe. <em>Non-deterministic</em>: the physical world, a robot on Mars.</p>
<h4>3. Episodic vs Sequential</h4>
<p>Episodic = experience is divided into atomic episodes (perceive, then perform a single action) and the choice in each episode depends only on that episode. Sequential = current decisions affect future decisions or depend on previous ones.<br>
<em>Episodic</em>: mail sorting system, part-picking robot. <em>Non-episodic</em>: a chess game. Most environments are sequential.</p>
<h4>4. Static vs Dynamic</h4>
<p>Dynamic if the environment may change over time; static if nothing other than the agent changes. <strong>Other agents make an environment dynamic.</strong><br>
<em>Dynamic</em>: playing football. <em>Static</em>: mowing a lawn (unless there is a cat).</p>
<h4>5. Discrete vs Continuous</h4>
<p>Discrete = time moves in fixed steps, usually one measurement per step, e.g. a game of chess. Continuous = signals constantly arriving, actions continually changing, e.g. driving a car.</p>
<h4>6. Single agent vs Multi-agent</h4>
<p>Single agent = operating by itself. Multi-agent = other agents present; strictly, another agent is anything that changes from step to step. Multi-agent environments may be <strong>competitive or co-operative</strong>. Human users count as another agent.</p>`,
 understand:`<p>The properties are not independent — <em>other agents make an environment both dynamic and multi-agent, and usually stochastic and partially observable too</em>. That is why "taxi driving" is No on every column.</p>
<div class="tw"><table><thead><tr><th>Task environment</th><th>Fully obs.?</th><th>Determ.?</th><th>Episodic?</th><th>Static?</th><th>Discrete?</th><th>Single agent?</th></tr></thead><tbody>
<tr><td>Solitaire</td><td>No</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Backgammon</td><td>Yes</td><td>No</td><td>No</td><td>Yes</td><td>Yes</td><td>No</td></tr>
<tr><td>Taxi driving</td><td>No</td><td>No</td><td>No</td><td>No</td><td>No</td><td>No</td></tr>
<tr><td>Internet shopping</td><td>No</td><td>No</td><td>No</td><td>No</td><td>Yes</td><td>No</td></tr>
<tr><td>Medical diagnosis</td><td>No</td><td>No</td><td>No</td><td>No</td><td>No</td><td>Yes</td></tr>
<tr><td>Crossword puzzle</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
<tr><td>English tutor</td><td>No</td><td>No</td><td>No</td><td>No</td><td>Yes</td><td>No</td></tr>
<tr><td>Image analysis</td><td>Yes</td><td>Yes</td><td>Yes</td><td>No</td><td>No</td><td>Yes</td></tr>
</tbody></table></div>
<p class="dia-cap" style="border:0;text-align:left">This exact table is from the lecture slides — it is the most likely source of a "classify these environments" question.</p>`,
 examples:[{t:"'Environment Detective' class activity",b:"Classify Chess, Google Maps, a self-driving car, a robot vacuum and a smart traffic system on all six properties."}],
 examAnswer:`<p><strong>10 marks — Explain the types of agent environments with examples.</strong> Give all six pairs with a one-line definition and one example each: fully vs partially observable (chess vs driving); deterministic vs stochastic (tic-tac-toe vs Mars robot); episodic vs sequential (mail sorting vs chess); static vs dynamic (mowing a lawn vs football); discrete vs continuous (chess vs driving a car); single vs multi-agent (crossword vs taxi driving). Finish with the classification table for 3–4 task environments.</p>
<p><strong>5 marks:</strong> the six pairs with one example each, no table.</p>`,
 mistakes:["Calling an environment 'partially observable' just because it is large. It is about whether sensors capture what is <em>relevant to the action choice</em>.",
 "Marking taxi driving as discrete. Both time and the steering/speed values are continuous.",
 "Forgetting that other agents automatically make an environment dynamic.",
 "Classifying medical diagnosis as multi-agent — the slide table lists it as single agent."]},

{id:"m1t9", title:"Types of Agents (the five agent architectures)", type:"theory",
 priority:"high", marks:[5,10], src:"Chpt 1 slides 84–95; CIA-01 Section C",
 tags:["simple reflex","model based","goal based","utility based","learning agent","agent types"],
 diagram:"learningAgent",
 learn:`<h4>1. Simple reflex agent</h4>
<p>The simplest kind. Selects an action based on the <strong>current percept, ignoring the rest of the percept history</strong>. The percept-to-action mapping is a set of <strong>condition–action rules</strong>: <code>if {set of percepts} then {set of actions}</code>.<br>
<em>e.g.</em> if it is raining then put up umbrella; if car in front is braking then initiate braking. <strong>Example system: spam email filter.</strong></p>
<p><strong>Limitations:</strong> intelligence level is very limited; works only in a fully observable environment; holds no knowledge of non-perceptual parts of the state; the static rule base is usually too big to generate and store; any change in the environment requires the rules to be updated.</p>
<h4>2. Model-based agent</h4>
<p>Can work in a <strong>partially observable</strong> environment and track the situation. Two important factors:</p>
<ul><li><strong>Model</strong> — knowledge about "how things happen in the world".</li>
<li><strong>Internal state</strong> — a representation of the current state based on percept history.</li></ul>
<p>Updating the state requires knowing <em>how the world evolves</em> and <em>how the agent's action affects the world</em>. <strong>Example: Roomba robot vacuum</strong> — remembers cleaned area, obstacles, battery level.</p>
<h4>3. Goal-based agent</h4>
<p>Knowledge of the current state is not always sufficient to decide what to do — the agent needs to know its <strong>goal</strong>, which describes desirable situations. Goal-based agents extend model-based agents with goal information and choose actions to achieve the goal. They may consider a long sequence of possible actions; such consideration of different scenarios is called <strong>searching and planning</strong>, which makes an agent <em>proactive</em>. <strong>Example: Google Maps</strong> — goal "reach airport".</p>
<h4>4. Utility-based agent</h4>
<p>Similar to goal-based, but adds a <strong>utility measurement</strong> — a measure of success at a given state. Acts not only on goals but on the <em>best way</em> to achieve the goal. Useful when there are multiple alternatives. The <strong>utility function maps each state to a real number</strong> to check how efficiently each action achieves the goal. <strong>Example: Uber</strong> — chooses fastest / cheapest / safest / least traffic among many options.</p>
<h4>5. Learning agent</h4>
<p>Learns from past experience; starts with basic knowledge and adapts automatically. Four conceptual components:</p>
<ul>
<li><strong>Learning element</strong> — responsible for making improvements by learning from the environment.</li>
<li><strong>Critic</strong> — gives the learning element feedback on how well the agent is doing with respect to a fixed performance standard.</li>
<li><strong>Performance element</strong> — responsible for selecting external actions.</li>
<li><strong>Problem generator</strong> — suggests actions that will lead to new and informative experiences.</li>
</ul>
<p><strong>Examples: ChatGPT, Netflix, Spotify, YouTube, Tesla FSD.</strong></p>`,
 understand:`<p>They form a ladder, each adding exactly one capability:</p>
<div class="fx left"><strong>Reflex</strong> (current percept) → <strong>+ memory</strong> = Model-based → <strong>+ goal</strong> = Goal-based → <strong>+ preference between goals</strong> = Utility-based → <strong>+ improvement over time</strong> = Learning</div>
<p>Ask two questions to classify any system: <em>Does it remember?</em> (reflex or not) and <em>Does it compare alternatives?</em> (goal-based or utility-based).</p>
<div class="tw"><table><thead><tr><th>System</th><th>Simple Reflex</th><th>Model-Based</th><th>Goal-Based</th><th>Utility-Based</th><th>Learning</th></tr></thead><tbody>
<tr><td><strong>Thermostat</strong></td><td>Reacts to temperature thresholds</td><td>Predicts temperature changes</td><td>Maintains target range</td><td>Balances comfort and energy cost</td><td>Learns user preferences over time</td></tr>
<tr><td><strong>Vacuum cleaner</strong></td><td>Cleans on dirt detection</td><td>Remembers room layout &amp; dirt locations</td><td>Clean the entire room</td><td>Optimises efficiency and battery use</td><td>Learns which areas get dirtier</td></tr>
<tr><td><strong>Traffic controller</strong></td><td>Changes lights on immediate traffic</td><td>Predicts congestion using models</td><td>Reduce congestion / improve safety</td><td>Balances wait times, prioritises key vehicles</td><td>Learns traffic patterns, adjusts timings</td></tr>
<tr><td><strong>Smart irrigation</strong></td><td>Waters on soil moisture reading</td><td>Considers soil, weather, plant needs</td><td>Adequate water without waste</td><td>Balances conservation with plant health</td><td>Learns seasonal &amp; crop requirements</td></tr>
</tbody></table></div>`,
 examples:[{t:"'Identify the Agent Type' class activity",b:"Google Maps (goal-based) · Uber (utility-based) · ChatGPT (learning) · Tesla FSD (learning) · Chess AI (goal/utility) · Robot vacuum (model-based)"}],
 examAnswer:`<p><strong>10 marks — Explain the types of intelligent agents with diagrams.</strong> Cover all five in order, each with: one-line definition, what it adds over the previous type, a labelled block diagram, and one real example. Simple reflex (condition–action rules; spam filter; limitation: needs a fully observable environment). Model-based (model + internal state; Roomba; works in partially observable environments). Goal-based (adds goal information; searching and planning; Google Maps). Utility-based (utility function maps state → real number; Uber). Learning (learning element, critic, performance element, problem generator; ChatGPT/Netflix). <em>The learning agent's four components are almost always asked — name all four.</em></p>`,
 mistakes:["Naming only three components of a learning agent. There are four: learning element, critic, performance element, problem generator.",
 "Saying a goal-based agent chooses the <em>best</em> action. It chooses an action that <em>achieves the goal</em>; choosing the best among several is what makes an agent utility-based.",
 "Claiming a simple reflex agent works in a partially observable environment. It explicitly does not."]},

{id:"m1t10", title:"The Vacuum-Cleaner World", type:"theory",
 priority:"high", marks:[5], src:"Chpt 1 slides 67–70",
 tags:["vacuum","percept sequence","agent function","example"],
 learn:`<p>A two-location world, squares <strong>A</strong> and <strong>B</strong>. The vacuum agent perceives which square it is in and whether there is dirt there. It can move left, move right, suck up dirt, or do nothing.</p>
<ul><li><strong>Percepts:</strong> location and status, e.g. <code>[A, Dirty]</code></li>
<li><strong>Actions:</strong> Left, Right, Suck, NoOp (do nothing)</li>
<li><strong>Performance measure:</strong> all rooms are well cleaned</li>
<li><strong>Agent function:</strong> mapping of percept sequence to an action</li></ul>
<p>The simplest agent function: <em>if the current square is dirty, then suck; otherwise, move to the other square.</em></p>
<h4>Partial tabulation of the agent function</h4>
<div class="tw"><table><thead><tr><th>Percept sequence</th><th>Action</th></tr></thead><tbody>
<tr><td>[A, Clean]</td><td>Right</td></tr><tr><td>[A, Dirty]</td><td>Suck</td></tr>
<tr><td>[B, Clean]</td><td>Left</td></tr><tr><td>[B, Dirty]</td><td>Suck</td></tr>
<tr><td>[A, Dirty], [A, Clean]</td><td>Right</td></tr><tr><td>[A, Clean], [B, Dirty]</td><td>Suck</td></tr>
<tr><td>[B, Dirty], [B, Clean]</td><td>Left</td></tr><tr><td>[B, Clean], [A, Dirty]</td><td>Suck</td></tr>
<tr><td>[A, Clean], [B, Clean]</td><td>NoOp</td></tr><tr><td>[B, Clean], [A, Clean]</td><td>NoOp</td></tr>
</tbody></table></div>`,
 understand:`<p>This table <em>is</em> the agent function made concrete. Notice the last two rows: only once the agent has seen that <em>both</em> squares are clean can it justify doing nothing. A pure reflex agent seeing only <code>[A, Clean]</code> cannot output NoOp — it has no way to know about B. That single observation is the whole argument for why memory (a model-based agent) is needed.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Vacuum cleaner world.</strong> Describe the environment (two squares A and B, each clean or dirty). State percepts = [location, status]; actions = Left, Right, Suck, NoOp; performance measure = all rooms cleaned. Give the agent function rule ("if dirty then suck, else move to the other square") and tabulate at least 4–6 percept-sequence → action rows. Add the PEAS table if the question asks for the specification.</p>`,
 mistakes:["Writing the percept as just the location. It is the pair [location, status].",
 "Forgetting NoOp as a legal action.",
 "Producing a table indexed by single percepts when the question asks for percept <em>sequences</em>."]},

{id:"m1t11", title:"Agentic AI vs Traditional AI", type:"theory",
 priority:"high", marks:[5], src:"Chpt 1 slides 96–102; CIA-01 Section F",
 tags:["agentic ai","traditional ai","autonomy","comparison","tools","memory"],
 learn:`<p><strong>Agentic AI</strong> understands goals, plans tasks, uses tools, remembers context and takes actions autonomously. In the lecture's phrase: <em>"Agentic AI doesn't just answer — it acts."</em></p>
<div class="tw"><table><thead><tr><th>Traditional AI</th><th>Agentic AI</th></tr></thead><tbody>
<tr><td>Answers questions</td><td>Completes goals</td></tr>
<tr><td>Reactive</td><td>Proactive</td></tr>
<tr><td>Single response</td><td>Multi-step workflow</td></tr>
<tr><td>Limited memory</td><td>Maintains context</td></tr>
<tr><td>No planning</td><td>Plans tasks</td></tr>
<tr><td>Limited tool usage</td><td>Uses APIs, browsers, databases</td></tr>
<tr><td>Requires continuous user input</td><td>Acts autonomously (within permissions)</td></tr>
</tbody></table></div>
<h4>The lecture's worked contrast</h4>
<p><em>"Plan my Goa trip."</em><br>
<strong>Traditional (ChatGPT):</strong> returns an itinerary.<br>
<strong>Agentic AI:</strong> finds flights → compares hotels → checks weather → books the hotel (with approval) → adds the itinerary to your calendar → sends a confirmation email.</p>
<div class="tw"><table><thead><tr><th>AI system</th><th>Agentic?</th><th>Why</th></tr></thead><tbody>
<tr><td>ChatGPT</td><td>Mostly No</td><td>Answers questions</td></tr>
<tr><td>Claude</td><td>Mostly No</td><td>Generates responses</td></tr>
<tr><td>OpenAI Operator</td><td>Yes</td><td>Performs browser tasks</td></tr>
<tr><td>Claude Computer Use</td><td>Yes</td><td>Operates computer applications</td></tr>
<tr><td>Google Project Mariner</td><td>Yes</td><td>Completes web-based tasks</td></tr>
<tr><td>Manus AI</td><td>Yes</td><td>Autonomous research &amp; execution</td></tr>
<tr><td>CrewAI</td><td>Yes</td><td>Multi-agent collaboration</td></tr>
<tr><td>AutoGen</td><td>Yes</td><td>Agents communicate with each other</td></tr>
</tbody></table></div>`,
 understand:`<p>The four axes named in the learning outcome (LO 1.5) are <strong>autonomy, memory, tool use and goal orientation</strong>. Use those four words as your answer's skeleton and you cannot lose structure marks.</p>
<p>Test for yourself: <em>does it finish the job, or does it hand you instructions?</em> A system that only produces text is traditional; one that calls tools and changes the world is agentic.</p>`,
 examples:[{t:"Healthcare contrast from the lecture",b:"Ask ChatGPT 'Explain diabetes' → done. An AI healthcare <em>agent</em> reads your smartwatch, monitors sugar levels, schedules a doctor's appointment, reminds you to take medicine, orders medicines and alerts family in an emergency."}],
 examAnswer:`<p><strong>5 marks — Compare Traditional AI and Agentic AI.</strong> Draw the comparison table on the four axes required by LO 1.5: <em>autonomy</em> (reactive / requires input vs acts autonomously within permissions), <em>memory</em> (limited vs maintains context), <em>tool usage</em> (limited vs uses APIs, browsers, databases), <em>goal orientation</em> (single response vs multi-step workflow completing a goal). Close with one worked example — "Plan my Goa trip" — showing the single itinerary vs the book-and-confirm workflow.</p>`,
 mistakes:["Saying agentic AI is 'just a smarter LLM'. The distinguishing feature is autonomous multi-step action with tools, not model quality.",
 "Claiming agentic systems act without any permission. The slides say 'within permissions'.",
 "Only listing differences in prose. The table earns the marks faster."]},

{id:"m1t12", title:"Agentic AI — Components and Architectures", type:"theory",
 priority:"medium", marks:[5], src:"Chpt 1 slides 100, 104, 106",
 tags:["agentic","architecture","single agent","multi agent","vertical","horizontal","hybrid"],
 learn:`<h4>Types of agentic architectures</h4>
<ol>
<li><strong>Single-agent architecture</strong> — a single AI system functioning independently, making decisions and taking actions without other agents.</li>
<li><strong>Multi-agent architecture</strong> — multiple AI systems interacting, collaborating and coordinating to achieve common goals. Sub-types:
<ul><li><strong>Vertical</strong> — hierarchical; higher-level agents oversee and guide lower-level agents.</li>
<li><strong>Horizontal</strong> — agents on the same level with no hierarchy, communicating and coordinating as needed.</li>
<li><strong>Hybrid</strong> — a combination, using the strengths of each for complex environments.</li></ul></li>
</ol>
<h4>Components of an agentic AI system</h4>
<div class="tw"><table><thead><tr><th>Component</th><th>Purpose</th><th>Example</th></tr></thead><tbody>
<tr><td><strong>Goal</strong></td><td>Defines the objective to be achieved</td><td>Book the cheapest flight to Delhi</td></tr>
<tr><td><strong>Reasoning</strong></td><td>Analyses information and makes decisions</td><td>Selects the best flight on cost and timing</td></tr>
<tr><td><strong>Planning</strong></td><td>Breaks a complex task into smaller steps</td><td>Search → Compare → Book → Send confirmation</td></tr>
<tr><td><strong>Memory</strong></td><td>Stores previous interactions and preferences</td><td>Remembers preferred airline and window seat</td></tr>
<tr><td><strong>Tool usage</strong></td><td>Uses external tools, APIs, databases, browsers</td><td>Google Flights, Gmail, Calendar, payment gateway</td></tr>
<tr><td><strong>Perception / Observation</strong></td><td>Collects information from the environment</td><td>Reads flight prices, weather, traffic updates</td></tr>
<tr><td><strong>Reflection / Feedback</strong></td><td>Evaluates results and adapts if needed</td><td>Rebooks if the selected flight becomes unavailable</td></tr>
<tr><td><strong>Action execution</strong></td><td>Performs the required task</td><td>Books the ticket and sends the itinerary</td></tr>
</tbody></table></div>
<p><strong>Modern AI agents named in the lecture:</strong> AutoGPT · Claude Computer Use · OpenAI Operator · Cursor AI · GitHub Copilot · LangChain Agents · CrewAI · Microsoft Copilot.</p>`,
 understand:`<p>Notice how closely the agentic components mirror the classic agent from slide 64: <em>perception</em> = sensors, <em>action execution</em> = actuators, <em>reasoning + planning</em> = the agent program, <em>memory</em> = internal state, <em>reflection</em> = the critic of a learning agent. Agentic AI is the classical agent architecture with an LLM as the reasoning engine and real APIs as the actuators.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Explain agentic AI architectures.</strong> Define single-agent (one system acting independently) and multi-agent (several systems collaborating), then the three multi-agent sub-types: vertical (hierarchical, higher-level agents guide lower ones), horizontal (same level, no hierarchy), hybrid (combination for complex environments). Support with the components — goal, reasoning, planning, memory, tool usage, perception, reflection, action execution — and one example such as CrewAI or AutoGen.</p>`,
 mistakes:["Confusing vertical with hybrid. Vertical = hierarchy; hybrid = mixture of architecture types.",
 "Listing only goal and action. Memory, tool usage and reflection are what make the system agentic."]},

{id:"m1t13", title:"Applications, Risks and Challenges of AI in Modern Society", type:"theory",
 priority:"medium", marks:[5,10], src:"Chpt 1 slides 11–21, 41–45, 60; CIA-01 Section G",
 tags:["applications","risks","ethics","bias","society","industry"],
 learn:`<h4>Why study AI — application domains</h4>
<p>Healthcare · Finance · Education · Agriculture · Cybersecurity · Autonomous vehicles · Smart manufacturing · Space exploration.</p>
<h4>AI challenges (lecture list)</h4>
<p>Automation bias · Hallucinations · Explainability · Ethical concerns · Accountability · Human oversight.</p>
<h4>Risks and dangers of AI</h4>
<ul>
<li>Bias and discrimination</li><li>Lack of transparency ("black box" models)</li>
<li>Accountability and ethical dilemmas</li><li>Job displacement and automation</li>
<li>Widening economic inequality</li><li>Privacy violations and data misuse</li>
<li>Misinformation and deepfakes</li><li>Weaponization of AI (autonomous weapons)</li>
<li>Cybersecurity threats and AI-driven attacks</li><li>Over-reliance on AI systems</li>
<li>Loss of human autonomy</li><li>Environmental impact (energy usage)</li>
<li>Unintended consequences of poorly designed AI</li><li>Ethical issues in AI-driven surveillance</li>
<li>Manipulation and social engineering</li><li>Concentration of power among few organizations</li>
<li>Existential risks (superintelligent AI)</li><li>AI malfunction or erroneous decision-making</li>
<li>Regulatory challenges and lack of oversight</li><li>Cultural and psychological impacts</li>
</ul>
<h4>Leaders in AI research</h4>
<p>OpenAI · Google DeepMind · Microsoft · NVIDIA · Meta · Amazon · Anthropic · IBM · Alibaba · Tencent.</p>`,
 understand:`<p>For an "impact of AI" answer, use a <strong>benefit / limitation / ethical concern</strong> triple for each domain — that is exactly the structure CIA-01 Section G asked for, so it is the structure the examiner has in mind.</p>
<p>The lecture's two extended case studies are worth remembering as ready-made examples: <strong>AI at the FIFA World Cup 2026</strong> (semi-automated offside technology tracking 29 body points 50×/second, a connected ball sending data 500×/second, Football AI Pro for tactics, AI-stabilised Referee View, 3D avatar replays) and <strong>AI in modern warfare</strong> (satellite image analysis, autonomous drones, multi-sensor fusion, predictive analytics, generative AI for report summarisation — with a perception → reasoning → decision-support pipeline and human oversight).</p>`,
 examples:[{t:"FIFA 2026 — feature to AI concept mapping",b:"3D player tracking → computer vision · Offside detection → intelligent agent + deep learning · Connected match ball → IoT + sensor fusion · Football AI Pro → generative AI + LLM · Referee View → computer vision + AI video processing · Tactical reports → predictive analytics"},
 {t:"Warfare — application to AI concept mapping",b:"Satellite analysis → computer vision · Drone navigation → intelligent agents · Threat prediction → machine learning · Decision support → rational agents · Report summarisation → generative AI · Human oversight → responsible AI"}],
 examAnswer:`<p><strong>10 marks — Discuss AI applications in modern society along with associated risks.</strong> Structure: (a) 4–5 domains with a concrete application each — healthcare (diagnosis, monitoring), finance (UPI fraud detection, algorithmic trading), education (personalised learning), agriculture (precision farming), transport (Google Maps, Tesla Autopilot). (b) For each, a benefit and a limitation. (c) A risks section grouped into three: <em>technical</em> (hallucination, black-box opacity, malfunction), <em>societal</em> (job displacement, inequality, misinformation and deepfakes, surveillance), <em>governance</em> (accountability, regulation, concentration of power). (d) Close with mitigation: human oversight, explainability, responsible-AI practices and regulation such as the EU AI Act.</p>`,
 mistakes:["Listing twenty risks with no grouping. Group them (technical / societal / governance) — structure earns marks.",

]},

{id:"m2t1", title:"Problem Solving Agent and Problem Formulation", type:"theory",
 priority:"high", marks:[5], src:"Chpt 2 slides; class notes 27/7",
 tags:["problem formulation","goal formulation","state space","problem solving agent"],
 learn:`<p>A <strong>problem-solving agent</strong> decides what to do by finding a <em>sequence of actions</em> that leads to a desirable state, used when no single action will do.</p>
<div class="note"><span class="note-t">Definition</span><strong>Problem solving</strong> is the way in which an agent finds a sequence of actions that achieves its goals, when no single action will do.</div>
<h4>The three phases</h4>
<div class="fx">Formulate → Search → Execute</div>
<h4>Structure of a problem-solving agent</h4>
<ol>
<li><strong>Goal state</strong> — what counts as success.</li>
<li><strong>Action</strong> — what the agent can do.</li>
<li><strong>Goal formulation</strong> — deciding which goal to pursue, based on the current situation and the performance measure.</li>
<li><strong>Problem formulation</strong> — deciding what actions and states to consider, given a goal.</li>
</ol>
<div class="note tip"><span class="note-t">Why problem formulation matters</span>The class notes underline this: <strong>we formulate the problem <em>in order to search</em>.</strong> A search algorithm cannot run until the problem has been reduced to states, actions, an initial state and a goal test.</div>
<h4>Components of a well-defined problem</h4>
<ul>
<li><strong>Initial state</strong> — where the agent starts.</li>
<li><strong>Actions / operators</strong> — what can be done in each state.</li>
<li><strong>Transition model</strong> — the state resulting from doing an action.</li>
<li><strong>Goal test</strong> — whether a state is a goal. <em>There can be multiple goal states.</em></li>
<li><strong>Path cost</strong> — a numeric cost for each path.</li>
</ul>
<p><strong>State-space representation</strong> = initial state + all states reachable from it by any sequence of actions.</p>`,
 understand:`<p>The whole of Module 2 is: turn a messy real problem into a graph, then run a graph algorithm on it. Problem formulation is the "turn it into a graph" step, and it is where marks are lost, because students jump straight to drawing the search tree.</p>
<p>Write the five components as a labelled list every single time. Even if the numerical goes wrong afterwards, the formulation earns marks on its own.</p>`,
 examples:[],
 examAnswer:`<p><strong>5 marks — Explain problem formulation with an example.</strong> Define problem solving (finding a sequence of actions to achieve a goal when no single action suffices). State the three phases: formulate, search, execute. List the five components of a well-defined problem — initial state, actions, transition model, goal test, path cost — then instantiate all five for one example (water jug or 8-puzzle). Note that there can be multiple goal states.</p>`,
 mistakes:["Giving the goal state but no goal <em>test</em>. With multiple goal states you must state the test, not one state.",
 "Skipping path cost. It is what makes 'optimal' meaningful later.",
 "Confusing goal formulation (choosing the goal) with problem formulation (choosing states and actions)."]},

{id:"m2t2", title:"State-Space Representation — Water Jug and Missionaries–Cannibals", type:"numerical",
 priority:"high", marks:[5,10], src:"class notes 27/7",
 tags:["water jug","missionaries","cannibals","state space","numerical","formulation"],
 concept:"Represent a puzzle as a state vector, define legal operators on it, then list a sequence of states from the initial state to a goal state.",
 formula:"State = (x, y)  where x, y are the current contents of each jug",
 formulaNote:"There is no algebraic formula here — the 'formula' is the state representation. Choosing a good state vector is the whole skill.",
